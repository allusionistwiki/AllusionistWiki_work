episode: ch5166
created: '2026-10-19'
status: pending_merge
entities:
- canonical_target: '[[E_term_地獄への堕天]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5166_地獄への堕天_defines_不可逆性_p10
        quote: 一度『人ではない』と定められて地獄に降りたなら、もう一度ラベルを貼り替えられない限りもう二度と地上には戻ってくることができない。
        locator: {}
        spoiler_after: ch5166
  first_appearance_candidate: true
- canonical_target: '[[E_char_ソルダ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5166_ソルダ_other_最大の難関_p104
        quote: 「異界の悪魔――まことの名を持たないという異質さの塊。いかなる伝承にも登場したことのない名無しの怪物。僕はいつかその最強の悪魔と対決し、勝利しなければならない」
        locator: {}
        spoiler_after: ch5166
      - event_ref: E_ch5166_ソルダ_threatens_竜神信教信徒_p13
        quote: 「どうした、それとも戦ってここで死に花を咲かせるのが望みか！ いいだろう、それならばこの松明の騎士が相手となろう。戦士の本懐を遂げるがいい。戦えぬ者を巻き添えにしながら！」
        locator: {}
        spoiler_after: ch5166
      - event_ref: E_ch5166_ソルダ_other_難民の保護指示_p17
        quote: 「地獄へ堕ちていけ！ そしてジャッフハリムの帝都を目指すんだ！ セレクティフィレクティとレストロオセなら難民を無下にはしないだろう。さあ行け、走れ！
          振り返らずに、地上の事を忘れて生きろ！」
        locator: {}
        spoiler_after: ch5166
      - event_ref: E_ch5166_ソルダ_says_自己への批判_p22
        quote: 「偽善、欺瞞、自己満足――わかってはいるんだけどね」
        locator: {}
        spoiler_after: ch5166
      - event_ref: E_ch5166_ソルダ_other_竜神信徒の将来_p30
        quote: 「さて、どうだろうね。竜神を崇める彼らは火竜メルトバーズのことも良く敬うだろう。その点では大丈夫だろうけれど――」
        locator: {}
        spoiler_after: ch5166
      - event_ref: E_ch5166_ソルダ_reveals_隠していた名前_p57
        quote: 「ああ、いいよ。僕が自分で隠していたんだからね。名前の一部だから嘘は吐いていないけれど――ソルダ＝ルセス・アルスタ＝アーニスタだなんて長いだろう？
          普段はソルダ・アーニスタで通してる。いっそソルダと呼び捨てにしてくれても構わないよ」
        locator: {}
        spoiler_after: ch5166
      - event_ref: E_ch5166_ソルダ_has_property_探索者資格_p73
        quote: 「ほとんど仕込み――流石に大機竜が出てくるとは想定外だったけれど。それと、探索者っていうのは本当だよ。内緒だけど、これでも正式な探索者資格を持っているんだ。かなり前に姉さんと一緒に試験を受けてね」
        locator: {}
        spoiler_after: ch5166
      - event_ref: E_ch5166_ソルダ_other_アズーリアの青さ_p78
        quote: 「君には青がよく似合うね。青は素敵な色だ。そして白も。それらのイメージを呼び起こしてくれる、冬の季節が待ち遠しいよ」
        locator: {}
        spoiler_after: ch5166
      - event_ref: E_ch5166_ソルダ_confesses_英雄としての決意_p95
        quote: 「予言にある試練を全て乗り越えて、僕は必ず彼女に巡り会う。だから僕は戦い続ける。英雄として、松明の騎士として」
        locator: {}
        spoiler_after: ch5166
    symbolic:
      observations:
      - event_ref: E_ch5166_ソルダ_has_property_残酷な慈悲_p19
        quote: ソルダの言葉はどこまでも残酷で――しかし彼に許された範囲の中での、精一杯の慈悲なのだと思えた。
        locator: {}
        spoiler_after: ch5166
    action:
      observations:
      - event_ref: E_ch5166_ソルダ_activates_長槍の炎_p3
        quote: ソルダは決然とした面持ちで長槍を振りかざした。その穂先に、炎が灯される。
        locator: {}
        spoiler_after: ch5166
      - event_ref: E_ch5166_ソルダ_gives_小さな花_p47
        quote: 流石に憤慨してそっぽを向いた私に、謝罪の声と共に一輪の花が差し出される。
        locator: {}
        spoiler_after: ch5166
      - event_ref: E_ch5166_ソルダ_stops_アズーリアの敬礼_p55
        quote: けれどソルダ・アーニスタ卿は柔らかい声のままで私の行為を制止した。
        locator: {}
        spoiler_after: ch5166
  first_appearance_candidate: true
- canonical_target: '[[E_org_竜神信教信徒]]'
  entity_type: organization
  aspects:
    action:
      observations:
      - event_ref: E_ch5166_竜神信教信徒_other_ソルダの宣言_p11
        quote: ソルダの冷酷な宣言に、竜神信教の信徒たちは様々な反応を見せた。怯え、困惑、敵意、思索――もはや地上に彼らの生きる場所は無い。最後に逃げ込んだこの場所にまで槍神教の追撃は及んだのである。
        locator: {}
        spoiler_after: ch5166
      - event_ref: E_ch5166_竜神信教信徒_flees_地上_p20
        quote: やがて、短い話し合いを終えた竜神信教の信徒たちは走り去っていった。ソルダの言葉通りに、振り返らず。
        locator: {}
        spoiler_after: ch5166
  first_appearance_candidate: true
- canonical_target: '[[E_char_アズーリア]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5166_アズーリア_asks_結婚式への招待_p110
        quote: 「良かったら、結婚式には呼んで下さい」
        locator: {}
        spoiler_after: ch5166
      - event_ref: E_ch5166_アズーリア_other_フィリスの正体_p136
        quote: そもそも。この左手に宿った【フィリス】とは一体何なのだ――？ 疑問、疑問、疑問。
        locator: {}
        spoiler_after: ch5166
      - event_ref: E_ch5166_アズーリア_fears_運命による意思の歪曲_p155
        quote: 嫌、嫌、嫌だ！ 怖かった。自分の意思が、自分の運命が強引にねじ曲げられてしまうなんて嫌だ。
        locator: {}
        spoiler_after: ch5166
      - event_ref: E_ch5166_アズーリア_says_神のみぞ知る_p32
        quote: 「結果は、神のみぞ知る、ということですか」
        locator: {}
        spoiler_after: ch5166
      - event_ref: E_ch5166_アズーリア_other_試練の背景_p69
        quote: 「わざと隠してたんだって。実は君の噂は聞いてたんだよ。あの第一魔将の適合者が現れたってね。それで、実際に見てみたくなったんだ。そしたら竜骨の森で竜神信教に動きがあるって言うじゃないか。なら任務と一緒に君を試してしまえと考えたんだ」
        locator: {}
        spoiler_after: ch5166
    action:
      observations:
      - event_ref: E_ch5166_アズーリア_other_記憶の空白と捏造_p129
        quote: 私の脳に、心に、アストラル体に書き込まれた呪文の羅列。極めて複雑で高度な記憶の捏造と認識の操作。
        locator: {}
        spoiler_after: ch5166
      - event_ref: E_ch5166_アズーリア_other_敬礼_p54
        quote: 私は花を受け取る際に籠手に包まれた右手を胸に当て、敬礼をしようとした。
        locator: {}
        spoiler_after: ch5166
  first_appearance_candidate: true
- canonical_target: '[[E_relation_アズーリア,ソルダ]]'
  entity_type: relationship
  aspects:
    relationship:
      observations:
      - event_ref: E_ch5166_アズーリア,ソルダ_other_修道騎士としての出会い_p115
        quote: それが私、アズーリア・ヘレゼクシュとソルダ・アーニスタの出会い。修道騎士として一歩を踏み出す直前の一幕。残っている確かな記憶。
        locator: {}
        spoiler_after: ch5166
  first_appearance_candidate: true
- canonical_target: '[[E_char_少年フィリス]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5166_少年フィリス_appears_闇の中の幻影_p140
        quote: それは少年。フラベウファのような三角の耳は白く、その美貌は輝かんばかり。しかし、どうしようもなくその少年はおぞましかった。
        locator: {}
        spoiler_after: ch5166
      - event_ref: E_ch5166_少年フィリス_has_property_獅子の鬣_p149
        quote: けれど私には、彼を取り巻くアストラルの鬣（たてがみ）が見えた。ああ、彼はどうしようもなく獰猛だ。少年は、獅子だった。
        locator: {}
        spoiler_after: ch5166
      - event_ref: E_ch5166_少年フィリス_transforms_左手の闇と右手の光_p172
        quote: 少年の左手が吸い込まれそうな闇に、右手が眩いほどの光に変貌していく。
        locator: {}
        spoiler_after: ch5166
    speech:
      observations:
      - event_ref: E_ch5166_少年フィリス_promises_運命的な再会_p152
        quote: 「ずっと昔、君は僕に会いに来てくれた――これから会いに来てくれる。運命が僕たちを引き合わせようとしているのが感じられるよ。いつか、僕たちは巡り会う」
        locator: {}
        spoiler_after: ch5166
    action:
      observations:
      - event_ref: E_ch5166_少年フィリス_activates_呪文オー_p168
        quote: 「遡って、【オー】」 同じ呼び声、異なる名前。その聞いたこともないたった一つの音が、フィリスの対極なのだとどうしてか理解できてしまって、私は恐怖に震えた。
        locator: {}
        spoiler_after: ch5166
      - event_ref: E_ch5166_少年フィリス_saves_アズーリアの意識_p173
        quote: 柔らかい闇と光が私ごとフィリスを包み込んで、そのまま上へ、上へと運んでいく。そうして私の意識はゆっくりと薄れ、浮上し、そして覚醒した。
        locator: {}
        spoiler_after: ch5166
  first_appearance_candidate: true
- canonical_target: '[[E_char_少年]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5166_少年_other_集団への合流_p15
        quote: ソルダの言葉に、大機竜に搭乗していた少年が何かを言い返そうとした。しかし、すぐ傍で自分を支えている少女を見て、決意を固めたように唇を引き結ぶ。一度だけ強くソルダを睨み付けて、それから少女と共に集団の方へ向かう。
        locator: {}
        spoiler_after: ch5166
    visual:
      observations:
      - event_ref: E_ch5166_少年_appears_少女_p2
        quote: 大機竜から少女の手を借りて這いだした少年が、弱々しいながらも戦意を宿したままの瞳でこちらを睨み付けた。
        locator: {}
        spoiler_after: ch5166
  first_appearance_candidate: true
- canonical_target: '[[E_char_フラベウファ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5166_フラベウファ_other_ソルダ_p26
        quote: 毒づきながらも、フラベウファの口調はどこか明るい。己のあるじを心底から誇り、敬愛するような声の調子が、外見上の年相応に可愛らしく感じられる。
        locator: {}
        spoiler_after: ch5166
      - event_ref: E_ch5166_フラベウファ_other_クナータ_p41
        quote: 「くすくす、クナータ様から聞いていた通り、中々面白い方ですね」
        locator: {}
        spoiler_after: ch5166
  first_appearance_candidate: true
- canonical_target: '[[E_char_ソルダ,フラベウファ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5166_ソルダ,フラベウファ_other_アズーリアの発言_p35
        quote: まさにその時、ソルダとフラベウファの二人がもの凄い勢いで吹き出して、揃って肩を揺らしていた。私は何がそんなに可笑しいのかわからずに狼狽する。
        locator: {}
        spoiler_after: ch5166
  first_appearance_candidate: true
- canonical_target: '[[E_item_小さな花]]'
  entity_type: item
  aspects:
    visual:
      observations:
      - event_ref: E_ch5166_小さな花_has_property_青と白の調和_p51
        quote: ソルダが私に差し出したのは青と白が綺麗に調和した小さな花。
        locator: {}
        spoiler_after: ch5166
  first_appearance_candidate: true
- canonical_target: '[[E_term_花の受領]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5166_花の受領_defines_試験合格条件_p53
        quote: これを受け取れば私は試験の合格となる。
        locator: {}
        spoiler_after: ch5166
  first_appearance_candidate: true
- canonical_target: '[[E_char_松明の騎士ソルダ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5166_松明の騎士ソルダ_other_異獣化宣言_p6
        quote: 「松明の騎士の名に於いて宣言する。君たちは今この瞬間から人ではなく異獣となった。勢力変更の直後であるため、即座の攻撃はしないものとする。あのヲルヲーラにだって文句は言わせない。さあ、転移門へ向かい地獄へ渡るがいい！」
        locator: {}
        spoiler_after: ch5166
  first_appearance_candidate: true
- canonical_target: '[[E_term_敵味方識別呪術]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5166_敵味方識別呪術_requires_三人の権能者_p8
        quote: この地上と地獄の戦いで、敵味方を識別する呪術を行使できるのは三人だけだ。
        locator: {}
        spoiler_after: ch5166
  first_appearance_candidate: true
- canonical_target: '[[E_motif_松明の騎士フォグラント,冬の魔女コルセスカ]]'
  entity_type: motif
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5166_松明の騎士フォグラント,冬の魔女コルセスカ_defines_英雄譚と悲恋_p83
        quote: 松明の騎士フォグラントと冬の魔女コルセスカ。火竜メルトバーズを地獄の奥底に氷漬けにして封印した二人の英雄譚。そして、悲恋の物語でもある。
        locator: {}
        spoiler_after: ch5166
  first_appearance_candidate: true
- canonical_target: '[[E_term_運命の恋人たち]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5166_運命の恋人たち_promises_聖なる結婚_p87
        quote: 絶対なる聖女の予言で、運命の恋人たちは聖なる結婚を約束されている。
        locator: {}
        spoiler_after: ch5166
  first_appearance_candidate: true
- canonical_target: '[[E_char_ヲルヲーラ,ソルダ,ベアトリーチェ]]'
  entity_type: character
  aspects:
    name:
      observations:
      - event_ref: E_ch5166_ヲルヲーラ,ソルダ,ベアトリーチェ_has_property_識別権限_p9
        quote: すなわち、審判である翼猫ヲルヲーラ、上方勢力の頂点たる松明の騎士ソルダ、下方勢力の元帥たる迷宮の主セレクティフィレクティ――ベアトリーチェ。
        locator: {}
        spoiler_after: ch5166
  first_appearance_candidate: true
