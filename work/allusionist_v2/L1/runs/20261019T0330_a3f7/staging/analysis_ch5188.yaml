- kind: mystery
  name: MY_マロゾロンドの真意と誘導の全貌
  note: マロゾロンドがアズーリアをガルズへの頼みを誘導した件について、サリアは「都合のいい助言」と疑うが、マロゾロンドは「己の意思を伝える事を誘導というのならそうだね」と返答し、具体的な悪意の有無や範囲が曖昧にされている。
  quotes:
  - quote: 状況を打開するための、都合のいい助言。選択肢の提示は、他の選択肢を隠し、切り捨てることでもある。もし、味方の顔をした支援者が意図的にアズーリアを破滅に導いたのだとしたら――サリアはぎり、と歯ぎしりした。
    paragraph: p145-p147
    quote_verified: true
  - quote: 「己の意思を伝える事を誘導というのならそうだね。けれど、そんなのは誰だってしていることだよ。言葉を用いる者ならば誰だって」
