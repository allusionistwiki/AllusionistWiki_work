- kind: mystery
  name: MY_マリーの逃走と魔導書の行方
  note: マリーがサリアに仕留め損ねられ、首級のようなものを抱えながら転移門で逃走。所有権を奪われた黒い魔導書も彼女を追って浮遊している。マリーの今後の行動と魔導書の帰趨が未回収。
  quotes:
