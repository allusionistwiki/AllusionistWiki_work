- kind: mystery
  name: MY_blank_period_memory
  note: 妹を失った後からフィリス宿すまでの記憶が空白であり、そこに「呪文」による捏造が存在する事実。この期間に何が起きたのか。
  quotes:
  - quote: '確かだったはずの記憶が、揺らいでいく。

      疑問に思う事すら無かった、空白の期間。

      何故か不自然な思い出とも認識ともつかない『この期間は空白ではなく何らかの思い出が存在する』という何だ、これは、文字列――違う、これは呪文だ。'
