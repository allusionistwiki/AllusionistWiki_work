        locator: {}
        spoiler_after: ch5189
  first_appearance_candidate: true
- canonical_target: '[[E_char_ハルベルト]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5189_ハルベルト_breaks_禁戒_p11
        quote: ハルベルトは、静かに禁戒を破る。
        locator: {}
        spoiler_after: ch5189
      - event_ref: E_ch5189_ハルベルト_uses_心話_p15
        quote: '【心話】による言葉が響く。

          異界の神秘を参照した、知らぬ者には意味が通らぬ幻想のアリュージョン。'
        locator: {}
        spoiler_after: ch5189
      - event_ref: E_ch5189_ハルベルト_finds_基本法則の扉_p27
        quote: '命そのものを削り取って、世界を構成する緻密な秩序――その背後に存在する硬質な基本法則を見つけ出す。

          それはまるで扉だった。'
        locator: {}
        spoiler_after: ch5189
      - event_ref: E_ch5189_ハルベルト_breaks_錠_p29
        quote: '開けてはならない、封じられた大扉。

          ハルベルトは迷うことなく錠を破壊して、更なる禁忌へと踏み込んでいく。'
        locator: {}
        spoiler_after: ch5189
      - event_ref: E_ch5189_ハルベルト_other_運命と事実_p32
        quote: 'そして改変する。

          書き換える。

          運命を――そして事実を。

          過去に遡り歴史を塗り替えて事象を語り直す。'
        locator: {}
        spoiler_after: ch5189
      - event_ref: E_ch5189_ハルベルト_makes_幻想の創造_p36
        quote: '交換可能な現実を、交換不可能な神秘へと。

          あらゆる価値から隔絶した、唯一無二の『ほんとう』を――けっして確かには存在できない、有り得ざる幻想を創造する。'
        locator: {}
        spoiler_after: ch5189
      - event_ref: E_ch5189_ハルベルト_uses_フィリスの力_p66
        quote: 瞬間、ハルベルトの左右非対称の耳に宿っていたフィリスが無彩色の光を放ち、なによりも速く、音や光すら置き去りにして意味だけを世界に届けていく。
        locator: {}
        spoiler_after: ch5189
      - event_ref: E_ch5189_ハルベルト_other_呪術信号_p88
        quote: 禁呪を発動したハルベルトは、約束通りに遠く離れた場所にいる二人に連絡を行った。即時に空間を渡っていく呪術信号。
        locator: {}
        spoiler_after: ch5189
    speech:
      observations:
      - event_ref: E_ch5189_ハルベルト_says_謝罪の反復_p197
        quote: 'ごめんなさい、ごめんなさい、ごめんなさい――許される事など無いと知っていても、口に出さずにはいられないというように。

          何度も何度も、終わりのない謝罪が繰り返される。'
        locator: {}
        spoiler_after: ch5189
      - event_ref: E_ch5189_ハルベルト_thinks_先生としての記憶_p5
        quote: キュトスの姉妹が三十四番――あの懐かしい黒百合宮で、ハルベルトたちは彼女を先生と呼んでいた。
        locator: {}
        spoiler_after: ch5189
      - event_ref: E_ch5189_ハルベルト_says_決意の言葉_p51
        quote: 「アズーリアを、マリーを、取り戻す――絶対にっ」
        locator: {}
        spoiler_after: ch5189
      - event_ref: E_ch5189_ハルベルト_thinks_言葉の重要性_p54
        quote: '自分たちには言葉しかない。

          そうすることでしか届かない瞬間がある。'
        locator: {}
        spoiler_after: ch5189
      - event_ref: E_ch5189_ハルベルト_remembers_マリーの喪失_p56
        quote: あの避けがたい別離の時――失われた尊い日々の終わりに、奇跡はハルベルトに舞い降りた。その結果としてマリーという少女は永遠に失われた。
        locator: {}
        spoiler_after: ch5189
      - event_ref: E_ch5189_ハルベルト_says_心の中の謝罪_p9
        quote: 'だからハルベルトは、心の中だけでごめんなさいと呟いた。

          言葉にすれば、決意が揺らぐような気がしたから。'
        locator: {}
        spoiler_after: ch5189
    visual:
      observations:
      - event_ref: E_ch5189_ハルベルト_has_property_漆黒の血_p21
        quote: ハルベルトの全身から流れ出した漆黒の血が彼女の周囲を取り巻き、複雑に絡み合って立体的な幾何学模様を作り出す。
        locator: {}
        spoiler_after: ch5189
      - event_ref: E_ch5189_ハルベルト_says_落涙_p24
        quote: 'ハルベルトは落涙する。

          黒い血を黒玉の瞳から滝のように零していく。'
        locator: {}
        spoiler_after: ch5189
  first_appearance_candidate: true
