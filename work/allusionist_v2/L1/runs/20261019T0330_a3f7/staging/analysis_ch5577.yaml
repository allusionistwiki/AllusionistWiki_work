- kind: theme
  theme: 「血の宿命」を超えて自由意志で行動する者の存在は、既存の権力構造（クロウサー）に対する決定的な挑戦となる。
  weight: 0.7
  quotes:
  - quote: ある意味では、これも血の宿命と呼べるものかもしれない。だが、青年の佇まいからは決然とした意志が感じられる。彼は血族の代表者ではあるが、同時に『同胞を守りたい』という自由意志によってこの場所にいるのだ
    paragraph: p86-p88
    quote_verified: true
  - quote: ルールに則った堂々たる勝利。クラウビューラはロードデンドロンの挑むような視線に応じるしかなかった。
    paragraph: p91-p92
    quote_verified: true
  note: リーナが「血の恩恵」で上位を取ったことと対比され、ロードデンドロンの努力と意志が権力者（巨人）を黙らせるという構造がある。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 世界は記述（テクスト）そのものであり、記述されることで存在が定義・判定され、権力が行使される。
  weight: 0.6
  quotes:
  - quote: 全てが文字として記述される世界では、存在するもの全てがインクとなりペンにもなりうる。
    paragraph: p2
    quote_verified: true
  - quote: 答案用紙がクラウビューラという記述から切り出されたテクストそのものである以上、四人の受験者は試験官と口頭で問答していたに等しい。
    paragraph: p11
    quote_verified: true
  note: 世界設定（メタフィクション）としての一貫性。試験という行為が単なる知識確認ではなく、「記述による存在証明・判定」であることの主題。
  proposed_by:
    kind: agent
