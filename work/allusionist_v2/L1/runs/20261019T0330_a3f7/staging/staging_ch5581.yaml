- canonical_target: '[[E_term_チッセ]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5581_チッセ_other_聖なる光冠の呪文_p109111
        quote: '対抗して、チッセもまた苦しみながら呪文を詠唱した。

          「其は痛みの王より賜りし聖なる光冠。不遜なる僭主に天啓の威光を示せ！」

          凄まじく強力な呪文が来る。'
        locator: {}
        spoiler_after: ch5581
      - event_ref: E_ch5581_チッセ_other_痛み_p1214
        quote: '「痛い、痛い痛い痛い～！　なんなのこいつら～！」

          無邪気であどけない顔立ちが苦痛に歪み、涙目で少女姿の巨人が叫ぶ。痛みで飛び跳ねたせいで、羽飾りのついたぶかぶかのブーツが脱げそうだった。'
        locator: {}
        spoiler_after: ch5581
      - event_ref: E_ch5581_チッセ_says_カーインとクロウサーの繋がり_p32
        quote: 「せっかくカーインとクロウサーの繋がりを確定させたのに、結局はこっちの植物想（フローラ）も力づくで奪おうってわけ～？　強欲は身を滅ぼすよ～」
        locator: {}
        spoiler_after: ch5581
      - event_ref: E_ch5581_チッセ_other_対抗呪文静謐と大破壊_p4753
        quote: '極めて高精度の対抗呪文『静謐』が発動。

          沈黙をもたらす『呪文を打ち消す呪文』により、菌糸歌速が停止して箒が減速。

          更には空間が圧縮され、膨大な量の自然の至るところで大破壊が発生。

          『宙を舞う土砂崩れ』となって四方八方からロードデンドロンを襲う。'
        locator: {}
        spoiler_after: ch5581
    visual:
      observations:
      - event_ref: E_ch5581_チッセ_other_禽獣草木_p34
        quote: チッセの内包する世界から禽獣草木が溢れ出し、ロードデンドロンとキノコ人たちに襲い掛かる。無秩序な生命の濁流に巻き込まれてはたまらないとリーナたちは退避するが、ただひとりロードデンドロンだけは真っ直ぐに前進した。
        locator: {}
        spoiler_after: ch5581
      - event_ref: E_ch5581_チッセ_other_五色の精霊と異次元_p45
        quote: チッセの頭部が蠢き、複数の封じられた眼が白、朱、藍、灰、黒の五色の精霊を同時召喚し、頬や肩に開いた複数の口が耳慣れない呪文を同時詠唱。拘束から解き放たれた胴体は既に密林と砂漠と草原と海洋と山脈と洞窟を混交させた異次元で世界を塗り替えつつある。空間が歪曲し、無限に距離が開いていくことでどれだけ加速しようがロードデンドロンはチッセに辿り着くことができない。
        locator: {}
        spoiler_after: ch5581
  first_appearance_candidate: true
- canonical_target: '[[E_term_パーン]]'
  entity_type: terminology
  aspects:
    visual:
      observations:
      - event_ref: E_ch5581_パーン_attacks_リーナ殺意の向き_p112113
        quote: '嫌な予感がしてリーナが回避行動を取ろうとした瞬間、何故かパーンの殺意がこちらに向いていることに気付く。巨大な腕が帯電し、恐るべき呪力が収束。

          どさくさに紛れて彼を背後からマルガリータが狙っていることに気付いているはずなのに、それよりも優先すべき敵がいると言わんばかりの行動だった。'
        locator: {}
        spoiler_after: ch5581
    speech:
      observations:
      - event_ref: E_ch5581_パーン_other_ズトームストーム_p157159
        quote: '「心を縛る鎖を砕き、小鬼の王ごと踏み潰せ！　自由を謳え、ズトームストーム！」

          猛々しい宣言と共に光線がリーナの真横を掠めていく。'
        locator: {}
        spoiler_after: ch5581
  first_appearance_candidate: true
- canonical_target: '[[E_term_クラウビューラ]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5581_クラウビューラ_other_ズフィールスフィール開門_p117131
        quote: '呪いに縛られた巨体から雲を切り離し、凝縮された水の塊を人型に集約させて戦場を高みから俯瞰、両手を突き出して広域に呪力を拡散させていった。

          「天頂の観測はここに成った。奈落は不要。門を開けズフィールスフィール」

          まずクラウビューラが呪文を唱えた。天空が轟き、黄金の円盤が無尽蔵の霊体をその場に集め、輝く雷光を纏った神の兵士たちが次々に召喚されていく。'
        locator: {}
        spoiler_after: ch5581
      - event_ref: E_ch5581_クラウビューラ_other_空の民全般_p9296
        quote: '「く、おのれ、この呪文は」

          雲の巨人が苦しそうに呻く。

          クラウビューラだけではない。特定種族を狙い撃ちにした呪詛は、この場にいる空の民全てを大幅に弱体化させるためのものだ。

          リーナ、パーン、クラウビューラがよろめく。'
        locator: {}
        spoiler_after: ch5581
    action:
      observations:
      - event_ref: E_ch5581_クラウビューラ_other_警戒態勢_p2426
        quote: 'なぜか動きがやや鈍い。雲の巨人はまるで何かを警戒するように、先ほどの呪文竜の攻撃時にも別方向を気にしていた。

          いつの間にか巨体の位置は動いており、チッセとロードデンドロン、パーンとマルガリータを分断する壁となっているクラウビューラが、そこから離れた場所で見ているリーナをちらりと見た。'
        locator: {}
        spoiler_after: ch5581
    visual:
      observations:
      - event_ref: E_ch5581_クラウビューラ_other_単眼宝珠_p8690
        quote: 'クラウビューラの精密な『空圧』によってリーナの肩から単眼宝珠が吹き飛ばされていた。粉々に破壊されながらも役割を終えたそれは満足そうに空に散る。

          きらきらと金属片が散って、宝珠の中から水晶片が零れた。

          紫の光が、妖しく情報の雲間に消えていく。'
        locator: {}
        spoiler_after: ch5581
  first_appearance_candidate: true
- canonical_target: '[[E_term_ガルズ]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5581_ガルズ_teaches_召喚の性質_p132136
        quote: 'すぐそばのガルズが金の瞳を通して教えてくれた。あれもまた死霊術の一種であると。

          （再現は無理っぽいけど、もしかしてガルズと一緒なら干渉くらいできる？）

          ガルズにもあの超呪術は使えない。だが、二人ならあるいは。'
        locator: {}
        spoiler_after: ch5581
  first_appearance_candidate: true
- canonical_target: '[[E_term_リーナ]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5581_リーナ_other_ノートにメモを取る_p137141
        quote: '喪失しかけていた自信と挫けそうな心を強引に奮い立たせ、甘えを捨てろとばかりに目を見開いた。今できることを探して己に言い聞かせる。

          （学び取れ。ノートにメモを取れ。世界に記されたテキストを読め。この世界は、きっとそれができるように作られている）

          なぜかリーナは、それが自分にとっての正しい道だと確信していた。'
        locator: {}
        spoiler_after: ch5581
      - event_ref: E_ch5581_リーナ_other_レイシズム変数ヴァリアブル中身すかすかの間抜け雲_p7275
        quote: '「レイシズム変数（ヴァリアブル）――『中身すかすかの間抜け雲』」

          リーナが唱えた呪文によって。

          透明な、世界を伝播する悪意のような呪文が空間に浸透していく。'
        locator: {}
        spoiler_after: ch5581
      - event_ref: E_ch5581_リーナ_thinks_戦いの意味_p9
        quote: ここで試練の形式を無視して戦いに持ち込む意味をリーナは見いだせない。
        locator: {}
        spoiler_after: ch5581
      - event_ref: E_ch5581_リーナ_other_ジーゼロとロードデンドロンの計画_p98
        quote: （苦しい。身体から力が抜けてく。でもこれ、このタイミングってことはつまり、最初からジーゼロとロードデンドロンはこの状況を狙ってたってこと？）
        locator: {}
        spoiler_after: ch5581
    visual:
      observations:
      - event_ref: E_ch5581_リーナ_observes_レコードゴースト緑天主、レルプレア_p194207
        quote: 'リーナは自分を取り巻く世界が脈動したのを感じた。

          「あれは、新しいレコードゴースト？」

          半透明の亡霊の姿が見える。

          原因は不明ながら、リーナは現れた女性のレコードゴーストに見覚えがあった。

          幼馴染にしてティリビナの巫女エストとそっくりな面差し。

          「緑天主、レルプレア？」'
        locator: {}
        spoiler_after: ch5581
      - event_ref: E_ch5581_リーナ_observes_マイコニドキノコ人_p20
        quote: そこにはたくさんの箒に乗った何者かがひしめいている。巨大なキノコに手足が付いた珍しい種族。マイコニドだとかキノコ人だとか呼ばれている隠花系ティリビナ人たちだった。
        locator: {}
        spoiler_after: ch5581
      - event_ref: E_ch5581_リーナ_other_睥睨_p2628
        quote: 'どうしてなのか、見えないはずの天空からの睥睨をリーナは確かに感じ取ることができていた。

          （なんだろう。何か別の方を見てる？）'
        locator: {}
        spoiler_after: ch5581
  first_appearance_candidate: true
- canonical_target: '[[E_term_雷光の兵士たち]]'
  entity_type: terminology
  aspects:
    visual:
      observations:
      - event_ref: E_ch5581_雷光の兵士たち_attacks_マルガリータ_p142
        quote: 必死に戦場を凝視するリーナを避けて、輝く霊体が空を駆け巡る。雷光の兵士たちはなぜかマルガリータを集中して狙い、その動きを制限しようとしていた。結果的に助けられたパーンは背後を見ないままリーナの方を凝視している。
        locator: {}
        spoiler_after: ch5581
  first_appearance_candidate: true
- canonical_target: '[[E_term_チッセとロードデンドロン]]'
  entity_type: terminology
  aspects:
    visual:
      observations:
      - event_ref: E_ch5581_チッセとロードデンドロン_other_呪文の激突_p145154
        quote: '「レーカスレ～カ～」

          「タークスターク」

          響きが重なり、歌が互いを上書きして否定しあった。チッセの蒼白色（ペイルブルー）の稲妻と、ロードデンドロンの黄緑色（エレクトリックライム）の稲妻が激突。

          二人同時に叫ぶ。

          「落っこちた！」

          真正面から落雷を発生させたことにより、呪文が規定するルール同士が反発。爆発的に繁茂する植物と、世界そのものを否定する邪視殺しが拮抗する。'
        locator: {}
        spoiler_after: ch5581
  first_appearance_candidate: true
- canonical_target: '[[E_term_呪文竜の群れ]]'
  entity_type: terminology
  aspects:
    visual:
      observations:
      - event_ref: E_ch5581_呪文竜の群れ_appears_天の御殿の下方_p1516
        quote: '呪文竜の群れが現れたのは天の御殿の遥か下方からだ。

          藍色の海にも無限の蒼穹にも思える情報の層は文字化けした雲に覆い隠されてその全容を掴むことさえできない。'
        locator: {}
        spoiler_after: ch5581
  first_appearance_candidate: true
- canonical_target: '[[E_char_ヴァージル少年の生首]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5581_ヴァージル少年の生首_appears_グロートニオン結晶_p160169
        quote: '振り返ると、背後にはいつの間にか得体の知れないものが出現していた。

          水晶だ。それも、占術情報端末によく用いられるグロートニオン結晶。

          太陰（イルディアンサ）で高度に発達した呪術素材とその関連技術だが、奇妙なことにその内側に何かが入っている。

          少年の生首だった。

          異様なほどに美しく、それでいておぞましい容貌。

          左耳が半妖精（アヴロノ）、右耳が兎人（ルナリアン）という友人のハルベルトとよく似ているが左右が反転した特徴が、どこか不吉に思えてならない。'
        locator: {}
        spoiler_after: ch5581
  first_appearance_candidate: true
- canonical_target: '[[E_term_ヴァージル]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5581_ヴァージル_attacks_パーン_p172176
        quote: '「あは、パーンさん、みっけ。また遊べるね？」

          「しつこい。さっさと消えろ、ヴァージル」

          リーナを放置して水晶の中の少年と巨大な機械腕が激突。

          そこにクラウビューラが操る雷光英霊兵（エインヘリヤル）たちが殺到し、ダメージを負いながらもパーンに追撃を仕掛けようとするマルガリータ。'
        locator: {}
        spoiler_after: ch5581
  first_appearance_candidate: true
- canonical_target: '[[E_term_レコードゴースト]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5581_レコードゴースト_appears_新たな試練_p207208
        quote: '緑天主、レルプレア？」

          乗り越えるための大いなる記録。

          新たな試練が、その場に現れようとしていた。'
        locator: {}
        spoiler_after: ch5581
  first_appearance_candidate: true
- canonical_target: '[[E_relation_ロードデンドロン]]'
  entity_type: relationship
  aspects:
    speech:
      observations:
      - event_ref: E_ch5581_ロードデンドロン_other_植物想フローラ_p22
        quote: '「言った通りだ。こちらの植物想（フローラ）の味はどうかな？」

          ロードデンドロンの挑発的な言動に、じっと様子を見ていたクラウビューラまでもが動く。'
        locator: {}
        spoiler_after: ch5581
    visual:
      observations:
      - event_ref: E_ch5581_ロードデンドロン_activates_菌輪門_p3641
        quote: '「滅びはしない。呪文が永久に響くように」

          小気味よく呟き、歌うように加速する。

          ロードデンドロンの箒に纏わりついた大量のキノコと、粘ついた黒い影が活性化するように呪力を放出。ティリビナ人の前方、空中に幾つもの菌輪門が出現。'
        locator: {}
        spoiler_after: ch5581
      - event_ref: E_ch5581_ロードデンドロン_fights_チッセとクラウビューラ_p47
        quote: 'ロードデンドロンは破格の召喚士である。

          それでも探索者などに用いられる格付けでは『英雄級』の第六階梯止まりだろう。

          対するチッセとクラウビューラはまず間違いなく『巨人級』の第七階梯。

          歴然とした力の差がある。'
        locator: {}
        spoiler_after: ch5581
  first_appearance_candidate: true
- canonical_target: '[[E_term_菌輪門]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5581_菌輪門_functions_as_加速と可読_p41
        quote: 箒と乗り手が輪の門をくぐるたび、知らない世界の歌が響いてテキストベースの世界に速度をもたらす。エキゾチックエフェクト。理解できない未知こそが呪術だという前提が、知りたいという動機に牽引されて加速と可読で読者を前に押し出す。
        locator: {}
        spoiler_after: ch5581
  first_appearance_candidate: true
- canonical_target: '[[E_item_無言の膜]]'
  entity_type: item
  aspects:
    visual:
      observations:
      - event_ref: E_ch5581_無言の膜_other_情報の遮断と植物成長停止_p5960
        quote: '大地と大気の境界に※※がある。

          テキスト空間を埋め尽くすような『無言の膜』が貼られて、何らかの情報的な遮断が発生している。それが原因だろうか。チッセの世界で勢いよく繁茂していたはずの全ての植物は成長を止めていた。'
        locator: {}
        spoiler_after: ch5581
  first_appearance_candidate: true
- canonical_target: '[[E_term_ロードデンドロンとキノコ人]]'
  entity_type: terminology
  aspects:
    visual:
      observations:
      - event_ref: E_ch5581_ロードデンドロンとキノコ人_other_窒息状態_p6263
        quote: 'ロードデンドロンや配下のキノコ人たちが、呼吸できない状態に陥っていた。

          空気があるはずなのに、だ。'
        locator: {}
        spoiler_after: ch5581
  first_appearance_candidate: true
- canonical_target: '[[E_item_単眼宝珠]]'
  entity_type: item
  aspects:
    visual:
      observations:
      - event_ref: E_ch5581_単眼宝珠_appears_リーナの三角帽子_p81
        quote: いつの間にかリーナの三角帽子の中から現れた単眼宝珠が小さな機械端子を節足のように動かして、魔女の肩に移動。静かに呪文を紡ぎながらリーナの口を借りて呪いを撒き散らす。
        locator: {}
        spoiler_after: ch5581
  first_appearance_candidate: true
