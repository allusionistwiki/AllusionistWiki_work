- kind: mystery
  name: MY_garuzu_incomplete_understanding
  note: リーナはガルズの世界を完全には理解しておらず、「しょせんは他者の世界」とされている。この「断絶」が、ガルズ号（機甲箒）の性能制限や、将来の悲劇的な裏切りの要因となる可能性。
  quotes:
  - quote: 彼女がガルズの力を借りて展開した世界は完全ではない。しょせんは他者の世界。リーナが見たガルズの世界は、理解には程遠い。
    paragraph: p130-p132
    quote_verified: true
  expected_payoff: ガルズの魂の完全なサルベージ失敗、あるいは機甲箒暴走・機能不全のトリガー。
