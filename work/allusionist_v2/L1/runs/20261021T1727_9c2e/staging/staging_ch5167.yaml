episode: ch5167
created: '2026-10-21'
status: pending_merge
entities:
- canonical_target: '[[E_term_肥満]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5167_肥満_defines_貧困病_p10
        quote: 'ところで、肥満は貧困病である。

          食料自給が一定水準以上の社会においては、むしろ中流以下や貧困層で肥満は増加する。'
        locator: {}
        spoiler_after: ch5167
  first_appearance_candidate: true
- canonical_target: '[[E_char_群青様]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5167_群青様_other_葡萄酒_p106
        quote: けぷ、とフードから音を漏らして、影の触手を伸ばして葡萄酒を啜る。触手は吸管（ストロー）のようにも使えるのだ。
        locator: {}
        spoiler_after: ch5167
      - event_ref: E_ch5167_群青様_gives_棒付き飴_p79
        quote: '卓の反対側から歩いてきた小さなその人物は、黒衣の中から自分の体積以上の棒付き飴を取り出す。円盤状に渦を巻いている、私たち共通の大好物だ。

          「ぺろぺろ、するー？」

          「あ、はい、いただきます」'
        locator: {}
        spoiler_after: ch5167
      - event_ref: E_ch5167_群青様_other_食用奉仕種族_p90
        quote: '黒衣の内部から無数の影の触手が伸びると、恐るべき速度でトントロポロロンズと羊の少女を巻き取って、闇の中に引き摺り込んだ。

          ばき、ごき、という何かが咀嚼されている音と「わー」「がっ、ぎっ、あり、がとうー」という朗らかな声が小さくなっていく。'
        locator: {}
        spoiler_after: ch5167
    speech:
      observations:
      - event_ref: E_ch5167_群青様_other_魅了呪術_p118
        quote: フードにかかりそうでかからない指先からいやいやするように逃れながら、甲高い鳴き声で「きゃー」だの「やー」だのと庇護欲をそそる簡易呪文を唱える。罪の無い魅了呪術で、周囲の人々も望んでかかっている。
        locator: {}
        spoiler_after: ch5167
    visual:
      observations:
      - event_ref: E_ch5167_群青様_has_property_高齢_p98
        quote: '夜の民にして司教という高い地位にある群青様は、確か私の村の長老と並ぶほどに高齢であったはずだ。

          これは霊長類もそうだけど、私達は老いと共に身体が小さくなり、赤子に近付いていく。老齢の夜の民は掌に乗るくらいの大きさとなるのが普通だ。'
        locator: {}
        spoiler_after: ch5167
  first_appearance_candidate: true
- canonical_target: '[[E_char_出席者]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5167_出席者_other_群青様_p107
        quote: 'その姿を周囲の人々はなにやら優しい目で見つめている。

          「ああ、私も可愛い夜の民に生まれたかった」

          「ほっほっほ、そんなに油断していると悪戯をしたくなってしまいますなあ」

          言いながら、丸い指を伸ばしてフードをめくろうとする。'
        locator: {}
        spoiler_after: ch5167
    visual:
      observations:
      - event_ref: E_ch5167_出席者_has_property_肥満体型_p9
        quote: まあるい天使ドルネスタンルフもかくやというような突きだしたお腹。たっぷりと脂肪を蓄えた顎。食卓を囲むお歴々は揃いも揃って恰幅が良く、小さな私は明らかに場違いだった。
        locator: {}
        spoiler_after: ch5167
  first_appearance_candidate: true
- canonical_target: '[[E_org_聖職者]]'
  entity_type: organization
  aspects:
    action:
      observations:
      - event_ref: E_ch5167_聖職者_other_安い鶏肉_p11
        quote: 清貧を体現する聖職者たちは安い鶏肉などを主食とするため（大神院は肉食を禁ずる戒律などは定めていない）、必然的に栄養が偏る。野菜は肉よりも高価なのだ。
        locator: {}
        spoiler_after: ch5167
  first_appearance_candidate: true
- canonical_target: '[[E_item_食卓]]'
  entity_type: item
  aspects:
    visual:
      observations:
      - event_ref: E_ch5167_食卓_has_property_野菜の少なさ_p12
        quote: この食卓には、野菜の類が驚くほど少ない。豆と青菜が小さなお皿に盛り合わせてあるくらい。後は肉、魚、合成食材、そして槍を模した細長いパン。ただし、その調理方法はこの上なく精錬されている。
        locator: {}
        spoiler_after: ch5167
      - event_ref: E_ch5167_食卓_has_property_彩り豊か_p2
        quote: 長い食卓の上に並べられた数々のご馳走は彩り豊か。味や匂いだけでなく目まで楽しませてくれる。
        locator: {}
        spoiler_after: ch5167
  first_appearance_candidate: true
- canonical_target: '[[E_char_ハルベルト]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5167_ハルベルト_asks_アズの分裂_p126
        quote: 'と、左右の袖が引っ張られる。

          「アズ、対抗して分裂して」

          「そうだぞ、先程の分をここで取り返すんだ。英雄の芸を見せてやれ」'
        locator: {}
        spoiler_after: ch5167
      - event_ref: E_ch5167_ハルベルト_says_天使の諍い説話_p204
        quote: '「きっと意地悪な三角は、黒衣の行進を邪魔してしまった。妨げる事が許されないその歩みを止めたゆえに、上位者からの罰を受けたの」

          「博識ですな。流石は魔女殿。よく神話を勉強していらっしゃる。天使マロゾロンドと天使ペレケテンヌルの諍いの逸話ですな？」'
        locator: {}
        spoiler_after: ch5167
      - event_ref: E_ch5167_ハルベルト_helps_アズ_p76
        quote: '大神院の神官たちに招かれての昼食会という恐るべき試練に付き添ってくれている頼もしい味方だが、この時ばかりは私に優しくはしてくれないらしい。

          いや、わかっている。ここで食べなければ私の立場は悪化する。だから、二人が私の足をぐりぐりと踏んづけているのは優しさゆえの行為なのだ。'
        locator: {}
        spoiler_after: ch5167
    action:
      observations:
      - event_ref: E_ch5167_ハルベルト_other_アズの足_p72
        quote: '逡巡していると、両足が同時に踏みつけられた。

          両隣の二人が、私に早く食べろと急かしているのだった。

          右隣に座っているのは、私と似たような黒衣を身に纏ったハルベルト。

          左隣に座っているのは、いつもの白衣ではなく礼装のラーゼフ。'
        locator: {}
        spoiler_after: ch5167
  first_appearance_candidate: true
- canonical_target: '[[E_term_健康]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5167_健康_defines_豊かな者の特権_p13
        quote: '健康は豊かな者の特権である。

          ゆえに肥え太った彼らの肉体はまさに貧しき聖職者としての正しき姿なのであるが、しかしながら緩みきった表情やだらしない口調は、その印象を良くないものにしてしまっている。'
        locator: {}
        spoiler_after: ch5167
  first_appearance_candidate: true
- canonical_target: '[[E_term_夜の民]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5167_夜の民_has_property_分裂の習性_p130
        quote: '分裂はただの習性である。芸扱いはやめていただきたい。

          ――確かに、小さい頃は何度も分裂していた。

          なにぶん幼い頃の話なので記憶が曖昧だが、難しいことが考えられなくなった私達は家の中のあちらこちらに散らばり、妹のビーチェをとても困らせたらしい。'
        locator: {}
        spoiler_after: ch5167
      - event_ref: E_ch5167_夜の民_defines_沈黙の美徳_p7
        quote: 「夜の民だから」で通ってしまうのがありがたかった。私達にとって沈黙は美徳である。雄弁も美徳だけど。
        locator: {}
        spoiler_after: ch5167
      - event_ref: E_ch5167_夜の民_defines_お菓子の絶対性_p85
        quote: 目上の人からのお菓子を拒否することはできない。そもそも私に差し出されたお菓子を受け取らないという選択肢は無い。たとえ毒入りだろうが爆発しようがお菓子は受け取る。これは夜の民の誇りにかけて、絶対だ。
        locator: {}
        spoiler_after: ch5167
  first_appearance_candidate: true
- canonical_target: '[[E_item_アズ]]'
  entity_type: item
  aspects:
    speech:
      observations:
      - event_ref: E_ch5167_アズ_other_ビーチェの影_p133
        quote: 'どうやらビーチェの影があまりにも居心地がいいものだから、自然に入り込んでしまうようなのだ。

          ――もしかしたら、まだ妹の影の中には私の一部が入り込んでいるかもしれない。'
        locator: {}
        spoiler_after: ch5167
      - event_ref: E_ch5167_アズ_has_property_自我の固定_p135
        quote: そもそも、私くらいの年齢だともう自我が固まっているから、分離するとしてもせいぜい二つまでだ。それも影と実体とを切り分けるとか、そっくりな双子とかの形をなぞって別行動させるとかが関の山。それでも使い魔の才能に秀でていれば長いあいだ離れたままでも平気の上、呪術の負担を分担して常人では不可能なほどの高位呪術を発動したりできるらしいけれど――。
        locator: {}
        spoiler_after: ch5167
      - event_ref: E_ch5167_アズ_other_隔意_p16
        quote: '隔意。断絶。『違う』という意識。

          良くないことだとわかってはいるのだけれど――考えずにはいられない。'
        locator: {}
        spoiler_after: ch5167
      - event_ref: E_ch5167_アズ_fears_自分の影響_p182
        quote: '黒衣の中で、私は小さく震える。きっと顔は真っ青だ。

          大変な事になっていた。

          私は一昨日の夜、ミルーニャを苦しめていたあの守護天使、旧世界の遺物たる古き神に超極大呪文を撃ち込んでしまった。滅ぼすまではいかなかったが、大きな手傷を与えて世界の果ての果てまで吹き飛ばしてやったのだ。'
        locator: {}
        spoiler_after: ch5167
      - event_ref: E_ch5167_アズ_other_英雄としての適格性_p195
        quote: 'ミルーニャは、不死の再生能力を失った。その事を、恨んではいないだろうか。

          ペイル達は大怪我をして、キール隊は私を残して全滅した。

          あのシナモリ・アキラだってどこかで不幸になっているかもしれない。

          できそこないの英雄。'
        locator: {}
        spoiler_after: ch5167
      - event_ref: E_ch5167_アズ_other_通過儀礼_p64
        quote: '私という、成り上がりの新参者、祭り上げられた英雄が、彼らの流儀に馴染めるのかどうかを試されているのだ。いわばこれは通過儀礼（イニシエーション）。

          ここで食べなければ、私は異物と見なされる。'
        locator: {}
        spoiler_after: ch5167
      - event_ref: E_ch5167_アズ_other_感情移入_p69
        quote: 'だって喋ってる。動いてるし目とかつぶらだし可愛いし――。

          正直に言えば、食べるより仲良くお話とかをしてみたいのだけれど、多分複雑な受け答えとかはできないのだろう。それでも、ふるまいの『それっぽさ』に私は感情移入してしまうし、愛玩してみたくなってしまう。

          心が苦しい。'
        locator: {}
        spoiler_after: ch5167
    visual:
      observations:
      - event_ref: E_ch5167_アズ_other_智神の盾_p138
        quote: そして私の両脇を槍神教の九大騎士修道会の一つ、智神の盾に所属する二人が固めているということは、つまり私の立ち位置が松明の騎士団ではなく智神の盾に近しいと公言しているに等しい。
        locator: {}
        spoiler_after: ch5167
    action:
      observations:
      - event_ref: E_ch5167_アズ_other_食事_p6
        quote: そんな感情を黒衣の中に隠しながら、私は黙々と食事をする。
        locator: {}
        spoiler_after: ch5167
      - event_ref: E_ch5167_アズ_other_空魚の切り身_p8
        quote: 空魚の切り身に粉をまぶして焼いたものを口に運ぶ。かりかりとした食感と柔らかで温かな内側の美味しさ、そして空魚特有の、内側に閉じ込められた蕩けるような流体味。一流の食材と一流の調理。
        locator: {}
        spoiler_after: ch5167
  first_appearance_candidate: true
- canonical_target: '[[E_org_松明の騎士団]]'
  entity_type: organization
  aspects:
    speech:
      observations:
      - event_ref: E_ch5167_松明の騎士団_other_武力と啓蒙_p139
        quote: 序列第八位の天使、松明を掲げる者ピュクティエトは武力や啓蒙を象徴する。古来より異種族や異民族を平定し、『異教徒』を葬ってきた『聖絶』の守護天使だ。
        locator: {}
        spoiler_after: ch5167
  first_appearance_candidate: true
- canonical_target: '[[E_relation_智神の盾]]'
  entity_type: relationship
  aspects:
    speech:
      observations:
      - event_ref: E_ch5167_智神の盾_other_知識と教化_p140
        quote: 対して、序列第六位の天使、神々の図書館の管理者ラヴァエヤナは知識を司る。こちらは内部の『異端』を裁く法の番人であり、また異質なものを排除するのではなく教化して槍神教内部に取り込む宣教を象徴してきた。
        locator: {}
        spoiler_after: ch5167
      - event_ref: E_ch5167_智神の盾_other_アズ_p146
        quote: '私は智神の盾が独力で成功させた初の異獣憑きだ。

          その事もあって、松明の騎士団の英雄とされている私は、同時に智神の盾の成果物でもある。私の処遇を巡っての政治ゲームは一つの巡節（季節）が過ぎる程に長引き、そのあいだ私はずっと地下に幽閉されていたというわけだ。'
        locator: {}
        spoiler_after: ch5167
  first_appearance_candidate: true
- canonical_target: '[[E_char_神官]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5167_神官_other_アズとペイル_p152
        quote: '「――しかしですな、余り勝手な動きをされても困るのですよ。ほら、一昨日などは私闘まがいのことまでしたとか」

          「あの無頼漢のペイルとその取り巻きどもが負傷したという話ですな。幸いあの野人――ごほん、イルス司祭の治療が的確だった為に一命は取り留めたという報告は受けていますが、流石にあのような問題行動は慎んで貰いたいものです」'
        locator: {}
        spoiler_after: ch5167
      - event_ref: E_ch5167_神官_other_祈りの届かなさ_p174
        quote: '「一昨日と言えば、何故かペレケテンヌル様への祈りが届かなくなったという報告が相次いでおりまして――」

          「おお、私も聞き及んでおります。かの守護天使のお力を借りる神働術が全く使えなくなってしまったと。今日になってようやく微弱ながらも使えるようになったらしいですが」'
        locator: {}
        spoiler_after: ch5167
  first_appearance_candidate: true
- canonical_target: '[[E_char_ラーゼフ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5167_ラーゼフ_other_アズの行動_p158
        quote: 「あれはあくまで訓練の一環であり、その結果として戦力の向上に成功しております。ここにいるハルベルト殿の教導官としての腕前は確か。一昨日だけで我らが英雄の階梯とフィリスとの同調率は上昇しております」
        locator: {}
        spoiler_after: ch5167
  first_appearance_candidate: true
- canonical_target: '[[E_char_ペイル]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5167_ペイル_other_身体能力向上_p162
        quote: 「修道騎士ペイルは生体装甲の超回復によって以前よりも身体能力が向上しており、また修道騎士ナトに関しましても我々智神の盾が開発している新型の呪動装甲――いえ、【神働装甲】の試作実験機の搭乗者として最高の適性を示すことが確認されております。これは手足という重要な器官が失われたからこその新たな資質です」
        locator: {}
        spoiler_after: ch5167
  first_appearance_candidate: true
- canonical_target: '[[E_term_臨死体験]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5167_臨死体験_other_霊体強度_p164
        quote: '重傷を負ったことで高い霊感を獲得することはよくあることだ。物質的身体が損なわれれば、それを補うように呪的な霊体、アストラルの身体が強度を増していく。

          臨死体験が人を強くする。これは多くの再現性の無い実験によって実証されている、非科学的知見である。'
        locator: {}
        spoiler_after: ch5167
  first_appearance_candidate: true
- canonical_target: '[[E_item_白い長方形]]'
  entity_type: item
  aspects:
    visual:
      observations:
      - event_ref: E_ch5167_白い長方形_appears_as_トントロポロロンズ_p20
        quote: '白い長方形が、皿の上でぷるぷると揺れていた。

          自然界では他に類を見ない直角。柔らかく白く淡泊な味、らしい。'
        locator: {}
        spoiler_after: ch5167
  first_appearance_candidate: true
- canonical_target: '[[E_item_フィリス]]'
  entity_type: item
  aspects:
    speech:
      observations:
      - event_ref: E_ch5167_フィリス_enables_天使解体_p200
        quote: 'もし滅ぼしていたら、この世界からペレケテンヌル系の神働術が消滅していたのかもしれない。

          あまりにも不遜な考え。けれど、何故か私にはそれが出来るような気がした。

          フィリスなら、天使や神すら解体できる。

          私のこれは、一体何なのだろう。'
        locator: {}
        spoiler_after: ch5167
  first_appearance_candidate: true
- canonical_target: '[[E_char_天使マロゾロンド]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5167_天使マロゾロンド_other_序列五位_p213
        quote: '「ああなるほど。そんな話もありましたな。そのせいで天使ペレケテンヌルは天使マロゾロンドに必ず道を譲るようになったとか」

          「そもそも序列からして二位と五位ですからな」

          「ははは、うっかり黒衣の天使の前に出てきてしまったというわけですか。天上の衝突事故とあれば、もうこれは天災のようなものだ。甘んじて受け入れる他あるまい」'
        locator: {}
        spoiler_after: ch5167
  first_appearance_candidate: true
- canonical_target: '[[E_item_トントロポロロンズ]]'
  entity_type: item
  aspects:
    speech:
      observations:
      - event_ref: E_ch5167_トントロポロロンズ_says_食べてほしい_p22
        quote: '「大丈夫だよ、怖くないよ。さあ、ぼくを食べて」

          ぷるぷると震えながら、白い長方形が喋る。'
        locator: {}
        spoiler_after: ch5167
    name:
      observations:
      - event_ref: E_ch5167_トントロポロロンズ_is_made_of_トント樹の実_p25
        quote: '一昨日――あの怒濤の一日を思い出す。パレルノ山に生息する長方形の害獣トントロポロンを呪文の小試験で蒸発させたこと。

