        quote: 'それは魔女の宿業だった。

          血も凍るようなおぞましき怪物。

          氷血の魔女。'
        locator: {}
        spoiler_after: ch5083
  first_appearance_candidate: true
- canonical_target: '[[E_item_燃える骨槍]]'
  entity_type: item
  aspects:
    action:
      observations:
      - event_ref: E_ch5083_燃える骨槍_attacks_頭部_p9
        quote: 俺の右腕は融解し、破砕され、防御は貫通されて燃える骨槍はそのまま俺の頭部に迫り。
        locator: {}
        spoiler_after: ch5083
  first_appearance_candidate: true
