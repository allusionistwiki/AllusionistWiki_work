      observations:
      - event_ref: E_ch5083_双頭の蛇_transforms_炎の侵襲_p29
        quote: だが炎は双頭の蛇に変ずると、熱量が転じた赤い頭部が光とぶつかり合い、呪力が転じた緑の頭部が俺の精神を蹂躙すべくその体内に潜り込んでいく。
        locator: {}
        spoiler_after: ch5083
  first_appearance_candidate: true
- canonical_target: '[[E_item_形のない蛇]]'
  entity_type: item
  aspects:
    action:
      observations:
      - event_ref: E_ch5083_形のない蛇_other_転生者の基盤_p32
        quote: 形のない蛇は義肢が砕け散った後の、右腕の断端から体内に侵入し、俺の脳へと到達すると主たるキロンの命令を忠実に実行した。すなわち、俺を転生者たらしめるものを破壊する。
        locator: {}
        spoiler_after: ch5083
  first_appearance_candidate: true
- canonical_target: '[[E_char_蛇]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5083_蛇_other_アプリケーション群_p34
        quote: '【サイバネ義肢の制御OS】を。

          【サイバーカラテ道場】を。

          【弾道予報Ver2.0】を。

          【ノーペイン】を。

          【Doppler】を。

          【夢枕Guard】を。

          【残心プリセット】を。

          【盤外の夜】を。

          【七色表情筋トレーニング】を。'
        locator: {}
        spoiler_after: ch5083
      - event_ref: E_ch5083_蛇_other_Emotional-Emulator_p43
        quote: そして【Emotional-Emulator】を。
        locator: {}
        spoiler_after: ch5083
      - event_ref: E_ch5083_蛇_other_記憶情報_p46
        quote: 'この世界に来てから半年間で記録した情報が喰われていく。

          アズーリアたちと出会ってから必死で覚えた単語。音声と画像記録に関連付けて管理した単語表。短い時間ながらもカインに教わり、必死に記録した基礎的な言葉。カインの最後の言葉。その直後にかけてくれた、アズーリアの救いの言葉。一番大切な記憶が虫喰いになっていく。'
        locator: {}
        spoiler_after: ch5083
      - event_ref: E_ch5083_蛇_other_前世の記憶_p52
        quote: 'そして、俺を転生者たらしめているのは前世の記憶だ。

          だから燃える。出生管理センターが炎上し、幼児期の保育担当官の顔が黒い染みになり、養育試験に合格して心底からの笑顔を向けてくる俺の遺伝子提供者――父と母が消えて無くなる。学生時代が消滅した。成長に合わせて換えていった歴代の義手が砕かれていく。非常時に備えて擬似的なマニュアル制御を学んだ経験も忘れていく。時間を忘れて読みふけった本が全て焚書された。ゲームや映画といった趣味、打ち込んでいたサイバーカラテの胴着もまとめて喰い尽くされる。電脳フォールアウト、猥雑な街並み、隔離された子供達、積層都市新宿、拡張空間の亡霊が集う中央線、原始仏教系が一番肌にあった思想ドラッグ、常備していた昆虫粉末の携行食、信仰メーカーの営業だったという【あの人】、全て、なにもかも、消えて無くなる。'
        locator: {}
        spoiler_after: ch5083
  first_appearance_candidate: true
- canonical_target: '[[E_item_右腕]]'
  entity_type: item
  aspects:
    action:
      observations:
      - event_ref: E_ch5083_右腕_other_呪術防御_p5
        quote: 右腕が独りでに動き、投げ放たれた呪術を防御したのだ。おそらく奇跡などではなく、【残心プリセット】による遅延動作が予定よりさらに遅れて行われたのだろう。
        locator: {}
        spoiler_after: ch5083
      - event_ref: E_ch5083_右腕_breaks_防御貫通_p7
        quote: その防御は一瞬だけ死の瞬間を遅らせることしかできなかった。何故なら、強大な呪術の威力に右腕は耐えきれなかったからだ。
        locator: {}
        spoiler_after: ch5083
  first_appearance_candidate: true
