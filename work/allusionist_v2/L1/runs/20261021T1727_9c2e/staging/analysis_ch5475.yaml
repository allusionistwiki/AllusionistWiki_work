  note: 聖女クナータが攫われたことによる「確かな未来の喪失」と、ユディーアに降りかかる「死より苛酷な呪い」の内容。
  quotes:
  - quote: そして恐らく、死よりも苛酷な呪いをその身に受けることになるのだ。
    paragraph: p244
    quote_verified: true
  - quote: こうして聖女クナータは攫われた。確かな未来は、この瞬間に失われたのだ。
