- kind: mystery
  name: MY_artius_origin
  note: アルティウスが名乗った「ガロアンディアンを破壊する新しい亜竜王」という称号の由来と、彼の顔にある「一枚の鱗」の正体。
  quotes:
  - quote: 俺の名はアルティウス。ガロアンディアンを破壊スる、新シい亜竜王の名前だ
    paragraph: p260
    quote_verified: true
  - quote: ただ一枚の鱗、それが顔の肉と完全に一体化して頭部を形作っている。
    paragraph: p270
    quote_verified: true
  expected_payoff: アルティウスがユディーアの親族（ディスケイム家）であること、あるいは亜竜族の変異種であることの確認。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_cain_truth
  note: カーインの正体と、「テテリビナ」の名を継承した真の人物との関係。麗人が「正しい結末」と呼んだ行動の意味。
  quotes:
  - quote: それはどちらかと言えば『正しい』結末で、ユディーアにとってみれば望ましいとさえ言える結果だと言えた。
    paragraph: p205
    quote_verified: true
  - quote: その名、私が貰い受けよう
    paragraph: p173
    quote_verified: true
  expected_payoff: カーインが偽物であり、麗人が真の血族であること。カーインが消滅（または再生）した後の展開。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_future_recollection_change
  note: 敵勢力が「未来回想」をどのように改変し、この刺客たちを集めたのかという謎。
  quotes:
  - quote: 敵勢力がどのような手段で未来回想を改変したのか、その正体とは、この恐るべき刺客たちをどのようにして集めたのか。何もかもがわからないまま、自分はここで敗北するだろう。
    paragraph: p240
    quote_verified: true
  expected_payoff: 物語の根幹である「時間改変」のメカニズムと敵の戦略の解明。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
