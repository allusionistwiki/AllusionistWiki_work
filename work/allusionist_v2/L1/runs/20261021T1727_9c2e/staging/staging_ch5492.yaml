        locator: {}
        spoiler_after: ch5492
    speech:
      observations:
      - event_ref: E_ch5492_アズーリア_other_アイシャの恩恵_p31
        quote: 「ああ、やっぱり。声でそんな気はしてた。前九槍に助けてもらったし、気にしなくていいですよ。恨んでもいません、むしろ死なずに済んで助かったくらいで」
        locator: {}
        spoiler_after: ch5492
      - event_ref: E_ch5492_アズーリア_other_ミルーニャ_p377
        quote: '空を大きな虫が飛んでいく。

          ここは未知の異世界で、これから先どうなるかはわからない。

          けれど、少なくとも空は晴れている。

          上を見上げることができる限り、私の心はまだ折れたりしない。

          だから大丈夫だ。私は独りじゃ無いんだから。'
        locator: {}
        spoiler_after: ch5492
