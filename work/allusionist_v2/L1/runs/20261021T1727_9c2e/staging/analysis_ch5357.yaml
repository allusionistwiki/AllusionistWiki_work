  object: '[[ME_folklore_bluebeard]]'
  claim: 始祖ディルトーワが妻バーガンディアを塔に閉じ込め、そのために騎士団処刑や王妃の失踪（死）に至る経緯は、シャトル・ペローの「青ひげ」の伝承（禁じられた部屋への立ち入り禁止と残酷な結末）を構造的に模倣している。
  quote: 美貌が翳る様が見ていられないと、ディルトーワはバーガンディアを塔の中に閉じ込めた。何かと国政に口を出してくる妻を黙らせ、自分が竜王国の傀儡ではないと貴族や臣民に証明する意味もあったのだろう。強き夫という自らの在り方を印象づける為、彼はバーガンディアの護衛でありラフディの軍事力の要であった『赤眼騎士団』を残らず処刑した。
