  aspects:
    speech:
      observations:
      - event_ref: E_ch5254_アキラ_asks_ケイト_p11
        quote: 「身勝手なことを！ 元々そちらのミス、そちらの事故ではないのですか！」
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_アキラ_fears_ゾーイとの戦い_p160161
        quote: '正規の訓練を受けた力士相手に、サイバーカラテは本当に戦えるのか？

          感情制御とは関係の無い寒気が背筋から脳にまで届き、全身が震える。'
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_アキラ_says_ケイト_p17
        quote: 「知るか」
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_アキラ_thinks_生存の理由_p1923
        quote: '本来生きていてはいけない――赦されない。

          誰かの犠牲の上に生きている存在。

          そんなことは知っている。知っていて、今も生きている理由は一つだ。

          それをこいつらが――トリシューラの敵が口にしたことが、とにかく気にくわない。'
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_アキラ_remembers_転生の仕組み_p4
        quote: '知識として瞬時に出てきた、俺に関する事実。

          再構成型の転生は、要するに情報構造体のカットアンドペーストだ。'
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_アキラ_other_ケイトの提案_p54
        quote: 「断る」
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_アキラ_other_重複転生_p7
        quote: 自覚は無くとも、俺という転生者は二つの世界に転生し、二通りの人生を送ることになってしまった――どうやら俺が遭遇したトラブルというのは、想定していたよりも遙かに面倒なものらしい。
        locator: {}
        spoiler_after: ch5254
    action:
      observations:
      - event_ref: E_ch5254_アキラ_observes_想定外の事実_p2
        quote: 想定外の事実を突きつけられた俺は、一瞬だけ思考が真っ白になった。
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_アキラ_other_ちびラズリ_p250257
        quote: '懐の中で何かが蠢いているのを感じて、それを取り出す。

          普段使っている、カード型端末の一枚を。

          俺のカード型端末の一つから飛び出した悪霊レゴン――グロテスクな臓物に顔の部位をくっつけたような怪物の姿が漆黒の靄につつまれたかと思うと、次の瞬間にはその姿が変化していた。

          少しだけ丸々とした、デフォルメされた二頭身。

          ヴェールによって顔が覆い隠されて金眼が控え目に輝く、それは美しくも愛らしい店員さんの姿だった。'
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_アキラ_other_ちびラズリ_p273276
        quote: '俺は決然と誘惑を振り払って――振り払えない？！ なんだこれ、魅了の呪術にでもかかったというのか俺は。永遠につついていたい。

          状況を無視した過剰な欲求が生存を脅かすと判断され、霜が首全体を覆い尽くしたところでようやく我に帰る。'
        locator: {}
        spoiler_after: ch5254
  first_appearance_candidate: true
- canonical_target: '[[E_char_ケイト]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5254_ケイト_activates_静謐_p110115
        quote: 'その場にいたサイバーカラテユーザーたちにおびただしい数の呪文が絡みつくと、既に彼ら彼女らに付与されていた呪術の効果が消滅していった。

          それは広範囲に向けて放たれた対抗呪文、【静謐】。

          あらゆる呪術効果を無効化するその呪文によって、サイバーカラテの心技体を成立させている呪術――とりわけ精神を安定させる各種の呪術が消滅していた。'
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_ケイト_other_アキラ_p13
        quote: ちびセスカの反論に、ケイトは両手を広げてオーバーに仰け反ってみせた。それから軽く謝罪を繰り返す。火に油を注ぐような態度だったが、ケイトは構わずに言葉を繋いでいく。
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_ケイト_other_情報アップロード_p165167
        quote: 'あらゆる経路からサイバーカラテ道場に流れ込んでくる力士についての情報、情報、情報。それらは有益なものではなく、当然のように全てが誤情報だ。

          撹乱目的のノイズ情報爆撃だった。圧倒的な量の『それらしい』誤情報にフィルタリングが突破されてしまう。'
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_ケイト_other_対抗呪文_p97108
        quote: '（では証明しようか。これがその弱さ――脆弱性というものだよ）

          右腕で感じ取ったケイトの呪力は、およそ個人が生み出せる域とは思えないほどの巨大さだった。

          実行された呪文が光を放ち、意味を成していく。

          それは、一瞬で完了した。'
        locator: {}
        spoiler_after: ch5254
    name:
      observations:
      - event_ref: E_ch5254_ケイト_other_妖精使い_p124
        quote: 彼は、妖精使いと呼ばれる全く新しいタイプの言語魔術師なのだ。
        locator: {}
        spoiler_after: ch5254
    speech:
      observations:
      - event_ref: E_ch5254_ケイト_other_転生保険の経営_p15
        quote: （僕たちもボランティアでやってるわけじゃない。不正な転生はどうにかしないと。いいかな、君は本来生きていてはいけないんだ。そのリソース浪費は誰かを圧迫している。君が納付してくれた保険料を運用し、社員、役員、株主らの利益にしていかなくちゃあいけない。転生設備の維持費だって馬鹿にならない。重複転生で増大したコスト、我が社が損なう社会的信用度のことも考えてくれないかな？）
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_ケイト_other_転生保険の構造_p27
        quote: （そもそも転生保険は赤字が出やすい。需要があってもそれ単体ではコストがかかりすぎる。だからこそブランド化し、ショウビズとして様々な業界と結びつき、付加価値を生み出すことでやっと黒字化することが可能なんだ。それでさえ飽きられつつあり、際だった何かがなければ埋もれていくだけというのが現状だ）
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_ケイト_reveals_アキラの記録発掘_p39
        quote: （だが三ヶ月前、君の記録は発掘された。ヲルヲーラの暴走という不確定要素が影響して、多くの世界にこの世界と君という転生者が認識されたんだ。そして、埋もれている異世界転生コンテンツを紹介して業界を活性化させようとするボランティア――発掘屋の目に留まったわけだね。結果、ほぼ皆無だった君の物語というものに対する注目度が、そこそこ程度には上昇したわけだ）
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_ケイト_other_消去困難の理由_p47
        quote: 「だからまあ、今このタイミングだとあなたを秘密裏に消すのも難しいんだよね。転生設備は厳重に稼動記録がつけられているから、正当な理由も無しに強制停止させることはできない。多世界連合の注目が集まっているこの世界で派手に動いて貴方を『消す』のも難しくなってしまった――昨今は人権派の目があるし、犯罪者への情報凍結なんかも長くてめんどくさい事情聴取ともの凄いお金がかかる現地調査が必要だしね。もちろん本社の負担で」
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_ケイト_asks_アキラ_p52
        quote: （安心して欲しい。僕らはもっと穏当な手段で解決を図ることにしたんだ。だから、このまま大人しくこっちに来てくれないかい？）
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_ケイト_other_実力行使_p60
        quote: （そうか。じゃあ実力行使といこう）
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_ケイト_threatens_アキラ_p9
        quote: （君は既に希望した転生先で二度目の人生を終えている。三度目の人生は、ちょっと契約の範囲外だね。だと言うのに君は権利を主張するのかな？
          貴重なリソースを食いつぶして、空きを待っている人々を押しのけて転生設備を占有し続けるつもり？ それって狡くないかな？）
        locator: {}
        spoiler_after: ch5254
  first_appearance_candidate: true
- canonical_target: '[[E_char_ゾーイ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5254_ゾーイ_other_サイバーカラテユーザー_p149154
        quote: '「惰弱すぎるね。これがサイバーカラテが生む甘え、そして悪だ。くだらないものに依存してないで、ちゃんと本当の姿でかかってきなよ」

          指をくいと曲げて手招きする。

          「そんなふうに殻に閉じこもっているばかりで強くなれるわけがない。ちゃんと現実に向き合って、戦え。私が鍛え直してあげるよ――徹底的にさぁ！」'
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_ゾーイ_other_戦闘方針_p175179
        quote: '「殺しはしないよ。弱い者虐めはしない主義だし、無闇矢鱈と人を死なせたくないんだ。私は常識人で、倫理観がきっちりしてるタイプだからね」

          「ただしヤクザは人ではないので『掃除』はするけどね。身元調査の結果、前職が【殺し屋】だって判明した誰かさんも、まああまり容赦しなくてもいいよね。要するに詐欺師だし。全く、事前の調査で弾いとけっての」'
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_ゾーイ_other_サイバーカラテ_p77
        quote: 「その劣化ジークンドーで力士に勝てるとでも本気で思っている？」
        locator: {}
        spoiler_after: ch5254
    action:
      observations:
      - event_ref: E_ch5254_ゾーイ_kills_公社の呪術師_p177
        quote: 光学干渉呪術で姿を消して背後に接近していた公社所属の呪術師の頭を振り向きもせずに鷲掴みにしてそのまま握りつぶすと、ゾーイはそのまま死骸を投擲。
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_ゾーイ_other_あらゆる攻撃_p186187
        quote: '高位の杖呪術である銃も、怪物を使役する支配者の攻撃も、呪文による意味の操作も、邪視による改変も、全てをまともに受けきっている。

          それでいて平然と相棒と軽口を叩き合う女性スモーレスラーの底知れぬ実力に、周囲の者が一様に気圧される。'
        locator: {}
        spoiler_after: ch5254
  first_appearance_candidate: true
- canonical_target: '[[E_char_カーイン]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5254_カーイン_defeats_クレイ_p202203
        quote: 'カーインと対峙したクレイが、一度もその手刀を振るう事無く膝を突いた。

          目、鼻、口から血を流し、苦悶とも怨嗟ともつかぬ呻きを上げてカーインを睨み付けるが、間合いを詰めた内家拳士はそのままクレイの眉間を貫手で突き、戦いは瞬きもしないうちに終わりを告げた。'
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_カーイン_uses_六淫操手_p208211
        quote: '六淫操手。接触感染だけでなく空気、飛沫、と様々な感染経路から病の素を他者に送り込むという恐るべき呪術的武術の使い手。

          今回の試合形式では多くのカジュアル層への配慮で制限されていた恐るべき絶技は、【変異の三手】の副長を一撃で戦闘不能にするほどのものだったのだ。'
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_カーイン_other_イアテムの水流_p217220
        quote: '天眼石の髪飾りが閃いて邪視避けの呪力がカーインに宿ったかと思うと、両手が円を描いていく。

          磨き上げられた本家本元の技が邪視を受け流してイアテムの水流と激突、相殺する。

          勢いを減じた水流にカーインの指先が突き入れられたかと思うと、透明度の高かった液体に黒々とした汚れが混じる。'
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_カーイン_attacks_ケイト_p225228
        quote: '素早く攻め込んで貫手を放つ。指先が向かうのは、実体の無い数字と文字の列――ケイトが放った呪文の群だった。

          カーインの指先から放たれた複雑怪奇な表意文字の群が呪文の中を逆流していき、ケイトに直撃したのである。'
        locator: {}
        spoiler_after: ch5254
      - event_ref: E_ch5254_カーイン_other_サイバーカラテ道場_p239240
        quote: '続けてカーインは虚空に向かって演武のような動作を行ってみせる。

          「サイバーカラテ道場に『気』を流し込んでセキュリティを強化しておいた。'
        locator: {}
        spoiler_after: ch5254
    speech:
      observations:
      - event_ref: E_ch5254_カーイン_other_セキュリティホール_p230233
        quote: '（なんだこれはっ、ダウンローダ？！ セキュリティが機能していない、管理者権限が勝手に――）

          「経絡秘孔（セキュリティホール）を突いた。この六淫操手が操る風邪（ウィルス）は、情報に対しても有効であると知るがいい」'
