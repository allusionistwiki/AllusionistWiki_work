        quote: 美しい蝶の翅を背から生やした十代前半ほどの年頃の少女が倒れており、威圧的にそれを取り囲む五人の男。いずれも明らかに堅気ではない。
        locator: {}
        spoiler_after: ch5031
    action:
      observations:
      - event_ref: E_ch5031_アキラ_uses_対閃光ゴーグル_p74
        quote: セットで購入した対閃光ゴーグルを事前に付けていた俺だけがこの状況で自由に動けていた。
        locator: {}
        spoiler_after: ch5031
      - event_ref: E_ch5031_アキラ_fights_三報会二番・三番_p76
        quote: 男が転倒。身体をスライドさせるようにしてその隣の二番に掌底打ちを喰らわせる。脇腹を襲う痛みに反射的にうずくまる相手の頭部を上から叩いて落とす。
        locator: {}
        spoiler_after: ch5031
      - event_ref: E_ch5031_アキラ_carries_少年_p78
        quote: 集団の中心で、やはり行動不能に陥っている少年の手を強引に掴み、そのまま駆け出す。強い抵抗にあったのでやむなく肩に担いで走る。
        locator: {}
        spoiler_after: ch5031
  first_appearance_candidate: true
- canonical_target: '[[E_term_少年]]'
  entity_type: terminology
  aspects:
