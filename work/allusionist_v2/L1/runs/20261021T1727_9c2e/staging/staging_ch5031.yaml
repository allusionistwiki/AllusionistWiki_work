      - event_ref: E_ch5031_アキラ_thinks_暴力の境界線_p11
        quote: あの男達が狩る側から狩られる側に転じる、紙一重の一線。だが、まだ超えてはいない。やくざ者らしく、暴力を抑制させながらちらつかせる術に長けているのだろう。
        locator: {}
        spoiler_after: ch5031
      - event_ref: E_ch5031_アキラ_says_介入の予見_p19
        quote: 「――あそこは首領の組織が管理してる店の前だ。三報会の連中がいつまでもたむろしているのを許すとは思えないし、しばらくしたら誰か来るだろう」
        locator: {}
        spoiler_after: ch5031
      - event_ref: E_ch5031_アキラ_conceals_介入への消極性_p24
