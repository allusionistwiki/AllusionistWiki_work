        locator: {}
        spoiler_after: ch5031
      - event_ref: E_ch5031_アキラ_remembers_あの人の癖_p40
        quote: 不意に俺の脳裏に、『あの人に似ている』という言葉がよぎった。どうしてそんなことを思ったのかはわからない。年齢も容姿も全く違うというのに。
        locator: {}
        spoiler_after: ch5031
      - event_ref: E_ch5031_アキラ_thinks_見捨てる性分_p48
        quote: そもそも俺はこういうときに他人を見捨てる人間だ。今までだってそうしてきた。
        locator: {}
        spoiler_after: ch5031
      - event_ref: E_ch5031_アキラ_saves_コルセスカ_p63
        quote: 「コルセスカ、耳を塞いで目を瞑ってこの通りから離れてくれ。合流は初めて会った倉庫」
        locator: {}
        spoiler_after: ch5031
    visual:
      observations:
