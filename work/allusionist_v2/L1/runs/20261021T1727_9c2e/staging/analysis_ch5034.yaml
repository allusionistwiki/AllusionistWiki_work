- kind: theme
  theme: 社会的コンセンサスの脆弱性と暴力による支配
  weight: 0.5
  quotes:
  - quote: 道路は誰のものでもないが、街の体裁を整えるために不可侵であることが暗黙の了解である。往来の妨げだと判断されれば集団で排除される。つまりこれは、俺を短時間で仕留める算段があるからこその荒技だ。
    paragraph: p34
    quote_verified: true
  - quote: これだけの騒ぎを起こしているというのに、襲撃者たちが制裁を加えられることは無い。ここは街路のど真ん中だというのに遠慮など欠片もなかった。
    paragraph: p29
    quote_verified: true
  note: 公共空間である道路が暴力組織によって一時的に支配され、社会規範（暗黙の了解）が容易に無効化される様子は、秩序がいかに脆いものであるかを主題とする。
  proposed_by:
