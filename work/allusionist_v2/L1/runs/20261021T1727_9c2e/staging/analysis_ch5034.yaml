- kind: mystery
  name: MY_Molrek_Sanbikai_Alliance_Reason
  note: 本来敵対しているモロレクと三報会が協力してアキラを襲った理由。単なる殺意を超えた、より大きな計画や共通の目的（例：コルセスカに関する何か）が存在する可能性を示唆。
  quotes:
  - quote: この二つの組織は共に俺を不倶戴天の敵と見定めているものの、それぞれ『上』と『下』ということもあって互いに敵対していた筈だ。協力して俺を襲撃してきたことは一度もない。
    paragraph: p17
    quote_verified: true
  - quote: だが今に限っては、両勢力が同時に攻めてきていた。示し合わせたのか、偶然なのか。俺を殺す為に一時的にでも休戦したのだろうか。
    paragraph: p19
    quote_verified: true
  expected_payoff: 後の章で、両組織の背後にいる真の黒幕や、この世界全体の構造（階層制度）に関する秘密が明かされる契機となる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_Bodyguard_Identity_And_Technology
  note: 用心棒の「立体映像衣裳」は、この世界では一般的でないはずの高度な技術である。彼がどこからその技術を入手したのか、あるいは彼自身が外来者（異世界からの来訪者など）である可能性。
  quotes:
  - quote: 端末が空中に映像を投影する技術と同質のものだろう。立体映像を着るという発想が、この世界に無いというのが既に先入観だった。
    paragraph: p89
    quote_verified: true
  - quote: 一見しただけで、他の有象無象とは格が違うとわかる。
    paragraph: p63
    quote_verified: true
  expected_payoff: 用心棒の正体（過去のキャラクターとの関連、あるいはゲームシステム的な存在）が判明し、物語のメタ構造に関わる重要なヒントとなる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_Akira_Half_Cyborg_Nature
  note: アキラの肉体の大半が人工物であり、脳・脊髄を介さず義肢が動くという設定は、彼の「人間性」や転生時の身体データに関する深い伏線。
  quotes:
  - quote: 右半身と首から上の殆どが人工物である。よって、脊髄反射すら出来ない状況であっても、このような反撃が可能になる。
    paragraph: p148
    quote_verified: true
  - quote: 義肢そのものにマイクロコンピュータを搭載して自律制御させる、脳侵襲型情報機器技術が未発達だった頃の前時代的な発想のアプリケーションだが、緊急時にはこうして役に立つ。
    paragraph: p144
    quote_verified: true
  expected_payoff: アキラの記憶喪失や転生時の経緯、あるいは彼の身体が「ゲームデータ」そのものであるという真実の回収につながる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_Colceska_Power_Limitation
  note: コルセスカが敵を倒しきれず撤退を選択した点。彼女の実力には限界がある、あるいは特定の状況下で能力が制限される条件が存在する可能性。
  quotes:
  - quote: これに加えて俺を倒した男、更に十人以上の刺客を相手にしては、さすがのコルセスカもどうしようもないのではないか。そんなふうに危ぶみつつも、意識が急激に薄れていく。
    paragraph: p170
    quote_verified: true
  - quote: 「撤退します。手荒になりますが、我慢してください」
    paragraph: p163
    quote_verified: true
  expected_payoff: コルセスカの能力の真価や弱点が明かされ、彼女が主人公を助ける際の戦術的な制約が今後の展開に影響する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
