episode: ch5559
created: '2026-10-21'
status: pending_merge
entities:
- canonical_target: '[[E_char_リーナ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5559_リーナ_asks_個我の安定性_p10
        quote: 「確かに凄いとは思うけど、それって混乱しない？　リーダー決めるとかしないと、方針がバラバラになっちゃいそう。ていうかそれ、『個我』の安定は大丈夫だったの？　ほら、小鬼化とか」
        locator: {}
        spoiler_after: ch5559
      - event_ref: E_ch5559_リーナ_says_逆立ちしても無理_p23
        quote: 「言われなくても真似なんかしないよ。ってか逆立ちしても無理だし」
        locator: {}
        spoiler_after: ch5559
      - event_ref: E_ch5559_リーナ_says_逆立ち_p30
        quote: 「逆立ち」
        locator: {}
        spoiler_after: ch5559
      - event_ref: E_ch5559_リーナ_says_冗談がわからない_p36
        quote: 「それ、エンバーディープにも言われました。冗談とはどういう意味ですか？　私にはその概念がわかりません」
        locator: {}
        spoiler_after: ch5559
      - event_ref: E_ch5559_リーナ_other_期待_p50
        quote: 「いやいや。私なんかには無理だってば。お父さまにはこう、『頑張ったけど無理でした～』って感じで許してもらうし。落ち目のゾラを盛り立てるのはお兄ちゃんに頑張ってもらって、私はてきとーに生きていければそれでいいよ」
        locator: {}
        spoiler_after: ch5559
    relationship:
      observations:
      - event_ref: E_ch5559_リーナ_other_当主の座_p187
        quote: '父が死んだ。おまけに兄まで死んだ。

          最悪なことに、弟と妹は幼すぎる。

          姉はとうに嫁入りしており、外から招き入れられた母にゾラを率いる資格は与えられていない。

          次の当主は、自分をおいて他にいない。'
        locator: {}
        spoiler_after: ch5559
    action:
      observations:
      - event_ref: E_ch5559_リーナ_other_逆立ち飛行_p28
        quote: 生徒は言葉を探すように減速し、またがった箒がゆっくりと高度を落としていく。空の上に遮るものはない。ごまかすようにくるんと身体を反転させ、太腿で体を固定しつつ頭を真下に向けた。
        locator: {}
        spoiler_after: ch5559
      - event_ref: E_ch5559_リーナ_other_ミブレルの優しさ_p74
        quote: 'もちろん、リーナにはわかっていた。

          自分はどうしようもなく子供で、ミブレルはどこまでも生徒にとって必要な言葉を与えてくれているだけだということを。'
        locator: {}
        spoiler_after: ch5559
      - event_ref: E_ch5559_リーナ_other_もしもの自分_p87
        quote: それが本当にリーナ・ゾラ・クロウサーと言えるのかはともかく、もしもの歴史、もしもの世界、もしもの自分という空想には夢がある。
        locator: {}
        spoiler_after: ch5559
      - event_ref: E_ch5559_リーナ_other_空想_p93
        quote: 周囲からの『落ちこぼれ』という呪詛によって形作られた『駄目な自分』という強固な自己像で、淡い空想を覆い尽くす。
        locator: {}
        spoiler_after: ch5559
      - event_ref: E_ch5559_リーナ_other_塔_p97
        quote: 最も困難になるはずだった最後の試練から目を背けたリーナは穏やかに自分が越えられるだけの障害を乗り越え、そこそこの魔女として『塔』を卒業することになった。多くの徒弟（アプレンティス）がそうであるように、わずかな期間だけ『名ばかりの姉妹候補生』となって呪術を学び、社会に戻ってその優れた力を役立てていくことになる。
        locator: {}
        spoiler_after: ch5559
    visual:
      observations:
      - event_ref: E_ch5559_リーナ_has_property_ちゃらんぽらんな笑い方_p53
        quote: 'へらへらと、いい加減でちゃらんぽらんな自分をなぞって笑う。

          生き方に染みついた笑い方だった。'
        locator: {}
        spoiler_after: ch5559
  first_appearance_candidate: true
- canonical_target: '[[E_char_ミブリナ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5559_ミブリナ_other_胸の熱さ_p102
        quote: それでも、師の名を分け与えられたことは彼女の胸を熱くさせた。
        locator: {}
        spoiler_after: ch5559
      - event_ref: E_ch5559_ミブリナ_thinks_父への裏切り_p108
        quote: 高名な魔女の教えを受けてなお、ミブリナは最後まで雲を掴むなんて絵空事を実現することはできなかった。父の期待を裏切ってしまった。
        locator: {}
        spoiler_after: ch5559
      - event_ref: E_ch5559_ミブリナ_other_空の諸部族_p135
        quote: 雲上姫ミブレルの薫陶を受けた者として、これからミブリナの名を得た彼女は空の諸部族と相対しなくてはならなかった。血の拡散を狙うクロウサーと多様な種族の仲立ちとなり、『塔』の権威を最大限に利用しつつ、クロウサーがやりすぎないように努め、場合によっては勢力間のいざこざを調停する。
        locator: {}
        spoiler_after: ch5559
      - event_ref: E_ch5559_ミブリナ_other_逃避_p148
        quote: 'なんもやりたくなかった。働きたくなかった。楽しいことを学んだり好ましい人たちと交流したりふらふらと遊んだりして人生の嫌なことと向き合わないままいい感じに歳を取って楽に老後まで人生を満喫したい。

          空を見上げる。風を感じる。飛ぶ想像をする。

          誰の手も届かない場所への逃避。

          気持ちが良くて、俗っぽくて、ありふれた空想。'
        locator: {}
        spoiler_after: ch5559
      - event_ref: E_ch5559_ミブリナ_other_帰らないこと_p155
        quote: '「帰らなければいいのでは？」

          我ながら天才の発想だ。

          責任や血の束縛をすべて『ぽーん』って放り投げればきっと爽快に違いない。そうだ、そうしよう。なんでもっと早く思いつかなかったのだろう。'
        locator: {}
        spoiler_after: ch5559
      - event_ref: E_ch5559_ミブリナ_other_家督継承_p202
        quote: 'こうなってしまえば退路はない。父はきっと必要だからこうしているだけだろう。

          家督を継ごう。家族を守ろう。空っぽでもいい。寄せてくれた期待が嬉しかった。'
        locator: {}
        spoiler_after: ch5559
      - event_ref: E_ch5559_ミブリナ_other_家_p203
        quote: 本当は『帰りたい』のに、きちんと帰らなければリーナはリーナを許せない。子供の自分を押し殺してでも、リーナは生まれ変わったミブリナとして家に帰るべきだ。
        locator: {}
        spoiler_after: ch5559
      - event_ref: E_ch5559_ミブリナ_other_空っぽな人生_p211
        quote: 'もしもの自分。生まれ変わった人生。やりなおしの機会。自由な飛翔。

          そんなものを空想しながら、空っぽな自分として生きていく。

          それがミブリナという魔女の、この人生における結論だった。'
        locator: {}
        spoiler_after: ch5559
    symbolic:
      observations:
      - event_ref: E_ch5559_ミブリナ_has_property_想像の翼_p116
        quote: 空想の中では誰よりも自由で、創作の中では比肩する者はいない。少女の背に生えた想像の翼はクロウサーの誰よりも大きく立派だった。それでも彼女は無価値なままだ。
        locator: {}
        spoiler_after: ch5559
    speech:
      observations:
      - event_ref: E_ch5559_ミブリナ_says_帰りたくない_p129
        quote: '「あーあ、帰りたくないな」

          誰にも届かないつぶやきを、空に向かって放る。'
        locator: {}
        spoiler_after: ch5559
      - event_ref: E_ch5559_ミブリナ_other_新しい人生_p165
        quote: '「よっしゃ行くぞ！　ミブリナ、新しい人生を始めます！」

          宣言は、するだけなら自由だ。'
        locator: {}
        spoiler_after: ch5559
  first_appearance_candidate: true
