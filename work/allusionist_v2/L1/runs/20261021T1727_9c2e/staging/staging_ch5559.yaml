- canonical_target: '[[E_char_シャーネス]]'
  entity_type: character
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5559_シャーネス_has_property_軽い自己像_p17
        quote: シャーネスという小女神にとって、個我や自己などという些事は夢に見る泡沫の幻に等しい。風がそよげばそのままどこまでも飛んでいく、儚い空想。
        locator: {}
        spoiler_after: ch5559
      - event_ref: E_ch5559_シャーネス_defines_因果の無効化_p8
        quote: 全ての結果を『これはこれ』『そういう説もある』『そんな時間軸もあったね』でひっくり返されてはたまったものではない。シャーネスの打倒なくしてルスクォミーズの勝利はあり得なかった。
        locator: {}
        spoiler_after: ch5559
    speech:
      observations:
      - event_ref: E_ch5559_シャーネス_names_可能性を増やそう_p2
        quote: 最初に『可能性を増やそう』と言い出したのはシャーネスだったらしい。
        locator: {}
        spoiler_after: ch5559
    relationship:
      observations:
      - event_ref: E_ch5559_シャーネス_other_分岐する自己_p5
        quote: 紀神キュトスがかつて内包していた、分岐する自己と矛盾した歴史をシャーネスは継承した。彼女はゆらぐ自分史（プロフィール）の化身として生きる『もしも』の魔法使い。同時に複数の人生を歩む魔女は、文字通り七つの顔を持つ女なのだ。
        locator: {}
        spoiler_after: ch5559
  first_appearance_candidate: true
