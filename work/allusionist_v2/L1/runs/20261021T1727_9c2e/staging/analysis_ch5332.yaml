- kind: mystery
  name: MY_Kaine_Terror
  note: カーインがレオからの感謝に対して「恐怖」を露わにした理由。
  quotes:
  - quote: 花のような笑顔を向ける主を、カーインは恐ろしいものを見たような目で凝視していた。それこそ先程の古き神にも向けないような恐怖の視線だ。
    paragraph: p196
    quote_verified: true
  expected_payoff: レオの存在（王としての資質・正体）に対するカーインの忠誠心と恐怖の源泉が明かされる、またはカーインの精神に亀裂が生じる伏線。
