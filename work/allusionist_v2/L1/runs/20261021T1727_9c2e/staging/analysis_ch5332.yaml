    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_Boutet_Pig_Transformation
  note: ブウテトが豚化する条件（呪力消耗・月齢等）と、トリシューラが検知した生理状態（背圧反応・エストロゲン）。
  quotes:
  - quote: 前にも完全に豚化してたよね？　何か条件があるのかな。呪力の消耗？　月齢とか？
    paragraph: p246
    quote_verified: true
  - quote: 雌性ホルモンであるエストロゲンやプロゲステロンがドバドバで、大前庭（バルトリン）線液の大洪水秒読み段階だよー！
    paragraph: p276
    quote_verified: true
  expected_payoff: ブウテトの女神としての性質（生と死・生殖）に連動した状態変化であり、次の戦闘やイアテムとの決着において重要な要素となる可能性。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
