- kind: theme
  theme: 自己正当化と防衛機制による暴力の美化
  weight: 0.8
  quotes:
  - quote: 「自慰？　違うな。あれは克己の為に行う魂の情交。世界と対話し、弱い自分自身を乗り越える儀式なのだ。」
    paragraph: p363
    quote_verified: false
  - quote: 身の内から湧き上がる情欲を断ち切らなければならない。故に己の内なる悪を断罪する為にその剣は振るわれる。自らが強く正しく在るための術。
    paragraph: p411
    quote_verified: true
  note: イアテムが敗北を「試練」と定義し、情欲を「克己」に変換する思考様式は、加害者性が自己愛護の論理で覆い隠される心理構造を示す。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
