        spoiler_after: ch5391
      - event_ref: E_ch5391_アルト・イヴニル_other_退場_p94
        quote: 「家族、絆、英雄像、戦士たる家父長、男根と剣――ああうんざりする。だが儀式の遂行についてはご苦労様だ。劇の中に於けるお前たちの役目は終わった。退場しろ陽根の担い手ども。既にクレイはお前たちの呪力を『覚えた』――三手の副肢を削ぎ落とし、主肢に全ての力を注ぐ時だ」
        locator: {}
        spoiler_after: ch5391
    action:
      observations:
      - event_ref: E_ch5391_アルト・イヴニル_breaks_ベフォニス_p110
        quote: ファルはベフォニスを操作してけしかける。だがアルトが腕を一振りすると岩肌の大男の全身は無惨に引き裂かれて倒れ伏した。
        locator: {}
        spoiler_after: ch5391
      - event_ref: E_ch5391_アルト・イヴニル_departs_従僕たち_p180
        quote: 'アルト・イヴニルは紅紫の髪を靡かせながらその場を立ち去る。

          骨の剣を携え、幾多の魔導書と人形の従僕を従えながら。'
        locator: {}
        spoiler_after: ch5391
      - event_ref: E_ch5391_アルト・イヴニル_kills_パーン_p55
