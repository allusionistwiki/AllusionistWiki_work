  entity_type: terminology
  aspects:
    visual:
      observations:
      - event_ref: E_ch5341_光の柱_functions_as_天空の回廊_p2
        quote: 夜を貫く光の柱は、太陰（イルディアンサ）と地上とを繋ぐ天空の回廊。
        locator: {}
        spoiler_after: ch5341
  first_appearance_candidate: true
- canonical_target: '[[E_char_リーナ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5341_リーナ_other_セリアック＝ニアの尻_p205
        quote: リーナは調子に乗ったのか、今度はセリアック＝ニアの腰に手を回し、お尻の少し上のあたりをとんとんと叩き始めた。途端、蕩けるような顔になるセリアック＝ニア。
        locator: {}
        spoiler_after: ch5341
    speech:
      observations:
      - event_ref: E_ch5341_リーナ_asks_加速の限界_p26
        quote: 「リーナ、このままじゃ引き離されます！　もっと加速できないんですか？！」
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_リーナ_names_ニア姫弾_p66
        quote: 「名付けてニア姫弾！　ドルネスタンルフ系の加護持ちは死ぬ！」
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_リーナ_says_アズーリア様との合流指示_p7
        quote: 「急ぎますよ、見失う前に片を付けてアズーリア様と合流します！」
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_リーナ_says_粗悪な呪石への苦情_p97
        quote: 「先輩のばかー！　また時間切れじゃん！　ちゃんとした石用意してあげてよ、ニアちゃんまだ本調子じゃないんだから！」
        locator: {}
        spoiler_after: ch5341
  first_appearance_candidate: true
