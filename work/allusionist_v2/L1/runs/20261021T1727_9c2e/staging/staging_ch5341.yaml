episode: ch5341
created: '2026-10-21'
status: pending_merge
entities:
- canonical_target: '[[E_item_呪術障壁]]'
  entity_type: item
  aspects:
    action:
      observations:
      - event_ref: E_ch5341_呪術障壁_functions_as_姿勢制御_p10
        quote: 流線型の呪術障壁が大気を切り裂き、不安定な二人乗りの姿勢を制御する。
        locator: {}
        spoiler_after: ch5341
  first_appearance_candidate: true
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5341_アキラ_says_経済的理由の反論_p102
        quote: 「どうせ粗悪な呪石しか持ってませんよ！　ごめんなさいねニアを完全体で復活させてあげられなくて！　ていうか呪宝石とか消耗品として使えるのは貴方たちみたいな大金持ちだけです！　そんなことしたら破産しますよ私！」
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_says_リーナへの説教_p106
        quote: 「セリアック＝ニアと遊ぶためだけに呪宝石浪費しまくって手持ち尽きたでしょうが！　この迂闊お馬鹿リーナ！」
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_observes_内世界への転移_p152
        quote: 位相の異なる世界、ゼオーティアと隣り合う内世界にでも飲み込まれたようだった。【扉】の類を通過する際に稀に起きる事故だが、今回は偶然ではなく仕掛けられた罠に嵌った形だ。
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_thinks_人形姫の罠_p154
        quote: 恐らくアレッテ・イヴニルが『回廊』に穴を空けたのだろう。
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_thinks_行動の自由と制約_p182
        quote: '立場上、アズーリア様は第五階層に不用意に関われない。

          現時点で自由に動けるのは私とリーナだけだ。

          ドラトリアの姉妹姫もまた立場の重さから気軽な行動はできない。'
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_other_嫉妬と苛立ち_p217
        quote: '何故か、いらっとした。

          私を置き去りにして、リーナはセリアック＝ニアをひたらす可愛がる。

          ――ちょっと、やり過ぎは良くないような。'
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_thinks_殺意_p24
        quote: 嫌いなタイプ。死ねばいい。というか殺します。
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_thinks_戦う相手は六王ではない_p268
        quote: '王の座を巡る戦いは、その資格を有する者たちが自分の力だけで行うべきだ。

          『呪文の座』と『杖の座』はあくまでも共通の敵と対峙するための一時的な同盟だ。だから私たちが戦う相手は六王ではない。

          使い魔の座――トライデント。

          そしてラクルラール派の企みを妨害することが優先すべき目的だ。'
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_says_最大加速の報告_p28
        quote: 「これで目一杯だよー！　停止してないのが不思議なくらいなのに！」
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_names_隊長格は十二体_p363
        quote: '「隊長格は十二体です」

          「もうやだおうち帰るー！」'
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_thinks_トリシューラへの期待_p380
        quote: '「あとは貴方次第ですよ、トリシューラ」

          小さく呟く。

          私に勝っておいて、無様に負けるなんて許さない。'
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_says_間に合った安堵_p5
        quote: 「良かった、間に合った！」
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_says_猫姫の召喚宣言_p56
        quote: 「心配しなくても、今暴れさせてあげますよ！」
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_thinks_苛立ち_p88
        quote: 'その在り方に、少しだけ苛立たされる。

          少しだけ。それ以上の感傷は不要だった。'
        locator: {}
        spoiler_after: ch5341
    action:
      observations:
      - event_ref: E_ch5341_アキラ_other_黄色い呪石弾_p117
        quote: 黄色い呪石弾を再び投射。
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_takes_赤色の呪石_p14
        quote: 腰に巻いた白とピンクのアウトドアポーチから赤色の呪石を取り出す。
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_uses_投石器スリングショット_p14
        quote: 三半規管を翻弄する重力の制御を妹に任せ、私は左手の投石器（スリングショット）を前に突き出した。
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_other_暗闇_p143
        quote: '『回廊』が歪み、口を開けた暗闇の中に飲み込まれていく。

          闇の中に、紅紫の薄明かりと天に届く巨大な塔が見えた。

          それを最後に、意識が途絶える。'
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_arrives_霊園のある世界_p150
        quote: 眼下に広がるのは途方もなく広大な霊園で、朽ち果てた墓石が並んでいる。
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_other_呪石弾ビーンズ_p16
        quote: 呪石弾（ビーンズ）が流星となって熱と衝撃を撒き散らそうとするが、巨大な呪力が展開された呪文を強引に握り潰してしまう。
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_wounds_リーナとの衝突_p162
        quote: '額に衝撃が走り、そのまま流れた頭がリーナと激突。後頭部にも衝撃。

          建物の窓から突き出た欄干は結構硬く、リーナはそれ以上に石頭だった。

          痛い。'
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_other_霧の世界_p173
        quote: '私たちは一度状況を整理しようと適当な場所を見つけて着陸することにした。

          霧に包まれた世界はどうしようもなく不吉で、冬の寒さが身に染みる。'
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_repairs_セリアック＝ニアの爪_p230
        quote: '私はポーチから速乾塗料や筆、ブラシなどを取り出して小さなセリアック＝ニアの左の爪に呪紋を描いていった。

          ネイル呪術（アート）でスキンケアや感染症、爪が薄くなるなどの問題は解決出来る。'
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_fights_人面甲虫_p320
        quote: '絶叫しながら飛来してくる人面の甲虫。

          呪石弾が命中する距離ではない。私はナイフを取りだして横薙ぎに引き裂くと、背後から音を殺して迫っていた虫を裏拳で潰す。巨大な長虫はセリアック＝ニアに任せ、下から這ってきた百足を踏み潰す。'
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_uses_解呪魔導書_p34
        quote: 私の意志に応えて黒い装丁の魔導書が目の前に出現。自動的に呪文を紡ぐ。溢れ出した黒い文字列が停滞の邪視を破壊して、箒が僅かに加速し始めた。
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_other_盲目の守護者像_p371
        quote: 「良い機会です。ここで全軍叩き潰してやりましょう――右手親指、解錠（アンロック）！　【盲目の守護者像（ブラインド・ガーディアン）】！」
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_uses_断章の強化呪石弾_p40
        quote: 進行方向へ真っ逆さまに落ちていく。重力に引かれるように、私の呪石弾が【断章】の呪文によって強化されて流れ落ちる。
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_other_呪石弾_p46
        quote: 即座に呪石弾を投射。
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_takes_黄色に輝く呪石_p53
        quote: その隙に本命の一撃を叩き込む。取り出したのは黄色に輝く呪石。
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_other_黄色の呪石_p58
        quote: 反撃の邪視を発動させた人形姫目掛けて呪石を投射。
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_other_箒_p9
        quote: 相方と声を掛け合って、箒に二人乗りしたまま一気に加速。
        locator: {}
        spoiler_after: ch5341
    visual:
      observations:
      - event_ref: E_ch5341_アキラ_finds_紅紫の髪_p138
        quote: どうにか猫姫を引き剥がした私は、箒の端に長い髪が巻き付いているのを確かに見た。紅紫の長い長い糸を。
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アキラ_observes_人面昆虫の出現_p311
        quote: '紅紫の不気味な空の下、飛び回るのは片側だけに複眼が付いた奇形の羽虫。

          そして大地を這い回り、墓石を溶解させる緑色の液体を吐き出す長虫。

          いずれも身体のどこかに霊長類の顔が浮かび上がっているのが異様だった。'
        locator: {}
        spoiler_after: ch5341
  first_appearance_candidate: true
- canonical_target: '[[E_char_アレッテ・イヴニル]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5341_アレッテ・イヴニル_flees_彼方へ_p109
        quote: そうしている間に肝心の人形姫はいつの間にか遙か彼方へと逃げ去ってしまっている。気付いた時には既に遅い。
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アレッテ・イヴニル_attacks_亜竜の鉤爪_p59
        quote: 全てを停滞させる邪視が世界の理を歪め、可視化した呪力は巨大な亜竜の鉤爪となって私たちを襲う。迎え撃つはちっぽけ極まる石ころ一つ。
        locator: {}
        spoiler_after: ch5341
    visual:
      observations:
      - event_ref: E_ch5341_アレッテ・イヴニル_has_property_人形のような瞳_p18
        quote: 人形のような瞳が爛々と輝いていた。
        locator: {}
        spoiler_after: ch5341
    speech:
      observations:
      - event_ref: E_ch5341_アレッテ・イヴニル_says_攻撃の無意味さ_p20
        quote: 「どうせ無駄なのに、滑稽ね」
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アレッテ・イヴニル_says_三重の声での嘲笑_p42
        quote: 「だから無駄だって」「言ってるのに」「馬鹿だねメートリアンは！」
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_アレッテ・イヴニル_says_諦めと死の受容_p84
        quote: '「ああ、そう。『私の方』はここで終わるのね」

          人形姫の瞳に諦めが浮かんだ。

          余りにもあっさりと絶望し、簡単に死を受け入れる。'
        locator: {}
        spoiler_after: ch5341
    symbolic:
      observations:
      - event_ref: E_ch5341_アレッテ・イヴニル_has_property_世界観による減速_p22
        quote: 諦観に満ちた世界観が空間そのものに干渉して全てを減速させていく。
        locator: {}
        spoiler_after: ch5341
    name:
      observations:
      - event_ref: E_ch5341_アレッテ・イヴニル_names_邪眼の人形姫_p22
        quote: 標的――邪眼の人形姫（アレッテ・イヴニル）が紅紫の髪を靡かせながら嘲笑う。
        locator: {}
        spoiler_after: ch5341
  first_appearance_candidate: true
- canonical_target: '[[E_char_セリアック＝ニア]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5341_セリアック＝ニア_attacks_アキラの顔_p120
        quote: '光の中から顕現した小さなセリアック＝ニアは勢いのまま人形姫を追撃する――かと思いきや、くるりと反転して私に襲いかかる。

          べちっ、という音がして、視界が遮られる。

          セリアック＝ニアが私の顔に張り付いているのだ。'
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_セリアック＝ニア_attacks_光の刃_p69
        quote: セリアック＝ニアが小さな指先から光の刃を伸ばして人形姫に襲いかかる。
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_セリアック＝ニア_defeats_球神障壁_p74
        quote: 拮抗すらしなかった。人形姫の邪視は一撃で粉砕され、堅牢で知られる球神障壁が紙のように引き裂かれてしまう。あらゆる球体は【猫（アウターゴッド）】にとって掌で弄ぶ玩具でしかない。
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_セリアック＝ニア_wounds_アレッテ・イヴニル_p82
        quote: 縦横無尽に振るわれるセリアック＝ニアの五指がアレッテ・イヴニルの腕を切断し、足を貫き、胴体を砕いていく。フリル付きの可愛らしい衣装は既にぼろ切れと化している。
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_セリアック＝ニア_disappears_時間切れ_p94
        quote: '「にー？」

          小さな猫姫が、粉々に砕け散った。'
        locator: {}
        spoiler_after: ch5341
    speech:
      observations:
      - event_ref: E_ch5341_セリアック＝ニア_says_アキラへの拒絶_p122
        quote: 「にゃあ、りーにゃ、わるくない！　みるーにゃ、きらい！」
        locator: {}
        spoiler_after: ch5341
    symbolic:
      observations:
      - event_ref: E_ch5341_セリアック＝ニア_has_property_短絡的な感情_p180
        quote: 感情はそこまで長く持続しない。今の彼女は余り複雑なことは考えられないのだ。復活させた直後はリールエルバを助けに行くと言って十匹ぐらいでにあにあ騒いでいたので、今でもまだ言う事を聞いてくれるようになった方ではある。
        locator: {}
        spoiler_after: ch5341
      - event_ref: E_ch5341_セリアック＝ニア_has_property_生死の曖昧さによる利用_p194
        quote: 完全に復活させると『生きている』ことが確定してしまい本国に捕捉されてしまうため、生死が曖昧なまま必要に応じて呪石弾で召喚する形で利用させてもらっている。宝石の中にある内世界に遍在するセリアック＝ニアは今の状態なら何体でも召喚できるし死んでも再召喚できる無敵状態だ。
        locator: {}
        spoiler_after: ch5341
    visual:
      observations:
      - event_ref: E_ch5341_セリアック＝ニア_transforms_猫耳の少女_p64
        quote: '「にあ！」

          とても小さな猫耳の少女になる。掌に乗るほどのサイズだが、それは紛れもなく聖姫セリアック＝ニアだった。'
        locator: {}
        spoiler_after: ch5341
  first_appearance_candidate: true
- canonical_target: '[[E_char_リールエルバ]]'
  entity_type: character
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5341_リールエルバ_has_property_誘拐による自由_p189
        quote: '誘拐されているという状況は、彼女を立場から自由にしている。

          今のリールエルバはあらゆる縛りを超えてガロアンディアンを援護できる状況にある。'
        locator: {}
        spoiler_after: ch5341
  first_appearance_candidate: true
