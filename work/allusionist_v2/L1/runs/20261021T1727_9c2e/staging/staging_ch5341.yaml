- canonical_target: '[[E_item_ジンメンイナゴ]]'
  entity_type: item
  aspects:
    visual:
      observations:
      - event_ref: E_ch5341_ジンメンイナゴ_appears_空を埋め尽くす大群_p337
        quote: '蝗――それも顔や手足を備えたジンメンイナゴ。

          呪殺刑によって永劫に異界で苦しみ続ける生ける墓場の亡者。

          異界監獄に閉じ込められた囚人たち。'
