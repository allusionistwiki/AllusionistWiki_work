      observations:
      - event_ref: E_ch5341_回廊_has_property_気紛れな昇降機_p3
        quote: 月齢によって閉じたり開いたりする気紛れな天地直通の軌道昇降機（エレベーター）に、私たちは滑り込むようにして突入する。
        locator: {}
        spoiler_after: ch5341
