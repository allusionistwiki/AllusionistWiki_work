        locator: {}
        spoiler_after: ch5533
      - event_ref: E_ch5533_ヒュレー_deceives_クレイの解釈_p56
        quote: 『不快』や『怒り』の発露としての芝居を刃に乗せた瞬間、相手はほとんど同じ演技プランで斬撃を繰り出して『快』や『興奮』を示す。
