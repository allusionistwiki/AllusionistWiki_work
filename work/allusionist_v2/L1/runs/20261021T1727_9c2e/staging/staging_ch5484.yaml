    action:
      observations:
      - event_ref: E_ch5484_セラメル_uses_炸撃_p1012
        quote: '「燃えろっ」


          『炸撃』を次々と放射していくセラメルだったが、何かが飛翔して熱線を遮った。'
        locator: {}
        spoiler_after: ch5484
      - event_ref: E_ch5484_セラメル_uses_燐血の民としての加護_p24
        quote: 穢れに肉体を蝕まれているのだ。燐血の民としての加護によって白い炎が全身を覆って瘴気を払うが、セラメルの顔には疲労の色が窺えた。
        locator: {}
        spoiler_after: ch5484
      - event_ref: E_ch5484_セラメル_fights_キノコ人_p5355
        quote: 両腕に炎を纏わせたセラメルが鬼気迫る表情で叫び、キノコ人の胴体を焼き尽くす。その身に纏った炎は穢れを寄せ付けず、キノコ人たちは苦悶の声を上げながら崩れ落ちていく。
        locator: {}
        spoiler_after: ch5484
    speech:
      observations:
      - event_ref: E_ch5484_セラメル_other_自身の生業鍛冶師_p103105
        quote: '「何を腐ったことを言ってやがる。私はねえ、迷宮攻略合戦が終わって武器が売れなくなっても誰も恨みやしないよ。日用品と伝統工芸としての武具で食ってくからね！」


          ノゴルオゴルオの毒のような言葉に対してセラメルは一歩も引かなかった。'
        locator: {}
        spoiler_after: ch5484
      - event_ref: E_ch5484_セラメル_other_アルティウスの死と復活_p231237246
        quote: 「遺されたあいつの家族がどれだけ悲しんだことか！
        locator: {}
        spoiler_after: ch5484
      - event_ref: E_ch5484_セラメル_other_魂の誓約魔槍鍛造_p260262268
        quote: 方言使いにとって話し言葉は書き言葉に優越する。正式な書面や血文字による誓約儀式などが無くともノゴルオゴルオは口約束のみで相手の魂を呪縛することが可能なのだ。
        locator: {}
        spoiler_after: ch5484
      - event_ref: E_ch5484_セラメル_says_毒と瘴気への警告_p5
        quote: 「気をつけな、奴らは毒と瘴気を使う！」
        locator: {}
        spoiler_after: ch5484
      - event_ref: E_ch5484_セラメル_other_ノゴルオゴルオ_p6567
        quote: '「なんちゅうことを！　折角おらたつが傲慢な太陰の標準語中心思想から解放してやったのに。可哀想なキノコども、報われねえ人生の結末がこれとは涙が出そうだよ」


          「いけしゃあしゃあとぬかしやがる、この外道。あんた恥ずかしくないのかい」'
        locator: {}
        spoiler_after: ch5484
  first_appearance_candidate: true
- canonical_target: '[[E_char_ハエの使い魔]]'
  entity_type: character
