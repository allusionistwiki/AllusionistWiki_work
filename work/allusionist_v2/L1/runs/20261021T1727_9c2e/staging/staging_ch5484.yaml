  first_appearance_candidate: true
- canonical_target: '[[E_term_ユディーア]]'
  entity_type: terminology
  aspects:
    action:
      observations:
      - event_ref: E_ch5484_ユディーア_fights_キノコ人_p13
        quote: ユディーアは一気に踏み込んだ。無造作に放った突き、踏み出した足による打撃、重量バランスの悪いキノコ人は重心を崩せば容易く倒れる。落ちてきた傘を切り裂いて灰に変える。
        locator: {}
        spoiler_after: ch5484
      - event_ref: E_ch5484_ユディーア_other_過去視共有記憶_p19
        quote: 親から子へと呪いのように受け継がれてきた苦痛の記憶に息が詰まる。振るわれた長い腕を交差した鉤爪で受けた瞬間、ユディーアは怪物たちの過去を瞬間的に体験していた。
        locator: {}
        spoiler_after: ch5484
      - event_ref: E_ch5484_ユディーア_other_銀貨の贈与_p215
        quote: 「銀貨は渡さない」
        locator: {}
        spoiler_after: ch5484
      - event_ref: E_ch5484_ユディーア_other_決断_p4651
        quote: だがそれは仮定の話だ。ユディーアは選べない。それとも、外で待機させていた使い魔たちの到着まで時間稼ぎをしていると言った方が聞こえがいいだろうか？　しかしそれは言い訳に過ぎないとユディーア自身が理解していた。
        locator: {}
        spoiler_after: ch5484
      - event_ref: E_ch5484_ユディーア_uses_抗毒呪符_p7
        quote: ユディーアは抗毒呪符を取り出しつつ迫り来るキノコ人たちの成れの果てを迎え撃つ。
        locator: {}
        spoiler_after: ch5484
      - event_ref: E_ch5484_ユディーア_uses_空圧の呪文_p8
        quote: ユディーアは『空圧』の呪文を鉤爪に纏わせる。両腕を振るうたびに突風が吹き荒れて毒煙が散っていくが、重量のあるキノコ人たちはびくともしない。
        locator: {}
        spoiler_after: ch5484
    speech:
      observations:
      - event_ref: E_ch5484_ユディーア_learns_カマソッソ氏族による裏切り_p2629
        quote: ある日、カマソッソ氏族は友人となったキノコ人が迫害され困窮していると聞いて彼らの共同体に住まいと仕事を紹介すると持ちかける。その結果がこれだ。友人たちからも食い物にされたキノコ人たちは世界の全てを憎んでいる。
        locator: {}
        spoiler_after: ch5484
      - event_ref: E_ch5484_ユディーア_other_ディスケイムによる支配構造_p272277
        quote: ノゴルオゴルオの言葉はディスケイムの意思そのもの。最初からユディーアは血と家という巨大な歯車の中に組み込まれていた部品のひとつに過ぎない。
        locator: {}
        spoiler_after: ch5484
      - event_ref: E_ch5484_ユディーア_other_呪文の使用_p3132
        quote: 隠し持ったニアホンことセリアック＝ニアのすぐ傍でそのような欺瞞を口にすることに強い抵抗があった。
        locator: {}
        spoiler_after: ch5484
      - event_ref: E_ch5484_ユディーア_other_敵の戦略罠_p4145
        quote: 邪悪な怪物として自らを位置づけ、弱者を異獣化させてけしかける。正義の側として怪物たちを退治するユディーアとセラメルは定番の構図に吸収されることだろう。どう考えても呪術の型だ。
        locator: {}
        spoiler_after: ch5484
  first_appearance_candidate: true
- canonical_target: '[[E_char_ノゴルオゴルオ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5484_ノゴルオゴルオ_other_取引銀貨と裏切り_p134136
        quote: 「おらたつはおめえと取引がしてえだ。銀貨をおらたつに渡せ。このノゴルオゴルオの名に賭けて、裏切り者になってやるだよ」
        locator: {}
        spoiler_after: ch5484
      - event_ref: E_ch5484_ノゴルオゴルオ_reveals_アルティウスの復活と目的_p144170
        quote: 「おらたつ、ライラ、スーリウムは『竜牙槍』のアルティウスをガロアンディアンの王に戴くつもりだ。そして聖女は真の亜竜王に守られ、救世主を産み落とすわけだな」
        locator: {}
        spoiler_after: ch5484
      - event_ref: E_ch5484_ノゴルオゴルオ_other_鉤爪の使用呪いの進行_p194197
        quote: '「わかってねえみてえだから教えとくが、そいつはおめえが『血』を活性化させるたんびに進行する。その『鉤爪』ばっか使ってっとさっさと縮んでしまうからやめとけ。アルティウスと競い合う前に完成されても困る。物事には適切な時機っちゅうもんがあるだよ」


          ぎょっとして鉤爪を引っ込める。鱗に覆われた腕が無徴の白い肌に変化していく。'
        locator: {}
        spoiler_after: ch5484
      - event_ref: E_ch5484_ノゴルオゴルオ_reveals_アルティウスの正体死体の復活_p227229
        quote: 「んだ、そのアルティウスだ。大地の眷族に伝わる『死の地霊』の力で復活させた。火葬される前に遺体を確保できたのは幸いだっただよ」
        locator: {}
        spoiler_after: ch5484
      - event_ref: E_ch5484_ノゴルオゴルオ_other_アルティウスとの面会条件_p250256
        quote: そこのユディーアに最高の魔槍を用意しろ。あの伝説の魔槍、氷血のコルセスカに対抗しうるとびっきりの逸品。おめえの人生で最高の武器を鍛えるだよ」
        locator: {}
        spoiler_after: ch5484
      - event_ref: E_ch5484_ノゴルオゴルオ_says_キノコ人の価値ハズレ_p71
        quote: 「グハハハ！　あんま笑わせんなや。こいつらはハズレだ、大して惜しくもねえ。聖なる祭司の素質があれば幻覚を見せられたはずだよ。穢れた毒持ちなんぞここで使い捨てられんのがお似合いってもんだべや」
        locator: {}
        spoiler_after: ch5484
      - event_ref: E_ch5484_ノゴルオゴルオ_other_ユディーア決断力_p76
        quote: 「それにしてもユディーア、おめえは変わらねえなあ。まーた決断できずに先送りか。昔っからおめえは基礎能力のスコアばり高くて精神面が柔くていけねえ。そのまんまじゃあアルティウスの相手としてはちっとばかし足りねえぞ？」
        locator: {}
        spoiler_after: ch5484
      - event_ref: E_ch5484_ノゴルオゴルオ_names_ディスケイム組織/血統_p8082
        quote: ディスケイムとは複数系統の秩序派血統魔術師によって『純血の多様性』を維持しようとする思想集団だ。含まれる種族は多く、岩肌種がいてもおかしくはない。
        locator: {}
        spoiler_after: ch5484
      - event_ref: E_ch5484_ノゴルオゴルオ_reveals_魔将イェレイドとの関係_p9197
        quote: '「私がそのディスケイムって姓を見たのはこれで三度目だ。あんたたち二人と、ずっと前に第六階層で遭遇しちまった大魔将イェレイド。奴はその名を持っていた」


          「ああ、イエレドか？　あれはおらたつの傑作のひとつだよ。紀源分離と基礎構築はレストロオセとガドールが、異獣化はおらほの祭壇で仕上げた。まだ見所のある言語支配者どもがいた時代の話だよ、懐かしいなあ」'
        locator: {}
        spoiler_after: ch5484
    action:
      observations:
      - event_ref: E_ch5484_ノゴルオゴルオ_other_金槌呼び声に応じ_p5759
        quote: '「来い！」


          呼び声に応じて飛来したのはノゴルオゴルオに投擲したあの金槌だった。セラメルは空中で掴んだ金槌を巨大化させると、激しく燃え立つ炎を纏わせて床に叩きつける。'
        locator: {}
        spoiler_after: ch5484
  first_appearance_candidate: true
