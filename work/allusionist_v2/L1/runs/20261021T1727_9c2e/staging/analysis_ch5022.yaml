- kind: mystery
  name: MY_missing_companions
  note: 半年前に再会を約束した仲間が現れず、主人公が孤立している。この「不在」と「意識の断絶」の原因、および仲間たちの安否が後の展開で重要になる可能性が高い。
  quotes:
  - quote: 待てども待てども、俺の元に待ち人が現れることは無かった。
    paragraph: p58
    quote_verified: true
  - quote: そうして不意に訪れた意識の断絶。一瞬のようにも感じられた闇が晴れた時、俺はこの第五階層に一人で立っていた。
    paragraph: p59-p60
    quote_verified: true
  expected_payoff: 仲間との再会、あるいは彼らが遭遇した「何か」の真相、主人公が単独で第五階層へ落下した原因（罠、事故、意図的な分離など）の解明。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_iron_arm_origin
  note: 「鎧の腕」と呼ばれる電子制御義肢が一般的でない世界での主人公の特徴。この腕が元のどこから来たのか、なぜ存在するのか、また周囲の恐怖（猛獣を見るような目）の真意が未回収。
  quotes:
  - quote: 呪術による爆発を防いだことで露わになったその腕は、硬質の金属製だった。どうやらこの世界では一般的では無いらしい、電子制御技術を用いた機械義肢。
    paragraph: p115-p117
    quote_verified: true
  - quote: 人々は揃ってコミュニケーションがとれない猛獣を見るかのように、じりじりと俺から距離をとりはじめる。
    paragraph: p125
    quote_verified: true
  expected_payoff: 義肢の由来（元の技術、転生時の付与など）、「鎧」の意味領域の正確な翻訳、およびこの腕が第五階層の政治的・宗教的文脈でどう評価されるかの判明。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
