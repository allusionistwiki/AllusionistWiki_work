- canonical_target: '[[E_char_ソルダ・アーニスタ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5228_ソルダ・アーニスタ_appears_世界槍の先端_p361
        quote: 屹立する長槍の遙か先端、鋭い穂先の頂点に、その少年は立っていた。
        locator: {}
        spoiler_after: ch5228
    speech:
      observations:
      - event_ref: E_ch5228_ソルダ・アーニスタ_says_人類の愛おしさと救済_p372
        quote: 「この世界には至る所に争いの火種が燻り、悲劇が口を開けて人が落ちてくるのを待ち構えている――だというのに、必死に未来を向いて人々は生きようとする。それはなんて愛おしいんだろう。それはなんて素晴らしいんだろう」
        locator: {}
        spoiler_after: ch5228
      - event_ref: E_ch5228_ソルダ・アーニスタ_names_コルセスカ_p398
        quote: 「楽しみだよ、コルセスカ。僕の冬。終わりの花嫁。世界の最果て――ああ、どうか待っていて欲しい。終端を弑（しい）する者すら討ち滅ぼして、きっと君に会いに行くから。そうして、二人で人類を救済してあげよう」
        locator: {}
        spoiler_after: ch5228
  first_appearance_candidate: true
