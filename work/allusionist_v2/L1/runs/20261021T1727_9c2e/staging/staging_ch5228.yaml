- canonical_target: '[[E_char_リーナ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5228_リーナ_appears_幽閉室_p26
        quote: '悄然と項垂れていると、厳重に外界から隔離された一室に誰かが入ってくる。

          三角帽子の少女――もうそろそろ、その形容も似つかわしくない年頃だろうか。'
        locator: {}
        spoiler_after: ch5228
    speech:
      observations:
      - event_ref: E_ch5228_リーナ_has_property_卓越した霊媒適性_p91
        quote: 'リーナはゾラの血族にあって落ちこぼれと呼ばれていた。

          だが、『このリーナ』の言う事が正しければ、実際は彼女の才覚は傑出しており――その呪術の適性ゆえに肉体を完全に支配されずにいたということらしい。'
        locator: {}
        spoiler_after: ch5228
    action:
      observations:
      - event_ref: E_ch5228_リーナ_loses_心身の支配権_p97
        quote: 霊媒として、より強い力を求めた結果として、リーナは『何か』の力を使って危機を乗り越え――その結果として、心身の支配権を奪われたのだ。
        locator: {}
        spoiler_after: ch5228
