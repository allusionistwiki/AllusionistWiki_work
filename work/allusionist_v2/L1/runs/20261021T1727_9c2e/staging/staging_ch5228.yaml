episode: ch5228
created: '2026-10-21'
status: pending_merge
entities:
- canonical_target: '[[E_char_リーナクロウサー]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5228_リーナクロウサー_names_空使い_p101
        quote: 「然様。大儀であったガルズ。貴様はこの為に生まれてきたと言っても過言ではあるまい。貴様が招いた危機のお陰でリーナは正しく【空使い】として覚醒した」
        locator: {}
        spoiler_after: ch5228
      - event_ref: E_ch5228_リーナクロウサー_promises_妊娠までの解放猶予_p105
        quote: 「子を孕むまではそれは出来ぬ約束だな。安心せい。可愛い孫娘――我が血を受け継ぎし正統なる子孫の心を塗りつぶしたりはせぬ。主導権は我にあるが、リーナは普段通りに生活できる。少々お転婆が過ぎるが、これも愛嬌というもの」
        locator: {}
        spoiler_after: ch5228
      - event_ref: E_ch5228_リーナクロウサー_other_ガルズに平伏_p47
        quote: '「頭が高い。頭を垂れよ地虫」

          絶句して、頭上からのし掛かってくる凄まじい呪力によって平伏させられた。'
        locator: {}
        spoiler_after: ch5228
      - event_ref: E_ch5228_リーナクロウサー_says_人類は神の奴隷_p54
        quote: 「人に自由意思など無い。あれらは神の奴隷。地を這う虫けらよ。地上の地虫どもを見よ。絶対的な権威に頭を垂れる事しか知らぬ。己の意思で立っているように見えて、その実態は英雄や偶像という高みに縋り付くばかりの塵芥でしかない」
        locator: {}
        spoiler_after: ch5228
      - event_ref: E_ch5228_リーナクロウサー_names_トリアイナ_p66
        quote: 「だが、トリアイナ様の救世はそのような閉塞した世界から人類を解放する。あの方こそは末世に来たる唯一の光。すなわち救世主である」
        locator: {}
        spoiler_after: ch5228
      - event_ref: E_ch5228_リーナクロウサー_names_トライデントの細胞_p70
        quote: 「知らぬか。貴様らごとき木っ端の細胞では無理も無かろう。覚えておくがいい【右目】よ。あの方こそは第一の細胞にして我らが主と仰ぐべき頂。【心臓】のトリアイナ様こそ真の未知なる末妹」
        locator: {}
        spoiler_after: ch5228
      - event_ref: E_ch5228_リーナクロウサー_says_マウザの木っ端は不要_p77
        quote: 「貴様らはそれなりに努力した方だが――所詮は本来不要な器官に過ぎぬ。細胞にとって真に有用な『目』は別にある。使い捨ての道具、いやゴミか――貴様は常に役に立たぬな、思えばマウザの者どもは常にそうであった」
        locator: {}
        spoiler_after: ch5228
      - event_ref: E_ch5228_リーナクロウサー_says_十年に一度の才は無価値_p81
        quote: 「マウザの木っ端どもは貴様が生まれた時、十年に一度の才を持つ神童が生まれたと大騒ぎをしてな。名付け親にと私に擦り寄ってきおったが――十年に一度では精々小間使いが関の山よ。凡俗に価値は無い」
        locator: {}
        spoiler_after: ch5228
      - event_ref: E_ch5228_リーナクロウサー_reveals_顕在化の経緯_p88
        quote: 「それは正解であり正解でない。サイリウスは私の教えを完璧に内面化した優れた器であった――乗り捨てるのが惜しいくらいにな。だがリーナは歴代の誰よりも霊媒として優れていたが故に無意識下で我が支配を拒み、我が力と反発し合っていた。私が顕在化できるようになったのはつい先程のことよ」
        locator: {}
        spoiler_after: ch5228
    action:
      observations:
      - event_ref: E_ch5228_リーナクロウサー_uses_重力制御_p111
        quote: 重力制御。浮遊するリーナの足が、靴裏に斥力を発生させてガルズを床に押しつけていく。
        locator: {}
        spoiler_after: ch5228
      - event_ref: E_ch5228_リーナクロウサー_other_自動人形への命令_p210
        quote: リーナ・ゾラ・クロウサーの姿をした者は自動人形に片付けを命じさせると、その場を立ち去っていく。
        locator: {}
        spoiler_after: ch5228
  first_appearance_candidate: true
- canonical_target: '[[E_char_クロウサー]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5228_クロウサー_defines_融血呪の継承_p113
        quote: 「我が『藍』の記憶は融血呪として一族の血に偏在し、脈々と受け継がれる。そして、私を受け入れられるだけの才ある者が【空使い】の名を引き継ぎ、『私』を引き継ぐのだよ。リーナも、サイリウスも、ミブリナも、ダウザールも、だれもが私の可愛い『本当の孫』たちだ」
        locator: {}
        spoiler_after: ch5228
      - event_ref: E_ch5228_クロウサー_defines_第四細胞・血脈_p131
        quote: 「第四細胞、【血脈】のクロウサー。トリアイナ様の側近中の側近にして、融血呪の循環を司る細胞の要。クク、羨ましかろうがガルズ。私は全ての細胞の中で、ただ一人、拝謁の栄に浴したことがあるのだ」
        locator: {}
        spoiler_after: ch5228
      - event_ref: E_ch5228_クロウサー_says_トリアイナは今はまだいない_p135
        quote: 「いいや、いない。いるはずがない――今は、まだ」
        locator: {}
        spoiler_after: ch5228
      - event_ref: E_ch5228_クロウサー_other_ガルズ人形での慰め_p188
        quote: 「死体は適当に修繕してやる。リーナの『お人形遊び』に必要であろうからな。私が糸を繰り、リーナは私が作った『ガルズ人形』とお話して激務で疲れ果てた心を慰めるのよ。当主の役目は過酷であるからな。まあ大学くらいは出て貰わねば話にならんが」
        locator: {}
        spoiler_after: ch5228
    action:
      observations:
      - event_ref: E_ch5228_クロウサー_kills_ガルズの眼球_p166
        quote: 'あらゆる細胞の中で最も膨大で、速く、鋭く、繊細で、呪わしい融血呪の流体が藍色の光を放ちながらガルズの金眼に突き刺さった。

          低く鈍い絶叫が迸る。

          眼球だけを正確に吸い取った融血呪が、リーナの鳶色の両目に融け合う。'
        locator: {}
        spoiler_after: ch5228
      - event_ref: E_ch5228_クロウサー_takes_邪視の能力_p173
        quote: 'やがてその光は収束していき、元の焦げ茶色に戻る。

          だが、眼球の内部に宿った邪視の能力は確かにリーナ・ゾラ・クロウサーのものとなっていた。'
        locator: {}
        spoiler_after: ch5228
      - event_ref: E_ch5228_クロウサー_kills_ガルズ_p183
        quote: '不可視の衝撃がガルズを打ち据えた。

          背骨が折れ、内臓が潰される。

          浮遊するリーナの足がガルズを踏みつけ、発生した斥力が骨肉を押し潰して腹部から胴を両断していった。'
        locator: {}
        spoiler_after: ch5228
  first_appearance_candidate: true
- canonical_target: '[[E_char_ガルズ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5228_ガルズ_thinks_マリーとの双方向な救済_p12
        quote: マリーが守ったのはガルズの世界観で、その世界観はマリーの在り方を肯定するものだった。なら、それはマリーを守る事に繋がっていたのだ。
        locator: {}
        spoiler_after: ch5228
      - event_ref: E_ch5228_ガルズ_names_クロウサー_p123
        quote: '「お前が、クロウサーか！」

          それは、ガルズが滅ぼすべき怨敵と定めた巨悪の名前。'
        locator: {}
        spoiler_after: ch5228
      - event_ref: E_ch5228_ガルズ_loves_マリー_p16
        quote: 'ただ、どうしようもなく彼女が愛おしいとそう思った。

          そして同時に、無力な自分を呪う。'
        locator: {}
        spoiler_after: ch5228
      - event_ref: E_ch5228_ガルズ_thinks_リーナを守る願い_p195
        quote: どんなことがあっても、自分の事を諦めないでいてくれた彼女の自由を、ただ守りたいと、そう強く願った。
        locator: {}
        spoiler_after: ch5228
      - event_ref: E_ch5228_ガルズ_names_負け犬_p25
        quote: '英雄になり損ねた男。

          惨めな負け犬。それがガルズ・マウザ・クロウサーという男だ。'
        locator: {}
        spoiler_after: ch5228
      - event_ref: E_ch5228_ガルズ_says_リーナへの信頼と希望_p41
        quote: 「地上は、クロウサーは邪悪だ。それでも、誰もが力を合わせて困難を乗り越えようとするあの光景には希望があった気がする。だとすれば、人の意思を――君を信じて、任せていいかもしれないと、少しだけ思ったよ」
        locator: {}
        spoiler_after: ch5228
      - event_ref: E_ch5228_ガルズ_thinks_永続的な拘束_p5
        quote: リーナの言葉が通るのなら、自分はこのままずっと拘束され続けるのだろうな、とガルズはぼんやりと考えた。
        locator: {}
        spoiler_after: ch5228
      - event_ref: E_ch5228_ガルズ_names_サイリウス_p86
        quote: 「貴様か、貴様がリーナの中にいるのか、サイリウス！」
        locator: {}
        spoiler_after: ch5228
    symbolic:
      observations:
      - event_ref: E_ch5228_ガルズ_other_道を見失う_p7
        quote: いや――もうずっと道を見失っていたのかもしれない。
        locator: {}
        spoiler_after: ch5228
  first_appearance_candidate: true
