      observations:
      - event_ref: E_ch5228_ズタークスターク_defines_第十二魔将・稲妻の使い魔_p416
        quote: '「というわけで第十二魔将、網膜を灼く稲妻ズタークスターク。

          大魔将、という他の魔将よりも格上の存在ですね。更には北方にある地底都市ザドーナという場所から遣わされた客将でもあります。'
