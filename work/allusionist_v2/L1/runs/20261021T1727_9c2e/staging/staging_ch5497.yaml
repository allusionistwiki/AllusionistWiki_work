        locator: {}
        spoiler_after: ch5497
      - event_ref: E_ch5497_ウネム_says_舞台の演出リビュエー隊_p360368
        quote: '「見せるための張りぼてだろうとそれらしく仕立てるさ。」

          「これより我らリビュエー隊が演じますは不和歌う怪鳥ハルピュイアイ！」'
