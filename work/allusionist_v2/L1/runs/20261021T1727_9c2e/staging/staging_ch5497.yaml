  aspects:
    visual:
      observations:
      - event_ref: E_ch5497_アクィラ_appears_書架の上_p298300
        quote: 背の高い書架の上に行儀悪く胡座をかいているのは、またしても黒檀の民。木と砂の呪動義肢、修道騎士の胸当てを押し上げる筋肉質で大柄な体躯、形の良い頭部を露わにした禿頭。
        locator: {}
        spoiler_after: ch5497
    speech:
      observations:
      - event_ref: E_ch5497_アクィラ_other_第五階層での権利要求活動_p304308
        quote: でかい声、でかい面、鼻つまみ者で上等じゃねえかよ、自由で対等ってんなら殴り合うべきだろ、お互いに満足するまでよお！」
        locator: {}
        spoiler_after: ch5497
  first_appearance_candidate: true
- canonical_target: '[[E_org_リビュエー隊]]'
  entity_type: organization
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5497_リビュエー隊_bonds_五人の姉妹ウネム、マリナ、アクィラ、アイシャ、タマル_p371379
        quote: 'ウネム、マリナ、アクィラ、アイシャ、タマル。

          血の繋がらない、それでも同じ意思で結びついた五人姉妹。

          一番から五番までの数字が刻まれている、鳥の翼を象った認識票をそれぞれが手に持ち

          それは嘆声でもあった。焼かれて死に逝く亜大陸人が絶望の中で響かせた歌。'
        locator: {}
        spoiler_after: ch5497
  first_appearance_candidate: true
