      - event_ref: E_ch5497_ウネム_other_分断呪詛の伝播と男根狩り運動_p310325
        quote: '「私は引き続き『ハルムシオンの風』への工作と並行して分断呪詛の伝播を行う。」

          「私もこれまで以上に動く。イアテムの反動から生まれた『男根狩り』運動。被害女性救済のための加害男性排除キャンペーンの促進だ。弱者男性から狙って叩き、男の中からも分断を促していく」

