        locator: {}
        spoiler_after: ch5497
      - event_ref: E_ch5497_ヴィティス_has_property_金色の髪と黒肌_p6
        quote: 波打つ金色の髪は亜大陸の中にあっても少数人種の証だ。黒檀の民と一括りにされる黒肌の色濃さとてそれぞれに違う。
        locator: {}
        spoiler_after: ch5497
  first_appearance_candidate: true
