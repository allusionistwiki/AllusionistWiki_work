  aspects:
    action:
      observations:
      - event_ref: E_ch5497_アイシャ_other_イルス_p103106
        quote: 'アイシャは兄の腕を軽く引いて木のうろに導いた。

          けして強い力ではなかったにも関わらず、イルスはどうしてか抗えなかった。

          手指が真っ暗闇の中に誘われる。吸い込まれる。'
        locator: {}
        spoiler_after: ch5497
      - event_ref: E_ch5497_アイシャ_activates_ガリヨンテの呪文_p116123
        quote: '「大いなるガリヨンテの名において」

          アイシャの顔の右半分に異変が起きている。

          実体を反映して顔を覆っていた治療呪符が全て剥がれて火傷痕が剥き出しになっていた。

          あまりにも急速な、それでいて劇的な回復。'
        locator: {}
        spoiler_after: ch5497
      - event_ref: E_ch5497_アイシャ_other_夜の道_p2627
        quote: '黒檀の民が二人、連れだって夜の道を歩いて行く。

          先導する女の顔は右半分が治療呪符で覆い尽くされていた。痛々しい負傷が癒えるのも待たずに病室を抜けだして早足に歩く。'
        locator: {}
        spoiler_after: ch5497
      - event_ref: E_ch5497_アイシャ_other_イルスの記憶と認識_p349351
        quote: '「速やかに調整しろ。認識と記憶の齟齬が無いようにな。しくじるなよアイシャ」

          「わかってる。自分の兄だもの。自分で守るよ。そういう温情でしょ、これ」'
        locator: {}
        spoiler_after: ch5497
      - event_ref: E_ch5497_アイシャ_other_樹木のうろ_p3739
        quote: '「この樹。うろがあるでしょ」

          やがてアイシャは山道の入り口付近で立ち止まり、ある樹木を指差した。'
        locator: {}
        spoiler_after: ch5497
      - event_ref: E_ch5497_アイシャ_other_暗黒のうろ_p5658
        quote: '指先が暗黒の中に吸い込まれていく。

          喰われていくようだ。ぞっとしたイルスは咄嗟にアイシャの手首を掴んで引き戻そうとしたが、その手がアイシャのもう片方の手によって握られる。

          目の前に妹の顔がある。焼け爛れた右半分を呪符で覆い隠した痛々しい顔。'
        locator: {}
        spoiler_after: ch5497
      - event_ref: E_ch5497_アイシャ_other_手遅れな状況への自嘲_p9197
        quote: '不意を突かれたような妹の表情は悪い夢。

          あるいは愚かな兄の間抜けさ、それ自体がブラックジョーク。

          女は失笑し、それから腹を抱えて身を震わせた。

          手遅れなのだ。ようやくイルスは理解した。

          「ああ、おっかしい。久しぶりにこういう笑い方したわ」'
        locator: {}
        spoiler_after: ch5497
    visual:
      observations:
      - event_ref: E_ch5497_アイシャ_has_property_豊穣の角祭具_p128132
        quote: '恐らくは何かの祭具。穀物や果実を詰め込んだ角。豊穣、豊作、そんなイメージを喚起させられるような象徴的な道具のようだ。

          放たれる呪力はアストラル界だからこそ濃密に感じられた。

          途方もない神話的熱量がアイシャのアストラル体を駆け巡り'
        locator: {}
        spoiler_after: ch5497
      - event_ref: E_ch5497_アイシャ_wears_瘢痕文身スカリフィケーション_p135142
        quote: '意図的に残しているのだ。

          瘢痕文身（スカリフィケーション）と呼ばれる黒檀の民に伝わる慣習だ。

          黒檀の民社会において、それを女性が顔に刻むことはある種の誓いを意味していた。

          戦士である夫が果てたのち、その弔いのために戦場に赴くという誓願。'
        locator: {}
        spoiler_after: ch5497
    speech:
      observations:
      - event_ref: E_ch5497_アイシャ_confesses_世界を変える意思_p144148
        quote: '「私はね、イルハム。彼らを、黒檀の民を憎んでいる」

          「けれどそれ以上に、この世界を変えなければならないと憤っている。これは一時の激情ではなく、私の意思」'
        locator: {}
        spoiler_after: ch5497
      - event_ref: E_ch5497_アイシャ_other_計画の構造虫態アヴロノと黒蟲騎士団_p280286
        quote: 「ライラとキノコ人が『悪玉』として虫態アヴロノたちを脅かしたところに『善玉』の『黒蟲騎士団』が駆けつけて守る。
        locator: {}
        spoiler_after: ch5497
      - event_ref: E_ch5497_アイシャ_other_ヴィティス司教の死_p288290
        quote: '「ではヴィティス司教の死は偽装か！」

          「いや、ちゃんと死んだよ。あの人は戦闘が得意ってわけじゃないし、ライラ・ラプスに敵うわけないじゃん。」'
        locator: {}
        spoiler_after: ch5497
      - event_ref: E_ch5497_アイシャ_says_兄妹の会話の正当性_p31
        quote: 「いいじゃない。後ろ暗いことなんて無いんだから、訊かれたら『兄と妹が水入らずで話して悪い？』って答えればいい」
        locator: {}
        spoiler_after: ch5497
      - event_ref: E_ch5497_アイシャ_says_兄の決断は無関係であること_p333337
        quote: '「ごめんねイルハム。はっきり言ってしまうと、あなたがどんな決断をするかは問題じゃなかったの」

          「これは私たちの意思。だから、何があっても兄さんのせいじゃない」'
        locator: {}
        spoiler_after: ch5497
      - event_ref: E_ch5497_アイシャ_asks_接続の手伝い_p4246
        quote: '「手伝って。ここから接続できるから」

          「良き未来のため、世界を変える。兄さんとティリビナの巫女が目指す方向と、私たちが進む方向は同じはず。これは未来に続く入り口なの」'
        locator: {}
        spoiler_after: ch5497
      - event_ref: E_ch5497_アイシャ_other_イルスの理想主義_p5355
        quote: '「聖戦？ 殉死？ ああ、一時期イルハムはそういう思想にはまってたね。革命とか運動とか、今もそういう半端に見逃されてるだけの反槍神教活動やってるの？」

          鼻で笑うように言って、アイシャは木のうろに手を突き入れる。'
        locator: {}
        spoiler_after: ch5497
      - event_ref: E_ch5497_アイシャ_asks_相容れない相手とは_p6064
        quote: '「本当に相容れない？ 我々って誰のこと？」

          知らない瞳だ。吸い込まれるような、虚無の感情がそこにあった。

          そう思っていた妹は、今のイルスにとって理解のできない他者になってしまっていた。'
        locator: {}
        spoiler_after: ch5497
      - event_ref: E_ch5497_アイシャ_confesses_故郷への絶望と裏切り者としての自覚_p6787
        quote: '「ねえイルハム。私はね、父さんの実家に戻ったよ。本大陸の進んだ医療呪術を学んで、疫学を知って、父祖の土地に根付いた穢れを清めようとしたよ」

          「もう帰る場所なんてない。...私は裏切り者。彼らにとって私たちは分断者でしかないの」

          「人種が違うってこと。本大陸の思想で洗脳された『知識層』はね、もう黒檀の民じゃない。彼らを分断する悪魔の手先」

          しかし、いま彼女は祖国を、家族を『彼ら』と呼んだ。'
        locator: {}
        spoiler_after: ch5497
  first_appearance_candidate: true
