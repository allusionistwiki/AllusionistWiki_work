- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5497_アキラ_thinks_虚無の共鳴_p1213
        quote: 'この感情の正体は何か。考えて導き出された結論は、その男が抱えている虚無が自身の内側にある空虚を呼び起こしてしまうから、というものだった。

          自分自身が怖くなる。忘れているべきだった不快感を想起させるからこそ、その男は忌まわしいと嫌悪されている。'
        locator: {}
        spoiler_after: ch5497
      - event_ref: E_ch5497_アキラ_loves_ヴィティス_p1524
        quote: 'それでも彼女はどうしようもなく男に惹き付けられた。

          思い出すのも忌まわしい経験であったにも関わらず、それは彼女にとって運命だと信じられる出会いだった。

          何故ならば、彼が抱えている『空っぽさ』が自分の中にあるそれと同じものであるから。

          だからそれは愛ではなく自己憐憫。

          生きることへの疲労が生んだ救いのない錯覚。'
        locator: {}
        spoiler_after: ch5497
      - event_ref: E_ch5497_アキラ_remembers_ヴィティスとの対面時の震え_p5
        quote: 男の前に立った時の震えを今でも克明に思い出せる。
        locator: {}
        spoiler_after: ch5497
      - event_ref: E_ch5497_アキラ_fears_異物への拒絶と恐怖_p910
        quote: '生まれた奇妙な感覚は魅力によるものではない。異物に対する反射的な拒絶。

          心を震わせる感情はきっと恐怖だ。'
        locator: {}
        spoiler_after: ch5497
    visual:
      observations:
