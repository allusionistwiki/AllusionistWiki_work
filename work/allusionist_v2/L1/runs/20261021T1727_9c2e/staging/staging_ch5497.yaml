        locator: {}
        spoiler_after: ch5497
      - event_ref: E_ch5497_ウネム_other_傘の魔女への警戒_p293295
        quote: 「いいか。傘の魔女をあまり信用するな。奴は簡単に御しきれるような存在ではない。その力の強大さもそうだが、腹の底に何を抱えているかがまだ読めない。」
        locator: {}
