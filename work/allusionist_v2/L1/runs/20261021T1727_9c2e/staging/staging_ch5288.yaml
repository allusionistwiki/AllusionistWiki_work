      - event_ref: E_ch5288_一行_travels_夜道_p2
        quote: 不気味な静けさが辺りに立ちこめる中、夜道を行く集団がある。三人の大人と、一人の少女という奇妙な取り合わせだ。
        locator: {}
        spoiler_after: ch5289
