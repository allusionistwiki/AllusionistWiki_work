  review_status: unreviewed
- kind: mystery
  name: MY_Arette_Ivnil_Competition
  note: 人形姫アレッテ・イヴニルが【杖の座】の最有力候補であり、トリシューラの直接のライバルとして言及されている。彼女の存在と能力（邪視適性）がトリシューラの成長の障害または触媒になる可能性がある。
  quotes:
  - quote: とりわけ【邪視】は才能の欠片すら見つけ出せなかった。【杖】教室の同期生たちの中でも図抜けた邪視適性を持つ人形姫のアレッテ・イヴニルはラクルラールお姉様の一番弟子で、彼女こそ【最後の魔女】候補者――【杖の座】に相応しいと評判だった。
    paragraph: p35
    quote_verified: true
  expected_payoff: トリシューラが「自分には邪視の才能がない」と思い込む過程で、アレッテとの対比が自己肯定感の喪失を加速させる要因として描かれる、あるいは後の章での直接対決の伏線。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
