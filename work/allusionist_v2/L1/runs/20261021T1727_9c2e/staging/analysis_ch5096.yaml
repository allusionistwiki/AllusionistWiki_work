- kind: mystery
  name: MY_Coresska_Eye_Wound
  note: コルセスカの右目の傷は永遠に残ると予言されている。この傷が物語後半でトリシューラ自身の視界や呪術の性質（邪視）にどう影響するか、あるいはコルセスカとの関係性の象徴として機能するかが注目される。
  quotes:
  - quote: 創造主によって与えられた右目の傷は、永遠に刻まれて残る事でしょう。
    paragraph: p60
