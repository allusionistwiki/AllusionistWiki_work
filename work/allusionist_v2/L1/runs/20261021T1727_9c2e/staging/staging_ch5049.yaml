        locator: {}
        spoiler_after: ch5049
      - event_ref: E_ch5049_アキラ_says_トリシューラをポンコツ呼ぶ思考_p88
        quote: このロボ娘を星見の塔とやらがどんな目的で作ったのかは知らないが、叡智を結集した割にはえらいポンコツが出来上がったものである。
