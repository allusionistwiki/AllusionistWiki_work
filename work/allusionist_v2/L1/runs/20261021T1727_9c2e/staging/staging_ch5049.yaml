- canonical_target: '[[E_char_トリシューラ]]'
  entity_type: character
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5049_トリシューラ_reveals_核となるトラウマ/信条_p101
        quote: '偶然にも、俺の思考はトリシューラの逆鱗に触れていた。

          『それ』こそがこのアンドロイドの核だと、俺は直感した。'
        locator: {}
        spoiler_after: ch5049
    speech:
      observations:
      - event_ref: E_ch5049_トリシューラ_says_安全地帯の作成法_p11
        quote: 『こういう迷宮の休憩地点はね、松明の騎士団とか探索者協会が大規模な儀式を行って、上層の領域を限定的に展開することで作られてるのがほとんどだよ。だからこういう中継拠点が増えれば増えるほど攻略が進んでるってこと』
        locator: {}
        spoiler_after: ch5049
      - event_ref: E_ch5049_トリシューラ_promises_有用性の証明_p113
        quote: 「私は、何度だって自らの有用性を証明する。だから私にもう一度機会を頂戴。私の人格が信用できないっていうのならそれは構わない、自分の性能を証明して、それを信用してもらうだけ」
        locator: {}
        spoiler_after: ch5049
      - event_ref: E_ch5049_トリシューラ_fights_コルセスカ口論_p145
        quote: 「いったーい！ 殴ってる、もう殴ってるよ！ 何で私だけ？！ あっ、私の方が弱そうだからだ！ 自分より弱いと見たら女に手を挙げる最低のクズがここにいるよ！
          セスカ、お姉ちゃんいじめられてるよ、助けてー」
        locator: {}
        spoiler_after: ch5049
      - event_ref: E_ch5049_トリシューラ_says_アキラへの好意誤解_p160
        quote: 「え、なにそれ告白？ ごめんなさい、いきなりそんなこと言われても私ちょっと。お友達からということなら構わないけど。今度ご飯おごってくれるの？
          服も買ってくれるって？ ほんと？ 嬉しい！」
        locator: {}
        spoiler_after: ch5049
      - event_ref: E_ch5049_トリシューラ_says_古代の記録ログ_p17
        quote: 『たまーにだけど、古代の記録（ログ）が残ったままのケースがあるんだよ。空間の位相が過去にズレてて、旧文明の技術や遺産、超級のアーティファクトが手に入ったりするの。見つけられたらとってもラッキー』
        locator: {}
        spoiler_after: ch5049
      - event_ref: E_ch5049_トリシューラ_reveals_セスカへの対抗策マッチポンプ想定_p176
        quote: 「私は、セスカの裏をかいてアキラくんを使い魔にしようって思ってた。セスカが地上の組織を利用してアキラくん獲得に動いて、他の勢力もアキラくんを狙い始めたから、これはセスカが全部仕組んだことなんだ、私も手を打たないとアキラくんをとられちゃうって思ったの。私だってアキラくんに目を付けてたのに」
        locator: {}
        spoiler_after: ch5049
      - event_ref: E_ch5049_トリシューラ_names_トライデント_p189
        quote: 「――使い魔の魔女、トライデント」
        locator: {}
        spoiler_after: ch5049
      - event_ref: E_ch5049_トリシューラ_says_自身の戦闘不能理由_p38
        quote: 『対して私は『杖』の魔女。この分野は基本的に呪具を事前に作って、戦闘時にはそれを運用することしかできないの。つまり手持ちの呪具が何にも無い、材料も無いこの状況じゃ役立たずってわけ』
        locator: {}
        spoiler_after: ch5049
      - event_ref: E_ch5049_トリシューラ_says_セスカの万能性への対抗_p45
        quote: 『本気で失礼だよ、もう！ 言っておくけど、セスカが万能過ぎるだけなの！ それに私だって『禁呪』が使えれば――』
        locator: {}
        spoiler_after: ch5049
      - event_ref: E_ch5049_トリシューラ_confesses_自身の混乱と不安_p76
        quote: 「あの、ちょっと私も混乱してて。予想してた状況と今が全然違ってて――なんか、不安で。でも、考えたらアキラくんはもっと不安だよね。そういうこと考えられなくて、その、ごめんなさい」
        locator: {}
        spoiler_after: ch5049
    action:
      observations:
      - event_ref: E_ch5049_トリシューラ_fights_アキラ_p93
        quote: '「ポンコツって言うなぁっ」

          いきなり立ち上がったトリシューラが勢いよく俺に掴み掛かってきた。躱すこともできたが、危険性を感じなかったのでそのまま腕を掴まれるに任せる。'
        locator: {}
        spoiler_after: ch5049
  first_appearance_candidate: true
