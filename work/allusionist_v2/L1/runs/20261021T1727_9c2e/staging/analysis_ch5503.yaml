    paragraph: p84-p93
    quote_verified: false
  note: オルヴァがシステムの「王」としてルールを守り勝利する一方、ガドールは「盤外プレイヤー」としてゲームの文法そのものを弄ぶ。これはメタフィクションとしての世界認識の対立である。
