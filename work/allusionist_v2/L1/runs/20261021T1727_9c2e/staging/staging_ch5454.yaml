      - event_ref: E_ch5454_ルウテト_other_天へ_p6869
        quote: '女神が歓びを歌うと、大勢のクレイたちが一斉に声を合わせてコーラスを奏で始める。背中から翼を生やした赤子となって飛び立つと、白い羽を宙に散らしながら喇叭を吹き鳴らし、空を踊り始めた。御使いに姿を変えた軍勢を従えて、女神は舞台を迫り上がらせて天へと昇っていく。

