- canonical_target: '[[E_char_シナモリアキラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5454_シナモリアキラ_thinks_自己拡張の危うさ_p136140
        quote: '自己を際限なく拡張する者――サイバネティクスを体現する紀人。

          それがシナモリアキラだが、その在り方は危うい。

          自己と定義できる範囲の拡張、それは同時に他者の包摂、侵食、蹂躙をも意味しかねない。虐殺、統合、民族浄化、教化、啓蒙――他者を自己に取り込み、拡張身体として捉える『使い魔』の視座。

          俺がいつの間にか手にしていたのは極めて悪質な権力だった。'
        locator: {}
        spoiler_after: ch5454
      - event_ref: E_ch5454_シナモリアキラ_trusts_外側の者たち_p171174
        quote: '俺は第五階層になったが、この世界の住人たちは俺など無くても生きている。

          それならきっと大丈夫だ。

          シナモリアキラに出来ないことは、外側の誰かが出来るだろう。

          俺はそう信じて、目を閉ざす。'
        locator: {}
        spoiler_after: ch5454
      - event_ref: E_ch5454_シナモリアキラ_other_アレッテ・イヴニルへの決着_p183187
        quote: '「これがお前との最初の決着だ。お前の倦怠と諦めは俺たちによって解体される。いずれかち合うアルト・イヴニルは俺たちの諦観が倒すだろう」

          俺は俺に向けて、そしてアマランサスに向けて、アレッテ・イヴニルに向けて宣言した。俺が戦うべき相手は、俺の中にある悪性。権力の危険性に他ならない。

          だからこそ、第五階層を脅かすルウテトは倒さねばならない。

          たとえ彼女が未来のコルセスカであっても。'
        locator: {}
        spoiler_after: ch5454
      - event_ref: E_ch5454_シナモリアキラ_other_ガロアンディアン_p232234
        quote: '「俺は第五階層ガロアンディアン――『転生させる者』、シナモリアキラだ」

          宣名により新しき神としての権能が更新され、再定義される。'
        locator: {}
        spoiler_after: ch5454
    action:
      observations:
      - event_ref: E_ch5454_シナモリアキラ_observes_プーハニア・トストンス_p149152
        quote: '舞台から外れた地下深く、牢獄の隅で膝を抱えた男を俺の意識が捉えた。

          プーハニア・トストンス。

          かつて俺の一部であり、狆くしゃ（カニャッツォ）でもあった虹犬の男。'
        locator: {}
        spoiler_after: ch5454
      - event_ref: E_ch5454_シナモリアキラ_other_サイバーカラテ道場_p180181
        quote: 'しかし――『サイバーカラテ道場』が最適化した『諦観』を、合理性のある選択肢として誰でも選びとれるツールにすることならできる。

          赤の他人、異質な他者、不快な隣人――それでも、便利な道具なら共有くらいはしてもいいだろう。だってその方が都合がいい。'
        locator: {}
        spoiler_after: ch5454
      - event_ref: E_ch5454_シナモリアキラ_activates_複合技_p190193
        quote: 'アマランサスと意識を重ね、左右の腕に特定の動作をするように指示を下す。

          アトリビュート。結ばれた印相は連続して二つ。

          一番と四番が並列起動し、ヘリステラとイストリンの呪力が重なり合う。

          これから試すのは複数の九姉を掌握したことで可能になった複合技だ。'
        locator: {}
        spoiler_after: ch5454
      - event_ref: E_ch5454_シナモリアキラ_other_出産の儀式_p207216
        quote: '「安心しろ俺、無痛分娩なので苦しみは無い――初めてだろうと恐れるな！」

          心を奮い立たせるために自分に言い聞かせるが、怖いものは怖い。

          ちょっと止めてよ不安になるから、と俺の怯えが伝染したのか内側で引き攣った声を出すアマランサス。申し訳無いがもう手遅れだ。実行まで秒読みだから覚悟を決めてくれ。俺はまだ心の準備が出来てない。

          儀式が始まる。呪術が執行される。結果はまるで見えてこない。

          うわ、うわ、なんかめっちゃ膨らんできた、腹が、腹が！

          パニック寸前の思考を『E-E』で制御しつつ、俺は孕んだ世界を強く意識する。

          これから俺は出産する。'
        locator: {}
        spoiler_after: ch5454
      - event_ref: E_ch5454_シナモリアキラ_other_ラプンシエル_p227229
        quote: '――異界継承者ラプンシエルはそうして誕生した。

          その瞬間、最古の地母神キュトスの欠片、姉妹の五十三番が確定。

          シナモリアキラは女神を孕み、産み落とした。'
        locator: {}
        spoiler_after: ch5454
    relationship:
      observations:
      - event_ref: E_ch5454_シナモリアキラ_other_プーハニアへの関与_p154162
        quote: '彼に俺から手を差し伸べることは、彼を飲み込むことでもある。

          退路の無い者に与えられた選択肢、それは選ばされるという強制だ。

          関わることはできない。だが見捨てていいのか？

          それはジレンマだった。

          プーハニアは俺にとっての希望だ。

          俺でないことを選べる、俺から抜けられる、俺を拒否できる。

          そんな彼が不幸な結末を迎えれば、『シナモリアキラを拒否すればああなる』という恫喝の材料になってしまう。

          彼は救われなくてはならない――だが手出しはできない。'
        locator: {}
        spoiler_after: ch5454
    symbolic:
      observations:
      - event_ref: E_ch5454_シナモリアキラ_defines_異世界転生の力_p203204
        quote: 'シナモリアキラが参照した九姉の力は、『転生』に関係した形で出力される。

          境界を、異世界を巡る力――それは『異世界転生』という意味を構築する。'
        locator: {}
        spoiler_after: ch5454
      - event_ref: E_ch5454_シナモリアキラ_other_転生を司る権能_p219
        quote: シナモリアキラは『第五階層という世界』となったことで転生母胎となる資格を得た。内包するアマランサスを新生させることで俺に『転生を司り、守護する』という権能が追加される。元々シナモリアキラは『転生させる者』だった。ならば殺して生み出す力――破壊と再生の権能を有するはず。
        locator: {}
        spoiler_after: ch5454
  first_appearance_candidate: true
- canonical_target: '[[E_char_レオ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5454_レオ_saves_プーハニア_p163166
        quote: 'どうしようもない焦燥感に駆られて歯噛みする俺の目の前で、牢獄の壁が轟音を立てて破壊された。

          救いはそこにあった。

          蝶翅の少女を脇に抱えた長髪長身の男が、拳ひとつで舞台を破壊して道を作ったのだ。彼の背後から遅れて歩いてくるのは、三角耳を頭に乗せた小柄な少年。

          ああそうだ、と思い出す。

          俺にはどうしようもないものを、彼らはああして救い出していく。

          レオ、カーイン、ついでにセージ。'
        locator: {}
        spoiler_after: ch5454
