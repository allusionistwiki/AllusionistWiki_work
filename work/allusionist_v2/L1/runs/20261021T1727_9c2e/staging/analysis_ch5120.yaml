    quote_verified: true
  expected_payoff: アキラが左手（おそらく金鎖や特殊な義手/神器）を獲得し再登場すること、およびアズーリアとの決定的な邂逅と対立・和解。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
