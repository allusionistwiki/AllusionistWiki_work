- kind: mystery
  name: MY_Helezequesh_Voice
  note: アズーリアが「不良」として知り合いの呪術師の言葉を借りて「神働術」を「呪術」と呼んでいる。この「知り合いの呪術師」や「アズーリア・ヘレゼクシュ」という名前の由来（特に後半部分）は、後の展開で彼が異世界の者（猫の国＝現代地球の日本人？）であることの伏線になる可能性が高い。
  quotes:
  - quote: 修道騎士でありながら神働術をあえて呪術なんて捉え方をしてしまう不良としては、知り合いの呪術師たちの言葉を借りてこのように表現してやりたい。
    paragraph: p16
    quote_verified: true
  - quote: アズーリア・ヘレゼクシュが語りて曰く、それは伽藍（カテドラル）のグロソラリア。
    paragraph: p17
    quote_verified: true
  expected_payoff: アズーリアが異世界人（日本人）であり、その知識や視点から見た宗教儀式への懐疑、および「ヘレゼクシュ」が日本の名前（例：ヘレセクス/ヘレクス等の変換、あるいは単なる命名）であることの回収。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_Missing_He_Akira
  note: 「彼」と呼ばれる人物（アキラ）が第五階層で消息不明であり、「裁かれたいという気持ち」の対象となっている。クナータの予知で「左手を得る」「生きている」と確定するが、その後の展開とアズーリアとの関係（対極にある手をとる）が重要な伏線となる。
  quotes:
  - quote: 裁く資格を持つただ一人は、一月前に第五階層という混沌の中に消えて、今もその消息が知れない。
    paragraph: p54
    quote_verified: true
  - quote: 'アキラは、この先、いつかの時点で、左手を得るのだ。

