- kind: theme
  theme: 物語の権威は事実そのものではなく、それを記述する語り手の信頼性によって構成される。
  weight: 0.9
  quotes:
  - quote: 私のような一人称系呪文使いにとっては、記述されたことだけが確かな現実。
