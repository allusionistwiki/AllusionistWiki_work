    quote_verified: true
  expected_payoff: ガルズが呪力を失い完全な死を迎える瞬間、またはそれによる劇的な逆転現象（例：アズーリアへの依存からの解放など）が描かれる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
