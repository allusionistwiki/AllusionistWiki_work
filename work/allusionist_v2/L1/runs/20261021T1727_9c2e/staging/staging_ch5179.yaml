- canonical_target: '[[E_char_アズーリア]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5179_アズーリア_other_語り手巨大な存在_p140142
        quote: '途方もなく巨大な存在が、私の中から離れていくような感覚。

          それは心地良い親の手から引き剥がされたような不安感をもたらしたけれど――やがてすぐに慣れた。'
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_アズーリア_other_スキリシア影の世界_p143149
        quote: 'どこまでも続く闇の中。

          頼りになるのは上空の夜月だけ。

          私は大いなる父祖にして太母たる存在に左手で簡素な礼を示して、青い翼をはためかせて天に昇っていく。'
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_アズーリア_other_サリア_p150155
        quote: 'やがて、私は待たせていた人の所に辿り着いた。

          「ごめんサリア。遅くなった」'
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_アズーリア_other_未来回想激痛と引き裂き_p180181
        quote: 'まるで銃を撃った時のミルーニャのように――あるいは未来を回想し過ぎた時のクナータのように、私は全身をずたずたに引き裂かれて血の海に沈んだ。

          頭の中に異物が入り込んだような激痛で動けなくなってしまって――サリアが助けてくれなかったら危ないところだった。'
        locator: {}
        spoiler_after: ch5179
    speech:
      observations:
      - event_ref: E_ch5179_アズーリア_other_ガルズ・マウザ・クロウサーとマリーへの接触_p316
        quote: 「ガルズ・マウザ・クロウサーとマリー。あの二人が倒される前に接触して、協力を仰ぐ」
        locator: {}
        spoiler_after: ch5179
  first_appearance_candidate: true
- canonical_target: '[[E_char_サリア]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5179_サリア_wears_漆黒の全身甲冑影の重武装_p166168
        quote: '探索者サリアの姿もまたこの影の世界では変化している。

          細いシルエットの漆黒の全身甲冑と、肩から背中へと流れる厚みのないマント。'
        locator: {}
        spoiler_after: ch5179
    speech:
      observations:
      - event_ref: E_ch5179_サリア_other_アズーリア時間遡行の隠蔽_p172
        quote: 「わかってるとは思うけど、世界からの反動が怖いから時間遡行したことはちゃんと誤魔化してね。不自然な言動は慎んで」
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_サリア_other_コア繋がり切断_p235239
        quote: 「その――今、ちょっと喧嘩してて『繋がり』切っちゃってるの。だからこっちの事も伝わりにくくなってるし――ちょっと怒らせちゃったからあっちも苛ついてるみたいで、どの周回でも口論みたいになって」
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_サリア_threatens_アズーリア鹿鍋にする_p257258
        quote: 「その結果がこれよ！　私の後悔の責任をとれっ！　このっ解体して鹿鍋にでもしてやろうか！　味が鶏肉に近いのかどうか確かめてやろうかっ」
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_サリア_other_コアを守る使い魔の立場_p264
        quote: 「そもそも、私は本来コアを守る使い魔なんだから。状況が切迫してるからといってもコアを頼るなんてできない。立場が逆でしょ」
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_サリア_other_アズーリア仲直り用プレゼント奢り_p278282
        quote: '「アズーリア、この状況を切り抜けたら仲直り用のプレゼント見繕うから付き合いなさい」

          「言うに決まってるでしょうが。まさかタダで時間遡行能力を盗めると思ったわけじゃないでしょ？」'
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_サリア_other_プリエステラ使い魔系統の典型自己犠牲_p288
        quote: 「要するに問題はあのプリエステラって子なわけよね。どの周回でも全員を守ろうとして自己犠牲に走る――仲間という関係性に至上の価値を見出す使い魔系統の典型。」
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_サリア_other_古き神の忠告話半分_p292296
        quote: '「古き神の言うことなんて話半分に聞いておいた方がいいわよ。

          あいつらは結局、人間を手駒にして自分の都合のいいように世界をねじ曲げたいだけ。」'
        locator: {}
        spoiler_after: ch5179
    relationship:
      observations:
      - event_ref: E_ch5179_サリア_other_アズーリアのため誇りと優しさ_p199205
        quote: '能力の制約ゆえに、誰にもその事実を打ち明ける事ができないまま。

          それが一度引き受けた依頼は必ず遂行するという一流の探索者としての誇りによるものなのか、彼女の優しさによるものなのか'
        locator: {}
        spoiler_after: ch5179
    action:
      observations:
      - event_ref: E_ch5179_サリア_attacks_アズーリア蹴り角を掴む_p249255
        quote: 'がしっと漆黒の籠手が私の角を掴んだ。

          そのまま私の足をしつこく蹴ってくる。軸足を開いて関節部を狙うしっかりとした下段蹴りである。'
        locator: {}
        spoiler_after: ch5179
