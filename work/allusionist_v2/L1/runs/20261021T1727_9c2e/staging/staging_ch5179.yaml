      observations:
      - event_ref: E_ch5179_語り手_other_アズーリア第五階層の民への責任_p107109
        quote: '第五階層に送り出したティリビナの民たちに、しっかりと気を配っておくんだ。

          いいかいアズーリア。

          関わったからには最後まで責任を持ちなさい。'
