        spoiler_after: ch5179
      - event_ref: E_ch5179_語り手_other_ガロアンディアンシナモリ・アキラ全員救うこと_p113
        quote: ガロアンディアンもシナモリ・アキラも、全員きちんと救ってあげなさい。
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_語り手_other_左手での言震の解体_p117
        quote: 君がプリエステラを救うことで定められてしまう時間流――その果てに待つ第五階層の言震を、見事その左手で解体してみせるがいい。
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_語り手_reveals_アズーリア依巫であること_p136137
        quote: '色々あったせいで、覚醒が少しばかり遅れてしまったけれど。

          君は紛れもなく、僕の依巫（よりまし）だ。'
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_語り手_names_アズーリアとクナータ狂人_p15
        quote: 'つまり、君たちは揃って狂人というわけさ。

          だからこそ、こんな事ができるわけだ。'
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_語り手_other_アズーリア_p23
        quote: 'やあ。

          また来たね、アズーリア。'
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_語り手_other_快哉ロディニオに対して_p22
        quote: 'いい気味だって思っただろ？

          実は僕もさ。'
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_語り手_other_アズーリア諦めること_p3435
        quote: 'というわけで、全知全能とは言わないまでも、それなりに万知万能である僕から可愛い子供たちの一人であるアズーリアに忠告だ。

          諦めなさい。'
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_語り手_other_アズーリアプリエステラを見捨てること_p4849
        quote: 'このどうしようもない繰り返しを抜け出す方法は一つだ。

          アズーリア。プリエステラを見捨てるんだ。'
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_語り手_other_キール隊の全滅との比較易しい状況_p53
        quote: '前と同じさ。

          いや、キール隊の全滅が必然だったのに対して、今回は一人の死だけが必然だから、まだ易しい状況とも言えるね。'
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_語り手_other_アズーリアの決意敵に回す覚悟_p5658
        quote: '仲間の為なら古き神であろうと敵に回すような子なんだ。

          たとえそれが自分の生みの親であっても関係は無いだろうと思ってはいたさ。

          もう止めないよ。'
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_語り手_other_アズーリアの犠牲_p66
        quote: アズーリア。君が犠牲になることは許さない。
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_語り手_other_フィリス浸食の不可逆性他神格からの干渉_p7677
        quote: 'フィリスに浸食されたぶんは巻き戻らないんだから。

          特異点としての性質が強まるから僕から力を引き出しやすくなるけど、他の神格からも干渉されやすくなるってことも覚えておいてくれよ。'
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_語り手_other_アズーリア後悔する未来_p8384
        quote: '後悔するよ、アズーリア。

          君は必ず後悔する。'
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_語り手_other_死よりも過酷な運命_p87
        quote: この先、君を待ち受けているのは、死よりも過酷な運命なんだよ。
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_語り手_other_アズーリアあり得ない手に縋ること_p9899
        quote: '危険を恐れず、今までやらなかった事をやってみなさい。

          あり得ない結果を生むために、一番あり得ない手に縋るんだ。'
        locator: {}
        spoiler_after: ch5179
    action:
      observations:
      - event_ref: E_ch5179_語り手_helps_アズーリア_p18
        quote: 思えばついこの間、僕が君を見つけた時にも諦めの悪い事をしていたよね。興味深かったから思わず手助けしちゃったけど。
        locator: {}
        spoiler_after: ch5179
      - event_ref: E_ch5179_語り手_other_ロディニオ_p19
        quote: 確かにえこひいきが過ぎるかもしれないね。ロディニオの向こうまで放逐してしまったのはちょっとやり過ぎだったかもしれない。
        locator: {}
        spoiler_after: ch5179
