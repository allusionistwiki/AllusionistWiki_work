- kind: mystery
  name: MY_two_versions_of_virgil
  note: レミルスが「ヴァージル様は二人いる」と明言し、正気の彼との遭遇を勧めている。現在の狂気的な姿と対比される「正気」の存在、およびその出現条件が未回収。
  quotes:
  - quote: 一つ、教えてあげます。『ヴァージル様は二人いる』――正気の彼と出会ったら、その機会を逃さないで
    paragraph: p164
    quote_verified: true
  expected_payoff: 後の展開で「正気」のヴァージルが出現し、物語の鍵（鍵となるのは『ヴァージル自身の物語』）を解くための対話相手として機能する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_history_manipulation_by_ritual
  note: ファルの記憶が曖昧になり、歴史書の詳細が思い出せなくなっている。「歴史そのものが歪んで」いる疑念。これは「なぞらえ」の儀式や再演によって過去が書き換えられている可能性を示唆する。
  quotes:
  - quote: 何故か鮮明に思い出すことができない。記憶に靄がかかったように――。
    paragraph: p51
    quote_verified: true
  - quote: これは何らかの記憶封鎖が、いや、歴史そのものが歪んで――？
    paragraph: p53
    quote_verified: true
  expected_payoff: 物語が進むにつれ、太陰の歴史やヴァージルの過去が意図的に改変・削除されていたことが判明し、それが「再演」のメカニズムと接続する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_key_to_virgils_narrative
  note: ファル（内的自我）が「鍵となるのは、きっと『ヴァージル自身の物語』だ」と分析している。彼が歴史に干渉されることを免れた特異点であるという設定。
  quotes:
  - quote: そうか。鍵となるのは、きっと『ヴァージル自身の物語』だ。彼一人だけが再演の舞台で歴史に干渉されることを免れた。それにはきっと意味がある――
    paragraph: p177
    quote_verified: true
  expected_payoff: ファルの「言理の妖精」能力が、ヴァージルの物語を操作・解体するための手段として機能し、決着への道筋を作る。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_yell_color_code_anomaly
  note: ヴァージルの瞳に「黄色い月の輝き」が明滅し、「黄の色号」と呼ばれる現象が起きている。これは異界や神々の呪法を示唆する未解明の異常事象。
  quotes:
  - quote: 血のような瞳に重なるように、黄色い月の輝きが明滅している。
    paragraph: p35
    quote_verified: true
  - quote: 「黄の色号――？　異界、いや神々の呪法？」
    paragraph: p37
    quote_verified: true
  expected_payoff: ヴァージルの精神崩壊のトリガー、あるいは高位存在（機械女王など）からの干渉の兆候として、物語後半で重要な役割を果たす。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_sword_of_judgement_choice
  note: 広間に出現した「僣主殺しの裁きの剣」が、ヴァージルとパーンのどちらを切るか選択しようとしている。この「権力の選定者」の判断基準や結果。
  quotes:
  - quote: 切っ先が選ぶのは、ヴァージルか、それともパーンか。
    paragraph: p222
    quote_verified: true
  expected_payoff: 戦闘の勝敗を決定づける神学的・運命的な介入として描かれ、「王になるための戦い」の結末を導く装置として機能する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
