    paragraph: p207-p208
    quote_verified: true
  - quote: 君たち夜の民は摸倣が得意なゆえに共感能力に優れる――これで僕の世界観を受け入れる準備ができたというわけだ。おめでとう。君は君自身の優しさゆえに死ぬ
    paragraph: p143
    quote_verified: true
  note: アズーリアの存在がガルズの否定的記述によって崩壊し、共感（模倣）が罠として機能した事実から導出。
