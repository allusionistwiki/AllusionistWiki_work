episode: ch5386
created: '2026-10-21'
status: pending_merge
entities:
- canonical_target: '[[E_char_レミルス]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5386_レミルス_fears_狂気のヴァージル_p101
        quote: 「正直、『あの』ヴァージル様は俺も恐ろしいです」
        locator: {}
        spoiler_after: ch5386
      - event_ref: E_ch5386_レミルス_other_英雄たちルウテト、六王_p105
        quote: 「でも、ジャッフハリム解放戦争で勇士たちと力を合わせて『呪祖』を倒した偉大な言語魔術師でもある。俺たちにとって『銀』の賢者ルウテト様と六王というのは、大昔の英雄ですから」
        locator: {}
        spoiler_after: ch5386
      - event_ref: E_ch5386_レミルス_names_十二賢者の正統後継_p117
        quote: 「権力というか、権威と尊敬を一身に集める方々です。かつて獅子王が従えていた十二賢者の正統なる後継、あるいは今も生き残っている本人たち。『上』の形だけ真似した十二賢者とはものが違う。何しろ獅子王の系譜に連なる貴種によって任命される本物です。」
        locator: {}
        spoiler_after: ch5386
      - event_ref: E_ch5386_レミルス_other_ヴァージルの天主化_p125
        quote: 「テララ様は役目を放り出してどこぞの異界で遊び暮らしてる。いっそルウテト様が『白銀』とでも名乗って『灰』の座を乗っ取ってしまえばいいんだ。そうしてヴァージル様が『黄』、いや『黄金』の天主を名乗れば良い具合に収まる」
        locator: {}
        spoiler_after: ch5386
      - event_ref: E_ch5386_レミルス_other_サイザクタート友人_p135
        quote: 「サイザクタートは、あいつらの家系はただ主に忠節を尽くしたいだけ。何かを守り通す事が番犬の誇りだから、俺はそれを否定したく無い」
        locator: {}
        spoiler_after: ch5386
      - event_ref: E_ch5386_レミルス_names_自分自身プラパーシュ_p153
        quote: 「もうグラッフィアカーネとは呼ばないで欲しい。レミルス。レミルス＝プラパーシュ。それが俺の名です」
        locator: {}
        spoiler_after: ch5386
      - event_ref: E_ch5386_レミルス_reveals_二人のヴァージルの存在_p164
        quote: 「一つ、教えてあげます。『ヴァージル様は二人いる』――正気の彼と出会ったら、その機会を逃さないで」
        locator: {}
        spoiler_after: ch5386
    relationship:
      observations:
      - event_ref: E_ch5386_レミルス_other_ファル_p19
        quote: イアテム率いる『眠れる三頭』らはレミルスがいる限りファルにちょっかいをかけてくることはなかった。
        locator: {}
        spoiler_after: ch5386
  first_appearance_candidate: true
- canonical_target: '[[E_char_クレイ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5386_クレイ_has_property_強靭な精神_p12
        quote: その上、この男は精神まで強靭だ。どれだけ痛めつけても屈服するということを知らない。
        locator: {}
        spoiler_after: ch5386
    action:
      observations:
      - event_ref: E_ch5386_クレイ_other_尋問_p9
        quote: もうひとりの囚われ人――クレイとかいう青年はどうやら敵勢力にとって重要な人物らしく、先ほどまでヴァージルの手駒となった『公社』の者たちによる責め苦を受け続けていた。
        locator: {}
        spoiler_after: ch5386
  first_appearance_candidate: true
- canonical_target: '[[E_char_ファルファレロ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5386_ファルファレロ_other_レミルスの決意_p149
        quote: 「僕は猟犬（グラッフィアカーネ）さんを止める言葉を持っていません。説得は諦めます。好きにしてください」
        locator: {}
        spoiler_after: ch5386
      - event_ref: E_ch5386_ファルファレロ_other_劣等感_p24
        quote: ファルは圧倒的な実力差に打ちのめされた。無力感に苛まれ、屈辱に視線が下がる。
        locator: {}
        spoiler_after: ch5386
      - event_ref: E_ch5386_ファルファレロ_names_黄の色号_p37
        quote: 「黄の色号――？　異界、いや神々の呪法？」
        locator: {}
        spoiler_after: ch5386
      - event_ref: E_ch5386_ファルファレロ_loses_歴史の記憶_p51
        quote: けれど、どうしてそうなったのか、歴史書にどのような詳細が記されていたのか、何故か鮮明に思い出すことができない。記憶に靄がかかったように――。
        locator: {}
        spoiler_after: ch5386
      - event_ref: E_ch5386_ファルファレロ_wounds_自身_p7
        quote: 中傷者（ファルファレロ）は歯噛みした。束縛された四肢は動かず、この機に逃げることすらできない我が身を呪う。されど呪詛に力は宿らず、ただの精神的自傷で終わるのみ。
        locator: {}
        spoiler_after: ch5386
    symbolic:
      observations:
      - event_ref: E_ch5386_ファルファレロ_has_property_永劫の呪詛_p15
        quote: ファルのアストラル体の深層には太陰の王妃が唱えた永劫の呪詛が刻まれており、彼が拷問によって屈しそうになった際には自動的に本人の脳を精神爆弾に変質させることになっている。
        locator: {}
        spoiler_after: ch5386
    name:
      observations:
      - event_ref: E_ch5386_ファルファレロ_is_made_of_アヴロノとウサギの混血_p43
        quote: ファルは太陰（イルディアンサ）における二大種族、『アヴロノ』と『ウサギ』の混血だ。ある意味で、現代の月を象徴する『ウサギ妖精』と呼ばれる存在。
        locator: {}
        spoiler_after: ch5386
    action:
      observations:
      - event_ref: E_ch5386_ファルファレロ_transforms_意識状態_p56
        quote: 半ば消えかかった意識が曖昧に溶けて、ファルは深い微睡みに落ちていく。
        locator: {}
        spoiler_after: ch5386
      - event_ref: E_ch5386_ファルファレロ_activates_言理の妖精_p70
        quote: '「言理の妖精――語りて、曰く」

          口の中で消えそうな呪文を呟く。

          そして少年は遡った。'
        locator: {}
        spoiler_after: ch5386
  first_appearance_candidate: true
