        quote: 「そうか。鍵となるのは、きっと『ヴァージル自身の物語』だ。彼一人だけが再演の舞台で歴史に干渉されることを免れた。それにはきっと意味がある――」
        locator: {}
        spoiler_after: ch5386
      - event_ref: E_ch5386_ファルおれ_other_決着と断章_p225
        quote: 「いいよ、パーンさん。ここで決着をつけよう。断章ごと僕のものにしてあげる」
        locator: {}
        spoiler_after: ch5386
    action:
      observations:
      - event_ref: E_ch5386_ファルおれ_uses_言理の妖精の呪文_p179
        quote: 俺は肩の関節を強引に外して縄抜けを試みる。激痛の中、ファルは意識に混じる複数の思考を感じていた。
        locator: {}
        spoiler_after: ch5386
  first_appearance_candidate: true
