  quotes:
  - quote: ステータス参照能力。転生者から奪ったと思われる、キロンの持つスキルの一つだ。多様なスキルを自在に習得していくことが可能であり、現在どんなスキル構成であるのか、想像もつかない。なにしろ階層の狭間に追放されている間、空間操作のスキルに習熟するための特訓をひたすらしていたはずなのだ。戦いに備えて、その他のスキルも上げている可能性がある。
    paragraph: p49
    quote_verified: true
