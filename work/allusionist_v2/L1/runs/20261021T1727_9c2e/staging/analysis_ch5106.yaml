- kind: mystery
  name: MY_mirror_phantom_arm_mechanism
  note: コルセスカの義肢の仕様。「幻肢を実体として操作する」「鏡の中の空間を高速で飛行」という記述が、物理法則を超えた呪術のルール（反射、虚像の実体化）を示唆しており、戦闘後の検証や改変で重要になる。
  quotes:
  - quote: 新たな右の義肢――コルセスカが生み出した呪術の義肢は、俺の幻肢を実体として操作する。
    paragraph: p103
    quote_verified: true
  - quote: 鏡の中の空間を高速で飛行していく右手が、掌を拡大させ、そのまま三つの火球をまとめて握りつぶす。それに従って、現実の世界では前触れもなくいきなり火球が消失。右腕の感覚を手元に引き戻すと、その周囲で氷が砕けていく。
    paragraph: p107
    quote_verified: true
  expected_payoff: この「鏡像空間」を利用した更なる応用攻撃や防御、あるいは鏡破壊による義肢機能停止リスクの顕在化。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
