  first_appearance_candidate: true
- canonical_target: '[[E_term_時]]'
  entity_type: terminology
  aspects:
    visual:
      observations:
      - event_ref: E_ch5408_時_other_大河_p103
        quote: '途端、鉄砲水のような時がクレイを押し流そうとする。

          死だ。

          大量の死が対岸が見えないほどの大河となってちっぽけな少年を飲み込もうとしていた。'
        locator: {}
        spoiler_after: ch5408
  first_appearance_candidate: true
- canonical_target: '[[E_char_船頭]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5408_船頭_asks_クレイ_p108
        quote: '十字に輝く瞳だった。

          「クレイ。お前は、いつ、どこで、誰によって生み出された？」'
        locator: {}
        spoiler_after: ch5408
  first_appearance_candidate: true
- canonical_target: '[[E_term_泡]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5408_泡_defines_試験_p11
        quote: 普段は神殿に保管されているが、例外として精鋭たる女王の近衛を選抜する試験の時にだけ解放されるという。
        locator: {}
        spoiler_after: ch5408
    symbolic:
      observations:
      - event_ref: E_ch5408_泡_other_洗礼_p155
        quote: 幾つかの宗教儀式では水底で洗礼を受けることで『生まれ直し』を演じることがある。海の民たちの信仰では海中で眠ることで夢の中でハザーリャ神と契約を結び、はじめて神の加護を得ることが出来る。クレイは微睡みの中で柔らかな誰かに抱きしめられていた。
        locator: {}
        spoiler_after: ch5408
  first_appearance_candidate: true
- canonical_target: '[[E_term_白い腕]]'
  entity_type: terminology
  aspects:
    action:
      observations:
      - event_ref: E_ch5408_白い腕_captures_船頭_p110
        quote: 時が凍り付く。水面から次々と白い腕が飛び出して、禁じられた問いを口にした船頭を川底へと引き摺り込む。
        locator: {}
        spoiler_after: ch5408
  first_appearance_candidate: true
- canonical_target: '[[E_char_嵐幻影]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5408_嵐幻影_other_クレイ_p116
        quote: 「滑稽だな。俺を斬るためにあるお前の舞いが俺に届くことはない。所詮は泥で捏ね上げた人形か。地の軛から逃れて飛躍することもままならんとは」
        locator: {}
        spoiler_after: ch5408
  first_appearance_candidate: true
- canonical_target: '[[E_char_影]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5408_影_asks_父_p125
        quote: 「我々はお前の父なのか？　それは正解であり、同時に不正解でもある。その問いには『答えは無い、今はまだ』というのが慎重な解答となり得るだろう」
        locator: {}
        spoiler_after: ch5408
      - event_ref: E_ch5408_影_asks_母_p137
        quote: 「死せる王子よ、王国の剣よ。お前の父は未だ定まらぬ王国の敵にして母権に叛逆する父権である。ならばその逆を考えてみよ」
        locator: {}
        spoiler_after: ch5408
  first_appearance_candidate: true
- canonical_target: '[[E_char_オルヴァ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5408_オルヴァ_says_時間差_p13
        quote: 「今がその時だ。クレイよ。お前はこの異界に流れる緩慢な時を感じているか？　この『泡』に我々が入って既に数刻が過ぎている。だが外では瞬きするほどの時間しか流れていないのだ。お前はこの地で終わりの無い虚無に向き合わねばならぬ」
        locator: {}
        spoiler_after: ch5408
      - event_ref: E_ch5408_オルヴァ_says_死の抱擁_p30
        quote: 「お前はここを出すことはできん。入ったら最後、何人たりとも逃がさない死の抱擁――それこそが『死の女王島』の由来よ。光を超えて走るか、世界を引き裂くか、はたまた時を渡るか――神の領域に足を踏み入れることができなくば、この島そのものに囚われたまま大地と同化していくであろう――見よ、お前の足下を！」
        locator: {}
        spoiler_after: ch5408
      - event_ref: E_ch5408_オルヴァ_says_助言_p40
        quote: 「ひとつだけ助言を授けよう。流れる時を大河と思え。世界の広がりをそこから分かたれた支流と考えよ。お前はこの地に降り立った時、確かに源流からこの支流へと移ったのだ――であれば、お前は水の流れに逆らわねばならぬ」
        locator: {}
        spoiler_after: ch5408
    visual:
      observations:
      - event_ref: E_ch5408_オルヴァ_transforms_姿_p18
        quote: 否、老人に見えた人物は次の瞬間にはあどけない少年へ、また次の瞬間には病的に線の細い青年へと変貌する。だが、いかに年齢が混濁していようともその十字の瞳に蓄積された老いは隠しようがない。更に言えば、緩やかに波打つ白髪――あるいは黒髪が暴風のなかで揺れることすら無いことは異様の一言に尽きた。
        locator: {}
        spoiler_after: ch5408
    action:
      observations:
      - event_ref: E_ch5408_オルヴァ_wounds_クレイ_p27
        quote: '打擲の音が響く。

          小さな手がクレイの頬を打ち据えたのだ。'
        locator: {}
        spoiler_after: ch5408
      - event_ref: E_ch5408_オルヴァ_disappears_クレイ_p48
        quote: 会話は成立していなかった。オルヴァはクレイの問いには答えることなく、謎めいた言葉を残して忽然と消え失せた。
        locator: {}
        spoiler_after: ch5408
  first_appearance_candidate: true
- canonical_target: '[[E_char_クレイ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5408_クレイ_other_答え_p140
        quote: '森の女王に仕える為、試練を乗り越えんとする少年は即答しようとして、口が動かないことに気付いた。

          自明であるはずだ。はずなのに。'
        locator: {}
        spoiler_after: ch5408
      - event_ref: E_ch5408_クレイ_other_苛立ち_p20
        quote: 相対する子供はともすれば少女にすら見えてしまいそうなほどの美貌と艶やかな長い黒髪を持ちながら、その表情、言動共に負けん気の強い少年そのものだ。鋭い瞳には年长者への苛立ちと侮りが浮かんでおり
        locator: {}
        spoiler_after: ch5408
      - event_ref: E_ch5408_クレイ_other_恐怖_p32
        quote: いつになく厳かなオルヴァの声にクレイの未発達な身体が震え、不可視の呪力に強制されるように無理矢理に顔が下を向く。幼い顔が驚愕と恐れに引き攣った。
        locator: {}
        spoiler_after: ch5408
      - event_ref: E_ch5408_クレイ_other_無明の闇_p73
        quote: 循環し続ける荒行に終わりは無く、しかし疲労することも無く少年はひたすら舞い続ける。やがてクレイの瞳から光が消え、無明の闇が訪れる。舞いは終わらぬまま、昂ぶった精神がふっと蝋燭を吹き消したように静まったのだ。
        locator: {}
        spoiler_after: ch5408
    speech:
      observations:
      - event_ref: E_ch5408_クレイ_says_要求_p15
        quote: 「黙れ爺。青ざめた騎手や純潔の巫女どもにできて俺にできないわけがあるか。さっさと試験を始めろ」
        locator: {}
        spoiler_after: ch5408
      - event_ref: E_ch5408_クレイ_names_宣名_p184
        quote: '俺は誰だ。問い直す。

          クレイは、宣名を行う。

          「俺はクレイ。『死人の森』の剣である、ただのクレイだ」'
        locator: {}
        spoiler_after: ch5408
      - event_ref: E_ch5408_クレイ_says_野望_p23
        quote: 「こんな試練、さっさと乗り越えてやる。俺は本当ならすぐにでも母上の――陛下のお役に立てるんだ。そしたらお前ら六王なんかお役御免だ」
        locator: {}
        spoiler_after: ch5408
      - event_ref: E_ch5408_クレイ_thinks_目的_p53
        quote: '母のことを。主君と仰ぐ女王のことを。

          全ては彼女の力になるために。

          王国の剣としてふさわしい力を身につけるために。'
        locator: {}
        spoiler_after: ch5408
      - event_ref: E_ch5408_クレイ_defines_舞い_p56
        quote: '彼にとっての舞いとは、剣であることと同義だった。

          修練は刃を研ぐことに等しい。'
        locator: {}
        spoiler_after: ch5408
      - event_ref: E_ch5408_クレイ_thinks_美意識_p85
        quote: クレイは密かに鏡の前に立つたび、己の美貌の平均点を100点満点中の95点だと判断していた。馬鹿者と違って謙遜を知っていたからだ。
        locator: {}
        spoiler_after: ch5408
    action:
      observations:
      - event_ref: E_ch5408_クレイ_other_時間逆流_p186
        quote: 時間を巻き戻すような舞い。ぐるぐると荒れ狂う孤島を巡り、少年は最初に抱いた決意へと立ち返るように最初の地点へと移動していく。
        locator: {}
        spoiler_after: ch5408
      - event_ref: E_ch5408_クレイ_other_閉眼舞い_p255
        quote: 'クレイは目を閉じたまま舞おうとしている。

          「まともに踊れるはずがない」'
        locator: {}
        spoiler_after: ch5408
      - event_ref: E_ch5408_クレイ_wounds_ファウナ_p263
        quote: '黄金の一房が散って舞う。

          離れた場所に佇むファウナの髪が切断されたのだ。'
        locator: {}
        spoiler_after: ch5408
      - event_ref: E_ch5408_クレイ_other_ライブ_p311
        quote: 再び会場が盛大に沸いて、勝敗を告げるアナウンスが響く。
        locator: {}
        spoiler_after: ch5408
      - event_ref: E_ch5408_クレイ_takes_カード_p326
        quote: 'クレイの指先が『黄金』のカードに触れる。

          カードに封じられたドレスが反応し、まばゆい光が溢れ出した。'
        locator: {}
        spoiler_after: ch5408
      - event_ref: E_ch5408_クレイ_other_試練_p66
        quote: '襲い来る異形の怪物、降り注ぐ血の雨、硝子混じりの嵐、ひっきりなしに起こる地震と爆発的な噴火。そうした無数の暴力を潜り抜けるだけではまだ足りず、クレイはひたすらに一種の苦行を繰り返す。

          少年は舞っていた。'
        locator: {}
        spoiler_after: ch5408
      - event_ref: E_ch5408_クレイ_fights_幻影の槍使い_p91
        quote: クレイは咄嗟に手刀で受け流すと、そのまま踏み込んでもう片方の手を突き入れる。
        locator: {}
        spoiler_after: ch5408
  first_appearance_candidate: true
- canonical_target: '[[E_org_冬の騎手]]'
  entity_type: organization
  aspects:
    visual:
      observations:
      - event_ref: E_ch5408_冬の騎手_appears_クレイ_p170
        quote: '女王の近衛兵であり、クレイがその頂点を目指す王国の剣。

          輝く青い目、長身痩躯、美しい貌、冷たい冬の気配と共に現れる彼らはひとり一人が最精鋭である。六王を除く『死人の森』の兵力では最強と謳われ'
        locator: {}
        spoiler_after: ch5408
      - event_ref: E_ch5408_冬の騎手_has_property_弱点_p171
        quote: 彼らが手に持つのは光を反射する氷の棍棒。雪の結晶に似た鎧を身につけており、青銅や黒曜石製のまじないが込められた武器では傷つけることができず、人の手で鍛え上げられた鋼鉄や落雷以外によって熾された炎でのみ倒せるという。
        locator: {}
        spoiler_after: ch5408
  first_appearance_candidate: true
- canonical_target: '[[E_char_ファウナ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5408_ファウナ_other_黄金のドレス_p189
        quote: ロープのようなねじり編みの金髪に白や薄桃色の花を飾るファウナの姿はさながら頭に花冠を戴く神話の女神のよう。
        locator: {}
        spoiler_after: ch5408
    action:
      observations:
      - event_ref: E_ch5408_ファウナ_other_拍手_p309
        quote: '沈黙。

          最初に拍手を送ったのはファウナだった。

          そしてそれが全ての結論を示していた。'
        locator: {}
        spoiler_after: ch5408
    speech:
      observations:
      - event_ref: E_ch5408_ファウナ_loses_クレイ_p314
        quote: 「理由は不明だが、ファウナの閉じられた瞼の内には既にクレイのダンス、その理想型が存在していたようだ。
        locator: {}
        spoiler_after: ch5408
  first_appearance_candidate: true
- canonical_target: '[[E_term_海神ハザーリャ]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5408_海神ハザーリャ_other_悪夢_p2
        quote: 荒れた海を指して『わだつみ（ハザーリャ）が悪夢を見ている』と形容することがある。
        locator: {}
        spoiler_after: ch5408
    visual:
      observations:
      - event_ref: E_ch5408_海神ハザーリャ_other_嵐_p3
        quote: その日の海神はよほどたちの悪い夢に苛まされていたと見え、彼方からは巨人がうなされているかのような雷鳴が轟き、湿気った空気がごうごうと吹き付けてきていた。寄せては返す大波が断崖に叩きつけられると島全体を揺さぶるかのような衝撃が走り
        locator: {}
        spoiler_after: ch5408
  first_appearance_candidate: true
- canonical_target: '[[E_char_ゼド]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5408_ゼド_other_判官贔屓_p201
        quote: 「助け舟だ。『判官贔屓』というやつさ。修行したという回想を挿入してクレイをクレイ自身の力で勝たせる――これはフェアな肩入れだろう。少なくともイカサマじゃあない。」
        locator: {}
        spoiler_after: ch5408
      - event_ref: E_ch5408_ゼド_names_価値観_p213
        quote: 「この世の全ては二種類に分けられる。盗めるものと盗めないもの――価値あるものと無価値なものだ」
        locator: {}
        spoiler_after: ch5408
  first_appearance_candidate: true
- canonical_target: '[[E_term_世界]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5408_世界_other_書き換え_p272
        quote: （物理的にはそんなことできるはずないんだけどね。厳密に言えば、手刀で発生した風圧が遠くにいるファウナを切り裂くというリアリティレベルに世界が書き換えられたんだよ。世界への干渉と自己への確信、双方向の邪視を同時に使ってる）
        locator: {}
        spoiler_after: ch5408
  first_appearance_candidate: true
- canonical_target: '[[E_term_観客]]'
  entity_type: terminology
  aspects:
    visual:
      observations:
      - event_ref: E_ch5408_観客_other_熱狂_p282
        quote: 歓声は爆撃に似て、戦禍を被った人々が燃え上がる魂を晒して大量の死を渇望した。クレイの熱狂的な女性ファンたちによる『殺して』コール。
        locator: {}
        spoiler_after: ch5408
  first_appearance_candidate: true
- canonical_target: '[[E_org_冬の騎手幻影]]'
  entity_type: organization
  aspects:
    action:
      observations:
      - event_ref: E_ch5408_冬の騎手幻影_helps_クレイ_p300
        quote: クレイの全身全霊のライブに呼応した冬の騎手たちは、王子を勝利に導くためにバックダンサーとして馳せ参じたのだ。
        locator: {}
        spoiler_after: ch5408
  first_appearance_candidate: true
- canonical_target: '[[E_item_カード]]'
  entity_type: item
  aspects:
    action:
      observations:
      - event_ref: E_ch5408_カード_other_クレイ_p332
        quote: '弾かれたようにクレイの手から零れ落ちるカード。

          床に落ちた黄金のドレスは、クレイを拒絶するように沈黙していた。'
        locator: {}
        spoiler_after: ch5408
  first_appearance_candidate: true
- canonical_target: '[[E_term_島]]'
  entity_type: terminology
  aspects:
    visual:
      observations:
      - event_ref: E_ch5408_島_other_人面_p36
        quote: '荒れた土に浮かぶのは、無数の人面、人面、人面。

          隆起する木の根は手足、石ころは骨。

          島から出る事ができなかった永遠の囚われ人たちが、死ぬ事すらできぬままこの島の大地と成り果てているのであった。'
        locator: {}
        spoiler_after: ch5408
      - event_ref: E_ch5408_島_has_property_補給不要_p63
        quote: 終わりの無い荒天の中で昼夜の区別などあってないようなものであり、眠りと水を支配する神の権能に守られたこの島で余分な補給などは不要である。
        locator: {}
        spoiler_after: ch5408
  first_appearance_candidate: true
- canonical_target: '[[E_term_森]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5408_森_is_located_異界_p5
        quote: 古くより夜や森、海や島というものは現世から切り離された異界であると見なされてきた。喩えであっても『異界である』と認識され続けたそこは異界も同然。人の手が入らない剥き出しの自然には様々な異形の次元が引き寄せられ、ありとあらゆる怪物が跋扈する暗黒の土地へと変貌していく。
        locator: {}
        spoiler_after: ch5408
  first_appearance_candidate: true
- canonical_target: '[[E_term_死の女王島]]'
  entity_type: terminology
  aspects:
    name:
      observations:
      - event_ref: E_ch5408_死の女王島_names_孤島_p7
        quote: 異界を孕むその孤島は『死の女王島』と呼ばれていた。
        locator: {}
        spoiler_after: ch5408
  first_appearance_candidate: true
- canonical_target: '[[E_char_クレイの精神]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5408_クレイの精神_other_遊離_p77
        quote: '彼の肉体は現世にあって現世に無く、彼の心は幽世にあって幽世に無い。

          荒天で舞い続ける風のように、クレイは嵐そのものと同化する。

          肉体から遊離した少年の精神はここではない何処かに立っていた。'
        locator: {}
        spoiler_after: ch5408
  first_appearance_candidate: true
- canonical_target: '[[E_char_幻影の男たち]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5408_幻影の男たち_other_六王_p79
        quote: '暗闇。無限の時のなか、入れ替わり立ち替わり美貌の男たちが現れる。

