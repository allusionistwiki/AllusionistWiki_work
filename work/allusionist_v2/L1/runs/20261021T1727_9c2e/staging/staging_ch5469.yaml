        locator: {}
        spoiler_after: ch5469
      - event_ref: E_ch5469_シナモリアキラ_says_第七世界槍_p252
        quote: 「点穴、情勁、いや七情掌法か。さては娘、その技は第七世界槍で磨いたものだな」
