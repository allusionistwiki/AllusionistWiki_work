        locator: {}
        spoiler_after: ch5469
      - event_ref: E_ch5469_シナモリアキラ_uses_ロケットパンチ_p164
        quote: 腕から聞こえる自動音声が「弾道予測計算アプリ『弾道予報Ver3.0』を起動します」と宣言
