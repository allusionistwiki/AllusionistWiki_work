      - event_ref: E_ch5017_アズーリア_says_さよなら_p226
        quote: '「ごめんね。さよなら」

          幼い子供に詫びるかのような哀切を含んだ口調だった。'
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アズーリア_promises_墓前への花_p230
        quote: 「墓前には、テールと同じ花を供えます。それでいいんでしたよね」
        locator: {}
        spoiler_after: ch5017
    action:
      observations:
      - event_ref: E_ch5017_アズーリア_thinks_感情の爆発_p141
        quote: 'アズーリアは、俺のように感情を抑制しているわけじゃない。

          「あああああああっ！！」

          アズーリアの中のそうした感情が、一斉に爆発した。'
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アズーリア_fights_敵_p142
        quote: 振り回された鈍器が縦横無尽に空間を制圧し、盾を、槍を、槌矛を打ち払っていく。その小柄さが錯覚であるかのように、野獣めいた激しさで攻め立てる。
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アズーリア_kills_月マフス・キール_p224
        quote: '同時に、アズーリアの方でも決着がついていた。

          槌矛が『月』にめり込み、甲冑を返り血が染めていた。'
        locator: {}
        spoiler_after: ch5017
