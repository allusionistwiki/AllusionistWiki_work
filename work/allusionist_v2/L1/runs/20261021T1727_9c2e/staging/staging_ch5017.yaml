        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_エスフェイル_suspects_嘘_p73
        quote: 『――嘘だな。貴様は嘘をついている。それは私を誘う罠だろう？』
        locator: {}
        spoiler_after: ch5017
    visual:
      observations:
      - event_ref: E_ch5017_エスフェイル_appears_as_月_p84
