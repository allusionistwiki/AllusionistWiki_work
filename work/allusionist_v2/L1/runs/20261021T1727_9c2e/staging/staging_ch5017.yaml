episode: ch5017
created: '2026-10-21'
status: pending_merge
entities:
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5017_アキラ_says_肉体破壊の快楽_p10
        quote: そういう連中の肉体を破壊して、身体が脆かったためにお前は負けたのだ、と言ってやることが、この俺の最大の楽しみである。
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_thinks_仲間たちの死_p102
        quote: 'そして、およそ50分近い時間を、どうして皆が逃げ切れたなんて信じられた？

          エスフェイルの「まずは一人目」なんて言葉を、馬鹿正直に信じる根拠は何処にあった？'
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_asks_助ける方法_p112
        quote: 「一応訊いておくけど、彼らを助ける方法は」
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_thinks_破壊の必要_p116
        quote: '「ゾンビ化した人類は物理的に破壊するしかない」

          殺すしか無い、ということだ。'
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_thinks_サイバーカラテとの対比_p145
        quote: 感情の昂ぶりを力に換えるあのような戦い方はサイバーカラテの理念とは反するが、有効であることは認めざるを得ない。
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_says_参戦の理由_p158
        quote: '「一緒に戦っている時から思っていたんだ。こいつらと戦ってみたいってな。身勝手な理由とは承知だが、参戦させてもらう」

          「否定はしない。悪いがこのまま前を頼む」'
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_thinks_自転車との類似性_p18
        quote: この感覚はそう、自転車の乗り方を覚えたあの時。補助輪を外して、自分がちゃんと走れているのか不安になった、あの瞬間にそっくりだ。
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_thinks_盾の機能_p186
        quote: '防ぐ、弾く、殴る、あるいは押さえ込む。

          そして、それ以外にもう一つ。

          開く。攻撃を外側へ受け流す事で隙を作り出し、反撃へと繋げる動き。'
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_thinks_テールの人柄_p201
        quote: 頼りになる前衛。それでいて、親しい者の死に調子を崩すような、ごく当たり前の弱さを抱えた人間。
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_says_胸当ての贈与_p218
        quote: '「なあ、覚えているか」

          「この胸当ては、あんたにもらったんだ」'
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_thinks_博打_p24
        quote: 『サイバーカラテ道場』無しでの実戦は、実は初めてだ。他の格闘支援系アプリを試してみた時は例外だが、結局『サイバーカラテ道場』に戻ってきた。
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_thinks_能力低下の理由_p28
        quote: 集合知からなる最適な動作――そのパターンを参照できなくなるがゆえに、確実に俺の戦闘能力は低下し、最も合理的な行動からは遠ざかっていく。
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_thinks_型の再現_p30
        quote: それでも、今までになぞったことのある『型』ならば再現できる。そして俺の肉体にできることならば、理論上は『サイバーカラテ道場』がなくともなぞることが可能だ。
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_thinks_E-Eの重要性_p37
        quote: 実の所、サイバーカラテにおいて最も重要なのは『サイバーカラテ道場』ではなく感覚・感情制御アプリである『E-E』の方なのだ。
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_thinks_心の土台_p41
        quote: だが土台となる心が崩れれば他の二つも成り立たぬ。
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_thinks_影の罠_p47
        quote: 最後の一本は俺とアズーリアの影が交差する地点からまっすぐにアズーリアへと伸びていく。この攻撃を誘うために、あえて二人の影が重なるように立っていたのだ。
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_thinks_弱者の蹂躙_p6
        quote: 恐怖を、不安を、苦痛を、耐え難いことを耐えられなかった人間は、心の強い人間に蹂躙されるしかない。彼らは勝利の後こう言い放つのだ。心が弱かったためにお前は負けたのだ、と。
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_says_まぐれ_p71
        quote: 「まあ実を言えばまぐれだよ。もう一度同じ事をできる自信は無い」
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_thinks_月の正体_p89
        quote: '空に浮かぶ月が消えていた。いや、月だと思っていたものが、だ。

          縮尺も高度も本来の月のものではなかった。これはエスフェイルが操る『何か』だ。'
        locator: {}
        spoiler_after: ch5017
    symbolic:
      observations:
      - event_ref: E_ch5017_アキラ_thinks_左手の気力_p124
        quote: 光すら飲み込んでしまいそうな闇をたたえていたにも関わらず、確かな熱を宿していた、あの奇妙な左手が、俺の右手に気力を注ぎ込んでくれているような気がした。
        locator: {}
        spoiler_after: ch5017
    action:
      observations:
      - event_ref: E_ch5017_アキラ_arrives_広場_p19
        quote: 最初の広場に辿り着く。あの手品師の痕跡らしき血痕が飛び散っているが、今は関係無い。
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_defeats_テール_p198
        quote: '盾の防御と槌矛の反撃を潜り抜けた、肘打ちの二連打。槌矛の攻撃を完全に見切った上で、前に出ることで攻撃と回避を同時に行ったのだ。

          肘の向こうに、頭部を砕かれたテールの残骸がある。'
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_gives_アズーリア_p21
        quote: アズーリアを下ろして、すぐ傍で待機してもらう。
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_kills_トッド_p222
        quote: 右腕が閃き、トッドの顔が存在した場所から鮮血が流れていく。
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_activates_Dopplerと弾道予報Ver2.0_p44
        quote: 『Doppler』が攻撃の前兆であるかすかな音を捉え、続いて『弾道予報Ver2.0』が作動。俺に向かって複数の赤いラインが伸びる。
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_takes_黒棘_p49
        quote: 下から飛び上がってくる黒棘に、すくい上げるような動きで右手を沿え、掴み取る。
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_アキラ_uses_聴勁_p54
        quote: '聴勁。棘の中にはたらく力の流れ、筋骨の動きを感じ取る。脚であることを確信した俺は、その流れを『化かして』いく。

          指と手の平、手首の関節の繊細な動きによって力の向きを化かされた黒棘は、勢いはそのままに、三方向から飛来するうちの一本に向けて再度射出される。'
        locator: {}
        spoiler_after: ch5017
  first_appearance_candidate: true
