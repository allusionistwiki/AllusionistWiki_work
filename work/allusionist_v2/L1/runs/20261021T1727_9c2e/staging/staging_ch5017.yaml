- canonical_target: '[[E_char_テール]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5017_テール_other_盾_p169
        quote: 腕の防御が薄い箇所を狙ったのだが、異形の『月』の表面を滑って腕の一本が移動する。盾による防御。傷だらけだが、未だに原形をとどめているそれは正確に俺の一撃を跳ね返した。この正確な防御には覚えがある。
        locator: {}
        spoiler_after: ch5017
      - event_ref: E_ch5017_テール_attacks_アキラの左腕欠損_p188
        quote: テールの盾が俺の右腕を外側に押し流し、俺の真正面ががら空きとなる。左腕が無いという明白な弱点。右半身を前に出さざるを得ないということは、その体勢を崩してしまえば一気に不利になるということ。
        locator: {}
        spoiler_after: ch5017
  first_appearance_candidate: true
- canonical_target: '[[E_term_精神強者論]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5017_精神強者論_defines_痛覚遮断の否定_p2
        quote: こういうとき、心の成長とか精神の強さとかを礼賛するタイプの人間は、感覚・感情制御アプリの使用を停止するのだろう。痛みは耐えればいい、恐怖は克服すればいい、という理屈によって。
        locator: {}
        spoiler_after: ch5017
  first_appearance_candidate: true
- canonical_target: '[[E_char_トッド]]'
  entity_type: character
  aspects:
    action:
      observations:
