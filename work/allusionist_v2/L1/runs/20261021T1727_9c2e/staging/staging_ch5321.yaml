        quote: 'ちびシューラによる肯定。店員さんのことをブルーと呼んでいるが、なんでもアストラルネット上の知り合いでハンドルネーム的なものだとか。

          ついでにトリシューラのハンドルがノーレイだということを教えて貰った。'
        locator: {}
        spoiler_after: ch5321
      - event_ref: E_ch5321_ちびシューラ_other_トライデントの構造と弱点_p187196
        quote: '（それこそがトライデントの強さにして同時に弱さだから。数が多く、多様性があり、複数の意思を内包しているが故に、一枚岩じゃないという、ね）

          言われてみれば、それはあまりにも分かり易すぎるトライデント勢力の欠点。

          人が集まればそこには利害関係が生まれ、自然と派閥が生じて対立が起こる。'
        locator: {}
        spoiler_after: ch5321
  first_appearance_candidate: true
- canonical_target: '[[E_relation_クレイ]]'
  entity_type: relationship
  aspects:
    visual:
      observations:
      - event_ref: E_ch5321_クレイ_other_周囲_p131135
        quote: 'ふと、俺と同じように壁際で寡黙に佇んでいる姿が目に留まった。後頭部で束ねた長い黒髪、刃のような眼光。

          ルウテトの部下、手刀使いのクレイ。

          彼は俺と似たような佇まいだが、馴染めないのではなく馴染もうとしていない――というより、積極的に場の空気に対して壁を作っているように見えた。'
        locator: {}
        spoiler_after: ch5321
      - event_ref: E_ch5321_クレイ_other_六王たち_p143147
        quote: 'そして何より気になることがもうひとつ。

          彼のあまりにも鋭い視線。

          気のせいでなければ、あれは殺意や敵意に類するものだ。

          そして、それは六王たちに向けられてはいなかったか。

          波乱の予感じみたものを感じつつ、俺は周囲に流されるように移動する。'
        locator: {}
        spoiler_after: ch5321
  first_appearance_candidate: true
