        quote: 「人形師といえばバーンステイン！ 松明の騎士団前十三位、ヨミル・バーンステインは下手すると守護の九槍に匹敵しかねない怪物で、一個師団クラスの戦力！
          そしてペレケテンヌルの祝福者な変態さんだよ！」
        locator: {}
        spoiler_after: ch5321
      - event_ref: E_ch5321_トリシューラ_other_槍神教の衰退と反槍神教勢力_p297301
        quote: 「地上を支配していた槍神教という権威が弱まってるんだよ。こないだのガルズによるテロは失敗こそしたけど、槍神教が抱える騎士修道会に打撃を与えたという点ではインパクトが大きかったの。各地で抑え付けられていた反槍神教勢力が動き出してもおかしくないかなーって」
        locator: {}
        spoiler_after: ch5321
    action:
