        spoiler_after: ch5321
      - event_ref: E_ch5321_アキラ_observes_トリシューラとルウテトの仲の悪さ_p68
        quote: '壮絶な口喧嘩からしばらく経過して。

          トリシューラとルウテトは、俺の方を見て揃って眉根を寄せていた。

          あまりの仲の悪さを見かねて、何か共通の話題とか無いのか、と口にした結果がこれだった。'
        locator: {}
        spoiler_after: ch5321
  first_appearance_candidate: true
- canonical_target: '[[E_term_コルセスカ]]'
