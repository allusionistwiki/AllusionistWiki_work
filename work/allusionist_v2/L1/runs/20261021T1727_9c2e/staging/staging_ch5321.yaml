- canonical_target: '[[E_relation_ルウテト]]'
  entity_type: relationship
  aspects:
    speech:
      observations:
      - event_ref: E_ch5321_ルウテト_other_アキラの外見_p1216
        quote: '「そうですね。私も昔はこういう美形さんも好ましいと感じていましたし、今も嫌いではないですけど、何かアキラ様とは違うような。髪型も、今は前髪長めですが、短めにしておくほうがいいような気がします」

          「どえむ？ よく分かりませんが、目つきがまっすぐで姿勢もいいわけですし、質実剛健みたいな雰囲気を出していきたいですよね。今のはちょっと軽薄で浮ついた感じがしてしまいます」'
        locator: {}
        spoiler_after: ch5321
      - event_ref: E_ch5321_ルウテト_other_マラード_p2630
        quote: '「あら、マラード。勝手に出てきてはダメですよ」

          「はいはい、いい子。おべっかはいいですから本題に入ってね」'
        locator: {}
        spoiler_after: ch5321
      - event_ref: E_ch5321_ルウテト_other_トリシューラの指摘_p4
        quote: 「それに関しては、ある程度同意できるかもしれません」
        locator: {}
        spoiler_after: ch5321
      - event_ref: E_ch5321_ルウテト_other_マラード_p5658
        quote: '「はい、よくできましたねー。えらいえらい」

          マラードはルウテトの指先で頭を優しく撫でられて嬉しそうに表情を緩めている。噛み合っているのだか噛み合っていないのだかよくわからん。'
        locator: {}
        spoiler_after: ch5321
  first_appearance_candidate: true
