- canonical_target: '[[E_char_マラード]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5321_マラード_appears_ルウテトの髪から_p2324
        quote: '出し抜けに涼しげな男の声がした。

          ルウテトの髪の中から小さな半透明の影が現れる。煌めく長い髪、野性的な稚気を残した瞳、あるがままの高貴さを孕んだ圧倒的な美貌。簡素にデフォルメされてはいるが、それは紛れもなく。'
        locator: {}
        spoiler_after: ch5321
    speech:
      observations:
      - event_ref: E_ch5321_マラード_other_ルバーブ_p32
        quote: 「う、うむ。では我が従僕ルバーブよ、道具の準備を！」
        locator: {}
        spoiler_after: ch5321
      - event_ref: E_ch5321_マラード_other_ラフディ人の技量_p50
        quote: '「本来は、長く豊かな髪をどう彩るか、というのが我らの技量が最も問われる点なのだが、たまにはこういう簡素な仕事も悪くない」

          散髪しながら会話したところによると、ラフディ人は皆これくらい当たり前にこなせるらしい。'
        locator: {}
        spoiler_after: ch5321
      - event_ref: E_ch5321_マラード_other_ルウテト_p54
        quote: 「ふ、また華麗すぎる俺を見せてしまった。ああ、姫よ。皆まで言わずともわかっている。我らの想いは一つ。だが、苛烈な宿命の糸は人形劇の幸福な結末を許してはくれないのだ。それでもなお、障害ゆえに燃え上がる情熱がここに！」
        locator: {}
        spoiler_after: ch5321
    action:
      observations:
      - event_ref: E_ch5321_マラード_other_アキラの髪_p4648
        quote: 'ルバーブが用意立てた散髪用の鋏をくるくると回しながら、マラードが俺の背後に移動する。俺はといえばその辺にあった椅子に座らされ、首の回りに髪が落ちてもいいように白い布をかけられていた。

          若干の不安を感じたが、マラードの手付きは危なげがなかった。自分よりも大きな頭部の周囲を器用に飛び回り、縦横無尽に、そして正確無比に鋏を動かして髪を整えていく。'
        locator: {}
        spoiler_after: ch5321
  first_appearance_candidate: true
- canonical_target: '[[E_char_アルマ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5321_アルマ_other_アキラ_p240251
        quote: 'メールだ。ここしばらく音沙汰が無かったコルセスカの使い魔、アルマから。

          『それ見て、サリアちゃんがスキリシアに飛び込んで行っちゃった。かなり暴走気味で、正直やばいかも。ごめん、止められなかった。あと、コアちゃんと連絡とれないんだけどそっちで何かあった？』'
        locator: {}
        spoiler_after: ch5321
  first_appearance_candidate: true
- canonical_target: '[[E_char_ルバーブ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5321_ルバーブ_appears_ルウテトの頭髪から_p38
        quote: マラードの言葉に応えてルウテトの頭髪から現れたのは、ふっくらとした体型の中年男性だ。ごわごわした質感の髪が長く伸びているのがやや不潔な感じがするし、顔も整っているとは言い難いが――というか正直に形容するのが難しい――デフォルメされてそこそこ愛嬌のある外見になっていた。
        locator: {}
        spoiler_after: ch5321
      - event_ref: E_ch5321_ルバーブ_observes_マラードとルウテト_p59
        quote: ふと、ルバーブがそんな奇妙な主従関係をじっと見ているのが目に入った。
        locator: {}
        spoiler_after: ch5321
    action:
      observations:
      - event_ref: E_ch5321_ルバーブ_activates_散髪用鋏_p41
        quote: ルバーブはどこからともなく道具一式を取り出して、半透明であったそれらに呪力を込めると実体化させてしまった。一連の動きは風のように迅速。マラードにとって有能な配下であることが窺える。
        locator: {}
        spoiler_after: ch5321
    speech:
      observations:
      - event_ref: E_ch5321_ルバーブ_other_マラード_p6668
        quote: '「陛下は素晴らしいお方だ。愛情深く、美しいものを尊ぶその気質はラフディの華やかな文化をより一層精錬させた。カシュラムとの戦いにかまけていたそれまでの無骨な王たちには無かった、得難い資質である」

          その口調には、主への確かな信頼と敬意が感じられた。'
        locator: {}
        spoiler_after: ch5321
  first_appearance_candidate: true
- canonical_target: '[[E_char_オルヴァ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5321_オルヴァ_appears_ルウテトの口から_p86
        quote: ルウテトの口の中から飛び出したのは、十字の瞳を持った男。ゆったりとしたローブを身にまとっており、マラードを挑発している。
        locator: {}
        spoiler_after: ch5321
  first_appearance_candidate: true
- canonical_target: '[[E_char_ヴァージル]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5321_ヴァージル_appears_ルウテトの耳から_p9297
        quote: '更に、ルウテトの長い耳から飛び出してきたのは縮小されてなお小柄な姿。

          垂れ耳ウサギのような少年の名は、ヴァージルといった。

          「あーっ、みんな抜け駆けしてずるいですよっ。僕だって姫にいいところ見せて誉めてもらいたいのに！」

          愛らしい美少年は、長くてふさふさの白い耳を持ち上げて叫ぶ。頬を膨らませるというあざとい表情が許される少年はこの三千世界にレオだけだと思っていたが、驚くべきことにヴァージルは完璧な愛らしさで俺の認識を塗り替えた。'
        locator: {}
        spoiler_after: ch5321
  first_appearance_candidate: true
