      - event_ref: E_ch5321_トリシューラ_other_参加者たち_p156161
        quote: '「星見の塔トーナメント参加者のみんなに、【頑張ったで賞】をあげます。また来月のトーナメントもよろしくねー」

          トリシューラの背後から円盤ドローンが飛び立ち、大きな籠を人々の頭上に持っていく。中身を引っ繰り返すと、色とりどりの雨が降った。全て呪石――呪術的な力を宿した高価な品である。'
        locator: {}
        spoiler_after: ch5321
  first_appearance_candidate: true
