- canonical_target: '[[E_relation_アキラ]]'
  entity_type: relationship
  aspects:
    speech:
      observations:
      - event_ref: E_ch5321_アキラ_other_ラズリ店員_p166170
        quote: '端末を片手にリーナ・ゾラ・クロウサーにメールを打つ。送信した直後に端末が震えて驚いたが、相手は店員（ラズリ）さんだった。

          『このたびはお役に立てなくてすみませんでした。トリシューラさんに合わせる顔が無いのでしばらく旅に出ます。探さないで下さい』'
        locator: {}
        spoiler_after: ch5321
      - event_ref: E_ch5321_アキラ_other_外見への不快感_p18
        quote: 会話聞いてるだけで死にたくなる。誰がマゾヒストだ。というか、自分の外見をちゃんと鏡で確認していなかったが、そんなことになっていたのか。
        locator: {}
        spoiler_after: ch5321
      - event_ref: E_ch5321_アキラ_other_ルバーブ_p7781
