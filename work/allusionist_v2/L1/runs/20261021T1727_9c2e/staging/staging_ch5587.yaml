        spoiler_after: ch5587
      - event_ref: E_ch5587_チッセ_asks_クラウビューラへの援護要請_p72
        quote: 「くそ、くそ～！　むっかつく～、ちょっと押し負けたじゃ～ん！　クラウ兄さま～、雲からリソース分けて～！　融血して回復する～！」
        locator: {}
        spoiler_after: ch5587
      - event_ref: E_ch5587_チッセ_says_ロードデンドロンへの挑発_p81
        quote: 「てかそっちのがボロボロじゃ～ん。結局、こっちの植物想（フローラ）も奪えてないしさぁ。や～いざぁ～こ。でもチッセちゃんはやさし～から、助けてあげるねえ～？　ぜ～んぶ、ぼくの世界に融かして溶かして渡河してあげる～」
        locator: {}
        spoiler_after: ch5587
    action:
      observations:
      - event_ref: E_ch5587_チッセ_attacks_ロードデンドロンの右腕_p164
        quote: '「知ったようなこと言ってっ！　ぼくの中に入ってくるなぁ～！」

          悲痛な叫び。チッセの免疫機構によってティリビナ人の右腕が両者の融合点の内部で崩壊。さらに反撃の呪詛で左腕も破壊される。'
        locator: {}
        spoiler_after: ch5587
      - event_ref: E_ch5587_チッセ_other_生態系の損なわれ_p41
