    speech:
      observations:
      - event_ref: E_ch5587_チッセ_fears_理解不能な現象_p103
        quote: '「なに、なんなの～？」

          青い血を操る。

          波となって相手の方に押し寄せるが、直撃しても思ったほどの効果がない。

          逆に傷を癒しながら、ロードデンドロンが口を開く。'
