- kind: mystery
  name: MY_Harbert_Dining_Aesthetics
  note: 栄養補給だけの食事に対し「論外」と激怒し、高度な調理と結界（猫除けペットボトル）を要求するハルベルトの異常な執着。単なるグルメではなく、彼女が「文化」や「人間性」を維持するための重要な儀式である可能性。
  quotes:
  - quote: 「食事は文化的な営み。調理済みの食料は彩り豊かに温かに――味覚のみならず視覚、嗅覚、更には温度覚にまで訴えかける。」
    paragraph: p126
    quote_verified: false
  - quote: 「猫（アウターゴッズ）」ですら避けて通る高等結界――これで安全は確保した
    paragraph: p162
