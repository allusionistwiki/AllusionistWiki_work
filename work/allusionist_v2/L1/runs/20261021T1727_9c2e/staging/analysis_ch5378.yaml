- kind: mystery
  name: MY_lubav_foreseeing_power
  note: オルヴァがルバーブに「全てを見透かしている」と問いかけた内容。この能力の真偽、およびその能力が現在の物語進行においてどう作用するか。
  quotes:
  - quote: カシュラム人の中で最も賢明であり誰よりも先を見通すことができるお前には、恐れるものなどないのではないか。本当に全てを見透かしているのなら、死を知り、死の先まで見えているはず。
    paragraph: p18
    quote_verified: true
  expected_payoff: ルバーブが実際に未来予知能力を持っていた場合、オルヴァの信仰の変遷（特に「折れずに生きるための方法論」）が彼によって仕組まれたものかどうかが判明する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_maikaal_past_trauma
  note: マイカール・チャーラムが「付いていけなくなった」具体的な契機。単なる疲労なのか、特定の事件（トリガー）が存在するのか。
  quotes:
  - quote: そして、ある時ふと『付いていけなくなった』――何に？ 強いて言えば、優しさや正しさに。そのための戦いに。劇的な出来事があったわけではない。本当にふとした瞬間、それは競技中にペース配分を間違って失速してしまうかのごとく――正しさを信じるための体力が尽きたのだ。
    paragraph: p200-203
    quote_verified: true
  expected_payoff: カウンセリングの過程で、彼が過去に目撃した「正しさの限界」を示す具体的なエピソード（おそらくティリビナ難民に関する悲劇）が明かされる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
