- kind: mystery
  name: MY_Wolf_Intelligence
  note: 巨大狼が高い知性を持ち、学習能力（弾道予測への対抗）や意図的な行動（優先目標の変更）を取っている。これが単なる獣なのか、人狼のような知的種族なのか、あるいは魔法生物としての知性なのかが未確定。
  quotes:
  - quote: 最初に俺を殺そうとした人狼。あれは『知性』があるように見えた。この世界の怪物に皆知性が備わっているのだとしたら。
