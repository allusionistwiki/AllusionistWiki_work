entities:
- canonical_target: '[[E_term_レオ]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5377_レオ_other_共存の理想_p118
        quote: 「聞いて下さい！　この第五階層は、『上』からも『下』からも『共存できない』って言われた人たちが集まってくる所なんです。ここで拒絶して、諦めて、そんなひどいことを続けたら、ここは本当の地獄になる！　僕はそんなのは悲しいと思います」
        locator: {}
        spoiler_after: ch5377
      - event_ref: E_ch5377_レオ_loves_絡新婦_p125
        quote: 「僕はあなたを拒絶したくない。さっきは怖がって、たくさん痛い目に遭っているのに何もできなくてごめんなさい。もう、怖くないから」
        locator: {}
        spoiler_after: ch5377
      - event_ref: E_ch5377_レオ_other_伐採の意義_p139
        quote: 「斧も、チェーンソーも。あなたの痛みも苦しみも、決して無駄じゃない」
        locator: {}
        spoiler_after: ch5377
      - event_ref: E_ch5377_レオ_other_仲良しへの呼びかけ_p163
        quote: 「だからみんな、仲良くしましょう？」
        locator: {}
        spoiler_after: ch5377
      - event_ref: E_ch5377_レオ_other_絡新婦への共感_p80
        quote: 「怖がったりしてごめんなさい。つらかったですよね」
        locator: {}
        spoiler_after: ch5377
      - event_ref: E_ch5377_レオ_thinks_絡新婦の来歴_p91
        quote: 「お仕事、きっといっぱい頑張ったんでしょうね。最初は斧、それからもっと人の役に立つために愛用の道具をチェーンソーに持ち替えて。でも、あの機械は振動が凄いから――そんなふうに手が真っ白になってしまって、きっと大変な思いをしたんでしょう？」
        locator: {}
        spoiler_after: ch5377
      - event_ref: E_ch5377_レオ_asks_絡新婦の感情_p98
        quote: 「『杖』が、第五階層が、トリシューラ先生やアキラさんが憎いですか。あなたの仕事を助け、そのあとであなたから腕と仕事を奪い、更には我が物顔で伐採作業を行う林業ドローンたちが嫌いですか。そして、自然保護を訴えるティリビナ人のみんなを傷つけたいですか」
        locator: {}
        spoiler_after: ch5377
    action:
      observations:
      - event_ref: E_ch5377_レオ_other_絡新婦の頬_p142
        quote: そっと手を差し伸べて、ぼろぼろに朽ちた頬に手を添えた。
        locator: {}
        spoiler_after: ch5377
      - event_ref: E_ch5377_レオ_other_完全な勝利_p190
        quote: 完全なるレオの勝利だった。土台、シナモリアキラがレオに敵うはずがなかったのだ。
        locator: {}
        spoiler_after: ch5377
      - event_ref: E_ch5377_レオ_other_戦場_p77
        quote: そのまま荒れ狂う戦場のただなかを進んでいく。
        locator: {}
        spoiler_after: ch5377
    visual:
      observations:
      - event_ref: E_ch5377_レオ_fears_憎悪の腕_p24
        quote: レオは身が竦んでいるのか避けることもできず呆然と立ち尽くしていた。
        locator: {}
        spoiler_after: ch5377
    symbolic:
      observations:
      - event_ref: E_ch5377_レオ_other_優しさの獣_p275
        quote: 異形すらねじ伏せる、優しさの獣を。
        locator: {}
        spoiler_after: ch5377
      - event_ref: E_ch5377_レオ_makes_優しい呪文_p94
        quote: 血の気を失った遠隔操作の腕を『職業病である』と解釈し、そこに人格と個人の来歴を見出す『優しい呪文』――レオの気質が可能とするその攻撃は、グレンデルヒには不可能なものだ。
        locator: {}
        spoiler_after: ch5377
  first_appearance_candidate: true
