        locator: {}
        spoiler_after: ch5377
      - event_ref: E_ch5377_グレンデルヒ_names_斧の由来_p5
        quote: あの古びた斧は、恐らく何者かが『絡新婦』に与えた呪具だろう――そこまで考えて、グレンデルヒは気付く。
        locator: {}
        spoiler_after: ch5377
      - event_ref: E_ch5377_グレンデルヒ_thinks_小鬼の性質_p5
        quote: だが小鬼には歴史など関係が無い。300秒ごとに世界を更新する彼らにとって世界とは一瞬ごとに創造され続けていくものだからだ。
        locator: {}
        spoiler_after: ch5377
      - event_ref: E_ch5377_グレンデルヒ_thinks_敵の狙い_p52
        quote: シナモリアキラ、レオ、ティリビナ人、第五階層。そして『氷燭』。
        locator: {}
