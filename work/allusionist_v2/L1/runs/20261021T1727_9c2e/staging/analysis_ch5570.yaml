  quotes:
  - quote: 静寂を破ったのは記録の影だった。亡霊の背が笑う。歓喜と称賛が半透明の機体を揺らし、父祖は子孫を慈しむように声をかけた。
    paragraph: p148
    quote_verified: true
  expected_payoff: レコードゴーストが単なるデータではなく、上位存在（サンブル家等）によって意図的に配置された「指導者」であることの明かされる展開。
