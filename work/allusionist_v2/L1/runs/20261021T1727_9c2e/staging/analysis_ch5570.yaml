- kind: mystery
  name: MY_brotherhood_resolution
  note: エンハとナックスの兄弟が、最終的に機体ごと消滅・脱落した後の行方。彼らが「未来」を信じている言動から、子孫や後継者への布石として登場する可能性、または精神的な影響を残す存在としての再登場。
  quotes:
  - quote: ボロボロの箒は炎に包まれて墜落し、天空から下界へと弾き出されていく。上位次元にある魂は現実への帰還を余儀なくされる。消耗しきった兄弟に待ち受けるのはレースの脱落という運命だ。
    paragraph: p167
    quote_verified: true
  - quote: 報われた。力及ばなかったとしても、二人の記録は後に続く者の道となるだろう。エンハドーラがそうなったように。祖父が、父がそうであったように。
    paragraph: p161
    quote_verified: true
  expected_payoff: 彼らの「敗北」が単なる結末ではなく、リーナや他の候補者にとっての教訓・目標として機能する。あるいは子孫への遺伝的情報としての回収。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
