- kind: mystery
  name: MY_leena_choice_direction
  note: リーナが兄弟の劇的な結末を見て、「否定したくない」と思い、かつ「同じ選定レースの競争相手に恥じる戦いをしたくない」と感じたこと。彼女の今後の戦略（兄弟のような受動的な美徳か、能動的な破壊か）を示唆する。
  quotes:
  - quote: だが、否定したくないと思ったことも事実だ。忌まわしいクァヒートの在り方を、リーナが『救ってあげる』ことはできるだろう。兄弟の代で負の連鎖を断ち切ることも簡単だ。
    paragraph: p193
    quote_verified: true
  - quote: 彼女が最初に左右するのは、己の運命に他ならない。
    paragraph: p220
    quote_verified: true
  expected_payoff: リーナが「救済者」としての役割（家族の解体）と「継承者」としての役割（家名の維持）の間で葛藤し、独自の選択に至る過程。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
