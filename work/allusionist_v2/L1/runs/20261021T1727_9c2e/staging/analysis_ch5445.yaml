- kind: mystery
  name: 世界槍の正体と第九世界槍アイスナイン
  note: 女王が「この世界槍」と呼ぶものが、最終的に「第九世界槍、揺籃命宮アイスナイン」であり、彼女が持つ九氷晶の最後のひとつであると明かされる。これは物語のコアなアイテムに関する重大な真実開示である。
  quotes:
  - quote: これこそが私の槍。... それが現在の上書きされたこの世界槍というわけです
    paragraph: p27-p34
    quote_verified: false
  - quote: ここは第九世界槍、揺籃命宮アイスナイン。私が持つ九氷晶の最後のひとつ、『氷槍』そのものです
    paragraph: p271
    quote_verified: true
  expected_payoff: この槍が世界の構造そのもの（または世界の軸）であることが確定し、敵対者コルセスカとの決着は「世界権限」の争奪戦へとシフトする。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: クレイの性的抑制ロックと無自覚な近親相姦的行動
  note: 女王がクレイの魂に「性的なものに近付くと強いショックを受ける」ロックをかけたこと、およびファウナやクルミ（母性像）への殺意・欲望が女王の設計によるものであることが明かされる。
  quotes:
  - quote: 誤作動を防止するため、性的なものに近付くと強いショックを受けるよう貴方の魂にはロックをかけています。
    paragraph: p143
    quote_verified: true
  - quote: 私はあなたという主演俳優を最高の存在に育て上げる必要がありました... 無自覚のインセスト・タブー。
    paragraph: p85-p152
    quote_verified: false
  expected_payoff: クレイが女王への忠義と欲望（近親相姦的要素）をどう統合するか、またはこの設定を破棄して自立するかが今後のキャラ成長の鍵となる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: シナモリアキラとの決戦の必要性
  note: 女王は「アキラ様とクレイが喰らい合う決戦を残すのみ」と述べており、この戦いが理想完成のための必要条件であると示唆している。
  quotes:
  - quote: あとはアキラ様とクレイが喰らい合う決戦を残すのみ。どちらが勝利しても私の理想は完成するはず
    paragraph: p107
    quote_verified: true
  expected_payoff: シナモリアキラとの対立が必然化しており、その結果によって世界のあり方が決定づけられるイベントが発生する可能性が高い。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: ルウテトの真の姿とコルセスカへの敵意
  note: 女王が豚の皮を脱ぎ捨てて「左半身は光妖精、右半身は死者」という異形の女神へと変貌し、明確にコルセスカを敵として認識して宣名を行う。
  quotes:
  - quote: 死人の森の女王ルウテトは、豚の皮を脱ぎ捨てて真の姿を露わにする。左半身は薄翅を広げる美しい光妖精の美貌。右半身は骨の翼を突き出した穢れた死者の異形。
    paragraph: p252-p254
    quote_verified: true
  - quote: ルウテトの敵意ははっきりとコルセスカに向けられていた。
    paragraph: p260
    quote_verified: true
  expected_payoff: 次章以降で、ルウテト（紀神）vs コルセスカ（魔女）による高レベルな概念戦争が勃発する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: 世界観の崩壊と「まどろみ」への落下
  note: ルウテトの世界観がコルセスカの世界観を打ち破り、森羅万象が虚空に溶け落ちる描写。これが単なる戦闘ではなく、現実改変（または世界リセット）のトリガーとなっている。
  quotes:
  - quote: この世界は既に冥府であり、死の女王が統べる手のひらの上。森羅万象が捩れて虚空の一点に溶け落ちる。
    paragraph: p286-p287
    quote_verified: true
  expected_payoff: 物語の舞台が物理的な空間から、精神的・概念的な「まどろみ」や「夢想」の世界へ移行する展開が始まる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 造物主（作者）によるキャラクターの支配と、キャラクターの自立（反抗）の失敗
  weight: 0.8
  quotes:
  - quote: 私はあなたという主演俳優を最高の存在に育て上げる必要がありました。... クレイ、貴方は道具。そして私が切り離した端末
    paragraph: p85-p171
    quote_verified: false
  - quote: 復讐だ！　復讐しかない！... 俺には、貴方に刃を向けることなんてできません
    paragraph: p183-p198
    quote_verified: false
  note: クレイが「反抗期」を迎えるよう演出されたが、最終的に母性への慕情（忠義）に屈服する。「ノーマルエンド」と呼ばれるこの展開は、メタフィクションにおける『創作者の意図』に対する『キャラクターの自由意志』の限界を示唆している。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: ゲーム的システム（ステータス、イベント、好感度）への世界の本質化
  weight: 0.7
  quotes:
  - quote: 全ての試練（ゲーム）はレベリングのためにありました。... 紀人シナモリアキラはより強くなる。
    paragraph: p107
    quote_verified: false
  - quote: キャラメイク、キャラメイクと――今度はもう少しオスっぽいデザインとか？　... 経験値ポーションと好感度アイテムぽーいっと。
    paragraph: p218-p220
    quote_verified: false
  note: 女王が世界の歴史や人物を「ゲーム的な用語（ビルド、フラグ管理、イベントスチル）」で処理し、クレイをステータスアップのために再作成する。これは、この世界がシミュレーションゲームのような構造を持つことを強調するテーマである。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 生と死の境界の溶解（グロテスクな母性）
  weight: 0.6
  quotes:
  - quote: 腐った豚の頭部を持った異形の屍... 黒々とした汁液を溢れさせながら肉が爆ぜて内側から真っ白な腕が飛び出す。
    paragraph: p2-p17
    quote_verified: false
  - quote: いい子ね、可愛い坊や。さあ、これからもお母さんが守ってあげる。お腹の中にいらっしゃい。素敵な現実から醒めて、悪い夢を楽しみましょう――？
    paragraph: p291
    quote_verified: true
  note: 女王が「生む」「産む」「お腹の中へ入れる」という行為を、腐敗と再生、死と生の境界が曖昧なグロテスクな形態で行う。「母性」が保護であると同時に、「個の解体・統合（冥府への回帰）」であるという恐ろしさが描かれている。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 認識の支配と真実の開示
  weight: 0.5
  quotes:
  - quote: この世界槍の名を教えましょう。誰も意識できず、疑問に思う事すらできなかった認識のヴェールを取り払ってね
    paragraph: p263
    quote_verified: true
  - quote: 明かされた真実と共に、貼り付けられていた世界の野蛮が砕け散る。... いま、世界は変革の時を迎えたのだ。
    paragraph: p273-p274
    quote_verified: false
  note: 「名前を呼ぶ（宣名）」ことが世界のルールを書き換える権力として描かれる。コルセスカとの対決は武力ではなく、どちらの「世界観（認識）」が正統であるかの争いであり、真実開示そのものが攻撃となる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
