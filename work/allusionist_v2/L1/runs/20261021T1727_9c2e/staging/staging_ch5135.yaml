      - event_ref: E_ch5135_アズーリア_asks_宣名の試行_p46
        quote: 「というわけでアズーリア。ちょっと宣名してみて。【心話】で名前にルビを振るの」
        locator: {}
        spoiler_after: ch5135
      - event_ref: E_ch5135_アズーリア_confesses_宣名の不可_p48
        quote: 「すみませんお師様。あの、できません」
        locator: {}
        spoiler_after: ch5135
      - event_ref: E_ch5135_アズーリア_other_猫に名付けられた子供_p54
        quote: 私は、故郷の風習で異世界の未知なる名前を召喚された【猫に名付けられた子供】であることを説明した。
        locator: {}
        spoiler_after: ch5135
    action:
      observations:
      - event_ref: E_ch5135_アズーリア_remembers_エスフェイルの宣名_p17
        quote: 思い出す。第五階層の戦いでエスフェイルが名乗った瞬間、狼の足下に広がる闇がその呪力を増大させたことを。
        locator: {}
        spoiler_after: ch5135
      - event_ref: E_ch5135_アズーリア_thinks_既知感_p66
        quote: ふと、既知感を覚えた。このようなやりとりが、最近もあったような。
        locator: {}
        spoiler_after: ch5135
