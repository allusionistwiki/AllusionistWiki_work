      - event_ref: E_ch5256_グレンデルヒ_uses_陰謀論の呪文・ステルスマーケティング認定_p225
        quote: 「なんと卑劣な。ステルスマーケティングで情報弱者を騙し、無駄な浪費を強いていたとは。このようなことが赦されるわけがない。シナモリ・アキラは恥を知るがいいだろう。それに荷担した者もまた裁かれるべきだ――いやしかし、そんなことをする者が本当にいるのか？
          実は一連のステルスマーケティング全て、シナモリ・アキラの自作自演だったのでは？」
        locator: {}
        spoiler_after: ch5256
      - event_ref: E_ch5256_グレンデルヒ_names_サイバーカラテユーザー＝アキラ＝グレンデルヒ_p230
        quote: グレンデルヒの論理展開によれば、つまりサイバーカラテ道場に言及し褒め称えている者は全てシナモリ・アキラであると言う事ができる。導き出される結論は一つ。サイバーカラテユーザー＝シナモリ・アキラ＝グレンデルヒ。
        locator: {}
        spoiler_after: ch5256
      - event_ref: E_ch5256_グレンデルヒ_says_撤回＝自作自演の証明_p256
