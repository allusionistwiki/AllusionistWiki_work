        locator: {}
        spoiler_after: ch5256
      - event_ref: E_ch5256_グレンデルヒ_activates_フィリス・アトリビュート・ヴァレリアンヌ_p196
        quote: 言理の妖精を完全掌握した四英雄の一人は、カード型端末の中に封じ込めた第一魔将の欠片を掲げて叫んだ。「遡れ、フィリス。アトリビュート・ヴァレリアンヌ」
