- kind: mystery
  name: リールエルバの隠密行動と伏線回収
  note: 表向き殺害されていたリールエルバが、事前に仕込んでいた吸血鬼因子（ウィルス）で軍勢を用意していた事実。ガルズの計画失敗時の「保険」として機能している。
  quotes:
  - quote: 'エスフェイルに心折られ、殺害されたというのは全て見せかけだけのまやかし。

      彼女は密かに呪文ウィルスをアストラルネットに流し、更には鼠や蝙蝠といった小動物まで媒介させて市街地に吸血鬼の因子を広げていた。'
    paragraph: p173-p174
    quote_verified: true
  - quote: 'もしガルズの計画が成功し、エルネトモランに被害が出てしまった場合の保険。

      それが彼女による吸血鬼化である。'
    paragraph: p177-p178
    quote_verified: true
  expected_payoff: この準備により、都市崩壊や死者蘇生の問題に対する「保険」としての役割が明確になり、今後の戦略的優位性を示す。
