- kind: mystery
  name: MY_爆撃詠唱者の正体と暗殺の目的
  note: 猫姫人形を狙った爆発を引き起こした「大型猟犬の使い魔」を持つ人物、およびその背後にいるライラ・ラプスの真意が不明。単なる襲撃なのか、アズーリアへの警告なのか、セリアック＝ニアを無力化するための計画の一部なのか。
  quotes:
  - quote: '引き裂いたのは魔導書を背負った大型猟犬の使い魔だった。

      端末個体からの情報を受け取ったセリアック＝ニアの総体が『やはり』とライラへの疑念を確信に変化させた直後、小さな二頭身の胴体が衝撃によって床に叩きつけられる。'
    paragraph: p187-p188
    quote_verified: true
  expected_payoff: セリアック＝ニアの総体意識が切断されたことで、彼女は誰を殺そうとしたのか、あるいは誰を守ろうとしたのかという動機が明かされる。また、アズーリアへの呪い（ライラ・ラプスに呪われた）とこの襲撃の関係性が露呈する可能性が高い。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
