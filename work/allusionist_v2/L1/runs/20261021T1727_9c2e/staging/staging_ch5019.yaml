entities:
- canonical_target: '[[E_char_カイン私]]'
  entity_type: character
  aspects:
    name:
      observations:
      - event_ref: E_ch5019_カイン私_names_世界槍_p118124
        quote: 「私たちから見て上に円形の天蓋が見えるでしょう？　あれが『地上』。私の所属する勢力圏。そして下に見える広大な大地が、『地獄』。今まで私たちが戦ってきた異獣たちの勢力圏」
        locator: {}
        spoiler_after: ch5019
    action:
      observations:
      - event_ref: E_ch5019_カイン私_makes_蒼穹の庭園_p130143
        quote: '私が言い終わるのと同時、周囲の風景が移り変わっていく。

          世界を上下に貫く槍の群れは姿を消して、そこに広がるのは一面の青。空の色をした造花が咲き乱れる屋外の庭園。透き通るような青い空、綺麗に整えられた芝生、庭園の区画を迷路のように複雑に区切る生垣がその空間の妖しさを増す。'
        locator: {}
        spoiler_after: ch5019
      - event_ref: E_ch5019_カイン私_finds_エスフェイルの本質闇の脚_p1820
        quote: '世界の深層に、意識の一部が落下していく。落ちて、落ちて、底に近い暗闇の中で、私はそれを見付けた。

          エスフェイル、闇の脚。その名の本質を掴み取る。'
        locator: {}
        spoiler_after: ch5019
      - event_ref: E_ch5019_カイン私_takes_エスフェイルの核_p6265
        quote: '頭部から光を内部に閉じ込めたかのように黒い玉石が姿を現し、呪術的な力によって浮遊して私の手元に辿り着く。

          エスフェイルの核だ。

          左手で握りしめ、軽く力を込める。それだけで石はあっけなく砕けた。'
        locator: {}
        spoiler_after: ch5019
      - event_ref: E_ch5019_カイン私_activates_静謐の詠唱_p915
        quote: '私は、前方でアキラとぶつかり合う肉の巨人を見据え、左手を向けた。

          完全に掌握下におかれた魔導書が、私の呪術使いとしての技量を強制的に引き上げていく。

          今度こそ終わりだ、エスフェイル。

          原初の呪いの理に従い、その構造を詳らかにする。

          『遡って、エル・ア・フィリス』'
        locator: {}
        spoiler_after: ch5019
    visual:
      observations:
      - event_ref: E_ch5019_カイン私_breaks_金鎖の環_p17
        quote: 完全な名を告げると共に、異獣が活性化する。手首の金鎖、その最後の一つが砕け散った。
        locator: {}
        spoiler_after: ch5019
    speech:
      observations:
      - event_ref: E_ch5019_カイン私_says_言理の妖精語りて曰く_p2123
        quote: '格上の呪術師が格下の呪術使いに名を明かすということは、呪いを返すことが出来ればという条件付きで威嚇や防御にもなる。あの狼は確かに強大な呪術師だ。しかしその驕りが時に命取りに繋がることを、私が教えてやろう。私は、呪文を構成する最初の起句を口にした。

          「言理の妖精語りて曰く」'
        locator: {}
        spoiler_after: ch5019
      - event_ref: E_ch5019_カイン私_promises_再会と感謝の返還_p232234
        quote: '「――本当にごめんなさい。今は貴方の厚意に甘えさせて貰います。この感謝は必ず形にして返すから」

          また、すぐに会いましょう。

          再会の約束を交わし、独特の手を左右に振る仕草（おそらく別れの挨拶だろう）で送り出してくれたアキラに同様の仕草を返し、私は地上へと転移した。'
        locator: {}
        spoiler_after: ch5019
      - event_ref: E_ch5019_カイン私_deceives_エスフェイルの構造記述_p3146
        quote: 「けれど、肉体の死、物質的な死が呪術師にとって一体何になるのだろう。それらは、もっともらしい理由を後付けしただけのこじつけの正体、まやかしの本体だ。エスフェイルの本質はそんなところにはない。あるときは狼、あるときは影、あるときは月、あるときは死。千変万化する性質と移り変わる姿。不確かな虚言で幻惑するそのやり口こそが森の王の本質」
        locator: {}
        spoiler_after: ch5019
      - event_ref: E_ch5019_カイン私_helps_アキラの精神的回復_p8486
        quote: '「ええ、お疲れ様。貴方のおかげで奴を倒せた。奴に殺された人々もきっと報われる――皆を代表してお礼を言わせて貰う。本当にありがとう」

          死者達の言葉を代弁する資格が私にあるかどうかはともかく、この言葉は、彼にいくらかの救いをもたらしたようだった。'
        locator: {}
        spoiler_after: ch5019
    symbolic:
      observations:
      - event_ref: E_ch5019_カイン私_other_365日後の再会_p242243
        quote: 'この約束が果たされるのは、約31,536,000秒も経過した時のこと。

          夏季と冬季がそれぞれ一度ずつ過ぎゆく間、私はふとした瞬間に、あの奇妙な外世界人を気にかけている自分に気がついては、巨大な未解決のタスクを抱えていることをうしろめたく感じ続けることになる。'
        locator: {}
        spoiler_after: ch5019
  first_appearance_candidate: true
