      observations:
      - event_ref: E_ch5019_第五階層_disappears_幻の空間_p6872
        quote: '世界が、砕け散る。

          夜が、森が、大地が、空気が、かすかな虫や小動物の息吹といった一切合切が、幻であったかの如く雲散霧消する。

          気がつけば、私とアキラが立っているのはただ広大な部屋。

          そして、床に積み重なった夥しい数の死体。'
        locator: {}
        spoiler_after: ch5019
  first_appearance_candidate: true
