        locator: {}
        spoiler_after: ch5019
  first_appearance_candidate: true
- canonical_target: '[[E_term_静謐]]'
  entity_type: terminology
  aspects:
    name:
      observations:
      - event_ref: E_ch5019_静謐_defines_万能の対抗呪術_p23
        quote: '対抗呪文。その名は【静謐】。

          あらゆる呪術に対抗する、万能の呪術。'
        locator: {}
        spoiler_after: ch5019
    symbolic:
      observations:
      - event_ref: E_ch5019_静謐_functions_as_因果遡及による抹消_p5
        quote: それはどのような呪術的効果であろうと打ち消すことが可能な秘術。世界に根を下ろした確固たる存在物であっても、過去に遡って発生原因を打ち消せば死を与えることができるという。
        locator: {}
        spoiler_after: ch5019
  first_appearance_candidate: true
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5019_アキラ_helps_カインの留守番_p225227
        quote: '「それなら、しばらくの間でいいなら俺がここに残るよ。ただ、なるべく早く迎えに来てくれると助かる」

          第一印象は最悪に近かったけれど、今の彼はなんというか、とても感じが良い。'
        locator: {}
        spoiler_after: ch5019
    action:
      observations:
      - event_ref: E_ch5019_アキラ_attacks_エスフェイルの胴体_p4960
        quote: '宣告する。

          『お前は、存在しない』

          まやかしを暴くための言葉が放たれるのと共に、重く大地を踏みしめた『鎧の腕』の一撃が魔将の胴体に叩きつけられる。エスフェイルの脚、胴、腕、肩、頭部、肉体のありとあらゆる箇所に亀裂が走り、拉げ、抉れ、砕け、流血し、最後には力を失ってゆっくりと仰向けに倒れた。'
        locator: {}
        spoiler_after: ch5019
  first_appearance_candidate: true
- canonical_target: '[[E_org_第五階層]]'
  entity_type: organization
  aspects:
