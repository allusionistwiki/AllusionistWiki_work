- kind: mystery
  name: MY_gren_identity
  note: 少年が受けた「断章（鍵）」を渡した男の名前がグレン、あるいはそれと類似する名前であるという言及。主人公や主要キャラクターとの関連性が示唆される。
  quotes:
  - quote: 「何だい、君は。断章？ ああ、この『鍵』のことか。これはかなり前に賢者を名乗る男に手渡されたものだよ。…はて、あれの名前は何と言ったかな？ 確か、グ、グ、グール、いや、グレン？」
    paragraph: p89
    quote_verified: false
  expected_payoff: この名前が主人公（アリュージョニスト）の別名、過去、あるいは彼に近しい賢者であることを明かし、敵対関係の因果を回収する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_seres_half_face
  note: セレスの右側の顔が腐乱し白骨化している描写。彼女が死者の力を使う賢者であることと、その代償・身体状況に関する詳細な設定。
  quotes:
  - quote: その顔の右側が、どろりと腐乱して肉が落ちていく。後に残った白骨、空洞の眼窩が死のごとき視線で死人たちを睨み付けた。
    paragraph: p99
    quote_verified: true
  expected_payoff: セレスの過去の戦い、彼女が「死者」の力を得た経緯、または彼女自身の生と死の境界に関する真相。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_the_child_heart
  note: セレスが言及した「あの子」、および「心を折る」ための条件（美しい人による介入）。ルバーブが気づいた王宮にいる存在に関する伏線。
  quotes:
  - quote: 「あの子の心を折るのは、きっとあの子も認めざるを得ない美しい人でなくてはならないのです。」
    paragraph: p136
    quote_verified: false
  expected_payoff: 主人公が「美しさ（精神的・道徳的含む）」によって敵対する存在を説得する展開、または王宮内の特定のキャラクター（王子等）との対立解決。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_daemodex_influence
  note: 少年がダエモデクという名前と「腑抜け」という評価を下している点。敵勢力の構造や上位存在との関係。
  quotes:
  - quote: 「火種だらけのガロアンディアンすら崩せなかったダエモデクの奴は全く腑抜けとしか言いようが無いな」
    paragraph: p58
    quote_verified: false
  expected_payoff: 敵組織「四方の王」および「盟主殿」との権力関係、過去の歴史的経緯。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
