        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_クレイ_kills_ファウナ_p316
        quote: もう一度、手刀がファウナを貫く。鮮血と共に抉り出されたのは、鋭い断面を晒す骨だった。クレイは女の肋骨を切断し、取り出すと、そのまま自らの脇腹に侵入させていった。水面に沈むかのように滑らかにクレイの体内に入り込む女の肋骨。新たな肋骨を得たクレイが立ち上がった時、その有り様は激変していた。
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_クレイ_breaks_遍く空から降り注ぐ不可視の糸が千切れ飛ぶ_p338
        quote: 手刀一閃。遍く空から降り注ぐ不可視の糸が千切れ飛ぶ。
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_クレイ_arrives_白骨で埋め尽くされた異形の迷宮_p36
        quote: ここは白骨で埋め尽くされた異形の迷宮、攫われた舞姫たちが虚ろな目で見守る奈落の舞台。自らを庇い、攫われてしまった師ファウナを追ったクレイは闇の中で海の民の勇士イアテムと遭遇した。
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_クレイ_fights_イアテム_p36
        quote: 二人の男は互いを不倶戴天の敵と見定めて闘争を開始したが、両者が剣を打ち合わせて既に十数合。未だ決着は遠い。
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_クレイ_fights_吸血鬼カーティス_p65
        quote: クレイの動揺。奇怪な跳躍から振り下ろされた爪をどうにか防ぎ、二度、三度と回避。クレイの反撃が吸血鬼を引き裂くと、またしてもその肉体が裂けて中から新たな人物が出現した。今度は左右非対称の兎耳を持った少年だ。
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_クレイ_fights_亜竜の王_p80
        quote: クレイは咄嗟に転がって回避すると、跳ね起きて手刀を一閃した。空間を裂いて飛翔した『斬撃』の仕草が亜竜の王に到達し、その肉体を裂いた。
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_クレイ_defeats_舞踏を中断させられて地面に叩き伏せられる_p90
        quote: クレイは舞踏を強制的に中断させられて地面に叩き伏せられてしまう。
        locator: {}
        spoiler_after: ch5412
    symbolic:
      observations:
      - event_ref: E_ch5412_クレイ_has_property_この世界で、彼はただの道に迷う少年に過ぎない_p286
        quote: 恐れ――幾度となく、不安がクレイを責め苛む。この世界で、彼はただの道に迷う少年に過ぎない。それでも、時は容赦なく選択を迫る。
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_クレイ_has_property_今、女だった。舞いの型は女の型。装いも女。ならば彼は女である。_p326
        quote: クレイは今、女だった。舞いの型は女の型。装いも女。ならば彼は女である。しかし彼女は男だった。光の粒子が黄金に煌めくと、ドレスは次の瞬間には燕尾服ふうのステージ衣装に、あるいは勇ましい戦衣装に、布の多い舞い手の衣装にと変幻自在に切り替わっていく。可塑性のある無形のドレスを纏うクレイもまた、形を持たない存在だった。
        locator: {}
        spoiler_after: ch5412
  first_appearance_candidate: true
- canonical_target: '[[E_char_ミヒトネッセ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5412_ミヒトネッセ_says_私こそがリールエルバであること_p108
        quote: 「まるで私がリールエルバの偽物みたいな言い方ね。私こそがリールエルバ――だってほら、見てよこれ」
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_ミヒトネッセ_says_私は崇められており、本物でもあること_p114
        quote: 「私はこんなふうに崇められている。承認を得ている。リールエルバとして認められている。たとえなりすましだって、それは今この瞬間には真実なのよ？　なら私は、本物でもあるの。少なくとも舞台の上ではね」
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_ミヒトネッセ_says_私は欲動によって増幅されるリールエルバの力をもっと大きくしてあげただけであること_p120
        quote: 「既に私たちの間に境界は無い。私が演じるのは『下僕たちに期待されている吸血姫リールエルバの役』。膨れあがったイメージが一人歩きするほど、リールエルバというキャラクターは扇情的になりすぎた。私は欲動（リビドー）によって増幅される彼女の力をもっと大きくしてあげただけ」
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_ミヒトネッセ_says_私はガイノイドの魔女であり卑しい雌豚であること_p134
        quote: 「褒め言葉だわ、王子さま。だって私はガイノイドの魔女。そのように造られた卑しい雌豚だもの」
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_ミヒトネッセ_asks_欲望の誘蛾灯、淫蕩の餌と成り果てたリールエルバの本体は今頃どうなっているのか_p138
        quote: 「さて問題です。欲望の誘蛾灯、淫蕩の餌と成り果てたリールエルバの『本体』は今頃どうなっているのでしょう？　正解はこちらの広告をクリック、なんて」
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_ミヒトネッセ_says_これはあの子が今までにしてきた行動の結果に過ぎないこと_p145
        quote: 「これはね、あの子が今までにしてきた行動の結果に過ぎないの。そう見られる事を望んだのはリールエルバ本人。女神（アイドル）の権威はじきに失墜する」
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_ミヒトネッセ_says_私は英雄の種を孕み、その力を転生させていること_p149
        quote: 「無駄よ、無駄。私は英雄の種を孕み、その力を転生させている」
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_ミヒトネッセ_says_私は性玩具の魔女であり、英雄たちは女の屍を踏み越えて転生し異界転生者ゼノグラシアとなること_p153
        quote: 「私は性玩具の魔女。男の精を胎内で受け止め、育み、子宮という異界（かくりよ）の呪力によって再生を促す――私という蛹を破る蝶のように、英雄たちは女の屍を踏み越えて転生するの。そして彼ら（わたし）は異界転生者（ゼノグラシア）となる」
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_ミヒトネッセ_says_六王たちとは寝ておらず、彼らが転生したことで事後的に私は英雄と交わったことになること_p162
        quote: 「六王たちとは寝てないわ――そんな隙があるはずもない。けどね、彼らは現世に甦るにあたってイアテム配下の戦士たちを寄り代にした。彼らと事前に情を交わしていれば、彼らが転生したことで事後的に私は『英雄と交わった』ことになる」
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_ミヒトネッセ_says_欲しいのは冥道の鍵であり、クレイのことであること_p167
        quote: 「これぞ冥土忍法『異界転生』――六王たちは役目を終えた。あとは『森』を掌握して、『冥道』と『子宮』を揃えて降臨を待つだけ。欲しいのは『冥道』の鍵――ねえ、王子さま。あなたのことよ」
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_ミヒトネッセ_says_あなたを抱き、その精の全てをぶちまけさせ、古くて悪いねずみの王さまを退治し、レッテを守る、トリシューラを攫いに行くこと_p171
        quote: 「あなたを抱くわ。その精の全てを私の中にぶちまけなさい。そうすれば私はもうすぐ王子さま、古くて悪いねずみの王さまを退治するの！　そうして私はレッテを守る、トリシューラを攫いに行く――ああ、なんて素敵なんでしょう！」
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_ミヒトネッセ_says_新王アルト・イヴニルの勅命を受けた私は王の剣となって古き女王を弑すること_p176
        quote: 「新王アルト・イヴニルの勅命を受けた私は王の剣となって古き女王を弑するの。お前たちを殺して、お前たちの形をそっくり引き継ぐ。破壊と再生の理をここに示すというわけ。もっとも、冬の魔女にはまだ用事があるから代替霊媒に女王を移す事になるけれど――リールエルバには悪いけど、生贄になってもらいましょう」
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_ミヒトネッセ_says_強がっても無駄よ、童貞くん。そんなに興奮して、期待しているのでしょう？_p180
        quote: 「強がっても無駄よ、童貞くん。そんなに興奮して、期待しているのでしょう？」
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_ミヒトネッセ_says_いい子ね、甘えたがりの強がりさん。怖がらなくていいのよ、素直になってくれればすぐに終わるんだから――ほぉら、お姉さんと遊びましょう？_p184
        quote: 「いい子ね、甘えたがりの強がりさん。怖がらなくていいのよ、素直になってくれればすぐに終わるんだから――ほぉら、お姉さんと遊びましょう？」
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_ミヒトネッセ_says_いやらしい子。女の指を舐め回すなんて、ちゃんとした男の人はしないものよ_p188
        quote: 「いやらしい子。女の指を舐め回すなんて、ちゃんとした男の人はしないものよ」
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_ミヒトネッセ_says_こんなにべちゃべちゃにしてくれちゃって。変態。異常性欲者。このマザコン_p197
        quote: 「こんなにべちゃべちゃにしてくれちゃって。変態。異常性欲者。このマザコン」
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_ミヒトネッセ_says_見なさい_p201
        quote: 涎は潤滑油だ。侍女服の袖を汚しながらクレイの口腔に腕を馴染ませる。くぐもった声が苦痛を訴えると、人形の動きが更に激しさを増す。おぞましい抽送運動の果て、えずくクレイの頭を鷲掴みにしてミヒトネッセは囁いた。「見なさい」
