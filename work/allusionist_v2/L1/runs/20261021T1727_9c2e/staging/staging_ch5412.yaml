      - event_ref: E_ch5412_クレイ_transforms_姿は徐々に光の中で変容していった_p310
        quote: クレイの姿は徐々に光の中で変容していった。倒れ伏したファウナを抱き留め、黄金の瞳をもう一度だけ見つめた。女は生気のない顔でかすかに微笑み、何かを口にした。それきり力を失ったファウナの身体を足下に横たえると、クレイは言った。「そこで、俺を見ていろ」
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_クレイ_has_property_地上有数の剣腕に引けを取らない_p39
        quote: しかし、ならばその斬撃を幾度となく受け止め、打ち払い、熾烈な撃剣を繰り広げているこのクレイという男は何者なのか。舞うような脚捌きといい閃光に似た手刀の冴えといい、地上有数の剣腕に全く引けをとらない。
        locator: {}
        spoiler_after: ch5412
    action:
      observations:
      - event_ref: E_ch5412_クレイ_says_絶叫が迸る_p217
