      - event_ref: E_ch5412_クレイ_has_property_信じていた大人に裏切られた子供のような不安に満ちた表情_p248
        quote: 目まぐるしい展開に戸惑いつつも、クレイは師へ問いかける。信じていた大人に裏切られた子供のような不安に満ちた表情。硬質な態度はかくも容易く崩れてしまう――苦笑しつつ、ファウナは答えを返した。
        locator: {}
        spoiler_after: ch5412
      - event_ref: E_ch5412_クレイ_has_property_迷い、答えを出せずにいる_p295
        quote: 期待と重圧、迫り来る刻限。迷い、答えを出せずにいるクレイを、黄金の瞳が見つめ続ける。その輝きの内側に、クレイは自分自身を見た。そこに、至るべき理想がある。
