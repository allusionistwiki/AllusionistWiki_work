      - event_ref: E_ch5412_クレイ_says_無論だ。俺はお前たち人形とは違う。全てを運命と諦め、悪意に唯々諾々と従うようなことは決してしない。俺は王国の剣として、陛下に害なすものを――いいや、死人の森の秩序を乱す全ての悪を許さない！_p350
        quote: 「無論だ。俺はお前たち人形とは違う。全てを運命と諦め、悪意に唯々諾々と従うようなことは決してしない。俺は王国の剣として、陛下に害なすものを――いいや、『死人の森』の秩序を乱す全ての悪を許さない！」決定的に噛み合わない会話。
