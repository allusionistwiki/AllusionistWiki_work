  quotes:
  - quote: 「激化する天地の争い――そして、遂に現れた概念的『悪』としての異獣。形而上の恐怖と嫌悪が物理世界に落とした影。
    paragraph: p298
    quote_verified: true
  - quote: 「そうだ。俺たちは自ら滅び、ブレイスヴァの下へ向かうのだ。正義が定めた悪性を、俺たちの手で打ち倒す。そうすることで奴らの正義と価値を根底から砕く」
    paragraph: p317
    quote_verified: true
  expected_payoff: 彼が「英雄」になることで世界の理不尽さを破壊する計画の一環であることが語られる。
