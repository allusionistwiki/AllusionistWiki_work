- kind: theme
  theme: 「英雄（ヒーロー）」という概念の解体と、自己犠牲による絶対悪への反抗
  weight: 0.85
  quotes:
  - quote: 「魔将の邪悪を、守護の九槍の正義を、強大な英雄を凌駕したシナモリアキラという純粋な暴力こそ、この俺に相応しい。全ての価値を破壊し、否定し、超越する。俗な正義や悪などどうでもいい。理不尽な力こそが正義だ。俺はそれを振るって英雄になる。力の傲慢そのものに、俺はなる」
    paragraph: p325
    quote_verified: true
  - quote: 「そうだ。俺たちは自ら滅び、ブレイスヴァの下へ向かうのだ。正義が定めた悪性を、俺たちの手で打ち倒す。そうすることで奴らの正義と価値を根底から砕く」
    paragraph: p317
    quote_verified: true
  note: 『鵺』が既存の「正義」を否定し、自らが怪物（悪）として振る舞うことで英雄たろうとする逆説的な英雄論。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
