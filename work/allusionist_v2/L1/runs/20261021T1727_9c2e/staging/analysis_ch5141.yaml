- kind: mystery
  name: MY_Unknown_Sister_Prophecy
  note: 「未知なる末妹」が現れることが邪神キュトスの復活と世界の滅びを意味する説、あるいは救済者の説がある。ハルベルトがその座につくことで世界終末（または救済）のトリガーとなる可能性。
  quotes:
  - quote: 未知であることを性質とする姉妹だとか、その姉妹が現れた時が邪神キュトスの復活の時で世界の滅びを意味しているとか、いや末世に到来して世界を救済する者だとか諸説が入り乱れている
    paragraph: p79
    quote_verified: true
  expected_payoff: 物語終盤での世界存亡の危機と、ハルベルトがその中心人物となる展開。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_Priestera_Tribuna_Mother
  note: プリエステラは「ティリビナの民」であり、「大いなる森の母、レルプレア神と交信できる」「もう最後になってしまった、【ティリビナの巫女】」と名乗る。絶滅したはずの種族の最後の存続者であることの意味。
  quotes:
  - quote: 私はプリエステラ。大いなる森の母、レルプレア神と交信できる――もう最後になってしまった、【ティリビナの巫女】よ
    paragraph: p223
    quote_verified: true
  expected_payoff: ミューブラン滅亡事件の真相解明、またはハルベルトの「異獣」対立構造（アズが味方だが敵視される）の複雑化。プリエステラが敵か味方かの判断材料。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_Harbert_Mother_Catalmarina
  note: ハルベルトの母が「塔の第三位カタルマリーナ」の弟子であり、「太陰の王に見初められて月に渡った」。この両親の関係性と、月（太陰）と地上（塔）の対立・同盟関係。
  quotes:
  - quote: ハルのお母様は【塔】の第三位、カタルマリーナお姉様の一番弟子で、一時期はキュトスの姉妹にと望まれた程に傑出した呪術師だった。けれどある時、太陰の王に見初められて月に渡ってしまったの。
    paragraph: p93
    quote_verified: true
  expected_payoff: カタルマリーナと太陰の王の対立、ハルベルトが「人外」になる過程での母の影響、そしてアズとの関係性への波及。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_Gardenia_Insult
  note: ハルベルトがミルーニャを「クチナシ（ガーデニア）」と呼び、不機嫌になる。この言葉が何を意味する暗喩・侮辱なのか不明確。ミルーニャの正体（花？）との関連性。
  quotes:
  - quote: '「あの、ガーデニア」

      「はい？」

      「だから、クチナシ――梔子（ガーデニア）と言ったの」'
    paragraph: p137-p141
    quote_verified: true
  expected_payoff: ミルーニャの過去や出自に関わるフラグ回収、およびハルベルトとミルーニャの確執の本質。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_Azuria_Hero_Qualification
  note: アズが「ゼノグラシア（外部由来）」「グロソラリア（内部発生）」の両方の可能性を持つ特異体質であること。ハルベルトがこれを「英雄の素質」と評価する基準と、その副作用。
  quotes:
  - quote: アズはこの世界においてとても珍しい呪力を保有している。それが外部からもたらされた場合をゼノグラシアと呼び、この世界で発生したものをグロソラリア――異言者と呼ぶの。簡単に言えば、あなたには英雄の素質がある。
    paragraph: p115
    quote_verified: false
  expected_payoff: アズの力の本質（転生者としての特殊性）が、ハルベルトの勝利条件（競争）においてどう機能するか。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
