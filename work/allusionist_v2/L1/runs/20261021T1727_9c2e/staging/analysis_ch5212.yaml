- kind: mystery
  name: MY_dormed_mind_control
  note: ドルメイスが「生前のハルハハールによって魅了され」ていた事実と、その潜伏期間の長さ。なぜ松明の騎士団内部で検知されなかったのか。
  quotes:
  - quote: 修道騎士ドルメイスが魔将によって魅了されたのはつい先程――ではなかった。生前のハルハハールによって魅了され、しかしその事を気取られぬように松明の騎士団内部で潜伏を続け、密かに情報を漏洩させる。
    paragraph: p70-p71
    quote_verified: true
  expected_payoff: 松明の騎士団の内部セキュリティの脆弱性、またはハルハハールの呪術が「精神支配」ではなく「愛着形成」であることの示唆。キロンへの憎悪と主への慕わしさという矛盾した感情が、最終的に彼をどう動かすか。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_spear_secret_past
  note: ドルメイスが「最大の火種」として奪った情報構造体の中身。具体的には「眷族種詐称」の真相。
  quotes:
  - quote: そして、最大の火種を掠め取った。「『ファンへの裏切り！　歌姫Spear、眷族種詐称が発覚！　異形の耳はその心の現れなのか』――これは確実に良く燃えますぞ～」
    paragraph: p113-p115
    quote_verified: true
  expected_payoff: 歌姫の正体（半妖精や闇妖精との混血、あるいは魔将との関係性）が公にされることによる社会崩壊。ロシンたちの「同胞」意識との対比。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_kiron_wings_truth
  note: ロンシンが知らなかった「半妖精の翅切除」の慣習と、キロン（歌姫/師）の正体に関する真実。
  quotes:
  - quote: 君たち地上の人間は、翅の形質を発現させた半妖精が生まれると臍の緒と一緒に翅も切ってしまうのだと、こちらに逃れてきた闇妖精系のアヴロノたちから聞いたよ。
    paragraph: p163
    quote_verified: true
  - quote: ロシンは愕然として叫ぶ。「キロン様は北辺帝国の出身で――いや、でも確か、西北系の半妖精（アヴロノ）だと――そんな、まさか。しかし翅などは生えていなかったはず」
    paragraph: p161
    quote_verified: true
  expected_payoff: キロンがなぜ翅を隠しているのか（あるいは切除されているのか）、その背景にある悲劇的な過去と、ロシンへの影響。ロシンが「蝗の皇」として変身する際、この真実がどう作用するか。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_restrose_plan
  note: 魔軍元帥レストロオセ（セレクティ）の「罪の再分配」という構想の詳細と、ガルズの「全人類再生者化」計画との対立構造。
  quotes:
  - quote: レストロオセ様は、どのような必要悪であろうとも、特定の誰かだけが重すぎる責任を背負って潰される事を良しとしない。それでは地上のように生贄の山を積み重ねるだけになってしまう。ゆえにこそ、罪を分かち合い、理想的な再分配を行う手段を模索しておられるんだ
    paragraph: p267
    quote_verified: true
  - quote: あのガルズって奴の計画もそうとうイカレてるが――実際どうなのかは呪術の専門家じゃねえ俺にはわかんねえ。もしかしたらあいつのやり方も一つの道かもしれねえな。
    paragraph: p271
    quote_verified: true
  expected_payoff: 戦争終結後の世界構築における「正義」の定義。魔将たちが自らの罪をどう処理し、地上の人々との和解をどう実現するか。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_pale_and_ils_relationship
  note: ペイルがプリエステラを守るために受けた傷と、イルスの治療行為の背景にある感情（裏切り者への対応）。
  quotes:
  - quote: 残されたイルスは、寡黙にペイルを治療し続ける。彼は、ただ癒すだけだった。ティリビナの民に裏切り者と言われた黒檀の民は、その心中を明かすことなく、ただ周囲に満ちる暖かな呪力、花の結界が放つ芳しい薫りを少しだけ吸い込んだ。
    paragraph: p330-p332
    quote_verified: true
  expected_payoff: プリエステラの離脱（魔将側へ）がイルスとペイルの関係にどう影響するか。花の結界が単なる防御を超えた象徴である可能性。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
