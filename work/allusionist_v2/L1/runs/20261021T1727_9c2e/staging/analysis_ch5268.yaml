- kind: mystery
  name: MY_ラクルラールの自律性
  note: 人形が自発的に歩き、一礼し、知性的な振る舞いを見せる。これは単なる呪具ではなく、内部に魂や意思が宿っている可能性を示唆する伏線である。
  quotes:
  - quote: まるで、がらんどうの筈の内部に血と肉と臓物と魂とが詰め込まれているのではないか、と思わされるような、異形の艶めかしさがその真っ白な、非人間的な裸体にはあったのだった。
    paragraph: p74
    quote_verified: true
  - quote: 赤い絨毯の上に立たされたそれは、ふらふらとふらつきながらも自立し、更にはひとりでに歩き出した。意思を持っているかの如くに賢者セレスの目の前に立つと、腰を折り曲げて一礼する。見事なお辞儀だった。
    paragraph: p76
    quote_verified: true
  expected_payoff: 後の章でラクルラールが自立し、物語のキーパーソンとして行動を開始する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
