- kind: mystery
  name: MY_四つの月蝕の凶兆
  note: ラフディの加護（大地と夜、人狼）を司る月が全て消える現象。これは社会の基盤である宗教的・種族的なバランスが崩壊することを意味する。
  quotes:
  - quote: 四つの月が隠れてしまうことは、双方の加護が消失することを意味する。ラフディという国に住まう者ならば天地がひっくり返ったかと思うほどの出来事である。
    paragraph: p225
    quote_verified: true
  expected_payoff: 人狼の種族としての能力喪失、魔物の侵攻、または神々の不在を利用した敵の襲来が始まる。
