  review_status: unreviewed
- kind: mystery
  name: MY_Dispensata_Promise_Consequence
  note: ディスペータとの「絶対遵守の誓い」があり、破った場合は行動の報いを受けるとされる。メイファーラは既に「裏切りながら約束を守っている」と記述されており、この矛盾がどのような罰や代償として顕現するかが伏線。
  quotes:
  - quote: 「決して、みんなに危害を加えるような『おいた』は駄目ですよ。これは絶対の約束です。もし破ったなら、私はあなたを許しはしないでしょう――何があっても、貴方は行動の報いを受けることになる」
    paragraph: p293
    quote_verified: true
  - quote: 'だから、メイファーラは裏切りながら約束を守った。

