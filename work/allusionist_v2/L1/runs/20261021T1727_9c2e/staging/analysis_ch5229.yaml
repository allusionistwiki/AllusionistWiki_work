    paragraph: p303-p304
    quote_verified: true
  expected_payoff: ディスペータによる直接的な制裁、あるいは契約違反による魔力の暴走や呪いの発動。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
