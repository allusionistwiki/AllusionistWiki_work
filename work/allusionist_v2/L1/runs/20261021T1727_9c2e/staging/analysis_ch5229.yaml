  - quote: それがメイファーラ・リト＝ユディーアというジャッフハリム四十四士にして存在を秘された真の第九魔将の本質だ。
    paragraph: p335
    quote_verified: true
  - quote: '無彩色の妖精は使えない。けれど、使う為には絶対に必要な存在。

