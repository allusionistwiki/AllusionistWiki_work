- canonical_target: '[[E_char_ペイルナトイルス]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5160_ペイルナトイルス_has_property_資質_p13
        quote: そして三人の男たち。あれは中々に面白い。このまま放り出すのもつまらない。資質もあるようだし、使えるようなら自らの勢力に取り込んでしまうのもいい。
        locator: {}
        spoiler_after: ch5160
  first_appearance_candidate: true
- canonical_target: '[[E_char_イルス]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5160_イルス_appears_as_覚悟を決めた表情_p17
        quote: 連れてこられたイルスは、覚悟を決めた表情で唇を引き結んでいる。
        locator: {}
        spoiler_after: ch5160
      - event_ref: E_ch5160_イルス_other_驚き_p32
        quote: 自らが異教徒であることを認めたイルスは、僅かに目を見開いた。
        locator: {}
        spoiler_after: ch5160
      - event_ref: E_ch5160_イルス_other_唖然_p84
        quote: イルスは唖然とした。目を見開いて、口を開く。彼がこのような間の抜けた表情をするのは極めて珍しいことであった。しかし無理もない。ハルベルトの発言はあまりにも。
        locator: {}
        spoiler_after: ch5160
    speech:
      observations:
      - event_ref: E_ch5160_イルス_confesses_身の上話の意図_p19
        quote: 「言い訳をするつもりはない。覚悟は既に決めている。露見していると思ったがゆえに、あのような身の上話をしたのだ。後悔無く逝けるようにな」
        locator: {}
        spoiler_after: ch5160
      - event_ref: E_ch5160_イルス_other_権威の否定_p56
        quote: それは、天に刃を向けるかの如き意思だった。大神院。槍神教、いや地上世界そのものとも言える最高の権威を、彼女は異端だと言ったのか。彼女が裁くべき異端が正統そのものであるならば、それは異端そのものの肯定ということになる。
        locator: {}
        spoiler_after: ch5160
  first_appearance_candidate: true
