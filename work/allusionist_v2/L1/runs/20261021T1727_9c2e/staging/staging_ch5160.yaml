entities:
- canonical_target: '[[E_char_ハルベルト]]'
  entity_type: character
  aspects:
    relationship:
      observations:
      - event_ref: E_ch5160_ハルベルト_other_邪神認定者_p10
        quote: 槍神教に邪神と見なされているハルベルトがその内側にいることを許されている時点で、そのおぞましき聖絶の理は絶対では無いのだ。
        locator: {}
        spoiler_after: ch5160
      - event_ref: E_ch5160_ハルベルト_has_property_多重所属_p10
        quote: ティリビナの民とは松明の騎士団に所属する以上何らかの対処をしなければならない。しかし、自分は智神の盾の一員でもある。その上、星見の塔から招聘された部外者だ。
        locator: {}
        spoiler_after: ch5160
    speech:
      observations:
      - event_ref: E_ch5160_ハルベルト_other_独自解決法_p11
        quote: 自分にしか出来ない解決方法がある。
        locator: {}
        spoiler_after: ch5160
      - event_ref: E_ch5160_ハルベルト_other_運命の導き_p16
        quote: 彼とプリエステラがここに居合わせたのは、果たしてどのような運命の導きによるものなのだろうか。
        locator: {}
        spoiler_after: ch5160
      - event_ref: E_ch5160_ハルベルト_defines_異端審問官の役割_p24
        quote: 「異教徒の異端審問官――松明の騎士団の内側に巣くう病根を駆逐する最も容赦なき掃除屋。我々のような異質な外敵を理解できるがゆえに、誰よりも効率的に異端を狩ることができる恐怖の体現者」
        locator: {}
        spoiler_after: ch5160
      - event_ref: E_ch5160_ハルベルト_other_イルスの定義_p28
        quote: 「あなたは異端というより異教徒。ハルの本来の役割からは外れる」
        locator: {}
        spoiler_after: ch5160
      - event_ref: E_ch5160_ハルベルト_defines_異端審問官の真の役割_p43
        quote: 「異教徒の異端審問官――その役割は、槍神教の内部を監査して組織の歪みを修整すること。異端と見定めたものを解体し、再構築すること」
        locator: {}
        spoiler_after: ch5160
      - event_ref: E_ch5160_ハルベルト_asks_裁く対象_p45
        quote: 「俺は明らかに槍神教の内側に巣くう病巣だ。その俺を見逃すと貴方は言う。では一体何を異端と見定めているのだ」
        locator: {}
        spoiler_after: ch5160
      - event_ref: E_ch5160_ハルベルト_reveals_異端の所在_p50
        quote: 「ハルは異端を見つけた――歪み、曲がり、手段が自己目的化を繰り返し、信仰という呪術基盤が果たすべき本来の機能を見失った、暴走する空虚な中枢部」
        locator: {}
        spoiler_after: ch5160
      - event_ref: E_ch5160_ハルベルト_other_呪いの解除_p61
        quote: 「ハルは、この不毛な争いを――人にかけられた呪いを解きたいの」
        locator: {}
        spoiler_after: ch5160
      - event_ref: E_ch5160_ハルベルト_has_property_使命_p65
        quote: 「兎は【神々の図書館】のデータベースを管理し、世界の言語秩序を維持する種族。その王族であるハルが果たさなければならない使命は一つ」
        locator: {}
        spoiler_after: ch5160
      - event_ref: E_ch5160_ハルベルト_other_絶対言語の再生_p73
        quote: 「【絶対言語】の再生。引き裂かれた言葉と意思を、再び繋いで語り直す」
        locator: {}
        spoiler_after: ch5160
      - event_ref: E_ch5160_ハルベルト_other_世界平和_p82
        quote: 「世界平和」
        locator: {}
        spoiler_after: ch5160
      - event_ref: E_ch5160_ハルベルト_other_世界を救う_p86
        quote: 「ハルは、世界を救いたいの」
        locator: {}
        spoiler_after: ch5160
      - event_ref: E_ch5160_ハルベルト_thinks_事案の軽視_p9
        quote: ハルベルトはあまり事を深刻に考えていなかった。どうにでもできる。
        locator: {}
        spoiler_after: ch5160
    action:
      observations:
      - event_ref: E_ch5160_ハルベルト_other_プリエステラへの関与_p12
        quote: いずれにせよプリエステラと出会ってしまった以上、もう知らぬふりは出来ないのである。メートリアン共々、どうにかしてやろうとハルベルトは決定した。
        locator: {}
        spoiler_after: ch5160
      - event_ref: E_ch5160_ハルベルト_conceals_記録の欺瞞_p3
        quote: 言語魔術師ハルベルトがそれを妨げなければの話だが。
        locator: {}
        spoiler_after: ch5160
      - event_ref: E_ch5160_ハルベルト_has_property_呪文詠唱の衰え_p4
        quote: 作業が繁雑になることなく、戦闘に集中することができたのだが、それでも『重い』ことは確かだ。呪文詠唱の閃きが今ひとつだったことは否定できない。
        locator: {}
        spoiler_after: ch5160
      - event_ref: E_ch5160_ハルベルト_other_五重の改竄処理_p4
        quote: 死闘の後。その夜に起きた記録の欺瞞を激戦と平行して行っていた彼女は、五重の改竄処理を一括して管理実行している。
        locator: {}
        spoiler_after: ch5160
      - event_ref: E_ch5160_ハルベルト_other_三人組の言いくるめ_p5
        quote: すぐにハルベルトは思考を切り替えた。それはそれ。アズーリアとメイファーラは問題ないとして、三人組をどう言いくるめようか。
        locator: {}
        spoiler_after: ch5160
      - event_ref: E_ch5160_ハルベルト_other_メートリアンの処遇_p6
        quote: さしあたって、メートリアンの処遇をどうしようか。
        locator: {}
        spoiler_after: ch5160
      - event_ref: E_ch5160_ハルベルト_other_修道騎士の重傷_p8
        quote: 問題はティリビナの民の処遇と、イルスの治療で一命を取り留めたものの重傷を負った二人の修道騎士に関してである。
        locator: {}
        spoiler_after: ch5160
  first_appearance_candidate: true
