        quote: 松明の騎士たちの視界映像は呪動装甲もしくは寄生異獣を制御する金鎖によって記録されている。それは金鎖システム上で共有され、エルネトモランの本部へと送信されることになっていた。
        locator: {}
        spoiler_after: ch5160
  first_appearance_candidate: true
- canonical_target: '[[E_org_大神院]]'
  entity_type: organization
  aspects:
    speech:
      observations:
      - event_ref: E_ch5160_大神院_other_内部テロリスト_p35
        quote: 亜大陸独立戦線、精霊再生協会、緑の同胞団――槍神教内部に深く浸透しているテロリストや企業の密偵、下方勢力の工作員や諜報員の存在は星見の塔や大神院も把握している。知っていて放置しているの
        locator: {}
        spoiler_after: ch5160
      - event_ref: E_ch5160_大神院_loses_判断力_p39
        quote: 「取るに足らない――ううん。そもそも、そういう秩序を維持するための判断力は大神院からは失われている」
        locator: {}
        spoiler_after: ch5160
  first_appearance_candidate: true
- canonical_target: '[[E_term_第四衛星太陰]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5160_第四衛星太陰_functions_as_データベース管理中枢_p67
        quote: 月を見上げながらハルベルトは呟いた。第四衛星、太陰（イルディアンサ）。散らばった無数の言語を集積したデータベース。その管理中枢。世界の意思を伝える媒介記号が集う場所。混沌の中の秩序。
        locator: {}
        spoiler_after: ch5160
  first_appearance_candidate: true
- canonical_target: '[[E_term_事件]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5160_事件_defines_私闘_p7
        quote: 元々松明の騎士団とは無関係に起きた出来事である。勝負もまた勝手な私闘に過ぎず、勝手に探索をして勝手に探索者と揉めた、で片がつく話ではある。
        locator: {}
        spoiler_after: ch5160
  first_appearance_candidate: true
