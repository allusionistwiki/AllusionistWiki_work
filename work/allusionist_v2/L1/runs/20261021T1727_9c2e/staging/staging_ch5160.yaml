        quote: 終わりのない消費（ポトラッチ）の螺旋の中で、世界は緩慢に死んでいく。
        locator: {}
        spoiler_after: ch5160
  first_appearance_candidate: true
- canonical_target: '[[E_term_人類]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5160_人類_other_停滞と延命_p71
        quote: 奪え、殺せ、勝ち取れ。野蛮へと絶え間なく後退し、停滞し続けることを人類は選択した。そうして、停滞の中で利益を貪り延命を続ける。革新や前進の意思は巨大な構造に圧殺される。
        locator: {}
        spoiler_after: ch5160
  first_appearance_candidate: true
