- kind: theme
  theme: 情報戦と認識操作による支配（メディア・ナラティブの権力化）
  weight: 0.9
  quotes:
  - quote: これまでの六王たちには無かった戦略、現代では常套手段となった情報による先制攻撃。印象を微調整し、文脈を自らに引き寄せ、自陣営の正統性を主張しつつ敵対陣営の悪辣さを強調する。
    paragraph: p50
    quote_verified: true
  - quote: それはリールエルバの力と恐怖が承認されていくということだ。新たなドラトリアを統べる始祖吸血鬼カーティス。情報として、噂として、実体の無い輪郭だけが存在感を増していき、ネットスペースにおける領土を瞬く間に拡大する『死人の森』。
    paragraph: p45-p48
    quote_verified: false
  note: リールエルバが動画配信者やアストラルネットを用い、「事実」ではなく「認識・文脈」を操作して支配権を得る過程。現代のSNS/メディア政治のメタファー。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 物語構造（クリシェ）への抵抗と理不尽な暴力
  weight: 0.8
  quotes:
  - quote: 試行錯誤の結果、屍が山となるまで彼らは必死に目を逸らし続けてきた事実をついに認めざるを得なくなった。つまり、魔竜には文脈を絡めた攻撃が一切通用しない。
    paragraph: p201-p202
    quote_verified: true
  - quote: 見透いた挑発であり、多くの物語の筋では賢者の口車に乗せられて怪物はこのまま封じられてしまうのが常ではあるが、魔竜はそのような呪文に捕らわれたりはしなかった。
    paragraph: p196
    quote_verified: false
  note: 異世界転生や冒険譚の定番（弱点狙い、賢者の知恵、名乗り）が通じない「抗メタフィクション」。物語の論理が暴力の前に崩壊する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
