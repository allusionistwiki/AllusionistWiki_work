- kind: mystery
  name: MY_Akira_Disease_Form_Outbreak
  note: シナモリアキラ（アキラ）が「外破」で「病の形」を解放し、歴史上の大量死と恐怖を溢れ出させる。この「病」の正体。
  quotes:
  - quote: 『外破（アウトブレイク）』――これこそ俺たち病気持ちのシナモリアキラが固有に持つ『病の形』を解放する特殊宣名。
    paragraph: p284
    quote_verified: true
  expected_payoff: アキラ単体ではなく、「疫病・隔離・パンデミック」そのものが戦闘単位として描かれる展開への接続。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_Name_Power_Mechanic
  note: 「お腹ゴロゴロ村のゲリ便ブリブリ太郎」という名を付けられることで始祖が縮小・撃破される。命名による存在規定（言霊）の力。
  quotes:
  - quote: 十万の認識が宣名より早く存在を規定。灰髪の女が叫ぶ。「汝の御名にまことは非ず！...『お腹ゴロゴロ村のゲリ便ブリブリ太郎』！」
    paragraph: p307-p311
    quote_verified: false
  expected_payoff: 物語後半における「名前を叫ぶ」行為が、世界改変や敵撃破の鍵となるギミックとして再登場する可能性。
