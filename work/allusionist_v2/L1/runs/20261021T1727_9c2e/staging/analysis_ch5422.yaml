- kind: mystery
  name: MY_Triushula_Damocles_Sword
  note: リールエルバがトリシューラに対し「ダモクレスの剣」の存在を問う。誰がその危機を負っているのか、あるいはトリシューラ自身がその対象か。
  quotes:
  - quote: ダモクレスの剣がいま誰の頭上にあるのか、正しく理解できていて？
