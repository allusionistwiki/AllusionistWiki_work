- kind: theme
  theme: 非定住と帰属意識の欠如（アパライドな世界）
  weight: 0.4
  quotes:
  - quote: ガロアンディアンは家を自由に創造する仮宿の街、非定住の都市だ。土地の所有と管理は公社のロドウィが失脚して以来トリシューラに委ねられ、子供も教育も伝統文化も地域社会も希薄なあやふやな国家に帰属意識を持つ者などほぼいない。人々は非愛国化していた。
    paragraph: p213
    quote_verified: true
  note: 「家」や「郷土」を持たない探索者たちの流動性。リールエルバの支配が、固定された領土ではなく「情報と恐怖」で構成される理由付け。
