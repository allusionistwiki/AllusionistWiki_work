- kind: theme
  theme: 太陽神権威の絶対的介入：人智を超えた力が戦場の力学を一方的にリセットする
  weight: 0.6
  quotes:
  - quote: その男は太陽だった。……あらゆる者がその男を見ようとするが、あまりの眩しさに反射的に眼を閉ざす。
    paragraph: p85-p86
    quote_verified: false
  - quote: 放たれた光球は大地に着弾し、そのまま巨大な熱と光を周囲に撒き散らしていく。太陽の炎が不浄な瘴気をカーインごと焼き尽くし、地の穢れを清めていった。
    paragraph: p98
    quote_verified: true
  note: シナモリアキラ（太陽）の介入が、カーインとルバーブの拮抗した戦いを一方的に破壊し、物語の主導権が再び主人公側に戻る転換点となっている。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 身体の変容と物象化：生首や土塊など、人体が部品として扱われる恐怖
  weight: 0.4
  quotes:
  - quote: 頭から墜落したことで首のジョイント部が破損して外れた。生首は数回派手にバウンドした後、ごろごろと転がっていく。
    paragraph: p3
    quote_verified: true
  - quote: 地面を切り裂き、そのまま深く突き刺さっていった糸が地の底から巨大な土塊を引きずり出したのである。そればかりか、マラードによって魂を注ぎ込まれた土は命を宿し、岩石巨人となって動き出す。
    paragraph: p154
    quote_verified: true
  note: シナモリアキラの生首やルバーブの土塊化など、人間が物質・部品へ変質する描写を通じて、異世界転生における身体観の脆さを示唆している。
  proposed_by:
