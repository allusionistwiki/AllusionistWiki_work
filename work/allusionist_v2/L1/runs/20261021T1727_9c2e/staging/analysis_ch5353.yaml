- kind: theme
  theme: 知性の暴力：神秘を解体（命名・分類）することによる支配と恐怖の克服
  weight: 0.7
  quotes:
  - quote: 『杖』の叡智は吸血鬼が操る『瘴気』という曖昧な呪力を解体し、細菌やウィルス、寄生虫や毒素といった形に零落させることが可能だ。
    paragraph: p57
    quote_verified: true
  - quote: その上、貴様はまだ本気を出していない。血統の根源たる『病』の宣名無しで私に挑もうとは舐められたものだ。
    paragraph: p53
    quote_verified: true
  note: ルバーブとカーインの対決が、物理的な暴力だけでなく『正体を暴く（知性）』ことが勝敗を分ける要素であることを描いている。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
