- kind: mystery
  name: MY_Zoe_Clone_Battle
  note: ゾーイの無数のコピーによる殺し合い。ケイトが「最後の一人になれば殺し合いは止まる」と説き、実際に一人が残ることで停止した。この「総体としてのゾーイ」の定義や、なぜコピーが増殖し続けたのか（カーティスの意図か、世界のバグか）が今後の展開に影響する可能性。
  quotes:
  - quote: 全て、ゾーイ・アキラ本人だったからである。
    paragraph: p118
    quote_verified: true
  - quote: （冷静になれ！　最後の一人になれば殺し合いは止まる。僕らが死んだとしても一人残れば総体としてのゾーイは継続する！）
    paragraph: p131
    quote_verified: true
  expected_payoff: ゾーイの「本体」と「コピー」の関係性が、後の戦闘能力や自己同一性の危機として再登場する。また、カーティスが「外世界人の従僕」「複製して両方試して見ればいい」と言及した通り、ゾーイが吸血鬼化・複製された個体として敵対的役割を担う可能性が高い。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_Curtis_Time_Shadows
  note: カーティスが過去・現在・未来の自分自身（影）を使って戦い、意思決定を行っている。「過去の改竄」「再演」という言葉があり、時間操作能力が物語の核心に深く関わっている。特に「運命の流れは変えられない」という発言と行動の矛盾。
  quotes:
  - quote: 「その通り。数日前から毎日私を未来に送って君に攻撃を仕掛け続けていた。」
    paragraph: p200
    quote_verified: false
  - quote: 「まず大地が平面となり、それから二つに引き裂かれることだろう」「些細な未来は変えられても、運命の流れは変えられない」「それが世界というものだ」「それがさだめというものだ」
    paragraph: p213
    quote_verified: true
  expected_payoff: カーティスの時間操作が、ゾーイたちの「元世界との通信」や「転生保険」の仕組みと対立・融合し、世界の破壊（大地が平面になり引き裂かれる）という予言が現実化する過程で、カーティスがその「さだめ」をどう操るかが明かされる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_Triad_Corporate_Mission
  note: トライデントホールディングス（TGSJ/TRI）が「多世界企業」として外世界進出を目指しており、ゾーイとケイトはその「荒事を一手に片付ける」ために派遣されている。「カーティスと行動を共にせよ」「ドラトリアの王...協力態勢を築こうとする者...妨害せよ」という指令の意味が不明確。
  quotes:
  - quote: カーティスと行動を共にして、可能ならば殺害せよ。ドラトリアの王と名乗る人物に接触し、協力態勢を築こうとする者があれば、それもまた妨害せよ。
    paragraph: p163-p164
    quote_verified: true
  expected_payoff: カーティスが「殺害対象」でありながら「行動を共にする（従僕化される）」というパラドックスが解決されるか、ゾーイが企業から切り離され個人として覚醒するか。ドラトリアの王との関係が世界の政治構造を左右する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
