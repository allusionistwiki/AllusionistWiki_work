- kind: mystery
  name: MY_Skilitia_God_Intervention
  note: スキリシアの神（ナラティブ上の語り手）が「僕はいいんだ...弱いんだから幾らでも現世に干渉していい」と言い、ゾーイたちを退場させた後、「外側から操って、せいぜい望む未来を手繰り寄せてみせるさ」と宣言。この神の意図的な介入（ゲームマスターとしての役割）が物語をどう誘導するか。
  quotes:
  - quote: 「外側から操って、せいぜい望む未来を手繰り寄せてみせるさ。過去であろうと未来であろうと、この夜は常にこのマロゾロンドのものなのだから。」
