          俺はこの少女と会ったことがある。'
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_アキラ_thinks_嘘_p167
        quote: ますます意味が分からない。コルセスカは一体何がしたくてあんな嘘を？
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_アキラ_remembers_敗北_p22
        quote: 「俺は、確か負けて」
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_アキラ_thinks_年齢_p39
        quote: いわゆるおさげの髪型、口調や声、容貌から判断すると、コルセスカと同年代くらいだろうか。かなり若い、少女と言ってもいいくらいの年頃だと思われた。
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_アキラ_observes_声_p4
        quote: 知らない声だった。
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_アキラ_observes_言語_p49
        quote: そしてもう一つ。俺も相手も日本語で会話をしている。『心話』とかコルセスカとの特殊な意思疎通とも違う、日本語と日本語の応答になっている。
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_アキラ_fears_闇医者_p87
        quote: ぞっとする。無資格のモグリ医師に体をいじり回されたのかと思うと急に恐怖が襲ってきた。
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_アキラ_confesses_感謝_p93
        quote: 「全く安心はできませんでしたが、とにかくありがとうございます。おかげで助かりました」
        locator: {}
        spoiler_after: ch5036
    action:
      observations:
      - event_ref: E_ch5036_アキラ_has_property_脱力状態_p18
        quote: というより、それ以前の問題だった。まるで力が入らない。全身が脱力して、倦怠感に包まれている。
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_アキラ_observes_状況_p8
        quote: そして気付いた。俺は今、寝台の上で仰向けに寝そべっている。
        locator: {}
        spoiler_after: ch5036
