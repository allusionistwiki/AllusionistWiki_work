entities:
- canonical_target: '[[E_char_トリシューラ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5036_トリシューラ_wears_黒いワンピース_p103
        quote: 私服なのだろう、服装は黒い長袖のワンピース。丈が短く、すらりとした脚がよく映えていた。黒いタイツがショートブーツまでの脚部を完全に覆っているので、全体のシルエットは細く、そして非常に暗い。
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_トリシューラ_appears_as_影_p105
        quote: まるで影のようだった。
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_トリシューラ_wears_灰色のファーストール_p125
        quote: 'トリシューラの服装の中で、髪色の次に目立つポイント。

          冬らしさを感じさせる、灰色のファーストール。'
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_トリシューラ_has_property_読めない表情_p183
        quote: トリシューラの表情は曖昧な微笑みのまま少しも動かない。物静かなコルセスカも表情が読みづらかったが、この相手もいまいちよく分からない。
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_トリシューラ_has_property_息づかいの不在_p31
        quote: そうだ。この声には、息づかいが感じられない。
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_トリシューラ_has_property_呼吸の不在_p32
        quote: 目の前にある女性の顔には整った形の鼻も口もあるのだが、それらが呼吸しているように見えないのだ。
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_トリシューラ_appears_as_ビスクドール_p34
        quote: 遅れて認識する。相手の相貌はぞっとするほど整っている。美術品の彫像というか、人形めいていた。緑色の目は大きく、肌の白さも相まってビスクドールのようだった。
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_トリシューラ_has_property_赤毛_p36
        quote: 髪色は赤い。生来の赤毛であるのか、それとも染めているのか。判断の付きにくいほどにその色は深く、にも関わらず透き通るようなきめ細かい髪質。
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_トリシューラ_wears_おさげ髪_p38
        quote: 左右に流れた毛束が黒いシュシュによって肩の所で二つに結ばれており、毛先は緩やかに巻かれていた。
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_トリシューラ_has_property_声質_p5
        quote: 発音のひとつひとつが明瞭ではっきりとした、活気のあるソプラノだ。
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_トリシューラ_appears_as_女性_p6
        quote: 一瞬だけ少年の声かとも錯覚したが、上から俺を覗き込むその顔は女性のものだった。
        locator: {}
        spoiler_after: ch5036
    speech:
      observations:
      - event_ref: E_ch5036_トリシューラ_asks_返答の可否_p11
        quote: 「うん、意識ははっきりしてるみたいだね。返事はできる？」
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_トリシューラ_says_異世界知識_p135
        quote: 「そんなに特別なことでもないよ？　顔の皮をなめして表紙にした魔導書とか、人骨の呪具とか、頭蓋骨の首飾りとか、第五階層に限らず普通に売ってるんだよ。貴方の世界にもそういうの、なかった？」
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_トリシューラ_says_三日間_p145
        quote: 「丸三日は眠ってたよ。それはもうぐっすり」
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_トリシューラ_stops_アキラの動作_p15
        quote: 「まだ動いちゃだめ」
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_トリシューラ_asks_翻訳作業の必要性_p150
        quote: 「え？　なにそれどういう事？　翻訳するために一週間一緒にいて会話し続ける？　どうしてそんなことする必要があるの？」
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_トリシューラ_reveals_電子データによる言語定着_p161
        quote: 「貴方の言うような面倒な翻訳作業なんてしなくても、辞書やコーパスなんかの電子データをそっちの世界から送ってもらえばいいわけでしょう。言語資源は非常に価値が高い上に権利関係が複雑だから、こっちの一般人が手に入れようとしても難しいけれど。『塔』はそちらの世界との繋がりがあるからね。手続きに時間がかかったとしても、不可能ではないはず。だからずっと一緒にいる意味なんて無いよ？」
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_トリシューラ_says_理由なき同席_p175
        quote: 「貴方は、誰かと一緒にいることに理由を求めるタイプなんだね」
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_トリシューラ_says_アキラ_p2
        quote: 「おはようアキラくん。気分はどう？」
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_トリシューラ_has_property_アーティフィシャルな声_p29
        quote: 美しい声だというのに、どこか違和感を覚えてしまうのは何故だろうか。スピーカーを通して喋っているかのような、奇妙にアーティフィシャルな感じのする声。
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_トリシューラ_confesses_無許可の開頭手術_p41
        quote: 「ちょっと無許可で開頭しちゃったけど許してね」
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_トリシューラ_says_死の回避_p53
        quote: 「そう。貴方の意思とか確認せずにやっちゃったけど、放置してたら意識不明のまま死んでたし、許してね。宗教上の理由で訴訟とかされると困っちゃうなー」
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_トリシューラ_has_property_無資格医師_p84
        quote: 「ちなみに呪術師としては『星見の塔』の所属だけど、医師としては無資格だよ」
        locator: {}
        spoiler_after: ch5036
      - event_ref: E_ch5036_トリシューラ_says_ミスなし_p91
        quote: 「物事に絶対はありえないから断言はしないけど、まあ多分ミスはしてないよ。だから安心して」
        locator: {}
        spoiler_after: ch5036
    symbolic:
      observations:
      - event_ref: E_ch5036_トリシューラ_wears_剥いだ毛皮_p129
        quote: だが、それを身につけるということはこの第五階層においてはそれなりの意味を持つ。『下』の人間から剥いだ毛皮を身に纏うという行為は、ある特定の人種の神経を逆撫でする。
        locator: {}
