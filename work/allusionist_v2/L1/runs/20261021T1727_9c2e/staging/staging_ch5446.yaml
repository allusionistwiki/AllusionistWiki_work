  first_appearance_candidate: true
- canonical_target: '[[E_char_ヒロイン白のメートリアン]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5446_ヒロイン白のメートリアン_appears_as_名前のない女_p51
        quote: '彼女にはこの舞台特有の役名が無い。

          空白――名前が無い女。顔や声などの特徴もどこかぼんやりして感じられる。

          他の誰かに名前を呼ばれる時も、そこだけ不自然に音が欠落したり、『君』とか『貴方』とかの二人称が使われるだけ。'
        locator: {}
        spoiler_after: ch5446
  first_appearance_candidate: true
