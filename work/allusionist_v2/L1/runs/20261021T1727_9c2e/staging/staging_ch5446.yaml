entities:
- canonical_target: '[[E_char_アレッテ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5446_アレッテ_defines_裏切り_p103
        quote: 'いつだったか、まだ私がトリシルシリーズの失敗作として淘汰される前にアレッテが言っていた。裏切りには幾つかの種類があると。

          ひとつは偽証。呪文を紡ぎ、誰かの世界観に反する物語を創造すること。

          もうひとつは頬への口づけ。異なる世界観を拒絶と共に愛すること。'
        locator: {}
        spoiler_after: ch5446
  first_appearance_candidate: true
- canonical_target: '[[E_relation_アキラ]]'
  entity_type: relationship
  aspects:
    speech:
      observations:
      - event_ref: E_ch5446_アキラ_thinks_同化の愛_p108
        quote: 'この裏切りは、きっと頬には届かない。

          私たちは、血を融かすようにして同化する愛しか教わらなかったのだから。'
        locator: {}
        spoiler_after: ch5446
      - event_ref: E_ch5446_アキラ_thinks_悪役としての運命_p15
        quote: だって私は悪役。舞台からの退場を期待されている。
        locator: {}
        spoiler_after: ch5446
      - event_ref: E_ch5446_アキラ_other_ゲーム的展開の欠如_p23
        quote: 嫌がらせをしようとして空回りしたり、高慢に見えて根っこの庶民らしさや人の良さが滲み出て結局ヒロインと仲良くなったり、何だかんだで王子様にも好感を持たれたりするはずじゃなかった？　あのゲーム狂いを信じた私って何なの？
        locator: {}
        spoiler_after: ch5446
      - event_ref: E_ch5446_アキラ_says_嫌がらせの現実論_p25
        quote: 「実体験として言うけど、嫌がらせしたら普通に恨まれて終わりだと思うよ」
        locator: {}
        spoiler_after: ch5446
      - event_ref: E_ch5446_アキラ_defines_存在の由来_p40
        quote: 'この命は人形姫アレッテ・イヴニルの道具。

          この魂は塔の姫アレッテ・イヴニルの代替。'
        locator: {}
        spoiler_after: ch5446
      - event_ref: E_ch5446_アキラ_defines_アルト・イヴニルの古い記憶_p42
        quote: やがて『完全者』に至るアルト・イヴニル――これからも変容し続けていくはずのあの人が置いていった古い記憶、それが私。
        locator: {}
        spoiler_after: ch5446
      - event_ref: E_ch5446_アキラ_defines_がらくたのアレッテ_p43
        quote: もうひとつの邪眼。完全なアルトになれない、がらくたのアレッテだ。
        locator: {}
        spoiler_after: ch5446
      - event_ref: E_ch5446_アキラ_thinks_内なる法と外なる法の対立_p61
        quote: 'その基本的なテーマは『内なる法と外なる法の対立』だ。

          王による埋葬の禁止と、その法を破らんとする者の叛逆がこの茶番を支える本当の筋書きだろう。そして――それを知っているのは恐らく私だけ。'
        locator: {}
        spoiler_after: ch5446
      - event_ref: E_ch5446_アキラ_defines_シナモリアキラの補填_p63
        quote: 前世の多くを欠落させたシナモリアキラでは足りない。だからその不足分を埋めるためにこの私がシナモリアキラに補填された。多分、そういうことだ。
        locator: {}
        spoiler_after: ch5446
      - event_ref: E_ch5446_アキラ_other_運命の共有_p86
        quote: 「クルミ、あなたが罪人なら私もそう。私たちの運命はひとつよ」
        locator: {}
        spoiler_after: ch5446
      - event_ref: E_ch5446_アキラ_betrays_ミヒトネッセ_p97
        quote: '私は連れて行かれるミヒトネッセの味方をしてあげなければならなかったのに。

          ここで助かれば後で彼女を助け出す機会もあるはず――そんなことを考えて、我が身可愛さに姉妹同然の存在を見捨てたのだ。

          私には確かに罪がある。

          この裏切りは逃避であり偽証でもある。'
        locator: {}
        spoiler_after: ch5446
    action:
      observations:
      - event_ref: E_ch5446_アキラ_arrives_断罪の日_p2
        quote: そして、私は断罪の日を迎えた。
        locator: {}
        spoiler_after: ch5446
    name:
      observations:
      - event_ref: E_ch5446_アキラ_names_塔瞳トウコ_p33
        quote: 今回の私が演じるのは紫鶏頭（ムラサキケイトウ）ヒユナではなく塔瞳トウコ。
        locator: {}
        spoiler_after: ch5446
      - event_ref: E_ch5446_アキラ_names_シナモリアキラ/グラッフィアカーネ_p38
        quote: 先ごろ付いた別名はグラッフィアカーネ――いやグラッフィアガットだったかもしれない。まあ、シナモリアキラとしての呼び方なんて適当でいいけれど。
        locator: {}
        spoiler_after: ch5446
    visual:
      observations:
      - event_ref: E_ch5446_アキラ_observes_王子とヒロインの視線_p7
        quote: '舞台の上に立つ私は照明に追い詰められ、学生たちのひそひそとした囁きと怒りに満ちた視線によって包囲されていた。

          目の前には刃のように鋭い美貌の王子様と、彼に庇われているいたいけな少女。'
        locator: {}
        spoiler_after: ch5446
      - event_ref: E_ch5446_アキラ_observes_クルミから消えるゼドの気配_p81
        quote: 私の前に立つクルミからゼドの気配が失われている。
        locator: {}
        spoiler_after: ch5446
  first_appearance_candidate: true
- canonical_target: '[[E_char_レイ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5446_レイ_other_アキラの嫌がらせ_p11
        quote: 「君がいままで私に隠れて彼女に卑劣な嫌がらせを行っていた事実は白日の下にさらされた。君が生ける屍と蔑んだ彼女の勇気ある告発によって」
        locator: {}
        spoiler_after: ch5446
      - event_ref: E_ch5446_レイ_names_塔瞳トウコ_p29
        quote: 「塔瞳（とうどう）トウコ、我々は君を告発する！　学院を統べる死の女王の裁判にかけられて、冥府の天秤に自らの命運を預けるといい！」
        locator: {}
        spoiler_after: ch5446
      - event_ref: E_ch5446_レイ_breaks_婚約_p4
        quote: '「残念だ、君との婚約を破棄しなくてはならないとは」

          その言葉に込められていたのは失望と軽蔑。'
        locator: {}
        spoiler_after: ch5446
      - event_ref: E_ch5446_レイ_other_死者の埋葬_p58
        quote: 「死者の埋葬――懸命に生きているクラスメイトに対して、なんという非道な仕打ちだろう。君は彼女を死者として扱った。机に花瓶を置き、いないものとして扱い、土の下に埋め、墓石を用意し、祈りすら捧げようとした。こんな陰湿ないじめが他にあるか？　私は怒りにうち震えている」
        locator: {}
        spoiler_after: ch5446
    name:
      observations:
      - event_ref: E_ch5446_レイ_defines_クレイ/紀人ゼド_p78
        quote: '学園の王子様――無花果レイ。

          あれは、新しく創造されたクレイだ。

          レイの影が蠢く。複数の光源に照らされて分かれていく影法師が、それぞれ異なる姿をとる。六人分の魂を内包した新たなレイは、今や紀人ゼドと同一存在だ。'
        locator: {}
        spoiler_after: ch5446
    visual:
      observations:
      - event_ref: E_ch5446_レイ_appears_as_初々しい演技者_p9
        quote: 艶やかな黒髪を後ろで束ねた若者の演技はどこか初々しい。小柄な白髪の少女に一瞬だけ向けた気遣わしげな視線の柔らかさは、剣を体現していた『以前の彼』には無かったものだ。この王子様はきっとこれまでのように甘くない。
        locator: {}
        spoiler_after: ch5446
  first_appearance_candidate: true
