      observations:
      - event_ref: E_ch5446_コルセスカ_names_個性の薄い主人公_p54
        quote: コルセスカ曰く、『個性の薄い主人公（ヒロイン）』。
        locator: {}
        spoiler_after: ch5446
  first_appearance_candidate: true
- canonical_target: '[[E_org_第五階層]]'
  entity_type: organization
  aspects:
    speech:
      observations:
      - event_ref: E_ch5446_第五階層_functions_as_古典劇の上演場_p60
        quote: 基幹参照世界から引用された古典劇――普遍的な神話や寓話、心的性質を巡る物語によってある種の儀式を成立させようという試みは、この第五階層で繰り返し行われ続けてきた。
        locator: {}
        spoiler_after: ch5446
  first_appearance_candidate: true
- canonical_target: '[[E_char_クルミ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5446_クルミ_confesses_いじめの罪_p65
        quote: '「全ては私がやったことよ。いじめにトウコは荷担してないわ」

          状況を分析していると、事態は思わぬ方向に進み出した。

          私を庇おうとする人物が新たに登場したのだ――頭の左右で二つの髪房を揺らす砂茶色の少女人形、疼巻羽クルミ（ミヒトネッセ）である。'
        locator: {}
        spoiler_after: ch5446
      - event_ref: E_ch5446_クルミ_other_アキラの同行_p88
        quote: 「いいえ。私の運命は冥府にあり、トウコの運命は舞台にある。それだけのこと」
        locator: {}
        spoiler_after: ch5446
    action:
      observations:
      - event_ref: E_ch5446_クルミ_saves_アキラ_p83
        quote: 'それでも彼女は私を庇ってくれた。私はレッテであってレッテじゃないのに。

          たとえ定められた芝居の筋書きであったとしても、それは救いのように私の胸を打った。'
        locator: {}
        spoiler_after: ch5446
      - event_ref: E_ch5446_クルミ_escapes_舞台から地下牢へ_p91
        quote: 'クルミは毅然と自らの行いを打ち明けると、両手に手錠を嵌められて地下牢へと連れられていった。

          舞台袖へと消えていくクルミが観客の目から自由になりミヒトネッセに戻っても、彼女は縛られたままだった。私の瞳に映る世界が、舞台と浄界が融け合う不可思議な光景へと変貌していく。ミヒトネッセはクルミであり、舞台袖からそのまま学院地下にある牢獄へ連行されていった。'
        locator: {}
        spoiler_after: ch5446
  first_appearance_candidate: true
