        locator: {}
        spoiler_after: ch5103
      - event_ref: E_ch5103_トリシューラ_threatens_去勢_p55
        quote: そうそう、私とセスカ以外の相手に発情したらいけないんだからね。そういうのはしっかり私が管理制限します。とりあえず去勢しないとだね」
        locator: {}
        spoiler_after: ch5103
      - event_ref: E_ch5103_トリシューラ_says_整備の依頼_p6
        quote: 「アキラくんの手で、整備して、点検して、お手入れしてもらって」
        locator: {}
        spoiler_after: ch5103
      - event_ref: E_ch5103_トリシューラ_reveals_機能制限_p75
        quote: 「あのね、良いこと教えてあげる。私はアキラくんが期待しているようなことができないように設定されてるの。最初から未実装なのか、それともプロテクトがかけられているのか、私には判断できないけど」
        locator: {}
        spoiler_after: ch5103
      - event_ref: E_ch5103_トリシューラ_asks_コルセスカの支援_p95
        quote: 「セスカを助けてあげて」
        locator: {}
        spoiler_after: ch5103
    visual:
