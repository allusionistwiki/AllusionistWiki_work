        locator: {}
        spoiler_after: ch5103
      - event_ref: E_ch5103_トリシューラ_says_ペット論_p41
        quote: 「大事なペットだもの。色々な資料を調べて勉強したんだ。普通の男性はこんな風に、恋人のように接すると喜ぶんだって。ね、アキラくん。こうやって私といちゃいちゃできて嬉しいでしょう。嬉しいよね？」
        locator: {}
        spoiler_after: ch5103
      - event_ref: E_ch5103_トリシューラ_says_好きじゃない_p51
        quote: 「ああ、好きかどうかってこと？ 別に好きじゃないけど」
        locator: {}
        spoiler_after: ch5103
      - event_ref: E_ch5103_トリシューラ_defines_ペットとの関係_p55
