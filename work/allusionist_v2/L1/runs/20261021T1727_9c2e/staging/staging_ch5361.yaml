        quote: '「誰もが健やかに人生を歩める優しい世界。人と人とを繋いでくれる古く絶対なる『ことば』の力で、僕は王国に平和をもたらす」

          （絶対言語の探究が目的ってことかな？　あらゆる言語魔術師の悲願だけど、ヴァージルはそんな典型的な目的で動いてるのかな？）'
        locator: {}
        spoiler_after: ch5361
      - event_ref: E_ch5361_アルト_says_手と手を取り合う世界_p55
