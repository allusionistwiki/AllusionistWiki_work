        locator: {}
        spoiler_after: ch5361
      - event_ref: E_ch5361_パーン_other_全てパンゲオン由来_p242
        quote: '「我が名はパーン。『全て』である者。下らん端役が、俺の覇道を妨げるな」

          「全ての生命の起源、パンゲオンに由来する名だ。俺の宣名圧は他の六王を圧倒し、女神たるフェロニアのそれに迫る。羽虫に抗えるはずもない」'
        locator: {}
        spoiler_after: ch5361
    action:
      observations:
      - event_ref: E_ch5361_パーン_uses_融血呪禁呪_p234
        quote: '禁呪とも呼ばれるクロウサーの秘術の一つ。

          融け合う呪いは共有の呪い。

          与えることと奪うことを同時に行うが、パーンという圧倒的に強固な『我』がそれを使えば、与えようが奪おうが結果は同じだ。

          パーンが全てを塗りつぶす。'
        locator: {}
        spoiler_after: ch5361
