    paragraph: p276
    quote_verified: true
  - quote: 首すら据わっていない少女の宝石の瞳だけが、爛々と輝いてエスフェイルを睨み付けていた。
    paragraph: p291
    quote_verified: true
  note: エスフェイルは「姉（リールエルバ）への依存」がセリアック＝ニアの弱点だと看破するが、セリアック＝ニアはその依存を「自分たちの意志」として再定義し、肉体が崩壊するほどの代償を払ってでも立ち向かう。
  proposed_by:
