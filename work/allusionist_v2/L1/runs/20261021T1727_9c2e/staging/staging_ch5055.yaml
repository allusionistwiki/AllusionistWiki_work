      - event_ref: E_ch5055_アキラ_other_アズーリアへの道行き_p118
        quote: アズーリアへと向かう道行きを、コルセスカやトリシューラと共に進んではいけないという理由は無い。
        locator: {}
        spoiler_after: ch5055
      - event_ref: E_ch5055_アキラ_thinks_転生保険による格差_p12
        quote: 転生保険に加入できる富裕層の命は、加入できない貧困層の命より相対的に軽い筈だ。
        locator: {}
        spoiler_after: ch5055
      - event_ref: E_ch5055_アキラ_thinks_前世の価値観_p14
        quote: だというのに、俺のいた国では一回しかない命のほうがずっと軽かった。あの世界は、そういう不均衡に満ちていた。
        locator: {}
        spoiler_after: ch5055
      - event_ref: E_ch5055_アキラ_other_居場所の可能性_p239
