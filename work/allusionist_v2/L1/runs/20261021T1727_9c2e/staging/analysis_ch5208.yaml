- kind: theme
  theme: 「感染」による不可逆な社会崩壊（パンデミックの隐喻）
  weight: 0.7
  quotes:
  - quote: 大量の死人が蠢きながら人々を襲い、それに噛み付かれた者たちは汚染された呪力を注ぎ込まれて『感染者』となってしまう。
    paragraph: p192
    quote_verified: true
  - quote: 浸食し、拡大し続ける浄界によって会場の外に這いだした死人たちは第一区を、そしてエルネトモランを覆い尽くしていく。
    paragraph: p190
    quote_verified: true
  note: 単なる戦闘の敗北ではなく、「感染者」という概念を通じて都市全体が汚染・崩壊していく様子は、現代社会におけるパンデミックや情報汚染の恐怖を反映している。
  proposed_by:
