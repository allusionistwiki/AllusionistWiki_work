- kind: mystery
  name: MY_Nepenthes_Memory_Wipe
  note: ネペンテスの「忘却」能力が戦闘終了後も継続し、敵（ペリュトン系ラハブ）だけでなく周囲の証拠や記憶を消去している様子。
  quotes:
  - quote: ぼやきながら、戦いの証拠を隠滅すべく呪符を撒いていく。
    paragraph: p130
    quote_verified: true
  - quote: 片っ端から忘却させていくのは枝（ほね）が折れる。
    paragraph: p133
    quote_verified: true
  expected_payoff: この「忘却」による隠蔽工作が、後に重要な証拠の欠落や情報の非対称性として物語を混乱させる引き金になる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
