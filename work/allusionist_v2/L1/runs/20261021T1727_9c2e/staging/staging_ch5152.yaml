        spoiler_after: ch5152
      - event_ref: E_ch5152_アズ_other_分離と殺害_p77
        quote: 「その後は、何とか説得を試みて、出来なかったら捕縛。それも出来なかったら、殺すしかないと思う」
        locator: {}
        spoiler_after: ch5152
    action:
      observations:
      - event_ref: E_ch5152_アズ_other_ミルーニャの過去_p330
        quote: 言葉の通り、私には全てがわかっていた。フィリスをミルーニャに対してどう使えばいいかも。ミルーニャの不死のからくりも、全て。
