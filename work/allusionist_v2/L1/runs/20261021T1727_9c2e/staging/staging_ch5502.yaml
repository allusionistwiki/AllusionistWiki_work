        locator: {}
        spoiler_after: ch5502
      - event_ref: E_ch5502_クロウ_other_鳥人_p8
        quote: 銀貨によって支配下に置いた鳥人（バードマン）のクロウ、複座式マジックミサイルで加速を続けるジュティアとミナ。猛追をものともせず、ティリビナ人はトップを譲らない。
        locator: {}
        spoiler_after: ch5502
      - event_ref: E_ch5502_クロウ_flees_レース_p89
        quote: 「砂だ！　『ハルムシオンの風』から出走のアサブ選手、砂の精霊を使役して猛烈に追い上げている！　おおっと、砂嵐に巻き込まれたクロウ選手がここでリタイア！」
        locator: {}
        spoiler_after: ch5502
  first_appearance_candidate: true
- canonical_target: '[[E_char_ユディーア]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5502_ユディーア_uses_オルガンローデ_p127
        quote: オルゴーの滅びの呪文（オルガンローデ）。粗雑なものだが、『大人数の物語を束ねる』という目的に特化したそれは集団詠唱によって完成までの時間を早回ししてユディーアに速度を与えた。
        locator: {}
        spoiler_after: ch5502
      - event_ref: E_ch5502_ユディーア_other_対ハイマン同盟_p25
        quote: 『暗躍』『策略家』『悪役』『トリックスター』あたりの文脈を充填しながら併走する後方集団をまとめて手勢に引き入れて『対ハイマン同盟』を一時的に結成。
        locator: {}
        spoiler_after: ch5502
      - event_ref: E_ch5502_ユディーア_other_亡き幼馴染の弔い_p37
        quote: 一斉に過去回想に入った選手たちの想いの力が炸裂。ユディーアも亡き幼馴染への弔いというそれっぽい過去を匂わせつつ仇への憎悪を燃やして加速する。
        locator: {}
        spoiler_after: ch5502
    speech:
      observations:
      - event_ref: E_ch5502_ユディーア_says_えっ_p214
        quote: 「えっ？」
        locator: {}
        spoiler_after: ch5502
    name:
      observations:
      - event_ref: E_ch5502_ユディーア_wears_にっこりゴーリー_p28
        quote: ユディーアは『にっこりゴーリー』という迷宮刑罰者たちのボス、ならず者集団の名を背負って出場していた。
        locator: {}
        spoiler_after: ch5502
  first_appearance_candidate: true
- canonical_target: '[[E_char_ロードデンドロン]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5502_ロードデンドロン_has_property_異様な速度_p13
        quote: ティリビナ人が速すぎる。近代箒の在り方と逆行するかのような昔ながらの木製箒にあるまじき異様な速度だった。
        locator: {}
        spoiler_after: ch5502
    action:
      observations:
      - event_ref: E_ch5502_ロードデンドロン_defeats_砂の精霊_p148
        quote: 瞬間、歌うティリビナ人の腕が鋭く閃いた。何が起きたのか、ユディーアの目をもってしても捉えきれなかった。確かなことは、砂の精霊が勢いを失ってただの塵と化したこと。
        locator: {}
        spoiler_after: ch5502
      - event_ref: E_ch5502_ロードデンドロン_other_飛躍_p166
        quote: その理解が聴衆に浸透した瞬間、ロードデンドロンが纏っていた風が二位と三位を大きく突き放す。前方に形成された門を一瞬で潜り抜けたティリビナ人は『飛躍』する。
        locator: {}
        spoiler_after: ch5502
      - event_ref: E_ch5502_ロードデンドロン_other_未知の歌_p43
        quote: 歌だ。知らない響き、理解できない音の羅列。
        locator: {}
        spoiler_after: ch5502
      - event_ref: E_ch5502_ロードデンドロン_other_争い_p7
        quote: ハイマンの妨害によって一気に前に躍り出た非『杖』的な手段で飛翔する者たちの争いは、ティリビナ人のロードデンドロンを中心とした展開となりつつあった。
        locator: {}
        spoiler_after: ch5502
  first_appearance_candidate: true
