- canonical_target: '[[E_char_カーイン]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5430_カーイン_thinks_レオの不可解さ_p153
        quote: なぜ、どうやってこの場所に現れ、どのようにして荒ぶる竜を押さえ込み、何を意図してあのような台詞を告げ、どのようにして消え去ったのか。
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_カーイン_finds_答えの所在_p161
        quote: 答えは既にそこにある、最初からここにあったのだ。
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_カーイン_thinks_自己内のシナモリアキラ性_p163
        quote: シナモリアキラ性が自他の関係性に宿るのなら、シナモリアキラは既に自分の中にも存在している。
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_カーイン_thinks_サイバーカラテへの礼_p195
        quote: 「フィードバック。私が知る武芸の鍛錬もまた、因果の流れの中にある。ならばこの一撃、サイバーカラテという武芸への『礼』と受け取れ！」
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_カーイン_thinks_単眼竜の危険性_p89
        quote: 今の六王で最も危険なのは、この男だ。
        locator: {}
        spoiler_after: ch5430
    visual:
      observations:
      - event_ref: E_ch5430_カーイン_observes_敗北の結末_p16
        quote: カーインは、白熱したごっこあそびを大人にぶちこわされた少年のような表情になっていた。
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_カーイン_observes_竜の背徳_p39
        quote: 肉親に対する許されざる裏切り、背徳と退廃に満ちた竜の行為を目の当たりにしたカーインの表情が凍り付く。
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_カーイン_observes_荒ぶる竜_p58
        quote: 凍結の邪視が生み出す氷の竜はいまや荒ぶる激流と化していた。しかしそれはイツノの操るような制御された境界、治水がなされた河川とは決定的に異なる。
        locator: {}
        spoiler_after: ch5430
    action:
      observations:
      - event_ref: E_ch5430_カーイン_attacks_自己の胸_p165
        quote: カーインは再び複数人に分かれ、それぞれがそれぞれの胸を素早く突いた。自分で自分を攻撃し、また自分の中に衝突する他人を感じていた。
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_カーイン_other_シナモリアキラの経絡秘孔_p197
        quote: カーインの四肢が型をなぞり、貫手が想定されたサイバーカラテユーザーを穿つ。武芸と武芸の関係性に生じた刹那の因果。その呪力をたどった六淫操手の一撃は、狙い違わずシナモリアキラの経絡秘孔を突いていた。
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_カーイン_fights_死闘_p2
        quote: カーイン、沼アキラ、黒アキラらによる死闘もまた、あっけない幕切れを迎えていた。
        locator: {}
        spoiler_after: ch5430
