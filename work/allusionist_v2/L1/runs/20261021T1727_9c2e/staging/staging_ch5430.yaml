episode: ch5430
created: '2026-10-21'
status: pending_merge
entities:
- canonical_target: '[[E_char_単眼竜]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5430_単眼竜_kills_巨大ネズミ_p10
        quote: 裸の男は少年を片手で吊し、巨大ネズミを踏みつけた。魔竜の写し身はぐしゃりと潰れて絶命する。
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_単眼竜_other_星々の神話_p109
        quote: 混沌を己が秩序に組み込む大食漢にして蒐集家。全天に広がる星はまさしく宝石にして美食、単眼竜は涎を垂らして貪っていく。
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_単眼竜_other_沼地_p114
        quote: '無限の光を食らいつくした竜は膨らんだ腹を撫でながらごろんと地面に横になり、そのまま大きないびきをかき始めた。

          世界の風景は沼地に戻り、氾濫する川も跋扈する妖魔も等しく静かな眠りの中に封じられた。'
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_単眼竜_other_牙猪_p23
        quote: 邪視によってこぼれ落ちる涙、彼の世界から流出する呪文によってその言葉は紡がれている。揺らぐ感情に呼応するように、悲しみと憤りが渾然一体となった呪力が牙猪を癒し、黒いアキラを蹂躙する。
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_単眼竜_attacks_アキラ_p29
        quote: 槍のような牙が街道に関所を設け、剣のような爪が港を封鎖した。少年のやわらかな肉が引き裂かれ、甲高い絶叫が響く。
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_単眼竜_breaks_少年の両足_p35
        quote: 吐き捨てると共に、少年の両足が強引にむしられた。
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_単眼竜_makes_肉塊の杖_p51
        quote: 握り潰す。血を飛散させながら絶命した肉塊アキラは忌まわしい呪力を宿した即席の杖となり果てた。
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_単眼竜_other_災厄の使い魔_p65
        quote: 単眼からこぼれ落ちていく涙から次々に創造される使い魔たちは『単眼巨人』『蟲視』『凶作』の名を関する妖魔であり、一つ一つの個体が甚大な被害をもたらす災厄であった。
        locator: {}
        spoiler_after: ch5430
    symbolic:
      observations:
      - event_ref: E_ch5430_単眼竜_defines_名前無き暴威_p12
        quote: 存在するだけで全てを脅かすこの魔獣に名前は無い。野生の暴威には本来呼び名が無いからだ。
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_単眼竜_defines_孝行者としての逸話_p36
        quote: 名前を失う前、竜はある逸話のため孝行者として知られていた。芝居や昔話ではおなじみのエピソードで、老親に我が子や妻を捧げるという、生み育ててくれた恩義に報いるためには価値ある財産を惜しむべきではないという教訓話である。
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_単眼竜_defines_情愛の不在_p52
        quote: 'この畜生にとって親子の情愛など塵芥同然。

          親であろうと子であろうと等しく振る舞うだけ。'
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_単眼竜_defines_混沌の相_p70
        quote: 彼が持つのは秩序というより混沌の相。
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_単眼竜_has_property_万能型の資質_p82
        quote: '唯一無二とは言い難い世界観、そこから生まれる凍結系統の比較的ありふれた邪視。優れた邪視の才を基軸とした呪文、使い魔、杖の全系統に及ぶ万能型の資質。

          溢れ出しそうなほど単純で広汎な力。'
        locator: {}
        spoiler_after: ch5430
    speech:
      observations:
      - event_ref: E_ch5430_単眼竜_other_牙猪_p18
        quote: 「この愚か者め。俺様が呼んだらすぐに来い。許し無く敗北するな。貴様の命は俺様の財だろうが」
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_単眼竜_says_単眼からの発話_p20
        quote: 言葉は口からではなく、単眼から聞こえてくるからだ。
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_単眼竜_asks_許されぬ交易の理由_p26
        quote: 「そして小僧。俺様の財宝を傷つけ、あまつさえ俺様の許し無くまじないの交易を行うとはどういう了見だ」
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_単眼竜_says_老いて子に従え_p33
        quote: 「老いては子に従え化石が」
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_単眼竜_says_断り無き侵入への叱責_p4
        quote: '「誰に断って、人の家臣に手を出している？」

          新たに出現した人物の厳かな声が響く。'
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_単眼竜_says_道具としての子_p49
        quote: 「俺様の財ならば俺様の役に立て。子などそのための道具だろうが」
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_単眼竜_says_財宝と快楽の要求_p76
        quote: 「俺様の許し無く這いずるな。俺様にきらびやかな財宝を捧げろ。俺様の舌と胃袋を満足させる酒と肉と美姫をよこせ」
        locator: {}
        spoiler_after: ch5430
    relationship:
      observations:
      - event_ref: E_ch5430_単眼竜_loses_仁徳_p38
        quote: ところが人形姫に名を奪われたこの野獣からはそのような優しさ、仁徳までもが失われていたらしい。
        locator: {}
        spoiler_after: ch5430
    visual:
      observations:
      - event_ref: E_ch5430_単眼竜_breaks_病衣_p7
        quote: 沼地の湿気と返り血で湿った衣が不快になったのか、男は無造作に布を引きちぎった。脱衣という手順、衣服という文化を冒涜するかのような破壊的腕力。
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_単眼竜_appears_as_隻眼の男_p9
        quote: 暗い水面からの闖入者は隻眼だった。ひっかき傷の痛々しさが眼光にかわって鋭い印象を周囲に刻んでいる。
        locator: {}
        spoiler_after: ch5430
  first_appearance_candidate: true
- canonical_target: '[[E_char_レオ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5430_レオ_has_property_二重単眼オッドアイ_p100
        quote: 何よりも異彩を放つのは、両手両耳と同様に闇と光を湛えた双眸だ。オッドアイ、ヘテロクロミア、邪視者たちの世界では二重単眼と呼ばれる特異体質。色の異なる虹彩は神域の邪視を宿す『唯一の視点』を重ねて有するという呪術的な意味合いを持つ。
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_レオ_wears_古めかしい筒状衣_p102
        quote: 更に少年の異物性を際だたせていたのは、身にまとう衣装が古めかしい仕立ての筒状衣であったことだ。白い布に金の刺繍。複雑な文様は古代世界を想起させるでたらめな文字列だ。
        locator: {}
        spoiler_after: ch5430
    action:
      observations:
      - event_ref: E_ch5430_レオ_uses_星々の神話_p108
        quote: 少年がそう言って左手を前に出す。すると宇宙が彼の手中で無限の広がりを見せた。闇の左手が握るのは星。きらめく輝きが漆黒の左手から流出し、光と光が繋ぐ星座たちが神話世界を紡ぎ出す。
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_レオ_disappears_舞台袖_p141
        quote: '言い終えた途端、少年の姿は忽然とかき消えた。

          沼地も、竜も、その他の配役も、全ては舞台袖に黒子たちが運び去っていく。'
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_レオ_appears_カーインのそば_p93
        quote: ひとり戦慄するカーインのすぐそばで、そう呟く声があった。まるでなにもない場所から突然現れたかのように、少年は彼のすぐそばに立っていた。
        locator: {}
        spoiler_after: ch5430
    speech:
      observations:
      - event_ref: E_ch5430_レオ_stops_暴虐の王_p112
        quote: 「お眠り、暴虐の王。今はまだその時ではない」
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_レオ_names_プトレマイオス_p117
        quote: 「プトレマイオス。彼は、既に」
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_レオ_promises_仲間との合流_p119
        quote: 「今回は順調です。じきにアンとユディも完成する。そうしたらみんなが揃うね、カーイン」
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_レオ_says_王権の虚構性_p124
        quote: 「王（ジャッジ）の器などという虚構（もの）がもしあるとすれば、その持ち主はきっと罪人に違いありません。誰もが社会という物語の中で正しさの秤に試され続けている。それを拒絶して自分だけの法を定めようとする異端者が無法者でなくてなんだというのでしょう」
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_レオ_says_未知への挑戦_p130
        quote: 「それでも、罪を抱えて楽園を旅立つのが人の意思だ。未知に挑む人類の姿はいつだって美しい」
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_レオ_says_カーインへの期待_p139
        quote: 「僕は期待している。彼女たちだけじゃなくて、あなたにもだよ、カーイン。答えは既に、そこにある」
        locator: {}
        spoiler_after: ch5430
      - event_ref: E_ch5430_レオ_says_章の終わりと祭壇_p97
        quote: 「家族の絆を嘲弄する彼は、この章を終わらせかねない。祭壇の準備が整うまで、もう少し待ってもらわないと」
        locator: {}
        spoiler_after: ch5430
  first_appearance_candidate: true
