- kind: mystery
  name: MY_第七位ヴィティスの不在と緑の炎
  note: 第七位の席には誰もいないのに緑色の炎が灯っており、その不在は問題視されない。またネッススが「同じ裏切り仲間」と呼ぶことで、ヴィティスが槍神教の権威から離反していることが示唆される。
  quotes:
  - quote: 'しかし何故かそこには緑色の炎が灯されており、また不在が問題視される事も無かった。私は沈黙を保ったまま、その炎を強く睨み付けた。

      「はん、ヴィティスのだんまり野郎が恋しいってのは正気かぁ？　同じ裏切り仲間で徒党でも組む気かよ」'
    paragraph: p71-p73
