  expected_payoff: 第七位ヴィティスは物語の黒幕または対立軸として登場し、第九世界槍の上書き（歴史改変）の真相を知る唯一の証人として機能する可能性が高い。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
