    quote_verified: true
  - quote: エリカは歌に込めた空想を呪文に変えて、巨大な竜を作り出そうとしていた。彼女なら、きっとこう戦うはずだ。最も重要な責務を担う仲間のことを思いながら呪文を紡ぐ。
