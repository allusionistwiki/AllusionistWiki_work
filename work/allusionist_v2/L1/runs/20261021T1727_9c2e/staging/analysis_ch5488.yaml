- kind: mystery
  name: MY_虫王の卵_三つ
  note: 残り三つの卵がキノコ人グループと虹犬によって第五階層へ運ばれている。この卵が後にどのような形で復活のトリガーとなるか、また「資格のある者」が誰なのかという伏線。
  quotes:
  - quote: 邪神ダレッキノの卵は全部で五つ。うち二つはその場で孵化し、残り三つを持ってキノコ人グループと虹犬の一人が逃走中。第五階層に繋がる『門』を目指して移動中とのことです
    paragraph: p31
    quote_verified: true
  expected_payoff: 第五階層での大規模な邪神復活イベント、または「資格のある者」の正体（おそらく主人公関連）の判明。
