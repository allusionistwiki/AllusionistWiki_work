- kind: theme
  theme: 王権の虚構性と自己立法者としての人間
  weight: 0.6
  quotes:
  - quote: 「王（ジャッジ）の器などという虚構（もの）がもしあるとすれば、その持ち主はきっと罪人に違いありません。誰もが社会という物語の中で正しさの秤に試され続けている。それを拒絶して自分だけの法を定めようとする異端者が無法者でなくてなんだというのでしょう」
    paragraph: p124
    quote_verified: true
  note: レオの演説により、王権が「社会の物語」という虚構であることが明かされる。これに対し、外部からの評価を拒絶し自己の法を定めること（異端・無法）を肯定的な「美しさ」として描くことで、既存の秩序への挑戦を主題化する。
  proposed_by:
