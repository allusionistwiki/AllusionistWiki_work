- kind: mystery
  name: MY_レオの正体とプトレマイオス計画
  note: レオがカーインに「答えは既にそこにある」と告げ、アンとユディの完成を約束した。彼が「プトレマイオス」と呼ばれることの意味と、「祭壇の準備」の内容が不明。
  quotes:
  - quote: 「今回は順調です。じきにアンとユディも完成する。そうしたらみんなが揃うね、カーイン」
    paragraph: p119
    quote_verified: true
  - quote: 「本当の王（ジャッジ）であれば。生まれついての造物主（アルコーン）であれば、そんな視点を外部に置いたりしない。だって王は自分が見ていればそれでいいのだから」
    paragraph: p91
    quote_verified: true
  expected_payoff: レオが世界観を書き換える「造物主」として機能し、アンとユディとの合流で物語のメタ構造（祭壇）が完成する展開への回収。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_シナモリアキラの内面化
  note: カーインが「答えは自分の中にある」と気づき、自身の中にシナモリアキラ性を発見して自己攻撃を行う。この「内なる敵」の正体と、サイバーカラテの因果制御の完全な解明。
  quotes:
  - quote: 答えは既にそこにある、最初からここにあったのだ。
    paragraph: p161
    quote_verified: true
  - quote: カーインが穿つべき紀命点は、関係性の狭間にあったのだ。
    paragraph: p165
    quote_verified: true
  expected_payoff: 外敵との戦いではなく、自己の概念（シナモリアキラ）との統合または超越による決着への回収。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_単眼竜の理性の喪失と制御不能
  note: 「理性という名の枷」を外した単眼竜が、文化や秩序を無視する混沌として暴走。レオによって強制的に眠らされたが、その「睡眠」の状態と覚醒時の影響が未知。
  quotes:
  - quote: この暴力を統御していたのは理性という名の枷だった。
    paragraph: p84
    quote_verified: true
  - quote: お眠り、暴虐の王。今はまだその時ではない
    paragraph: p112
    quote_verified: true
  expected_payoff: 竜の覚醒が世界観崩壊のトリガーとなるか、レオの介入によって完全に封じられるかの結末への回収。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_E-Eの因果改変能力（ネズミによる矢印破壊）
  note: トリシューラの解説図において、魔竜レーレンタークが因果の矢印を噛み砕き、「因アキラ」と「果アキラ」をずらす描写。これが単眼竜の行動原理とどう接続するのか。
  quotes:
  - quote: 図に示された『因アキラ』と『果アキラ』を結ぶ矢印を、ネズミがくわえてどこかに持って行ってしまった。矢印をかじってバラバラにしたネズミが、因果のアキラに残飯をぶちまけてしまう。
    paragraph: p187
    quote_verified: true
  expected_payoff: シナモリアキラ（アキラ）の存在自体が「因果の歪み」そのものであり、カーインがその歪みを「礼」として受け入れることで決着がつくメタ物理的な回収。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 名前（定義）を失った暴力の純粋性と恐怖
  weight: 0.8
  quotes:
  - quote: 存在するだけで全てを脅かすこの魔獣に名前は無い。野生の暴威には本来呼び名が無いからだ。
    paragraph: p12
    quote_verified: true
  - quote: 力はただ存在しているだけで周囲を傷つける。この暴力を統御していたのは理性という名の枷だった。
    paragraph: p84
    quote_verified: true
  note: 単眼竜が「名前」を持たないことで、既存の社会規範や物語的役割（悪役・王）から自由になり、純粋な破壊力として描かれている。命名とは制御であり、未定義の暴力は秩序を解体する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
