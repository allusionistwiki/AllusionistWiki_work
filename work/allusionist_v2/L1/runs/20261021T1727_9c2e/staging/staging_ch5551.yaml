- canonical_target: '[[E_char_クナータ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5551_クナータ_asks_アズーリアへの依頼_p102
        quote: 「アズーリア。誰よりもフィリスと親和しているあなたにしか頼めないの。どうか、その呪文でわたしの一生のお願いを叶えて」
        locator: {}
        spoiler_after: ch5551
      - event_ref: E_ch5551_クナータ_promises_救世主の母体確定_p111
        quote: 「わたしを救世主の母体として確定させて。そうしなければ最悪の場合、あなたはチョコレートリリーの仲間を三人も失うことになる。阻止したいでしょう？　わたしたちの利害は一致していると思うの」
        locator: {}
        spoiler_after: ch5551
      - event_ref: E_ch5551_クナータ_makes_矛盾した記憶_p117
        quote: 「これはね、私の未来回想に存在しない記憶なの。本来なら起こり得ない、私の意思によって捏造する矛盾した記憶。正史と重なり合う矛盾史。わたしはそれを作り出す」
        locator: {}
        spoiler_after: ch5551
      - event_ref: E_ch5551_クナータ_reveals_聖女の真実_p125
        quote: 「そのために魔将役の『神の子』を集める。そのためにお芝居をする。そのために、わたしは未来を回想する聖女になる。その全てがなければ、私は本当の竜母になれなかった」
        locator: {}
        spoiler_after: ch5551
      - event_ref: E_ch5551_クナータ_asks_最終選定での勝利_p131
        quote: 「嘘を本当に。死せる意思を理想に。わたしの並行矛盾史を完成させる最後のピースはあなたなの、アズーリア。どうかトライデントの最終選定で私を勝たせてちょうだい」
        locator: {}
        spoiler_after: ch5551
      - event_ref: E_ch5551_クナータ_says_お芝居_p34
        quote: 「でもこれはお芝居だったわ。少なくとも、この分岐では既にレースは破綻していたの」
        locator: {}
        spoiler_after: ch5551
      - event_ref: E_ch5551_クナータ_other_アズーリアの運命_p42
        quote: 「あなたの運命。わかっているでしょう、アズーリア」
        locator: {}
        spoiler_after: ch5551
      - event_ref: E_ch5551_クナータ_other_来訪者たちの過去_p84
        quote: 「来訪者たちの過去。そして、この祝祭はその再演」
