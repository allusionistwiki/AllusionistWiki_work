    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_trisshula_evaluation
  note: トリシューラが未来においてどのように評価されるかというアキラの不安。
  quotes:
  - quote: トリシューラは、果たしてどのように評価されることになるのだろうか。たとえ未来の彼女がどうなろうと、俺は主に付き従うのだろう。
    paragraph: p73
    quote_verified: true
  expected_payoff: 物語終盤でトリシューラの行動が「暴君」や「破壊者」として歴史的に評価されるような結末を迎える予兆。
