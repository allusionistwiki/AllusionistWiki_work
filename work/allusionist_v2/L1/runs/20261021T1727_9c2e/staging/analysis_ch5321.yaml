    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_lazur_identity_blue
  note: 店員（ラズリ）がトライデント細胞「フィレクティ」であり、ブルーというハンドルで動いていること。
