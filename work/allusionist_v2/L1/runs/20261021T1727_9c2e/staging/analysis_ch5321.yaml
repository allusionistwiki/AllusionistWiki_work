- kind: mystery
  name: MY_yomir_death_impact
  note: ヨミル・バーンステインの死による松明の騎士団の混乱と、コルセスカとの因縁。
  quotes:
  - quote: 人形師といえばバーンステイン！... 例の事件で殉職しちゃったみたい。... コルセスカにとっての運命の恋人。いずれ戦わなくてはならないような気がするが、その辺も含めてルウテトに訊いておきたいんだよな
    paragraph: p276
    quote_verified: false
  expected_payoff: コルセスカの「運命の恋人」として登場したヨミルの死（あるいは生存）に関する真相が明かされ、コルセスカの過去や能力の制御に関わる重要な伏線となる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_saria_core_emergency
  note: サリアの暴走とコアとの通信不能という緊急事態。
  quotes:
  - quote: サリアちゃんがスキリシアに飛び込んで行っちゃった。かなり暴走気味で、正直やばいかも。ごめん、止められなかった。あと、コアちゃんと連絡とれないんだけどそっちで何かあった？
    paragraph: p251
    quote_verified: true
  expected_payoff: サリアの暴走がスキリシアでの新たな事件（聖マローズ教団関連？）を呼び込み、主人公たちの行動を強制的に変化させるトリガーとなる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_rail_elva_kidnapping
  note: リールエルバの誘拐とセリアック・ニアの変貌、カーティスとの交換要求。
  quotes:
  - quote: ドラトリアの王女にしてガロアンディアンの支援者、リールエルバの誘拐。更にその妹であるセリアック＝ニアの無惨な姿。そして、六王が一人カーティスと人質との交換要求。
    paragraph: p263
    quote_verified: true
  expected_payoff: 聖マローズ教団という新勢力との交渉決裂により、ガロアンディアン内部での政治的混乱や戦闘が発生する。カーティスの過去も関連する可能性が高い。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_leo_surname_origin
  note: レオの姓「ウィーナー」が行政により強制的に付与された事実。
  quotes:
  - quote: 法務シューラ直轄のお役所シューラが命名しといたよ。姓とはいえ、名付け親の権力も行使できて一石二鳥だし
    paragraph: p124
    quote_verified: true
  expected_payoff: レオの出自や過去の所属（クロウサー家など）との関連性、あるいは行政組織「法務シューラ」が物語後半で重要な役割を果たす伏線となる。
