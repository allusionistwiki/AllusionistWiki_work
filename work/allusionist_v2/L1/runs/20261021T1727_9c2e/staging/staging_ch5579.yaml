      - event_ref: E_ch5579_ロードデンドロン_says_アルラウネ断章引用_p164
        quote: 「ティリビナ人の真なる歴史を伝えた『アルラウネ断章』にはこう記されております。はじまり以前より現れし白衣の神々は原初の妖精たるテテリビナを創造した。そのひとり『花のアヴロノ』アルラウネこそが現在のティリビナ人の祖であると」
        locator: {}
        spoiler_after: ch5579
      - event_ref: E_ch5579_ロードデンドロン_says_アルラウネとカーイン神話_p170
        quote: 「顕花始祖アルラウネは同じテテリビナである『大いなるカーイン』と愛を交わそうとしましたが、暗闇と恐怖に満ちた災いが二人を阻んでしまいました。そこでアルラウネは三柱の来訪者たちから祝福を授かり、災いを退けます。その来訪者こそ、クロウサー、リーヴァリオン、ディスケイムです」
        locator: {}
        spoiler_after: ch5579
      - event_ref: E_ch5579_ロードデンドロン_says_カーインレルプレア兄弟神話_p175
        quote: 「来訪者たちの助力もあって、夫婦の間には三人の子供が生まれました。長兄は父の名を継いだ『小（ベル）カーイン』。次男は我らティリビナ同胞団の守護者スーリウム。そして末子が初代緑天主にして女神レルプレア。我々ティリビナ人はレルプレアの子孫とされています」
        locator: {}
        spoiler_after: ch5579
      - event_ref: E_ch5579_ロードデンドロン_asks_パーンカーイン植物呪術確認_p181
        quote: 「鈴国圏で英雄として知られているカインとはこのベルカーイン本人、あるいはその名を継いだ子孫のことだと私は考えます。その詳細までは私には知りえぬことですが、そこにいる当事者（パーン）に尋ねればすぐにわかることがあります。パーン・ガレニス・クロウサーよ。彼は植物呪術を用いる、緑の精霊使いでしたか？」
        locator: {}
        spoiler_after: ch5579
      - event_ref: E_ch5579_ロードデンドロン_says_クロウサー歴史操作断定_p190
        quote: 「この奇妙な混乱の原因を、私は異獣と認定したティリビナ人との関係性を隠蔽したかったクロウサー家による歴史操作によるものだと断定します」
        locator: {}
        spoiler_after: ch5579
      - event_ref: E_ch5579_ロードデンドロン_says_証拠提示宣言_p197
        quote: 「ええ。この件を追求しても権力を握る側であるクロウサー家が認めるはずもなし。ゆえに私は、明確な証拠をここに提示したいと思います」
        locator: {}
        spoiler_after: ch5579
