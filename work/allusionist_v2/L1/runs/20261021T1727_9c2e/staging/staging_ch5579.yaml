        quote: 興味深く見守っていると、ティリビナ人の青年を援護するような発言をした竜神信教の巫女マルガリータが一歩ぶん、機甲箒を操って前進する。
        locator: {}
        spoiler_after: ch5579
      - event_ref: E_ch5579_マルガリータ_makes_呪文展開_p52
        quote: 彼女は落ち着き払った様子で新たな呪文を展開し始めた。それは、この天の御殿の遥か下方に位置する選定レースの舞台ガロアンディアンについての言及だった。
        locator: {}
        spoiler_after: ch5579
    speech:
      observations:
      - event_ref: E_ch5579_マルガリータ_says_カーイン公社所属_p54
        quote: 「現在、ガロアンディアンの機械女王にとっての直接的な手足と目される『公社』にはカーインを名乗る男が所属していることが調べにより分かっています。そしてもうひとつ、鈴国における重大事件と関連しているであろうことも」
        locator: {}
        spoiler_after: ch5579
      - event_ref: E_ch5579_マルガリータ_says_カーイン裏切り嫌疑_p62
        quote: 「その事件とは四十四士がひとり、『芸術道化』カーインの裏切り。彼には聖妃レストロオセ暗殺の嫌疑がかけられており、現在は逃亡中です。おそらくは上下の中間地点である第五階層（ガロアンディアン）に潜伏しているものと考えられています」
        locator: {}
        spoiler_after: ch5579
      - event_ref: E_ch5579_マルガリータ_says_情報封鎖_p72
        quote: 「『聖妃（レストロオセ）派』及び『魔軍（セレクティ）派』による情報封鎖が行われているため、天蓋の上には広まっておりませんし、我ら『竜神信教派』の中でも『未遂ではなく実行されたという真相』を知っているのはごく一部のみ」
        locator: {}
        spoiler_after: ch5579
      - event_ref: E_ch5579_マルガリータ_says_カーイン家系疑惑_p78
        quote: 「まず、当代のカーインは極めて得体の知れない人物です。幼少期は灰の天主に師事していたものの、その後の動向はほとんど不明。その父親たる先代カーインは裏切りの罪によって投獄されています。更に遡れば、この家系には裏切りや内通といった疑惑が常につきまとう」
        locator: {}
        spoiler_after: ch5579
      - event_ref: E_ch5579_マルガリータ_says_カーイン上存在疑惑_p90
        quote: 「カーインは本来なら『上』、それもクロウサー家の存在だったのでは？」
        locator: {}
        spoiler_after: ch5579
