        locator: {}
        spoiler_after: ch5579
      - event_ref: E_ch5579_パーン_says_カーイン戦友評価_p122
        quote: 「笑わせるなよ。確かにオーファの奴は『カーインは空の顕花』などとほざいていたが、重要なのは最終的な立ち位置だ。奴は俺と鈴国圏を駆け抜けた戦友。『下』の勇士という評価に偽りはない」
        locator: {}
        spoiler_after: ch5579
      - event_ref: E_ch5579_パーン_confesses_カーイン植物親戚関係_p186
        quote: 「その通りだ。レルプレアの弟子であるオーファ本人も奴がティリビナ人に近しい存在だと認めていた。全く同じではないが、親戚のようなものだとな」
        locator: {}
        spoiler_after: ch5579
      - event_ref: E_ch5579_パーン_fears_盟友侮辱_p82
        quote: 盟友の子孫と思しき者たちへの侮辱だ。パーンにしてみれば友人を疑われているような気持ちになっているのかもしれない。
        locator: {}
