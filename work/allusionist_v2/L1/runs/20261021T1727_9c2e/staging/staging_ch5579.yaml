        locator: {}
        spoiler_after: ch5579
      - event_ref: E_ch5579_リーナ_thinks_カーイン関係性_p33
        quote: （パーンの時代と余裕で千年以上は離れてるんだよね。どういう関係？ てかクロウサー家の守護者カインっていうのも何かふわっとしてて、魔王討伐の時にはもういたとかって話なんだけど、よくわかんないな）
        locator: {}
        spoiler_after: ch5579
      - event_ref: E_ch5579_リーナ_thinks_カーインのティリビナ人認定_p50
        quote: このカーインが『ティリビナ人である』というロードデンドロンの主張は、いったいどういう理屈で成立するのだろうか？
        locator: {}
        spoiler_after: ch5579
      - event_ref: E_ch5579_リーナ_remembers_公社レオ_p59
        quote: 『公社』はわかる。最大の同盟相手である機械女王トリシューラや紀人シナモリアキラとやり取りをする中で、何度か『公社』のリーダーであるレオの話を耳にしていたし、顧問言語魔術師であるセージと護衛のカーインも名前と念写写真だけなら目を通して把握していた。その時は特に気にしていなかったのだが。
        locator: {}
        spoiler_after: ch5579
      - event_ref: E_ch5579_リーナ_fears_シューらん関係_p67
        quote: （シューらん何考えてんの？！ それともマジで関係ないから大丈夫なの？）
        locator: {}
        spoiler_after: ch5579
    action:
