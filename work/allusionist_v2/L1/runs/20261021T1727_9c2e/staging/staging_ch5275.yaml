    action:
      observations:
      - event_ref: E_ch5275_少女_makes_劇中劇_p10
        quote: 少女が行うのは人形劇からの更なる劇中劇。それは、竜王国が苦境に置かれることになった原因の一つを解決するための過去の再演。太陰（イルディアンサ）を襲った災厄を解決し、『神々の図書館』が破壊されることを防いで、竜王国に降りかかる災禍を無かったことにしようと言うのだ。
        locator: {}
        spoiler_after: ch5275
  first_appearance_candidate: true
- canonical_target: '[[E_char_グレンデルヒ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5275_グレンデルヒ_says_英雄論_p107
        quote: 「無論だとも。君程度はその気になればいつでも叩き潰せる。だが、相手に何もさせずに勝ってしまっては勝負が成立しない。弱者を一方的に痛めつけるのは英雄としての沽券に関わるのでね。正面から相手の力を受け止め、勝ち目を示した上で圧倒してこそのチャンピオンというものだ」
        locator: {}
        spoiler_after: ch5275
      - event_ref: E_ch5275_グレンデルヒ_stops_戦闘_p183
        quote: '顔をしかめ、目を鋭くすると一言。

          「ゾーイ、撤退だ」

          そう言葉が発せられた瞬間、グレンデルヒの姿はその場から消失していた。'
        locator: {}
        spoiler_after: ch5275
    action:
      observations:
      - event_ref: E_ch5275_グレンデルヒ_activates_雷_p167
        quote: 'グレンデルヒが前触れ無く腕を振った。

          閃光がほとばしり、天井から雷鳴が轟いたかと思うと、グレンデルヒの掌に吸い込まれるようにして電撃が収束していく。'
        locator: {}
        spoiler_after: ch5275
    visual:
      observations:
      - event_ref: E_ch5275_グレンデルヒ_appears_ゾーイ・アキラ_p97
        quote: '強い警戒心に反応して牙猪の視界と同調する。彼の見ている場所には、そろそろ見慣れてきた忌むべき男の姿があった。

          「何の用だ、グレンデルヒ」

          厳密には、その皮をかぶったゾーイ・アキラ。'
        locator: {}
        spoiler_after: ch5275
  first_appearance_candidate: true
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5275_アキラ_thinks_呪い_p117
        quote: 'この世界ではあらゆる存在は呪いに縛られる。

          それは認識であり、言葉であり、関係性であり、また物理的な制約なのだろう。'
        locator: {}
        spoiler_after: ch5275
      - event_ref: E_ch5275_アキラ_thinks_不条理_p2
        quote: '不条理だ。

          竜王国にまつわる物語が幕を下ろした後、舞台袖であらためて展開を振り返ってみても、俺にはそう結論付けることしかできなかった。'
        locator: {}
        spoiler_after: ch5275
      - event_ref: E_ch5275_アキラ_other_レオの提案_p211
        quote: '王子ヴァージルは、耳長の民、つまりは兎に似た種族なのだから。同じく兎の耳を持つレオほどの適任は俺たちの陣営には他にいない。

          「そういうことなら、頼めるか」'
        locator: {}
        spoiler_after: ch5275
      - event_ref: E_ch5275_アキラ_thinks_クレイの背景_p324
        quote: 'なぜならば、今まさに俺たちは過去を改竄しているところなのだから。

          俺たちがやろうとしている決定的な過去の改変というのは、つまり。'
        locator: {}
        spoiler_after: ch5275
      - event_ref: E_ch5275_アキラ_thinks_価値観_p36
        quote: '交換不可能だったはずの尊い価値を、自ら交換可能なものに貶めてしまったこと。

          それがチリアットの罪であり、トリシューラに見いだされた理由なのだ。'
        locator: {}
        spoiler_after: ch5275
      - event_ref: E_ch5275_アキラ_says_トリシューラの理想_p56
        quote: （弱者を排除して、正しくない者を拒絶して、というやり方も、まああることはあるが、トリシューラとしてはそういうのはつまらないそうだ。ならやることは一つだ。あいつの治世下では悪人のおめめがキラキラして、偏った思考の奴は目玉がグルグルになって、馬鹿はある意味で頭が良くなり、正しくない奴は目をギラつかせて俺は正しいと主張する人間にされるんだよ。望めばそれは叶うんだ）
        locator: {}
        spoiler_after: ch5275
    visual:
      observations:
      - event_ref: E_ch5275_アキラ_other_左腕_p82
        quote: 食いちぎられて、もう一度つなぎ合わされた左腕が、微かに熱を持ったような気がした。どうしてか、わけもなく死にたくなった。
        locator: {}
        spoiler_after: ch5275
  first_appearance_candidate: true
- canonical_target: '[[E_char_グラッフィアカーネ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5275_グラッフィアカーネ_attacks_グレンデルヒ_p172
        quote: ガロアンディアン風にアレンジされた和装が翻り、袴が流麗な足運びで宙を渡っていく。トライカラーの虹犬種は、雷を全身に纏いながらグレンデルヒに飛びかかった。
        locator: {}
        spoiler_after: ch5275
  first_appearance_candidate: true
- canonical_target: '[[E_char_チリアット]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5275_チリアット_says_贖罪_p18
        quote: 「師範代。俺は、トリシューラ様とマラコーダに拾われ、ガロアンディアンを第五階層に復活させるという話を聞いて思いました。これは最後の機会なのだと。ジャッフハリムを裏切り、逃亡してしまった俺に与えられた、一度きりの贖罪の機会」
        locator: {}
        spoiler_after: ch5275
      - event_ref: E_ch5275_チリアット_confesses_臆病さ_p24
        quote: 「俺はガロアンディアンの、ジャッフハリムの理念から最もかけ離れた振る舞いをしました。大切な誰かの為に身を捧げるのではなく、利己的に生存のみを欲してしまった。俺にはやはり、資格が無い。先ほど、変異の三手との戦いでもそうでした。俺はまた臆して逃げた。ずっと俺は、正しくないままだ」
        locator: {}
        spoiler_after: ch5275
      - event_ref: E_ch5275_チリアット_thinks_戦い_p76
        quote: 「そう、ですな。俺はまだ、戦える。まだ、舞台は残っている」
        locator: {}
        spoiler_after: ch5275
  first_appearance_candidate: true
- canonical_target: '[[E_char_レオ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5275_レオ_appears_劇場_p190
        quote: グラッフィアカーネよりもさらに若い。少年と言うほか無い彼の頭頂部には、特徴的な耳が二つ。シャツの白さを引き締めるフォーマルなショートパンツとソックスは黒色で、それらに挟まれた膝は際立つように白い。
        locator: {}
        spoiler_after: ch5275
    speech:
      observations:
      - event_ref: E_ch5275_レオ_asks_主役_p204
        quote: '更にレオは俺の現在置かれている状況を知ると、こう提案した。

          次の舞台、主役を自分にやらせてほしいと。'
        locator: {}
        spoiler_after: ch5275
      - event_ref: E_ch5275_レオ_says_グレンデルヒの能力_p236
        quote: 「見た目はそのままなんですけど、雰囲気とか癖とか、なにより音が違いました。グラさんが攻め方を変えても、また別の人みたいになって対応されちゃって。多分ですけど、魔導書の中に沢山いるんです。本人の言葉を信じるなら、全部で百二十八人はいます」
        locator: {}
        spoiler_after: ch5275
      - event_ref: E_ch5275_レオ_reveals_クレイの異変_p303
        quote: '「クレイって人は、なぜか起き上がりました。死んだままなのに、彼は生きていたんです。トリシューラ先生から説明を受けてましたけど、あれが再生者なんですね。」

          「宣名の内容を途中で変えたんです。最初はライニンサルって言ったけど、何かに気付いてすぐにドーレスタって。それからしばらくして、また訂正するようにクレイ・ダーカンシェルって言い直してました。」'
        locator: {}
        spoiler_after: ch5275
  first_appearance_candidate: true
