  note: 記憶の中に登場する「小さかった私よりも更に小さな、赤い髪と緑色の瞳をした妖精」は、トリシューラとは異なる存在（あるいはトリシューラの原型・別人格）である可能性があり、正体不明のまま語られている。
  quotes:
  - quote: 覚えているのは、こちらを取り囲んで見下ろす八人の女性の姿。そして、微かな記憶の中に何度も登場する、小さかった私よりも更に小さな、赤い髪と緑色の瞳をした妖精のこと。それだけです。
