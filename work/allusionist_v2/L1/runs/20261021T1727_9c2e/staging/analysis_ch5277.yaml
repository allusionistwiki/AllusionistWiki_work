  note: 死者であるテスモポリスが、ヴァージルとの性的接触（口づけ等）を契機に「屍蝋化した腕」を産み落とす現象。この「死の妊娠」が物語の結末やキャラクターたちの運命（呪い、再生）にどう影響するか不明。
  quotes:
