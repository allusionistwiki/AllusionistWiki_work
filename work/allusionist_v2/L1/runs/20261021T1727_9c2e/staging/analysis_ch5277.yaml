- kind: mystery
  name: MY_Kate's_Interference_and_Motive
  note: サイザクタートの理性であるケイト（仮想知性体）が、なぜこのタイミングで介入し、禁忌破りを防ごうとしたのか（または誘導したのか）。その意図は「史実」の理解に基づくものだが、目的が不明。
  quotes:
  - quote: 本当にいいのかい？　そうしたら、君の、失敬、僕たちの醜い姿が彼の愛らしい目に映ってしまうよ？　彼の純真な心は、それに耐えられるだろうか。彼の目を穢してしまうことになるのではないかな？
    paragraph: p162
    quote_verified: true
  - quote: 'ここに来て、ようやくケイトの狙いが理解できた気がする。

      どうやってかは知らないが、ケイトはこの流れを理解していた。'
    paragraph: p316-p317
    quote_verified: true
  expected_payoff: ケイトが予見した「結末」が明かされる。ケイトの介入は破滅を防ぐためだったのか、それとも必然的な破滅への過程を加速させるためだったのか。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_Virgil's_Asymmetrical_Ears
  note: ヴァージルの耳が左右非対称（猫耳と兎耳）であること。これはサイザクタートの多頭性（三つの首）との共感・類似性を示唆する。彼が誰の遺伝子や呪いを受け継いでいるのか、その出自に関する重大な伏線。
  quotes:
  - quote: '頭頂部にある三角形の猫耳、右側頭部にある兎の垂れ耳、そして左側頭部にあるテスモポリスそっくりの尖った耳。

      ヴァージルの両耳は、左右が非対称なのだった。'
    paragraph: p265-p266
    quote_verified: true
  expected_payoff: ヴァージルがサイザクタートや冥道の王族とどのような血縁・呪い的繋がりを持つかが判明する。彼の「純真さ」の正体や、彼がなぜこの特異な運命を背負っているかの背景。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
