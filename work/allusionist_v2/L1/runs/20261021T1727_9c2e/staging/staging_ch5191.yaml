- canonical_target: '[[E_char_リーナ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5191_リーナ_other_感情の複雑さ_p111
        quote: 「えっと、でもあたし思うんだけど、人の感情ってそんなにはっきりとしたものじゃないから、色々な考えが混在する事もあると思うんだ。本人視点で流れを追っていけばそんなに不自然じゃないことも多いんだよ」
        locator: {}
        spoiler_after: ch5191
      - event_ref: E_ch5191_リーナ_other_リールエルバの素nature_p115
        quote: 「そっか、リーナは一番付き合い長いんだっけ。じゃあこれ、幽閉されて精神が――とかじゃなくて、素なんだ。そっか」
        locator: {}
        spoiler_after: ch5191
      - event_ref: E_ch5191_リーナ_other_ガルズを生かした事_p234
        quote: 「あのね。私、ここ数日ずっと考えてた。アズーリアに、殺された人たちにどうやって償えばいいんだろうって。私が生かして捕まえたいなんて考えずに、見つけ次第ガルズを殺していればこんなことにはならなかったんじゃないかって」
        locator: {}
        spoiler_after: ch5191
      - event_ref: E_ch5191_リーナ_other_アズーリアに会って謝る_p240
        quote: だから、私はアズーリアにまた会いたいよ。会って話して、謝って、それで――それで、まず目の前の事を片付ける！　マリーをどうするかとかは後で考える！　っていうかアズーリアとみんなに相談する！」
        locator: {}
        spoiler_after: ch5191
      - event_ref: E_ch5191_リーナ_other_マリーとの青空の思い出_p247
        quote: '「それまで私はアズーリア――マリーとはあまり話さなかったんだけど――その頃になって、私はマリーとようやく筆談するようになった。共有できた話題は、お互いが関心のある事柄」

          ――私たちは、青空について話したんだ。

          そして、リーナの話が始まった。'
        locator: {}
        spoiler_after: ch5191
    action:
      observations:
      - event_ref: E_ch5191_リーナ_other_箒のアバターで掃除_p213
        quote: リーナは箒のアバターで無意味にあたりを掃除しているが、かえって埃が巻き上がるだけで周囲に迷惑をかけている。
        locator: {}
        spoiler_after: ch5191
    relationship:
      observations:
      - event_ref: E_ch5191_リーナ_other_アズーリアとガルズの事件_p217
        quote: '心ここにあらずな理由は明らかだ。

          目の前で、ガルズ・マウザ・クロウサーがアズーリアを殺害した事。

          そして、その直後にサリアによって無惨に引き裂かれた事。

          その二つの余りに衝撃的な光景に加え――事態がまるで終息する気配を見せないことがリーナの心を苛んでいるのだ。'
        locator: {}
        spoiler_after: ch5191
  first_appearance_candidate: true
