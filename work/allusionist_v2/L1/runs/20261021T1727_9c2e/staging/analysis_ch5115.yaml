- kind: mystery
  name: MY_symmetry_of_burden
  note: トリシューラが維持コストと被弾負担を一方的に担っているという非対称性。
  quotes:
  - quote: 実際の所、呪力による維持コストを支払うのは主にトリシューラで、外側で攻撃を受け止めるのもまたトリシューラだ。負担は一方的にトリシューラにだけのし掛かる。ここからは一切のミスが許されない。
    paragraph: p105
    quote_verified: true
  expected_payoff: トリシューラの消耗や限界、あるいはアキラへの依存度が高まり、後の展開でトリシューラの存在意義や犠牲に関するドラマが生じる伏線。
