  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5481_レナリア_other_休息の指示_p100
        quote: 「正論。どっちにしろ武具の店とか工房とか、夜は閉まってるでしょ。時間はあまり無いけど急いでも消耗するだけよ。朝まで休みなさい」
        locator: {}
        spoiler_after: ch5481
      - event_ref: E_ch5481_レナリア_other_同室での就寝_p110
        quote: 「決まりね。それじゃ、寝室を用意してくれる？ 私も一緒に寝るからベッドは二つね」
        locator: {}
        spoiler_after: ch5481
      - event_ref: E_ch5481_レナリア_says_ユディーアの身体変化_p133
        quote: 「かわいーなあ。なんだかあなた、昨夜より小さく見えるわ。ていうかそれ、やっぱり絶壁じゃない。おっぱいが大きくなりますようにーって夢も見せてあげれば良かった？」
        locator: {}
        spoiler_after: ch5481
      - event_ref: E_ch5481_レナリア_says_王殺しの変身能力_p30
        quote: 「予選には飛び入り参加もあるし、外国からの参戦者も多数と聞いてるわ。なにより、『王殺し』は変装と潜入の達人なの。もっとも、あなたの聞いた人狼関係の話が事実なら本当に呪術的な変身者ということになるけど」
        locator: {}
        spoiler_after: ch5481
      - event_ref: E_ch5481_レナリア_says_王殺しの能力複合_p35
        quote: そして『王殺し』は邪視と変装、双方の技術を複合させた珍しいタイプだとレナリアは語った。
        locator: {}
        spoiler_after: ch5481
      - event_ref: E_ch5481_レナリア_says_狼皮の衣_p37
        quote: 「詳細は明かされていないけど、特殊な血統と『狼皮の衣』という呪具を活用した『姿変わり』の術を良く使ってるわ。戦闘用の狂戦士形態から高速移動用の獣形態、任意の対象そっくりに化ける欺瞞形態。暗殺対象になりすますことだって平然とやってのける」
        locator: {}
        spoiler_after: ch5481
      - event_ref: E_ch5481_レナリア_thinks_王殺しとの因果_p43
        quote: 「『満月機関』が虚偽広告を出してるんじゃなきゃそうね。それから機械女王の『きぐるみ妖精（ドーラーヴィーラ）』も狼皮の製品を扱ってる。んー、やばい感じ。思ってたよりこれ、『王殺し』と因縁が深いのかな？
          私の方でも因果を結ばないと」
        locator: {}
        spoiler_after: ch5481
      - event_ref: E_ch5481_レナリア_remembers_ゴーリーズの参加_p64
        quote: 「そういえば、あいつら祝祭のレースに参加するんだった。まあ本命は賭ける方なんだけど、それはそれとして予選の参加枠を獲得したとか何とか」
        locator: {}
        spoiler_after: ch5481
      - event_ref: E_ch5481_レナリア_asks_過去視の応用_p9
        quote: 「は？ 過去視で見た記録の中で更に過去視を？ 出来るの、そんなこと？」
        locator: {}
        spoiler_after: ch5481
    relationship:
      observations:
      - event_ref: E_ch5481_レナリア_thinks_灰色術師の常識_p11
        quote: 唖然とするレナリア。色号使いとしては得意分野の系統が違うとはいえ、彼女の常識では普通の灰色術師にそのようなことはできないことになっている。
        locator: {}
        spoiler_after: ch5481
    action:
      observations:
      - event_ref: E_ch5481_レナリア_other_ユディーア_p122
        quote: 「だーいじょうぶ。優しく注ぎ込んであげたから」
        locator: {}
        spoiler_after: ch5481
      - event_ref: E_ch5481_レナリア_other_潜入の可能性_p28
        quote: ユディーアの問いにレナリアは頷きを返した。
        locator: {}
        spoiler_after: ch5481
    name:
      observations:
      - event_ref: E_ch5481_レナリア_names_王殺しシェボリズ_p48
        quote: レナリアの目的は『王殺し』シェボリズを手に入れることだ。
        locator: {}
        spoiler_after: ch5481
  first_appearance_candidate: true
