        locator: {}
        spoiler_after: ch5084
      - event_ref: E_ch5084_アキラ_other_既視感_p81
        quote: 虚ろな瞳と声でぶつぶつと呟き続けるキロンの、あの救いようの無さに、強烈な既視感を覚える。
        locator: {}
        spoiler_after: ch5084
    visual:
      observations:
