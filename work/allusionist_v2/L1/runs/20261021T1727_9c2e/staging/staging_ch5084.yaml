- canonical_target: '[[E_term_コルセスカ]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5084_コルセスカ_other_救出の困難さ_p129
        quote: 「ですが、ここから出ようとすると時空間凍結を解かなければならないので、貴方もあの場所に放り出されてしまいます」
        locator: {}
        spoiler_after: ch5084
      - event_ref: E_ch5084_コルセスカ_other_未来の観測_p13
        quote: 「今の私達は隔離された時間軸の中にいます。どのタイミングであの宇宙に帰還するかはある程度選べますが、どうしましょう？ 私としては、少し先の未来まで見ながら適切な時間を選ぶのがいいと思うのですが」
        locator: {}
        spoiler_after: ch5084
      - event_ref: E_ch5084_コルセスカ_observes_アキラの変化_p29
