- kind: mystery
  name: MY_root_sorcery_origin
  note: 「根源者（ソーサラー）」や「イネクシュネ原体」の正体。人類以前からの存在であり、完全者の創造に関わる核心。
  quotes:
  - quote: いのちが人類（ロマンカインド）や精霊（テテリビナ）、空の民や夜の民などに分化するよりずっとずっと古い、根源獣パンゲオンの眷族種。すなわち、『根源者（ソーサラー）』
    paragraph: p151
    quote_verified: true
  expected_payoff: アルト・イヴニルの目的が単なる権力闘争ではなく、世界の起源や生命の定義に関わる壮大なテーマへと昇華する伏線。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_cain_abel_lineage
  note: 「アベルの末裔」と呼ばれる成功例（人工始祖）と、現在のキャラクター（リールエルバ、レッテ等）との血縁的・概念的な繋がり。
  quotes:
  - quote: 完成した人工始祖は『アベルの末裔』と呼ばれていたと、前にウチのベルお姉様から聞いたことがあります。幾つかの成功例があると――ええ、金錐神が手ずから泥を捏ね上げて創った私を含めてね
    paragraph: p158
    quote_verified: true
  expected_payoff: キャラクター間の対立が、神話的な兄弟殺し（カインとアベル）の再演として描かれる展開。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_lina_stalker_identity
  note: リーナを追いかけている「ストーカー、あるいは厄介なファン」の正体。
