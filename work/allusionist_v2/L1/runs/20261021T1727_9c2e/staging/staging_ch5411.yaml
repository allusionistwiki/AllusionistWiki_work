          めいめい酒か煙草か麻薬に溺れ、漫然と時間を擦り減らしていく。'
        locator: {}
        spoiler_after: ch5411
    speech:
      observations:
      - event_ref: E_ch5411_プーハニア_says_仕事辞める決意_p290
        quote: 「俺、シナモリアキラ（仕事）を辞めようと思うんだ」
        locator: {}
        spoiler_after: ch5411
  first_appearance_candidate: true
- canonical_target: '[[E_char_店員]]'
  entity_type: character
  aspects:
