entities:
- canonical_target: '[[E_relation_クレイ]]'
  entity_type: relationship
  aspects:
    action:
      observations:
      - event_ref: E_ch5411_クレイ_other_高みを目指す決意_p10
        quote: その日からクレイは更なる高みを目指すことを決意し、ファウナは師としてクレイを鍛えることを決めた。
        locator: {}
        spoiler_after: ch5411
      - event_ref: E_ch5411_クレイ_travels_下層の迷宮_p103
        quote: '目指すは下層。彼が挑み、敗れてきた最後の関門だ。

          クレイは自分を庇って攫われた師を追いかけているのか、それとも囚われの女王を救いに向かっているのか、曖昧なままに疾走する。'
        locator: {}
        spoiler_after: ch5411
      - event_ref: E_ch5411_クレイ_fights_迷宮の怪物と仮想歌姫_p107
        quote: 立ちはだかる迷宮の怪物を一刀のもとに切り捨て、電子音声でステージを表現する仮想歌姫たちを鍛えた舞いで一蹴していく。仕掛けられる辻ライブで勝利するたび、師の教えが更にクレイの中で深まっていく。定着した教えが彼を更に鍛え、勝利が彼の意思を研ぎ澄ましていった。
        locator: {}
        spoiler_after: ch5411
      - event_ref: E_ch5411_クレイ_conceals_感情_p12
        quote: '修練に没頭するクレイは、余分な言葉をファウナと交わすことはなかった。

          それはファウナも同じで、両者の間に血の通った感情が行き交ったことはただの一度も無い。純粋な舞踏技術の受け渡しだけがそこにあった。'
        locator: {}
        spoiler_after: ch5411
      - event_ref: E_ch5411_クレイ_fights_イアテム_p126
        quote: '問いに答えることも、何故この男がここにいるのかを問う事もクレイはしなかった。迷いは無い。イアテムを殺す。彼は一振りの刃となって空間を引き裂く。

          駒のように回転したイアテムの足と、舞うように翻ったクレイの手が激突した。'
        locator: {}
        spoiler_after: ch5411
      - event_ref: E_ch5411_クレイ_other_遠くのアイドルの歌_p22
        quote: '遠く、賑やかな音が聞こえた。

          またどこかでアイドルたちが歌い、舞っているのだろう。'
        locator: {}
        spoiler_after: ch5411
      - event_ref: E_ch5411_クレイ_learns_仕置きの学習_p6
        quote: クレイは苛烈な指導に耳を傾けながらも舞いを途絶えさせることは無い。足を止めれば更に激しい仕置きが待っていると学習させられていたからだ。
        locator: {}
        spoiler_after: ch5411
      - event_ref: E_ch5411_クレイ_asks_修行場所の提供_p7
        quote: 地下迷宮の外れ、ファウナの小屋がある一帯の草原で、二人は一心不乱に稽古を行っていた。全てはクレイから頼み込んだことである。
        locator: {}
        spoiler_after: ch5411
    speech:
      observations:
      - event_ref: E_ch5411_クレイ_other_尊敬の欲求_p42
        quote: 「俺は最も大いなるゆるしを最初に得ている。ただそれに報いるだけだ」
        locator: {}
        spoiler_after: ch5411
      - event_ref: E_ch5411_クレイ_other_可能性の存在_p54
        quote: 「だろうな。陛下に与えられたこの身には無数の可能性が眠っている。俺は俺のまま、その気になれば何にでもなれるだろう」
        locator: {}
        spoiler_after: ch5411
      - event_ref: E_ch5411_クレイ_promises_女王への忠誠_p60
        quote: '「それでも俺は陛下に剣を捧げると決めた。だから俺は王国の剣であり続ける」

          それでいいと、青年は迷い無く言い切った。'
        locator: {}
        spoiler_after: ch5411
  first_appearance_candidate: true
