- kind: mystery
  name: MY_Vampire_Headache_Cause
  note: 吸血鬼老人が感情を取り戻した直後に「殺しのたびに頭痛が酷くなる」という症状が出ている。これは精神的苦痛の物理的現れ（心身相関）なのか、それとも「模造脳」の限界、あるいは呪術的な副作用か。
  quotes:
  - quote: 老人は、ちかごろ殺しのたびに頭痛が酷くなるのを感じていた。遠い過去、殺し屋を始めたばかりのころに感じていた苦痛。薬物と自己暗示で誤魔化しても己を苛む罪の意識。
    paragraph: p308-p311
    quote_verified: true
  expected_payoff: 老人がシナモリアキラを殺さずに済む理由（感情の蘇りによる良心の呵責）、あるいは彼の死/破滅へのカウントダウン。
