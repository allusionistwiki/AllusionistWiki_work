      - event_ref: E_ch5006_一行_other_休憩_p31
        quote: 皆、床に腰を下ろしたり、水を水筒に入れたりしていた。休憩、ということなのだろうか。
        locator: {}
        spoiler_after: ch5006
      - event_ref: E_ch5006_一行_departs_噴水部屋_p89
        quote: 暫くして、俺たちは噴水の部屋を後にした。
