- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5006_アキラ_other_左腕_p104
        quote: こうなると、最初に奪われた左腕も見つけたくなる。
        locator: {}
        spoiler_after: ch5006
      - event_ref: E_ch5006_アキラ_other_左腕喪失_p107
        quote: 倒した人狼の口に左腕の断端を沿え、苦痛に呻くような素振りをする。その後、存在しない左腕を持って軽く走り去ろうとする。
        locator: {}
        spoiler_after: ch5006
      - event_ref: E_ch5006_アキラ_observes_戦闘_p16
        quote: が、俺の出番は無かった。
        locator: {}
        spoiler_after: ch5006
      - event_ref: E_ch5006_アキラ_thinks_対一行戦闘_p24
        quote: 彼らを同時に相手取ったとき、俺はどう立ち回れば勝てるだろうか。暇なのでそんなことばかり考えていると
        locator: {}
        spoiler_after: ch5006
      - event_ref: E_ch5006_アキラ_uses_水筒_p36
        quote: 礼を言って、いただくことにした。一瞬腹を壊すかも知れない、とか考えたが、喉の渇きが勝った。
        locator: {}
        spoiler_after: ch5006
      - event_ref: E_ch5006_アキラ_learns_噴水部屋の機能_p39
        quote: これは覚えておくと便利かも知れない。いざというときこういう噴水のある部屋に逃げ込めば助かる可能性が生じる。
        locator: {}
        spoiler_after: ch5006
      - event_ref: E_ch5006_アキラ_fears_処刑_p47
        quote: どういった性格の組織なのかまではわからない。連れられていった先でいきなり処刑されたりしなければいいのだが。
        locator: {}
        spoiler_after: ch5006
      - event_ref: E_ch5006_アキラ_learns_コインの用語_p78
        quote: コインの、十字のような模様が描いてある方が「ィー」で（聞き取りづらかったがおそらく『Y』音だ）松明の絵が描いてある方が「キー」だ。
        locator: {}
        spoiler_after: ch5006
      - event_ref: E_ch5006_アキラ_makes_辞書もどき_p80
        quote: 片っ端から録音し、カタカナに直してネームタグを付け、メモ帳と同期させて記憶した。音声と文字、映像を関連付けしていけば、アナログな手法でも辞書もどきができる。
        locator: {}
        spoiler_after: ch5006
      - event_ref: E_ch5006_アキラ_fears_言語未習得_p83
        quote: 元世界のサポートを半ば以上放棄している現在、言語を脳内にインストールしてはい解決、ということにはならないだろうからだ。
        locator: {}
        spoiler_after: ch5006
      - event_ref: E_ch5006_アキラ_fights_人狼_p99
        quote: 俺はと言えば、右肩を動かせるようになったことでサイバーカラテの技を遺憾なく発揮し、複数の人狼が現れた際は勝利に貢献した。
        locator: {}
        spoiler_after: ch5006
    speech:
      observations:
      - event_ref: E_ch5006_アキラ_says_ありがとうございます_p111
        quote: 「ありがとうございます」
        locator: {}
        spoiler_after: ch5006
      - event_ref: E_ch5006_アキラ_has_property_非シリアルキラー_p60
        quote: まあ俺も誰彼構わず殺しにいく頭のおかしいシリアルキラーというわけではない。
        locator: {}
        spoiler_after: ch5006
      - event_ref: E_ch5006_アキラ_says_キー_p70
        quote: マフスが「キー」と聞こえる単語を喋ったので、後ろから俺も復誦してみる。
        locator: {}
        spoiler_after: ch5006
  first_appearance_candidate: true
- canonical_target: '[[E_char_カイン]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5006_カイン_other_アキラの意図_p109
        quote: カインは得心がいったという風に頷いてくれた。
        locator: {}
        spoiler_after: ch5006
      - event_ref: E_ch5006_カイン_is_located_戦闘外_p22
        quote: カインとテールは負傷したばかりのためか戦闘に参加していないが
        locator: {}
        spoiler_after: ch5006
      - event_ref: E_ch5006_カイン_other_コインゲーム_p67
        quote: カインがコインを取り出して、軽く上に弾いて、戻ってきたところで手の中に隠す。裏か表かを当てるゲームだろう。
        locator: {}
        spoiler_after: ch5006
      - event_ref: E_ch5006_カイン_gives_丸薬_p74
        quote: カインは腰の収納から小さな丸薬のような粒を取り出すと、テールに渡す。
        locator: {}
        spoiler_after: ch5006
      - event_ref: E_ch5006_カイン_teaches_アキラ_p91
        quote: カインと俺がしきりに会話、というかカインの言葉を俺が復誦する、というやりとりを繰り返している点だ。
        locator: {}
        spoiler_after: ch5006
      - event_ref: E_ch5006_カイン_teaches_戦闘単語_p93
        quote: 人狼との戦闘後には、その死体や血を指さして、俺に言葉を教えてくれる。
        locator: {}
        spoiler_after: ch5006
      - event_ref: E_ch5006_カイン_teaches_環境単語_p93
        quote: 迷宮の壁や、燭台。そこから伸びる影。天井、床ときて、曲がり角。十字路に行き止まり。
        locator: {}
        spoiler_after: ch5006
      - event_ref: E_ch5006_カイン_has_property_治癒完了_p97
        quote: 休憩と治癒のシールがもたらした効果は絶大で、カインとテール、そして俺も戦闘に参加出来るようになっていた。
        locator: {}
        spoiler_after: ch5006
    visual:
      observations:
      - event_ref: E_ch5006_カイン_is_located_隊列中央_p4
        quote: 負傷者であるカインとテール、俺を挟むようにして
        locator: {}
        spoiler_after: ch5006
    speech:
      observations:
      - event_ref: E_ch5006_カイン_has_property_教育係適性_p95
        quote: カインははきはきとよく喋り、発音が俺にも聞き取りやすい。人と話したりするのも得意なようで、リーダーのキールにも俺の教育係を任されたようだった。
        locator: {}
        spoiler_after: ch5006
  first_appearance_candidate: true
