  note: 「王の交代劇」という大呪術が世界を欺いている。マラード（現）とルバーブ（元/真）がどのような経緯で入れ替わったのか、そのトリガーとなる「禁忌」の内容が不明確である。
  quotes:
  - quote: 入れ替わりは実現した。大賢者オルヴァの指導を受けて習得した『王の交代劇』という大呪術は世界の全てを欺き
