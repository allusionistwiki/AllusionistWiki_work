- kind: mystery
  name: MY_予言王カシュラムの能力範囲
  note: 奴隷男が「未来を予測した？」と疑問視された通り、予言は確定的なものか、それとも相手の思考を誘導する罠なのか。
  quotes:
  - quote: 「偉大なる予言王はこう仰っている。次に『鉄球は囮であったか』とお前は言うだろう、と」
    paragraph: p61
    quote_verified: true
  expected_payoff: カシュラム関連の勢力（アルト・イヴニルなど）との対決における戦略的な活用。
