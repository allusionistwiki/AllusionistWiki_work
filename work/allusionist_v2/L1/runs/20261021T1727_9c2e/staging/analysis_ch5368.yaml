- kind: mystery
  name: MY_子泣き爺の正体と目的
  note: 老人がシナモリアキラを殺した真の意図（政治工作か個人的快楽か）および「レストロオセ派」への干渉の結末。
  quotes:
  - quote: 「レストロオセ派が第五階層に影響力を行使するのを妨害せよ、手段は問わない――ってよぉ、殺し屋に頼んどいてそいつぁお上品過ぎってもんだぜ。まぁ、ジャッフハリムの客らしいけどな」
    paragraph: p24
    quote_verified: true
  expected_payoff: この工作が第五階層の勢力図をどう変えるか、また老人が後に主要キャラクターとして再登場するか。
