- kind: mystery
  name: MY_奈落の蓋と災厄
  note: グレンデルヒの死に際して「すぐに奈落の蓋が開く」「取り返しのつかない災厄を過去から呼び起こした」という予言が残された。これは物語全体の最終的な脅威（敵）を示唆している。
  quotes:
  - quote: 忠告しておいてやる。すぐに奈落の蓋が開くことだろう。お前たちは取り返しのつかない災厄を過去から呼び起こしてしまったのだ。
    paragraph: p265
    quote_verified: true
  expected_payoff: 中盤以降、第五階層の覇権争いや「太陽の都」関連で、グレンデルヒが封じようとしていた「過去の災厄（奈落）」が具体的な敵として出現する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
