        spoiler_after: ch5574
    speech:
      observations:
      - event_ref: E_ch5574_リーナ_suspects_パーンの重み_p111
        quote: 'パーンという存在は、この局面でそれほど重い意味を持つ。

          なぜかリーナはそんな気がしてならなかった。'
        locator: {}
        spoiler_after: ch5574
      - event_ref: E_ch5574_リーナ_says_無関係_p124
        quote: 「え～、よくわかんないかな～。ゾラ家の娘だろお前、みたいなプレッシャーはあったかも。ロディニオとかはもうぜんぜんわかんない、ってかいま関係あるそれ？」
        locator: {}
        spoiler_after: ch5574
      - event_ref: E_ch5574_リーナ_trusts_パーン_p140
        quote: 年若い魔女は相手の中に小さな人間性や意思を見つけたことで、素直に共感と尊敬の念を抱いた。だが、すぐにまた混乱することになる。
        locator: {}
        spoiler_after: ch5574
      - event_ref: E_ch5574_リーナ_learns_急速な成長_p66
        quote: リーナが成長しているのだ。この試練の中で、急速に。
        locator: {}
        spoiler_after: ch5574
      - event_ref: E_ch5574_リーナ_loses_使命の知識_p77
        quote: 『落ちこぼれ』として扱われてきたリーナは、血族に伝わる使命とやらを教えられていなかったからだ。
        locator: {}
        spoiler_after: ch5574
      - event_ref: E_ch5574_リーナ_says_大学での勉強_p86
        quote: 「『星見の塔』で勉強しておねーちゃんに教わって大学でもべんきょーしました！　ばっちりです！　忘れてません！　よゆーっす！」
        locator: {}
        spoiler_after: ch5574
      - event_ref: E_ch5574_リーナ_says_言理飛翔_p9
        quote: 「言理飛翔」
        locator: {}
        spoiler_after: ch5574
