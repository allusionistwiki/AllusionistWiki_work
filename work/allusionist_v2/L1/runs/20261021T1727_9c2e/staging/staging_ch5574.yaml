- canonical_target: '[[E_char_パーン]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5574_パーン_reveals_ガレニス断絶の真相_p106
        quote: 'そして『オルガンローデ』をはじめとする数々の呪術基盤を開発した偉大な呪術師であり、一説にはそれがきっかけでクロウサーの血族と対立し、その果てに当主ダウザールへの反逆を企てて失敗。

          ガレニス断絶の原因となった異端児がパーンだと聞いている。'
        locator: {}
        spoiler_after: ch5574
      - event_ref: E_ch5574_パーン_asks_ロディニオの血_p114
        quote: 「リーナ。お前とお前の姉は、覇王の血を引いているらしいな。旧世界ロディニオの因子を受け継いだ純正の叡智の民。その血の使命を受け継ぐつもりはあるか」
        locator: {}
        spoiler_after: ch5574
      - event_ref: E_ch5574_パーン_confesses_今を生きる者への許容_p128
        quote: 「いや。そうだな。今を生きるお前には関係ない。新婚ならばなおさらだ」
        locator: {}
        spoiler_after: ch5574
      - event_ref: E_ch5574_パーン_says_そうあるべきだ_p133
        quote: 「そうだ。そうあるべきだ。俺たちはな」
        locator: {}
        spoiler_after: ch5574
      - event_ref: E_ch5574_パーン_confesses_不在_p144
        quote: 「だが、俺はもはや『今』ではない」
        locator: {}
        spoiler_after: ch5574
      - event_ref: E_ch5574_パーン_asks_ゾラの悲願_p68
        quote: 「リーナ・ゾラ・クロウサー。貴様、あの血族の悲願とやらを見てどう思った？」
        locator: {}
        spoiler_after: ch5574
      - event_ref: E_ch5574_パーン_asks_悲願の継承_p72
        quote: 「ゾラの悲願とやらを、お前は受け継いでいるのか？」
        locator: {}
        spoiler_after: ch5574
      - event_ref: E_ch5574_パーン_teaches_テキストベース・サーキット_p80
        quote: 「太陰書架（イルディアンシア）の模倣であるテキストベース・サーキットは言素（イルド）の翻訳形式のひとつだ。ジャッフハリム一世はそれを『文字』と定義し、明藍の賢者アルカェは第七大地シャーネスから天啓を得て、クロウサーと共に『風』や『息吹』と定義した。『これ』はその中間だ。ここまではわかるな？」
        locator: {}
        spoiler_after: ch5574
      - event_ref: E_ch5574_パーン_asks_ゾラの意図_p95
        quote: 「問題は、ミブリナ・ゾラ・クロウサーが何を考えてこんな仕掛けを生み出したのかということだ。『文字（テキスト）』はあまりにも血統に依存したクロウサーのやり方から外れている。俺が竜神信教と組んで『オルガンローデ』の呪術基盤を生み出した時、呪文設計図を世間に公開しただけで『ガレニスの悲願への反逆』と言った連中だぞ？　なぜテキストベース・サーキットは認められている？」
        locator: {}
        spoiler_after: ch5574
    action:
      observations:
      - event_ref: E_ch5574_パーン_makes_機械仕掛けの巨腕_p58
        quote: パーンは機械仕掛けの巨腕を絶えず組み換え、増殖し、自己改造と適応を繰り返すことでその答えとした。
        locator: {}
        spoiler_after: ch5574
  first_appearance_candidate: true
