        locator: {}
        spoiler_after: ch5164
      - event_ref: E_ch5164_アズーリア_other_槍神_p174
        quote: いいえ、大いなる槍神に
        locator: {}
        spoiler_after: ch5164
      - event_ref: E_ch5164_アズーリア_remembers_記憶の曖昧さ_p3
        quote: そう、記憶は確かに存在する。けれど、その繋がりはどうにも曖昧だ。
        locator: {}
        spoiler_after: ch5164
    visual:
      observations:
      - event_ref: E_ch5164_アズーリア_wears_呪動装甲_p20
        quote: 私は槌矛を右手に、方形盾を左手に構えて、一歩を踏み出した。
        locator: {}
        spoiler_after: ch5164
    name:
