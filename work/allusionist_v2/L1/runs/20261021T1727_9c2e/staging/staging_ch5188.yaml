episode: ch5188
created: '2026-10-21'
status: pending_merge
entities:
- canonical_target: '[[E_term_サリア]]'
  entity_type: terminology
  aspects:
    action:
      observations:
      - event_ref: E_ch5188_サリア_stops_氷弓の起動_p10
        quote: そうした光景を目にしたサリアは、即座に首筋でたなびく封印呪布をはぎ取った。露わになった首筋に、二つの穿孔痕。凍結したその箇所から、目に見えぬ繋がりが虚空へと伸びて――いない。
        locator: {}
        spoiler_after: ch5188
      - event_ref: E_ch5188_サリア_stops_マリーへの攻撃_p104
        quote: '背後で、そして足下で、途方もない濃度の呪力が膨れあがる。

          振り返ると、へたり込んだハルベルトの目の前で、不定形の泥が再び蠢き始めていた。'
        locator: {}
        spoiler_after: ch5188
      - event_ref: E_ch5188_サリア_saves_アズーリアの仲間_p2
        quote: この上なく嫌な予感に急き立てられて、サリアは蛇の王を可能な限りの速さで解体してアズーリアの仲間二人を救出。無事を確認して即座に反転する。呼び止める声は無視。風のように疾走し、アズーリアのいる方へと向かう。
        locator: {}
        spoiler_after: ch5188
      - event_ref: E_ch5188_サリア_kills_ガルズ・マウザ・クロウサー_p92
        quote: 'その言葉を言い終える頃には、ガルズ・マウザ・クロウサーの解体は終了していた。血よりも先に肉片が舞う。

          『ありえない』と口にした時には既に二振りの刃が腕と胴体に埋め込まれた全ての金眼の表面を撫で、残りの腕もまた切断し終えていた。'
        locator: {}
        spoiler_after: ch5188
      - event_ref: E_ch5188_サリア_uses_空破_p98
        quote: '高らかに持ち上げられたサリアの長い脚が、音を置き去りにした。

          ミアスカ流脚撃術奥義【空破】――目視すら叶わぬ神速の蹴撃が空中の胴体を粉々に粉砕する。'
        locator: {}
        spoiler_after: ch5188
    speech:
      observations:
      - event_ref: E_ch5188_サリア_says_命令_p125
        quote: '自らの精神を足下の影に潜り込ませて行きながら、サリアは遠ざかる肉体に最後の命令を下す。


          「迷うな！」


          ただ一言。ハルベルトの瞳が、かすかに見開かれる。'
        locator: {}
        spoiler_after: ch5188
      - event_ref: E_ch5188_サリア_conceals_精神の侵食_p18
        quote: '首筋に滞留し、己の心を侵し続ける『それ』は、許容閾値を超えれば容易く己の精神を食らいつくし『個我』を喪失せしめるだろう。

          それは容認できない。

          そうなれば、自分が自分ではなくなってしまう。

          コルセスカの使い魔としての自分を規定できなくなる。'
        locator: {}
        spoiler_after: ch5188
      - event_ref: E_ch5188_サリア_says_無神論の宣告_p218
        quote: 「いいことを教えてやる。私の信仰は『無神論』だ。というわけで回答はこうだ――『お前は、存在しない』」
        locator: {}
        spoiler_after: ch5188
      - event_ref: E_ch5188_サリア_remembers_アズーリアとの死闘_p61
        quote: つい先程までアズーリアとしていたのと同じように――共に同じ円環に囚われ、運命を乗り越える為――そして互いの為に戦い続けた。
        locator: {}
        spoiler_after: ch5188
      - event_ref: E_ch5188_サリア_thinks_判断の正当性_p7
        quote: 否、二人を助けることができるだけの実力と速度を兼ね備えていたのはあの場では自分だけだ。リーナの箒に二人も乗せることはできないし、箒に跨ったところで飛行の術は専門的過ぎて扱いが難しい。空の民でもない者が免許も無しに空を飛ぶのは自殺行為だ。
        locator: {}
        spoiler_after: ch5188
      - event_ref: E_ch5188_サリア_says_阻止の宣言_p73
        quote: 「何をしようとしているのか知らないが、やらせない。次は君の番だハルベルト」
        locator: {}
        spoiler_after: ch5188
    visual:
      observations:
      - event_ref: E_ch5188_サリア_observes_絶望的な光景_p9
        quote: 黒い魔導書を手に、裸の上半身に無数の金眼を輝かせているガルズと傍らのマリー、そしてその前でわだかまる黒い泥のような何かとそれに取り縋って泣き叫ぶハルベルト、呆然とした様子のプリエステラたち。
        locator: {}
        spoiler_after: ch5188
  first_appearance_candidate: true
- canonical_target: '[[E_term_氷弓]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5188_氷弓_requires_呪力供給_p13
        quote: '駄目だ、使えない。

          今は主との繋がりが切れている。だから呪力供給はアズーリアに頼る他に無く、そのアズーリアが倒れた以上、過去への遡行は恐らく不可能。'
        locator: {}
        spoiler_after: ch5188
  first_appearance_candidate: true
- canonical_target: '[[E_term_マロゾロンド]]'
  entity_type: terminology
  aspects:
    visual:
      observations:
      - event_ref: E_ch5188_マロゾロンド_appears_as_古き神の端末_p152
        quote: '声は幼い。高く、少年とも少女ともつかぬ子供のそれだ。

          巨大な闇の中に、ぽつりと小さな黒衣の矮躯が浮かび上がっていた。

          まるで、典型的な『それ』の端末のように。'
        locator: {}
        spoiler_after: ch5188
    speech:
      observations:
      - event_ref: E_ch5188_マロゾロンド_reveals_アズーリアの役割_p184
        quote: '最悪の敵を懐に招き入れたアズーリアは当然の成り行きとして破滅する。

          個我を失って中身が空になったアズーリア――霊媒の身体に降臨することで、超越的な存在は実世界に自在に干渉できるようになるのだ。'
        locator: {}
        spoiler_after: ch5188
      - event_ref: E_ch5188_マロゾロンド_defines_夜の民_p208
        quote: 「いいや違うよ。夜の民は僕の手足であり手駒だ。そのように僕が作った僕の創造物であり道具であり身体の一部。本来は君たち霊長類だって、僕の端末を育てるための奉仕種族なんだよ？」
        locator: {}
        spoiler_after: ch5188
  first_appearance_candidate: true
- canonical_target: '[[E_term_古き神]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5188_古き神_defines_天使_p159
        quote: 大神院が天使と規定し、古くは神と呼ばれていたもの。
        locator: {}
        spoiler_after: ch5188
  first_appearance_candidate: true
- canonical_target: '[[E_char_ミルーニャ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5188_ミルーニャ_observes_絶望的状況_p222
        quote: 更には丸い何か――原形を留めていないが、あれは生首だろうか――を抱えたマリーがペイルやプリエステラの追撃を振り切って転移門へと消えたのが見える。
        locator: {}
        spoiler_after: ch5188
      - event_ref: E_ch5188_ミルーニャ_makes_自殺の黒槍_p236
        quote: '「左手中指、解錠（アンロック）――自殺の黒槍（スーサイダルブラック）」


          内的宇宙の倉庫から模造品の神滅具を取り出すと、そのまま穂先をハルベルトの頭部に突きつけ、鋭く低く声を発した。'
        locator: {}
        spoiler_after: ch5188
    speech:
      observations:
      - event_ref: E_ch5188_ミルーニャ_threatens_ハルベルト_p240
        quote: 「禁戒を破って下さい。さもなくば貴方を殺します、ヴァージリア」
        locator: {}
        spoiler_after: ch5188
      - event_ref: E_ch5188_ミルーニャ_confesses_アズーリアへの愛_p260
        quote: 「私はアズーリア様と一緒に普通に歳をとって、一緒に生きて一緒に死ぬと決めました。運命というのならこの人が私の運命だと思った。生まれて初めて、抗いたくないと思える運命に出会えたんです」
        locator: {}
        spoiler_after: ch5188
  first_appearance_candidate: true
- canonical_target: '[[E_term_白黒兎]]'
  entity_type: terminology
  aspects:
    visual:
      observations:
      - event_ref: E_ch5188_白黒兎_appears_as_使い魔_p27
        quote: '白黒の兎。なぜか片眼鏡をかけて小さな帽子をかぶっている。

          闇色の泥の陰に隠れるようにして存在しているその兎に気がついているのは、不思議と自分とハルベルトだけのようだった。'
        locator: {}
        spoiler_after: ch5188
    speech:
      observations:
      - event_ref: E_ch5188_白黒兎_functions_as_回復支援_p34
        quote: ではあればアズーリアの使い魔か。戦闘には向かない、純粋にお菓子を出して体力や呪力を回復させる為だけの支援役。
        locator: {}
        spoiler_after: ch5188
  first_appearance_candidate: true
- canonical_target: '[[E_term_ハルベルト]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5188_ハルベルト_confesses_否定の叫び_p273
        quote: '「貴方は違うんですか。貴方とアズーリア様の、マリーとの関係は、世界と天秤にかけて、世界の方に傾くほど軽いものだったんですか」


          「違うっ」


          強い否定。滅多に叫ぶと言うことをしない、激情を表に出さないハルベルトの、それは切実な意思だった。'
        locator: {}
        spoiler_after: ch5188
      - event_ref: E_ch5188_ハルベルト_requires_コルセスカとの共闘_p41
        quote: それどころか、ハルベルトの目的――地上、世界の中心、そして地獄の三界で大規模呪術儀式を行うという、最後の一つが極めて困難なそれ――を達成する為には、同じく地獄を目指しているコルセスカとの共闘が必須とも言えた。
        locator: {}
        spoiler_after: ch5188
      - event_ref: E_ch5188_ハルベルト_uses_禁呪_p52
        quote: '禁呪――それを使用することで、致命的な事態を回避しようとしているのだ。

          決して受け入れられない運命を、最悪の代償を支払うことによって拒絶しようとする悲壮な覚悟。'
        locator: {}
        spoiler_after: ch5188
    action:
      observations:
      - event_ref: E_ch5188_ハルベルト_other_禁呪の行使_p293
        quote: 'その果てに、決断が下される。

          黒玉の瞳に、もう迷いは無かった。'
        locator: {}
        spoiler_after: ch5188
    name:
      observations:
      - event_ref: E_ch5188_ハルベルト_is_located_呪文の座候補者_p38
        quote: '呪文の座の候補者――コルセスカに次ぐ、第二の末妹候補。

          繰り返しの中でアズーリアに明かされるまでもなく、サリアはその正体に気付いていた。もちろんアルマもだ。'
        locator: {}
        spoiler_after: ch5188
  first_appearance_candidate: true
- canonical_target: '[[E_char_ガルズ・マウザ・クロウサー]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5188_ガルズ・マウザ・クロウサー_has_property_後衛特化の実力_p4
        quote: 'ガルズ・マウザ・クロウサーはけっして弱くはないが、単体では必ずしも恐るべき相手というほどでもない。

          彼の実力は後衛であるからこそ輝くものだ。頼みの邪視と死人の召喚を封じられて何かができるとは思えない。'
        locator: {}
        spoiler_after: ch5188
  first_appearance_candidate: true
