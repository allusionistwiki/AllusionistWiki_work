entities:
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5022_アキラ_kills_屋台の店主_p100
        quote: 鋭利な串を眼球に突き立てて絶命する屋台の店主と、ビラの束に隠していた炸裂呪符を取り落として狼狽する小男の姿が目に映る。
        locator: {}
        spoiler_after: ch5022
      - event_ref: E_ch5022_アキラ_hides_腕_p128
        quote: 'どうでもいい。

          腕を外套の中に隠して、その場を後にする。'
        locator: {}
        spoiler_after: ch5022
      - event_ref: E_ch5022_アキラ_observes_日常風景_p89
        quote: 'そして圧殺。

          半年間の異世界生活を経て、すっかり見慣れてしまった日常風景がそこにあった。'
        locator: {}
        spoiler_after: ch5022
      - event_ref: E_ch5022_アキラ_other_飛び道具_p98
        quote: 風切り音と共に飛んできた鋭利な飛び道具を右手で掴むと、そのまま投げ返す。そのままの勢いで背後から投げつけられた紙切れを防御する。右手に衝撃と熱。道具による呪術の発動で視界を妨げていたビラが消失。
        locator: {}
        spoiler_after: ch5022
      - event_ref: E_ch5022_アキラ_attacks_相手_p12
        quote: 相手の呼吸の間隙を縫って胸ぐらを掴み、卓上に叩きつける。
        locator: {}
        spoiler_after: ch5022
      - event_ref: E_ch5022_アキラ_uses_コンバーター_p37
        quote: この半年でかろうじて数字が読めるようになっていた俺は、携帯バッテリーから伸びたプラグを義腕の差し込み口に挿入、変換器の電圧を100（手指の数に由来しているのか、ほとんど十進法が基準となっている）に合わせる。最初に試したときは冷や汗をかきながらだったが、今は慣れたものだ。
        locator: {}
        spoiler_after: ch5022
      - event_ref: E_ch5022_アキラ_other_充電_p43
        quote: ともあれ、歴史を重ね、必然的に電気工学が順当に発達した（もっとも俺の元いた世界とは方向性が違うようだ。呪術があるせいだろう）この世界で、俺は充電という生存に必須の行為を行うことができていた。前の世界では食事同然の日常だったので、転生した後も続けているというのは不思議な感覚がある。
        locator: {}
        spoiler_after: ch5022
      - event_ref: E_ch5022_アキラ_travels_路地から大通りへ_p52
        quote: 組織がいくつかの用途の為に借りているフラットの一室を後にして、追跡を警戒しつつ路地を何度も曲がり、大通りへと出る。まあ呪術的な発信器とかを付けられていたらどうしようもないので、無意味な用心ではある。しかし染みついた癖は中々抜けないもので、振り返ることはしなくても耳を澄ましながら歩くことが習慣になってしまっているのだ。
        locator: {}
        spoiler_after: ch5022
      - event_ref: E_ch5022_アキラ_appears_第五階層_p60
        quote: '一瞬のようにも感じられた闇が晴れた時、俺はこの第五階層に一人で立っていた。

          ただ、ひとりきりで。'
        locator: {}
        spoiler_after: ch5022
    speech:
      observations:
      - event_ref: E_ch5022_アキラ_thinks_襲撃の日常性_p102
        quote: 下らない風景だ。襲撃も暗殺も、ここではありふれた日常でしかない。失敗すればああやって日常を過ごす人々によって食い物にされるのだ。
        locator: {}
        spoiler_after: ch5022
      - event_ref: E_ch5022_アキラ_thinks_翻訳の曖昧さ_p122
        quote: 'さてこの翻訳は正しいのかどうか。この世界で最初に遭遇した相手が鎧を指し示したのでそうじゃないかというだけで、実際にはニュアンスが異なるかもしれない。同じ音を、誰かが建物の壁とか屋根に対して使っているのを耳にしたこともある。それと厚手の衣服にも似たような音の響きがあった。もしかすると、『覆うもの』とかその辺りの意味領域なのかもしれない。だがしかし、『覆われている腕』とかよくわからないし皮膚だけが人工物というわけでも無いので、『ぱっと見たところでは鎧のような質感の腕』くらいのつもりで俺は『鎧の腕』という翻訳を採用しているのであった。脳内でだけ。どうせ他人には通じない。

          なにしろ、半年経っても言葉がわからない。'
        locator: {}
        spoiler_after: ch5022
      - event_ref: E_ch5022_アキラ_names_暴力_p16
        quote: つまりは暴力だ。
        locator: {}
        spoiler_after: ch5022
      - event_ref: E_ch5022_アキラ_says_罵倒_p18
        quote: 「いいかげんにしろよ社会のダニが。足りねえっつってんだろ計算もまともにできねえのか。頭ん中にスポンジでも詰まってるのか？　それとも言葉がわからなきゃばっくれてもてめえの懐が潤うだけだとでも勘違いしちまったのか？　てめえが死んで困るのはてめえだけだ。交換可能な使いっ走りが欲の皮突っ張らせた挙げ句くたばるなんざ笑えねえぞおい」
        locator: {}
        spoiler_after: ch5022
      - event_ref: E_ch5022_アキラ_other_情報貨幣の受取能力_p23
        quote: 俺は端末を持っていないから、情報貨幣での支払いは無い。
        locator: {}
        spoiler_after: ch5022
      - event_ref: E_ch5022_アキラ_says_不満_p30
        quote: 「――よし、満タンだな。あとサプリだ。ああ？　錠剤でよこせっつったろうが！　ああくそ言葉マジ通じねえな、つーかなんだよこのぼそぼそしたのは乾パンかよ！」
        locator: {}
        spoiler_after: ch5022
      - event_ref: E_ch5022_アキラ_other_待ち人_p58
        quote: '半年前。死闘を乗り越えた仲間――そう言っていいのかわからないが――と再会を約束した後。

          待てども待てども、俺の元に待ち人が現れることは無かった。'
        locator: {}
        spoiler_after: ch5022
      - event_ref: E_ch5022_アキラ_other_第五階層の混沌_p63
        quote: 'そして、気がついた時には訳のわからない状況のただ中に取り残され、翻弄され、圧倒され、変動していく第五階層という混沌に飲み込まれてしまったのだ。

          そう――この世界は混沌そのものだ。'
        locator: {}
        spoiler_after: ch5022
      - event_ref: E_ch5022_アキラ_observes_未知の言語_p8
        quote: おわかりいただけると思うが、未知の言語を聞いて、その音の連なりを文章として認識することは非常に難しい。ある種の才能か技術が必要だ。
        locator: {}
        spoiler_after: ch5022
      - event_ref: E_ch5022_アキラ_other_もどかしさ_p9
        quote: だから俺が相手のまくし立てている言葉を表現できないのは仕方のないことで、そのニュアンスも含めて伝えることができないのは大変もどかしい限りである。
        locator: {}
        spoiler_after: ch5022
    symbolic:
      observations:
      - event_ref: E_ch5022_アキラ_thinks_必要な腕と足場_p3
        quote: '足りないのは、欲しい物を手繰り寄せるための腕。

          そして、踏みしめられる確かな足場。'
