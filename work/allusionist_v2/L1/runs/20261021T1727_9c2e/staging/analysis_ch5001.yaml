- kind: mystery
  name: MY_cybernetic_arm_origin
  note: 主人公が「生身の腕が再構成されていた」と勘違いしていたサイバネ義肢が、なぜ異世界に存在するのか。これは転生時のチェック漏れなのか、意図的な仕込みか、あるいは保険会社の重大なコンプライアンス違反の証拠となる。
  quotes:
  - quote: 俺の右腕の肘から先は、現在の地球における最先端の電子制御技術によって作られたサイバネ義肢だ。...恥ずかしいことに、たった今存在に気付いた。さっきまで生身の腕が再構成されていたと勘違いしていたのだ。
    paragraph: p96
    quote_verified: false
  expected_payoff: 後の展開で、保険会社の悪意ある実験体であったことが判明するか、法廷闘争や国際問題へと発展するトリガーとなる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_support_center_access
  note: 脳内インプラント経由でのサポートセンター接続が、なぜ異世界で機能したのか。「間世界通信」の存在自体が条約違反である可能性があり、この通信経路の脆弱性や監視構造が物語の鍵となる。
  quotes:
  - quote: 本来は通じるはずが無いものだ。...脳内にインプラントされたマイクロマシンは思考制御や外付けのハードウェア以外にも、肉体のしぐさを読み取って動作させることが可能だ。標準機能ではないが、据え置き機のマウスジェスチャのように好みや使いやすさで使用する者もいる。
    paragraph: p77-p83
    quote_verified: false
  expected_payoff: 通信が監視されている事実の発覚、あるいは通信システム自体が異世界の神々/管理者による介入手段であることの露見。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_loop_plan_elite
  note: 「ループ+異世界転生」のプランが存在し、富裕層のみが利用可能という記述は、階級社会と時間操作（ループ）の権限が関連していることを示唆する。
  quotes:
  - quote: いや、超高額の、ループ+異世界転生のプランもあるらしいのだが、そこまでの金を用意できるのは一握りの富裕層だけだ。
    paragraph: p50
    quote_verified: true
  expected_payoff: 物語後半で「時間遡行」や「状態保存」というチートが富裕層の専売特許であることが明かされ、主人公との格差ドラマに直結する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_scyber_karate_origin
  note: 「ネオアメリカ発祥」とされるサイバーカラテが、なぜ異世界のモンスター戦で有効なのか。技術の普及範囲と、その戦闘スタイルが「ゲーム的」であることの不自然さ。
  quotes:
  - quote: ちなみにサイバーカラテはネオアメリカ発祥の機械化人体を前提とした格闘術である。
    paragraph: p133
    quote_verified: true
  expected_payoff: 異世界側にも技術移転やゲーム的なシステム（ステータス操作）が存在する証拠、あるいは保険会社が顧客を「戦闘データ」として活用している構造の露見。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 自己責任論の崩壊とシステム依存の残酷さ
  weight: 0.9
  quotes:
  - quote: 俺はあのときに間違えたのだ。...保険会社の再三に渡る勧めを「がめつい連中だな」とか思いながら突っぱねた結果がこれだ。
    paragraph: p43-p44
    quote_verified: false
  - quote: 『非常用回線をお繋ぎします。...ただいま回線が大変混み合っておりますので、少々お待ち下さい』
    paragraph: p61-p67
    quote_verified: false
  note: リスクを選択した対価として死を招き、最終的にシステム（保険会社）に救いを求めるが、そのシステムもまた官僚的で非情であるという構造。
  proposed_by:
