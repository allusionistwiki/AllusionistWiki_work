- kind: theme
  theme: 技術と法による身体規制のディストピア性
  weight: 0.8
  quotes:
  - quote: 元世界の技術は、原則として異世界に持ち込んではならない。...それが、何の手違いなのか、技術を異世界に持ち込んでしまっている？
    paragraph: p89-p93
    quote_verified: false
  - quote: 重罪を犯した可能性がある。
    paragraph: p106
    quote_verified: true
  note: 生存に必要な技術（義肢）が法的に禁止されているというパラドックス。法の支配と生存権の衝突。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 人間の行動のアルゴリズム化と主体性の喪失
  weight: 0.7
  quotes:
  - quote: 痛みが他人事になる。肉体から意識が切り離され、俺ではなく規定のプログラムが運動を制御する。
    paragraph: p116
    quote_verified: true
  - quote: 動作アシストに従って動けば、俺のような一般人でも簡単にサイバーカラテの達人になれる。
    paragraph: p133
    quote_verified: true
  note: 恐怖や痛覚を無効化し、アプリの指示通りに動くことで「達人」になる描写は、人間の自律性（主体性）が技術によって奪われていることを示す。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
