- kind: theme
  theme: 科学は世界を記述するのではなく、信念によって世界を構成する（観測者効果の社会学的応用）
  weight: 0.8
  quotes:
  - quote: 学説などはそれが『有力』と見なされた時点で正誤に関わらずそれが事実として世界を改変してしまうのだ。
    paragraph: p14
    quote_verified: true
  - quote: 研究によって明らかになりつつある脳の諸機能が誇張されて伝播し、わかりやすいものとして巷間に流布、現実化していくようにね
    paragraph: p2
    quote_verified: true
  note: 骨相学や脳機能局在論が「呪術」として効力を有する理由を、科学的社会学（STS）的な視点で解説している。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 記憶と血脈の継承こそが不死であり、肉体的な長命は絶望である
  weight: 0.7
  quotes:
  - quote: 記憶だけを、永遠という孤独の慰めとする。
    paragraph: p139
    quote_verified: true
  - quote: 自分は長命の種。同じ幻姿霊（スペクター）でさえ、たった九人の幽鬼（レイス）と同じだけの歳月を歩むことはできない。それは絶望だった。
    paragraph: p116
    quote_verified: true
  note: ミシャルヒの内面独白において、長命種の苦悩と「記憶による永遠」への希求が主題化されている。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 人工知能と幻肢：身体性の拡張と魂の不在というジレンマ
  weight: 0.6
  quotes:
  - quote: 人という矮小な括りを飛び越えて、より発展的な肉体が獲得できる。それこそ変身者や夜の民のように！
    paragraph: p80
    quote_verified: true
  - quote: 残念ならが、普通機械には魂が無く、基本的に邪視は発動できないとされているって、トリシューラ先生が言ってました。
    paragraph: p69
    quote_verified: false
  note: トランスヒューマニズム的な身体拡張の欲望と、それに対する宗教的・倫理的な禁忌（魂の不在）との対立。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 物語（劇）への没入とメタフィクション的な自覚
  weight: 0.5
  quotes:
  - quote: 演劇は原始的で普遍的な衝動だ。格好をつけた口上と、男の与太話に本質的な違いは無い。どちらも自己の慰撫だ。
    paragraph: p18
    quote_verified: true
  - quote: もちろん、まるで気付かずに劇の中に入り込んだまま。ゲラティウスという役、それを演じるグレンデルヒという役、そしてベースとなる役者としてのゾーイ・アキラとケイトの外世界人二人組。
    paragraph: p54
    quote_verified: true
  note: キャラクターたちが自分たちの行動を「劇」や「台本」としてメタ的に認識しており、物語構造自体がテーマとなっている。
