- kind: mystery
  name: MY_phantom_limb_power
  note: パーンが巨人ラウスの腕（幻肢）を「霊媒適性なし」で掌握し、暴走を鎮めた理由。
  quotes:
  - quote: （うっそー。ベフォニスが霊媒だったからこそ巨人と同化するなんてことができたんだよ？ 何で霊媒適性も無いのに、完全に掌握できてるの？）
    paragraph: p211
    quote_verified: true
  expected_payoff: パーンの能力の本質（転生者としてのチート等）や、幻肢呪術の真のメカニズムが明かされる伏線。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_misharhi_silence
  note: ミシャルヒがグレンデルヒからの「更なる力」の誘いに対し、沈黙し拒絶した真意。
  quotes:
  - quote: ミシャルヒは、静かに目を閉じて、動かない。
    paragraph: p40
    quote_verified: true
  - quote: 今は待つさ。機が熟するまで。なあに、時間は幾らでもある。何しろ、今はまだ大地が引き裂かれてすらいないのだ！ 悠久の時間を、我ら百二十八人は待ち続けるぞ、ミシャルヒよ！
    paragraph: p108
    quote_verified: true
  expected_payoff: ミシャルヒが最終的に「力を求める」瞬間が訪れるか、あるいは彼独自の道（記憶の継承など）を選ぶ伏線。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
