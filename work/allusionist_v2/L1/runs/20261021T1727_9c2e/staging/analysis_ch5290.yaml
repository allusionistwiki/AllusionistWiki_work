- kind: mystery
  name: MY_who_is_kurtis
  note: カーティスという名前を持つ存在が、ドラトリア初代国王と同名でありながら、リールエルバに酷似した容姿で登場した。その正体と目的。
  quotes:
  - quote: 現れた何者かは、ドラトリアの協力者、リールエルバと瓜二つだったのだ。
    paragraph: p270
    quote_verified: true
  - quote: カーティスという。よろしく
    paragraph: p278
    quote_verified: true
  expected_payoff: 過去と現在の時間軸の干渉、またはリールエルバとの遺伝的・概念的な関係が明かされる可能性が高い。
