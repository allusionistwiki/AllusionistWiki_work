    paragraph: p288
    quote_verified: true
  expected_payoff: フェロニアの運命が物語の中心に据えられ、カーティスとの対立または和解のプロットへ展開する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_grendelhi_role
  note: グレンデルヒ（ゾーイ）がパーンを突き倒し、ミシャルヒを誘導した真の目的。
  quotes:
