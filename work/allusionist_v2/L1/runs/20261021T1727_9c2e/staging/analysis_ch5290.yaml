- kind: theme
  theme: 支配と被支配の構図：王権神授説の解体と再構築
  weight: 0.4
  quotes:
  - quote: クレイの声で、するべき事に気付いた。混沌とした状況を強制的に終了させる方法がそれだった。そもそも、冥道の幼姫に六王を従わせることが目的なのだ。
    paragraph: p235
    quote_verified: true
  - quote: 神は自らを信仰する眷族種を生み出し加護を与え、眷族種は神に祈りを捧げその存在を強固にしていく。この一種の共生関係、相互依存が何かの切っ掛けで崩れるなどした時、神は零落し、邪神もしくは巨人と呼ばれる存在になってしまう。
    paragraph: p148
    quote_verified: true
  note: クレイによる王権の行使と、ベフォニスの神格剥奪が並置され、権力の正当性と依存関係の変遷が描かれている。
