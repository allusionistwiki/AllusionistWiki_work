  quotes:
  - quote: 舌なめずりをした覚えは無かったが、アズーリアには動物的な直感が備わっているのかも知れない。鋭くふり向くと、じっと睨まれてしまった。六人はおおむね友好的だが、アズーリアは不審過ぎる俺にそれなりの警戒心を抱いてはいるらしい。健全なことである。
