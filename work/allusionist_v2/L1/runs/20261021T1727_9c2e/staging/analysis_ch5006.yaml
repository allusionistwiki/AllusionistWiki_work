- kind: mystery
  name: MY_噴水部屋の防御機構
  note: 人狼が物理的に阻まれて退去する理由が不明。魔法結界、地形的特徴、あるいは特定の生物を忌避する属性を持つ可能性。今後の戦略的利用と、このメカニズムの解明が示唆される。
  quotes:
  - quote: その人狼は俺たちを発見すると襲いかかってきたのだが、部屋の入り口で何かに阻まれたかのように立ち止まり、じりじりと後退ったかと思うと、そのまま引き返していった。この部屋に彼らは入れないらしい。一体どういう理屈でそうなっているのかは全く不明だが、とにかくそういうことなのだと俺は納得した。
    paragraph: p39
    quote_verified: true
  expected_payoff: アキラが危機時に噴水部屋へ逃げ込むシーンでの防御機構の描写、またはその原理を利用した罠・対策の発見。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_組織の正体と目的
  note: キールたちが所属する「大きな組織」の詳細が不明。アキラを処刑対象とするか保護対象とするか、台座からの通信内容（アキラの報告）の意図が問われる。
  quotes:
  - quote: キールたち六人は、なにかの大きな組織に所属しているのだろう。統一された武装に訓練された動き。どういった性格の組織なのかまではわからない。連れられていった先でいきなり処刑されたりしなければいいのだが。
    paragraph: p46-p47
    quote_verified: true
  expected_payoff: アキラが組織の本拠地へ連行される際、組織の思想（敵対的か保護的か）による運命の分岐。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_左腕の回収と義肢の完全性
  note: 奪われた左腕（生身？）がどこにあるか、および治癒シールで再接続可能かどうか。マイクロマシンによる修復限界と、元の世界との接続断絶リスク。
  quotes:
  - quote: 義肢の制御系は肘から上、肩や肩胛骨にまで侵襲しているので、そこが破損していないか少々、いやかなり不安だったのだが、なんとか無事だったらしい。
    paragraph: p100
    quote_verified: true
  - quote: カインに説明を試みた。倒した人狼の口に左腕の断端を沿え、苦痛に呻くような素振りをする。その後、存在しない左腕を持って軽く走り去ろうとする。これだけで伝わるだろうか？
    paragraph: p107
    quote_verified: true
  expected_payoff: カインがアキラの意図を理解し、人狼の討伐を通じて左腕（またはその残骸）を回収する展開。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_言語習得の限界とサポート放棄
  note: 「元世界のサポートを半ば以上放棄している」という記述は、システム的な支援（翻訳等）が停止・制限されていることを示唆。言語バリアの克服が物語進行の鍵となる。
  quotes:
  - quote: この世界の言語を習得することも視野に入れておいた方がいい。元世界のサポートを半ば以上放棄している現在、言語を脳内にインストールしてはい解決、ということにはならないだろうからだ。
    paragraph: p83
    quote_verified: true
  expected_payoff: カインによる教育が進むにつれ、抽象概念の疎通が叶い、アキラが組織との交渉や戦闘指揮を執る能力を獲得するプロセス。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
