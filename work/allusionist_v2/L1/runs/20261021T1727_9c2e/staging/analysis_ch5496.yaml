- kind: mystery
  name: MY_hagles_identity
  note: ライラが「ハグレス」と呼ぶ存在の正体と、それがマロゾロンド/レメスに寄生する具体的なメカニズム。ソルダとの対立構造の全貌。
  quotes:
  - quote: 私はこの『元槍神』を便宜上『ハグレス』と呼んでいます。神話時代、紀元神群内部での権力闘争に敗れた巨人や邪神...を蔑むためにある呪いの名です。
    paragraph: p217
    quote_verified: false
  - quote: 中央の大神院と辺境の松明の騎士団が鬩ぎ合いを続けるように、この地では勝者たるソルダと敗者たるハグレスが上位の次元で存在闘争を繰り広げています。
    paragraph: p229
    quote_verified: false
  expected_payoff: 第五階層での戦いにおいて、大神院や松明騎士団の内部対立が神話的レベルでの代理戦争であることが明かされ、ソルダへの信頼性が揺らぐ展開。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
