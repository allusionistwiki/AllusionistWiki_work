  weight: 0.6
  quotes:
  - quote: 耳慣れないティリビナの文化の響きが、あるはずもない宇宙の大気を振動させて、世界に少数種族の存在を知らしめようとしていた。
    paragraph: p38
    quote_verified: true
  note: ロードデンドロンの歌が「現代的な電子音」とティリビナの文化を融合させ、宇宙（世界）にその存在を刻印しようとする行為は、文化による帝国主義的拡張のメタファー。
  proposed_by:
