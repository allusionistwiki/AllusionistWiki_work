entities:
- canonical_target: '[[E_char_レルプレア]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5585_レルプレア_confesses_罪_p10
        quote: 'それは女神レルプレアの過去。

          彼女が願った、ティリビナ人たちの始まりであり。

          同時に、土の下に埋めた罪の告白でもある。'
        locator: {}
        spoiler_after: ch5585
      - event_ref: E_ch5585_レルプレア_confesses_虐殺の事実_p20
        quote: 『かつて同胞であったはずの隠花族を含めて、無慈悲に虐殺した。この業は消えない。きっと私が同胞たちを止めていれば、ここまで憎悪が深まることはなかった』
        locator: {}
        spoiler_after: ch5585
      - event_ref: E_ch5585_レルプレア_confesses_魔王への成り果て_p26
        quote: 『魔王との戦いは凄惨だった。私の心までもが暗く染まっていくような絶望の日々。私はいつしか、敵対する闇の陣営にとっての魔王と成り果てていた。どう言い訳したところで、私がキノコ人たちを老人から赤子に至るまで惨たらしく殺した事実は変わらない。私は同胞たちがキノコ人を収容所に押し込むのを止めなかった。私の子供たちも、魔王やキノコ人によって同じ目に遭わされたから』
        locator: {}
        spoiler_after: ch5585
      - event_ref: E_ch5585_レルプレア_promises_赦しと愛_p31
        quote: 『でも、これではだめ。きっとこのままでは憎悪の連鎖は終わらない。赦し、愛することでしか理想の未来を描くことはできないのだから』
        locator: {}
        spoiler_after: ch5585
    action:
      observations:
      - event_ref: E_ch5585_レルプレア_makes_共存の祈り_p44
        quote: 『顕花だとか隠花だとか、そんな区別や憎しみを捨てて、手を取り合える日がきっと来る。だからこれは共存の祈り。いつか私たちのうろが、闇に住まう友人たちを抱きしめられますように、って』
        locator: {}
        spoiler_after: ch5585
      - event_ref: E_ch5585_レルプレア_transforms_ティリビナ人_p52
        quote: 最後に、ほんの個人的な願望を滲ませながら、女神はひとつの種族を再構成してのけた。歴史や現実、認識や摂理すら塗り替えて、優しい幻想で希望を示したのだ。
        locator: {}
        spoiler_after: ch5585
  first_appearance_candidate: true
- canonical_target: '[[E_char_ロードデンドロン]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5585_ロードデンドロン_confesses_身体への怨嗟_p106
        quote: 「崇高な理想、余計なお世話、身勝手な期待、お人形扱い！　私が蔑まれる樹皮の肌をいつ望んだ？！　化け物と呼ばれるこんな身体を！　私だって、水晶テレビに堂々と映れる身体であったなら！　なめらかな素肌！　霊長類型の容姿！　迫害されない外見！　人間としての資格！　もううんざりなんだよ！」
        locator: {}
        spoiler_after: ch5585
      - event_ref: E_ch5585_ロードデンドロン_other_同化_p127
        quote: 「同化などしてたまるか。私は決してお前にはならない」
        locator: {}
        spoiler_after: ch5585
      - event_ref: E_ch5585_ロードデンドロン_names_緑天主_p142
        quote: 「神だからどうした。いつまでも上から見下ろせると思うな。思い通りにはさせない。私はいまここで、緑天主（レルプレア）を超えて、ロードデンドロン（緑天主）になる！」
        locator: {}
        spoiler_after: ch5585
      - event_ref: E_ch5585_ロードデンドロン_other_身勝手な優しさ_p80
        quote: 「高みからの身勝手な『優しさ』などで、誰が救える！」
        locator: {}
        spoiler_after: ch5585
      - event_ref: E_ch5585_ロードデンドロン_defines_排除と差別_p91
        quote: 「誰もが容姿の差異を忌避し、誰もが多数から外れた醜さを嫌悪する！　チッセ、貴様が言った通り、排除と差別は生物の本能に根差した至極当然の警戒心だ！　『敵を倒す』『危険かもしれないから攻撃する』ことに理由はいらない！　ためらっている間に敵が牙を剥けば、こちらが死んでいることだってあり得るからだ！」
        locator: {}
        spoiler_after: ch5585
    relationship:
      observations:
      - event_ref: E_ch5585_ロードデンドロン_hates_自分自身_p112
        quote: 'ティリビナ人の現状を憎むということは。

          ティリビナ人である自分すら愛せないということなのかもしれなかった。'
        locator: {}
        spoiler_after: ch5585
    action:
      observations:
      - event_ref: E_ch5585_ロードデンドロン_activates_浄界_p140
        quote: '腹の底から出たそれは、呪いであり未来に対する宣戦布告だ。

          融血呪が沸騰する。

          灼熱の怒りが、クロウサーの青い血を加熱しているのだ。'
        locator: {}
        spoiler_after: ch5585
      - event_ref: E_ch5585_ロードデンドロン_fights_チッセ_p152
        quote: チッセと同じ位階に上り詰めたロードデンドロンが、存在全てを賭けて咆哮した。
        locator: {}
        spoiler_after: ch5585
    visual:
      observations:
      - event_ref: E_ch5585_ロードデンドロン_transforms_巨人_p151
        quote: '術者の存在が膨張し、拡大し、内宇宙と外宇宙が照応しながら爆発する。

          それは新たな星の輝き。

          頂きの座に手を届かせた者の魂が、存在の外殻から溢れ出す。

          物質的な制約から解き放たれ、その精神は飛躍し、どこまでも拡張されていく。

          それは存在の巨大化。

          呪術の奥義たる浄界の先にある地平。

          その階梯に至った呪術師を、巨人と呼ぶ。'
        locator: {}
        spoiler_after: ch5585
  first_appearance_candidate: true
