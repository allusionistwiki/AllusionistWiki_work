        quote: '見た目の違い。一面的な美醜。理性や道徳という前提を無視した反射的な本能の肯定。野蛮で攻撃的な発想。

          いずれも、リーナの世界には存在しない価値観だ。'
        locator: {}
        spoiler_after: ch5585
  first_appearance_candidate: true
