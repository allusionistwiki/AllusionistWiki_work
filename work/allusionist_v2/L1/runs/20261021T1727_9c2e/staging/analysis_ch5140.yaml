- kind: theme
  theme: 言葉の暴力と自己防衛：「変態」という言葉の裏にある恐怖
  weight: 0.5
  quotes:
  - quote: '「変態」


      「違います！　怪我の様子を見るために――」


      「分かってる。でも見たのは事実」'
    paragraph: p161-165
    quote_verified: true
  - quote: '理不尽な暴力に晒されているような――あの単眼巨人を目の前にした時のような、恐れの表情。


      ハルベルトは傷付いていた――私の言葉で、傷つけられていたのだ。'
    paragraph: p209-210
    quote_verified: true
  note: ハルベルトの身体的特徴（血管の紋様）に対する羞恥心が、「変態」という攻撃的な言葉と「恐れ」に直結しており、彼女の防衛機制が描かれている。
  proposed_by:
    kind: agent
