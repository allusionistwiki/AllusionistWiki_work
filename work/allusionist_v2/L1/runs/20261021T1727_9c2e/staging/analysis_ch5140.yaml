- kind: theme
  theme: 信頼の相互性：守られる側から守る側への意識変容
  weight: 0.6
  quotes:
  - quote: 「あのね。私がお師様を信じる理由も、ミルーニャと同じ。お師様は、何度も私の事を助けてくれた。だから私も、お師様を信じる」
    paragraph: p146
    quote_verified: true
  - quote: '「お師様なら大丈夫」


      私の中には揺るぎない信頼が生まれていた。変な話だけど、あんなふうに命を投げ出して瀕死に陥った彼女だからこそ――命のかかった場面で間違うことはないだろうと思えたのだ。'
    paragraph: p119-121
    quote_verified: true
