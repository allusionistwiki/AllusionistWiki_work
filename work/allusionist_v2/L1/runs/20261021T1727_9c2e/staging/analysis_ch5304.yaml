  quotes:
  - quote: たったひとり残った仲間、一番最初に共に戦うと約束してくれた狩人が言います。あなただけでも、助けてみせると。
    paragraph: p44
    quote_verified: true
  - quote: 氷でできた弓矢と、時計を持ったハエと、大切な人の魂が砕け散ると、全ては無かったことになっていきます。
