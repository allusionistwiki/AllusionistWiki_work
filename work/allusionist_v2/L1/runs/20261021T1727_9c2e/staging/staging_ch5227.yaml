- canonical_target: '[[E_motif_センジュ]]'
  entity_type: motif
  aspects:
    action:
      observations:
      - event_ref: E_ch5227_センジュ_kills_魔将クエスドレム_p107
        quote: '「チェェェェェェェェェェストォォォッ！！」

          硬い音。

          鞘が、地上に落下したのだ。

          そして、左右二つに分かれた胴体も。

          ただの一撃で、魔将クエスドレムは両断されていた。'
        locator: {}
        spoiler_after: ch5227
      - event_ref: E_ch5227_センジュ_bonds_ユガーシャ・ランディバイス_p131
        quote: '「力尽き、死にかけていた俺たちを拾い上げてくれたご恩は忘れていません。俺の忠義は貴方に捧げるためのものだ。もう誰にも遅れはとりません」

          センジュは膝を付き、ユガーシャの前で臣下の礼をとった。'
        locator: {}
        spoiler_after: ch5227
      - event_ref: E_ch5227_センジュ_uses_鞘_p54
        quote: 'その手に握られているのは、反りのある片刃の長剣。

          だが、漆黒の刃を受け止めるのは鞘。'
        locator: {}
        spoiler_after: ch5227
      - event_ref: E_ch5227_センジュ_fights_クエスドレム_p80
        quote: 'センジュは喧しく喋り倒す刀をじろりと睨み付けて、倒すべき敵を見据えた。

          気迫が膨れあがり、険しく皺が寄せられていく顔は獰猛な獣じみたものに変化していく。鋭い眼光が重さを持って魔将を貫いた。'
        locator: {}
        spoiler_after: ch5227
      - event_ref: E_ch5227_センジュ_other_鞘_p85
        quote: '「ごちゃごちゃした手数だの、こまけえまじないだの、くっだらねえな。全部まとめて、叩き斬ってやらあ」

          鞘を空高く放り投げる。くるくると回転しながら天へと昇る鞘。

          その術理の理念とは、手数ではなく一撃がすべて。'
        locator: {}
        spoiler_after: ch5227
    speech:
      observations:
      - event_ref: E_ch5227_センジュ_other_デザイナーズチャイルドの出自_p118
        quote: '「見事です、センジュ。相変わらず信じがたい身体能力ですね」

          「遺伝子操作されてますから――人権とか自己同一性の保持がどうたらで、俺みたいなデザイナーズチャイルドは転生の時、遺伝子情報をそのまんま再構成されるんです。そうしないと別人が生まれちまいますからね」'
        locator: {}
        spoiler_after: ch5227
      - event_ref: E_ch5227_センジュ_hates_サイバーカラテ_p178
        quote: '「ええ。ありましたよ。あの馬鹿げた代物がね」

          不機嫌さと嫌悪を剥き出しにしてセンジュは吐き捨てた。'
        locator: {}
        spoiler_after: ch5227
      - event_ref: E_ch5227_センジュ_other_サイバーカラテ_p192
        quote: '「オカルトですよ、あんなもん」

          と、奇妙な批判の仕方をした。

          「最適解？ そんなもんは存在しない。ごちゃごちゃと技だの手数だのばっか増やすのは阿呆のやることだ。サイバーカラテなんてのは武術とは呼べない。誰が広めやがったのか知らないですがね、そいつを見つけたらぶった斬ってやりますよ」'
        locator: {}
        spoiler_after: ch5227
      - event_ref: E_ch5227_センジュ_says_うんざりしたぼやき_p48
        quote: '「待ちくたびれましたよ、全く」

          最後の一人となった黒いクエスドレムの相手をさせられていた青年――まだ、どこか少年の面影を残す若者は心底からうんざりした口調でぼやいた。'
        locator: {}
        spoiler_after: ch5227
      - event_ref: E_ch5227_センジュ_says_システム起動の呪文_p58
        quote: '「異世界における文明段階超過域オプションの執行許可――申請完了。受理がおせえよ、ったく――【幾断】、抜刀」

          毒を吐きながら、鞘から刃を抜き放つ。'
        locator: {}
        spoiler_after: ch5227
    symbolic:
      observations:
      - event_ref: E_ch5227_センジュ_defines_千手であり閃樹_p89
        quote: '千手の攻め手を一つに束ねるその様は、枝葉を伸ばす武芸の系統樹を閃光と化して解き放つかのよう。

          ゆえに千手であり閃樹。いずれの意味にも通じるが、それらを貫く一振りの刃。'
        locator: {}
        spoiler_after: ch5227
  first_appearance_candidate: true
