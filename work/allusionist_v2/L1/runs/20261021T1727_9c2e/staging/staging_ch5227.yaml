- canonical_target: '[[E_char_彼]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5227_彼_observes_戦いの光景_p13
        quote: 『彼』は竪琴を奏でながら、戦いの光景を見て満足げに頷く。
        locator: {}
        spoiler_after: ch5227
    speech:
      observations:
      - event_ref: E_ch5227_彼_thinks_窮地の追加_p16
        quote: あとは手に汗握る窮地が欲しい。さてどうしようか。
        locator: {}
        spoiler_after: ch5227
  first_appearance_candidate: true
- canonical_target: '[[E_term_ブシドー]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5227_ブシドー_defines_異形の戦士たち_p134
        quote: 'ブシドー。

          それは、異世界で生まれた異形の戦士たち。

          生誕する前から遺伝子を操作され、あらゆる能力を強化された生まれついての戦闘種族。その踏み込みは大地を割り、その一刀は鋼を両断する。'
        locator: {}
        spoiler_after: ch5227
  first_appearance_candidate: true
- canonical_target: '[[E_char_ユガーシャ・ランディバイス]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5227_ユガーシャ・ランディバイス_teaches_国家への忠義_p136
        quote: 「いい心構えです。ですが、その忠義は私個人ではなく、国家の安寧と秩序に捧げなさい。我ら【憂国士戦線】はその為にある」
        locator: {}
        spoiler_after: ch5227
      - event_ref: E_ch5227_ユガーシャ・ランディバイス_says_護国の義務と敵国への対抗_p143
        quote: 「我々は護国の爪牙。忌まわしき怨敵、人類を脅かす侵略者たちから罪無き人々を守る義務があるのです。知っての通り、敵国ジャッフハリムは我らが同胞を言葉巧みにそそのかし、地上に反旗を翻させました。これこそが卑劣なるジャッフハリム人のやり口なのです」
        locator: {}
        spoiler_after: ch5227
      - event_ref: E_ch5227_ユガーシャ・ランディバイス_other_探索者たち_p148
        quote: 「――ですがそれらの卑劣は、彼らにも守るべき国家、守るべき家、守るべき大地があるがゆえに起きてしまう悲劇。ああ、何と嘆かわしいことか。ですが勇士たちよ、躊躇ってはなりません。迷ってはいけません。貴方たちの背後にもまた、守るべき民が、郷土が、我らの誇るべき世界があるのですから」
        locator: {}
        spoiler_after: ch5227
      - event_ref: E_ch5227_ユガーシャ・ランディバイス_other_サイバーカラテ_p218
        quote: 「武術ではなくとも――呪術ではあるのかもしれません」
        locator: {}
        spoiler_after: ch5227
      - event_ref: E_ch5227_ユガーシャ・ランディバイス_says_センジュへの呼びかけ_p46
        quote: '四英雄の一人【吟遊詩人（ミンストレル）】は、戦いのあっけない幕切れに溜息を吐くと、ゆっくりと視線を巡らせて、それからよく通る声で呼びかけた。

          「センジュ。もう終わらせていいですよ」'
        locator: {}
        spoiler_after: ch5227
    action:
      observations:
      - event_ref: E_ch5227_ユガーシャ・ランディバイス_other_憂国士戦線_p141
        quote: '九人で構成される分隊が十あまり。

          『本隊』が合流すればその数は更に十倍以上に膨れあがる。

          【憂国士戦線】こそは国内最大規模の探索者集団である。'
        locator: {}
        spoiler_after: ch5227
    symbolic:
      observations:
      - event_ref: E_ch5227_ユガーシャ・ランディバイス_appears_as_本物のリーダー_p157
        quote: ユガーシャの声は切々と情動に訴えかける。その声といい表情と言いどこまでも『本物』にしか見えない――本気に見える以上、それは本気なのだ。
        locator: {}
        spoiler_after: ch5227
    name:
      observations:
      - event_ref: E_ch5227_ユガーシャ・ランディバイス_names_吟遊詩人ミンストレル_p40
        quote: '艶やかな青い長髪が頬に垂れ、切れ長の目が、彫像のような顔立ちが、勝利の余韻よりも物語が終わる詠嘆を想って揺れた。

          絶世の美女――そう見紛うほどの美男子。

          両性的な色香を有した男の名は、ユガーシャ・ランディバイス。'
        locator: {}
        spoiler_after: ch5227
  first_appearance_candidate: true
- canonical_target: '[[E_org_探索者集団]]'
  entity_type: organization
  aspects:
    action:
      observations:
      - event_ref: E_ch5227_探索者集団_stops_止めを刺す行為_p18
        quote: そんなことを考えていたのかどうかはともかく、戦いは不自然な膠着状態に陥っていた。探索者集団が圧倒的有利にも関わらず、誰も止めを刺そうとしない。
        locator: {}
        spoiler_after: ch5227
      - event_ref: E_ch5227_探索者集団_defeats_朱色の貨幣の呪術_p6
        quote: 資本主義ミームを操作し、朱色の貨幣にてありとあらゆる『夢』を支配する万能の呪術を、探索者の集団は統制のとれた動きで凌ぎ続けている。
        locator: {}
        spoiler_after: ch5227
      - event_ref: E_ch5227_探索者集団_other_致命の一撃_p8
        quote: 無傷とは行かないが、互いに不足を補い合い、致命の一撃を協力して打ち破り続けているのだ。
        locator: {}
        spoiler_after: ch5227
  first_appearance_candidate: true
- canonical_target: '[[E_term_サイバーカラテ]]'
  entity_type: terminology
  aspects:
    action:
      observations:
      - event_ref: E_ch5227_サイバーカラテ_functions_as_自己改良・最適化体系_p185
        quote: 'サイバーカラテはユーザーの戦闘経験をフィードバックし、それらを反映してより効率的な戦術を構築し続ける自己改良・最適化をし続ける体系である。

          集合知に基づいた最適解の武術（ヒューリスティクス）。

          最も尤もらしい仮説を導き出す為の推論（アブダクション）。'
        locator: {}
        spoiler_after: ch5227
  first_appearance_candidate: true
- canonical_target: '[[E_char_探索者たち]]'
  entity_type: character
  aspects:
    relationship:
      observations:
      - event_ref: E_ch5227_探索者たち_trusts_主_p19
        quote: そのように命じられているのだとしても、命がかかった場面で理不尽な指示を受け入れ続ける探索者たちはどれほどの信頼を主に向けているのだろうか。
        locator: {}
        spoiler_after: ch5227
    speech:
      observations:
      - event_ref: E_ch5227_探索者たち_other_義憤と正義_p30
        quote: '義憤と正義とが戦士たちの瞳に宿る。

          守るべき者、か弱き者を得て、探索者たちが奮い立った。'
        locator: {}
        spoiler_after: ch5227
    action:
      observations:
      - event_ref: E_ch5227_探索者たち_kills_魔将の命_p32
        quote: 目に見えて動きが良くなった探索者たちは人質が傷つけられるよりも前に、風のような素早さで魔将の命を刈り取っていた。
        locator: {}
        spoiler_after: ch5227
  first_appearance_candidate: true
- canonical_target: '[[E_char_クエスドレム]]'
  entity_type: character
  aspects:
    name:
      observations:
      - event_ref: E_ch5227_クエスドレム_names_呪術商人_p2
        quote: 菱形の貨幣を弄び、呪術商人としてありとあらゆる呪術を売買する呪術師。
        locator: {}
        spoiler_after: ch5227
    action:
      observations:
      - event_ref: E_ch5227_クエスドレム_captures_子供_p23
        quote: 追い詰められたクエスドレムは子供を捕まえると、人質にして取引を持ちかける。契約と交渉の呪文が状況を支配した。
        locator: {}
        spoiler_after: ch5227
      - event_ref: E_ch5227_クエスドレム_has_property_摸倣子買い占め能力_p3
        quote: 空間に満ちる摸倣子を『買い占める』ことで、他者の呪術使用を妨害しつつ絶大な力を振るう極めて厄介な能力。
        locator: {}
        spoiler_after: ch5227
      - event_ref: E_ch5227_クエスドレム_fights_探索者集団_p5
        quote: だが、王としての圧倒的経済力で敵対者を圧殺するクエスドレムの物量攻撃は敵対者には通用していなかった。
        locator: {}
        spoiler_after: ch5227
    speech:
      observations:
      - event_ref: E_ch5227_クエスドレム_dies_朱の王_p34
        quote: '「ありえぬ、この朱の王、最強のクエスドレムが、このような――」

          四つに分岐した平行存在たるクエスドレムの一人は、弄ばれ続けていたという事実に気付くことすら出来ず、ただ無惨に蹂躙され、殺戮された。'
        locator: {}
        spoiler_after: ch5227
  first_appearance_candidate: true
- canonical_target: '[[E_term_武術]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5227_武術_defines_世界観・信仰_p202
        quote: '武術とは体系だ。センジュはそう確信を述べる。

          一貫した思想と哲学に基づいて心技体を鍛え上げていく、一つの世界観、宇宙観とも言うべき実践の学術であり信仰でもある。'
        locator: {}
        spoiler_after: ch5227
  first_appearance_candidate: true
- canonical_target: '[[E_char_小さな子供]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5227_小さな子供_appears_戦場_p21
        quote: と、都合良くその場に小さな子供が現れる。
        locator: {}
        spoiler_after: ch5227
  first_appearance_candidate: true
- canonical_target: '[[E_term_第四階層]]'
  entity_type: terminology
  aspects:
    action:
      observations:
      - event_ref: E_ch5227_第四階層_is_located_人が人を殺す戦場_p227
        quote: 第四階層では、そしてその場所の掌握者たる守護の九槍第七位が支配する戦場では、人が人を殺すのだ。それは以前から、何も変わらずに。
        locator: {}
        spoiler_after: ch5227
  first_appearance_candidate: true
- canonical_target: '[[E_org_修道騎士の部隊]]'
  entity_type: organization
  aspects:
    action:
      observations:
      - event_ref: E_ch5227_修道騎士の部隊_fights_同族_p231
        quote: '銀色の装甲に身を包んだ修道騎士の部隊が、交戦状態にあった。

          戦っているのは、同じ修道騎士の部隊である。'
        locator: {}
        spoiler_after: ch5227
  first_appearance_candidate: true
- canonical_target: '[[E_char_男守護の九槍第七位]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5227_男守護の九槍第七位_appears_部隊の中心_p249
        quote: 'いつの間にそこにいたのだろう。

          誰も気づけなかった。

          圧倒的な存在感を誇る巨体。黒い僧服がはち切れんばかりの太い腕。巌の如き体躯の上に、黒い肌の頭部が乗っている。'
        locator: {}
        spoiler_after: ch5227
    speech:
      observations:
      - event_ref: E_ch5227_男守護の九槍第七位_names_レイシズム変数ヴァリアブル_p259
        quote: '「【レイシズム変数（ヴァリアブル）】――代入・『われわれ』ジャッフハリム正規軍の職分を不当に奪い荒らしていく『かれら』探索者の無法者共」

          不可解な呟き。

          直後、ジャッフハリムを守る為に結成された混成軍は、互いに罵り合い、侮蔑を口にして、敵意を剥き出しにしながら仲間同士で相争う。'
        locator: {}
        spoiler_after: ch5227
      - event_ref: E_ch5227_男守護の九槍第七位_defines_人間の本性_p265
        quote: 「人間の本性とは、実に典型的な振る舞いに表れます。器質的傾向、社会的傾向、歴史的傾向、そして心的傾向――任意の社会的関係性が任意の差異を参照し、自他の世界観を規定する。人が人を排除し序列化する思考とは極めて類型的です。だからこそパターンを掴む事で技術として体系化が可能。このように」
        locator: {}
        spoiler_after: ch5227
      - event_ref: E_ch5227_男守護の九槍第七位_says_無意味な殺し合いへの要求_p295
        quote: 「憎め、唾を吐け、蔑め、見下せ、嗤え、優れた自己と『われわれ』を確信するがいい。そして死ね。無意味に殺し合って命を散らせ。そのありふれた死、古代より蔓延し続けてきた憎悪と絶望こそ我が糧――糧、糧、か？」
        locator: {}
        spoiler_after: ch5227
      - event_ref: E_ch5227_男守護の九槍第七位_confesses_殺す理由の不在_p300
        quote: '「何も感じぬ。というかどうでも良いな。特に殺し合わせる意味は無かった。別に必要というわけでもない」

          「だが殺す。特に意味は無いが殺す。生きている限り殺す。私の部下になった地上人類は皆殺しにする。なぜならば、それが主の望みであるからだ。それが教義であり正義であり大義であるからだ。私はその手助けをしているに過ぎぬ」'
        locator: {}
        spoiler_after: ch5227
      - event_ref: E_ch5227_男守護の九槍第七位_defines_人というものの定義_p316
        quote: '「機械のように憎しみ合い、自動的に排除し合い、反射的に優劣をつけて他者を踏みつけろ。それが、『人』というものなのだから」

          陰鬱な呟きが、第四階層に響いた。'
        locator: {}
        spoiler_after: ch5227
    action:
      observations:
      - event_ref: E_ch5227_男守護の九槍第七位_kills_自軍_p285
        quote: '今日もまた、彼は自軍を全滅させた。

          抗戦虚しく、一人生き恥を晒して生き残ってしまった、なんとお詫びをすれば――などと自動生成メールが報告書を作成していく。

