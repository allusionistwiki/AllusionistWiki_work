entities:
- canonical_target: '[[E_char_カーイン]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5512_カーイン_names_楽園の抱擁_p113
        quote: 「とはいえカーくんの撤退はかなりいい感じだったよね～。実はこっそり助けようと思ってたんだけど、あの状況を自力で切り抜けるのはちょっとびっくり。おにーさん後輩の成長に思わず涙。キミいつの間に『楽園の抱擁（レストロオセ）』なんて覚えたの？」
        locator: {}
        spoiler_after: ch5512
      - event_ref: E_ch5512_カーイン_names_聖妃様_p119
        quote: 「聖妃様から直々にご教授頂きました。私は他の呪術基盤は上手く扱えませんが、これには適性があったようで」
        locator: {}
        spoiler_after: ch5512
      - event_ref: E_ch5512_カーイン_names_不屈ガッツ_p133
        quote: 「シナモリアキラは『土俵際の粘り』、冬の魔女は『不屈（ガッツ）』と呼んでいました」
        locator: {}
        spoiler_after: ch5512
      - event_ref: E_ch5512_カーイン_says_少年の殺害_p159
        quote: 「誤解などない。彼女が見た通り、私は彼女がよく知る少年を殺した。『ある意味で』『見方によっては』『殺したようなもの』『自罰的になって責任を背負い込んでいる』などと呪文を弄する余地のない殺害だ。紀命点を突いて生命活動を終わらせた」
        locator: {}
        spoiler_after: ch5512
      - event_ref: E_ch5512_カーイン_says_過去を奪った_p166
        quote: 「そんなものは無い。誰もカーインの過去を遡ることなどできない。あの日、私が全てを奪ったのだから」
        locator: {}
        spoiler_after: ch5512
      - event_ref: E_ch5512_カーイン_has_property_隠蔽の呪詛_p170
        quote: 'カーインの言う通り、ユディーアが読み取った過去は決定的な瞬間だけだったはずだ。

          前後の断絶。隠蔽の呪詛。夜闇のような見えにくさ。不確かな秘密。

          それは全てカーインという存在と結びついた神秘の性質に由来している。'
        locator: {}
        spoiler_after: ch5512
      - event_ref: E_ch5512_カーイン_names_ハー_p184
        quote: 「カーインの真実を知る者は限られてる。それでも、隠されているからといって無かったことにはならないよ。暗がりを遠ざけてもそれはあるんだ。君が本来ならハー」
        locator: {}
        spoiler_after: ch5512
      - event_ref: E_ch5512_カーイン_says_奪われたと考えたことはない_p193
        quote: 「私は、一度たりとも『奪われた』などと考えたことはない」
        locator: {}
        spoiler_after: ch5512
      - event_ref: E_ch5512_カーイン_names_道化男_p199
        quote: 「『四十四士のカーイン』として正しかったのは、あの薔薇が良く似合う負けず嫌いの道化男だ。ユディーアの怒りは正しい。その名に相応しいのは私などではない」
        locator: {}
        spoiler_after: ch5512
      - event_ref: E_ch5512_カーイン_names_聖妃様暗殺_p212
        quote: 「だから聖妃様暗殺の件。ウォンウォンとかアヌちゃんまでマジギレしてるし、本国に戻ったらカーくん主演のスプラッタ映画始まっちゃうやつ。いやこの状況踏まえれば解説の必要は特にないし、分かってる奴らはなんとなーく察してるだろうけどね。幾らなんでもこの『死は基本戦術』『墓地は資源』みたいな第五階層の環境、外の常識だとおかしいから」
        locator: {}
        spoiler_after: ch5512
      - event_ref: E_ch5512_カーイン_names_カーくん_p23
        quote: 「うん、おおむね合ってる。さっすがカーくん、呑み込みが早い」
        locator: {}
        spoiler_after: ch5512
      - event_ref: E_ch5512_カーイン_asks_スーリウムに勝てるか_p39
        quote: 「本当に、あの男に勝てると思いますか。ティリビナの呪術を極め、全ての未来と秘密を知り尽くした、未だ底の見えぬスーリウムという怪物に」
        locator: {}
        spoiler_after: ch5512
      - event_ref: E_ch5512_カーイン_names_花のアヴロノ_p58
        quote: そして、今この場にいるカーインは事実として『花のアヴロノ』などではなかった。
        locator: {}
        spoiler_after: ch5512
      - event_ref: E_ch5512_カーイン_names_道化ぐしゃ_p60
        quote: '「『道化（ぐしゃ）』のカーインでは到底及ばぬ相手というわけだ」

          自嘲するような呟きをあえて否定せず、トロメリアは受け流すように応じた。'
        locator: {}
        spoiler_after: ch5512
    action:
      observations:
      - event_ref: E_ch5512_カーイン_has_property_瀕死の状態維持_p135
        quote: '今のカーインは瀕死の状態を維持しつつ、文字通り生死の境を彷徨っている。

          臨死体験中の曖昧な生命が三途の川（コキュートス）を泳ぎつつ左右の岸を見張り、隙あらば奇襲をかけようとしているわけだ。'
        locator: {}
        spoiler_after: ch5512
      - event_ref: E_ch5512_カーイン_flees_その場_p216
        quote: '「私は、その件について語る言葉を持たない。悪いが失礼する。潜伏して機を窺うとしても、その間に準備できることもあるだろう」

          強引に話題を打ち切って、カーインの気配がその場から消えた。'
        locator: {}
        spoiler_after: ch5512
  first_appearance_candidate: true
- canonical_target: '[[E_term_楽園の抱擁]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5512_楽園の抱擁_defines_気合や根性_p125
        quote: 「こんな時に不要な冗談は言いません。『楽園の抱擁』はいわば内世界型の浄界を普遍化した汎用奥義に近い。突き詰めれば、呪術的な技術などなくとも『カーイン』という存在の個我を持続しようと強く念じ続ければできるようになります。つまり気合や根性に近い」
        locator: {}
        spoiler_after: ch5512
  first_appearance_candidate: true
