- kind: mystery
  name: MY_METERIAN_WARNING
  note: メートリアンの「本命の操り人形はあなたです」という言葉の真意。これはルウテトによる直接の指示か、メートリアン自身の自由意志による警告か不明確であり、アマランサスがルウテトにとって最も重要な戦略的駒（シナモリアキラ獲得の鍵）であることを示唆している。
  quotes:
  - quote: 「気を付けて。本命の操り人形はあなたです」
    paragraph: p131
    quote_verified: true
  - quote: '『本命の操り人形はあなたです』と彼女は言った。

      本命の――つまり他にも駒として利用したい操り人形は複数いるけれど、ラクルラールを『詰める』ために必要な最後の鍵、それが私ということ？'
    paragraph: p156-p157
    quote_verified: true
  expected_payoff: ルウテトがアマランサスを「シナモリアキラ」の器として完成させるために、あえて彼女を苦境に立たせ成長させていることが明かされる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_INVERTED_FOREST
  note: 天蓋に逆さまに生えた森と大樹の正体。これが「根源人種浄化」の呪術であり、第五階層の住人を「更新された再生者」として変質させる装置であることが判明する。
  quotes:
  - quote: 'その代わりに空間的な広がりを埋め尽くす夥しい雪が空を覆っていた。

      だがそれは降り注ぐ天候ではない。

      あの雪は、この世界の空にびっしりと貼りつき、根を張っている。'
    paragraph: p323-p325
    quote_verified: true
  - quote: '『根源人種浄化』の呪術だよアキラくん！

      ルウテトは再生者や『死人の森』をそのまま現世に復活させるなんて反動の大きいことは企んでいない。既存の『弱く虐げられた者たち』の信仰基盤を乗っ取って現代風に調整された新しい再生者と更新された『死人の森』をこの地に甦らせるつもりなんだ！'
    paragraph: p341
    quote_verified: true
  expected_payoff: 第五階層の人々が「シナモリアキラ」の一部として統合され、アキラ（主人公）による種族浄化が始まる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
