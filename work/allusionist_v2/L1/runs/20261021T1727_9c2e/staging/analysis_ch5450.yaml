- kind: mystery
  name: MY_MOTHERLY_EVIL
  note: ルウテトの「邪悪さ」が母性の本質そのものであるという論理。彼女が「父も母から生まれた」として権力の循環を説くことで、単なる悪役ではなく「必然的な悪性」として描かれている。
  quotes:
  - quote: '人の営みは父と母と子とが権力を突きつけ合う血腥い闘争。

      ルウテトの乾いた世界は、そんな無慈悲な力学に支配されているのか。'
    paragraph: p295-p296
    quote_verified: true
  - quote: 'それは『役の性質』であると同時に『紀なる本質』ということでもある。

      ルウテト個人と切り離せない宿命的な悪性。'
    paragraph: p283-p284
    quote_verified: true
  expected_payoff: ルウテトとの決着が、単純な善悪の対決ではなく、「支配する母」としての受容とアキラ自身の「父性/主体性」の確立という形で行われる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
