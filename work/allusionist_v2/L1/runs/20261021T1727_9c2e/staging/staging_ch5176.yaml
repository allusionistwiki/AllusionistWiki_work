        quote: 'いつしか歌姫Spearはクロウサー社という強力な足場を手に入れていた。

          原盤の製作、事務所、出版――それら全てを包括するクロウサー社の支援を受けて、歌姫の名声は瞬く間に地上に広がったのだった。'
        locator: {}
        spoiler_after: ch5176
