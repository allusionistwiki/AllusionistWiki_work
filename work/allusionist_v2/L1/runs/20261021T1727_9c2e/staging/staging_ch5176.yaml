entities:
- canonical_target: '[[E_relation_リーナ]]'
  entity_type: relationship
  aspects:
    action:
      observations:
      - event_ref: E_ch5176_リーナ_attacks_ハルベルト睡眠中_p108113
        quote: 'そして見た。寝ているハルベルトの真上に飛び上がり、両足で踏みつけようとしている――というかほとんど跳び蹴りに近かった――リーナ・ゾラ・クロウサーの姿を。

          体重が軽い上に重力が厳密に作用しない空の民がやるからまだ冗談で済む行為だが、下手をすれば大怪我をしかねない危険行為だった。'
        locator: {}
        spoiler_after: ch5176
      - event_ref: E_ch5176_リーナ_other_朝食_p135136
        quote: '着替えが一瞬に済む私だけが一人早めに食堂に向かうと、リーナは一人で朝食を用意していた。

          てきぱきと動いて、調理場から卵焼きと付け合わせの野菜、そしてこんがり焼き上がった空魚の切り身が乗った空の民流の朝食を運んできては並べていく。'
        locator: {}
        spoiler_after: ch5176
      - event_ref: E_ch5176_リーナ_other_アキラの服_p205209
        quote: '「そうなんだ。どれどれ？」

          言いながら、リーナが私の黒衣に下から潜り込んでくる。

          「ちょっ、何っ、やめてっ」'
        locator: {}
        spoiler_after: ch5176
    speech:
      observations:
      - event_ref: E_ch5176_リーナ_confesses_家族事情_p148150
        quote: '「実際の所、うちの母も大概どうしようもなくてさー。覇王メクセトの血を引いた子供さえ生まれれば後はどうでもいいとか言って、あっけなくお父さん捨てるんだもん。正直、見てらんないって思ったよ。」

          少しだけ遠い目をして、リーナは朝食を用意する手を止めた。'
        locator: {}
        spoiler_after: ch5176
      - event_ref: E_ch5176_リーナ_other_アキラ父の仇討ち_p153
        quote: 「お父さんの仇とってくれて、ありがとね。それからお姉ちゃんの事も」
        locator: {}
        spoiler_after: ch5176
      - event_ref: E_ch5176_リーナ_other_末妹選定_p157160
        quote: '「末妹選定の事？　うん、先輩から教えてもらった。てか私も予備候補だったらしいよ。記憶無いけど」

          ミルーニャを星見の塔に誘ったのはリーナだ。関係者であることは明白だった。'
        locator: {}
        spoiler_after: ch5176
      - event_ref: E_ch5176_リーナ_helps_アキラとハルベルト_p169171
        quote: '「ガルズの奴、トライデントって魔女の手下になってるんでしょ？　ハルベルトとアズーリアの競争相手なんだよね。なら私が一緒に戦えば、お父さんの仇を討ってくれたアズーリアへの恩返しになるよね」

          目的が二つも達成できて得だとリーナは笑った。'
        locator: {}
        spoiler_after: ch5176
      - event_ref: E_ch5176_リーナ_observes_アキラの異常_p5359
        quote: '「うわぁ。やばいよ先輩、この人アストラル体がどっか飛んでるよ」

          「ア、アズーリア様が壊れた――」

          「なんか、アズ怖いよ？」'
        locator: {}
        spoiler_after: ch5176
  first_appearance_candidate: true
- canonical_target: '[[E_char_ミルーニャ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5176_ミルーニャ_wounds_リーナ_p114
        quote: 'というかミルーニャは寝起きの悪い目つきのまま上段蹴りを浴びせていた。

          部屋の隅まで吹っ飛んでいったリーナは'
        locator: {}
        spoiler_after: ch5176
      - event_ref: E_ch5176_ミルーニャ_defeats_リーナ_p213
        quote: 叫んでいると、ミルーニャがリーナを引きずり出して思い切り蹴り飛ばす。軽いリーナは空高く舞い上がっていった。もう帰ってこなければいいのに。
        locator: {}
        spoiler_after: ch5176
  first_appearance_candidate: true
- canonical_target: '[[E_term_カタルマリーナ]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5176_カタルマリーナ_functions_as_脅し文句_p12
        quote: 言うことを聞かない子供を脅かす時に、キュトスの姉妹全体の名前を出すのではなくカタルマリーナの名前を出す地方もある。
        locator: {}
        spoiler_after: ch5176
    name:
      observations:
      - event_ref: E_ch5176_カタルマリーナ_is_made_of_キュトスの三女_p8
        quote: その名前は、地上において最も忌み嫌われているキュトスの姉妹――その中で最も恐れられている三女のものだったからだ。
        locator: {}
        spoiler_after: ch5176
  first_appearance_candidate: true
- canonical_target: '[[E_term_空の民]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5176_空の民_has_property_朝の民_p127130
        quote: '「空の民は、夜の民と対比させて朝の民とも言われてますからね。太陽の光を浴びるとやたら元気になるんですよ」

          空の民のイメージといえば青空や太陽、そして雲といったものだ。

          明るく朗らかなのはいいけれど、私とはちょっと相性が悪そうだなあと思った。'
        locator: {}
        spoiler_after: ch5176
  first_appearance_candidate: true
- canonical_target: '[[E_item_カタルマリーナの声]]'
  entity_type: item
  aspects:
    action:
      observations:
      - event_ref: E_ch5176_カタルマリーナの声_wounds_聴者_p13
        quote: そのさえずる声――この世のものとは思えぬ歌を耳にした者は、例外なく宇宙の深淵を覗いたかのごとき恐怖に囚われ、発狂すると言われている。
        locator: {}
        spoiler_after: ch5176
  first_appearance_candidate: true
- canonical_target: '[[E_relation_アキラ]]'
  entity_type: relationship
  aspects:
    speech:
      observations:
      - event_ref: E_ch5176_アキラ_wears_黒衣の下着_p184193
        quote: '「必要なことだから。それに、下に何も着てないわけじゃない」

          「誰も見なくても、私がそういう服を着ているって知ってるでしょう。服は自分の為に着るものだから、それでいいの。それに流行呪力の発生源にもなるし」'
        locator: {}
        spoiler_after: ch5176
      - event_ref: E_ch5176_アキラ_hopes_変態全裸男の衣食住_p196201
        quote: '彼はどこかで生きているというけれど。

          まさか、まだ全裸にマントだけということは――無いよね？

          どうか、彼が服を手に入れていますように。

          私は強く願った。'
        locator: {}
        spoiler_after: ch5176
      - event_ref: E_ch5176_アキラ_other_歌姫カタルマリーナ_p34
        quote: 'けれど、実はそれより前に、歌姫は全く別の名義で活動をしていたことを、私は知っている。

          歌姫カタルマリーナ。'
        locator: {}
        spoiler_after: ch5176
      - event_ref: E_ch5176_アキラ_hopes_明日の脱出_p329341
        quote: 'それが、穏やかだった前夜の事。

          私がまだ、根拠のない希望を抱いて前を向いていた最後の夜。

          なんて――空虚な希望だったのだろう。'
        locator: {}
        spoiler_after: ch5176
      - event_ref: E_ch5176_アキラ_says_歌姫の経歴説明_p4042
        quote: '「――と言うわけ。わかった？」

          「う、うん」

          私の念入りな説明を聞いて、プリエステラは引きつった声で答えた。'
        locator: {}
        spoiler_after: ch5176
      - event_ref: E_ch5176_アキラ_fears_歌姫の初ライブ_p51
        quote: 「そんな彼女の初ライヴが、まさか間近に迫っていたなんて！　どうしよう、私これから外走ってきてもいいかな？！」
        locator: {}
        spoiler_after: ch5176
      - event_ref: E_ch5176_アキラ_promises_ハルベルトの保護_p8991
        quote: '「返り討ちにしてやろうね！　歌姫Spearのステージを邪魔するような屑は死ねばいいよっていうかぶっ殺すよ！　大丈夫、私がハルを守るから」

          ぎゅっとハルベルトの手を両手で握りしめて力強く宣言する。'
        locator: {}
        spoiler_after: ch5176
  first_appearance_candidate: true
