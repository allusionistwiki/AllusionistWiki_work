    visual:
      observations:
      - event_ref: E_ch5176_歌姫Spear_appears_as_ネットアイドル_p24
        quote: '歌姫Spearはネットアイドルだ。

          アストラル界とグラマー界に網目状に広がる情報の流れに乗って運ばれていくネットミーム。'
        locator: {}
        spoiler_after: ch5176
    symbolic:
      observations:
      - event_ref: E_ch5176_歌姫Spear_has_property_不死性_p32
        quote: '世界そのものに焼き付けられた刻印のように、その響きは絶えることなく広がり続けている。

          あるいは、その在り方こそが彼女の『不死』なのかもしれなかった。'
        locator: {}
        spoiler_after: ch5176
  first_appearance_candidate: true
- canonical_target: '[[E_char_ハルベルト]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5176_ハルベルト_thinks_アキラへの照れ_p239245
        quote: '「別に」

          ハルベルトはぷいとそっぽを向いてしまった。

          その表情は窺えない。

          メイファーラがそっと耳打ちしてくる。

          「アズ隊長、多分ですが、ハルさんは照れているものと思われます」'
        locator: {}
        spoiler_after: ch5176
      - event_ref: E_ch5176_ハルベルト_reveals_歌姫の素性_p6163
        quote: '実はPVを加工して半妖精（アヴロノ）の振りをしているのだという事実をハルベルトが明かした事で、ようやくミルーニャとリーナもここにいるのが歌姫Spearだと納得してくれたようだった。

          太陰（イルディアンサ）の王族であること。キュトスの姉妹の予備候補であること。その両耳が、左右非対称であること。'
        locator: {}
        spoiler_after: ch5176
  first_appearance_candidate: true
