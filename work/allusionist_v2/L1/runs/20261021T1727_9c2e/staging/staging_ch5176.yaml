      observations:
      - event_ref: E_ch5176_骨槍_appears_as_体内からの生成_p260262
        quote: '体内の骨が血肉を引き裂きながら胴体の中央へと蠢いて依り合わさって行く。

          そして骨が抜けて柔らかくなった肉体を内部から突き破って出てくる鋭利な穂先。誰も彼を助けることはできなかった。'
        locator: {}
        spoiler_after: ch5176
  first_appearance_candidate: true
- canonical_target: '[[E_char_プリエステラ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5176_プリエステラ_other_月明かりの下_p270282
        quote: 'そう言えば、彼女と出会ったのもこんな月明かりの下だった。

          つい数日前のことなのに、いつの間にかこんな風に一緒に寝泊まりするようになっている。'
        locator: {}
        spoiler_after: ch5176
    speech:
      observations:
      - event_ref: E_ch5176_プリエステラ_confesses_居場所への渇望_p304309
        quote: だから、昨日アズーリアが私たちの関係に名前を付けようって言ったとき、嬉しかったんだ。私も仲間って認めて貰えてるんだなあって」
        locator: {}
        spoiler_after: ch5176
      - event_ref: E_ch5176_プリエステラ_names_チョコレートリリー_p320
        quote: 「【チョコレートリリー】――私もその一員なんだよね。大事な人が、五人も増えた。だから、私もみんなを守るよ。仲間を守る、それが私の生き方だから。」
        locator: {}
        spoiler_after: ch5176
      - event_ref: E_ch5176_プリエステラ_flees_説明の続き_p49
        quote: 「ちょ、ちょっと待って！　わかった、わかったから！　とりあえず今日は寝よう？　ね？　もう遅いよ？」
        locator: {}
        spoiler_after: ch5176
  first_appearance_candidate: true
