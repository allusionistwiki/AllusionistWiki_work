      observations:
      - event_ref: E_ch5216_アストラルエンジン_activates_推進力変換_p240242
        quote: '『霊魂導子の励起状態を確認。アストラルエンジン起動！』

          右翼に刻まれた呪文【思考】と左翼に刻まれた呪文【記憶】がそれぞれの意味を掌握し、超高速で演算を行いながら搭乗者二人の保有呪力を推進力に変換。'
        locator: {}
        spoiler_after: ch5216
  first_appearance_candidate: true
- canonical_target: '[[E_item_カラス機体]]'
  entity_type: item
  aspects:
    action:
      observations:
      - event_ref: E_ch5216_カラス機体_other_マグマ溜り_p258259
        quote: '黒々とした噴煙を切り裂き、水蒸気、火山灰、火山岩などが摩擦して発生する火山雷の中を真下へと飛翔しながら、超高熱、超高圧のマグマ溜りへと突入。

          あらゆる生物が死を免れないその空間を、成し得ぬ盾の模造品によって生存したまま突き抜けていく。'
        locator: {}
        spoiler_after: ch5216
      - event_ref: E_ch5216_カラス機体_uses_プロトプラズマ収束弾_p278281
        quote: '『アルタネイフとクロウサーと智神の盾、その叡智の結晶を受けて死ねっ！　プロトプラズマ収束弾、接射！』

          機体下部の砲身から魔将に向けて直接発射された表意文字。

          絵の如き文字群の中から更に小型の形態素が大量にばらまかれ、それらが瞬時にプラズマ化していく。'
        locator: {}
        spoiler_after: ch5216
  first_appearance_candidate: true
- canonical_target: '[[E_item_雲霞の鎧]]'
  entity_type: item
  aspects:
    action:
      observations:
      - event_ref: E_ch5216_雲霞の鎧_functions_as_テレポート_p297302
        quote: '『模造神滅具、【雲霞の鎧】による摸倣子テレポート。ぶっつけ本番でしたが、上手く行きましたね』

          外側から、その現象は『非実体の二人に実体が追いついた』ように見えた。

          アストラル体のみを安全地帯に飛ばしていた二人は、遠隔操縦で機体を操作。機体と肉体を瞬時に分解し、アルトラル体の下に引き寄せ、再構成したのである。'
        locator: {}
        spoiler_after: ch5216
  first_appearance_candidate: true
- canonical_target: '[[E_item_プロトプラズマ]]'
  entity_type: item
  aspects:
    action:
      observations:
      - event_ref: E_ch5216_プロトプラズマ_transforms_癌細胞_p320323
        quote: '観測基準たる惑星、すなわち世界の心臓にして脳たる中心核に撃ち込まれた原形質（プロトプラズマ）の呪文構造体が一斉に活動を開始。

          それらは複数の状態に分化していき、アストラルのエクトプラズマやミルーニャの万能細胞を再現したネオエクトプラズマとなって浄界の基礎構造に侵入。

          自己増殖、自己分化、自己再生、自己複製を繰り返す最悪の癌細胞が、サジェリミーナの宇宙を浸食していく。'
        locator: {}
        spoiler_after: ch5216
  first_appearance_candidate: true
