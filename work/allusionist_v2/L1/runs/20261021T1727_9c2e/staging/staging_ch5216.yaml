- canonical_target: '[[E_char_リーナ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5216_リーナ_says_加速命令_p13
        quote: 「言理飛翔・十倍加速！」
        locator: {}
        spoiler_after: ch5216
      - event_ref: E_ch5216_リーナ_other_差別発言_p1532
        quote: '『落ちこぼれ』と言われていた。

          【空使い】のくせに。ゾラの血族のくせに。

          ――どうしてお前はそんな耳なのだ。

          ――どうしてそんなにのろまなのか。

          ――所詮はカラスとの『合いの子』か。

          ――箒にまたがっているのがお似合いだ。

          ――ああ、箒で飛ぶ事を馬鹿にしているわけではないぞ？

          ――あれは立派な競技（スポーツ）だからな。

          ――せいぜい制限された速度の中で技術でも競っていればいい。

          ――ええ？ ゾラのくせに生身で箒よりも遅い落ちこぼれがいるだって？'
        locator: {}
        spoiler_after: ch5216
      - event_ref: E_ch5216_リーナ_says_恐怖と叫び_p157
        quote: 『うわああああ無理無理無理もう絶対死ぬ！　っていうか無茶過ぎるよこれええええ！　他の魔将ってここまで無茶な強さじゃないよね多分？！　私らだけ罰ゲーム過ぎるうううう！！』
        locator: {}
        spoiler_after: ch5216
      - event_ref: E_ch5216_リーナ_says_加速命令_p161
        quote: '『わかってるってば！　言理飛翔、三十倍加速！』

          標準速度――極超音速から三十倍に加速する。

          音速の百五十倍。'
        locator: {}
        spoiler_after: ch5216
      - event_ref: E_ch5216_リーナ_says_加速命令_p56
        quote: 「二十倍加速！！」
        locator: {}
        spoiler_after: ch5216
    action:
      observations:
      - event_ref: E_ch5216_リーナ_uses_薬_p2
        quote: 薬をキメた。
        locator: {}
        spoiler_after: ch5216
      - event_ref: E_ch5216_リーナ_other_ミルーニャ_p35
        quote: '心身にかかる負荷は全て無視。

          リーナはすぐそばにいるミルーニャを振り落とさないように最大の注意を傾けて、結界を維持しつつ暗黒の浄界を飛翔する。'
        locator: {}
        spoiler_after: ch5216
    relationship:
      observations:
      - event_ref: E_ch5216_リーナ_other_炎上_p3
        quote: 盛大に炎上し、母親に泣かれ、親戚に馬鹿にされ、ガルズに優しく窘められて以来、もうやるまいと思っていた。
        locator: {}
        spoiler_after: ch5216
  first_appearance_candidate: true
