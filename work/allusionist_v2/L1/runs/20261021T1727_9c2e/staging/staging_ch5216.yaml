- canonical_target: '[[E_char_ミルーニャ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5216_ミルーニャ_uses_黎明稲妻_p138
        quote: '『間抜けっ、左手親指解錠（アンロック）！　【黎明稲妻（トワイライトニング）】っ！』

          爪が弾き飛ばされると同時、【球電（ボールライトニング）】が闇を引き裂いて魔将に直撃。'
        locator: {}
        spoiler_after: ch5216
      - event_ref: E_ch5216_ミルーニャ_uses_ヲルヴォーレの雷火_p251
        quote: '『【ヲルヴォーレの雷火】発射っ！』

          あらゆるものを焼き滅ぼす荷電粒子の砲撃を、繰り返すこと七回。

          成し得ぬ盾による絶対防御を解除しての危険極まりない攻撃。'
        locator: {}
        spoiler_after: ch5216
      - event_ref: E_ch5216_ミルーニャ_uses_模造神滅具_p285288
        quote: 'まず左手小指の【極寒奏鳴曲】と右手小指の【繁茂の粉塵宝玉】を同時に解放し、二つの模造神滅具を惑星の中心核に叩き込んだ。

          それと同時に、成し得ぬ盾の絶対防御を解除したのである。'
        locator: {}
        spoiler_after: ch5216
      - event_ref: E_ch5216_ミルーニャ_other_リーナ_p6
        quote: だが、今はそのミルーニャの許可が下りている。
        locator: {}
        spoiler_after: ch5216
      - event_ref: E_ch5216_ミルーニャ_saves_負傷者_p80
        quote: ミルーニャの霊薬と治癒符、広域守護の巻物（スクロール）が意識を失って大気の結界を維持できなくなった者たちを保護する。
        locator: {}
        spoiler_after: ch5216
    speech:
      observations:
      - event_ref: E_ch5216_ミルーニャ_thinks_球形大地の宇宙観_p261273
        quote: '『は、予想通り！　ふっるい球形大地の宇宙観を内面化してましたね！』

          事前に参照していた魔将の資料と占星術による攻撃方法からその事を看破したミルーニャは、絶え間ない移動でひたすらに世界の中心、すなわち観測者視点での基準となる有人惑星を目指した。

          なぜならば、錬金術という杖の呪術は観測者がいなければ成立できないからだ。'
        locator: {}
        spoiler_after: ch5216
      - event_ref: E_ch5216_ミルーニャ_says_論理の指摘_p307313
        quote: '『その不滅っていうのは、この宇宙限定のことなんでしょう？』

          『なら宇宙全体を殺してしまえばいい。神話の火竜退治になぞらえて、疑似氷血呪によって貴方の呪術発動媒体は封印しました。プロトプラズマ収束弾の本領はここからですよ』'
        locator: {}
        spoiler_after: ch5216
      - event_ref: E_ch5216_ミルーニャ_says_四魔女の資格_p341
        quote: 『いずれ、この世界（ゼオーティア）もこうなります。予測された結末に対して、どうしようもない答えしか用意できなかった私には、はじめから四魔女の資格なんてなかったのかもしれませんね』
        locator: {}
        spoiler_after: ch5216
      - event_ref: E_ch5216_ミルーニャ_says_禁止令_p4
        quote: もちろんミルーニャにも二度とやるなと厳重に注意されていた。
        locator: {}
        spoiler_after: ch5216
  first_appearance_candidate: true
- canonical_target: '[[E_item_成し得ぬ盾]]'
  entity_type: item
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5216_成し得ぬ盾_has_property_絶対防御_p148153
        quote: 'ミルーニャはその伝承を逆に解釈し、『攻撃者と防御者が無事である限り決して砕けぬ盾』、『すなわち盾が無事ならば両者は絶対に傷つく事が無い』という絶対防御を実現した。

          欠点は、効果発動中は敵対者を傷つける事まで出来なくなってしまうこと。'
        locator: {}
        spoiler_after: ch5216
  first_appearance_candidate: true
- canonical_target: '[[E_char_修道騎士]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5216_修道騎士_attacks_サジェリミーナ_p188199
        quote: 'その中の一人、試作型神働装甲一型を身に纏った修道騎士が短杖を手に突撃した。

          すると、その動きに従って杖が巨大化。呪文による質量操作と邪視による事象改変によって巨大な棍棒――否、柱になった質量体を魔将に叩き込む。

          錬金術のメソッドによる対抗呪文【静謐】は対象を原子レベルにまで分解する。

          流体によって構成されたサジェリミーナの全身が解体されていく。'
        locator: {}
        spoiler_after: ch5216
  first_appearance_candidate: true
- canonical_target: '[[E_item_箒]]'
  entity_type: item
  aspects:
    visual:
      observations:
      - event_ref: E_ch5216_箒_transforms_巨大な白いカラス_p230236
        quote: 'アルタネイフの錬金術と、クロウサーの呪文による質量操作の融合。

          箒が流体のように溶けて二人を包み込み、質量を増しながら全く異質な形へと瞬時に変貌していく。

          それは、巨大な白いカラスだった。'
        locator: {}
        spoiler_after: ch5216
  first_appearance_candidate: true
- canonical_target: '[[E_item_アストラルエンジン]]'
  entity_type: item
  aspects:
