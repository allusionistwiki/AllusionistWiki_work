  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5216_ペレケテンヌル_appears_機械天使_p130
        quote: 作り出された次元の裂け目から、全身を破損して自己修復作業中の機械天使が出現する。光学素子が発光して、無茶をさせるなと非難の意思表示。
        locator: {}
