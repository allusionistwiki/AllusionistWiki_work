- canonical_target: '[[E_char_サジェリミーナ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5216_サジェリミーナ_uses_宇宙塵_p100
        quote: サジェリミーナが双頭の蛇が絡まった杖を一振りすると、暗黒の彼方から無数の宇宙塵が殺到する。
        locator: {}
        spoiler_after: ch5216
      - event_ref: E_ch5216_サジェリミーナ_other_軟泥_p109
        quote: 'だが必殺の攻撃を、魔将サジェリミーナは意にも介さない。

          軟泥は水銀の帽子の中に吸い込まれて消えてしまう。'
        locator: {}
        spoiler_after: ch5216
      - event_ref: E_ch5216_サジェリミーナ_wounds_エジーメ血族_p111
        quote: 高密度の呪力を纏った流動する水銀が自在に動き回り、高圧の刃となってエジーメの血族とその使い魔たちを切り刻む。
        locator: {}
        spoiler_after: ch5216
      - event_ref: E_ch5216_サジェリミーナ_uses_占星術_p121125
        quote: '『無駄だよ無駄だ。フィレクティ閣下から直接教えを賜った私の占星術は望むままに惑星の配列すら支配する――このように』

          巨大な暗黒宇宙の中心たるサジェリミーナを観測者として、浄界内部の天球座標が凄まじい勢いで書き換えられていく。

          天体の運行から意味を見出す占星術と己の認識で世界を書き換える邪視とが複合し、サジェリミーナの宇宙では天体は創造主に都合のいい配置に移動していく。'
        locator: {}
        spoiler_after: ch5216
      - event_ref: E_ch5216_サジェリミーナ_transforms_世界_p174180
        quote: 'すると景色が一瞬で切り替わり、そこは暗黒の宇宙ではなく無窮の蒼穹と変幻自在の雲、そして大地が広がる世界となった。

          空間転移――ではない。

          サジェリミーナが世界の座標を書き換えたのだ。'
        locator: {}
        spoiler_after: ch5216
      - event_ref: E_ch5216_サジェリミーナ_other_機能不全_p331335
        quote: 'サジェリミーナは不滅にして絶対の存在だ。

          しかし、不滅であるがゆえに際限なく増大する呪力を消滅させることができない。新陳代謝を忘れた巨大な宇宙の内部で、肥大化した機能の系同士がぶつかり合い、お互いに阻害し合う。

          結果として生まれるのは無限の苦しみと機能不全。'
        locator: {}
        spoiler_after: ch5216
      - event_ref: E_ch5216_サジェリミーナ_kills_空の民_p70
        quote: 地獄における最速と呼ばれた銀霊（クイックシルバー）の魔将は満身創痍の空の民たちを鎌状の刃で次々と斬殺していく。
        locator: {}
        spoiler_after: ch5216
      - event_ref: E_ch5216_サジェリミーナ_uses_創生の闇_p76
        quote: サジェリミーナの浄界、【創生の闇（コロニュービア）】が発動した直後。
        locator: {}
        spoiler_after: ch5216
    name:
      observations:
      - event_ref: E_ch5216_サジェリミーナ_names_スス_p207
        quote: 『私こそは不滅の化身にしてジャッフハリム最大の錬金術師サジェリミーナ・ウィ・サジェミリーナ。ややこしいから愛称でススと呼ぶ者もいるね』
        locator: {}
        spoiler_after: ch5216
      - event_ref: E_ch5216_サジェリミーナ_is_located_第五魔将_p59
        quote: 彼らは重力の偏向を引き起こす特殊な【空圧】を発動させて宇宙空間を疾走する魔将サジェリミーナを牽制し続けていた。
        locator: {}
        spoiler_after: ch5216
    relationship:
      observations:
      - event_ref: E_ch5216_サジェリミーナ_other_ミルーニャ_p82
        quote: だが、それによって彼女はこの場で最も厄介な相手に目を付けられてしまう。
        locator: {}
        spoiler_after: ch5216
  first_appearance_candidate: true
