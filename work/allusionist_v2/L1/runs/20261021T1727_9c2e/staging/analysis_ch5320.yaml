- kind: mystery
  name: MY_LaKulRar_Motive
  note: ラクルラールの目的が不明確であり、主人公たちを「いいように操ろうとしている」とされる。その真意と、星見の塔最大派閥との関係性が今後の展開で明かされる可能性が高い。
  quotes:
  - quote: 目的がよく分からないが、どうも俺たち全員をいいように操ろうとしているのは間違い無い。
    paragraph: p132
    quote_verified: true
  expected_payoff: ラクルラールがトライデントの「細胞」であるというトリシューラの発言と関連付けられ、組織内部での権力闘争や隠された計画（末妹選定への介入）として回収される。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_Trichula_Silence_Mihitoneesse
  note: トリシューラが「ミヒトネッセ」という人物（TSX-8型番）について、感情を露わにして話題を避け、資料のアップロードで済ませようとする。この人物はトリシューラの過去や身体制作に関わる重要なキーパーソンである可能性が高い。
  quotes:
  - quote: 「あーあー聞こえない聞きたくないー！　はい終わり終わりー！　次の話題！」
    paragraph: p259
    quote_verified: true
  - quote: よっぽどこの人物についての話題が嫌らしい。
    paragraph: p261
    quote_verified: true
  expected_payoff: ミヒトネッセがトリシューラの創造主、または彼女の「原形」を損なう改変（魔改造）に関与した張本人として登場し、対立や再会が生じる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_Luteeto_Memory_Gap
  note: ルウテトがノイマン型やDNAコンピュータなどの基礎知識を知らない様子（「のいまん？」「でぃーえぬえー？」）。これは転生による記憶欠落か、あるいは彼女自身の性質に起因する特異な状態である。
  quotes:
  - quote: ルウテトが「のいまん？」と首を傾げている。妙だな。前世がコルセスカなら知っていそうなものだが。
    paragraph: p152
    quote_verified: true
  - quote: 転生したせいで知識が欠落したとかだろうか。
    paragraph: p152
    quote_verified: true
  expected_payoff: ルウテトの「前世＝コルセスカ」という情報の信頼性が揺らぐ、あるいは彼女が意図的に情報を隠蔽していることが判明する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_Future_Defeat_Nature
  note: ルウテト（未来のコルセスカ）が「取り返しのつかない失敗」を回避するために過去に干渉してきたことが示唆されている。その失敗の内容と、現在の行動がそれを本当に回避できるのかどうかが核心となる。
  quotes:
  - quote: ルウテトの存在が示唆するのは、俺たちの未来に待ち受ける決定的な敗北だ。取り返しのつかない失敗。それゆえにルウテトは転生を行った。
    paragraph: p36-p37
    quote_verified: true
  expected_payoff: 「決定的な敗北」が何か（例：主人公の死、世界滅亡、特定のキャラクターの消滅）が明かされ、その因果律との戦いが描かれる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_Rafti_Diltoowa_School_Conflict
  note: ラクルラール（ディルトーワ流）とトリシューラ（魔改造された原形留めない存在）の間の技術的・思想的対立。心を持つ人形 vs 機械/義体 という構図が深掘りされる。
  quotes:
  - quote: バーンステイン流は心の存在を否定するんだけど、ラフディ系統のディルトーワ流は心や意思を人形に込めることを重視するの。アストラル体を兼ね備えた人形っていうのが基本コンセプト
    paragraph: p181
    quote_verified: true
  - quote: ベースとなる素体はラクルラール派だけど、内蔵機械はアーザノエルお姉様やクレアノーズお姉様がもの凄く手を加えたせいで別物なんだって。魔改造っていうか、原形留めてないとかなんとか
    paragraph: p185
    quote_verified: true
  expected_payoff: 「心」の定義や魂の本質に関する哲学的対決、あるいはラクルラールがトリシューラを「歪んだ作品」として破壊・回収しようとする試みとして展開する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
