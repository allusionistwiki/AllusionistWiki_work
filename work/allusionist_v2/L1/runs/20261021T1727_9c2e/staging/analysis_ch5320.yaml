  review_status: unreviewed
- kind: theme
  theme: 人工物としての身体とアイデンティティの不安定さ
  weight: 0.6
  quotes:
  - quote: 現在の俺はトリシューラが作り上げた『アキラくん人形』を全身義体として活動している『テセウスの船型サイボーグ』だが、宙に映し出されているのは『俺たち』――つまり多種多様な姿のシナモリアキラである。
    paragraph: p14
    quote_verified: true
  - quote: 幻肢アプリを起動して一瞬だけ幽体離脱。火花を散らし合っている二人の間に幻の手刀を落として、架空の視線を切断した。
    paragraph: p101
    quote_verified: true
  note: 義体（アキラくん人形）の使用と幻肢アプリによる幽体離脱という技術的展開が、身体が固定された実体ではなく流動的なデータ/情報として存在することを示唆し、「私」の境界を曖昧にする。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
