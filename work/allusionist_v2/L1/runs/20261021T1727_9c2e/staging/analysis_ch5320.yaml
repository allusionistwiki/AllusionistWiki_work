  theme: 英雄譚の娯楽化と自己目的性
  weight: 0.8
  quotes:
  - quote: 英雄物語という娯楽、人助けという享楽、正義の戦いという遊戯。存分に、ツールとしての本懐を果たすのみ。
    paragraph: p6-p7
    quote_verified: true
  - quote: シナモリアキラが誰かを助けるのは徹頭徹尾自分の為だ。
    paragraph: p2
    quote_verified: true
  note: 主人公が正義や利他性を「自己の安寧」のためのツール（遊戯）として開き直ることで、伝統的な英雄物語の道徳的義務を解体し、ゲームプレイヤーとしてのメタ視点（娯楽消費）を肯定する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 転生による因果の循環と自己受容の欠如
  weight: 0.7
  quotes:
  - quote: 受け入れられない事を受け入れない為の過去への干渉――俺たちが過去の再演を行ったように、コルセスカ＝ルウテトも同じ事をしたのだ。
    paragraph: p38
    quote_verified: true
  - quote: だが、今の俺たちは未来の失敗を受け入れることはできない。
    paragraph: p40
