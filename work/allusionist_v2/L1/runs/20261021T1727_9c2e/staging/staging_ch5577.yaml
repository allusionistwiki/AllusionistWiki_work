- canonical_target: '[[E_char_リーナ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5577_リーナ_thinks_疑念_p103
        quote: リーナは内心で、 （あれ？） と思った。
        locator: {}
        spoiler_after: ch5577
      - event_ref: E_ch5577_リーナ_suspects_基準のずらし_p109
        quote: （もしかして、私が一位じゃなかったから、合格の基準をずらした？）
        locator: {}
        spoiler_after: ch5577
      - event_ref: E_ch5577_リーナ_says_聖絶への反対_p153
        quote: 「私もその議題について話したい！ 大事な友達のエストのためでもあるし、私たち呪文の座（チョコレートリリー）が守ってきたティリビナ人との関係を蔑ろにしないために！
          それに今、クロウサー家は槍神教との関係を再構築していく時期だよ。空使いとして、聖絶を主導した槍神教の主張に唯々諾々と従うべきではないと思う！」
        locator: {}
        spoiler_after: ch5577
      - event_ref: E_ch5577_リーナ_other_当惑_p37
        quote: まさか歴史に名前が残っているような偉大な呪術師に勝てるとは思っていなかったため、正直なところ当惑しているというのが本音である。
        locator: {}
        spoiler_after: ch5577
    action:
      observations:
      - event_ref: E_ch5577_リーナ_other_寒気と緊張_p121
        quote: 急に空気が張り詰めたように感じられて、リーナは寒気に身を震わせた。 対面の巨人が、わずかに緊張したように見えたのは気のせいだろうか？
        locator: {}
        spoiler_after: ch5577
      - event_ref: E_ch5577_リーナ_observes_結果_p17
        quote: リーナはぽかんと口を開けて結果を見ていた。
        locator: {}
        spoiler_after: ch5577
      - event_ref: E_ch5577_リーナ_observes_点数と順位_p36
        quote: リーナは改めて自分の点数と順位を確認する。
        locator: {}
        spoiler_after: ch5577
      - event_ref: E_ch5577_リーナ_observes_ロードデンドロンの成績_p75
        quote: リーナは呻きながらティリビナ人の順位と点数を見た。 それから自分の得点を再確認し、しょぼしょぼと項垂れる。
        locator: {}
        spoiler_after: ch5577
    relationship:
      observations:
      - event_ref: E_ch5577_リーナ_other_メッセージ_p147
        quote: 即座に察する。これはクロウサー家に対する挑戦であると同時に、次期当主候補であるリーナへのメッセージでもある。 彼は試しているのだ。リーナがこの言葉にどう反応するかを。
        locator: {}
        spoiler_after: ch5577
      - event_ref: E_ch5577_リーナ_other_ロードデンドロンの能力_p161
        quote: 目を瞠るほどの機転と優れた情報収集能力。 個人としての聡明さもだが、組織としての強みも十分に活かしている。 味方にすると頼もしいが、ライバルとしては恐ろしく手強い相手だ。
        locator: {}
        spoiler_after: ch5577
    symbolic:
      observations:
      - event_ref: E_ch5577_リーナ_has_property_柔軟な発想_p151
        quote: 今回の試練が学力基準と聞いた時は絶望的な気分になったものだが、これならば勝ち筋が見える。今のリーナは、やり方にこだわらない柔軟な発想を持っている。
        locator: {}
        spoiler_after: ch5577
      - event_ref: E_ch5577_リーナ_has_property_学びの機会_p56
        quote: すると三角帽子の女の全身から様々な文字列が引き出された。 『クロウサー家』『ゾラの血族』『地上出身』『空の民』『星見の塔での魔女教育』『家庭教師』『パーシュ式学習塾』『高等教育』『ガレニスの遺産』
        locator: {}
        spoiler_after: ch5577
  first_appearance_candidate: true
- canonical_target: '[[E_char_クラウビューラ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5577_クラウビューラ_other_堂々とした開始_p106
        quote: クラウビューラは当然のように二次試験の開始を告げたし、それが予定通りであったかのように振る舞っている。不自然さはなかった。 だが、その堂々とした言い方がかえって疑念を招く。
        locator: {}
        spoiler_after: ch5577
      - event_ref: E_ch5577_クラウビューラ_other_公平のポーズ_p116
        quote: だがこの状況で堂々と挑戦するロードデンドロンに文句が言えるはずもない。 巨人はわざわざ『公平』を持ち出して譲歩するポーズまで見せているのだ。
        locator: {}
        spoiler_after: ch5577
      - event_ref: E_ch5577_クラウビューラ_other_パーンとマルガリータ_p42
        quote: クラウビューラの巨大な指先がパーンを示し、次にマルガリータを示した。
        locator: {}
        spoiler_after: ch5577
      - event_ref: E_ch5577_クラウビューラ_other_リーナ_p54
        quote: クラウビューラの指先がリーナを示す。
        locator: {}
        spoiler_after: ch5577
      - event_ref: E_ch5577_クラウビューラ_other_困り方_p77
        quote: クラウビューラは困った様子で「ううむ」と唸り、チッセはけらけらと笑っている。試験官がこういう困り方をしているのを見ると心が痛い。
        locator: {}
        spoiler_after: ch5577
      - event_ref: E_ch5577_クラウビューラ_other_ロードデンドロンの視線_p92
        quote: クラウビューラはロードデンドロンの挑むような視線に応じるしかなかった。
        locator: {}
        spoiler_after: ch5577
    relationship:
      observations:
      - event_ref: E_ch5577_クラウビューラ_has_property_外部勢力排除の意図_p112
        quote: 試験官側の思惑としては、外部勢力や反逆者に合格してもらっては困るというのが本音だろう。極端なことを言ってしまえば、リーナが相応の実力を示すまで延々と追加の試験を行い続けたって構わないのだ。
        locator: {}
        spoiler_after: ch5577
    speech:
      observations:
      - event_ref: E_ch5577_クラウビューラ_asks_情報源_p132
        quote: 「どこで、それを？」
        locator: {}
        spoiler_after: ch5577
      - event_ref: E_ch5577_クラウビューラ_says_点数と順位_p14
        quote: 「さて、点数と順位は見ての通りだが、まずは言っておくべきことがある」
        locator: {}
        spoiler_after: ch5577
      - event_ref: E_ch5577_クラウビューラ_says_血の恩恵と不均衡_p20
        quote: 「思いのほか順位が高く驚いたか、リーナよ。だがそれがお前が与えられていたものだ。血の恩恵を自覚せよ。そして世界の不均衡を知れ」
        locator: {}
        spoiler_after: ch5577
      - event_ref: E_ch5577_クラウビューラ_says_クロウサーという権力_p40
        quote: 「積み重ねられた歴史。連綿と受け継がれてきた血より生を受けた者は、望まずともただ存在しているだけで特権を得る。それがクロウサーという権力だ」
        locator: {}
        spoiler_after: ch5577
      - event_ref: E_ch5577_クラウビューラ_says_学力という権力_p46
        quote: 「見よ。これも権力だ。学力という基準であれば、あらゆる出自と属性を問わず横並びの基準でその実力と資格を問うことができる。建前上はな」
        locator: {}
        spoiler_after: ch5577
      - event_ref: E_ch5577_クラウビューラ_says_出題者の権利_p52
        quote: 「見よ。試験における権力構造を。出題者には問題を設定する権利がある」
        locator: {}
        spoiler_after: ch5577
      - event_ref: E_ch5577_クラウビューラ_says_文明圏の格差_p59
        quote: 「文明圏の違い。階層の違い。時代の違い。鈴国圏の者には理解の難しい出題も多かったであろう。古代人にクロウサーが研鑽を続けてきた現代血統術の秘儀などわかるまい。竜神信教の巫女が槍神教の神学論争に通じているはずもない」
        locator: {}
        spoiler_after: ch5577
      - event_ref: E_ch5577_クラウビューラ_says_ティリビナ人の格差_p64
        quote: 「そして、教育という社会基盤すら危ういティリビナ人ならばその格差と断絶は更に大きなものとなる。世界にはかくも絶対的な溝と壁があると知れ、リーナ」
        locator: {}
        spoiler_after: ch5577
      - event_ref: E_ch5577_クラウビューラ_says_説教の失敗_p73
        quote: 「私の想定よりもリーナの点数が低かったことに加えて、ロードデンドロンが優秀だったことで今一つ説得力に乏しい説教になってしまったな」
        locator: {}
        spoiler_after: ch5577
      - event_ref: E_ch5577_クラウビューラ_says_二次試験の開始_p94
        quote: 「では、これより二次試験を行う」
        locator: {}
        spoiler_after: ch5577
      - event_ref: E_ch5577_クラウビューラ_says_二次試験のルール_p99
        quote: 「科目は『呪文』だ。これは我ら試験官との対話形式で行われる面接でもあり、黙したまま行われる知識問題とは異なる資質を問うものだ。ただし、公平を期すため一次試験の成績上位者から呪文戦の議題を決定する権利を認めよう」
        locator: {}
        spoiler_after: ch5577
    symbolic:
      observations:
      - event_ref: E_ch5577_クラウビューラ_has_property_不均衡な権力_p96
        quote: しかし。試験官当人が述べたように、巨人には裁量がある。 あまりにも不均衡な、権力が。
        locator: {}
        spoiler_after: ch5577
  first_appearance_candidate: true
