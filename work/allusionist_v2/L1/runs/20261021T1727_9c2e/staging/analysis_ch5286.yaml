- kind: theme
  theme: 絶対的力への渇望と自己神格化による倫理の破綻
  weight: 0.7
  quotes:
  - quote: この俺を見下ろす事は、たとえ神であろうと許さぬ。故に俺はクロウサーを引きずり降ろし、この世の高みへと上り詰めなくてはならないのだ
    paragraph: p352
    quote_verified: true
  - quote: 弱いことはそれだけで悪だ。己の運命の悲惨、降りかかった理不尽は自力救済によってのみ解消される。加害者には血の復讐を行わなくてはならない。これは義務だ。
    paragraph: p138
    quote_verified: true
  note: パーンの行動原理が「弱者は死」「王への絶対服従」という残酷な論理に貫かれており、それが物語改変の原動力（欲望）となっている。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 劇中劇における「役者」の存在論的不安と観客との境界崩壊
  weight: 0.6
  quotes:
  - quote: たとえ破綻していたとしても、これは確かに劇中劇の繰り返しなんです。だって、そういうことにしておけば、順番に幕を閉じていけばいつかは元の場所にきちんと帰れるでしょう？
    paragraph: p5
    quote_verified: true
  - quote: 俺たちを取り囲む敵がたったこれだけだと、どうして俺は決めてかかっていたのだろうか。『まさかこれ以上増えはしないだろう』などという甘い見通しでは足下を掬われるのは必然というもの。
    paragraph: p22
    quote_verified: true
  note: レオの「幕を閉じれば帰れる」という楽観的な構造認識に対し、主人公（俺）は「劇」の論理が破綻し敵が増殖する現実への恐怖を抱えており、物語の構造そのものが危険な状態にあることを示唆する。
  proposed_by:
    kind: agent
