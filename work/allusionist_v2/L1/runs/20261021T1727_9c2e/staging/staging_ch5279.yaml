- canonical_target: '[[E_char_サイザクタート]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5279_サイザクタート_other_ヴァージル_p16
        quote: そして、自らの三つの頭部を相手にはっきりと見えるように真正面に立った。
        locator: {}
