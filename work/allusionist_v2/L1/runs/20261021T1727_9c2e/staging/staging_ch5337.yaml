- canonical_target: '[[E_char_ちびシューラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5337_ちびシューラ_asks_アキラの役割分担_p127
        quote: '（アキラくん、ラクルラールお姉様の対処は私に任せて。アキラくんはアルマをお願い。足止めでいいから）


          ちびシューラの無音の要請に思考だけで了解の意を返す。もとより、コルセスカの仲間を傷つけるのは本意では無い。'
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_ちびシューラ_other_アルマの聖なる炎_p162
        quote: '（やばい、死者は火葬に弱いんだ！　特にアルマのは『聖なる炎』だから再生者にとっては天敵だよ。早く穢れた呪物とか血とかで治療しないと！）


          ちびシューラの慌てた声。'
        locator: {}
        spoiler_after: ch5337
    visual:
      observations:
      - event_ref: E_ch5337_ちびシューラ_appears_as_塞ぎ込み_p30
        quote: 視界隅のちびシューラもしゅんとなって塞ぎ込んでいる。
        locator: {}
        spoiler_after: ch5337
  first_appearance_candidate: true
- canonical_target: '[[E_char_トリシューラ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5337_トリシューラ_uses_槍銃_p129
        quote: トリシューラは槍と銃とが一体になったかのような武器を構えてラクルラールに穂先と銃口を向けた。俺もまたカプセルを口に放り込んで意識を戦闘モードに切り替える。鋭敏になった感覚がアルマの些細な仕草まで詳細に教えてくれる。斧を握る手に力が込められるのがはっきりとわかった。
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_トリシューラ_defeats_人形たち_p15
        quote: 幸いなことに性能そのものは大した事が無く、トリシューラが制御する戦闘用ドローンや巡槍艦の防衛システムによって蹴散らすことができたが、問題はそれが延々と湧き出してくること。明らかにこちらの消耗だけを狙っていた。
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_トリシューラ_activates_第八断章知識リコグニション_p173
        quote: '「第八断章【知識（リコグニション）】――起動！」


          機械部品の中に保持された【断章】が開き、項（ページ）が露わになる。


          日本語とこの世界の文字が混濁した奇怪な文章が絶えず流動しながら紙面を踊り、可視化された呪力が黒い稲妻となって弾けている。'
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_トリシューラ_uses_紀元槍の端末_p179
        quote: （魔導書の呪力を三叉槍の先端に収束させて撃つ呪文砲撃！　紀元槍の端末であり、【死人の森】という『王国』の権威を宿したこの一撃なら、ラクルラールお姉様の権威を破壊できるはず！）
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_トリシューラ_other_呪文砲撃_p182
        quote: '魔導書が一際強く発光して無数の文字を吐き出していく。螺旋を描いて三叉槍の穂先へと収束していく文字が巨大な呪詛の塊と化した。


          凝縮された呪力は膨れあがり、標的に向かって解放される。'
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_トリシューラ_carries_長大な銃_p84
        quote: トリシューラはそう言って近くに立てかけておいた槍のように長大な銃を担いだ。砕けた外壁から二人で飛び出し、第五階層の硬い地面に着地。即座に【マレブランケ】が駆けつけてくるが、しつこく現れる人形の群に阻まれて近付けない。トリシューラと二人、壊れた艦橋から追撃してくる火球を見上げた。
        locator: {}
        spoiler_after: ch5337
    speech:
      observations:
      - event_ref: E_ch5337_トリシューラ_confesses_謝罪_p23
        quote: 「ごめんね、アキラくん」
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_トリシューラ_confesses_失敗の自認_p28
        quote: 「私、セスカのこと助けられなかった。ガロアンディアンの女王として、この事態を防がなきゃ駄目だったのに。第五階層、いっぱいとられちゃったよ」
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_トリシューラ_confesses_ファルファレロ暴走止められず_p33
        quote: 「中傷者（ファルファレロ）の暴走だって止められなかったし、女王として失格だよね。ごめん、こんな駄目な主人で」
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_トリシューラ_fears_器の軽さ判定_p52
        quote: これはあくまでも内乱であり、トリシューラが独力で鎮圧できなければ『その程度の器』と見なされてしまうだけだ。ガロアンディアンの存在は『軽く』なり、トリシューラの呪力と共に零落していくことだろう。
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_トリシューラ_confesses_末妹候補劣等感_p54
        quote: 「やっぱり、駄目だったのかな。私が一番見込みが無い末妹候補で、だから」
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_トリシューラ_other_アキラの言葉_p63
        quote: '「ん――そだね」


          小さく頷くトリシューラ。'
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_トリシューラ_other_艦外退避_p82
        quote: 「ここで戦うのはダメ！　艦内には避難してきた人たちがいるんだ！　一旦外に出るよアキラくん！」
        locator: {}
        spoiler_after: ch5337
    visual:
      observations:
      - event_ref: E_ch5337_トリシューラ_observes_戦場_p26
        quote: 巡槍艦底部から突きだした第三艦橋の中央に立つ俺の主は思い詰めたような表情でモニタをじっと見つめている。映し出されているのは戦場の光景。艦の外殻から迫り出した機銃が人形の群を砕いていく。無機質に、淡々と。それをまなざす緑色の瞳もまた心ここにあらずといった様子だった。
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_トリシューラ_has_property_意識低下_p31
        quote: メンテナンスをしたばかりだというのに、意識総体レベルが低下しているようにも見える。ガロアンディアンに起きた変化が影響しているのかもしれない。
        locator: {}
