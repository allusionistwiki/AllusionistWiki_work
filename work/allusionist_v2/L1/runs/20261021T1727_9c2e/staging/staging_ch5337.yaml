episode: ch5337
created: '2026-10-21'
status: pending_merge
entities:
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5337_アキラ_thinks_決定的敗北_p10
        quote: 決定的な敗北。
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_アキラ_thinks_ラクルラールの戦略_p102
        quote: 「確かにあの場面でアルマが出てきたらパワーバランスが引っ繰り返るもんね。それをさせない為に、『本体』の一角が出てきたってわけ」
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_アキラ_suspects_ラクルラール派_p14
        quote: 状況から考えてラクルラール派の仕業だろう。
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_アキラ_attacks_ラクルラール_p204
        quote: '「黙れ、クソ外道がっ」


          眩暈は続いていたが、強引に立ち上がった。


          左腕を換装、同時に右腕から冷気を全力で放ち、アルマの守りを突破してラクルラールの顔を殴ってやらないと気が済まない。怒りを制御出来ていないことに気がついてぞっとするが、まだ右腕は機能していた。もしかすると右腕にリソースを割いている分だけ感情制御が疎かになっているのか。'
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_アキラ_other_ラクルラール殺害_p230
        quote: '腐った手段に訴えて勝ち誇るラクルラールはいっそ無様に見えた。そんな風にしてアルマが操られたのなら、俺は価値を正確に判断できる。


          やるべき事は簡単だ。善良なアルマには価値がある。腐れ外道のラクルラールには俺と同程度しか価値が無い。よって虫のように潰して殺す。'
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_アキラ_says_死ね_p232
        quote: 「死ねよ外道」
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_アキラ_other_ファルファレロの件_p35
        quote: 「ファルのことは仕方無い。それよりどう救出するかを考えた方がいい」
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_アキラ_observes_トリシューラの弱り_p39
        quote: '「うん。ごめんね、頼りにならなくて」


          弱り切った声。これは思ったより重傷だ。'
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_アキラ_thinks_コルセスカ奪取回避可能性_p4
        quote: それでも、あの時あと少しだけでも戦力が手元にあれば、コルセスカを攫われることは無かったのではないか。考えても仕方の無い事だが、そう思わずにはいられなかった。
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_アキラ_thinks_トリシューラの孤立_p45
        quote: コルセスカが攫われてしまった今、当然彼女の安否も気に掛かるが――本当の意味でトリシューラの味方になってやれる者はそう多くない。
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_アキラ_thinks_実質戦力_p48
        quote: なら、実質的に戦力として数えられるのはトリシューラの手足とも言えるドローンなどを除けば、俺と【マレブランケ】のみ。レオとカーインは――セージのこともあるし、まだよくわからない。
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_アキラ_other_否定_p56
        quote: 「そんなことは無い」
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_アキラ_thinks_遊びの継続価値_p59
        quote: そのやりとりはひどく空虚ではあったが、たとえ形式でも今は『それらしさ』に縋ることしかできない。『女王』、『王国』、その全てが幼稚なままごとでしかないと誰かが嘲笑しても、俺たちは遊びを放棄するわけにはいかないのだ。
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_アキラ_says_価値の剥奪と自己決定_p61
        quote: 「ままごとだろうが演劇だろうが、遊びだろうが競争だろうが、それに価値が無いと醒めてしまえばそこで終わりだ。トリシューラはがらくたなんかじゃない。誰かに付けられた低い値札は剥がして捨てろ。価値を決めるのはお前だろう」
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_アキラ_thinks_言葉の限界_p66
        quote: 唇を噛む。駄目だ、これでは弱い。所詮は前に使った『呪文』の使い回し。使い過ぎれば価値が低下してしまう。以前これが通用したのは、コルセスカとぶつかり合えたことが大きい。やはり、俺だけでは届かない。
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_アキラ_other_疲労と手詰まり_p70
        quote: '時計の秒針を見詰めすぎてうんざりしてきた。


          完全に手詰まりだ。表示された幻影の窓の中、機銃掃射が押し寄せる人形の波を押し返していく。もうずっとそんな状況が続いていた。'
        locator: {}
        spoiler_after: ch5337
    action:
      observations:
      - event_ref: E_ch5337_アキラ_attacks_ラクルラール_p120
        quote: 【弾道予報】を起動して腰のベルトに引っかけていたナイフを投擲。柄に巻き付けていた呪符が【炸撃】を発動、光と熱が撒き散らされる。
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_アキラ_uses_右腕の冷気_p137
        quote: '「く、凍れ！」


          右腕を突きだして凄まじい熱波を防ぐ。'
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_アキラ_uses_サイバーカラテ道場データ_p145
        quote: 俺の目はアルマの高速の連撃を正確に見切っている。厳密には【サイバーカラテ道場】に蓄積された戦闘データとちびシューラによる解析が俺を限りなく『最適』に漸進させているのだ。
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_アキラ_attacks_アルマの脳_p149
        quote: '「悪いが、脳に失礼する！」


          右腕から【氷】で脳に干渉し、アルマを遠隔支配（リモートコントロール）している呪術を解除する。彼女の事は大して知らないが、コルセスカが信頼して選んだ仲間だ。ならば可能な限り助け出す努力はしなければならない。コルセスカを助け出した後、仲間を助けられませんでしたなんてことが言える筈も無い。'
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_アキラ_loses_右腕制御_p153
        quote: 'しかし、凄まじい反発力が発生して俺の右腕が弾き飛ばされる。


          視界隅でちびシューラが目を回し、俺もまた目の中で弾ける火花と眩暈でふらつき倒れそうになる。明滅する視界の中、アルマが無表情に斧を振り上げた。'
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_アキラ_fights_アルマとラクルラール_p211
        quote: '苛立ちと共に右手で突きを放つ。アルマの斧を周囲の空間ごと強引に停止させながら押しのけ、懐に飛び込んだ。額の奥に激痛。これがコルセスカとの繋がりが希薄なまま右腕を使用した代償なのか。視界が赤く染まり、目蓋から熱いものが溢れていく。構わずに左腕で攻撃しようとした瞬間。


          閃光が迸り、左の義肢を完全に破壊する。


          一瞬にして放たれた反撃呪術。


          畳みかけるようにして燃える槍が襲いかかり、右腕で防いだものの長い脚から繰り出される蹴りが腹部に突き刺さり、そのまま吹き飛ばされる。'
        locator: {}
        spoiler_after: ch5337
    symbolic:
      observations:
      - event_ref: E_ch5337_アキラ_other_コルセスカ不在の寒さ_p68
        quote: 'コルセスカの不在が酷く寒々しく感じられた。


          彼女のいない空間は、いつもより暖かいくらいだったというのに。'
        locator: {}
        spoiler_after: ch5337
  first_appearance_candidate: true
- canonical_target: '[[E_char_ラクルラール]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5337_ラクルラール_appears_蜘蛛女_p109
        quote: その奇怪な人物を一言で形容するなら、蜘蛛の被り物をした青いドレスの女、といったところか。しかしその蜘蛛は被り物というにはひどく生々しく、首との境界が定かでない。本当に蜘蛛の頭部をしているのかもしれなかった。
        locator: {}
        spoiler_after: ch5337
    name:
      observations:
      - event_ref: E_ch5337_ラクルラール_names_トライデント第五位_p111
        quote: 「どうれ、初めましての挨拶といこうか。トライデントの【髪】――の第五位【襟足（ネープ）】のラクルラールとは妾のことぢゃよ。これからお前たちの主になるが、まさか異論はあるまいな？」
        locator: {}
        spoiler_after: ch5337
    symbolic:
      observations:
      - event_ref: E_ch5337_ラクルラール_has_property_圧力不在_p114
        quote: '宣名したにも関わらず、呪的な圧力は一切発せられなかった。


          音が、気配が無いのだ。


          そこに存在しているようには全く感じられない。'
        locator: {}
        spoiler_after: ch5337
    speech:
      observations:
      - event_ref: E_ch5337_ラクルラール_says_安全地帯の理_p124
        quote: 「キヒッ、無駄、無駄よ。妾はお前たちのような卑しき俗人とは立っている場所が違うのぢゃ。『使い魔』の呪術師たるもの、自分だけは絶対的安全地帯で高みの見物――基本中の基本ぢゃろ？　何者も妾に干渉することはできぬ」
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_ラクルラール_other_トリシューラの器_p199
        quote: 「お前には女王としての器が無いのぢゃよ。さんざん言われたぢゃろう？　末妹候補として見込みが無いと。女神候補生として落第ぢゃと。お前には邪視の才能が欠片も無い。己の視座が無い。あるのは全て紛い物。無価値なお前には何もできず、がらくたとして終わる――だから妾が使ってやろう。そら、跪け」
        locator: {}
        spoiler_after: ch5337
      - event_ref: E_ch5337_ラクルラール_reveals_アルマの降参理由_p226
        quote: 「いやいや、その女、実に容易かったぞ？　子供を人質に取っただけであっさりと武器を捨ておった。いくら強くともこう甘っちょろくては無能の謗りを免れないであろ。ああ、ちなみにその子供らはもう殺したが」
        locator: {}
        spoiler_after: ch5337
  first_appearance_candidate: true
