- kind: mystery
  name: MY_Kassario_Evolution
  note: 幼獣カッサリオがセレクティから「考える事を止めた時、貴方は意思無き機械人形に成り下がる」と戒められ、悔しさをバネにするよう指示されている。未来の完全体への進化や精神成長の伏線。
  quotes:
  - quote: 悔しいですか。ならばそれをばねに更なる高みを目指しなさい。考える事を止めた時、貴方は意思無き機械人形に成り下がる。自ら決定し、自ら最善を模索する、賢明なしもべをわたくしは欲します
    paragraph: p198
    quote_verified: true
  expected_payoff: カッサリオが知性を得て強敵として再登場するか、セレクティとの関係性が深化する展開で回収される。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_Mishalhi_Division
  note: 幽鬼ミシャルヒがカーティス側に立ちながら迷いを抱えている描写があり、パーンによって「お前を奪う」と宣言されている。彼女の所属と運命の分岐が未確定である。
  quotes:
  - quote: カーティスの傍で迷いを抱えた表情のまま、目を伏せる幽鬼（レイス）が一人...ならば、その自由を縛る神を打ち倒し、お前を奪うだけだ。そこで待っていろ。今、お前が誰のものかを教えてやる
    paragraph: p175-p178
    quote_verified: false
  expected_payoff: パーンとの決着時にミシャルヒの選択が描かれ、勢力図の変動要因となる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_Akira_Mediation_Promise
  note: 「届かない手を繋がせてくれた、私たちの媒介者」という記述と、「彼はそれを約束してくれたのだ」という記憶の回収。アキラがコルセスカとトリシューラ（または前世）を仲介する具体的なメカニズムに関する伏線。
  quotes:
