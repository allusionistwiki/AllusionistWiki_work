- kind: mystery
  name: MY_9th_Book_Content
  note: 九冊目が世界構築の上位呪術として機能するが、その具体的な内容や「雪華掌」との関係が明示されていない。後の展開で世界の構造変更に関与する可能性が高い。
  quotes:
  - quote: 冥道の幼姫が遺した九冊の本とは、すなわち私が有する紀元槍の制御盤、雪華掌の分割体である九氷晶の翻案にして異説。
    paragraph: p44
    quote_verified: true
  expected_payoff: 世界創造や物語の改変に直接関わる重要なキーアイテムとして回収される。
  proposed_by:
