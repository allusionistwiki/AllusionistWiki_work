  theme: 愛と義務：他者（妹・前世）を代理で受け止めることによる生存の意味
  weight: 0.7
  quotes:
  - quote: その苦しみを、その懊悩を愛するのなら、それは私が全て代わりに受け持とう。
    paragraph: p29
    quote_verified: true
  - quote: あらゆる感情を凍らせて、心を静謐で満たすことが彼の望み。たとえその在り方が歪んでいても、それを受け入れると私は決めている。
    paragraph: p22-p23
    quote_verified: true
  note: アキラ（彼）の苦痛を引き受け、コルセスカ（彼女）が望む「凍結された安寧」を維持するという自己犠牲的な構造が、戦闘の動機付けとなっている。
  proposed_by:
