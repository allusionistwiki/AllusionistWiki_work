- kind: mystery
  name: MY_black_rubber_origin
  note: 少年が髪を結ぶために使用した「黒いゴム」の入手経路が不明確であること。これは彼が過去の記憶や出自を欠落させている（＝転生者・創られた存在）ことの伏線。
  quotes:
  - quote: しっくりとくる。これでいい。けれど、黒いゴムをどこで手に入れたのかは思い出せない。彼にはわからないことだらけだ。
    paragraph: p12
    quote_verified: true
  expected_payoff: 彼の記憶が捏造されている事実や、彼が「道具」として創られた存在であることの証明として回収される可能性。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_dog_parent_truth
  note: ブルドッグのような父（p7）と、イアテムやグレンデルヒが言及する「父の性暴力・宿業」（p83-88）との関係。父が実際に何をしたのか、あるいはその記憶がレイに植え付けられた嘘なのか。
  quotes:
  - quote: 大いびきをかく父はたったひとりで我が子を養うために夜遅くまで働き、疲れ果てて寝台に倒れ込んでいる。
    paragraph: p7
    quote_verified: true
  - quote: 「貴様の父親も過去に少年に性暴力をはたらいていたのかもしれんな。その忌まわしい宿業と呪いが父の招いた因果なら、貴様が怒りを抱くのは滑稽な必然だ」
    paragraph: p83
    quote_verified: true
  expected_payoff: レイが父を殺害する運命（オイディプス的悲劇）への伏線、または父の真の姿（怪物化）の発覚。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_tremy_absence_reason
  note: トレミーが「実家の仔ライオンの成長」「カーくんの顔が見たかった」と言って不在だった理由（p169）。彼が外部のメタ領域（作者・運営側）と接触していた可能性。
  quotes:
  - quote: 「いやー、ちょっと久しぶりに実家の仔ライオンの成長ぶりを確認しに帰省をね。あとオトモダチのカーくんの顔が見たかったんさ」
    paragraph: p169
    quote_verified: true
  expected_payoff: トレミーが物語の構造を知りうる存在（賢者・メタキャラ）であることの確認。仔ライオン＝レイの成長監視への関与。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_kain_medical_role
  note: 保険医カーインが「秘孔を刺激」し、深層意識に情報を刻む行為（p207, p249）。これが単なる治療なのか、レイの記憶や人格への書き換え（洗脳・上書き）なのか。
  quotes:
  - quote: 「一応、疲労回復の秘孔を刺激はしたが、しばらく舞いは控えたほうがいい」
    paragraph: p207
    quote_verified: false
  - quote: 言葉と同時にカーインの指先がクレイの眉間、こめかみ、顎下を刺激していく。呆然とするクレイは一切の言葉が聞こえないかのようだったが、指先によって与えられた刺激によって小刻みに震え、短く吐息を吐いていった。
    paragraph: p249
    quote_verified: true
  expected_payoff: レイの「栄光の手クレイ」という役割への強制変換、または物語の強制進行への介入手段としての回収。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_zed_thief_king
  note: カーインが言及した「ミヒトネッセに潜む盗賊王ゼド」が黒幕である可能性（p238）。彼がレイの運命を操っているという示唆。
  quotes:
  - quote: 「やはりミヒトネッセに潜む盗賊王ゼド、あの無法者の英雄が黒幕なのか？」
    paragraph: p238
    quote_verified: true
  expected_payoff: 物語の真の敵（ラスボス）としてゼドが登場し、レイとの決着がつく展開。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: メタフィクションにおける「脚本」からの逸脱と、キャラクターの自律性の獲得
  weight: 0.9
  quotes:
  - quote: 台本をなぞるだけでは操り人形と変わらない。その視座で事態を暴き、己が解釈で舞台をものにしろ。
    paragraph: p247
    quote_verified: true
  - quote: 演劇空間の経絡秘孔を突いた。一時的に浄界の掌握権限を乗っ取り、筋書きから逸脱した領域を作っている。
    paragraph: p227
    quote_verified: true
  note: カーインの台詞が示す通り、物語の構造（脚本）を知りながらいかに「役」として振る舞うか、あるいはそこから逃れるかが主題となっている。
  proposed_by:
