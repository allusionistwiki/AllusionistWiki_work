      - event_ref: E_ch5333_ミヒトネッセ_reveals_英雄の滑稽さ_p51
        quote: 「一応イアテムは真面目に『英雄』をやろうとしているみたいよ――私に言わせれば、『英雄』なんてもの自体が滑稽極まりないんだけどね」
        locator: {}
        spoiler_after: ch5333
  first_appearance_candidate: true
- canonical_target: '[[E_char_イアテム]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5333_イアテム_other_勝利宣言_p111
        quote: 「ふははは！　遂にやったぞ！　ここに【死人の森】は砕かれた！　これよりこのイアテムが女王を妃とし、新たなる『王国』を――ぶごっ」
        locator: {}
        spoiler_after: ch5333
    action:
      observations:
      - event_ref: E_ch5333_イアテム_attacks_ヴァージル_p147
        quote: 強引に立ち上がったイアテムが手に水流の刃を生み出して一閃する。ヴァージルは身軽に跳躍すると、空中で一回転して離れた場所に着地した。そこで、左耳をそっと撫でる。ヴァージルの左耳が切断されていた。
        locator: {}
        spoiler_after: ch5333
  first_appearance_candidate: true
- canonical_target: '[[E_term_空圧の拳]]'
