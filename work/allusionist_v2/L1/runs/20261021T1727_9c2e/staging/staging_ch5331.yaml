      - event_ref: E_ch5331_カーイン_other_セージの殺意_p208
        quote: '「それでいい。所詮、生まれという呪縛から自由にはなれぬものだ。ならばせめて、宿命を楽しむのも一興」

          カーインが少女に向ける感情は、不思議なほど透き通っている。セージはびっくりしたような顔で目を瞬かせた。'
        locator: {}
        spoiler_after: ch5331
