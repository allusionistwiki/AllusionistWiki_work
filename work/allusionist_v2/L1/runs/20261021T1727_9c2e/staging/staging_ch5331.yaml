- canonical_target: '[[E_char_ちびシューラ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5331_ちびシューラ_other_包囲攻撃_p188
        quote: ちびシューラからの指令が【マレブランケ】各員に伝わり、悪足掻きをするイアテムを包囲。この数で一気に仕掛ければひとたまりも無いだろう。ファルが注意を引きつけてくれている隙にセージごと無力化すれば全て解決だ。
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_ちびシューラ_captures_グレンデルヒ_p24
        quote: ちびシューラが縄でグルグル巻いて逆さ吊りにする。厳重に封印しておこうということで合意が形成された。
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_ちびシューラ_other_イアテムのゴーストライティング_p73
        quote: ちびシューラの筆致鑑定で、雑誌『男の暴君』にコラムを掲載しているグレンデルヒ名義のゴーストライターはイアテムであるという調査結果が出ている。
        locator: {}
        spoiler_after: ch5331
    speech:
      observations:
      - event_ref: E_ch5331_ちびシューラ_other_デーデェイア_p281
        quote: （アキラくん気をつけて。あれは海の民にとって最も恐るべき異教の悪魔にして、槍神教が彼らを恐怖と力で縛るための守護天使。皆殺しのデーデェイア！）
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_ちびシューラ_other_イアテムの戦略_p49
        quote: '（わかりやすい物語をくっつけて正義の主人公として振る舞おうとしているんだね。キロンとの戦いと似てるかな）

          ちびシューラが冷静に分析し、妨害するためのプランを提示。物理的に言葉を止めるのはイメージ戦略としていかにも悪者風だ。都合の悪いことを言わせないようにしていると受け止められたら終わり。ここは衆人環視の中なのだから、振る舞いは堂々としたものでなくてはならない。'
        locator: {}
        spoiler_after: ch5331
  first_appearance_candidate: true
