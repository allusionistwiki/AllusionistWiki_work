- canonical_target: '[[E_char_グレンデルヒ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5331_グレンデルヒ_says_観戦の承諾と中断_p14
        quote: 「負け犬にしては上等だイアテム。興が乗った、その趣向に付き合ってやろう。貴様の正義、どこまで貫き通せるか、この先代が見届けェ――がっ、ギギギ――おいちょっとお前そろそろ黙れ！」
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_グレンデルヒ_says_カードプレイの宣言_p2
        quote: 「私の手番（ターン）！ ドロー！ 【繁茂】を実行（プレイ）して更にドロー！ 先程増大させた生命点（ライフ）を支払ってドロードロードロードロー尽き果てるまでドロー！
          【愚者の天秤】を発動、我が空の図書館（ライブラリー）と貴様の図書館（ライブラリー）の枚数は等しくなる！ 次のターン、貴様は図書館（ライブラリー）の魔導書（カード）を引けずに敗北する！」
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_グレンデルヒ_thinks_自身の強さと人気_p6
        quote: 初期コンセプトに原点回帰してカード使いとして戦う私に隙は無い。今の時代、カードゲームもゲーム理論と統計的データを駆使したメタゲームとなるのが常識。サイバーカラテ道場カード師範として君臨する私は無敵。更に玩具販促アニメ経由で子供たちの人気も集められるため呪力供給は常時安定！
        locator: {}
        spoiler_after: ch5331
    action:
      observations:
      - event_ref: E_ch5331_グレンデルヒ_defeats_イアテムたち_p4
        quote: 私は高らかに勝利を宣言し、有象無象の雑魚どもの最後の一人を蹴散らした。愚かなイアテムの上にゴミクズが放り出される。積み上がる虫けらどもの山を見よ。この私の強さを証明するようではないか。
        locator: {}
        spoiler_after: ch5331
  first_appearance_candidate: true
- canonical_target: '[[E_char_イアテム]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5331_イアテム_other_セージ_p142
        quote: '「何を逡巡している？ 迷う余地などなかろうが！」

          イアテムが激しい口調で少女を糾弾する。かっと目を見開いた形相は上から下へ、力で押さえつける者のそれだ。'
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_イアテム_other_セージの恋愛_p148
        quote: 「男。そうか、情欲に溺れたな？」
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_イアテム_other_セージの自己犠牲_p213
        quote: 「何をやっているか雌豚がっ！ 本気で戦え！ 我らの為にその身を捧げよ！ 同胞の、家族の為に全てを差し出すしか能が無いのだろうがっ」
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_イアテム_says_不屈の宣言_p26
        quote: 「まだだっ！ まだこのイアテムは負けてはいない！ いや、負けるわけにはいかぬのだぁっ！」
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_イアテム_says_第五階層への防衛意志_p31
        quote: 「第五階層は我々が見つけだした最後の楽園だ！」
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_イアテム_says_海の民の被虐体験_p37
        quote: 「我ら海の民は地上では踏み絵の如く異教の悪魔デーデェイアを崇めさせられている。南東海を蹂躙したあの怪物に屈服させられ、槍神教の支配に甘んじた。そうしなければ『聖絶』の対象となるゆえに、屈辱を耐え忍んできたのだ！」
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_イアテム_says_ハザーリャ信仰の復活と共同体_p45
        quote: 「だがこの場所では今、大いなるハザーリャの信仰が復活しつつある！ 新たな教団、そして新たな共同体！ 【眠れる三頭】が、地上に居場所の無い者たちの逃げ場となる。その為には確かな足場が必要なのだ」
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_イアテム_says_ガロアンディアンへの敵対_p58
        quote: 「『公社（われら）』を排除し隷属させた僭主トリシューラ、そしてハザーリャを冒涜し権能を占有している簒奪者ブウテト！ 邪悪なる魔女どもを廃し、第五階層の覇権をこの手に取り戻す！
          この地を最初に支配したのは我ら地上の勢力。ならば大義はこちらにあり！」
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_イアテム_says_再戦への決意_p9
        quote: 「ぐ、やはりまだ届かないか――だが我は二代目グレンデルヒとして、間違った先代を打倒しなければならない！」
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_イアテム_other_伝統と文化の防衛_p95
        quote: 「ふざけるな。貴様ら抑圧者はいつもそうだ。やれ文明だ、やれ人権だと自分たちの中だけで作り上げた理屈を押しつけ、我らの伝統や文化、繋がりや誇りを奪っていく！
          そうやって破壊されてきた海の民の信仰や文化がどれだけあると思う？！ そんなことは許容できん！」
        locator: {}
        spoiler_after: ch5331
    action:
      observations:
      - event_ref: E_ch5331_イアテム_other_セージへの屈辱_p164
        quote: '「淫らな雌めが。それがお前の本性だ。恥ずべき魔女として生まれてきたことを罪深いと自覚し、慎みを持って生きよと何度言わせる気だ？」

          イアテムは傲然と言いながらセージに何らかの呪術をかける。見ただけでそれとわかる力関係。'
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_イアテム_wounds_ファルファレロ_p175
        quote: '反撃の一閃。

          ファルの胸が袈裟懸けに裂かれ、呪文が弾け飛んでいく。両者の呪文使いとしての技量の差が出ていた。'
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_イアテム_other_自身の権威_p40
        quote: 傷ついた名誉、失われた信用が存在の『零落』を引き起こしているのだ。
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_イアテム_other_現実_p43
        quote: だが、イアテムは純粋な紀人ではなく生身の海の民。醜態を晒しながらも現実に食らいつくことができる。
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_イアテム_other_同情による求心力回復_p47
        quote: イアテムは戦略を切り替えたようだ。負けられない理由をアピールすることで同情を買い、求心力を取り戻そうとしている。
        locator: {}
        spoiler_after: ch5331
  first_appearance_candidate: true
