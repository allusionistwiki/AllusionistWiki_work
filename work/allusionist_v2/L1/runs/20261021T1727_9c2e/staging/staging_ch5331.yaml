  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5331_カーイン_attacks_イアテム_p191
        quote: 音もなくイアテムの背後に回り込んでいたカーインが、槍のように貫手を放つ。分厚い筋肉質の背中、脊髄に近い箇所にめり込んだ指先がごり、と抉られて、イアテムが背筋を反らせた。
        locator: {}
        spoiler_after: ch5331
    relationship:
