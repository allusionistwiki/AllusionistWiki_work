        quote: 「まずい、ブウテトの呪力を付与したあの剣は、ガロアンディアンだけじゃなくて【死人の森】も滅ぼせる！ 敵の狙いは私たちだけじゃない！」
        locator: {}
        spoiler_after: ch5331
  first_appearance_candidate: true
- canonical_target: '[[E_char_セージ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5331_セージ_attacks_レオたち_p108
        quote: '「そーいうわけで、ごめんなさい」

          真上から、突発的な豪雨が降り注ぐ。'
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_セージ_other_イアテムの呪文_p224
        quote: 'イアテムの単調な『呪文』はあまりにも原始的で俺でもできるような最下級の呪術だったが、セージはそれを聞いただけで条件反射のように竦み上がり、唯々諾々と従ってしまっていた。

          （『呪文』っていうか、『使い魔』だね。あれは）'
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_セージ_other_異形の身体と使い魔_p266
        quote: '「我が祖は人魚、異教の悪魔に捧げられるべき忌まわしき贄！ まことの名を【海雌豚（アムピトリーテ）】！ 貪られるべき供物なり！」

          それは巨大な蛸だった。

          青い色、おびただしい数の触手、その中心には獰猛な牙を備えた口。'
        locator: {}
        spoiler_after: ch5331
    relationship:
      observations:
      - event_ref: E_ch5331_セージ_appears_as_敵_p121
        quote: レオの仲間だったはずの少女は、敵に回ったのだ。
        locator: {}
        spoiler_after: ch5331
  first_appearance_candidate: true
- canonical_target: '[[E_term_アキラ]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5331_アキラ_thinks_興行としての価値_p11
        quote: ほう。負けた言い訳にしてはそれなりだイアテム。成長物語として世代間抗争を演出すれば、敗北は再戦を期待させ、興行としては盛り上がるだろう。
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_アキラ_thinks_不死者のルール_p12
        quote: その意味で、試合という形式を選んだのは良い手と言える。殺し合いにまで発展させないという道が選べるからだ。そも、不死者だらけのこの世界で『真剣勝負』というのはほぼ全て信用や名誉といった形の無いものを賭けることになる。そこで重要になるのは『負けた時の言い訳』を用意しておくことだ。
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_アキラ_thinks_グレンデルヒの自我の強さ_p22
        quote: グレンデルヒは自我が強すぎる。アルレッキーノという【マレブランケ】としての名前で束縛してもなおこれだ。イアテムらを自分ルールに引き摺り込んでカードだけで圧勝した実力は凄まじいの一言だが、取り扱いには細心の注意を払わなければならないだろう。
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_アキラ_other_攻撃開始_p236
        quote: （はいはい、余計なこと考えてないでぶっ殺そうねアキラくん。色物アストラルババアの過去なんて後で適当に捏造して感動消費しとけばいいよ。今は排除するのが先。総員、攻撃開始）
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_アキラ_other_セージの召喚師としての資質_p274
        quote: （召喚師（エヴォカー）！ セージは悪魔や精霊を召喚して使役する魔女術の使い手だったんだ！ それも、あれは大神院の序列では第四位の――よりにもよってあれを呼び出すとか、あいつら気は確かなのっ？！
          人造ペレケテンヌル作ってたグレンデルヒがまともに見えるよ！）
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_アキラ_other_イアテムの正体と危険性_p68
        quote: 'イアテムはかつて【変異の三手】の副長だった。つまり、グレンデルヒの一部を構成していたのだ。それもかなり主要な役割を担う形で。

          （多分、主肢グレンデルヒはミヒトネッセが露悪的に演じていたと思うけど、左右の肢の『グレンデルヒ性』は組織全体の傾向とトップの舵取りに影響を受けていた。つまり、こいつが一番グレンデルヒっぽいメンバーなはず！）'
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_アキラ_hates_イアテムの価値観_p75
        quote: '（リーナをバカにして思い切り前時代的な価値観を主張してくるような奴はキライ！ こいつらは全ての魔女の、女神たちの敵なんだから！）

          嫌いだから拒絶する。女王としては明らかに正しくない感情論だが、『嫌い』はトリシューラの自我を脅かす。'
        locator: {}
        spoiler_after: ch5331
      - event_ref: E_ch5331_アキラ_observes_信仰の切実さ_p97
        quote: この世界において、自分が所属する共同体の文化は極めて重要なファクターだ。呪力資源であり、時にはほとんど自分自身の精神に等しいと考える者さえいる。彼ら海の民は、そうした傾向が特に強いらしい。
        locator: {}
        spoiler_after: ch5331
  first_appearance_candidate: true
- canonical_target: '[[E_char_レオ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5331_レオ_asks_セージの決断_p128
        quote: 「それは、二人で決めたこと？」
