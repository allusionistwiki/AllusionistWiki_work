        spoiler_after: ch5201
      - event_ref: E_ch5201_アキラ_thinks_リーナの勘ぐり_p6
        quote: 呪文の構築に悩む私のために、視点を変えてアキラに助言を頼んでみたら、などと言っていたが、あのにやついた顔は絶対に何か妙な事を勘ぐっていたに違いないのだ。まったくこのお調子者はいつもこうだ。
