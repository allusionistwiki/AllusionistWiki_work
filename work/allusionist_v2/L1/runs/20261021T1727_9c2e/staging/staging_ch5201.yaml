        locator: {}
        spoiler_after: ch5201
      - event_ref: E_ch5201_アキラ_other_メール内側への警戒_p219
        quote: 『やっぱり、内側にかなーりいるわね。できる限り目星を付けて知らせるようにするけど、いざという時はニアをお願いね』
        locator: {}
        spoiler_after: ch5201
      - event_ref: E_ch5201_アキラ_makes_リーナの髪三つ編み_p23
        quote: 部屋を出る準備をしながら私はリーナの明るい黄色の髪を左右で三つ編みにする。今度は、左右両方ともしっかりと。
        locator: {}
        spoiler_after: ch5201
      - event_ref: E_ch5201_アキラ_travels_都市外周部_p45
        quote: 'まずはこの都市の外周部。

          【p46】

          もうすぐ遠い異国から【門】を渡って訪れる幼馴染み、セリアック＝ニアを迎えに行こう。'
        locator: {}
        spoiler_after: ch5201
    visual:
      observations:
      - event_ref: E_ch5201_アキラ_observes_セリアック＝ニアの三角耳の動き_p70
        quote: 霊長類型の耳とは別に存在する、頭頂部の三角耳がぴんと立って微かに動く。喜びの表現だった。
        locator: {}
        spoiler_after: ch5201
