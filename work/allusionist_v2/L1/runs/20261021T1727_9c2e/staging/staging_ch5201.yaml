        locator: {}
        spoiler_after: ch5201
    name:
      observations:
      - event_ref: E_ch5201_アキラ_has_property_マロゾロンドの使徒としての役割_p132
        quote: 私もまた、マロゾロンドの使徒として葬送儀式の締めくくりに参加することになっている。
        locator: {}
