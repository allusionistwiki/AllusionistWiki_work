        spoiler_after: ch5201
      - event_ref: E_ch5201_セリアック＝ニア_says_アキラの中のフィリスも使徒である_p161
        quote: 「セリアにはわかりません。セリアの中にいるナーグストールはセリアです。なら使徒様の中にいるフィリスだって使徒様ではないのですか」
