        spoiler_after: ch5201
      - event_ref: E_ch5201_アキラ_remembers_ドルネスタンルフの絵本_p88
        quote: '私はそれを見て、小さい頃に読んだ絵本を思い出した。

          【p89】

          かつて大地が球体だった頃に第九位の天使だった、まあるいドルネスタンルフ。'
        locator: {}
        spoiler_after: ch5201
      - event_ref: E_ch5201_アキラ_hides_リーナへの怒り_p9
