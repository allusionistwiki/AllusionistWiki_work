        locator: {}
        spoiler_after: ch5201
      - event_ref: E_ch5201_セリアック＝ニア_other_アキラ使徒の身長と性格_p139
        quote: 「あら使徒様。お久しぶりです。背が低すぎて見えませんでした。ふふ、今日も小さくて可愛い夜の民流のぶりっこがお上手ですね。今度はどなたに媚びていらっしゃるんですか？」
        locator: {}
        spoiler_after: ch5201
      - event_ref: E_ch5201_セリアック＝ニア_hates_アキラへの個人的感情_p144
        quote: 'セリアック＝ニアは姉であるリールエルバと昔から仲の良かったというリーナを除けば、私に対してだけ個人的な感情を露わにする。

          【p145】

          それは誰に対しても無関心な笑顔を見せる彼女としてはとても珍しい、怒りや恨みに類する感情だ。'
        locator: {}
        spoiler_after: ch5201
      - event_ref: E_ch5201_セリアック＝ニア_hates_フィリスによるディスペータ追放_p148
        quote: そしてもっと大きい理由は、私の中にいるフィリスが彼女の師であったディスペータお姉様を過去に追放してしまったこと。
