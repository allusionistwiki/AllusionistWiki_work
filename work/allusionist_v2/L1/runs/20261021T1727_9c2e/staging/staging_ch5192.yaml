      - event_ref: E_ch5192_エル・ア・フィリス_defines_言理の妖精_p417
        quote: 『さあリーナ。貴方の過去に遡って、私に物語を語らせて？　私はその為に存在する、言理の妖精なのだから』
        locator: {}
        spoiler_after: ch5192
  first_appearance_candidate: true
