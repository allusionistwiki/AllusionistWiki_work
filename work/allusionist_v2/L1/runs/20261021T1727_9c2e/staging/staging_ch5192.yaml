entities:
- canonical_target: '[[E_char_リーナ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5192_リーナ_says_哲学への拒絶_p11
        quote: 『えっなにそれ意味分かんない。どういう質問？　テツガクとかさっぱりですよ。ていうか私に質問とかすんなや！　質問するのは頭悪い方である私！　私ですよ優等生のマリーさん！』
        locator: {}
        spoiler_after: ch5192
      - event_ref: E_ch5192_リーナ_names_アズーリア_p304
        quote: 『色号をいじって、アズーリアってのはどうよ！　アズールのアズーリア！　おお、なんかいい感じじゃない？』
        locator: {}
        spoiler_after: ch5192
      - event_ref: E_ch5192_リーナ_says_自由の欠乏_p49
        quote: 「自由だ。ここには自由が足りない」
        locator: {}
        spoiler_after: ch5192
      - event_ref: E_ch5192_リーナ_says_空が青い理由_p7
        quote: 『空がどうして青いかって？　それはあれだよ、飛んだ時に気持ちいいからだよ』
        locator: {}
        spoiler_after: ch5192
    relationship:
      observations:
      - event_ref: E_ch5192_リーナ_thinks_居場所の不在_p110
        quote: '余り意識はしないようにしてきたが――最年長で最劣等生というのは、中々居心地が悪い。

          居場所が無いからこそ落ち着きが無いのか。

          それとも居心地の悪さを忘れる為にふわふわと漂っているのか。'
        locator: {}
        spoiler_after: ch5192
      - event_ref: E_ch5192_リーナ_fears_強制された仲_p392
        quote: '嫌いな訳ではない。

          ただ、強制されて仲良くするのは嫌だった。

          『ほんとう』の仲の良さだと思っていたものを、何かの窮屈な枠に押し込められてしまうのが、たまらなく苦痛だった。'
        locator: {}
        spoiler_after: ch5192
    action:
      observations:
      - event_ref: E_ch5192_リーナ_uses_重力操作の邪視_p176
        quote: '空の民であるため邪視の適性もあり、重力を操作する邪視と併用することでリーナは飛行することができる。

          リーナの邪視は耳内部で発動する。'
        locator: {}
        spoiler_after: ch5192
      - event_ref: E_ch5192_リーナ_hides_授業_p18
        quote: 'その日、リーナ・ゾラ・クロウサーは裏庭にいた。

          生垣の上でふよふよと浮遊しながら、リーナはぼんやりと空を眺めていたのだ。

          そんなところで何をしていたのかと言えば、授業を放棄して現実逃避しているのであった。'
        locator: {}
        spoiler_after: ch5192
      - event_ref: E_ch5192_リーナ_other_悪口_p195
        quote: '『当然でしょ、なんたって空使いの飛翔術だもの！　この青空でなら、私は自由だー！　私を叱れるものなら叱ってみろー！　課題が何だ！　将来が何だ！　そんなもん知るかー！　一生働かないでふわふわしてやるー！！』

          雲が巨大な文字の形に変化して、更には実の姉への悪口や、師としての『お姉様』への悪口を空に書き連ねていく。'
        locator: {}
        spoiler_after: ch5192
      - event_ref: E_ch5192_リーナ_travels_蒼穹_p3
        quote: '限界まで高く、遙かな空へと真っ直ぐに。

          リーナとマリーは、どこまでも飛んでいく。'
        locator: {}
        spoiler_after: ch5192
      - event_ref: E_ch5192_リーナ_other_マリーの声_p321
        quote: そもそも声が違う。リーナの発している声とは異なる、清澄な響きの音。
        locator: {}
        spoiler_after: ch5192
      - event_ref: E_ch5192_リーナ_loses_意識_p348
        quote: '間違い無い、左手にいる。

          そう思考した次の瞬間、握りしめた掌から伝わってきた闇がリーナの視界を覆い尽くし、意識が消失した。'
        locator: {}
        spoiler_after: ch5192
    visual:
      observations:
      - event_ref: E_ch5192_リーナ_observes_左手の異常_p343
        quote: '近付いていく黒百合宮の姿に焦りつつも、リーナは握りしめたアズーリアの左手の異常に気がついた。

          色が無い。

          黒、影、闇――それともこれは灰色や白なのか？

          見方によって変化する、奇怪な左手。'
        locator: {}
        spoiler_after: ch5192
      - event_ref: E_ch5192_リーナ_observes_マリー_p80
        quote: '仰向けのまま、首を仰け反らせる。

          生垣の上に、小さな黒衣がちょこんと乗っていた。

          マリー・スー。小さな夜の民。'
        locator: {}
        spoiler_after: ch5192
  first_appearance_candidate: true
- canonical_target: '[[E_char_マリー]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5192_マリー_says_授業からの逃亡_p124
        quote: 『逃げてきた。呪術生命のお勉強って言って、引っ張ったりつついたり変な薬をかけられたりするの。今まではお菓子くれるから我慢してたけど、もう騙されない』
        locator: {}
        spoiler_after: ch5192
      - event_ref: E_ch5192_マリー_other_上下への逃亡_p138
        quote: 『じゃあ上か下に逃げてみるとか』
        locator: {}
        spoiler_after: ch5192
      - event_ref: E_ch5192_マリー_confesses_色の実感の欠如_p233
        quote: 『あのね――光の散乱とか、そういう杖の説明は勉強したからわかるの。異世界や死者といった青が象徴する事柄に関しての呪文とか邪視の説明も知ってる。でも、なんて言うのかな。それが本当に青なんだっていう実感が無いの』
        locator: {}
        spoiler_after: ch5192
      - event_ref: E_ch5192_マリー_remembers_色無しマリー_p241
        quote: 『最初の頃は色がわからなかった。ダーシェンカお姉様は私に色無しマリーって渾名を付けた。その意味すらわからなかったけど、ジルに呪文を教えてもらって、みんなと仲良くなっていく内に、だんだん私は色の区別が付くようになっていった』
        locator: {}
        spoiler_after: ch5192
      - event_ref: E_ch5192_マリー_confesses_名前喪失の恐怖_p265
        quote: 『でも、万色に選ばれなかったら？　結果はまだわからないし、パープルとかに追い越されたら、私、名前を無くしちゃうよ？』
        locator: {}
        spoiler_after: ch5192
      - event_ref: E_ch5192_マリー_says_声と名前の喪失_p274
        quote: 『声と一緒に、無くしちゃった。ダーシェンカお姉様は、きっとすぐ近くにあるから、お友達と一緒に探してごらんなさいって。でも、最初の頃はお友達なんていなかったし、どうしたらいいかわからなくて』
        locator: {}
        spoiler_after: ch5192
      - event_ref: E_ch5192_マリー_says_アズーリアの発見_p317
        quote: 「アズーリア！　そう、私の名前はアズーリアだったんだ！」
        locator: {}
        spoiler_after: ch5192
      - event_ref: E_ch5192_マリー_says_シアンの飛翔_p73
        quote: 『でも、飛んでるときのシアンはとっても伸び伸びとしてるよ。ヴァーミリオンとかフルブライトも凄い飛び方するけど、あんなに楽しそうに飛んでるのはシアンだけだと思う』
        locator: {}
        spoiler_after: ch5192
      - event_ref: E_ch5192_マリー_asks_青と心地よさの関係_p9
        quote: 『なんで青いと気持ちいいの？　それとも気持ちいいのが青なの？』
        locator: {}
        spoiler_after: ch5192
    visual:
      observations:
      - event_ref: E_ch5192_マリー_transforms_有翼の牡鹿_p166
        quote: 'マリーは黒衣を膨らませて小さな有翼の牡鹿に変身した。

          まだ幼いからか、枝角の分岐は三本までだ。'
        locator: {}
        spoiler_after: ch5192
    action:
      observations:
      - event_ref: E_ch5192_マリー_gives_呪力共有_p183
        quote: 'すぐ近くにいるマリーから送られてくる呪力は、その小さな体躯と反比例するかのように頼りがいのある大きなものだ。

          リーナはまるで引っ張り上げられているかのようだと感じた。'
        locator: {}
        spoiler_after: ch5192
      - event_ref: E_ch5192_マリー_appears_帳面_p57
        quote: '寝転んだリーナの目の前に、四角い帳面がぬっと突き出される。

          『そんなにつまんない？』'
        locator: {}
        spoiler_after: ch5192
  first_appearance_candidate: true
