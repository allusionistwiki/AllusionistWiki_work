- canonical_target: '[[E_char_母]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5192_母_teaches_自由の探求_p355
        quote: '息苦しい不自由の中で、ひとつでもいいから何か自由を見つけなさい。

          そう教えられたリーナは、飛翔術にその自由を見出した。'
        locator: {}
        spoiler_after: ch5192
      - event_ref: E_ch5192_母_says_花嫁捜し_p368
        quote: 「ミルーニャの万能細胞を用いれば、同性間で子供を作ることが可能よ。たとえ性別がない相手であったとしてもね。リーナ、貴方は己の花嫁を捜すといいわ」
        locator: {}
        spoiler_after: ch5192
  first_appearance_candidate: true
