        locator: {}
        spoiler_after: ch5048
      - event_ref: E_ch5048_トリシューラ_carries_気を失った少年_p64
        quote: 俺が言葉にするより早く、彼女は気を失ったままの少年を担ぎ上げていた。
        locator: {}
        spoiler_after: ch5048
