entities:
- canonical_target: '[[E_char_ノゴルオゴルオ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5505_ノゴルオゴルオ_has_property_ディスケイム長老格_p11
        quote: おそらくノゴルオゴルオもまたディスケイムの長老格だったのだろう。この程度の手回しは当然と言えた。
        locator: {}
        spoiler_after: ch5505
      - event_ref: E_ch5505_ノゴルオゴルオ_defeats_ベフォニス奪還_p44
        quote: '「話を戻すと。パーンは四十四士ミシャルヒや次期ベフォニスと行動していたんだけど、ノゴルオゴルオは既に一戦交えてベフォニスを奪還したんだって。

          あんたのお友達と協力すれば、骨董品の腕なんて使ってるロートルくらい楽勝だと思うよ。'
        locator: {}
        spoiler_after: ch5505
    visual:
      observations:
      - event_ref: E_ch5505_ノゴルオゴルオ_bonds_マルガリータ_p2
        quote: ノゴルオゴルオ・ディスケイムと威力竜の巫女マルガリータが手を結んでいた。
        locator: {}
        spoiler_after: ch5505
  first_appearance_candidate: true
- canonical_target: '[[E_char_ユディーア]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5505_ユディーア_other_何をも信じていないこと_p132
        quote: 'あたしは、もしかして。

          何も信じてないんじゃないかって。

          全てがどうでもいいと思っている、この上なくひどい人間。

          下らない、最低の、誰とも関わる資格がない奴なんじゃないか、って。'
        locator: {}
        spoiler_after: ch5505
      - event_ref: E_ch5505_ユディーア_other_シナモリアキラへの無関心_p137
        quote: '「アンタさ。

          シナモリアキラに興味ある？」

          「いやそれは全然ないけど」'
        locator: {}
        spoiler_after: ch5505
      - event_ref: E_ch5505_ユディーア_other_実家への苛立ち_p37
        quote: あの厄介な実家ときたら、星辰国（ディスカレイリーグ）と洞窟国（ジャンザビオン）に挟まれた片田舎、東北の僻地でこそこそ交配実験ばかりやっている偏屈者集団のくせに、色々な勢力に取り入る手腕だけは一流だから手に負えない。
        locator: {}
        spoiler_after: ch5505
      - event_ref: E_ch5505_ユディーア_other_血の叫び故郷喪失への渇望_p376
        quote: 'ああ、それならば。

          血が叫ぶ。

          血が求める。

          どくん、どくんと心臓が鼓動を早めていく。

          取り戻してしまえばいいじゃないか。

          だってあたしには、その権利があるんだから。'
        locator: {}
        spoiler_after: ch5505
      - event_ref: E_ch5505_ユディーア_confesses_ペラティアの血への誇り_p386
        quote: '「ごめん嘘ついたかも。

          やっぱり歴史のあるペラティアの血はあたしの誇りだし、ガロアンディアンにも思い入れがあるから、祝祭ではなんとしても竜母様を真っ先に抱き上げる役目を担いたいな。

          今から気合入れるぞー！」'
        locator: {}
        spoiler_after: ch5505
      - event_ref: E_ch5505_ユディーア_other_戦力分担シェボリズ撃破_p391
        quote: '「明日以降の動きについて整理するね？

          この際レースはマルガさんに任せる。

          使い魔にしたジュティアさんとミナさんにはマルガさんのお手伝いをしてもらうから、本選でパーンとロードデンドロンをなんとかしちゃってよ。

          その間にノゴルオゴルオさんがスーリウムを、あたしが王殺し（シェボリズ）を倒す。

          理想の流れはこんな感じで」'
        locator: {}
        spoiler_after: ch5505
      - event_ref: E_ch5505_ユディーア_uses_神運加護プロットアーマー_p398
        quote: '大丈夫、多少雑でもどうせ何とかなるんだから。

          紀竜や紀神に与えられた『神運加護（プロットアーマー）』はユディーアを強引に未来へと運んでくれる。'
        locator: {}
        spoiler_after: ch5505
      - event_ref: E_ch5505_ユディーア_thinks_ディスケイムの影響力_p4
        quote: 'ディスケイム家の影響力は『下』の全土に及ぶ。

          そもそもユディーアが竜神信教の巫女であることがその証明だ。'
        locator: {}
        spoiler_after: ch5505
      - event_ref: E_ch5505_ユディーア_other_呪術リソース才能・ギフト_p403
        quote: '与えられた選択肢の数、限りある呪術リソースを順番に数える。

          『天眼』『竜覚』『灰燼回帰の吐息』『竜騎兵禁止議定書』『剥落の鉤爪』『七情爪法』『報復』『空圧』『安らぎ』『生命吸収』『殺戮』『凍視』『藍神干渉』『祖霊憑依』『先祖返り』『灰神干渉』『過去視』『言理の妖精』それから『正しい解釈の融血呪』も。

          母に仕込まれた一子相伝の奥義。

          『髪』のよくわかる軍勢講座。

          ディスペータお姉さまのリーグス神話解釈。

          『脳』からの贈り物。

          才能（ギフト）。

          恩寵（ギフト）。

          呪縛（ギフト）。

          運命（ギフト）。'
        locator: {}
        spoiler_after: ch5505
      - event_ref: E_ch5505_ユディーア_other_紀竜の巫女は王の花嫁_p412
        quote: '紀竜の巫女たちは王の花嫁だ。

          あたしのモノになるんだから、ちゃんと弁えてもらわないと。

          どくん。

          血が熱い。'
        locator: {}
        spoiler_after: ch5505
      - event_ref: E_ch5505_ユディーア_other_竜母様への帰属意識_p90
        quote: 「竜母様は『末妹』でもあるんだから、私たちは同じ『家族』になれるんだ」
        locator: {}
        spoiler_after: ch5505
      - event_ref: E_ch5505_ユディーア_thinks_自己の本質不確実性_p93
        quote: 'そこから見たユディーアという存在の、圧倒的な不確かさ。

          自覚がないわけではない。

          意識しないようにしているだけだ。'
        locator: {}
        spoiler_after: ch5505
    action:
      observations:
      - event_ref: E_ch5505_ユディーア_learns_運命による保護惰性の試み_p318
        quote: '驚くべきことに。

          ユディーアの世界は、何も変わらなかった。

          全てが今まで通り、順調に進んだ。

          怠惰や自堕落や意図的な失敗がユディーアの立場を悪化させても必ず誰かがフォローしてくれた。

          降りかかる火の粉を全て払ってくれたのだ。'
        locator: {}
        spoiler_after: ch5505
      - event_ref: E_ch5505_ユディーア_observes_感情の死滅_p42
        quote: 感情を切り離して一歩下がった。たちまち色褪せていく世界。感情が死んでいく。
        locator: {}
        spoiler_after: ch5505
      - event_ref: E_ch5505_ユディーア_other_マルガリータ無邪気さの再現_p424
        quote: '灰色の空虚さを知らない少女の無邪気さで、ユディーアは新しい巫女仲間に笑顔を向けた。

          そう、仲良しの双子に紹介されて二人が出会ったあの日のように。'
        locator: {}
        spoiler_after: ch5505
  first_appearance_candidate: true
- canonical_target: '[[E_char_マルガリータ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5505_マルガリータ_says_威風紀竜翼機_p14
        quote: 「私の箒、見たでしょ？　あれこそ工神工房（バッカンドラ）の最新作。ディスケイム家の『オルゴーオルガノン』と協力して開発した最新鋭の紀竜翼機。その名も『威風』よ」
        locator: {}
        spoiler_after: ch5505
      - event_ref: E_ch5505_マルガリータ_says_工神工房の技術力_p20
        quote: '「わかる？　白星都市（クロウジャナス）や星見の塔（ミグ＝エルシア）はもちろん、いけ好かないアザミ機関を遥かに凌駕する技術力！

          元々、工神工房（ウチ）は北部の岩肌人（トロル）たちとの繋がりがあった。'
        locator: {}
        spoiler_after: ch5505
      - event_ref: E_ch5505_マルガリータ_asks_魔道派後継プラータ引退_p55
        quote: '「それと魔道派の後継、勧誘は上手くいってる？　ほぼ寝たきりのプラータおばばに穢れ封じはもう無理でしょ。

          相応しい穢れの担い手が見つかったんだから、引退させてやらんと。'
        locator: {}
        spoiler_after: ch5505
      - event_ref: E_ch5505_マルガリータ_suspects_ユディーアの信仰心_p67
        quote: 「結局、才能あるだけで守護竜（クルエクローキ）を信じてないでしょ」
        locator: {}
        spoiler_after: ch5505
      - event_ref: E_ch5505_マルガリータ_reveals_ユディーアの経歴と不信頼_p84
        quote: '「ディスケイム家の調整体、優れた血統の寄せ集めであるアンタは四十四士の正統でありながら竜神信教に鞍替えせざるを得なかった。

          で次は『星見の塔』、その次は槍神教への潜入任務でしょ？

          セレクティフィレクティのお気に入りって言ってもさあ、ちょっと信用できないんだよね」'
        locator: {}
        spoiler_after: ch5505
    action:
      observations:
      - event_ref: E_ch5505_マルガリータ_other_供養の同化_p29
        quote: '神妙な面持ちで残留したアストラル体や塵を集め、一息にすうと口の中に取り込む。

          もぐもぐとよく味わいながら命の恵みに感謝し、山の狩人たちがそうするように紀竜への祈りを捧げ、供養の同化を行う。'
        locator: {}
        spoiler_after: ch5505
  first_appearance_candidate: true
- canonical_target: '[[E_org_オルゴーオルガノン]]'
  entity_type: organization
  aspects:
    speech:
      observations:
      - event_ref: E_ch5505_オルゴーオルガノン_functions_as_呪石兵器メーカー_p16
        quote: '『オルゴーオルガノン』と言えば、確か時代遅れの『非自律型オルガンローデ』を開発研究している呪石兵器メーカーの名だ。

          歴代の四十四士ベフォニスたちは『初代のような破壊力』を求めて『オルゴーオルガノン』の呪石を使い続けているとか。'
        locator: {}
        spoiler_after: ch5505
  first_appearance_candidate: true
- canonical_target: '[[E_term_ペラティア]]'
  entity_type: terminology
  aspects:
    name:
      observations:
      - event_ref: E_ch5505_ペラティア_is_located_紀竜寺院過去の地域名_p170
        quote: ぺラティアとはかつて亜竜王アルトの時代に築かれた『紀竜寺院』の名であり、その周辺の地域一帯を指し示していた名である。
        locator: {}
        spoiler_after: ch5505
    speech:
      observations:
      - event_ref: E_ch5505_ペラティア_has_property_不可侵の聖域歴史_p195
        quote: 無数の有力者が『我こそは正統なる亜竜王の後継者』と名乗りを上げ黒竜王ダエモデクや五大騎士団との戦いに明け暮れる中、ぺらティアだけは紀竜信仰を守るための聖域として不可侵であり続けた。
        locator: {}
        spoiler_after: ch5505
    action:
      observations:
      - event_ref: E_ch5505_ペラティア_disappears_大断絶世界の変容_p212
        quote: 'しかし。

          それはある日、何の前触れもなく失われた。

          『大断絶』という名の世界の変容によって。

          世界は天地に引き裂かれ、多くの空間が歪み、幾つかの大地が永久に消えた。

          現在のジャッフハリム中央部からやや北東にかけた高地。

          ぺらティア寺院市国が存在したはずの座標には、巨大な槍が突き刺さっている。'
        locator: {}
        spoiler_after: ch5505
  first_appearance_candidate: true
- canonical_target: '[[E_term_紀竜信仰]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5505_紀竜信仰_has_property_排他性の不在統合機能_p178
        quote: 'その大きな特徴は、他の神々に対する信仰と競合しないことだ。

          紀竜への崇敬は世界への祈り。

          超多種族国家として成長と拡大を続けるために、ガロアンディアンは『紀竜』という世界の全てを司る存在を支柱に選び、目論見は成功した。'
        locator: {}
        spoiler_after: ch5505
  first_appearance_candidate: true
- canonical_target: '[[E_org_ディスケイム家]]'
  entity_type: organization
  aspects:
    action:
      observations:
      - event_ref: E_ch5505_ディスケイム家_loses_権威獅子王死亡・継承失敗_p243
        quote: 'ディスケイム家の権威が失墜する事件が二つ発生した。

          一つ目は血統術師たちが自信をもって送り出した二十四番目の獅子王が死亡した事件。

          二つ目は『藍』の彩域管理者の継承失敗事件。

          鈴国文明圏（ジャッフハリム）の守護者である至高天主（セレクティフィレクティ）の『器』として生み出された候補たちが『失敗作』の烙印を押されてしまったのだ。'
        locator: {}
        spoiler_after: ch5505
    speech:
      observations:
      - event_ref: E_ch5505_ディスケイム家_other_ユディーア_p78
        quote: '「私の前だからそう言うよねアンタは。

          そういうとこだっての。

          ディスケイム家は多分だけどアンタを信用してないよ。

          だから私を監視役に選んだ。

          それってさ、アンタもディスケイム家や自分の血統を信用してないってことじゃない？」'
        locator: {}
        spoiler_after: ch5505
  first_appearance_candidate: true
- canonical_target: '[[E_term_ホラー]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5505_ホラー_is_made_of_ディスケイムの分離実験_p264
        quote: 'かつての大悪レストロオセと聖妃レストロオセを分離し、ホラーという異獣を生み出したのはほかならぬディスケイムだ。

          穢れの管理者は穢れと見なされる。

          原始的な、しかし理性をもってしても抗いがたい忌避感情。

          『ホラー化するかもしれない』ことをジャッフハリム人は何よりも恐れている。'
        locator: {}
        spoiler_after: ch5505
  first_appearance_candidate: true
- canonical_target: '[[E_char_クルエクローキ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5505_クルエクローキ_other_ユディーア上位次元からの補正_p330
        quote: 'この身は運命に守られている。

          財布を落とせば親切な人が必ず届けてくれたし、過酷な訓練で命を落とすような重傷を負っても不思議と死ぬことはなかった。

          守護竜クルエクローキの加護。

          ユディーアの人生は、上位次元から入る謎めいた補正によって守られている。'
        locator: {}
        spoiler_after: ch5505
  first_appearance_candidate: true
- canonical_target: '[[E_org_クロウサー家]]'
  entity_type: organization
  aspects:
    speech:
      observations:
      - event_ref: E_ch5505_クロウサー家_bonds_パーン潰し結託_p48
        quote: '「他の本選参加枠もクロウサー家の息がかかってるから、結託して『パーン潰し』ができる。

          むしろ『緑』の陣営を警戒した方がいいくらい」'
        locator: {}
        spoiler_after: ch5505
  first_appearance_candidate: true
- canonical_target: '[[E_char_スーリウム]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5505_スーリウム_attacks_ユディーア刺客・レース参加者_p52
        quote: '彼が放った刺客、暗殺者シェボリズとレース参加者ロードデンドロン。

          レースの裏と表を同時に攻めているスーリウムこそがユディーアにとっての敵だ。'
        locator: {}
        spoiler_after: ch5505
  first_appearance_candidate: true
- canonical_target: '[[E_char_アゥルメイア]]'
  entity_type: character
  aspects:
    name:
      observations:
      - event_ref: E_ch5505_アゥルメイア_has_property_第三位の巫女の経歴_p8
        quote: '城主である『金爪』のアゥルメイアからしてかつて第三位の巫女を務めていた古竜だ。

          『エレクトラ（ユディーア）』に竜覚を叩き込んだ師。'
        locator: {}
        spoiler_after: ch5505
  first_appearance_candidate: true
