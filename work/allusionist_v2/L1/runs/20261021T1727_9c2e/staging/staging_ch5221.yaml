        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_アキラ_has_property_超人的な先読みと体捌き_p11
        quote: 本来の私の身体能力なら到底無理な超人的な先読みと体捌き。
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_アキラ_transforms_翼を持った牡鹿_p153
        quote: '私は翼を持った牡鹿に変身するのと同時に神働装甲を変形させた。

          影の鎧の可変機能。胴体や頭部を黒い装甲が覆っていく。'
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_アキラ_makes_エルネトモランの吸血雲_p247
        quote: '想像する。参照するのは、果てしないようにも思えた繰り返しの中でサリアが話してくれた、始祖吸血鬼の一体との戦いのこと。

          彼女が身に纏っていた影の鎧の元になった存在――伝説の真祖、その幻想をアリュージョンしてリーナとリールエルバに重ね合わせる。

          「出でよ、エルネトモランの吸血雲！」'
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_アキラ_arrives_ガルズたち_p262
        quote: '八人目の最後を見届けると、私は翼を広げて飛翔、加速していく。

          ガルズたちにはすぐに追いついた。'
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_アキラ_attacks_ピッチャールー_p28
        quote: 猛攻を掻い潜って巨体の懐に飛び込むと、筒状の胴に左手を押し当てる。
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_アキラ_breaks_五つ目の金鎖_p45
        quote: 五つ目の金鎖を砕いて、明るい藍色に輝く左手を前に出す。
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_アキラ_uses_速度と質量を操作する呪文_p46
        quote: '速度と質量を操作する呪文がナトの攻撃端末に干渉。

          その影だけが巨大化していく。魔将は急激に加速した羽型攻撃端末に対処し切れなかった。結界を貫通した攻撃端末が三つ首犬の全身を引き裂いていく。'
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_アキラ_breaks_第四の金鎖_p9
        quote: 第四の金鎖を砕く。大量の紙片が消失すると同時に左手が灰色に輝いた。
        locator: {}
        spoiler_after: ch5221
    symbolic:
      observations:
      - event_ref: E_ch5221_アキラ_other_異常な組み合わせ_p106
        quote: '本来はありえない、相容れない筈の組み合わせ。

          影が藍色に変化していくという異常事態は、どのような偶然の悪戯か。'
        locator: {}
        spoiler_after: ch5221
    speech:
      observations:
      - event_ref: E_ch5221_アキラ_thinks_自由奔放な呪力_p108
