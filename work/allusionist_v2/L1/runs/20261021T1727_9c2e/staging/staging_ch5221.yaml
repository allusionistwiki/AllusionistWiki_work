        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_アキラ_thinks_技量の持ち主_p13
        quote: その技量の持ち主はここにはいない。
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_アキラ_says_射影即興喜劇・真翠玉_p159
        quote: '「射影即興喜劇（アトリビュート）・真翠玉（エメラルド）！」

          六つ目の金鎖が砕け散った。

          枝角にプリエステラの時よりも鮮やかな緑色が宿る。'
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_アキラ_thinks_八人目撃破_p235
        quote: '他にもクエスドレムはいたようだが、相手にしているのが四英雄の一人である吟遊詩人ユガーシャであるならば任せても問題は無いだろう。

          七人目に続いて八人目だ。'
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_アキラ_says_射影即興喜劇・真琥珀_p270
        quote: '「射影即興喜劇（アトリビュート）・真琥珀（アンバー）！」

          霊長類に変身し、黒衣を翻して進む。

          第七の金鎖が砕け散った。

          透き通るような黄色い輝きが左手に宿り、私はリーナから渡された袋を掴むと左手で投擲した。'
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_アキラ_says_ナーグストール_p298
        quote: '弱々しい拳をかわして懐に飛び込むと、左手を押し当てると、静かに呟く。

          「ナーグストール」

          ベフォニスの岩肌から浮かび上がった呪宝石が黄色に輝く。

          呪宝石一つ一つの内側に、小さな生き物が出現する。'
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_アキラ_says_遡って、フィリス！_p30
        quote: 「遡って、フィリス！」
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_アキラ_thinks_五人撃破_p37
        quote: 構わずに走る。これで五人。
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_アキラ_says_射影即興喜劇・明藍飛翔_p43
        quote: 「射影即興喜劇（アトリビュート）・明藍飛翔（スカイストーン）！」
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_アキラ_says_射影即興喜劇・天眼透徹_p7
        quote: 「射影即興喜劇（アトリビュート）・天眼透徹（アイアゲート）」
        locator: {}
        spoiler_after: ch5221
    visual:
      observations:
      - event_ref: E_ch5221_アキラ_observes_ピッチャールー_p2
        quote: 圧倒的な暴力を塞き止めたのは。歌姫の攻撃で傷ついた古代兵器。
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_アキラ_has_property_重い影_p98
        quote: '「貴様――なんだその重い影は」

          神働装甲の影に群がる異形の怪物たちは、私を引き寄せることができずに不満の泣き声を上げていた。'
        locator: {}
        spoiler_after: ch5221
