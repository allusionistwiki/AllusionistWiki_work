      observations:
      - event_ref: E_ch5221_クエスドレム_names_召喚者にして支配者の魔将_p114
        quote: クエスドレムは世界内に存在する異世界から使い魔を呼び出す召喚者にして支配者の魔将である。そしてその使い魔はレゴンだけではない。
        locator: {}
        spoiler_after: ch5221
    action:
      observations:
      - event_ref: E_ch5221_クエスドレム_takes_四十枚一組のカード型端末_p116
        quote: '朱の瞳を爛々と輝かせ、魔将は袖口から呪具を取り出した。

          四十枚一組のカード型端末。その一つ一つが使い魔たちを参照する。'
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_クエスドレム_attacks_アキラたち_p143
        quote: 'もはや人型であることすら放棄した群体生物が、邪視、呪文、使い魔、杖という呪術の四系統を全て網羅した攻撃を放ち、更には地獄の呪術体系たる色号の五種を同時に操作する。

          圧倒的な物量。完全な全方位攻撃。逃げ場は前後左右のどこにもない。'
        locator: {}
        spoiler_after: ch5221
    speech:
      observations:
      - event_ref: E_ch5221_クエスドレム_other_ジヌイービと精霊_p118
        quote: 「よかろう、我が軍勢の総力で葬ってくれる！　【珊瑚の角を持つ蛙の国】より来たれジヌイービども！　【フィソノセイア】より現れよ精霊ども！」
        locator: {}
        spoiler_after: ch5221
