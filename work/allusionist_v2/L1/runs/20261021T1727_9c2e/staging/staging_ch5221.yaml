          増え続ける多種多様な軍勢を影の触手を巨大化、加速させることで対抗するが、圧倒的物量に次第に追い込まれていく。'
        locator: {}
        spoiler_after: ch5221
  first_appearance_candidate: true
- canonical_target: '[[E_item_リーナ]]'
  entity_type: item
  aspects:
    speech:
      observations:
      - event_ref: E_ch5221_リーナ_says_言理飛翔・十倍減速！_p128
        quote: '「言理飛翔・十倍減速！」

          私の【束縛（バインド）】とリーナの速度操作。

          二つの呪術を即興で組み合わせ、アレンジして新たな術を作り出す。

          リーナが箒から落とした影が広がっていき、領域内に入ってしまった軍勢の動きが目に見えて遅くなる。'
        locator: {}
        spoiler_after: ch5221
    action:
      observations:
      - event_ref: E_ch5221_リーナ_gives_呪石弾_p267
        quote: '相手がそれを対処している間に、リーナが帽子から袋を取り出して私に預ける。中にはずっしりとした重さの呪石弾。

          ミルーニャから託されたそれを、今この場で最も有効活用できるのは私――というよりも、私が再現する力の持ち主だ。'
        locator: {}
        spoiler_after: ch5221
  first_appearance_candidate: true
- canonical_target: '[[E_char_アキラとリーナ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5221_アキラとリーナ_captures_クエスドレム_p134
        quote: その足元から影の触手がゆっくりと這い上がり、次々と使い魔たちを拘束していく。クエスドレムもまた減速と影の触手に捕まるが、かっと朱の目を見開くと強引に呪文に抵抗する。
        locator: {}
        spoiler_after: ch5221
    speech:
      observations:
      - event_ref: E_ch5221_アキラとリーナ_other_戦力の分断_p157
        quote: 'クエスドレムが支配する異界生物たちの中から飛べる者、影の中を移動できる者たちが私たちを追撃する。

          つまり、敵の戦力は分断されている。'
        locator: {}
        spoiler_after: ch5221
  first_appearance_candidate: true
- canonical_target: '[[E_char_アキラとメイファーラ]]'
  entity_type: character
  aspects:
    relationship:
      observations:
      - event_ref: E_ch5221_アキラとメイファーラ_bonds_精神感応の力_p14
        quote: だが、模倣と類似によってつながった私たちは離れた場所でも完全に遅延の無い情報伝達が行えていた。それは優れた精神感応の力に由来するものでもある。
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_アキラとメイファーラ_bonds_完璧な同調_p18
        quote: 'ミルーニャの時のように、メイファーラだけに過度の負担をかけたりはしない。

          完璧な同調。'
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_アキラとメイファーラ_bonds_遡るという類似点_p20
        quote: 私たちは今、『遡る』という類似点で繋がっている。
        locator: {}
        spoiler_after: ch5221
    action:
      observations:
      - event_ref: E_ch5221_アキラとメイファーラ_uses_必殺技_p26
        quote: 'メイファーラが情報を集めて、私がそれを元に解体する。

          フィリスの新しい使い方を編み出した今でも変わらない、私の『必殺技』だ。'
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_アキラとメイファーラ_reveals_ピッチャールーの来歴_p32
        quote: メイファーラの解析と一体化したその能力が、ピッチャールーという古代ジャッフハリムで作られた兵器の来歴を詳らかにしていき、その役目が既に終わっているという事実を掌握。
        locator: {}
        spoiler_after: ch5221
