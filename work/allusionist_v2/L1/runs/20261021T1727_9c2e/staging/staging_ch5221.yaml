- canonical_target: '[[E_char_リールエルバ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5221_リールエルバ_has_property_吸血鬼の本性_p168
        quote: 吸血鬼としての本性を露わにした彼女の口からは長い牙が伸び、均整のとれた姿態は絶えず黒い霧や蝙蝠となって蠢いている。
        locator: {}
        spoiler_after: ch5221
    action:
      observations:
      - event_ref: E_ch5221_リールエルバ_other_従者たち_p170
        quote: 更に、その背後から大量に現れたのは同じく吸血鬼となった『従者』たち。
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_リールエルバ_defeats_クエスドレム_p217
        quote: '真下から、内側から感染していった翡翠色の呪いがクエスドレムを構成する群体を侵食していく。

          使い魔系の呪術師、支配者としての力量の比べ合い。

          私が触手で妨害し、リーナが空中で敵を引き付けているため、クエスドレムの勢力は弱まっていた。

          そして、感染と拡大を続ける吸血鬼の力は強まり続ける。

          勝利したのはリールエルバだ。'
        locator: {}
        spoiler_after: ch5221
    relationship:
      observations:
      - event_ref: E_ch5221_リールエルバ_bonds_従者たち_p171
        quote: 【支配（ドミナント）】と【虜（アンクレット）】という使い魔系の呪術によって魂をリールエルバに掌握された彼女の手足。
        locator: {}
        spoiler_after: ch5221
    speech:
      observations:
      - event_ref: E_ch5221_リールエルバ_conceals_吸血鬼化の準備_p173
        quote: 'エスフェイルに心折られ、殺害されたというのは全て見せかけだけのまやかし。

          彼女は密かに呪文ウィルスをアストラルネットに流し、更には鼠や蝙蝠といった小動物まで媒介させて市街地に吸血鬼の因子を広げていた。'
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_リールエルバ_defines_吸血鬼化の条件_p179
        quote: '天の御殿にアクセスして再生している死者の記憶を吸血鬼化させることはできない。魂に蓄積された死者としての自己認識が深化してしまっているからだ。

          しかし、死亡して間もないのなら吸血鬼の因子に感染することで蘇生が可能だ。'
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_リールエルバ_promises_精神融解ドラッグ_p188
        quote: 「ふふふ、いい感じに血に飢えているじゃなぁい。さあ働きなさい卑しい下僕ども！　最も優秀な者にはこの私が直々に精神融解ドラッグを注入してあげる！」
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_リールエルバ_has_property_承認による力_p199
        quote: '「ああ素敵！　私の支配力が高まっていく――承認こそ私の力！」

          半透明の脆いアストラル体の存在強度が飛躍的に上昇していく。

          歌姫が聴衆の熱狂で力を増すように、サイバーカラテが入門者から集められた信用と情報に応じて強化されていくように――リールエルバもまた下僕たちの数に応じて強力な吸血公（ヴァンパイアロード）になるのだ。'
        locator: {}
        spoiler_after: ch5221
      - event_ref: E_ch5221_リールエルバ_has_property_性的衝動の変換_p204
        quote: 'リールエルバは人の性的欲求に干渉し、精神を支配することを得意としている。

          彼女の呪文と使い魔の二重系統を複合させた感染呪術にかかれば、死人たちが有する死への衝動を反転させて性的衝動に変換、吸血鬼化させることも可能だ。'
        locator: {}
        spoiler_after: ch5221
  first_appearance_candidate: true
- canonical_target: '[[E_char_リールエルバの軍勢]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5221_リールエルバの軍勢_fights_クエスドレムの使い魔たち_p184
        quote: '強靭な心身を誇る吸血鬼たちがクエスドレムの使い魔たちと激突する。

          血走った目で悪霊レゴンたちに飛び掛る大勢の男女。

          リールエルバに忠誠を誓った彼ら彼女らが心臓の怪物たちを引き裂いて、牙を突き立てては【生命吸収】で大量の血液を吸い取っていく。'
        locator: {}
        spoiler_after: ch5221
  first_appearance_candidate: true
