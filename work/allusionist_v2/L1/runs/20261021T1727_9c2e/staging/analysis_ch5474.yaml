  - quote: こちらの心拍と血圧を闘争に最適化した領域まで高めつつ、相手には度を超した怒りをもたらして冷静さを失わせ臓器に負荷をかける。
    paragraph: p224
    quote_verified: true
  - quote: 不自然な唐突さで激情が停止し、吐き出されようとしていた怒りが鎮火されていた。
