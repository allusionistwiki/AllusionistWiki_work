  theme: 美と醜の対比を通じた暴力の本質
  weight: 0.6
  quotes:
  - quote: 華やかじゃない、君は全く美しくない！ これが本当に当代のカーインなのかい？
    paragraph: p175
    quote_verified: true
  - quote: 私はね、不格好な君の中で唯一その石化術だけは評価に値すると思っている。華やかじゃない有象無象を石像という美の形式に押し込めることができるからね。
    paragraph: p195
    quote_verified: true
  note: 敵対者たちが「美しさ」や「様式」を戦闘能力や世界支配の基準として語っている。暴力が「美的秩序」によって正当化・制御される構造を示唆する。
