- kind: mystery
  name: MY_カーインの正体と角
  note: 「無徴種族」だったはずのカーインから生えた「漆黒の角」。これが「偽物の本性」であり、彼が単なる人間ではないことを示唆する。後の展開で彼の真の出自（魔竜？
    堕天使？ 人造生命？）に関わる重要な伏線。
  quotes:
  - quote: 漆黒の肌、苦痛に歪んだ顔、その額から生えているのは二本の角だった。... つまり偽装ではない。ならばあれこそが、この偽物の本性。
    paragraph: p138-p141
