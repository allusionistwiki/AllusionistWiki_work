episode: ch5072
created: '2026-10-21'
status: pending_merge
entities:
- canonical_target: '[[E_char_レオ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5072_レオ_other_住民達_p102
        quote: '彼はひたすら話していた。声を張り上げていた。必死に。夢中になって。明らかに通じていないが、それでも何故か意思疎通に成功しているようだった。

          いや、よく見れば噛み合っていないのだが、それでもジェスチャーなり行動なりを繰り返し、どうにかそれらしいコミュニケーションもどきが成立しているのだった。'
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_レオ_gives_携帯糧食_p109
        quote: 昨日目にした、施しの手からこぼれ落ちた者達に、何かをしようとしているのだ。あれはなんだろう、食料？ 比較的安価な携帯糧食だろうか。糖分を補給できるタイプの、捉えようによっては菓子のようなアレだ。レオはそれを、人々に配っているのだ。つまりは施しのつもりなのだろう。
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_レオ_other_拒絶と暴力_p113
        quote: 無視される。これはよくある。悪態を吐かれる。何度も何度も。貰うものを貰って、礼も言わずに去っていく奴はまだ善良な方で、レオに襲いかかって身ぐるみを剥ごうとする者もいた。そういう奴は大抵即座に第五階層住民の権利を剥奪されて、【人狼】になる。そうなるともう、【生きた死体】同然という扱いで、ぼろ雑巾の状態で路地裏に放置される。レオは、そうしたクズにも悲痛な視線を向けて、しばらくうつむいて、それでもまた同じようなことを続けていく。
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_レオ_other_身体_p122
        quote: 'レオは、猫耳をぴくぴくと震わせながら軽やかに立ち上がる。幸いダメージは小さかったようだ。

          肉体的にも、精神的にも。彼はまったくへこたれていない。'
        locator: {}
        spoiler_after: ch5072
    visual:
      observations:
      - event_ref: E_ch5072_レオ_other_朗らかな笑顔_p133
        quote: 'あんな風に誰からも邪険にされて、拒絶されているのに、強く、朗らかに笑っている。

          言葉が通じていない。

          その程度の事実など、何の障害にもなりはしないと、証明するかのように。'
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_レオ_is_located_樹木系種族の居住地_p94
        quote: 案の定、というべきだろうか。レオは樹木系種族が固まって住んでいるあたりにいた。昨日から気にしていたそぶりは見せていたので、予想はできたことである。
        locator: {}
        spoiler_after: ch5072
  first_appearance_candidate: true
- canonical_target: '[[E_item_アキラ]]'
  entity_type: item
  aspects:
    speech:
      observations:
      - event_ref: E_ch5072_アキラ_thinks_死の商人行為_p11
        quote: であれば、トリシューラのコウモリというか、戦争中の両国に武器を売りつける死の商人みたいなやり口は全てその目的の為なのだろう、とは推測できる。
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_アキラ_observes_レオの善性_p138
        quote: レオが作り出すその表情の、行動の、なんと尊いことだろうか。圧倒的な善性。溢れんばかりのフィランソロピー。人は、見知らぬ誰かに優しくすることができる。
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_アキラ_remembers_救済の経緯_p14
        quote: 俺は【異獣憑き】であるアズーリアの力で救われた。
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_アキラ_other_レオとの差異_p146
        quote: '俺にはない資質だ。

          言葉が通じなかった俺は、彼のような事はできなかった。だからよりわかりやすい暴力に走った。

          だが、もしかしたらああやって、どうにかして真っ当なコミュニケーションで人間関係を構築していくことは、可能だったのではないか？

          俺が未だに居場所を持たないのは、言葉のせいではなくて。

          俺とレオとの、決定的な差異。'
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_アキラ_other_苦しみ_p148
        quote: 'レオにある尊い資質。それを俺は、有していない。ただそれだけなのだ。

          それだけの事が、どうしてかたまらなく苦しくて。'
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_アキラ_says_死にたい願望_p152
        quote: '「なんか、もう一回死にてー」

          口の中で、小さく呟く。'
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_アキラ_thinks_価値の仮構_p160
        quote: 'なあ、ロドウィ、キロン、トリシューラ、コルセスカ。

          どいつもこいつも、何故か俺を高く見積もっているようだけど。

          多分それは金メッキのトロフィーに価値を仮構するような、偽りの値札なんだよ。ゲーム用のおもちゃの通貨。舞台用のマクガフィン。俺そのものには大した価値が無いんだ。本当はそうだ。'
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_アキラ_other_自身の無価値さ_p163
        quote: '正しい意味で、求められるだけの価値を持っている人物は、他にいる。

          俺ではない。俺では、あんなことはできなかった。

          できなかったのだ。'
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_アキラ_thinks_トリシューラの企み_p2
        quote: 「上と下、双方に邪悪な呪いをばらまき、凄惨な戦いを煽るような魔女の狙いが真っ当な物であるはずがない。かならず危険な企みがあるはずだ。俺はそれをなんとしても阻止しなければならない」
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_アキラ_confesses_邪悪の肯定_p21
        quote: わかっている。俺は一度トリシューラの邪悪を肯定した。今もそれを肯定し、追認し続けている。
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_アキラ_thinks_選別の醜悪さ_p24
        quote: '問題は、いざその邪悪さが自分の身近な人に向けられた時にだけ、都合良くトリシューラを非難しそうになったというその無責任さそれ自体にある。

          醜悪極まりない選別。'
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_アキラ_thinks_人間への値札付け_p27
        quote: 結局の所、俺もまた人間に値札を付けて回る身勝手で傲慢な輩だったのだと、改めて思い知らされる。
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_アキラ_thinks_取引の性質_p34
        quote: '「それは」

          都合の良い話など存在しない。これは取引なのだ。

          既に松明の騎士団と敵対してしまった俺が再び地上側に付こうとするには、相応の選択が必要になる。'
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_アキラ_thinks_トリシューラを売る可能性_p36
        quote: その為に、俺はトリシューラを売ることができるだろうか？
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_アキラ_thinks_決断能力の欠如_p40
        quote: 俺の葛藤を読み取っている為か、小さな仮想の表情は不安げだ。当然だろう、俺は迷いすぎるぐらいに迷っている。今まで俺の内面をずっと読み取ってきた彼女にはそれがよく理解できているのだ。客観的な事実として、俺には決断能力が欠けている。
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_アキラ_asks_時間の猶予_p44
        quote: 'こういう時、判断を機械に委ねるのが俺にとっての正しさだが、このような場合に状況判断をするアプリケーションは生憎と手持ちに無い。

          「少し、時間が欲しい」'
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_アキラ_says_逃亡の否定_p56
        quote: 「心配せずとも逃亡なんてしない。どうせ俺には逃げ場なんて無いんだからな」
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_アキラ_thinks_敵対意欲の欠如_p64
        quote: '勿論、トリシューラを売る気は無い。

          だが、積極的にキロンと敵対する気があまり起きないのも、彼の誘いに心が動いているのも事実だった。'
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_アキラ_fears_面倒事_p77
        quote: '炎上騒ぎに【公社】の反撃、そしてとどめにキロンの誘い。

          のべつ幕無しに襲来する面倒事。コルセスカではないが、布団にくるまって現実逃避したい気分だった。'
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_アキラ_other_トリシューラの目的_p8
        quote: 'そして俺は彼女の目的を既に知っている。

          自らを邪悪な魔女であると規定し、己の存在証明の為にどのような非道すらも厭わないというその意思を。'
        locator: {}
        spoiler_after: ch5072
    visual:
      observations:
      - event_ref: E_ch5072_アキラ_fears_トリシューラへの視線_p17
        quote: だというのに俺は、視界の隅にいる仮想の少女を直視することができなくなっていた。
        locator: {}
        spoiler_after: ch5072
    action:
      observations:
      - event_ref: E_ch5072_アキラ_remembers_レオ捜索の任務_p83
        quote: '「あ」

          そういやそうだった。探している最中にキロンに遭遇したおかげですっかり忘れていたが、レオを見つけなければならない。'
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_アキラ_uses_Doppler_p93
        quote: 【Doppler】をフル活用して探すこと数分。
        locator: {}
        spoiler_after: ch5072
  first_appearance_candidate: true
- canonical_target: '[[E_org_ティリビナの民]]'
  entity_type: organization
  aspects:
    action:
      observations:
      - event_ref: E_ch5072_ティリビナの民_attacks_レオ_p116
        quote: '最悪なのが、樹木のような種族――【ティリビナの民】だった。

          彼らはその静かなイメージに反してかなり攻撃的で、暴力を振るうことに躊躇いがなかった。おまけに、外皮が硬い。鎧を纏っているかのように硬く重い。彼らはレオの言葉に耳を貸さず（理解できないのだから仕方が無いのだが）、その太い丸太そのものの腕で少年の矮躯を吹っ飛ばした。散らばった糧食に一斉に群がる物乞い達。'
        locator: {}
        spoiler_after: ch5072
  first_appearance_candidate: true
- canonical_target: '[[E_char_トリシューラ]]'
  entity_type: character
  aspects:
    relationship:
      observations:
      - event_ref: E_ch5072_トリシューラ_helps_アキラ_p15
        quote: ならば、間接的にはトリシューラがもたらした技術が俺を救ったと言うこともできるだろう。
        locator: {}
        spoiler_after: ch5072
    action:
      observations:
      - event_ref: E_ch5072_トリシューラ_makes_第五階層_p4
        quote: 付け加えるなら、今の第五階層、つまり擬似的な中立地帯を形作ったのはトリシューラだ。
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_トリシューラ_functions_as_技術発展促進者_p6
        quote: 対立する二大勢力の戦力を強化し、戦火を拡大させる。中立地帯を作り上げ、物や人を行き交わせる事で技術の発展を促進させる。事実だけを並べていくと、確かにそのような結論が導き出されるのも無理は無い。
        locator: {}
        spoiler_after: ch5072
  first_appearance_candidate: true
- canonical_target: '[[E_char_トリシューラ仮想]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5072_トリシューラ仮想_conceals_言葉_p155
        quote: ただ一人それを聞き咎めたちびシューラが、何かを言おうとして、口を閉ざした。
        locator: {}
        spoiler_after: ch5072
    speech:
      observations:
      - event_ref: E_ch5072_トリシューラ仮想_asks_アキラへの呼びかけ_p38
        quote: （アキラくん、あの――）
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_トリシューラ仮想_asks_レオの行方_p79
        quote: （あのさ、アキラくん。話は変わるんだけど、レオはどうしようか？）
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_トリシューラ仮想_says_過保護への指摘_p88
        quote: （アキラくん、過保護）
        locator: {}
        spoiler_after: ch5072
  first_appearance_candidate: true
- canonical_target: '[[E_char_カイン達]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5072_カイン達_dies_無残な死_p20
        quote: '何故なら、トリシューラが地獄側に技術を提供しなければ。

          カイン達は、あんな無残な死に方をすることもなかったのではないか、という最低の思考が消しても消しても次々と湧き上がってくるからだ。'
        locator: {}
        spoiler_after: ch5072
  first_appearance_candidate: true
- canonical_target: '[[E_char_キロン]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5072_キロン_asks_魔女の居場所_p30
        quote: 「魔女の居場所を俺に教えてくれ。そうすれば、俺は君の味方になってやれる。あの大罪人の処刑に貢献したという実績があれば、君が我々の仲間を不幸な行き違いで殺害した件に関して『恩赦』が下るようにするのも不可能ではない」
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_キロン_promises_明日の約束_p50
        quote: 「いいだろう。では明日、同じ時間と場所で待つ」
        locator: {}
        spoiler_after: ch5072
    action:
      observations:
      - event_ref: E_ch5072_キロン_observes_アキラの思考_p48
        quote: キロンはしばし目を細め、こちらの表情からその思考を探り出そうとするようにじっと視線を向けてきた。X線で体内を精査されるような、一瞬の緊張。
        locator: {}
        spoiler_after: ch5072
      - event_ref: E_ch5072_キロン_departs_第五階層の雑踏_p60
        quote: そうして、男は第五階層の雑踏の中に去っていった。後を追って羽ばたく蝶の鱗粉と翅の構造色が、煌めくように軌跡を描いて、やがて消えていった。
        locator: {}
        spoiler_after: ch5072
  first_appearance_candidate: true
- canonical_target: '[[E_item_自動礼拝機]]'
  entity_type: item
  aspects:
    visual:
      observations:
      - event_ref: E_ch5072_自動礼拝機_functions_as_目印_p52
        quote: キロンの背後には目印としてわかりやすい自動礼拝機が設置されている。高度な技術が用いられた精密呪具であるため、インスタントに生成・消去される建造物を目印にするよりもずっとわかりやすい。
        locator: {}
        spoiler_after: ch5072
  first_appearance_candidate: true
