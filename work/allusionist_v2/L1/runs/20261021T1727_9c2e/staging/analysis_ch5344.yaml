- kind: theme
  theme: 死者の森の価値観転換：労働と神聖性の再定義
  weight: 0.6
  quotes:
  - quote: 聞けば、死人の森では木こりは聖なる職業であり、社会的地位が高いらしい。
    paragraph: p32
    quote_verified: true
  - quote: ラフディでは木こりたちは大工たちに見下され、扱き使われてきた。そうした悪習は【死人の森】に組み込まれてからは無くなったのだ。
    paragraph: p33
    quote_verified: true
  note: 死後の世界（再生者社会）における社会的ヒエラルキーの逆転と、労働の神聖化を通じて、死者の森が単なる墓地ではなく「新たな文明圏」であることを強調する。
  proposed_by:
