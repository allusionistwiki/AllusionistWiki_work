      - event_ref: E_ch5051_コルセスカ_says_凍結の号令_p2022
        quote: 張り詰めた糸を断ち切るように、コルセスカの号令が辺りに響き渡った。「始めます――凍れ」
        locator: {}
        spoiler_after: ch5051
      - event_ref: E_ch5051_コルセスカ_says_シャルマキヒュの凍視の効果_p7881
        quote: 「無駄です。【シャルマキヒュの凍視】は受動型呪術。行動を終えた貴方たちに、回避の権利はありません」
        locator: {}
