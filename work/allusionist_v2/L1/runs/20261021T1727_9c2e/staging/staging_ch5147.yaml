episode: ch5147
created: '2026-10-21'
status: pending_merge
entities:
- canonical_target: '[[E_char_プリエステラ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5147_プリエステラ_stops_アキラの暴走_p101
        quote: 多分、プリエステラが振り下ろした回数を超えたのだろう。彼女はそっと私に歩み寄って制止しようとしたが、私は無視してそのまま槌矛を振り下ろした。
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_プリエステラ_activates_アルラウネ断章_p80
        quote: 突然変異の樹妖精（アルラウネ）、その因子の中に刻み込まれた形無き血。生ける魔導書。その名は【アルラウネ断章】。遺伝子に内包された『種の記憶』に呪力を見出し、一つの呪術として発動させる。
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_プリエステラ_uses_腐蝕の猛毒_p92
        quote: あらゆるものを腐蝕させ、致死毒によって身体を蝕み、おぞましい異臭を放つ極限の汚濁液。
        locator: {}
        spoiler_after: ch5147
    speech:
      observations:
      - event_ref: E_ch5147_プリエステラ_says_うろの中の秘密レルプレア_p84
        quote: 森の主よ猛り狂え！　我は目、我は口、荒ぶる神意の代行者なり！　矮小なる者どもよ、【うろの中の秘密（レルプレア）】を畏れよ！！」
        locator: {}
        spoiler_after: ch5147
  first_appearance_candidate: true
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5147_アキラ_other_肉片_p104
        quote: 細かな肉片と化した怪物を、より細かくなるまで破壊していく。もう破壊しきれないほど小さくなっても、まだ壊す。壊す。壊す。何度でも。
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_アキラ_uses_安らぎ_p110
        quote: 疲労した腕に【安らぎ】を掛けて強引に奮い立たせた。
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_アキラ_other_何もない場所_p112
        quote: 'やがて私は、何も無い場所をただ踏みつけるだけになった。

          そこにはもう何も無い。'
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_アキラ_uses_パラドキシカルトリアージ_p19
        quote: 万能の医術、あらゆる致命傷を無効化するパラドキシカルトリアージを再現してミルーニャの死を否定してみせる。
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_アキラ_observes_ミルーニャの死_p2
        quote: 槌矛を手に持ったまま呆然と突っ立って、ただミルーニャ・アルタネイフという、つい先程まで軽口を叩き合っていた仲間が無残に殺されるのを見ていることしかできなかったのだ。
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_アキラ_observes_解体の不完全性_p25
        quote: 呪術を完璧に解体して消去した時の手応えがない。
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_アキラ_activates_金鎖_p30
        quote: 再びフィリスを活性化させる。立て続けの金鎖解放に頭の奧に軋むような頭痛を感じるが、耐え抜いて精神集中を続行する。
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_アキラ_other_万色彩星ミレノプリズム_p40
        quote: 私は極限を超えた超高位呪文【万色彩星（ミレノプリズム）】の発動に失敗してしまった。摸倣呪術はパラドキシカルトリアージを再現できなかったのだ。
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_アキラ_breaks_金鎖の半分_p47
        quote: やめろ、無駄だ、死に近付くだけだと囁く理性の声を無視して、私は残り二つになった金鎖の半分を割り砕く。
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_アキラ_observes_結果の無音_p50
        quote: '静謐。

          無音だけが、その結果だった。'
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_アキラ_uses_陥穽エンスネア_p64
        quote: 黒衣を翻して、杖を展開する。花開いた杖の内側から、月光に照らされて透き通った昼の空の如き天青石が現れ出でる。呪力光が溢れ出して拘束の帯が放たれると、長い舌を頑丈に絡め取った。【陥穽（エンスネア）】が発動する。
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_アキラ_helps_プリエステラの攻撃_p94
        quote: だが私は拘束を解くことはしない。むしろより強く締め上げ、更なる苦痛を与えるべく渾身の呪力を込めていく。
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_アキラ_attacks_イキューの残骸_p98
        quote: '私は、その原形を留めないほど損壊して汚染された舌を地面に下ろすと、そのまま杖を槌矛に変形させて振り下ろした。

          何度も。何度も何度も何度も何度も。プリエステラが、その怨恨の全てを叩きつけていた様に。'
        locator: {}
        spoiler_after: ch5147
    speech:
      observations:
      - event_ref: E_ch5147_アキラ_other_対抗呪文の限界_p28
        quote: イキューが使ったような肉体を変異させる邪視は半ば杖に近い。物質的な存在強度と精密な再現性のある系統の呪術を完全に打ち消して『無かったこと』にするには、長い時間をかけて対象の構造を正しく理解しなければならない。今のような咄嗟の発動ではそのような結果は望むべくも無い。
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_アキラ_says_嘘_p4
        quote: 「嘘」
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_アキラ_thinks_ハルベルト救出の奇跡_p42
        quote: あの時、ハルベルトを救えたこと自体が奇跡のようなもので、元々私の力量で成功するような試みではなかったのだ。
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_アキラ_hopes_死を否定する力_p53
        quote: 私は死を否定できるだけの力が欲しい。狂おしいほど――呪わしいほど切実に。
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_アキラ_remembers_過去の死者_p6
        quote: 人はとても簡単に死ぬ。手練れの斥候であるカインはエスフェイルを罠にかけて仕留めたが、そのために死んだ。優れた修道騎士であるキールとマフスは私が殺した。テールとトッドもあれだけ頼もしかったのに死ぬ時はあっけなかった。
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_アキラ_other_ペイルとの呪力量_p66
        quote: '日中に対峙したペイルは私の拘束をいとも簡単に打ち破った。単純に呪力を比較すれば、私の呪力でイキューを押さえ込める筈も無い。

          だがそれは、あくまでも昼間だったらの話だ。'
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_アキラ_has_property_夜の民としての特性_p71
        quote: 私は眷族種における序列第二位、【夜の民】だ。その名の通り、私達の呪力は夜の間だけ飛躍的に高まる――夜の間だけ本来の力を発揮できる。限られた時間だけとはいえ、夜の私達はあらゆる眷族種を上回る呪術適性を得ているのである。
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_アキラ_other_プリエステラ_p75
        quote: 「エスト、今のうちに！」
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_アキラ_confesses_自己責任_p9
        quote: ああ、私はまた、自分の為に誰かの命を犠牲にしたんだ。
        locator: {}
        spoiler_after: ch5147
    visual:
      observations:
      - event_ref: E_ch5147_アキラ_makes_金鎖の破壊_p34
        quote: 残り二環となった金鎖が輝き、その影となるように色のない左手がのっぺりとした闇を広げていく。
        locator: {}
        spoiler_after: ch5147
  first_appearance_candidate: true
- canonical_target: '[[E_char_修道騎士達]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5147_修道騎士達_observes_アキラの狂態_p107
        quote: 三人の修道騎士達は治療を終えたのか、無言で私の狂態を眺めている。
        locator: {}
        spoiler_after: ch5147
  first_appearance_candidate: true
- canonical_target: '[[E_term_フィリス]]'
  entity_type: terminology
  aspects:
    action:
      observations:
      - event_ref: E_ch5147_フィリス_activates_大呪術_p17
        quote: 三回目の金鎖解放によって左手が脈動し、活性化させられた寄生異獣が超高密度の呪力を練り上げていく。時間すら遡って事象を改変する大呪術が発動し、目の前で起きてしまった惨劇を塗り替えようと色のない光を放射していく。
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_フィリス_transforms_対抗呪文静謐_p22
        quote: 宿主の危機に自動的に反応したフィリスは規定のプランに従って呪文の性質を変更してしまう。摸倣呪文ではなく、対抗呪文【静謐】が発動。
        locator: {}
        spoiler_after: ch5147
  first_appearance_candidate: true
- canonical_target: '[[E_char_イキュー]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5147_イキュー_attacks_アキラ_p20
        quote: 極限の集中と共に左手を掲げた私の身体は一瞬だけ無防備になる。その隙を逃さずに無数の斬撃と化したイキューが襲いかかった。
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_イキュー_other_ハルベルト_p55
        quote: 対抗呪文を受けたことで私を危険だと判断したのか、別の標的を探し始める。
        locator: {}
        spoiler_after: ch5147
      - event_ref: E_ch5147_イキュー_dies_腐蝕による死_p96
        quote: 表面に垂れ流されるだけではなく、舌の内部にまで穴を開けて注ぎ込まれる腐蝕の猛毒。
        locator: {}
        spoiler_after: ch5147
    visual:
      observations:
      - event_ref: E_ch5147_イキュー_transforms_長い舌_p22
        quote: 繊維の如き総体が私の眼前で停止し弾き飛ばされる。そればかりか、全体が依り合わさって一本の長い舌となった。
        locator: {}
        spoiler_after: ch5147
  first_appearance_candidate: true
- canonical_target: '[[E_term_世界の理]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5147_世界の理_defines_生と死の不可逆性_p51
        quote: 生と死はどうしようもなく不可逆なもの。それがこの世界の理だ。それを否と言うことができるのは、不死の女神であるキュトスとその眷族、そして生と死の神秘性を否定して再現性の呪術で死を無かったことにしようとする一部の杖使いたちだけ。
        locator: {}
        spoiler_after: ch5147
  first_appearance_candidate: true
- canonical_target: '[[E_char_ハルベルト]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5147_ハルベルト_fears_イキューの攻撃_p58
        quote: その未来を想像してしまったのか、ハルベルトは竦んだように動けなくなってしまう。瞬間的に、私はある光景を思い出した。単眼巨人を前にして、青ざめた表情で怯える彼女の姿を。
        locator: {}
        spoiler_after: ch5147
  first_appearance_candidate: true
- canonical_target: '[[E_char_使い魔]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5147_使い魔_other_砂糖菓子_p62
        quote: 黒衣の内側で使い魔が役割を果たす。投げ放たれた砂糖菓子。それはほとんど賭けだった。甘さを極限まで追求した糖分の塊、イキューが追求する味覚への刺激と快楽の発生源。
        locator: {}
        spoiler_after: ch5147
  first_appearance_candidate: true
