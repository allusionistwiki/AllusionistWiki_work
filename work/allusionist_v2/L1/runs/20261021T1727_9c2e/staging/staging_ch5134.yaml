- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5134_アキラ_confesses_変な考え_p102
        quote: 「その、実はちょっとだけ、変なことを考えました」
        locator: {}
        spoiler_after: ch5134
      - event_ref: E_ch5134_アキラ_confesses_妹への思い_p108
        quote: 「私、妹がいるんですけど、とても頭が良くて頼りになる子だったんです。故郷ではいつも色んな事を教えて貰ってました。だから、お師様がひとつ年下だって分かって、少しだけ――ほんの少しだけですよ？　妹の事を思い出しました。それだけです」
        locator: {}
        spoiler_after: ch5134
      - event_ref: E_ch5134_アキラ_says_妹の死_p114
        quote: 「死にました」
        locator: {}
        spoiler_after: ch5134
      - event_ref: E_ch5134_アキラ_deceives_騎士団入りの理由_p119
        quote: 「地獄から遠隔召喚された異獣の群れに村が襲われて――私は運良く助かったのですが、妹はどうにもならなくて。そのことがあったから、私はこうして【騎士団】に入って異獣と戦う道を選んだんですけど」
        locator: {}
        spoiler_after: ch5134
      - event_ref: E_ch5134_アキラ_conceals_健気さの偽装_p124
        quote: 二人が口々に慰めたり励ましたりするのを、私は前向きな意思を語ってやり過ごす。健気さの偽装。白々しい、半分だけの嘘。
        locator: {}
        spoiler_after: ch5134
      - event_ref: E_ch5134_アキラ_thinks_ミルーニャへの恨み_p2
        quote: ああ、怖くてそれを言えなかった私を、ミルーニャは恨むだろうか。自分の身可愛さから仲間を犠牲にして恥じない、この愚か者を。
        locator: {}
        spoiler_after: ch5134
      - event_ref: E_ch5134_アキラ_observes_ハルベルトの自己批判_p31
        quote: 凄い、自分の事を棚に上げた。
        locator: {}
        spoiler_after: ch5134
      - event_ref: E_ch5134_アキラ_thinks_メイファーラの心持ち_p38
        quote: どこか他人事のようにメイファーラは口にする。実際、それなりに気楽なのだろう。もしかすると、そのくらいの心持ちでいるほうがいいのかもしれない。
        locator: {}
        spoiler_after: ch5134
      - event_ref: E_ch5134_アキラ_thinks_日常の転換_p48
        quote: 私はいつか妹と過ごしたあの日常を取り戻す為に非日常の戦場に身を投じた筈なのに――いつのまにか、私の日常はこの場所の方になってしまっていたのかもしれない。
        locator: {}
        spoiler_after: ch5134
      - event_ref: E_ch5134_アキラ_fears_非日常の取り込み_p50
        quote: ふと不安が頭をもたげる。それを手にしたあと、私はどうすべきなんだろう。取り戻した非日常を、私はもう一度日常に取り込む事ができるのだろうか――。
        locator: {}
        spoiler_after: ch5134
      - event_ref: E_ch5134_アキラ_asks_年齢_p54
        quote: 「そういえば、ちょっと気になってたんですけど、みんなお幾つなんですか？　私は三十二歳なんですが」
        locator: {}
        spoiler_after: ch5134
      - event_ref: E_ch5134_アキラ_thinks_ミルーニャの発言_p6
        quote: 何を言っているんだろうこの子は。もうしばらく黙ってれば良かったのでは。
        locator: {}
        spoiler_after: ch5134
      - event_ref: E_ch5134_アキラ_observes_年齢ギャップの凍結_p74
        quote: 時が凍り付いたと思う。え？　何、どういうこと？
        locator: {}
        spoiler_after: ch5134
      - event_ref: E_ch5134_アキラ_observes_年齢順位の逆転_p85
        quote: まさかのハルベルト最年少ミルーニャ最年長。私達は、まじまじと幼気な少女ふうの姿を見つめた。その童顔と自己申告された年齢のイメージが、どうしても噛み合わない。
        locator: {}
        spoiler_after: ch5134
      - event_ref: E_ch5134_アキラ_says_お師様が年下であること_p88
        quote: 「お師様が、年下――」
        locator: {}
        spoiler_after: ch5134
      - event_ref: E_ch5134_アキラ_says_年下への態度_p96
        quote: 「そんなこと、全然思っていません」
        locator: {}
        spoiler_after: ch5134
    action:
      observations:
      - event_ref: E_ch5134_アキラ_observes_ミルーニャとハルベルトの対立_p24
        quote: 張り詰めた空気が両者の間で架空の火花を散らす横で、私とメイファーラは「これおいしいね」「ねー」と精一杯の和やかさを演出していた。つらい。
        locator: {}
        spoiler_after: ch5134
      - event_ref: E_ch5134_アキラ_helps_会話の分断_p32
        quote: あまりにも二人の仲が悪すぎるものだから、私とメイファーラはそれぞれ二人に話しかけて、罵声が飛び交わないように気を配ることにした。この二人を会話させてはいけない。
        locator: {}
        spoiler_after: ch5134
      - event_ref: E_ch5134_アキラ_conceals_心_p52
        quote: ぼんやりとした思考を抱えながらも、私は表向きごく普通に振る舞っていた。食事をして、仲間と言葉を交わし、関係性を維持していく。心を、どこかに置いたまま。
        locator: {}
        spoiler_after: ch5134
  first_appearance_candidate: true
