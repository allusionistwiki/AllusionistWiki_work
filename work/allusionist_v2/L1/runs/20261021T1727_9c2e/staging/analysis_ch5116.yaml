  subject: '[[E_p117]]'
  object: '[[ME_infinite_loop_bug]]'
  claim: 「自殺の黒槍」による無限ループは、参照とコピーのプロセスにおける論理矛盾（AがA'と同一になることで正常終了しない）を、プログラミングの無限ループバグとして描いている。
  quote: 上書き処理の前に標的に傷が生まれているという異常。上書き処理を遅延させたままパラドキシカルトリアージによって負傷が修復され、それによって神滅具が正常に作動し、頭部に貫通創を上書きする。その傷を参照して、オリジナルとコピーが完全に同一である為に神滅具の処理は正常に終了できない。AとA'という結果を生み出すことがその役目であるのに、参照先は両方ともA'とA'だ。再びの修復と上書きを繰り返すが、何度やってもコピーをペーストしてそれをコピーして――その繰り返し。終わらない無限ループ。
  paragraph: p117
