entities:
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5400_アキラ_other_本質_p100
        quote: '競争者としてのイツノの気質。『サイバーカラテ道場』の本質。

          『ほどよいストレス』を求めていた怠惰な転生者としての俺の性格。'
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_時間_p103
        quote: 「トリシューラ、次のライブまで、少しだけ時間が欲しい」
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_ゼド_p131
        quote: 「久しぶりだな、盗賊王」
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_ゼドの存在_p145
        quote: 「お前はずいぶんと様変わりしたな。おおまかな状況は把握しているが、結局拡散したシナモリアキラは拡散したままなのだろう？　ここにいるお前は、正しくお前だと解釈してもいいのか？」
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_アイデンティティ_p147
        quote: 「好きなようにしろ。全て正解であり全て間違いだ」
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_挑戦_p15
        quote: 「上等だ」
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_asks_パイロマスターのスタイル_p152
        quote: 「お前のところ――『パイロマスター』ってグループ、サイン会とか握手会とか、ファンサービスみたいなイベント全然やらないよな。あれって何でだ？」
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_remembers_ゼドの過去_p169
        quote: '思い出すのは、かつて一度だけ聞いたこの男の過去。

          夜の病棟とゼドとの最初の邂逅。嘱託殺人者としてのもうひとつの顔。

          四英雄のひとりゼドの正体が『履行人』、あるいは『遊歩道』の異名を持つ伝説的な暗殺者であるという確証が得られるまでにはトリシューラでさえ多大な労力を要した。光の中に確かな足場を持ちながら、闇の底に出自を持つ男。'
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_fears_ゼド_p171
        quote: 『殺し屋』――その性質は違えど、俺の過去と似た顔を持っているこの男が、実のところ少しだけ苦手だった。恐れているといったほうが正確だろうか。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_殺し_p177
        quote: '俺がやっていた殺しは、多くは家族や本人からの依頼で行われるものだった。

          ゼドはそうした依頼も請け負うが、より範囲が広い。敵対勢力を切り崩すための謀略の一環として、あるいは力無き者に代わっての復讐として、殺しの理由は多種多様だと聞く。純度が低いというなら、詐欺師まがいの俺こそがそうだろう。'
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_挑発_p192
        quote: 「今ので腹が据わったよ。お礼に、あとで叩きのめしてやる。首洗って待ってろ」
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_独白_p204
        quote: はっきりとした意味がわからないながらも、どうしてかその独白がひどく印象に残った。暗く不吉な予感として。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_独りよがり_p211
        quote: だが――あれから幾度かの握手会を経て、『調整』を重ねた俺たちは今までとは違っている。握手会。ファンとの対峙。独りよがりな押しつけ――その克服。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_defines_神髄_p224
        quote: 'ファンの顔を見てニーズに応える。

          最適化こそ『サイバーカラテアイドル活動』の神髄である。'
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_不純な純粋さ_p226
        quote: だがそんな『不純』を貫くことこそが俺たちにとっての『純粋さ』であると、俺は確信している。猥雑な広告と情報の嵐、その繰り返しからの精練、観客にとって最も心地良い環境の構築。俺たちの『マジカルアピール』はこれで都合三度目。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_握手会の本質_p24
        quote: 'この一連の流れに慣れ始めている自分が恐ろしい。そもそもの話。

          ――これ、握手会か？'
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_observes_純粋さ_p257
        quote: '外では話している間に結果発表がされており、それはあちらも知る所であったはず。だというのに、あの夜の民の在り方は変わらない。

          闇に生きる種族は、それでも純度の高い輝きを保っていた。'
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_アイドルの在り方_p262
        quote: '揺るぎない純粋さ。それがアイドルであるということなのかもしれない。

          立体幻像に表示された勝利の文字を瞼に焼き付けて、幻像を消去する。

          この勝ちも、これから先の負けも、同じように受け止めて前に進む。

          そんなアイドルとして在り続けることが、できるだろうか。'
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_makes_両義肢握手_p3
        quote: 左右の義肢、両方と握手したいというファンの要望に応えよう。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_握手会定義_p56
        quote: 改めて疑問に思う。これ、握手会か？
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_頭痛・懸念_p66
        quote: '漏れ聞こえるファンの会話、お前ら大丈夫かと心配になる感じなんだがこういうのは本人はあまり関知しないほうがいいんだろうな。頭痛い。

          どちらかというと、マスコット系の受容をされている気がしなくもない。'
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_アイドルタイプ_p73
        quote: ステージに立つこと、アイドルとして上を目指すことを競技と捉えてひたすら自己鍛錬を繰り返すアスリートタイプ。観客の目を意識してより満足度の高いパフォーマンスで魅せようとするプロフェッショナルタイプ。アイドルという職業そのものへの憧れやその存在を全力で肯定できるナチュラルボーンタイプ。もてあました自我を誇示することで承認を得て、ファンとの疑似的な互恵関係を築く反転したナルシストタイプ。どれかひとつのタイプというわけではなく、これらが複合していることもよくある。さて、俺は――というか、俺たちはどれだろう？
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_asks_トリシューラ_p75
        quote: 「なあトリシューラ。これでいいのかな」
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_交流_p86
        quote: 対して俺は、ファンを楽しませてはいるもののあくまでも『芸』による身体的なおもしろさ、刺激、アトラクションとしての快楽だけで握手をこなしている。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_正解_p87
        quote: '本当にこれでいいのか――その問いは常につきまとう。

          既に行動に移しているからこそ、それが正解なのかどうか不安で仕方が無くなってしまう。なにしろ保証してくれるものは何も無い。成功するにせよ失敗するにせよ、時間は等速で過ぎていくだけだ。'
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_厄介な相手_p9
        quote: 少し厄介な相手だと、普通に握手を求めたあとに仕掛けてくるタイプがいる。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_闘争の楽しさ_p98
        quote: '困難な状況に置かれているにもかかわらず、トリシューラは弾むようにそう言った。俺の心もまた踊るように軽い。先の見えない道行きの不確かさ、足下のおぼつかなさ、その危うさがどうしてか愉快でならない。

          これはきっと闘争の楽しさだ。'
        locator: {}
        spoiler_after: ch5401
    action:
      observations:
      - event_ref: E_ch5400_アキラ_other_ゼド_p109
        quote: 自分の中で方針を固める前に、会っておきたい相手がいた。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_ファンサービス_p17
        quote: 『求められているパフォーマンス』を即座に察した俺はアイドルとしてファンサービスを実行する。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_defeats_巨漢_p18
        quote: 狙うは相手の親指と小指。流れる水が形を変えてするりと動き、指関節を開くように捻って相手の痛覚を刺激する。一瞬だけ生じた相手の隙は逃さない。左右の手で包み込んだ相手の腕を可動域とは逆の外側へと強引に回転させる。機械義肢と流水義肢の馬力頼みの強引な護身術だが、巨漢はたまらずに真横によろめき、うめき声をあげて膝をついた。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_uses_両義肢握手スタイル_p2
        quote: 左手で迎え入れ、右手で上から包み込む。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_マジカル・アピール_p208
        quote: '「マジカル・アピール！」

          トリシューラの叫びと共に、『杖』のドレスが開花する。

          俺たちは再び対決の舞台に立ち、音楽に乗せた必殺のアピールを繰り出そうとしていた。'
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_カスタマイズ幻像_p217
        quote: 'だがそれと同時、観客たちの目の前に立体幻像の窓が幾つも表示されていく。

          『この銃撃を受けた人は、こんなレーザーでも焼かれています』『オススメの暴力はこれ！』『あなたのお暴力傾向から』『よく一緒に使用されるサブウェポン』『この兵装のレビューはこちらから』'
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_ライブ対決_p237
        quote: 朗らかなトリシューラの声と俺の「発勁用意」という叫びが重なり、阿鼻叫喚の地獄絵図が地下空間に現出する。より効率的に殺戮を実行した俺のバトルドレスがステージを廃墟へと変貌させ、音楽の終了と共に死の静寂が降りてくる。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_ラリスキャニア_p241
        quote: ステージを降りた俺は、通路で待ち構えていたラリスキャニアと顔を合わせることになった。互いにやるべきことは終わっている。あとは結果を待つだけだ。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_前へ_p263
        quote: 試すように、一歩を踏み出した。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_uses_暴力_p33
        quote: 俺たちのアピールが『暴力』によって成り立つものである以上、その握手会もまたそうした性質を持つことは避けられない。その結果がこれだ。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_腕相撲連戦_p34
        quote: 右腕が激流となって荒れ狂い、波濤の如き勢いで巨漢の手の甲を机に叩きつける。腕相撲で連戦連勝するのにも飽きてきた頃合いだが、握手会場はヒートアップするばかりだ。なにしろここには腕自慢の荒くれものばかりが押し込まれている。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_defines_握手会基本スタイル_p4
        quote: そんな思いからこのようなやり方が握手会の基本スタイルとなった。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_地下刑務所_p41
        quote: ――俺たちを除いては。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_荒っぽいアピール_p48
        quote: 俺は次々と『襲いかかってくる』ファンたちを相手に手を握り潰したり投げ飛ばしたり関節を極めたり力比べのすえ押し返したり腕相撲を延々繰り返したりといった荒っぽいアピールをやらされる羽目になった。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_表情筋_p5
        quote: 『相手にとっての最適な笑顔』を形成していく。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_他の握手会_p55
        quote: いちおう、他のアイドルたちの握手会を事前にリサーチして予習はしておいたのだ。その中にこんな握手をしているアイドルはいなかった。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_グッズ_p62
        quote: 併設されたブースには各種グッズが置かれており、物販はそれなりに盛況だった。『サイバーカラテ道場』とコラボしているので俺自身の信仰も集まり一石二鳥である。むしろこのアイドル路線で紀人として登りつめるのも『あり』ではないかと思えてくるほどだ。実際かなり有効なアプローチで前例が幾つもあるらしい。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_握手会_p7
        quote: 表向き、握手会はスムーズに進んでいた。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_other_判断_p92
        quote: トリシューラの言うとおり、基本的に俺は全ての判断を彼女に預けている。
        locator: {}
        spoiler_after: ch5401
    visual:
      observations:
      - event_ref: E_ch5400_アキラ_other_握力_p12
        quote: 剛腕が生み出す強烈な握力に、腕の表面が波打った。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_observes_敵意_p13
        quote: この男、間違いなく俺の手を握りつぶそうとしている。相手の顔を見返すと、歯を見せて獰猛に笑っていた。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_アキラ_observes_手の多様性_p5
        quote: 目の前を通り過ぎていく手のかたちは様々で、種族差のみならず個人差だけでも千差万別。形と感触、熱意と勢い、好意から悪意まで、ありとあらゆる握手のパターンに応じて表情筋を制御、『相手にとっての最適な笑顔』を形成していく。
        locator: {}
        spoiler_after: ch5401
  first_appearance_candidate: true
- canonical_target: '[[E_char_トリシューラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5400_トリシューラ_other_時間_p105
        quote: 「いいよ。私はそれまで色々準備しておくから」
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_トリシューラ_other_アキラ_p43
        quote: （最初はこのくらい荒っぽいのが丁度いいよ。アキラ姫、がんばってね）
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_トリシューラ_other_握手会_p52
        quote: （いいのいいの！　これも握手会だよ、アキラ姫！）
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_トリシューラ_other_方針_p80
        quote: 「お前のプロデュース方針が間違っているとは思わない。きぐるみ妖精のブランドイメージを押し出すという点ではこれで正しいと思う」
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_トリシューラ_other_欠点_p82
        quote: '「けど、ラリスキャニアが指摘した『独りよがり』って欠点はそのままじゃないかって、姫は言いたいんだね？」

          そうなのだ。'
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_トリシューラ_other_迷い_p90
        quote: 「アキラ姫の迷いはわかるよ。なまじ矢面に立って『アイドル』を『創造（クラフト）』しているから、余計に不安になるだろうし」
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_トリシューラ_other_自由意思_p94
        quote: トリシューラは思考の苦痛と決断の重みを引き受けてくれるが、俺の自由意思までは奪っていない。それは痛み以外の快楽を生みもするからだ。
        locator: {}
        spoiler_after: ch5401
      - event_ref: E_ch5400_トリシューラ_other_吟味_p96
        quote: 「もっと迷っていいよ、アキラ姫。選択肢はきっと沢山ある。考えて考えて、今より素敵な道が無いかどうか、吟味してみよう」
        locator: {}
        spoiler_after: ch5401
  first_appearance_candidate: true
