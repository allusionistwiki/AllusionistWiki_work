- kind: mystery
  name: MY_third_force_identity
  note: 第五階層を掌握し、両勢力に不干渉を強いた謎の第三勢力（人狼/高位呪術師）の正体と目的。彼らが『上方』でも『下方』でもない立場をとる理由。
  quotes:
  - quote: この時節に貴方が介入するとは予想外でした。いったい貴方は上方勢力と下方勢力、どちらに付くつもりなのですか？
    paragraph: p160
    quote_verified: true
  expected_payoff: 最終的に、両勢力の対立構造を解体し、より高次の秩序（あるいは無秩序）へと物語を導くキーとなる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
