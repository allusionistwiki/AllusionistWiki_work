- kind: mystery
  name: MY_zeotia_etymology_meaning
  note: この世界を多くの異世界が『ゼオーティア』と呼ぶことの意味。「普遍」「ありふれたもの」という定義が、多世界構造の中でどのようなメタ的な地位を示すか。
  quotes:
  - quote: どのような言語に由来するのかは判然としないが、その意味だけははっきりしていた。 普遍。あるいは、ありふれたもの。
    paragraph: p226
    quote_verified: true
  expected_payoff: 物語全体が「ありふれた」テンプレの再帰的な破壊であることを示すメタフィクションの鍵となる。
