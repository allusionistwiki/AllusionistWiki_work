  review_status: unreviewed
- kind: mystery
  name: MY_dylau_survival
  note: ダイロが氷槍で保護されたが、機竜の内部で何を成し遂げたのか、また彼が生還後にどのような存在に変化した（または記憶を喪失した）かが未定。
  quotes:
  - quote: 氷がひび割れて、少年と少女の間を遮るものがなくなる。「最初から【氷槍】を発動して彼の命は守るつもりだった。愛する者同士が引き裂かれるのは、見ていられない」
    paragraph: p185-187
    quote_verified: true
  expected_payoff: ダイロとクィの再会による竜神信教内部での派閥闘争、またはダイロ自身が新たな「機竜」として覚醒する展開。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
