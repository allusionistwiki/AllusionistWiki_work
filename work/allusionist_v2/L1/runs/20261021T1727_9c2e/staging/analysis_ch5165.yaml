- kind: mystery
  name: MY_soloda_neck_marks
  note: ソルダの首筋に現れた「噛み痕」のような呪力の糸。これが誰との契約、あるいは過去の死・転生に関わる痕跡なのか示唆している。
  quotes:
  - quote: その首筋から微かな呪力が漏れていることに気がつく。どこに繋がっているのか、虚空のある一点で消失するか細い呪力の糸。まるで噛み痕のように淡く光る、首筋の二つの点。
    paragraph: p191
    quote_verified: true
  expected_payoff: ソルダが「転生者」であること、または彼が契約している上位存在（吸血鬼的要素や悪魔的契約）との関係性が明かされる伏線。
