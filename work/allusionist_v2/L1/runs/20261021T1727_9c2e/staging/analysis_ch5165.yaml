- kind: theme
  theme: メタフィクションとしての英雄譚：物語的な「引喩（アリュージョン）」によって現実をねじ曲げ、空想を現実に実体化させる行為の権能化。
  weight: 0.9
  quotes:
  - quote: 初代松明の騎士である大フォグラントの存在を参照し、その威光を纏って戦う引喩（アリュージョン）系神働術――たった300秒ですが、彼はその間だけ真の英雄となる。空想（おとぎばなし）の勇士を現代に甦らせる聖なる祭祀
    paragraph: p149
    quote_verified: true
  note: タイトルである「アリュージョニスト」が指す核心。物語の文脈（神話・伝説）を参照し、それによって物理法則を上書きする行為が、戦闘の解決手段として提示されている。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 技術と呪術の境界消失：異世界の「知識（技術）」が「呪術（信仰）」によって補完され、機械生命体が生まれる構造。
  weight: 0.7
  quotes:
  - quote: それは機械。鎧のような鱗、無機的でありながら有機的なしなやかさを併せ持つ高度な杖の技術。……異世界の知識が詰め込まれた墓標船を利用すれば、可能性はあるのだ。
    paragraph: p37-43
    quote_verified: false
  note: SF的要素（機械）とファンタジー的要素（呪術・信仰）の融合。技術の転移が単なる便利さではなく、世界の歪み（機竜の暴走など）を生む要因として描かれている。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 「最弱」の逆説：ステータス上の弱さが、物語的な役割（希望を掲げる者）によって絶対的な勝利に転換される構造。
  weight: 0.8
  quotes:
  - quote: 誇れるのは勇気と機知のみ――しかし制限を解除し、その真なる能力のひとつを解放したわがあるじは無敵です。最弱という二つ名には続きがある。すなわち、最弱にして常勝。曰く、地上にとっての無限の希望であり地獄にとっての真なる絶望。
    paragraph: p145-147
    quote_verified: false
  note: 数値的な強さではなく、「物語上の立ち位置」が戦闘を決定するという、異世界転生ジャンルにおける「チート能力」の本質をメタ的に解説する主題。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 自己犠牲の無意味化と救済：悲劇的な死（ダイロの献祭）が、ソルダの介入によって喜劇的な生還に書き換えられる過程。
  weight: 0.6
  quotes:
