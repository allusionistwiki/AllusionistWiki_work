- kind: mystery
  name: MY_命脈の呪石の量産と不死の普及
  note: ミルーニャが量産を宣言した「命脈の呪石」による擬似的な不死性が、世界全体にどのようなカオス（人口爆発、価値観崩壊）をもたらすか。また、これが本当に可能なのか。
  quotes:
