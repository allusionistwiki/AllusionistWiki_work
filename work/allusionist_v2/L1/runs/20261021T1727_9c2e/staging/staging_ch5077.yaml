- canonical_target: '[[E_char_キロン]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5077_キロン_asks_アキラ_p14
        quote: 「いいや。それより答えを聞こうか。シナモリ・アキラ、君は俺と共に来るつもりはあるか？」
        locator: {}
        spoiler_after: ch5078
      - event_ref: E_ch5077_キロン_says_アキラ_p25
        quote: 「そうか。――そうか！　安心したよ、アキラ。君は俺を信じてくれるのだな。よしわかった、君が決意してくれたのならば、俺は必ず君を守り抜くと約束――」
        locator: {}
        spoiler_after: ch5078
  first_appearance_candidate: true
- canonical_target: '[[E_char_白い少女]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5077_白い少女_appears_アキラ_p149
        quote: '白い少女だった。

          フリルがふんだんに用いられた華やかな衣服。大きな鍔が広がる帽子も白なら、パニエで膨らんだスカートも、そこから伸びる脚を包むタイツもまた白。

          流れる髪の色素は薄く、輝くような金の色。

          冷ややかな瞳が、凄絶な圧力を伴ってこちらを見据えている。'
        locator: {}
        spoiler_after: ch5078
    action:
      observations:
      - event_ref: E_ch5077_白い少女_has_property_不動の防御力_p161
        quote: 地を割り砕く威力の蹴りをまともに側頭部に受けて、白い少女は微動だにしていなかった。
        locator: {}
        spoiler_after: ch5078
      - event_ref: E_ch5077_白い少女_attacks_アキラ_p170
        quote: '細い、あまりに小さな繊手が、俺の腹部に突き刺さる。

          「がっ」

          咄嗟に後ろに跳んで衝撃を軽減する。正面から受けて耐えるという選択肢は、直感的に避けていた。

          そうでなくても信じがたいほどの打撃力。俺の身体はそのまま宙に浮き、床を転がっていく。'
        locator: {}
        spoiler_after: ch5078
      - event_ref: E_ch5077_白い少女_has_property_眼球防御_p184
        quote: '眼球に命中した刃が砕けるだと？

          「馬鹿が。そこは私の最も強固な部位だ」'
        locator: {}
        spoiler_after: ch5078
    speech:
      observations:
      - event_ref: E_ch5077_白い少女_says_アキラ_p177
        quote: 「打撃など無意味だ。誰も、私の世界を傷つける事はできない」
        locator: {}
        spoiler_after: ch5078
  first_appearance_candidate: true
