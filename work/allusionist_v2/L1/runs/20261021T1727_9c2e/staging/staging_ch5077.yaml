- canonical_target: '[[E_term_少年]]'
  entity_type: terminology
  aspects:
    action:
      observations:
      - event_ref: E_ch5077_少年_saves_キロン_p106
        quote: 一方で、キロンの方はその前に進み出た少年の一人が防御することによって傷一つ無いままだった。少年がかざした手の先に、何か不可視の障壁のようなものが生み出されているようだった。
        locator: {}
        spoiler_after: ch5078
    speech:
      observations:
      - event_ref: E_ch5077_少年_says_キロン_p27
        quote: 「お待ち下さい、お兄様」
        locator: {}
        spoiler_after: ch5078
      - event_ref: E_ch5077_少年_says_アキラ_p35
        quote: 「策略です。その方は嘘を吐いています」
        locator: {}
        spoiler_after: ch5078
      - event_ref: E_ch5077_少年_has_property_読心術_p43
        quote: （読心術とかはシューラがシャットアウトしてるから多分違うよ！　多分霊感系、ううん、あれは託宣――？　あんなのデータには無かったのに！）
        locator: {}
        spoiler_after: ch5078
  first_appearance_candidate: true
- canonical_target: '[[E_char_トリシューラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5077_トリシューラ_thinks_自走機銃の暴走_p110
        quote: （違う！　これシューラが指示したんじゃないよ！　コントロールを乗っ取られてる！）
        locator: {}
        spoiler_after: ch5078
      - event_ref: E_ch5077_トリシューラ_has_property_偽装死体作成能力_p53
        quote: なにせ呪術医である。部屋にあった大量の人体部位からも分かるとおり、巡槍船には生体部品の備蓄があるのだという。何に使うのかはまあ、想像がつくのであえて訊ねなかったが。
        locator: {}
        spoiler_after: ch5078
      - event_ref: E_ch5077_トリシューラ_thinks_迷宮化_p77
        quote: （何これ――信じられない、階層そのものを、局所的にとはいえ改変してるの？　そんな、私の支配を上書きしての【迷宮化】なんて！）
        locator: {}
        spoiler_after: ch5078
  first_appearance_candidate: true
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5077_アキラ_says_キロン_p12
        quote: 「悪いな、少し待たせたか」
        locator: {}
        spoiler_after: ch5078
      - event_ref: E_ch5077_アキラ_says_キロン_p18
        quote: 「ああ。俺は【松明の騎士団】に身を寄せる事に決めた。やっぱり、恩人と――アズーリアと敵対なんて俺にはできない。それに、こんな危険極まりない場所で生活するのもいい加減しんどかったしな」
        locator: {}
        spoiler_after: ch5078
      - event_ref: E_ch5077_アキラ_thinks_白い少女_p188
        quote: （最悪っ！　このコ、セスカと同じ邪視者だっ）
        locator: {}
        spoiler_after: ch5078
      - event_ref: E_ch5077_アキラ_thinks_読心術_p41
        quote: 【E-E】と【七色表情筋トレーニング】を同期させての完璧な演技も、呪術による読心術までは誤魔化せなかったということらしい。【サイバーカラテ道場】と【Doppler】を即座に起動したことによって【七色表情筋トレーニング】が自動終了。戦闘態勢に移行する。
        locator: {}
        spoiler_after: ch5078
      - event_ref: E_ch5077_アキラ_thinks_第二プラン_p46
        quote: まあ失敗したものは仕方が無い。第二プランで行こう。
        locator: {}
        spoiler_after: ch5078
      - event_ref: E_ch5077_アキラ_thinks_キロン_p62
        quote: まるで、未だに事実を認められず、こちらを信じようとしているかのような。
        locator: {}
        spoiler_after: ch5078
      - event_ref: E_ch5077_アキラ_thinks_キロン隊の構成員_p8
        quote: （データに無いけど、多分キロン隊の構成員だと思う。――どうする、一旦退いて作戦練り直す？）
        locator: {}
        spoiler_after: ch5078
      - event_ref: E_ch5077_アキラ_says_キロン_p95
        quote: 「やっぱ最初からこういう手筈か」
        locator: {}
        spoiler_after: ch5078
    action:
      observations:
      - event_ref: E_ch5077_アキラ_attacks_白い少女_p156
        quote: '相手の身長は俺の腹部のあたりまでしかない。この体格差を生かさない理由は無い。一切の躊躇無しに頭部へと全力の蹴りを浴びせる。

          殺す気で仕掛けた。'
        locator: {}
        spoiler_after: ch5078
      - event_ref: E_ch5077_アキラ_attacks_白い少女_p180
        quote: 受け身を取りながら腰の収納に手を伸ばす。トポロジー的に圧縮された空間から投げナイフを指先で抜き取り、投擲。鋭利な刃が回転しながら少女の最も脆いと思われる急所に吸い込まれていく。
        locator: {}
        spoiler_after: ch5078
      - event_ref: E_ch5077_アキラ_finds_キロン_p3
        quote: 待ち人を見つけた時、その場所にいたのは彼一人きりではなかった。
        locator: {}
        spoiler_after: ch5078
      - event_ref: E_ch5077_アキラ_other_地震_p68
        quote: はじめは小さく、やがては激しく、縦にガタガタと揺れ動くその現象は、この世界に来て初めて体験する地震だった。
        locator: {}
        spoiler_after: ch5078
  first_appearance_candidate: true
