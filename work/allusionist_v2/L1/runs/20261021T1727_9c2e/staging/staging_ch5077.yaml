        locator: {}
        spoiler_after: ch5078
      - event_ref: E_ch5077_キロン隊の構成員_has_property_美少年_p6
        quote: 背丈はかなり低い。兜を後ろに跳ね上げているおかげでその容姿が露わになっているが、とんでもない美しさだった。いずれも煌めくような紅顔の美少年で、唇をきりりと引き結んで、俺を劇物か何かのようにして睨み付けている。
        locator: {}
        spoiler_after: ch5078
  first_appearance_candidate: true
