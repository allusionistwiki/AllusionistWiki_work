- kind: mystery
  name: ミヒトネッセの正体と目的
  note: 「変異の三手」の残党であり、ラクルラール関係者である少女。なぜ主人公（アキラ）に強い敵意・対抗心を抱き、「アダム・カドモン」の座を争うのか。その背景にある思想や組織の目的が未回収。
  quotes:
  - quote: 「私が奪う未来の座は、四魔女じゃなくてその使い魔ってことよ、悪魔！」
