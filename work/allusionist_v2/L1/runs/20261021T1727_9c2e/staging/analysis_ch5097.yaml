- kind: theme
  theme: 情報の漂流と存在の再構成：転生事故による「情報体」の流出を、データとして蓄積・再構成する技術的な視点から見た魂と記憶のあり方。
  weight: 0.6
  quotes:
  - quote: そうして外の世界から漂着した情報構造体は古来より【墓標船】と呼ばれ、有益か無益かを問わず様々な情報をこの世界にもたらしてきた。【星見の塔】の技術をもってすれば、【墓標船】内部に蓄積されたデータから同一の存在を再構成することも不可能ではない。
    paragraph: p21
    quote_verified: true
  note: 魂や人格がデジタルな情報構造として扱われ、「沼男」のような再構成された存在を生み出す基盤。
