- kind: theme
  theme: 生命の物象化とペット飼育の倫理：転生者（人間）を「使い魔」「模型」「人形」として扱い、その存在価値を操作・所有しようとする権力構造。
  weight: 0.75
  quotes:
  - quote: これは外宇宙の生物をペットにするのにも等しい行為だ。どんな風に名前を呼んであげるのがいいだろう。呼び捨て？ それとも愛称？ 『彼』の母語は敬称が豊富だ。
    paragraph: p35-p37
    quote_verified: true
  - quote: 気がつけば幾つもの着せ替え人形が出来上がり、丁度良いとばかりにそれらを相手に主従関係の予行練習を行う始末。それが幼少期に通り過ぎたはずのおままごとの延長だと気付いて、遠い記憶、『姉』と共に空想の中で戯れたことを思い出す。
    paragraph: p40-p42
    quote_verified: true
  note: 人間関係が玩具（模型・人形）やペット飼育のレベルにまで矮小化・物象化されていることの描写。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
