      observations:
      - event_ref: E_ch5429_邪視者_defines_魅力を持つ者_p17
        quote: 'ゆえに小鬼に堕ちることを望まない邪視者は他者に己の傲慢を承認させようとする。必要なのは他者との調和、妥協、あるいは協力の強制、それとわからぬような洗脳、誘導。人を惹きつけ納得させる程の強烈なカリスマ。

          魅力を持つ者、すなわち邪視者（ファシネイター）。'
        locator: {}
