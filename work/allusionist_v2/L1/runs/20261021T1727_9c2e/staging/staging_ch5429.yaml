- canonical_target: '[[E_term_魔竜レーレンターク]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5429_魔竜レーレンターク_defines_関係性の使い魔_p191
        quote: '「あれは多分、異邦の神なんだよ。より厳密には異邦の文明を私たちの文明が征服するという――破壊と創造を伴う接触現象そのもの」

          「うん、そうなんだと思う。あれは私たちの中に在る。正確には、私たちとカーティスたちとの関係性の狭間に存在する『使い魔』なんだ」'
        locator: {}
        spoiler_after: ch5429
      - event_ref: E_ch5429_魔竜レーレンターク_defines_罪_p208
        quote: 'これは『人類（ロマンカインド）』に由来する『自然現象』に他ならない。

          誰もが持ち、誰もが恐れ、誰もが知らずに抱えこまざるをえない、生命現象と意識現象に付随する普遍的な痛み。

          ならばその根本言理を形容する答えはひとつ。

          「魔竜とは、『罪』」'
        locator: {}
        spoiler_after: ch5429
    action:
      observations:
      - event_ref: E_ch5429_魔竜レーレンターク_other_高鳴き声_p217
        quote: '終幕の訪れを予感したかのように、魔竜が一層かん高い声で鳴き叫んだ。

          ちゅー、ちゅー。'
        locator: {}
        spoiler_after: ch5429
  first_appearance_candidate: true
- canonical_target: '[[E_char_リールエルバ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5429_リールエルバ_uses_ドラマ仕立てアピール_p23
        quote: ドラマ仕立てのアピールが強調するのは暗い負の感情と穴に突き落とされる場面から始まる物語。美しい弱者や可憐な敗者が上を目指して抗う姿はいつの世も人の心を捉えて離さない。コルセスカの圧倒的輝きを前提とした魅力の利用。これも協力の強制。そして呪文による物語構築だ。
        locator: {}
        spoiler_after: ch5429
      - event_ref: E_ch5429_リールエルバ_other_同時演技_p5
        quote: 時間の前後すらあやふやなこの世界において、滑走順などあってないようなもの。全く同時に演技を開始した両者は、お互いの表現を塗りつぶすようにして自己の存在を主張していく。
        locator: {}
        spoiler_after: ch5429
      - event_ref: E_ch5429_リールエルバ_uses_コウモリの群_p7
        quote: 光の軌跡を残して舞うコルセスカの滑りを、リールエルバの背後から放たれたコウモリの群が覆い隠す。マジカルアピールによる相手のアピールの封殺は、競い合いという形式すら放棄した陰惨なつぶし合いに等しい。
        locator: {}
        spoiler_after: ch5429
    symbolic:
      observations:
      - event_ref: E_ch5429_リールエルバ_has_property_呪文と使い魔の技量優位_p25
        quote: '四大系統で言えば邪視が七、使い魔が三という配分の技術であり、邪視で負けているリールエルバはこの点で不利と言える。だがその逆も然り。

          呪文と使い魔の技量ではリールエルバはコルセスカの上を行く。'
        locator: {}
        spoiler_after: ch5429
    relationship:
      observations:
      - event_ref: E_ch5429_リールエルバ_is_made_of_トリシューラの裏返し_p35
        quote: ある意味でリールエルバはもうひとりのトリシューラだ。その出自も運命も、在り方も渇望も。人工姉妹トリシルシリーズとして定められたコンセプトやデザインすらも。
        locator: {}
        spoiler_after: ch5429
  first_appearance_candidate: true
- canonical_target: '[[E_char_シナモリアキラ]]'
  entity_type: character
  aspects:
    relationship:
      observations:
      - event_ref: E_ch5429_シナモリアキラ_is_made_of_トリシューラの使い魔_p37
        quote: 彼が協力を強制されることを防げなかったのは、彼自身がそれを望んでしまったから。彼がどうしようもなくトリシューラの『使い魔』であったからだ。
        locator: {}
        spoiler_after: ch5429
  first_appearance_candidate: true
- canonical_target: '[[E_item_鮮血の剣]]'
  entity_type: item
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5429_鮮血の剣_defines_王権の呪い_p44
        quote: ダモクレスの剣すら砕いてみせたそれは、鮮血呪の応用形でありトリシューラの王権でもある呪いの形だ。決意を手にした魔女は、迫り来るシナモリアキラたちを無造作に斬り伏せていく。
        locator: {}
        spoiler_after: ch5429
  first_appearance_candidate: true
- canonical_target: '[[E_term_チョコレートリリー空組]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5429_チョコレートリリー空組_uses_圧縮言語猫語_p64
        quote: 'ただちに圧縮言語による思念会議が行われた。

          「にあ。にあにあにあ。にーあにあ」「にー？」「にあ！」「にゃおーん」「みあーおう」

          圧縮言語は猫語とも呼ばれ、『星見の塔』で思念通信を行う際に多用される異界の動物会話技術である。暗号じみたやりとりは思念盗聴対策であるが、このままでは理解できないため、表記する場合は理解可能な形に翻訳するのが普通だった。'
        locator: {}
        spoiler_after: ch5429
  first_appearance_candidate: true
- canonical_target: '[[E_char_セリアック＝ニア]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5429_セリアック＝ニア_reveals_法の剣の使命_p69
        quote: 『法の剣』たるファナハード公家の聖姫にはドラトリア王が暴虐をもって民を支配した時、王を討ち滅ぼす使命があるのだという。慈悲の名の下に振るわれる愛の御手、救世主の資格たる肉球と爪を組み合わせた祈りは孤独な病人を癒し、穢れを濯ぐ。『夜』と『昼』、貴と卑、聖と俗、壁の内と外。あらかじめ分断を内包した歪な国の秩序を保証してきたのはこの安全弁の存在だった。
        locator: {}
        spoiler_after: ch5429
      - event_ref: E_ch5429_セリアック＝ニア_other_姉の思い通りになること_p78
        quote: '「今はそれで全部終わりにするつもりはありません。だって姉様はセリアのことをわかってます。このままだと姉様の思い通りです。セリアは、それが嫌です」

          それはセリアック＝ニアが見せた明確な、そしておそらく初めての反抗だった。'
        locator: {}
        spoiler_after: ch5429
      - event_ref: E_ch5429_セリアック＝ニア_other_リールエルバの行動_p82
        quote: '「重要なのは、討ち滅ぼされる王が同時に弱者でもあるという構図です。暴虐に抵抗するための秩序の剣は、時に暴力に訴えざるを得なかった者を正義の名の下に抑え付けるもう一つの暴力である――姉様がこの舞台を整えてまで再演したかったのは、加害と被害の両義性、あるいは双方向性です。姉様はおおむねこのように考えているはずです。セリアはそう思います」

          リールエルバの行動は運命に対する諦観に規定されたものだという。

          聖姫は狂姫にとって唯一無二の代弁者。その言葉には確かな信憑性があった。'
        locator: {}
        spoiler_after: ch5429
    action:
      observations:
      - event_ref: E_ch5429_セリアック＝ニア_other_宿命への動機_p97
        quote: 'セリアック＝ニアは既に新たな決意を胸に抱いていた。

          破滅的な役割に殉じるのではない。

          新しく築き上げた関係性から生じた動機。聖なる姫という役割に由来しない感情に従って、自分たち姉妹の宿命を変えようとしているのだ。'
        locator: {}
        spoiler_after: ch5429
  first_appearance_candidate: true
- canonical_target: '[[E_char_ミルーニャ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5429_ミルーニャ_other_対抗呪文_p87
        quote: '「『昼』と『夜』の対立は国家（かぞく）で殺し合う狂気の沙汰。あなたたちを亡き者にして国内の分断を図ろうとした勢力に対する対抗呪文（ものがたり）というわけですね」

          ミルーニャは冷静に分析するが、その口調は険しい。とても納得している様子ではなかった。'
        locator: {}
        spoiler_after: ch5429
  first_appearance_candidate: true
- canonical_target: '[[E_char_リーナ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5429_リーナ_other_犠牲の道筋_p91
        quote: 「ニアちゃんとリールエルバにそんな事はさせらんないよ！　みんなが無事でいられる道がどこかにある、無かったら見つける！　てか最初に二人をカルト教団だかに襲わせた連中が一番悪いじゃん！　絶対許せないよ！」
        locator: {}
        spoiler_after: ch5429
  first_appearance_candidate: true
