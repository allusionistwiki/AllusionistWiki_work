entities:
- canonical_target: '[[E_char_コルセスカ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5429_コルセスカ_uses_氷晶カウンター_p10
        quote: '竜巻のように激烈なスピンと共にスケート靴が周囲の穢れをまとめて切り刻み、冬の旋風と化した氷晶が舞い上がって夜天を彩る星となる。

          闇を前提とした光のイメージをマジカルアピールに組み込む即興のカウンター。'
        locator: {}
        spoiler_after: ch5429
      - event_ref: E_ch5429_コルセスカ_other_共演強制_p13
        quote: 'コルセスカが行ったのは一種の共演強制だった。

          ゆえに小鬼に堕ちることを望まない邪視者は他者に己の傲慢を承認させようとする。必要なのは他者との調和、妥協、あるいは協力の強制、それとわからぬような洗脳、誘導。人を惹きつけ納得させる程の強烈なカリスマ。

          コルセスカがやったのは協力の強制と魅力的演技の複合呪術だった。敵対者の世界観を自分なりに解釈して最適な形に落とし込み、その上で自分の世界を魅せる。'
        locator: {}
        spoiler_after: ch5429
      - event_ref: E_ch5429_コルセスカ_fights_リールエルバ_p26
        quote: 雪解けの泥と化した夢世界。二人の魔女はどちらが真の主神に相応しいかを定めるため、狂ったように踊り続けた。
        locator: {}
        spoiler_after: ch5429
  first_appearance_candidate: true
- canonical_target: '[[E_char_トリシューラ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5429_トリシューラ_transforms_黒い夜会服_p103
        quote: '黒い靄が三次元的に躍動し、漆黒の羽衣のようにトリシューラを飾る。ヒントはアイドルとして対決した夜の民モデル、スマルトから。光学的アプローチによる幻影のファッション。トリシューラは返り血と瘴気で身を汚しながらも、その醜悪さを着こなそうとしている。

          黒ずんだ血霞を裂いて、トリシューラの衣装が更新された。変幻する体表面テクスチャ。'
        locator: {}
        spoiler_after: ch5429
    speech:
      observations:
      - event_ref: E_ch5429_トリシューラ_other_ライブ計画_p113
        quote: '「私たち三人で」「ライブをする、ですか」「にあ？」

          「そう。ついでに言えば、セスカと私も、だけどね」'
        locator: {}
        spoiler_after: ch5429
      - event_ref: E_ch5429_トリシューラ_other_魔竜の正体影_p137
        quote: '「けど、このやり方では魔竜の本質には届いていないんだ。なぜならここにあるのは、魔竜の影だから」

          彼女の理解によれば、ここで魔竜と戦っても勝利を得ることは不可能だ。なにせ魔竜はここにはいないのだから。'
        locator: {}
        spoiler_after: ch5429
      - event_ref: E_ch5429_トリシューラ_other_シナリオとしての苦しみ_p216
        quote: 'その答えは奇しくもトリシューラに突きつけられた問い、そしてシナモリアキラが懊悩し続けた不可避の苦しみそのものだった。

          「奇しくもじゃない。そういうシナリオなんだ、これは」

          静かな言葉に怒りを潜ませて、トリシューラはそっと呟いた。魔女の瞳、邪視を宿さぬはずの緑色の目が淡い輝きを宿す。'
        locator: {}
        spoiler_after: ch5429
      - event_ref: E_ch5429_トリシューラ_says_リールエルバへの複雑な感情_p33
        quote: 「嫌いだけど嫌いじゃないし、好きだけど好きじゃない、みたいな感じかな。あの子は私の裏返しだから」
        locator: {}
        spoiler_after: ch5429
      - event_ref: E_ch5429_トリシューラ_other_シナモリアキラたち_p46
        quote: 「始祖吸血鬼のアキラくんとか、カシュラムの我神十ニ限界とか、揃いも揃ってやることがマレブランケの猿真似だなんて創意工夫が足りなさすぎる」
        locator: {}
        spoiler_after: ch5429
      - event_ref: E_ch5429_トリシューラ_other_シナモリアキラの最適使用者_p51
        quote: '「やっぱり下手っぴには任せらんないなー。どう考えてもアキラくんを一番上手く使えるのは私なんだもん」

          調子が出てきた。トリシューラはノっている。苦難も試練も全ては乗りこなすべき絶好の波だ。いま私は最高に気分がいい。'
        locator: {}
        spoiler_after: ch5429
      - event_ref: E_ch5429_トリシューラ_other_心話チャンネル接続_p55
        quote: 「いよっし。それじゃあちょっと作戦会議しよう。そこのチョコリリ組、『心話』のチャンネル繋いでくれる？」
        locator: {}
        spoiler_after: ch5429
      - event_ref: E_ch5429_トリシューラ_other_ドラトリアのシステム_p71
        quote: '「なるほどね。つまりセリアック＝ニアによるリールエルバの断罪には大義があり、『剣』が役目を果たせば問題はドラトリア内部だけで完結すると」

          孤独の王を制御するために飼い慣らされた剣の獣。

          ことの終わりに役目を終えた猫姫が自害すれば、愛する者をその手にかけて己も後を追うという悲劇性でドラトリアの歪な力関係は誤魔化される。涙無しには語れない物語として国民に消費され、同情や悲しみ、国葬の一体感によって国内の対立は先送りにされるという次第である。'
        locator: {}
        spoiler_after: ch5429
    action:
      observations:
      - event_ref: E_ch5429_トリシューラ_remembers_シナモリアキラとの会話_p28
        quote: '戦火の下、トリシューラはふと思い出す。

          リールエルバというのはどのような人物なのか。かつてシナモリアキラにそう質問されたとき、さてわたしは何と答えたのだったろう。'
        locator: {}
        spoiler_after: ch5429
      - event_ref: E_ch5429_トリシューラ_other_シナモリアキラの欠点_p38
        quote: それを否定しようとは思わない。腹は立つし癇にも障るが、その欠点を含めたシナモリアキラだ。ならばこのくらいの修羅場、鷹揚に受け止めて『次』を彼に示してやるのが女王の器というものだろう。
        locator: {}
        spoiler_after: ch5429
      - event_ref: E_ch5429_トリシューラ_uses_鮮血の剣_p41
        quote: '使い慣れない鮮血の剣を軽く握り直す。アンドロイドは猫姫に敗れて塵と消えつつあった白いアキラに切っ先を向けた。すると飛び散った鮮血と肉片は螺旋を描くように鮮血の刀身に吸い込まれてく。

          死を吸い込む王者の剣。'
        locator: {}
        spoiler_after: ch5429
      - event_ref: E_ch5429_トリシューラ_uses_医療剣術・公衆衛生斬り_p57
        quote: 犬耳シナモリアキラを守る飼い主たちを『医療剣術・公衆衛生斬り』でばっさばっさとやりながら、トリシューラは『呪文の座』の同盟相手たちに切り出した。
        locator: {}
        spoiler_after: ch5429
  first_appearance_candidate: true
- canonical_target: '[[E_char_カーティス]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5429_カーティス_uses_影占い時空超越呪術_p143
        quote: 「古代のカーティス、あるいはその前身であった魔竜の霊媒は、今で言うところの『使い魔』を得手とするまじない使いだったんです。そこでカーティスが行っていたのは『影占い』。この世ならざるあの世に干渉する技術――『あの世』というのは、死後や異界のみならず、過去や未来も含むのです」
        locator: {}
        spoiler_after: ch5429
      - event_ref: E_ch5429_カーティス_other_時空の連続性_p167
        quote: 「多分ね。オルヴァの子供-老人サイクルみたいにぐるぐる巡る円環とも違う。祖であるカーティスと裔であるリールエルバが、あたかも一人の人間が連続性のある全身を動かしているように認識する感じ？　時空と因果が手足の延長線上にある器官なんだ」
        locator: {}
        spoiler_after: ch5429
  first_appearance_candidate: true
- canonical_target: '[[E_term_古代ドラトリア語]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5429_古代ドラトリア語_has_property_非線形時制_p149
        quote: '「古代ドラトリア語ではセリアたちが普段使っているような意味での『時制』の運用がされていませんでした。全ては可能なもの、取り得る形として記述され、過去現在未来は文脈無しでは等しいものとして扱われます」

          だから時間に関する思考までもがそのように規定される――と単純に結論付けるには『時間』に関する定義が十分で無く早計と言わざるを得ないが、少なくとも古代ドラトリアで記述された『呪文』は現代とは大きく異なるもので、その呪的影響は古代社会にも及んだ。'
        locator: {}
        spoiler_after: ch5429
  first_appearance_candidate: true
