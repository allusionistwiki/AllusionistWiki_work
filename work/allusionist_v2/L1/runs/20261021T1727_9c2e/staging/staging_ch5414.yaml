  entity_type: item
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5414_電子音_functions_as_スピーカー_p10
        quote: 集中豪雨の電子音が乱舞する。荒々しく浮遊した機械の翼はスピーカー。エフェクターで処理された破滅的信号が人形の舞いを支配していった。
        locator: {}
