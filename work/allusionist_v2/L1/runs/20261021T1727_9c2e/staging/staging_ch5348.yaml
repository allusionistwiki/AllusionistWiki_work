- canonical_target: '[[E_char_ルバーブ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5348_ルバーブ_fears_サイバーカラテの誘惑_p106111
        quote: それは途方もなく危険な――ラフディに忠誠を誓った戦士として考えてはならないことだった。つまり、逆に考えれば、あらゆるものを包括するサイバーカラテの中でなら『ラフディ』を生かし続けることができるのではないか、という。
        locator: {}
        spoiler_after: ch5348
      - event_ref: E_ch5348_ルバーブ_arrives_貴賓席_p116117
        quote: 「陛下、今参ります！」 部下を引き連れて疾走し、場内に下りてきて乱闘を始めている観客たちを強引に薙ぎ倒しながら突き進む。
        locator: {}
        spoiler_after: ch5348
      - event_ref: E_ch5348_ルバーブ_observes_扇動の存在_p1821
        quote: それを見ながら、『私』はあまりに出来過ぎていると感じた。試合後に生じた疑惑、そこから派生した諍い、その果ての暴動が問題だ。扇動した者がいる。恐らくは、呪術的な力によって。
        locator: {}
        spoiler_after: ch5348
      - event_ref: E_ch5348_ルバーブ_thinks_アレッテの正体_p6265
        quote: 私は、アレッテという女が本物の貴種であることを知っている。亜竜王に連なる名前の由来も、ラフディの王家に連なっているのだというその来歴も、全て。そしてそれは騙りなどではない。我が主が直感のみで信用したことは、ある意味では正しいのだ。確かにあの女は正統だ。
        locator: {}
        spoiler_after: ch5348
    speech:
      observations:
      - event_ref: E_ch5348_ルバーブ_other_アレッテ邪教徒_p164166
        quote: 「馬脚を現したな、邪悪な魔女め。聖なる球神の名を騙り、穢れた儀式でラフディを穢そうとする貴様はもはや一秒足りとて捨て置けん。陛下、どうか一言ご命令下さい。この女を排除する許可を！」
        locator: {}
        spoiler_after: ch5348
      - event_ref: E_ch5348_ルバーブ_gives_戦力配置指示_p3739
        quote: 「落ち着け。まずは陛下の安全を確保することが先だ。カルメーキフとドルン、ゴガベズは私と共に貴賓席に向かうぞ。ソーレル、ドック、ペルシカリア、エキドナで暴動の鎮圧に当たれ。多少手荒になっても構わん」
        locator: {}
        spoiler_after: ch5348
      - event_ref: E_ch5348_ルバーブ_other_アレトへの呪縛命令_p4147
        quote: 「それからアレトは自分の名を媒介にしてアレッテ・イヴニルに呪縛をかけろ。あの魔女めの動きを多少なりとも妨害できるはずだ」 「しかし、そうしますとアルト王にも影響が」
          「構わん、やれ」
        locator: {}
        spoiler_after: ch5348
  first_appearance_candidate: true
