- kind: theme
  theme: 模倣（ミメシス）とオリジナルの優劣
  weight: 0.7
  quotes:
  - quote: 「見よう見まねであの子の左手を摸倣してみたんだ。即席にして万能の対抗呪文といったところかな。」
    paragraph: p207
    quote_verified: false
  - quote: 魔将ユネクティアが振るう刃はフィリスの見よう見まねでの模造品だという。あくまで見た目上、振る舞いの摸倣なので完全に同じではないだろうが、効果が同一ならそれは同じこと。
    paragraph: p215
    quote_verified: true
  note: ユネクティアの「模倣」能力は、フィリスという「オリジナル」との対比で描かれており、コピーがオリジナルを超えうるか（効果同一なら同じ）、またその限界（消耗激しさ）についての考察を提示している。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
