    expected_payoff: クレイがクロウサー家と何らかの縁を持つ存在であることが判明するか、物語の展開に応じて彼のアイデンティティが劇的に変化する。
  - kind: mystery
    name: MY_レオの支配力の本質
    note: レオがカーインたちの耳に繋がった糸を触れて沈黙させるなど、ラクルラールの支配下にあるはずの者たちを自在に操るような振る舞いを見せた。
