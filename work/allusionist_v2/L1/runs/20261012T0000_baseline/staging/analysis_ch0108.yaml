  mysteries:
  - kind: mystery
    name: MY_オルヴァ生存説の真偽
    note: 処刑されたはずのオルヴァ王が、後に賢者スマダルツォンとして現れたという伝承。アキラが演じたオルヴァ役と、キシャルによる隠者ウォレスとの入れ替え劇が、この生存説を史実として確定させる布石となった。
    quotes:
    - quote: オルヴァ・スマダルツォンはクーデターにより王位から引きずり下ろされ、九日九晩にわたって熱した鉄の棺の中に閉じ込められるという責め苦を受けた。
      paragraph: p3805
    - quote: 今にして思えば、囚われたオルヴァが隠者ウォレスと入れ替えられたのは『生存説』を確定させる為だろう。
      paragraph: p3807
    expected_payoff: 賢者スマダルツォンが実はオルヴァ王そのものであり、物語の終盤で重要な役割を果たす、あるいはアキラの行動が歴史改変の核心であったことが明かされる。
  - kind: mystery
    name: MY_レストロオセとイェレイドの同一性
    note: アキラが以前見た魔将イェレイドと、今回現れたレストロオセが同一人物ではないかと疑念を抱いている。
    quotes:
    - quote: あのレストロオセと名乗っていた奴、どう見ても前に見た魔将イェレイドだったんだが、あれはどういうことだ？
      paragraph: p3809
    expected_payoff: 敵勢力の正体や、時間軸の歪み、あるいは変身能力に関する重要な手がかりとして回収される。
  - kind: mystery
    name: MY_クレイの名前の変遷
    note: クレイが「クレイ・ガレニス・クロウサー」になる可能性を示唆し、自嘲的な表情を見せた。名前が状況や物語によって書き換えられる仕組みが存在する。
    quotes:
