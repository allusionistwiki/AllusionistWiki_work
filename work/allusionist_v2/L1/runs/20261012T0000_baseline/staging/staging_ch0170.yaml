- canonical_target: '[[E_char_地下室の姫君]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0170_地下室の姫君_says_歌_p5651
        quote: 闇に閉ざされた地下室で淀みなく上下する怨嗟の旋律。反響する耳障りな歌声はどこまでも寂しくて、ただ希望が削ぎ落とされていく。
        locator: {}
        spoiler_after: ch0170
      - event_ref: E_ch0170_地下室の姫君_other_不完全さ_p5655
        quote: 対として切り分けられていた私たちは不完全になった。互いに触れ合い、融け合い、ひとつの混沌として完成してしまったから。
        locator: {}
        spoiler_after: ch0170
    action:
      observations:
      - event_ref: E_ch0170_地下室の姫君_activates_呪いの檻_p5652
        quote: 幾重もの堅牢な守り、呪いの檻を眠らせて、衛兵のコウモリたちを下がらせることまでした。
        locator: {}
        spoiler_after: ch0170
    relationship:
      observations:
      - event_ref: E_ch0170_地下室の姫君_observes_臣下_p5652
        quote: 彼女のことを恐れ、敬い、『狂っている』と心を震わせている遠くの臣下たち。おかしなことだ。――私はただ、歌っているだけなのに。
        locator: {}
        spoiler_after: ch0170
      - event_ref: E_ch0170_地下室の姫君_other_獣_p5654
        quote: 椅子に拘束された彼女は両手を広げることすらできなかったけれど、弛緩した体と柔らかく微笑んだ頬は確かに獣を求め、受け止めようとするものだった。
        locator: {}
        spoiler_after: ch0170
  first_appearance_candidate: true
