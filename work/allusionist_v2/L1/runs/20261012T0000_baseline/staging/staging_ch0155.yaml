        locator: {}
        spoiler_after: ch0155
  first_appearance_candidate: true
- canonical_target: '[[E_char_カーイン]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0155_カーイン_defeats_鬼_p5261
        quote: 『鬼』はロウ・カーインの前に敗れ去った。 辺りに横たわるのは軍服の屍兵たち。
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_カーイン_other_レミルス_p5263
        quote: 棍の先端が大気を灼いて走るが、カーインの背に黒々とした靄が収束。
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_カーイン_other_六本の腕_p5263
        quote: 靄の中から生えてきた腕は合計六本。 長い指、鋭く硬質な爪、浅黒い肌、盛り上がった筋肉、肩の辺りで霞と消える不可解な輪郭。
        locator: {}
        spoiler_after: ch0155
    speech:
      observations:
      - event_ref: E_ch0155_カーイン_says_サイバーカラテ_p5266
        quote: 「最適」など日々変化し続ける。サイバーカラテの特性を知り、手の内を隠すことが最善と信じる秘密主義者が相手ならなおさらだ」
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_カーイン_says_主命_p5277
        quote: 「主命なれば、是非も無し」
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_カーイン_other_レミルス_p5278
        quote: 「ようこそ。私の世界へ」 頭蓋の中は広々とした一室だった。
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_カーイン_says_世界_p5281
        quote: 「当然だ。世界とは、頭蓋骨の内側で完結しているものなのだから」
        locator: {}
        spoiler_after: ch0155
    visual:
      observations:
      - event_ref: E_ch0155_カーイン_transforms_角_p5268
        quote: それは角。すぐそこに転がっているシナモリアキラだったものが脳に埋め込んでいた装置とは異なる、紛う事なき生来のものだ。
        locator: {}
        spoiler_after: ch0155
    symbolic:
      observations:
      - event_ref: E_ch0155_カーイン_has_property_隠_p5280
        quote: 『隠』という呪力。ただそれだけで成立する『何者か』。 それは真の意味で『何者か』でしかない。
        locator: {}
        spoiler_after: ch0155
  first_appearance_candidate: true
