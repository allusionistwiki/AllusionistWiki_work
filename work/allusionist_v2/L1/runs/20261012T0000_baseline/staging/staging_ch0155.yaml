entities:
- canonical_target: '[[E_char_ヴァージル]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0155_ヴァージル_other_オルヴァ_p5259
        quote: 「それじゃあ、始めようか――勝負しよう、オルヴァ」 余裕に満ちた宣戦布告。
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_ヴァージル_makes_楽団_p5260
        quote: 不定形の宇宙の中心で、少年は多様な姿の亡霊たちを使役して楽団を編成する。
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_ヴァージル_other_百々目鬼_p5271
        quote: 激励しつつ、ヴァージルは『百々目鬼』たちに規格外の呪力と複雑怪奇な呪文の秘奥を授けた。
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_ヴァージル_other_サイバーカラテ道場_p5272
        quote: 強制的に『サイバーカラテ道場』をインストールさせた十三番義肢『コキューネー』はヴァージルが自ら改造した特注品だ。
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_ヴァージル_captures_大入道_p5275
        quote: そして、運ばれていく物資に紛れて巨大なコンテナがひとつ。ドローンたちが警護・運搬するその荷物の中には、『大入道』という名のシナモリアキラが封じ込められていた。
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_ヴァージル_other_アストラル体_p5279
        quote: ヴァージルは咄嗟に自らのアストラル体を切断して緊急避難。
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_ヴァージル_observes_呪術医院_p5282
        quote: 戦況を把握すべく呪術医院の映像を表示したとたん、呆けた表情になって固まってしまう。
        locator: {}
        spoiler_after: ch0155
    speech:
      observations:
      - event_ref: E_ch0155_ヴァージル_says_オルヴァ_p5259
        quote: かつて、ヴァージルという少年はオルヴァをこう評した。 ――馬鹿すぎて一周まわって賢者に見えてきそうな人、と。
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_ヴァージル_loves_サイバーカラテ_p5270
        quote: 少年はサイバーカラテを愛している。 シナモリアキラ 制御された暴力を、彼はこの上無く好む。
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_ヴァージル_observes_雪_p5274
        quote: 「雪？ 珍しい。姫が目覚めかけているのかな？」
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_ヴァージル_other_カーイン_p5281
        quote: 「内世界型の浄界。無限後退の小人幻想を拡張したの？ でもそれを外側に広げるなんて、まるで内側と外側が反転しているような」
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_ヴァージル_other_十三人目_p5283
        quote: あの『きぐるみ』から発せられている呪力の波形は全くの未知。 十二人のシナモリアキラの誰とも該当しない。 ならば、あれは一体誰なのだ？
        locator: {}
        spoiler_after: ch0155
  first_appearance_candidate: true
- canonical_target: '[[E_char_レミルス]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0155_レミルス_travels_戦場_p5260
        quote: 長い棍を脇に持ち、鼻先を前に突き出した前傾姿勢。矢の走法は男の肉体を飛翔体のように加速させていく。
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_レミルス_attacks_カーイン_p5262
        quote: 隙だらけの背中を見逃すレミルスではない。 長い棍を体の横に構えて突撃。
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_レミルス_attacks_カーイン_p5264
        quote: 無防備なカーインの肉体に沈みこんでいく掌。「死ね」 電磁発勁。発電器官を兼ねた筋肉が活性化。
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_レミルス_uses_神経支配_p5264
        quote: 虹犬の全身を走り抜ける雷光。発動した『神経支配』の術が思考 インナーベイト を加速、反射速度を電撃的に向上させていく。
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_レミルス_uses_電磁場感知_p5266
        quote: だが、その本領は周囲に電磁場を形成することによって可能となった感知能力にある。
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_レミルス_fights_カーイン_p5275
        quote: 確かに先ほどまでは優勢だった。そのはずなのに。 焦りが虹犬の瞳に浮かぶ。
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_レミルス_attacks_カーイン_p5277
        quote: 電流が迸り、輝く毒蛇の牙がカーインの筋肉を、神経を、そして脳を支配せんと神経毒を注ぎ込んでいく。
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_レミルス_other_カーインの脳内_p5278
        quote: その瞬間、猟犬の主観意識はビーグル犬型アバターとなってアストラル界を疾走し、カーインという漆黒のアストラル体の内側に侵入した。
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_レミルス_other_カーインの脳内_p5279
        quote: 小さなカーインは操縦席に座っていた。 頭部の中は様々な精密機器で満たされ、正体不明の男は操縦桿を握って『外の人』を操縦している。
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_レミルス_other_カーインの頭蓋_p5280
        quote: そこは外の世界などではなく、色付いた世界が幻像として頭蓋骨のスクリーンに投影されているだけの小さな一室。 カーインの頭部の内側だった。
        locator: {}
        spoiler_after: ch0155
    visual:
      observations:
      - event_ref: E_ch0155_レミルス_has_property_邪視_p5265
        quote: 筋肉や軸索が分化して形成される発電器官が彼の邪視発動部位である。
        locator: {}
        spoiler_after: ch0155
    speech:
      observations:
      - event_ref: E_ch0155_レミルス_reveals_カーインの正体_p5265
        quote: 「常人を超える肉体改造。君も『お山』の出身か」「そういうあんたは、やっぱり『あの』カーインだったわけだ。霊長類だって聞いてましたけど、その瘴気はどうやって？
          脳に疑似細菌でも移植したんですか？」
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_レミルス_asks_カーイン_p5276
        quote: 「なんで四十四士の栄光をどぶに捨てた？ 守るべき主君にその爪を向けた？ 俺はあんたのことを知らない。だが愚かな、いや支離滅裂な行動をしてるってことだけはわかる。あんたは一体何がしたくてこんな場所にいるんだ？」
        locator: {}
        spoiler_after: ch0155
      - event_ref: E_ch0155_レミルス_says_サイザクタート_p5276
        quote: 「教えておいてあげます。『サイザクタート』の襲名候補は最終的に二人に絞られた。初代の子孫である本命と、それに比肩すると言われた親友の天才美少年」
        locator: {}
        spoiler_after: ch0155
  first_appearance_candidate: true
