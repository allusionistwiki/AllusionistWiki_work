- canonical_target: '[[E_char_ガドカレク]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0113_ガドカレク_names_竜帝_p3978
        quote: 「我が名は【竜帝】ガドカレク。秩序を守護する九首の真竜が第五首にしてこの【紀竜と紀神の集い】の主宰である。
        locator: {}
        spoiler_after: ch0113
      - event_ref: E_ch0113_ガドカレク_says_閉じた再演の輪_p3978
        quote: 「ようこそ、歓迎しよう異邦人たちよ。永久のもてなしを受けられよ。始まりも無く終わりも無い、この閉じた再演の輪の中で踊り続けるといい」
        locator: {}
        spoiler_after: ch0113
  first_appearance_candidate: true
