- canonical_target: '[[E_char_火炎候シェボリズ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0113_火炎候シェボリズ_appears_as_巨大な狼_p3967
        quote: 相手は途轍もなく巨大な狼であった。黒々とした体躯、吐息は毒々しい色の噴煙、瞳は爛々と輝く青い炎、尾は黄色の松明という恐るべき姿である。
        locator: {}
        spoiler_after: ch0113
      - event_ref: E_ch0113_火炎候シェボリズ_loses_黒炎の四肢_p3967
        quote: 本来ならば見る者を恐怖に陥れる四肢、常人ならば四度発狂すると言われている『魂灼きの黒い炎』そのものである不定形の四つ脚が、何故か普通の狼のような黒い脚だったからである。
        locator: {}
        spoiler_after: ch0113
    speech:
      observations:
      - event_ref: E_ch0113_火炎候シェボリズ_confesses_呪祖レストロオセへの恐怖_p3968
        quote: 「私は今でも、あれが何だったのか理解できずにいるのだ。前脚も後ろ脚も出なかった。あんなものは見たことがない。呪祖と名乗った何者かは、あらゆる存在に似ているようでもあり、他の何にも似ていない化け物だった。
        locator: {}
        spoiler_after: ch0113
      - event_ref: E_ch0113_火炎候シェボリズ_reveals_呪祖レストロオセの権能_p3970
        quote: 名を奪い、我がものとし、更にはその存在を掌握して従僕とする権能――私は分裂することで辛うじて難を逃れたが、部族の半数近くが奴に飲まれてしまった」
        locator: {}
        spoiler_after: ch0113
  first_appearance_candidate: true
