        locator: {}
        spoiler_after: ch0113
      - event_ref: E_ch0113_フィレクティ_other_火炎候の子息の預かり_p3969
        quote: 「そうですわお姉様。わたくしたちで、火炎候のご子息をお預かりするのはいかがでしょう？　お力になれるかもしれません」
        locator: {}
        spoiler_after: ch0113
