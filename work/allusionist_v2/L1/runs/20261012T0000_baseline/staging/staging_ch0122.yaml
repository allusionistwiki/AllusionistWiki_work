- canonical_target: '[[E_char_マゼンタ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0122_マゼンタ_says_シナリオ_p4287
        quote: 「いいのよ、背後の警戒なんて適当で。それに多分、全てはお姉様が望まれたシナリオの内。どうせ七番目は必要になる」
        locator: {}
        spoiler_after: ch0122
      - event_ref: E_ch0122_マゼンタ_defines_使い魔の紀人_p4288
        quote: 「市場と企業の紀人グレンデルヒ、官庁と国家の紀人トリシューラ、武術流派とネットコミュニティの紀人シナモリアキラ――これらは技術と杖に近い紀人たち。真に純粋な使い魔の紀人は――そうね、学校。そして家族」
        locator: {}
        spoiler_after: ch0122
      - event_ref: E_ch0122_マゼンタ_reveals_第七断章富_p4288
        quote: 「第七断章【富】――担い手はメクセトの裔か、クロウサーの当主トラストか、はたまた狂える吸血姫か。最後のピースは運命によってこの場所に引き寄せられる。
        locator: {}
        spoiler_after: ch0122
      - event_ref: E_ch0122_マゼンタ_other_トリシューラ_p4289
        quote: 「馬鹿なトリシューラ。国家の紀人、そんな道を選択した時点で、あなたは操り人形となる道を自ら選んでしまったようなもの。国民お人形を作り出す手段がなければ、王国に未来は無い。
        locator: {}
        spoiler_after: ch0122
    action:
      observations:
      - event_ref: E_ch0122_マゼンタ_disappears_姿_p4289
        quote: 暗雲に月光が遮られ、少女たちの姿も消える。残ったのは、長い長い絹糸のような紅紫の髪が一本。それさえも夜風に吹かれてどこかへと飛ばされていった。ふと、虚空でその色が変化する。深い深い、青色に。
        locator: {}
        spoiler_after: ch0122
  first_appearance_candidate: true
- canonical_target: '[[E_char_ゼド]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0122_ゼド_other_盗賊団_p4290
        quote: 盗賊王ゼド。非正規探索者たちを率いるならず者たちの英雄。そして彼に付き従うのは英雄たちから利益を掠め取る盗賊団。
        locator: {}
        spoiler_after: ch0122
    speech:
      observations:
      - event_ref: E_ch0122_ゼド_hopes_シナモリアキラ_p4291
        quote: 「上の方でもなにやら動きがあったようだ。俺たちはどう立ち回るか――お前はどう動く、シナモリアキラ。その正義と価値が熟すのはいつになる？」
        locator: {}
        spoiler_after: ch0122
    visual:
      observations:
      - event_ref: E_ch0122_ゼド_conceals_青い髪_p4292
        quote: 「大将、髪染めました？」「いいや？ どうした？」「光の加減かな、一瞬青く見えたような」気のせいかな、と探索者が呟いた。
        locator: {}
        spoiler_after: ch0122
  first_appearance_candidate: true
- canonical_target: '[[E_char_グラッフィアカーネ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0122_グラッフィアカーネ_fights_自動機械_p4292
        quote: 「【変異の三手】はグレンデルヒを演じていたんだろ。サイザクタートの仇であるあいつが普通の手段で殺せないなら、そいつらを殺すしか仇を討つ方法が無いじゃないか！」敵対勢力を捕縛している自動機械たちに怒鳴りつける。
        locator: {}
        spoiler_after: ch0122
      - event_ref: E_ch0122_グラッフィアカーネ_flees_ちびシューラ_p4295
        quote: 「すみません、ちょっと今後の事について考えさせてもらいます」不信は決定的なものとなっていた。強引に相手を従わせようとするやり方は、当然のことながら反発を招く。足早に立ち去っていく少年の背を、稼働する機械たちは見送ることしかできなかった。
        locator: {}
        spoiler_after: ch0122
    visual:
      observations:
      - event_ref: E_ch0122_グラッフィアカーネ_has_property_青い体毛_p4293
        quote: トライカラーの毛並みが逆立っていく。白、黒、黄褐色。そして青。――青い、体毛。
        locator: {}
        spoiler_after: ch0122
  first_appearance_candidate: true
- canonical_target: '[[E_term_ちびシューラ]]'
  entity_type: terminology
  aspects:
