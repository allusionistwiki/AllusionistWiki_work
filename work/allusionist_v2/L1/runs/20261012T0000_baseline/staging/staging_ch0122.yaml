      observations:
      - event_ref: E_ch0122_広告動画_appears_as_球体関節人形_p4284
        quote: 青い髪の球体関節人形がカメラの方を向くとカタカタと笑う。それを見た家族が談笑する。両親に手を引かれた小さな子供が人形を欲しがる。
        locator: {}
        spoiler_after: ch0122
    speech:
      observations:
      - event_ref: E_ch0122_広告動画_defines_資格習得の理屈_p4284
        quote: 資格の習得を促す広告。機械に仕事を奪われた分だけ、その機械に関連した仕事が必要になってくるのだという理屈が述べられる。
        locator: {}
        spoiler_after: ch0122
      - event_ref: E_ch0122_広告動画_defines_最初の先生_p4285
        quote: 小さな子供は、父親と一緒に内側の機械を組み立て、母親と一緒に人形の目を彩色し、服を縫製して飾り立てる。大写しになる文字――『最初の先生は、すぐそばにいる』
        locator: {}
        spoiler_after: ch0122
    action:
      observations:
      - event_ref: E_ch0122_広告動画_disappears_画面_p4285
        quote: ぶつりと、全ての映像が消えた。そこは暗闇。無数の画面が瓦礫のように積み上がった散らかった空間だ。
        locator: {}
        spoiler_after: ch0122
  first_appearance_candidate: true
