- canonical_target: '[[E_char_水底の存在]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0122_水底の存在_hopes_ハザーリャの加護_p4305
        quote: 「終わらぬ。まだなにも終わってなどおらぬ。我らが部族の悲願を果たすまでは死ねぬのだ。たとえ狂信者どもの走狗に成り果てようと、必ずや偽りの守護天使を退け、真の守護神たるハザーリャの加護を取り戻してみせようぞ」
        locator: {}
        spoiler_after: ch0122
      - event_ref: E_ch0122_水底の存在_other_魂の同胞_p4306
        quote: 「待っていろ、今助け出してやる。ロドウィ、アルテミシア、ローズマリー、セージ、アニス。我が魂の同胞たちよ。再生者として復活し、我と共に江湖の栄光を取り戻すのだ」
        locator: {}
        spoiler_after: ch0122
