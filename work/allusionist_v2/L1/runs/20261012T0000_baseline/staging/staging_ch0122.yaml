      observations:
      - event_ref: E_ch0122_ちびシューラ_uses_マレブランケ_p4294
        quote: 【マレブランケ】という異界の呪力を借りた形式。名付け親とは名付けた相手に疑似的な親として権威を振るえる呪術的絶対者である。しかしちびシューラがグラッフィアカーネという名に対して行使した呪文は不発に終わる。
        locator: {}
        spoiler_after: ch0122
  first_appearance_candidate: true
- canonical_target: '[[E_term_魔教]]'
