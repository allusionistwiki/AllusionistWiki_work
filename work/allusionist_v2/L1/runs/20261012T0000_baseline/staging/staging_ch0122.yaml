- canonical_target: '[[E_char_幻姿霊]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0122_幻姿霊_fights_新生三報会_p4299
        quote: 瞬間、黒い布の中央を突き抜けて何かが飛び出し、男の鳩尾に叩き込まれた。その場の誰も、一切の予備動作を感知できなかった。鋭い槍を思わせる貫手。
        locator: {}
        spoiler_after: ch0122
      - event_ref: E_ch0122_幻姿霊_other_新生三報会_p4300
