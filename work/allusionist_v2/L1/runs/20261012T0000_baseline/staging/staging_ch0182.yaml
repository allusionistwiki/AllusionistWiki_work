- canonical_target: '[[E_term_猫]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch0182_猫_defines_救世主_p6027
        quote: 時に猫は救世主と同一視された。猫の午睡からの目覚めは主の蘇りであった。
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_猫_has_property_甘い匂い_p6027
        quote: 猫は誰もが快く感じるほど甘い匂いを吐き、そのかぐわしさにつられてありとあらゆる者たちがこの獣の棲家を求めて群れ集う。
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_猫_is_made_of_竜の敵対者_p6027
        quote: 猫の国より流れ着いた書物に曰く。 猫とは、竜の敵対者であるという。
        locator: {}
        spoiler_after: ch0182
    visual:
      observations:
      - event_ref: E_ch0182_猫_has_property_満月連動のしみ_p6027
        quote: 背には太陰と共に満ち欠けする幾つもの『しみ』が浮かんでいる。
        locator: {}
        spoiler_after: ch0182
  first_appearance_candidate: true
- canonical_target: '[[E_term_竜]]'
  entity_type: terminology
  aspects:
