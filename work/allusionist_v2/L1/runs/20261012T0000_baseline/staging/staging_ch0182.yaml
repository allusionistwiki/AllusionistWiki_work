      observations:
      - event_ref: E_ch0182_竜_defines_悪魔_p6027
        quote: この事から、宿敵である竜は悪魔と解釈されることもあった。
        locator: {}
        spoiler_after: ch0182
  first_appearance_candidate: true
- canonical_target: '[[E_char_アズーリア]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0182_アズーリア_says_キュート＆キャット_p6028
        quote: 三区にある『キュート＆キャット』が可愛いお姫様ファッションとスイーツのお店でね、セリアファンのエレメンタリーの子たちが店長さんやってて猫耳から尻尾アクセまで猫グッズだらけであれはもう信仰と言っても過言では――
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_アズーリア_says_幻獣辞典_p6028
        quote: 幻像通信の窓越しに見える夜の民の小さな手にはこぢんまりとした書物が収まり、表紙には『幻獣辞典』とある。
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_アズーリア_asks_猫性の再確認_p6029
        quote: どうしてまた突然『自分の猫性を再確認したい』なんてことを言い出したの？ 自己鍛錬の一環？
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_アズーリア_asks_本当の願い_p6033
        quote: リールエルバの喜びがあなたの喜びなら、それを応援するのがあなたの本当の願いじゃないんですか？
        locator: {}
        spoiler_after: ch0182
  first_appearance_candidate: true
- canonical_target: '[[E_char_セリアック＝ニア]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0182_セリアック＝ニア_says_参考にならない_p6028
        quote: ぜんぜんまったく助かっていませんが、お気持ちだけいただいておきます。どうもありがとうございました
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_says_聖なる御使い_p6028
        quote: セリアック＝ニアは「聖なる御使いからお言葉をいただく」と周囲に告げてマロゾロンド神殿の一室に籠もり
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_says_スペック不足_p6029
        quote: いくら使徒様のメモリ占有域が莫大であったとしても、スペックまでもが突然それに見合うようになるはずもありません。
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_thinks_強くなる必要性_p6029
        quote: 強くならなければならない、ということ。 呪術師としてはもちろん『盾』としても。体を張って守るべき対象が背後にいる。
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_says_アズーリアへの憎悪_p6030
        quote: セリアは使徒様が、アズーリアがきらいです。脳天気な物言いも、たまにぞっとするほど無神経なところも。それに、ディスペータお姉さまに、あなたは
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_thinks_フィリスの呪い_p6030
        quote: アズーリアはフィリスに呪われ、暴走した。誰かの悪意が、セリアにアズーリアを憎ませている。
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_confesses_ジュエリーデザイナーの夢_p6032
        quote: セリアの夢は公務や聖務の傍ら宝飾呪術の研鑚を積み、ジュエリーデザイナーになることです。セリアは、最初からそうでした
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_says_宝石への尊敬_p6032
        quote: セリアは、宝石が好きです。宝石に飾られたアクセサリと、その美しい造形を形作り、ドラトリア文化を継承する人々を尊敬しています。
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_confesses_姉様を歪めた罪_p6033
        quote: それを歪めたのは、セリアです
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_thinks_姉様への愛_p6033
        quote: 姉様、姉様、姉様！ たくさんの姉様の野望と欲望！ 姉様の願いをセリアが彩って、セリアの宝石とおまじないで姉様が喜んで
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_says_姉様の隣_p6035
        quote: セリアがいるべき場所は、姉様の隣だということです。
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_thinks_姉様の命を奪う存在_p6035
        quote: セリアの存在の全ては、姉様の命と尊厳を奪うためある
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_says_ナーグストールへの祈り_p6036
        quote: 時の鏡、星の絨毯、宝石夜空に恋い願う。孤独と隔離の名の下に、我ら祈り手、聖なるけがれと涙を掬わん――お願い、ナーグストール！
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_says_吸血鬼狩人の血_p6047
        quote: ファナハードという家が最強の吸血鬼狩人の血を継ぐ一族であるからです
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_says_セリアック病_p6050
        quote: セリアが司る『セリアック病』は小麦などに含まれるグルテンに対する免疫反応が原因で小腸機能を損ない、栄養の吸収ができなくなる自己免疫疾患です。
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_thinks_青い糸の呪縛_p6053
        quote: 手足に絡みつく不快な青い糸を力任せにふりほどこうとするが、解けない。 わかっていた。これは絶対に解けない呪縛。
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_says_戦うべき相手_p6054
        quote: 姉様。セリアは、戦うべき相手を見定めました
        locator: {}
        spoiler_after: ch0182
    action:
      observations:
      - event_ref: E_ch0182_セリアック＝ニア_teleports_反転した闇の塔_p6036
        quote: 逆さまの闇の塔から虚空へと身を踊らせた少女はそのまま上方へと落下する。
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_arrives_壁の外_p6037
        quote: ここは壁の外。壮絶な破壊の爪痕が残された、魔竜の通り道。
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_attacks_シナモリアキラ_p6039
        quote: 命中すれば即座に対象を球化し、追う二撃目で宝石に加工、とどめの三撃目で美しいだけの石に意味と価値を与えて呪文を発動させる。
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_attacks_シナモリアキラ_p6041
        quote: 真っ直ぐにシナモリアキラに飛びかかったのである。呪いをまともに浴びながら、猫姫は敵との間合いを一気に詰めた。
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_uses_沙羅双樹・宴_p6042
        quote: 「『沙羅双樹・宴』」 呪詛はまずセリアック＝ニアの脳を攪拌し、肺を割り、腹に大穴を開けた。
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_uses_星の絨毯_p6044
        quote: 愛と官能の秘薬――ベルガモット、アイリス、バニラ、ジュエリーアンバー、そして霊猫香を調合した幻想香水『星の絨毯』。
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_uses_沙羅双樹・残香_p6044
        quote: 「『沙羅双樹・残香』」 自己の呪力上限を削りながら死を遠ざける中位呪術を詠唱するセリアック＝ニア。
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_uses_大地操作呪術_p6045
        quote: 襲い来る濁流をセリアック＝ニアが大地操作呪術による堤防構築でせき止める。
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_attacks_シナモリアキラ_p6046
        quote: 瞬間的に放たれた刺突は十五に及び、そのいずれもが構築された呪文の脆弱性を的確に突いていた。
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_uses_瘴気圧縮技術_p6047
        quote: ファナハードは存在規模で勝る吸血鬼たちを相手取るために、瘴気を一点に凝縮する技術を研ぎ澄ませてきた。
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_uses_呪宝石の首飾り_p6048
        quote: 防御したのは、猫姫の可憐な首もとを彩る首飾りだ。「隙は必ず生じるもの。だから弱い人は『杖』を使う。そのための呪宝石です」
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_セリアック＝ニア_other_シナモリアキラの遺骸_p6051
        quote: ぱくり。猫姫は始祖三体の砕かれた遺骸をまとめてひっつかむと、そのまま口の中に放り込んだ。
        locator: {}
        spoiler_after: ch0182
  first_appearance_candidate: true
- canonical_target: '[[E_term_セリアック]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch0182_セリアック_defines_病の名前_p6034
        quote: セリアックというのは病の名前なのだと、いつかディスペータお姉さまが教えてくれました。
        locator: {}
        spoiler_after: ch0182
    symbolic:
      observations:
      - event_ref: E_ch0182_セリアック_functions_as_カーティスの制御盤_p6034
        quote: ドラトリアの礎にして災いであるカーティスの制御盤にして牢獄の鍵。抑制剤にして鎖と首輪。 そして、権力を裁定する秩序の剣。
        locator: {}
        spoiler_after: ch0182
  first_appearance_candidate: true
- canonical_target: '[[E_char_シナモリアキラ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0182_シナモリアキラ_appears_壱の刻印_p6038
        quote: むき出しの右胸に刻まれているのは『壱』の数字。右の目玉を抉り出そうとするようにスプーンが生えた冗談みたいな面貌、コウモリとイナゴという左右ちぐはぐな翼翅を有し
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_シナモリアキラ_has_property_球体関節人形の身体_p6038
        quote: 腰下まで届く見事な紅紫色の髪と、精巧な球体関節人形の身体を持っていた。
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_シナモリアキラ_has_property_オルガンローデ_p6040
        quote: 吐き出されるのは瘴気のオルガンローデ。人の世に仇為す死病が災いの大蛇となりシナモリアキラの両腕に巻き付いて打撃力を強化し続けているのである。
        locator: {}
        spoiler_after: ch0182
    speech:
      observations:
      - event_ref: E_ch0182_シナモリアキラ_says_足止めの目的_p6039
        quote: この『シナモリアキラ』という群体はあなたを足止めする為だけの存在。
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_シナモリアキラ_says_頭痛とヘレゼクシュかぜ_p6040
        quote: リールエルバはあなたを守るために『頭痛』と『ヘレゼクシュかぜ』をこの『最古の始祖』に統合した。
        locator: {}
        spoiler_after: ch0182
    action:
      observations:
      - event_ref: E_ch0182_シナモリアキラ_uses_外破_p6049
        quote: 始祖吸血鬼の『外破』により、災厄の正体が世界に牙を剥く。
        locator: {}
        spoiler_after: ch0182
      - event_ref: E_ch0182_シナモリアキラ_makes_階段_p6052
        quote: 肉体が瘴気と溶け、幾つもの浮遊する板となって階段を作る。行く手を阻む壁の向こうに繋がる階段の段数は、合計で十三。
        locator: {}
        spoiler_after: ch0182
  first_appearance_candidate: true
