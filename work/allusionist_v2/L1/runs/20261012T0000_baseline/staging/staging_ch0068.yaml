entities:
- canonical_target: '[[E_char_アズーリア]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0068_アズーリア_observes_ユネクティア_p2533
        quote: スキリシアを離れ、黒百合宮から地上社会に出てから驚き戸惑ったことの一つは、優しき賢者ユネクティアが恐るべき魔将の一人だと伝えられていた事だ。
        locator: {}
        spoiler_after: ch0068
      - event_ref: E_ch0068_アズーリア_says_アズーリア_p2538
        quote: 「アズー、リア」 はっとして、我に帰る。【心話】による強制的な暗示。激痛でこちらの気が緩んだ隙を狙った完璧な攻撃だった。
        locator: {}
        spoiler_after: ch0068
      - event_ref: E_ch0068_アズーリア_says_幻影_p2539
        quote: 「お前は存在しない――お前は、幻影だっ」 強く叫び、呪文を構築していく。
        locator: {}
        spoiler_after: ch0068
      - event_ref: E_ch0068_アズーリア_thinks_ユネクティア_p2539
        quote: 私は確信していた。この魔将より危険な存在はあの中には一人としていない。ユネクティアは私の天敵だ。
        locator: {}
        spoiler_after: ch0068
    action:
      observations:
      - event_ref: E_ch0068_アズーリア_fights_ユネクティア_p2534
        quote: 私たち夜の民にとって、影の中で戦うという事は全ての枷を解き放って全力でぶつかり合うようなもの。
        locator: {}
        spoiler_after: ch0068
      - event_ref: E_ch0068_アズーリア_attacks_ユネクティア_p2535
        quote: 反撃の触手を解き放つ。影がユネクティアを乗せた怪物の全身に絡みつき、強固に束縛する。
        locator: {}
        spoiler_after: ch0068
      - event_ref: E_ch0068_アズーリア_uses_フィリス_p2536
        quote: 相手の存在が掴めない。私がフィリスをユネクティアに対して使えないのは、それが最大の理由だった。
        locator: {}
        spoiler_after: ch0068
      - event_ref: E_ch0068_アズーリア_wounds_アズーリア_p2537
        quote: 枝角と後ろ肢から伸ばした触手でかろうじて五割は迎撃できたが、残りが青い翼を打ち据え、貫いていった。
        locator: {}
        spoiler_after: ch0068
      - event_ref: E_ch0068_アズーリア_takes_光線_p2538
        quote: その一本を私は正確に補足し、触手で絡め取る。
        locator: {}
        spoiler_after: ch0068
      - event_ref: E_ch0068_アズーリア_attacks_ユネクティア_p2539
        quote: 光の中を逆流していく闇が黒衣の中に注ぎ込まれ、全力を注ぎ込んだ巨大な呪文が魔将の内側で炸裂する。
        locator: {}
        spoiler_after: ch0068
      - event_ref: E_ch0068_アズーリア_uses_フィリス_p2540
        quote: 私は枝角の付け根に絡まっていた金鎖を砕いて叫んだ。「遡って、エル・ア・フィリス」 解き放たれた無彩色の光、解体の呪文を、魔将は真っ向から迎え撃つ。
        locator: {}
        spoiler_after: ch0068
      - event_ref: E_ch0068_アズーリア_loses_戦い_p2541
        quote: 私はガルズの金眼が信じる『空虚』に負け、ここでもまたユネクティアの幻姿が映す『影』に負けてしまう。
        locator: {}
        spoiler_after: ch0068
      - event_ref: E_ch0068_アズーリア_dies_アズーリア_p2554
        quote: エスフェイルの言葉を最後に。私は引き裂かれ、そして――無造作に死んだ。
        locator: {}
        spoiler_after: ch0068
  first_appearance_candidate: true
