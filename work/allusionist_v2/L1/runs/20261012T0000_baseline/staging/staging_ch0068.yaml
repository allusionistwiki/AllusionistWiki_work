  entity_type: terminology
  aspects:
    name:
      observations:
      - event_ref: E_ch0068_マロゾロンド_defines_幽鬼_p2533
        quote: マロゾロンドの影響を強く受けた者は幽鬼と呼ばれ、夜の民の故郷であるスキリシアにもその伝説が残されている。
        locator: {}
        spoiler_after: ch0068
