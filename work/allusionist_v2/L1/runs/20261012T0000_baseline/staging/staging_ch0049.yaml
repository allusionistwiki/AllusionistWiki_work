entities:
- canonical_target: '[[E_org_ティリビナの民]]'
  entity_type: organization
  aspects:
    action:
      observations:
      - event_ref: E_ch0049_ティリビナの民_flees_松明の騎士団_p1959
        quote: 当時、ティリビナの民は松明の騎士団に追い立てられ離散していた。
        locator: {}
        spoiler_after: ch0049
  first_appearance_candidate: true
- canonical_target: '[[E_motif_プリエステラ]]'
  entity_type: motif
  aspects:
    name:
      observations:
      - event_ref: E_ch0049_プリエステラ_other_ティリビナの巫女_p1959
        quote: 樹妖精プリエステラはティリビナの巫女として生まれた。
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_プリエステラ_names_トリシューラ_p1962
        quote: 名前は確か、赤い髪の方がトリシューラで、白い髪の方がコルセスカ。
        locator: {}
        spoiler_after: ch0049
    speech:
      observations:
      - event_ref: E_ch0049_プリエステラ_thinks_家族の空虚さ_p1959
        quote: プリエステラにはその言葉はどこか空虚に聞こえた。その『家族』の中に――本当に私は含まれているのだろうか。
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_プリエステラ_observes_地上文明への依存_p1961
        quote: 地上の力に依存して地上の打倒を叫ぶ――その捻れを誰もが歯痒く感じながらも、そうせざるを得ない。
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_プリエステラ_fears_トリシューラ_p1962
        quote: トリシューラの方は、なんだか『不自然』な感じがして生理的に受け付けなかった。
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_プリエステラ_observes_トリシューラの変化_p1965
        quote: ふとプリエステラは自分が以前ほどトリシューラに対して気味の悪さを感じていない事に気がついた。たったこれだけの事で、自分は嫌っていた相手に『人間らしさ』を見出してしまった。
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_プリエステラ_thinks_故郷の虐めとの類似性_p1965
        quote: それは、異質なものを排除しようとする故郷の子供たちと同じ振る舞いではなかったか。
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_プリエステラ_confesses_不安_p1968
        quote: ティリビナの巫女として歩むことに、不安があると。自分はこのまま歩き続けて――果たして本当にティリビナの民たちの為に己の役割を果たせるのだろうか。
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_プリエステラ_other_アズール_p1971
        quote: しがらみやさだめ、そうした様々な俗世の束縛から逃れ、どこまでも自由に蒼穹を舞い続ける。
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_プリエステラ_other_変装の呪術_p1974
        quote: そこにはこう書かれている。『いい紫外線対策と変装の呪術を知ってるけど、試してみない？』
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_プリエステラ_thinks_選ぶ関係性_p1975
        quote: ――私自身が選ぶ関係性。それは、生まれながらに決定されている家族や一族とは違う、もう一つのかけがえのないもの。
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_プリエステラ_asks_メートリアン_p1976
        quote: プリエステラはメートリアンの端末に文章を打ち込んでいった。『良かったら、お友達になって下さい』
        locator: {}
        spoiler_after: ch0049
    action:
      observations:
      - event_ref: E_ch0049_プリエステラ_departs_ティリビナの民の集落_p1960
        quote: 迎えに来たというどこか自分に似た女性に手を引かれて、プリエステラは諦めと共にティリビナの民の集落を去った。
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_プリエステラ_learns_基礎的な学習_p1961
        quote: プリエステラは、同年代の少女たちに混じって基礎的な学習をしなければならなかったのだ。
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_プリエステラ_conceals_無関心_p1966
        quote: プリエステラは積極的に虐めに関与することは無かった――かといってトライデントの勢力に逆らう気も起きず、ただ巻き込まれないように遠巻きにしていた。
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_プリエステラ_travels_白百合宮_p1967
        quote: プリエステラは、学びの場を【白百合宮】に移していた。師と共に、ティリビナの巫女としての本格的な修行を始めるためだった。
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_プリエステラ_other_彩石の儀_p1969
        quote: フォービットデーモンナンバーフォーティーン。選抜は終わりかけだったが、ぎりぎりで滑り込むことに成功した。十四番目の参加者として深緑の号を与えられたプリエステラは、彩石の儀に参加して――
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_プリエステラ_fights_レッド_p1970
        quote: プリエステラ――ティールは大樹のデーモンと化した自らの身体を動かし、無数の枝から光線を射出して迎撃する。共に低機動力だが火力と装甲に優れた要塞タイプ。熾烈な砲撃戦は長引いたが、次第にティールは劣勢に追い込まれていく。
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_プリエステラ_travels_黒百合宮_p1970
        quote: そして、プリエステラは白百合宮を出立した。目指すは本大陸東部辺境。ヘレゼクシュの魔境――黒百合宮。
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_プリエステラ_observes_メートリアン_p1973
        quote: 向こうの柱に、白い頭。赤い瞳が熱心に庭園の二人を睨み付けている。
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_プリエステラ_makes_葉脈の手紙_p1974
        quote: 幅広の葉が一枚、枝から離れて、柱の陰に隠れながら庭園の様子を覗き見ているメートリアンの頭上に舞い落ちる。それを手に取った少女の赤い瞳が、驚きに見開かれる。複雑に走る葉脈が形を変え、無数の文字を形作っていたからだ。
        locator: {}
        spoiler_after: ch0049
    visual:
      observations:
      - event_ref: E_ch0049_プリエステラ_observes_アズール_p1969
        quote: 黒銀の狼の圧倒的な火力をかいくぐって勝利を収めた青い有翼の牡鹿にプリエステラは目を奪われた。この世には、あんなにも美しく羽ばたく生き物がいるのか。
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_プリエステラ_observes_ホワイト_p1972
        quote: 白く可憐な少女。触れれば折れそうな儚さ。仲良くなりたいと一目見て思ったけれど、彼女は人に話しかけられることをひどく怖がる。
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_プリエステラ_observes_アズールとマリー_p1973
        quote: 澄明のヘレゼクシュ。あるいは色無しマリー。どうしてそんな呼ばれ方をしているのかは知らないけれど、これがあの圧倒的天才アズールの物質世界での姿である。
        locator: {}
        spoiler_after: ch0049
    symbolic:
      observations:
      - event_ref: E_ch0049_プリエステラ_loses_始まり_p1976
        quote: それが、失われた始まり。忘れられて儚く消えて、それでも手にした想いだけは彼女の芯として残された。
        locator: {}
        spoiler_after: ch0049
  first_appearance_candidate: true
