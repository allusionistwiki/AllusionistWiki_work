        quote: 大人達からはまるで女神レルプレアのごとく崇められた。
        locator: {}
        spoiler_after: ch0049
  first_appearance_candidate: true
- canonical_target: '[[E_relation_子供たち]]'
  entity_type: relationship
  aspects:
    speech:
      observations:
      - event_ref: E_ch0049_子供たち_other_プリエステラ_p1959
        quote: 無邪気な子供たちからは霊長類に近いその外見を詰られ、「混じりもの」だとか「不義の子」などと呼ばれて虐められていた。
        locator: {}
        spoiler_after: ch0049
  first_appearance_candidate: true
- canonical_target: '[[E_org_抵抗勢力]]'
  entity_type: organization
  aspects:
    action:
      observations:
      - event_ref: E_ch0049_抵抗勢力_hides_亜大陸の地下空洞_p1959
        quote: 彼らは亜大陸の地下空洞に隠れ潜み、迷宮のような地底森林を彷徨い、地上に対して散発的な破壊活動を繰り返す。
        locator: {}
        spoiler_after: ch0049
  first_appearance_candidate: true
- canonical_target: '[[E_char_父親]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0049_父親_takes_プリエステラ_p1959
        quote: ある日突然、父親が小さかった彼女を星見の塔に預けると言い出した時はその威勢が砕けていくような思いがした。
        locator: {}
        spoiler_after: ch0049
  first_appearance_candidate: true
- canonical_target: '[[E_char_エクリエッテ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0049_エクリエッテ_appears_as_師_p1960
        quote: 頭に花を咲かせ、植物の蔦を身体に這わせたまるで樹妖精のような女性が彼女の師になってくれるらしい。
        locator: {}
        spoiler_after: ch0049
    speech:
      observations:
      - event_ref: E_ch0049_エクリエッテ_says_プリエステラ_p1960
        quote: 「よろしくね、可愛いエスト」
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_エクリエッテ_teaches_プリエステラ_p1967
        quote: 「ティリビナの民は――とくに巫女である貴方は、自然と己との『関係性』の中に呪力を見出すの。大いなる自然そのものを使い魔とし、同時に貴方が広大な世界の使い魔となる。世界をまなざしなさいプリエステラ。そして世界にまなざされる己を自覚するのです」
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_エクリエッテ_other_末妹の選定_p1968
        quote: 「では、違う道を探してみるのもいいかもしれませんね」そしてプリエステラは末妹の選定に関する事を教えられた。
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_エクリエッテ_other_彩石の儀_p1969
        quote: 「【彩石の儀】ですか？」「そう。やってみない？ 同年代の子と競うことは、きっとエストにとって良い刺激になるはずだわ」
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_エクリエッテ_says_プリエステラ_p1970
        quote: 「お行きなさい、私のエスト。貴方はどこにだって行ける。何だって選べる。沢山の可能性を、その目に焼き付けてくるのですよ」
        locator: {}
        spoiler_after: ch0049
  first_appearance_candidate: true
- canonical_target: '[[E_org_九姉]]'
  entity_type: organization
  aspects:
    name:
      observations:
      - event_ref: E_ch0049_九姉_names_魔女たち_p1960
        quote: 九姉と言う割に、そこには八人しかいなかったけれど――そこで挨拶をして、これからのことについて説明を受けた。
        locator: {}
        spoiler_after: ch0049
  first_appearance_candidate: true
- canonical_target: '[[E_char_トリシューラ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0049_トリシューラ_appears_as_赤い髪の少女_p1962
        quote: 鮮やかな真紅の髪を持つ少女と、氷のように煌めく白銀の髪を持つ少女。
        locator: {}
        spoiler_after: ch0049
    speech:
      observations:
      - event_ref: E_ch0049_トリシューラ_has_property_杖の天才_p1963
        quote: 弟子たちの誰よりも優秀な――こと杖の分野においては師である数人の専門的杖使いを除いて七十一姉妹のほとんどを凌駕するほどの――才覚を有するにも関わらず、トリシューラは疎まれていた。
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_トリシューラ_says_コルセスカ_p1963
        quote: 「理解できません。『気合い的』と『修行的』という言葉の定義を明確にして下さい。それと、理論の裏付けが無ければ正確な呪術の発動はできません。」
        locator: {}
        spoiler_after: ch0049
      - event_ref: E_ch0049_トリシューラ_says_コルセスカ_p1964
        quote: 呆れたようでありながらも、どこか柔らかいトリシューラの声。あんな彼女は、始めて見た。口調は相変わらず平坦だったけれど、微かな感情が――親愛が覗いている。
        locator: {}
        spoiler_after: ch0049
    relationship:
      observations:
      - event_ref: E_ch0049_トリシューラ_is_located_疎外_p1964
        quote: 対して、トリシューラは杖だけ。誰よりも杖の呪術を使いこなすけれど、それ以外の点では劣等生もいいところ。それゆえに蔑まれ、はっきりと疎外されていた。
        locator: {}
        spoiler_after: ch0049
  first_appearance_candidate: true
- canonical_target: '[[E_char_コルセスカ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0049_コルセスカ_has_property_邪視の天才_p1964
        quote: 対照的に、コルセスカはどの分野にも秀でており、特に邪視ではあのティエポロスと並ぶ天才だと評判だった。
        locator: {}
        spoiler_after: ch0049
  first_appearance_candidate: true
- canonical_target: '[[E_char_トライデント]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0049_トライデント_other_虐めの空気_p1966
        quote: そしてその弟子であるという使い魔操りの天才――トライデントという魔女が主導となってそういう空気は維持され続けてきた。
        locator: {}
        spoiler_after: ch0049
  first_appearance_candidate: true
- canonical_target: '[[E_term_ラクルラール]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch0049_ラクルラール_defines_虐め_p1966
        quote: それが【虐め】という古代から存在する力ある使い魔系呪術だと、ラクルラールは自慢の弟子を褒めちぎっていた。
        locator: {}
        spoiler_after: ch0049
  first_appearance_candidate: true
- canonical_target: '[[E_char_アズール]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0049_アズール_defeats_レッド_p1971
        quote: 上空から放たれた二条の光線が、狙い違わずレッドとティールの真芯を貫いていた。
        locator: {}
        spoiler_after: ch0049
  first_appearance_candidate: true
- canonical_target: '[[E_char_メートリアン]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0049_メートリアン_asks_プリエステラ_p1975
        quote: メートリアンは一瞬だけびくりとして、それからごそごそとドレスから小さな端末を取り出す。何かを入力して、それから床を滑らせてこちらへと届ける。
        locator: {}
        spoiler_after: ch0049
  first_appearance_candidate: true
