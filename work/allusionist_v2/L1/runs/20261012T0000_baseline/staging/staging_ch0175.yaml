      observations:
      - event_ref: E_ch0175_SNA333_appears_as_混沌の舞台_p5815
        quote: シナモリアキラたちが繰り広げた世界は、古今東西の『死人の森』像からなる混沌の舞台。多種多様な人種と文化が織りなす呪力の花が乱舞して、手の着けようのない無秩序が広がっていく。
        locator: {}
        spoiler_after: ch0175
  first_appearance_candidate: true
- canonical_target: '[[E_char_でかちびシューラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0175_でかちびシューラ_names_SNA333_p5815
        quote: 巨大な立体幻像となって観客たちの頭上に現れた『巨大ちびシューラ』曰く、彼女たちこそは新世代のシナモリアキラ。その名も――。「『ＳＮＡ３３３』！」
        locator: {}
        spoiler_after: ch0175
      - event_ref: E_ch0175_でかちびシューラ_other_クラスタ化_p5816
        quote: 「グループ内部の競争で序列化、階層化させて――実力で劣る下位クラスには単純で基礎的な役割を、実力が高い上位クラスには複雑で抽象的な振り付けを割り当てる。あなたたちは、全体で一つの統合体として振る舞えばそれでいい。
        locator: {}
        spoiler_after: ch0175
      - event_ref: E_ch0175_でかちびシューラ_says_ティリビナの巫女_p5820
        quote: 「不完全な木製人形じゃダメだよ、あの儀式は。だからこそ本命は『呪文の座』を招いてのライブなの。ティリビナの巫女がいなければ新世界には届かない」
        locator: {}
        spoiler_after: ch0175
    action:
      observations:
      - event_ref: E_ch0175_でかちびシューラ_captures_アマランサス_p5822
        quote: 言いたい放題に言ってから、でかちびシューラはドローンを動かしてアマランサスを捕縛。ひょいと運搬用アームで摘んで連行していく。
        locator: {}
        spoiler_after: ch0175
  first_appearance_candidate: true
- canonical_target: '[[E_char_俺アキラ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0175_俺アキラ_other_シナモリアキラ_p5816
        quote: そして、『俺』はゆるやかに覚醒した。 まず、言葉があった。それは光で、信号で、名付けられる前の何かだった。 焦点が必要だ。アドレスはどこに？
          闇の中を手探りで進む――手を伸ばせ。
        locator: {}
        spoiler_after: ch0175
      - event_ref: E_ch0175_俺アキラ_uses_舞台装置_p5818
        quote: 舞台装置が迫り出して、シナモリアキラたちを高みへと運んでいく。 これが手足。俺の肉体。
        locator: {}
        spoiler_after: ch0175
      - event_ref: E_ch0175_俺アキラ_defeats_アマランサス_p5819
        quote: 『ＮＯＫＯＴＴＡ』の大合唱がスピーカーから放出され、人形たちの世界が吹き散らされていった。圧倒的な暴力、絶大な呪力が嵐となってアマランサスを叩きのめす。
          戦いはここに決着した。
        locator: {}
        spoiler_after: ch0175
      - event_ref: E_ch0175_俺アキラ_flees_闇_p5830
        quote: 一難去ってまた一難。拠点にしたはずの場所が正体不明の闇に襲われ、俺たちは慌ててそこから逃げ出した。
        locator: {}
        spoiler_after: ch0175
      - event_ref: E_ch0175_俺アキラ_fights_特殊部隊_p5834
        quote: 『闇』から逃れてこちらに攻め込んでくる特殊部隊――『王女暗殺任務』を実行しようとする敵を豚の頭部で殴り倒しながら、俺もまた嘆息する。
        locator: {}
        spoiler_after: ch0175
      - event_ref: E_ch0175_俺アキラ_uses_肋骨_p5840
        quote: 俺はそれを恭しく受け取り、己の体内に埋め込んだ。俺は己の形を認識する。そう、俺は彼女で出来ていた。
        locator: {}
        spoiler_after: ch0175
    speech:
      observations:
      - event_ref: E_ch0175_俺アキラ_says_人類の拡張_p5824
        quote: 「大げさな話のようだが――トリシューラがいつも言ってる『人類の拡張』とか、俺という紀人の範疇を広げていくのとほぼイコールな話だな？」
        locator: {}
        spoiler_after: ch0175
      - event_ref: E_ch0175_俺アキラ_says_気高く美しい_p5835
        quote: 「違う。違います。リールエルバ殿下、あなたは気高く美しい、高慢なる吸血鬼の姫君だ――俺が請け負う、この場所で目を開いてからずっと貴方を見続けてきた俺が証明する。それだけは確かだと、何度でも言ってみせる」
        locator: {}
        spoiler_after: ch0175
  first_appearance_candidate: true
- canonical_target: '[[E_char_ゼド]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0175_ゼド_appears_as_盗賊王_p5828
        quote: くたびれたテンガロンハット、黒にアースカラーを交えた頑丈な革製品を身に纏い、盗賊王と呼ばれた探索者は延々と謎めいた語りを続ける。
        locator: {}
        spoiler_after: ch0175
    speech:
      observations:
      - event_ref: E_ch0175_ゼド_says_金は呪力だ_p5828
        quote: 「金は呪力だ。ファンがアイドルのイベントやグッズに対して消費行動を取ればそれが呪力となるように、アイドル活動は大規模な儀式と言える。そしてそれは、古代の祭祀国家における王と民の関係に近い」
        locator: {}
        spoiler_after: ch0175
      - event_ref: E_ch0175_ゼド_says_死人の森の女王_p5829
        quote: それは『死人の森の女王』――あらゆる約束を遵守させる法と罰の神だ。そして死者たちの王国に債務の不履行という概念は無い。ゆえにかの森の富こそ最も強い通貨。
        locator: {}
        spoiler_after: ch0175
    action:
      observations:
      - event_ref: E_ch0175_ゼド_attacks_クレイ_p5830
        quote: ゼドは右腕を長く伸ばすと指先を真っ直ぐにして『剣』の形に変える。そうして、まるでクレイがそうするように鮮やかに手刀を振るって見せた。「さて、略奪婚を始めるとしよう――『死神の腕』」
        locator: {}
        spoiler_after: ch0175
  first_appearance_candidate: true
- canonical_target: '[[E_org_ドラトリアの連邦捜査局]]'
  entity_type: organization
  aspects:
    action:
      observations:
      - event_ref: E_ch0175_ドラトリアの連邦捜査局_saves_リールエルバ_p5831
        quote: 男たちは槍を手にしたまま、一斉に影による敬礼を行った。 服の胸元と肩にはドラトリアの連邦捜査局を示すコウモリの羽に似た徽章が取り付けられていた。
        locator: {}
        spoiler_after: ch0175
  first_appearance_candidate: true
- canonical_target: '[[E_char_リールエルバ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0175_リールエルバ_is_located_三叉路_p5831
        quote: そうしているうち、俺たちはとうとう追いつかれてしまう。通路が分岐した三叉路。進むべき道すらわからないまま、背後から迫る『闇』の中から幾つもの影が実体となってリールエルバに襲いかかる。
        locator: {}
        spoiler_after: ch0175
      - event_ref: E_ch0175_リールエルバ_flees_男たち_p5833
        quote: 鋭い刃がリールエルバを襲うも、既に彼女は霧になってその場から離れている。 男たちが次々と呪宝石を砕いて呪術を発動させるが、その全てがあえなく不発に終わる。
        locator: {}
        spoiler_after: ch0175
      - event_ref: E_ch0175_リールエルバ_gives_肋骨_p5840
        quote: ほっそりとした指がリールエルバ自身のあばらに埋まっていく。彼女は手品のように肋骨を抜き取ると、俺に与えた。
        locator: {}
        spoiler_after: ch0175
      - event_ref: E_ch0175_リールエルバ_transforms_死人の森の女王_p5841
        quote: その自己認識に至った瞬間、私たちは存在を変質させた。 リールエルバは、『死人の森の女王』となり。 アルト・イヴニルは、シナモリアキラとなった。
        locator: {}
        spoiler_after: ch0175
    speech:
      observations:
      - event_ref: E_ch0175_リールエルバ_says_連邦捜査局の所属_p5832
        quote: 「――長年の修練の果てに自己の偽装細胞に覚え込ませたクセは無意識に現れるものよ。ねえあなた、連邦捜査局の所属なのよね」
        locator: {}
        spoiler_after: ch0175
      - event_ref: E_ch0175_リールエルバ_says_顔と声紋を記憶_p5832
        quote: 「私は登録されているドラトリア国民全ての顔と声紋を記憶しているわ。予想していなかったのかしら。槍神教民主同盟はもう少し考えて動くべきね」
        locator: {}
        spoiler_after: ch0175
      - event_ref: E_ch0175_リールエルバ_says_命を落とす_p5833
        quote: 「私はここで命を落とす。そういう筋書きだったのね。滑稽な。おそらくは地上の贄人どもでしょうけど、余りに愚かだわ。私を、私たちを排することの意味を正しく理解できないなんて」
        locator: {}
        spoiler_after: ch0175
      - event_ref: E_ch0175_リールエルバ_says_信仰を利用できない_p5835
        quote: 「槍神と天使マロゾロンドという形はもうダメね。使えない。私はあれらに裏切られた。私はもうあの信仰を利用して戦うことができない。敵の呪力でドラトリアを支配することなど不可能だわ。
        locator: {}
        spoiler_after: ch0175
      - event_ref: E_ch0175_リールエルバ_says_竜の巫女になる_p5837
        quote: 「決めたわ。私は竜の巫女になる。これ以上私から何も奪わせはしない」
        locator: {}
        spoiler_after: ch0175
      - event_ref: E_ch0175_リールエルバ_asks_あなたの全て_p5839
        quote: 「ちょうだい、欲しいの、あなたの全てが羨ましかった――トリシューラ。あなたの玉座、あなたの世界、あなたの王国、あなたの名前、あなたの――アキラ。ぜんぶちょうだい？」
        locator: {}
        spoiler_after: ch0175
      - event_ref: E_ch0175_リールエルバ_says_創世_p5839
        quote: 「始めましょう。私の王国を、私の世界を、私の創世を、はじめから」
        locator: {}
        spoiler_after: ch0175
  first_appearance_candidate: true
- canonical_target: '[[E_char_ガルカティス・トーヴィット]]'
  entity_type: character
  aspects:
    name:
      observations:
      - event_ref: E_ch0175_ガルカティス・トーヴィット_appears_as_陸軍所属_p5833
        quote: 「ガルカティス・トーヴィット少尉。あなたが連邦捜査局に所属していたことなど一度も無い。現在も陸軍に所属しているはず」
        locator: {}
        spoiler_after: ch0175
  first_appearance_candidate: true
- canonical_target: '[[E_item_闇]]'
  entity_type: item
  aspects:
    action:
      observations:
      - event_ref: E_ch0175_闇_attacks_男たち_p5833
        quote: またしても現れた『闇』が今度は標的を男たちと見定めたのだ。 どこまでも追いかけ、あらゆるものを食らい尽くす『闇』。 断末魔の絶叫が響く中、肉体を再構成させたリールエルバは淡々と呟いた。
        locator: {}
        spoiler_after: ch0175
  first_appearance_candidate: true
