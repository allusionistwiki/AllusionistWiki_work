  entity_type: organization
  aspects:
    speech:
      observations:
      - event_ref: E_ch0175_ドラトリア_has_property_二層構造_p5834
        quote: ドラトリア国内には夜の民だけでなく『上』の槍神系多数派ノローアーも暮らしている。二層に分かれたドラトリアにおいては『昼のドラトリア』に霊長類が多く、『夜のドラトリア』に夜の民が多い。
        locator: {}
        spoiler_after: ch0175
  first_appearance_candidate: true
- canonical_target: '[[E_item_ミシャルヒ]]'
  entity_type: item
  aspects:
    visual:
      observations:
      - event_ref: E_ch0175_ミシャルヒ_appears_as_夜の民_p5836
        quote: 「ミシャルヒと言う。ジャッフハリム四十四士がひとりにして遠い昔にお前と縁を結んだ者だ。
        locator: {}
        spoiler_after: ch0175
    speech:
      observations:
      - event_ref: E_ch0175_ミシャルヒ_asks_竜神の加護_p5836
        quote: 「槍神の権威は捨て、竜神の加護を選ぶといい。『大断絶』の後、『上』に近付いたドラトリアを、ふたたび『下』に――ジャッフハリムに接近させるのだ」
        locator: {}
        spoiler_after: ch0175
    action:
      observations:
      - event_ref: E_ch0175_ミシャルヒ_gives_断章_p5837
        quote: リールエルバが掌を返すと、その上に黒々とした物体が形成されていく。 黒革の不気味な装丁――『断章』と呼ばれる魔導書がそこにあった。
        locator: {}
        spoiler_after: ch0175
  first_appearance_candidate: true
- canonical_target: '[[E_char_カーティス]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0175_カーティス_defines_吸血鬼_p5842
        quote: 其は最古にして最新の始祖、病を殺す不滅の病――人類が『悪い空気』を知覚するのとほぼ同時期に発生させた、人の願いが作り出した吸血鬼。
        locator: {}
        spoiler_after: ch0175
    name:
      observations:
      - event_ref: E_ch0175_カーティス_names_隔離_p5842
        quote: 私の名は――。 『隔離』――孤高なりし夜の主。
        locator: {}
        spoiler_after: ch0175
  first_appearance_candidate: true
- canonical_target: '[[E_char_魔竜レーレンターク]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0175_魔竜レーレンターク_appears_as_七頭十角の獣_p5843
        quote: 山のごとき威容が峻厳と聳え立つ。 それは神秘。それは呪い。それは魔。 かつて魔竜と呼ばれた闇色の脅威。 七頭十角の獣。
        locator: {}
        spoiler_after: ch0175
  first_appearance_candidate: true
