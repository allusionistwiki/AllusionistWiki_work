entities:
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0002_アキラ_appears_倒れた木_p108
        quote: 私が着せてやったマントに黒髪黒瞳。空白の左手と鎧の右腕を持つシナモリ・アキラとかいうあの変態は、倒れた木を前にして、ぼうっと立ち尽くしていた。
        locator: {}
        spoiler_after: ch0002
    speech:
      observations:
      - event_ref: E_ch0002_アキラ_confesses_殺人_p108
        quote: 「人を殺したんだ。俺は人殺しだ。俺は犯罪者なんだ」
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アキラ_reveals_元の世界_p109
        quote: 「そうじゃない、いいか、俺はこの世界だけじゃない、元の世界でも、生前にも人を殺しているんだよ！ 俺は人殺しだ、この世界に来ても何も変わってない！
          死んでも馬鹿は治らなかったよ！」
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アキラ_confesses_カイン殺害_p110
        quote: 「そうだ、だから俺がカインを殺した！」
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アキラ_other_事故による転移_p116
        quote: 「俺は、元々別の世界に行くはずだったのが、原因不明の事故があって間違ってこの世界に来てしまったんです。異世界に移動するのは元の世界の技術と機械で、俺にそういう能力は無い。俺は見ての通りの右腕が義肢ってだけの一般人。だから当面の目的はとりあえず生き延びること、つまりキールや、その」
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アキラ_promises_エスフェイル倒壊_p117
        quote: 「貴方と協力して、エスフェイルを倒すのが、俺の目的です」
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アキラ_promises_階層の留守番_p163
        quote: 「それなら、しばらくの間でいいなら俺がここに残るよ。ただ、なるべく早く迎えに来てくれると助かる」
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アキラ_learns_誤転生_p167
        quote: 世界と世界が接触した時の物理的、あるいは情報的な衝撃や混乱によって、俺が本来希望していた異世界に転生できないという事故が発生したのかもしれなかった。
          異世界同士の接触による衝撃とその余波の影響で、俺はこの世界に『誤転生』した可能性が出てきた。
        locator: {}
        spoiler_after: ch0002
    action:
      observations:
      - event_ref: E_ch0002_アキラ_attacks_アズーリア_p111
        quote: 錯乱した男が、此方へ走り出す。
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アキラ_other_カインの言葉_p114
        quote: それを聞いた瞬間、くしゃりと顔を歪めて膝から崩れ落ちたアキラは、私の目を憚ることなく、声を上げて泣き始めた。
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アキラ_other_異世界_p115
        quote: 私が死者に祈りを捧げている間、彼は誰かと話をしていた。 「はい、なので現地の法に従って、ええ、それに関しても追って説明します。はい、生前の事も、そういうことです。すみません、お騒がせして、迷惑をおかけしました。今は立て込んでいるので、生き延びることが出来たらまた連絡を。それでは」
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アキラ_activates_Doppler_p127
        quote: 「音響処理アプリ、『Ｄｏｐｐｌｅｒ』起動」
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アキラ_uses_聴勁_p128
        quote: サイバーカラテの聴勁は、五感を研ぎ澄ませることによって周囲に潜む敵の動きを捉えることすら可能なのである。
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アキラ_uses_震脚_p129
        quote: 震脚。 サイバーカラテにおいては、義足の運用を前提に組み立てられている技術体系だが、俺はそれを生身の脚で実践した。
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アキラ_carries_アズーリア_p130
        quote: そのままの勢いで疾走し、木に押しつぶされる寸前のアズーリアを連れてその場を離脱する。
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アキラ_stops_サイバーカラテ道場_p133
        quote: 俺が選んだのは、『サイバーカラテ道場』だった。
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アキラ_uses_弾道予報Ver2.0_p136
        quote: 『Ｄｏｐｐｌｅｒ』が攻撃の前兆であるかすかな音を捉え、続いて『弾道予報Ｖｅｒ２．０』が作動。俺に向かって複数の赤いラインが伸びる。
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アキラ_uses_聴勁_p136
        quote: 聴勁。棘の中にはたらく力の流れ、筋骨の動きを感じ取る。脚であることを確信した俺は、その流れを『化かして』いく。
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アキラ_fights_テール_p142
        quote: 盾の防御と槌矛の反撃を潜り抜けた、肘打ちの二連打。槌矛の攻撃を完全に見切った上で、前に出ることで攻撃と回避を同時に行ったのだ。 肘の向こうに、頭部を砕かれたテールの残骸がある。
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アキラ_fights_トッド_p144
        quote: 「この胸当ては、あんたにもらったんだ」 トッドには、人狼から奪った胸当てをつけてもらったことがあった。それが今、防具としての役割を果たしていた。
          右腕が閃き、トッドの顔が存在した場所から鮮血が流れていく。
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アキラ_attacks_エスフェイル_p154
        quote: 宣告する。 『お前は、存在しない』 まやかしを暴くための言葉が放たれるのと共に、重く大地を踏みしめた『鎧の腕』の一撃が魔将の胴体に叩きつけられる。
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アキラ_fights_敵_p170
        quote: 動かないと死ぬ、ということだけを確信し、直感だけで真後ろへ回し蹴りを繰り出す。 手応え。腕で受けられた。
        locator: {}
        spoiler_after: ch0002
  first_appearance_candidate: true
- canonical_target: '[[E_relation_アズーリア]]'
  entity_type: relationship
  aspects:
    action:
      observations:
      - event_ref: E_ch0002_アズーリア_activates_心話_p108
        quote: 私は『心話』を起動する。
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アズーリア_takes_アキラの攻撃_p112
        quote: だから私は、躱そうと思えば躱せるその攻撃を、あえて受けた。 軽い衝撃と共に、兜が弾き飛ばされる。
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アズーリア_other_アキラの右手_p112
        quote: 呆然とこちらを見る彼の右手を、上からかぶせるようにしてそっと握った。 金属の硬さと冷たさを感じた。
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アズーリア_uses_死者を代弁する者_p114
        quote: 呪文が完成していく。『死者を代弁すること』。それこそが呪文の本質。呪いの頌歌。 オード
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アズーリア_bonds_アキラ_p117
        quote: 右の拳を握って、差し出す。 アキラは目を見開いて、すぐに頷いて、右手の甲を私のそれとぶつけた。
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アズーリア_fights_月_p140
        quote: 「あああああああっ！！」 アズーリアの中のそうした感情が、一斉に爆発した。 振り回された鈍器が縦横無尽に空間を制圧し、盾を、槍を、槌矛を打ち払っていく。
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アズーリア_uses_杖_p146
        quote: アズーリアの槌矛が、展開している。 俺は見誤っていた。あれはカインのものとも微妙にその形態が異なる。先端部が花弁のように複雑に広がり、柄が伸張していく。
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アズーリア_activates_静謐_p151
        quote: 対抗呪文。その名は【静謐】。 あらゆる呪術に対抗する、万能の呪術。
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アズーリア_breaks_エスフェイルの核_p155
        quote: 左手で握りしめ、軽く力を込める。それだけで石はあっけなく砕けた。
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アズーリア_makes_蒼穹の庭園_p158
        quote: 世界を上下に貫く槍の群れは姿を消して、そこに広がるのは一面の青。空の色をした造花が咲き乱れる屋外の庭園。透き通るような青い空、綺麗に整えられた芝生、庭園の区画を迷路のように複雑に区切る生垣がその空間の妖しさを増す。
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アズーリア_departs_第五階層_p164
        quote: 再会の約束を交わし、独特の手を左右に振る仕草（おそらく別れの挨拶だろう）で送り出してくれたアキラに同様の仕草を返し、私は地上へと転移した。
        locator: {}
        spoiler_after: ch0002
    speech:
      observations:
      - event_ref: E_ch0002_アズーリア_learns_外世界人_p109
        quote: 私たちは大きな勘違いをしていた。 あの男は外国人では無い。 外世界人だ。 「まさか、次元移動者？」
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アズーリア_learns_カインの依頼_p111
        quote: ゾンビ化のことを外世界人が知るはずもないし、ゾンビになる前に手を下して欲しいと、カイン本人が頼んだのだろう。
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アズーリア_says_背負わなくていいもの_p112
        quote: 「背負わなくていいものを、背負わないで」
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アズーリア_confesses_捨て石_p118
        quote: 「私は、仲間の命を捨て石にしたの。だからカインが死んだことで責められるべきは私」
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アズーリア_teaches_怒りの変換_p119
        quote: 「悲しみではなく、怒りを抱くこと。そして怒りは闘志に変えること。怒りや憎しみをそうして使ってやれば、遺された者は感情に溺れること無く戦い続けられる」
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アズーリア_other_左手の移植_p123
        quote: 「一応言っておく。寄生異獣を左腕の義肢にしようとか思わない方が良い。非常に危険だから」
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アズーリア_deceives_エスフェイル_p148
        quote: 「私もお前も呪術使い。言葉を弄して呪文を手繰るのがその本領の筈。私が盗聴を警戒して残り時間を偽るのも、仲間の死に冷静さを欠いてしまう激情家である振りをするのも、杖の使用回数を過少に申告するのも、当然予想してしかるべき。それを怠ったお前は、呪術使いとしては三流以下――いいや、こうやって隠し技に対応し損なうのは二度目だったな。訂正しよう、エスフェイル。お前は『手品師』以下だ」
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アズーリア_reveals_エスフェイルの本質_p154
        quote: 「その『紀源』は『幻』。うつろい、不確かで、形のない、そして本当はなにものでもない、それこそがエスフェイル。闇には脚など無い。闇とは無。何も無い場所で、地に足を付けることはできない」
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アズーリア_names_第五階層の掌握_p156
        quote: 「『松明の騎士団』アズーリア・ヘレゼクシュが、ここに第五階層の掌握を宣言する」
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アズーリア_conceals_背信行為_p161
        quote: ある理由から、私は直上の第四階層とこの階層とを繋げられない。が、そのへんはぼかした。 第四階層は、たった今エスフェイルを倒すまで、異獣の侵攻を食い止めるための防衛戦を行っていた筈だ。私を含むキール隊もそこに配置されていたのだが、それを放り出して第五階層の攻略に参加していた、などと聞けば、アキラも私に対する視線を仲間から犯罪者へ向けるそれへと変えるかも知れない。
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アズーリア_promises_アキラの同伴_p162
        quote: 「心配しなくても、ちゃんと貴方も連れて行く。今の私は階層掌握者だから、地上直通の転移権限を持っている。要するに念じるだけで地上にたどり着けるということ」
        locator: {}
        spoiler_after: ch0002
      - event_ref: E_ch0002_アズーリア_other_再会_p164
        quote: この約束が果たされるのは、約３１，５３６，０００秒も経過した時のこと。
        locator: {}
        spoiler_after: ch0002
