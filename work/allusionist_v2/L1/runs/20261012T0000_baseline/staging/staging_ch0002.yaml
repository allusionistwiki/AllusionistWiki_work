      - event_ref: E_ch0002_松明の騎士団_makes_寄生異獣_p122
        quote: 我々人類の敵、地獄の住人である異獣。その強大な力に対抗する グロソラリア 為に、『松明の騎士団』は異獣の細胞を人間に移植して、異獣の力
          によって異獣を滅ぼすことを思いついた。それが寄生異獣。
        locator: {}
        spoiler_after: ch0002
