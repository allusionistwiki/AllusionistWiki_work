- canonical_target: '[[E_char_ハルベルト]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0039_ハルベルト_conceals_記録_p1734
        quote: 死闘の後。その夜に起きた記録の欺瞞を激戦と平行して行っていた彼女は、五重の改竄処理を一括して管理実行している。
        locator: {}
        spoiler_after: ch0039
      - event_ref: E_ch0039_ハルベルト_other_メートリアン_p1735
        quote: 自分にしか出来ない解決方法がある。いずれにせよプリエステラと出会ってしまった以上、もう知らぬふりは出来ないのである。メートリアン共々、どうにかしてやろうとハルベルトは決定した。
        locator: {}
        spoiler_after: ch0039
    speech:
      observations:
      - event_ref: E_ch0039_ハルベルト_other_ナト_p1735
        quote: ナトは物質的な四肢と三本足を失ったが、それゆえにあれは化けるだろう。
        locator: {}
        spoiler_after: ch0039
      - event_ref: E_ch0039_ハルベルト_other_ペイル_p1735
        quote: ペイルには近接戦闘の訓練相手をさせてもいい。
        locator: {}
        spoiler_after: ch0039
      - event_ref: E_ch0039_ハルベルト_defines_異端審問官_p1736
        quote: 異教徒の異端審問官――その役割は、槍神教の内部を監査して組織の歪みを修整すること。異端と見定めたものを解体し、再構築すること
        locator: {}
        spoiler_after: ch0039
      - event_ref: E_ch0039_ハルベルト_names_大神院_p1737
        quote: ハルは異端を見つけた――歪み、曲がり、手段が自己目的化を繰り返し、信仰という呪術基盤が果たすべき本来の機能を見失った、暴走する空虚な中枢部
        locator: {}
        spoiler_after: ch0039
      - event_ref: E_ch0039_ハルベルト_reveals_大神院_p1737
        quote: 亜大陸独立戦線、精霊再生協会、緑の同胞団――槍神教内部に深く浸透しているテロリストや企業の密偵、下方勢力の工作員や諜報員の存在は星見の塔や大神院も把握している。知っていて放置しているの
        locator: {}
        spoiler_after: ch0039
      - event_ref: E_ch0039_ハルベルト_other_使命_p1738
        quote: 兎は【神々の図書館】のデータベースを管理し、世界の言語秩序を維持する種族。その王族であるハルが果たさなければならない使命は一つ
        locator: {}
        spoiler_after: ch0039
      - event_ref: E_ch0039_ハルベルト_defines_絶対言語_p1739
        quote: 【絶対言語】の再生。引き裂かれた言葉と意思を、再び繋いで語り直す
        locator: {}
        spoiler_after: ch0039
      - event_ref: E_ch0039_ハルベルト_says_世界平和_p1739
        quote: 「世界平和」
        locator: {}
        spoiler_after: ch0039
  first_appearance_candidate: true
