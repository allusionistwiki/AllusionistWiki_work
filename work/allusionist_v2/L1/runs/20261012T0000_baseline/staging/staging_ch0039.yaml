      observations:
      - event_ref: E_ch0039_松明の騎士団_uses_金鎖_p1734
        quote: 松明の騎士たちの視界映像は呪動装甲もしくは寄生異獣を制御する金鎖によって記録されている。それは金鎖システム上で共有され、エルネトモランの本部へと送信されることになっていた。
        locator: {}
        spoiler_after: ch0039
  first_appearance_candidate: true
- canonical_target: '[[E_char_イルス]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0039_イルス_confesses_覚悟_p1736
        quote: 言い訳をするつもりはない。覚悟は既に決めている。露見していると思ったがゆえに、あのような身の上話をしたのだ。後悔無く逝けるようにな
        locator: {}
        spoiler_after: ch0039
  first_appearance_candidate: true
- canonical_target: '[[E_term_ミルーニャ]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch0039_ミルーニャ_names_ミルーニャ_p1740
        quote: メートリアンであることを捨てる気はありません。けれど、ミルーニャであることを否定する気もなくなりました。だから、今までのようにミルーニャとお呼び下さい。
        locator: {}
        spoiler_after: ch0039
      - event_ref: E_ch0039_ミルーニャ_other_生存欲求_p1741
        quote: 貴方が教えてくれたから。だから、生きていたいです。普通に生きて死んで――それで、一杯長生きして、普通に歳を重ねて、できれば幸せに死にたい。
        locator: {}
        spoiler_after: ch0039
      - event_ref: E_ch0039_ミルーニャ_other_アズーリア_p1742
        quote: ありがとう。貴方は本当に英雄でした。小さくて素敵な、ミルーニャの勇者様
        locator: {}
        spoiler_after: ch0039
      - event_ref: E_ch0039_ミルーニャ_other_家族関係_p1744
        quote: おかとーさまとお呼びしても
        locator: {}
        spoiler_after: ch0039
      - event_ref: E_ch0039_ミルーニャ_other_権利_p1745
        quote: ここまでにして、ミルーニャを――この白のメートリアンを打ち破った以上、アズーリア様にも権利が生まれたことになります
        locator: {}
        spoiler_after: ch0039
      - event_ref: E_ch0039_ミルーニャ_other_襲名_p1746
        quote: 呪文の座の予備候補、澄明のアズーリアとして、ハルベルトの襲名をかけて黒のヴァージリアと対決するという道です
        locator: {}
        spoiler_after: ch0039
      - event_ref: E_ch0039_ミルーニャ_reveals_予備候補_p1746
        quote: そして、予備候補が予備候補を倒せばその順位は入れ替わります
        locator: {}
        spoiler_after: ch0039
      - event_ref: E_ch0039_ミルーニャ_other_彩石_p1747
        quote: フォービットデーモン。キュトスの姉妹第二位【燦然たる珠】ダーシェンカお姉様の解けない呪いによって生み出された大呪石【彩石】が照らし出す影。
        locator: {}
        spoiler_after: ch0039
      - event_ref: E_ch0039_ミルーニャ_reveals_記憶操作_p1747
        quote: ま、コキューネーお姉様の脳髄洗いで綺麗さっぱり記憶操作されたんですから、覚えていないのも無理はないですよね。
        locator: {}
        spoiler_after: ch0039
      - event_ref: E_ch0039_ミルーニャ_defines_英雄_p1748
        quote: 二つの資格――きっと、そうやって運命が幾つも折り重なるからこそ貴方たちは英雄足り得るんでしょう
        locator: {}
        spoiler_after: ch0039
      - event_ref: E_ch0039_ミルーニャ_names_ヘレゼクシュ_p1748
        quote: 最も優れていたのは彩度第十六番、澄明のヘレゼクシュ。姉妹第二位の後ろ盾と文句なしの傑出した才覚。呪文の座の正規候補者、その最右翼。
        locator: {}
        spoiler_after: ch0039
      - event_ref: E_ch0039_ミルーニャ_names_幻想者_p1748
        quote: 貴方とヴァージリアは最も優れた呪文使いとして、幻想者と呼ばれていました。
        locator: {}
        spoiler_after: ch0039
  first_appearance_candidate: true
- canonical_target: '[[E_char_アズーリア]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0039_アズーリア_other_ミルーニャ_p1741
        quote: 嫌。そんなことはさせない
        locator: {}
        spoiler_after: ch0039
    speech:
      observations:
      - event_ref: E_ch0039_アズーリア_defines_眷族種_p1743
        quote: 序列第二位の私達はほとんど非実体みたいなものだ。実は二位というのも昼間は弱体化するという性質の為であって、一位の空の民よりも純粋な呪術生命体に限りなく近い。
        locator: {}
        spoiler_after: ch0039
      - event_ref: E_ch0039_アズーリア_other_縮小_p1743
        quote: 限界を超えて呪力を使ってしまったから。今は夜だし、しばらくこのまま月光を浴びていればそのうち元に戻るよ
        locator: {}
        spoiler_after: ch0039
      - event_ref: E_ch0039_アズーリア_other_自己_p1749
        quote: アズーリア。その名の意味を、私はまだ知らない。知りたい。私は、どんな形をしている？
        locator: {}
        spoiler_after: ch0039
  first_appearance_candidate: true
