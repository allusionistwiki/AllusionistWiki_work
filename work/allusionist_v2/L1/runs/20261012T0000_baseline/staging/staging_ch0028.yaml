        locator: {}
        spoiler_after: ch0028
      - event_ref: E_ch0028_上司_asks_本業_p1235
        quote: 「どうにか『無かったこと』として収めないと私も君も色々危ないことになる。というわけで――『本業』の方、頼もうか。」
        locator: {}
        spoiler_after: ch0028
      - event_ref: E_ch0028_上司_says_また_p1235
        quote: '「『また』か」

          「『また』です」'
        locator: {}
        spoiler_after: ch0028
      - event_ref: E_ch0028_上司_says_転生_p1236
        quote: 「全く、正気の沙汰じゃないね。転生なんざする奴も、異世界に転移する奴も、気が知れん。自分が消えて異世界に再構成されたって、そいつは同じってだけで意識は連続してない別人だろうに」
        locator: {}
        spoiler_after: ch0028
