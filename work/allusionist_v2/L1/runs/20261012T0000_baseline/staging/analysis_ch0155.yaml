      paragraph: p5270
    - quote: 最適化学習だけを連続して行うのは危険だと言っておこう
      paragraph: p5266
    note: ヴァージルの理想とする「暴力の外部化・管理」に対し、カーインの「肉体に刻まれた武」や「隠された秘密」が対抗軸となり、技術による完全な秩序維持の不可能性を示唆する。
  - kind: theme
    theme: 自我の無限後退と正体の不在
    weight: 0.85
    quotes:
    - quote: 隠されるべきものなどなく、秘密だけがそこにある。『隠』という呪力。ただそれだけで成立する『何者か』。
      paragraph: p5280
    - quote: 世界とは、頭蓋骨の内側で完結しているものなのだから
      paragraph: p5281
    note: カーインの能力が示すように、自我や正体は深層に潜む固定的な核ではなく、無限に再生産される構造（あるいは虚無）であるという哲学的テーマ。
  - kind: theme
    theme: 伝統的武術とデジタル最適化の対立
    weight: 0.7
    quotes:
    - quote: 最後にものを言うのは己が信じる『視座』ひとつ。すなわち肉体に刻まれた武の体系のみ。
      paragraph: p5266
    - quote: 最適な戦術も定石も既にインドアユーザーたちによって完成されている。
      paragraph: p5266
    note: データに基づく最適化された戦闘（レミルス/百々目鬼）と、経験と勘、そして「隠し」に基づく伝統的戦闘（カーイン）の対比。
  - kind: theme
    theme: 善意による支配と洗脳
    weight: 0.6
    quotes:
    - quote: 洗脳という手段もまた暴力には違いないが、理性ある夜警が人々を管理する限り不都合が出ることはない。
      paragraph: p5272
    - quote: 優しく肯定してくれるヴァージルの言葉が耳に心地よい。
      paragraph: p5272
    note: ヴァージルが「友達」として百々目鬼を操り、彼らもまたその管理を心地よく受け入れている姿は、自由意志の喪失と優しい全体主義の恐怖を描く。
