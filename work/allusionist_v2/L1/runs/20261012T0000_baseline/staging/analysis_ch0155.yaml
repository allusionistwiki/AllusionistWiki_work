  mysteries:
  - kind: mystery
    name: MY_鬼の遺言と岩肌種
    note: 死に際の『鬼』がカーインに託した「巨人の力を振るう岩肌種」との戦い、および「トロル」という呼称。
    quotes:
    - quote: 巨人の力を振るう岩肌種と出会ったら戦ってやってくれないか。そして、すまない トロル と伝えてほしい
      paragraph: p5262
    expected_payoff: カーインが後に岩肌種（トロル）のキャラクターと遭遇し、その戦いを通じてカーインの過去や『鬼』との因縁、あるいはカーイン自身の正体に関する手がかりが明かされる。
  - kind: mystery
    name: MY_カーインの角の正体
    note: カーインの頭部に現れた、シナモリアキラの装置ではない「生来の角」。
    quotes:
    - quote: それは角。すぐそこに転がっているシナモリアキラだったものが脳に埋め込んでいた装置とは異なる、紛う事なき生来のものだ。
      paragraph: p5268
    expected_payoff: カーインが単なる吸血鬼や人間ではなく、特定の種族（鬼族や魔族など）の血統や、オルヴァとの関係性を示す重要なアイデンティティの証として機能する。
  - kind: mystery
    name: MY_第五階層の異常な雪
    note: 第五階層では降らないはずの雪が降り始め、ヴァージルが「姫」の目覚めを疑う。
    quotes:
    - quote: はらはらと舞う雪。通常であれば第五階層には降らないはずの異常である。
      paragraph: p5274
    - quote: 雪？ 珍しい。姫が目覚めかけているのかな？
      paragraph: p5274
    expected_payoff: 「姫」と呼ばれる存在（おそらくオルヴァに関連する女性キャラクターや、第五階層の管理者）の覚醒や干渉が、物語の大きな転換点となる。
  - kind: mystery
    name: MY_気象庁に封じられた大入道
    note: ヴァージルが気象庁に運び込み、二度と出てこなかった巨大コンテナ内のシナモリアキラ『大入道』。
    quotes:
    - quote: その荷物の中には、『大入道』という名のシナモリアキラが封じ込められていた。コンテナは建物の中に消えると、二度と出てくることは無かった。
      paragraph: p5275
    expected_payoff: 気象庁のシステムと大入道の呪力が融合し、第五階層全体の天候や環境を支配する巨大な兵器、あるいは新たな脅威として登場する。
  - kind: mystery
    name: MY_十三人目のアキラ
    note: トリシューラが変貌した「十三人目」の存在。十二人のシナモリアキラの誰とも一致しない未知の呪力波形。
    quotes:
    - quote: あの『きぐるみ』から発せられている呪力の波形は全くの未知。十二人のシナモリアキラの誰とも該当しない。
      paragraph: p5282
    - quote: 突如として現れた『十三人目』は、不敵に宣言する。
      paragraph: p5283
    expected_payoff: ヴァージルの計画の想定外であり、オルヴァの計画や世界の成り立ちそのものを覆す「外からの介入者」あるいは「真の主人公」的な役割を果たす。
  - kind: mystery
    name: MY_レミルスの無限の牢獄
    note: カーインの脳内（内世界）に囚われ、無限に内側へ落ち続けるレミルスの運命。
    quotes:
    - quote: 無限の牢獄に囚われた虹犬が絶叫する。彼は肉体ごと異界の中に取り込まれ、出口の無い迷路を永遠に彷徨い続けるだろう。
      paragraph: p5281
    expected_payoff: レミルスがカーインの「隠」の本質を理解し、あるいはカーイン自身を内部から変容させることで脱出する、あるいはカーインの精神の一部となる展開が示唆される。
  themes:
  - kind: theme
    theme: 情報化社会における暴力の外部化と管理の限界
    weight: 0.9
