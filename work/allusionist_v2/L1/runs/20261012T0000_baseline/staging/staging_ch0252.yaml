- canonical_target: '[[E_org_ダウザール会議]]'
  entity_type: organization
  aspects:
    action:
      observations:
      - event_ref: E_ch0252_ダウザール会議_other_八人_p8125
        quote: ダウザール会議。参加人数は八人に及ぶ。 老人たちが口を開くと、立て続けに罵声と嘆きが飛び交う。
        locator: {}
