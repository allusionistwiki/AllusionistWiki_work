        locator: {}
        spoiler_after: ch0252
    action:
      observations:
      - event_ref: E_ch0252_チッセ・ディパーシュ・クロウサー_attacks_クオア_p8108
        quote: 手錠と拘束具でほとんど動かせない両手の先をぱたぱたと開閉するたび、細い身体が移動し周囲を風が吹き抜ける。煽るような強風は倒れたクオアの頭部を執拗に襲っていた。
        locator: {}
        spoiler_after: ch0252
      - event_ref: E_ch0252_チッセ・ディパーシュ・クロウサー_activates_異界閉鎖_p8109
        quote: 「クオア、ちょっとこの隣接異界を閉鎖するから、掌握者権限借りるよぉ？ チッセ・ディパーシュ・クロウサーの名において空と大地に命ずる。閉ざせ」
          宣名と同時、どこまでも広大な青空が一瞬にして縮む。
        locator: {}
        spoiler_after: ch0252
      - event_ref: E_ch0252_チッセ・ディパーシュ・クロウサー_kills_生き残りの人形_p8109
        quote: 簡素な『空圧』の呪術基盤。岩盤の陰から奇襲を仕掛けようとしていた生き残りの人形が吹き飛ばされ、両断された。人形に縦に走った細い『線』が二本、三本と増え続け、嵐のように荒れ狂いながら対象を微塵に切り刻む。
        locator: {}
        spoiler_after: ch0252
    speech:
      observations:
