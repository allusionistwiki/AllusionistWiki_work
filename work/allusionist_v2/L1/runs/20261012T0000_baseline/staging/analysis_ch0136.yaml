    - quote: 紅紫に煌めく邪眼――それは、美しい光を宿していてもやはり濁った水面には違いないのだ。
      paragraph: p4687
    note: マラード陛下の美しさが周囲を狂わせ、カシュラムを滅ぼす。美は祝福ではなく、他者を従属させ、自己を神格化するための暴力装置として描かれている。
  - kind: theme
