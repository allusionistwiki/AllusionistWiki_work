  mysteries:
  - kind: mystery
    name: MY_断章_富_トラスト
    note: ミルーニャの魔導書の第七断章が【富】であり、トラスト（信頼/信用）という概念と結びついている。これが経済的価値と呪術的価値の交換、あるいは信用創造のようなメカニズムに関わる伏線。
    quotes:
    - quote: 【死人の森の断章】――その第七。名を【富】。トラスト
      paragraph: p4657
    expected_payoff: 呪石の質や召喚のコストが、単なる物質ではなく「信用」や「契約」によって変動するシステムとして明かされる。
  - kind: mystery
    name: MY_セリアックニアの曖昧な生死
    note: 公的には死亡扱いだが、生死が曖昧なまま運用されている。完全に復活させると本国に捕捉されるという制約が、彼女の存在の不安定さと、いずれ訪れる「完全復活」または「完全消滅」のリスクを示唆。
    quotes:
    - quote: 完全に復活させると『生きている』ことが確定してしまい本国に捕捉されてしまうため、生死が曖昧なまま必要に応じて呪石弾で召喚する形で利用させてもらっている。
      paragraph: p4665
    expected_payoff: セリアック＝ニアの存在が政治的・宗教的に問題視され、彼女を守るためにミルーニャたちが「生死の曖昧さ」を維持する戦いに巻き込まれる。
  - kind: mystery
    name: MY_アレッテの太陰での目的
    note: アレッテ・イヴニルが太陰で何らかの儀式を行い、痕跡を残していた理由が不明。単なる逃走ではなく、何かを仕掛けた可能性が高い。
    quotes:
    - quote: 各地には砕け散った岩石の山と、何らかの呪術儀式を行ったと思しき跡。詳細は調べられなかったが、明らかにアレッテ・イヴニルは何かの明確な目的を持って太陰で暗躍していたのだ。
      paragraph: p4669
    expected_payoff: 太陰で仕掛けられた儀式が、後の大規模な呪術的災害や、アレッテの真の目的（マラードへの接近など）の準備であったことが判明する。
  - kind: mystery
    name: MY_ブレイスヴァの伝承
    note: オルヴァ王が「ブレイスヴァ」を奉じ、全てを飲み込む力を持つ。アレッテが「自らの伝承や文脈によって戦う者は強いけれど、同じ文脈に沿って同じ伝承を利用すれば滅ぼせてしまう」と述べており、伝承の脆弱性が鍵。
    quotes:
    - quote: 自らの伝承や文脈によって戦う者は強いけれど、同じ文脈に沿って同じ伝承を利用すれば滅ぼせてしまうというリスクを負う――呪術戦闘の基本だけれど、研究の進んだ後世の私たちがそれを言うのは卑怯かしら
      paragraph: p4685
    expected_payoff: 敵対勢力が、相手の信仰や伝承の矛盾を突くことで、強力な能力を逆手に取って無力化する戦術が多用される。
  - kind: mystery
    name: MY_アレッテの正体とマラードの関係
    note: アレッテがマラード陛下の末裔（あるいは模造品）を名乗り、彼に接近した。ルバーブが彼女を「傾国の魔女」と予感しており、マラードの破滅の引き金になる可能性。
    quotes:
    - quote: アレッテ・イヴニル・ラプンシエル・ディルトーワ＝ベルラクルラールは、マラード・ディルトーワ・アム＝ドーレスタ・エフ＝ラフディ陛下にお力添えすべく推参致しました
      paragraph: p4686
    expected_payoff: アレッテがマラードを操り、あるいはマラードの美徳を悪用して、ラフディ王国を内部から崩壊させる。
  themes:
  - kind: theme
    theme: 物語の文脈（ナラティブ）による現実改変と、その脆弱性
    weight: 0.9
    quotes:
