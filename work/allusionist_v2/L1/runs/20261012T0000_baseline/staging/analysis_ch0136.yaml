    - quote: もしや貴方は我が国に伝わるディルトーワの技術を受け継いでいるのでは？
      paragraph: p4686
    note: アレッテが「模造品」であることを隠さず、むしろ武器として使う姿勢。正統な歴史や血統が、いかに容易に偽造され、権力闘争に利用されうるかを示す。
