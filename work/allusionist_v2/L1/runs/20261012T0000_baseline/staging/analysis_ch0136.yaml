      paragraph: p4659
    note: セリアック＝ニアが「呪石弾」と呼ばれ、消耗品として扱われること。彼女が人格を持つ存在でありながら、プレイヤー（ミルーニャ）にとっての「リソース」や「玩具」に過ぎないという倫理的葛藤。
  - kind: theme
