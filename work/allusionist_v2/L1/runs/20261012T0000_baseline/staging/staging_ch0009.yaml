entities:
- canonical_target: '[[E_char_カッサリオ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0009_カッサリオ_appears_イッカク_p399
        quote: 巨大なイッカクだ、とまず最初に思った。 牙が螺旋状に変形、発達して角のように見えることが最大の特徴の、小型のクジラだ。
        locator: {}
        spoiler_after: ch0009
    action:
      observations:
      - event_ref: E_ch0009_カッサリオ_attacks_コルセスカ_p400
        quote: まず真っ先にコルセスカにその特徴的な角（牙？）を向けた。 長大な独角が一瞬、ぶるりと震える。次の瞬間、角が向けられた直線上の空間を、不可視の衝撃が走り抜けていく。
        locator: {}
        spoiler_after: ch0009
      - event_ref: E_ch0009_カッサリオ_kills_コルセスカ_p400
        quote: 直撃を受けた肉体が胸の辺りを中心に螺旋状に歪み、ねじ切られていく。 大量の血を撒き散らしながら、コルセスカは無数の肉片になって飛散していった。
        locator: {}
        spoiler_after: ch0009
      - event_ref: E_ch0009_カッサリオ_attacks_アキラ_p403
        quote: 背後から押し寄せた衝撃波が迷宮の壁を根こそぎ破壊しながら頭上を通過していく。 直撃こそ免れたものの、衝撃の余波に耐えきれなかったのか、自動二輪の前面装甲が剥がれ、思い切り横転する。
        locator: {}
        spoiler_after: ch0009
      - event_ref: E_ch0009_カッサリオ_kills_コルセスカ_p420
        quote: 横薙ぎの衝撃波が至近距離からコルセスカをバラバラに引き裂いていく。
        locator: {}
        spoiler_after: ch0009
      - event_ref: E_ch0009_カッサリオ_defeats_アキラ_p421
        quote: 衝撃波を放った反動をあえて脚から床に逃さず、自ら大きく体勢を崩す。 それによって俺の狙いが外れ、カッサリオは致命的な一撃を回避してのけたのだ。
        locator: {}
        spoiler_after: ch0009
      - event_ref: E_ch0009_カッサリオ_activates_アラームトラップ_p426
        quote: カッサリオの長大な一角、その震え方が、いつのまにか今までと異なっている。 破壊を伴う衝撃波ではなく、不快な耳鳴りを伴うか細い音に変化していたのだ。
        locator: {}
        spoiler_after: ch0009
  first_appearance_candidate: true
- canonical_target: '[[E_char_トリシューラ]]'
  entity_type: character
