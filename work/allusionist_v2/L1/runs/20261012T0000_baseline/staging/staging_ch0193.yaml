        locator: {}
        spoiler_after: ch0193
      - event_ref: E_ch0193_コルセスカ_says_オーディション_p6388
        quote: 「クレイ。いいえ、クレイ役を失格になった無名の役者。舞台『死人の森』はあなたを選ぶことはありませんでした。しかし悲観することはありません。この広い世界にはオーディションなど幾らでもあります。」
        locator: {}
        spoiler_after: ch0193
      - event_ref: E_ch0193_コルセスカ_promises_ルウテトの保証_p6389
