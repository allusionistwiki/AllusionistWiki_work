- canonical_target: '[[E_org_第五階層]]'
  entity_type: organization
  aspects:
    visual:
      observations:
      - event_ref: E_ch0198_第五階層_has_property_逆さまの大樹_p6636
        quote: 見上げれば、第五階層の天は青々と生い茂っていた。 逆さまの大樹とそれを取り囲む森が不可思議な燐光で世界を照らしている。
        locator: {}
        spoiler_after: ch0198
      - event_ref: E_ch0198_第五階層_has_property_狂った景観_p6644
        quote: たとえば小さな箱型建造物の上に巨大な逆三角形が屹立し、更にその上に橋が築かれて虚空に開いた『扉』へと繋がっていたり。 たとえば三段重ねの箱から突如として一番下の箱が消失するも座標が固定されているために上の箱は落下することなく中空に浮いたままだったり。
          無秩序な街の景観は控え目に言って狂っていた。
        locator: {}
        spoiler_after: ch0198
    speech:
      observations:
      - event_ref: E_ch0198_第五階層_has_property_自由_p6645
        quote: 自由であれ。あらゆる意思と情動を駆動させ、混沌とした世界の住人であれ。 そうした暗黙の強制力がこの空間を支配し、一定の秩序を形作っている。
        locator: {}
        spoiler_after: ch0198
      - event_ref: E_ch0198_第五階層_is_located_魔都_p6646
        quote: 『上』や『下』で居場所を失った人々が最後に辿り着くのがこの魔都だ。みな、苛酷な因縁と苦痛に満ちた過去を背負ってここにいる。 それでも、難民たちが生活を積み重ねて次の世代に希望を繋ごうとするように、今を生きるものたちは未来に向かって歩いている。
        locator: {}
        spoiler_after: ch0198
  first_appearance_candidate: true
