  aspects:
    speech:
      observations:
      - event_ref: E_ch0095_コルセスカ_says_トリシューラへの適用_p3483
        quote: きっとこの技法はトリシューラの為にこそある、と。 邪視が苦手なトリシューラが、その代替として『固有の世界観』を手に入れるための一助となるはずだというのだ。
        locator: {}
        spoiler_after: ch0095
      - event_ref: E_ch0095_コルセスカ_asks_サイザクタート_p3485
        quote: 「ねえ、お爺さん。一体どうして、あなたの頭は三つもあるの？ それに、まだお日様も高いのに、二人ともぐっすりだわ。お寝坊さんなのに、起こさなくていいのかしら？」
        locator: {}
        spoiler_after: ch0095
      - event_ref: E_ch0095_コルセスカ_says_神への訪問_p3486
        quote: 「いいえ、違うの。私たち、神様に会いに来たのよ」
        locator: {}
        spoiler_after: ch0095
      - event_ref: E_ch0095_コルセスカ_other_おままごと_p3496
        quote: 「おままごとをすればいいのです！」
        locator: {}
        spoiler_after: ch0095
      - event_ref: E_ch0095_コルセスカ_other_六王国の劇_p3496
        quote: 「じゃあこうしましょう。その六つの王国の劇をするの」
        locator: {}
        spoiler_after: ch0095
      - event_ref: E_ch0095_コルセスカ_confesses_自身の能力_p3497
        quote: 「できます」 それは確信というより、ごく当たり前の常識を口にするかのような口調だった。
        locator: {}
        spoiler_after: ch0095
      - event_ref: E_ch0095_コルセスカ_other_再演による救済_p3497
        quote: 「ここの神様に逆らうような劇はしては駄目なら、関係無い場所ならいいということでしょう？ 六つの王国を『再演』によって救い、その力を借りてヒュールサスを救って貰うのです。
        locator: {}
        spoiler_after: ch0095
      - event_ref: E_ch0095_コルセスカ_says_既知の事実_p3498
        quote: 「私には、それができるのです。私は、それを既に知っている」
        locator: {}
        spoiler_after: ch0095
  first_appearance_candidate: true
- canonical_target: '[[E_char_サイザクタート]]'
