      - event_ref: E_ch0095_アキラ_thinks_零落の原因_p3494
        quote: 『零落』――またその言葉を聞いた。 全てはその現象から始まったということだが、一体何が原因なのだろう？
        locator: {}
        spoiler_after: ch0095
    visual:
      observations:
      - event_ref: E_ch0095_アキラ_observes_サイザクタート_p3485
        quote: 見れば左右共に、中央の老犬に比べると若々しい。俺は虹犬の年齢を正確に判別することはできない。しかしなんとなく、【マレブランケ】の新入りであるグラッフィアカーネと同年代なのではないかと思えた。
        locator: {}
        spoiler_after: ch0095
      - event_ref: E_ch0095_アキラ_observes_背景の槍_p3495
        quote: そういえば、背景には天を衝く槍が描かれていない。 もしかすると、この時代にはまだ世界槍が出来ていないのかもしれない。
        locator: {}
        spoiler_after: ch0095
  first_appearance_candidate: true
- canonical_target: '[[E_char_コルセスカ]]'
