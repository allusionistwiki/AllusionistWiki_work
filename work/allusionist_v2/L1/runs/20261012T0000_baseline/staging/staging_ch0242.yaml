        quote: アルト王に仕えた五人の騎士。その一人であるアルバダオバ・ハツワシュは古代ガロアンディアンにおける四つの海軍戦力の中で最強と目された白海騎士団の統率者である。
        locator: {}
        spoiler_after: ch0242
    visual:
      observations:
      - event_ref: E_ch0242_アルバダオバ_has_property_透明な水_p7917
        quote: だが波打つ湖面は最初から透き通っていた。 どんな守りも貫く無数の棘は、不定形の水を抜けてただ濡れていくだけだ。
        locator: {}
        spoiler_after: ch0242
    action:
      observations:
      - event_ref: E_ch0242_アルバダオバ_other_カルメダージ_p7918
        quote: ぱたん。カルメダージが掌握するはずの浄界内部に小さな扉が開き、彼を招き入れる。 ごくり。アルバダオバが喉を鳴らすと、長い首を何かが通り過ぎていく。
          やがて腹の中に収まったそれは断末魔の呪詛を炸裂させると共に体内から無数の棘を炸裂させたが、先ほどと同じく流水のような水棲亜竜には全くの無意味。
        locator: {}
        spoiler_after: ch0242
      - event_ref: E_ch0242_アルバダオバ_transforms_白翼海への扉_p7919
        quote: 「このアルバダオバの身体は『白翼海への扉』にございます。海、それは遥かな世界への出入口。航海の果てに待つ宝は得難い経験、はたまた新たな友人かもしれません」
        locator: {}
        spoiler_after: ch0242
    speech:
      observations:
      - event_ref: E_ch0242_アルバダオバ_confesses_忠誠_p7921
        quote: 「このアルバダオバ・ハツワシュ・ディスケイム。長き時を超え、アゥルメイアお嬢様のお役に立てて光栄にございます。ああ、お嬢様の作品が、子供たちがこんなにご立派になられて。じいは、じいは嬉しゅうございますぞ」
        locator: {}
        spoiler_after: ch0242
