          予備の泡が起動できればまだガルラ様を逃、待て、何だこれは」 混乱に次ぐ混乱。ソムワムンは己の言葉と精神が制御不能になっていることを自覚し、自己診断さえ欺瞞されていることで絶望し、その感覚さえ即座に失う。
