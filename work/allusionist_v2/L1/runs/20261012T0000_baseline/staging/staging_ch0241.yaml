      - event_ref: E_ch0241_クオア_defeats_オルガンローデ_p7906
        quote: 発動した髪の毛の竜滅呪がクオアに牙を剥く。　だが、それは一瞬で焼き尽くされた。　同等以上の規模で放たれたオルガンローデ。
        locator: {}
        spoiler_after: ch0241
      - event_ref: E_ch0241_クオア_transforms_本性_p7907
        quote: '柔和に見えた男の顔が歪み、霊長類として

          の偽装が剥がれていく。　虚空から溢れ出した青い血がクオアの全身を取り囲み、膨張して巨大な本性を実体化させようとしていた。'
        locator: {}
        spoiler_after: ch0241
