        locator: {}
        spoiler_after: ch0014
      - event_ref: E_ch0014_トリシューラ_defines_ヒエロス・ガモス_p663
        quote: 「魔女と使い魔の正式な契約には幾通りもの形式があるけれど、私は春の魔女として、ヒエロス・ガモスという儀式を行う」
        locator: {}
        spoiler_after: ch0014
      - event_ref: E_ch0014_トリシューラ_other_アナロギア_p664
        quote: 「呪術はほとんど同じ仕組みってことだよ。『似ているものは連動する』という規則に従ってあらゆる呪的なエネルギーは働くの。」
        locator: {}
        spoiler_after: ch0014
      - event_ref: E_ch0014_トリシューラ_other_アーティファクト_p665
        quote: 「だから、壮大な儀式呪術を執り行って、可能な限り呪力を注ぎ込んだ呪具にするの。アキラくんが、もっと強くなれるように」
        locator: {}
        spoiler_after: ch0014
      - event_ref: E_ch0014_トリシューラ_promises_契約の自由_p666
        quote: 「私との契約は、なにも魂を捧げるような大それたものじゃない。アキラくんが不満だと思えばいつでも破棄できるものなんだよ。」
        locator: {}
        spoiler_after: ch0014
    action:
      observations:
      - event_ref: E_ch0014_トリシューラ_travels_コルセスカの部屋_p642
        quote: 「ちょっと寄り道するけどいい？」
        locator: {}
