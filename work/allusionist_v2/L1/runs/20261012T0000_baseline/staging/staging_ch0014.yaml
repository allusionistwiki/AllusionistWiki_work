- canonical_target: '[[E_char_コルセスカ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0014_コルセスカ_appears_荒れた部屋_p643
        quote: まず目に点いたのは部屋の中央でもそっと膨らんでいる毛布の塊である。寝台からマットレスだけが引き抜かれ、部屋の中心に鎮座しており、それを布団にして寝ているらしい。
        locator: {}
        spoiler_after: ch0014
      - event_ref: E_ch0014_コルセスカ_appears_包帯_p648
        quote: 暗い紫の包帯であった。枕を掴んだ手から腕、肘にかけて、肌が見えなくなる程にびっしりと暗色の帯が巻き付けられていたのである。包帯には蚯蚓がのたくったような不可思議な紋様、あるいは文字のようなものが血液を思わせる赤い塗料で記されていた。
        locator: {}
        spoiler_after: ch0014
    speech:
      observations:
      - event_ref: E_ch0014_コルセスカ_says_ゲームの競技性_p644
        quote: 「迷宮探索系のハックアンドスラッシュというのはですね、いわば競技なんですよ。極めてストイックな性質のスポーツなんです。」
        locator: {}
        spoiler_after: ch0014
      - event_ref: E_ch0014_コルセスカ_says_配置の最適化_p644
        quote: 「勝手に触らないで下さい。それは散らかっているのではなくて、手に取りやすいように配置が最適化されているのです」
        locator: {}
        spoiler_after: ch0014
      - event_ref: E_ch0014_コルセスカ_says_呪術の動機_p647
        quote: 「ぐぎぎ、お布団にくるまって寝ることは言うなれば私にとって呪術の鍛錬だというのに――」
        locator: {}
        spoiler_after: ch0014
    action:
      observations:
      - event_ref: E_ch0014_コルセスカ_attacks_アキラ_p649
        quote: 羞恥に頬を染めたコルセスカの一投が、俺の視界を遮るべく精確な狙いをつけているのだ。回避は容易だったが、俺はアラートを無視して枕をその顔で受けた。
        locator: {}
        spoiler_after: ch0014
  first_appearance_candidate: true
