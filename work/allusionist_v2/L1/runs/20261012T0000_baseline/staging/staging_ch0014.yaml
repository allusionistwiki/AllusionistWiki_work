- canonical_target: '[[E_relation_アキラ]]'
  entity_type: relationship
  aspects:
    speech:
      observations:
      - event_ref: E_ch0014_アキラ_says_仕事の内容_p629
        quote: 「大丈夫だよ、レオ。あの人は、俺に仕事を紹介しようとしただけだ。住む場所のない人に、住む場所を紹介する仕事だな」
        locator: {}
        spoiler_after: ch0014
      - event_ref: E_ch0014_アキラ_other_ゲットーの形成_p630
        quote: 「ここには迷宮探索に失敗してしまった探索者が集まっている。国外からの出稼ぎ組や全てを捨てた連中、質の悪い組織から金を借りた奴らなんかが帰るに帰れず燻っているわけだ」
        locator: {}
        spoiler_after: ch0014
      - event_ref: E_ch0014_アキラ_says_搾取の連鎖_p630
        quote: 「弱っているから奪われやすい。奪われ続ければもう搾取される立場から逃げ出せなくなる。そうやって、骨まで組織にしゃぶられ続けるんだ」
        locator: {}
        spoiler_after: ch0014
      - event_ref: E_ch0014_アキラ_fears_格差_p631
        quote: 保険に加入できるかできないかの違い。自分との余りの差に、ぞっとする。
        locator: {}
        spoiler_after: ch0014
      - event_ref: E_ch0014_アキラ_thinks_右腕の不正_p632
        quote: 俺の右腕は、この世界には本来あってはならないものだ。有り得べからざる異物。不正によって持ち込まれた技術。多世界間の規範を乱す犯罪行為。
        locator: {}
        spoiler_after: ch0014
      - event_ref: E_ch0014_アキラ_says_トリシューラ_p641
        quote: 「トリシューラはなんか、ポストヒューマンっていうよりプレヒューマンって感じだよな」
        locator: {}
        spoiler_after: ch0014
      - event_ref: E_ch0014_アキラ_says_姉妹喧嘩_p650
        quote: 「よくある姉妹喧嘩だ」
        locator: {}
        spoiler_after: ch0014
    action:
      observations:
      - event_ref: E_ch0014_アキラ_travels_貧困層区画_p629
        quote: 俺はレオを連れて、市街の中心区域から外れた道へ逸れていく。辿り着いたのは浮浪者などの貧困層が集う区画だった。
        locator: {}
        spoiler_after: ch0014
    visual:
      observations:
      - event_ref: E_ch0014_アキラ_observes_左腕_p631
        quote: 俺の左腕も似たようなものだ。この半年間生き残ってこれたのは運が良かったとしか言いようがない。義肢の技術があまり発達していないらしいこの世界では、手足の欠損は致命的な事態で、社会からの落伍に直結してしまうのだろう。
        locator: {}
        spoiler_after: ch0014
      - event_ref: E_ch0014_アキラ_observes_脅威_p648
        quote: どうしたわけか、コルセスカの両腕に異様な鬼気を感じる。センサーの類が何らかの脅威を察知しているというわけでもないのに、まるでアレがこれまで目にした中で最大の脅威であるかのような感覚。
        locator: {}
        spoiler_after: ch0014
  first_appearance_candidate: true
