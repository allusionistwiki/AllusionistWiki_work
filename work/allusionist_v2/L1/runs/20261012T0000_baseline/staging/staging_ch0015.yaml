- canonical_target: '[[E_char_キロン]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0015_キロン_appears_松明の騎士_p691
        quote: 内側から出てきた松明の騎士は、兜をしていなかった。露わな顔立ちは、端的に言って美男子のそれだ。
        locator: {}
        spoiler_after: ch0015
    speech:
      observations:
      - event_ref: E_ch0015_キロン_says_アキラへの渇望_p692
        quote: 「やあ、シナモリ・アキラ。奇遇だな。良い出会いだ。俺はこの時をずっと待ち焦がれていたんだ。アズーリアから君の事を聞いたその日から、ずっとね」
        locator: {}
        spoiler_after: ch0015
      - event_ref: E_ch0015_キロン_asks_アキラの参加_p694
        quote: 「あの魔将エスフェイルには随分と手を焼かされてね。君とアズーリアが力を合わせてあの異獣を倒したと聞いて、思わず感嘆したよ。そして思った。君が欲しい、と」
        locator: {}
        spoiler_after: ch0015
      - event_ref: E_ch0015_キロン_other_アズーリアの孤立_p698
        quote: 「そして、俺は更に重ねて謝らなければならない。何故なら、君があの時見捨てられた原因の一つが、俺にあるからだ」
        locator: {}
        spoiler_after: ch0015
      - event_ref: E_ch0015_キロン_other_松明の騎士団の腐敗_p700
        quote: 「掌握者代行である君の命を、異獣の前に投げ出すことすら厭わずに」
        locator: {}
        spoiler_after: ch0015
      - event_ref: E_ch0015_キロン_other_アズーリアへの推薦_p702
        quote: 「そしてそれは、アズーリア・ヘレゼクシュに活躍の場を与えずに使い潰す為の罠だったんだ。身内が身内を殺す。そういう腐りきった組織なんだよ、松明の騎士団は。」
        locator: {}
        spoiler_after: ch0015
      - event_ref: E_ch0015_キロン_other_左腕の補填_p703
        quote: 「【寄生異獣】の技術は、対象を討伐した者に優先して志願する権利が与えられる。望みさえすれば、魔将エスフェイルの力は新たな左腕となって君を助けるだろう」
        locator: {}
        spoiler_after: ch0015
      - event_ref: E_ch0015_キロン_asks_トリシューラの居場所_p704
        quote: 「君はともかくとして、【きぐるみの魔女】を見逃すことまではできない。彼女の居場所を教えて貰いたい」
        locator: {}
        spoiler_after: ch0015
      - event_ref: E_ch0015_キロン_other_キュトスの姉妹_p706
        quote: 「キュトスの姉妹とは神話の中で槍神を誘惑した悪しき女神の末裔とも、引き裂かれた欠片そのものとも言われる伝説的な魔女たちの事を指している。」
        locator: {}
        spoiler_after: ch0015
      - event_ref: E_ch0015_キロン_other_トリシューラの罪_p707
        quote: 「地上に寄生異獣という技術、いや業をもたらしたのはあの魔女だ」
        locator: {}
        spoiler_after: ch0015
      - event_ref: E_ch0015_キロン_other_取引_p709
        quote: 「魔女の居場所を俺に教えてくれ。そうすれば、俺は君の味方になってやれる。」
        locator: {}
        spoiler_after: ch0015
      - event_ref: E_ch0015_キロン_promises_明日の再会_p710
        quote: 「いいだろう。では明日、同じ時間と場所で待つ」
        locator: {}
        spoiler_after: ch0015
    action:
      observations:
      - event_ref: E_ch0015_キロン_names_真名_p695
        quote: 男の喉が震え、その名前を大気に乗せて送り出す。瞬間。世界が、振動した。
        locator: {}
        spoiler_after: ch0015
      - event_ref: E_ch0015_キロン_departs_第五階層_p711
        quote: そうして、男は第五階層の雑踏の中に去っていった。後を追って羽ばたく蝶の鱗粉と翅の構造色が、煌めくように軌跡を描いて、やがて消えていった。
        locator: {}
        spoiler_after: ch0015
    name:
      observations:
      - event_ref: E_ch0015_キロン_names_キロン_p696
