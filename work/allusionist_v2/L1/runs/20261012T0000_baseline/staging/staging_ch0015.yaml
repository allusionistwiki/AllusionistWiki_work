        locator: {}
        spoiler_after: ch0015
      - event_ref: E_ch0015_アキラ_says_サイバーカラテの定義_p676
        quote: サイバーカラテはサイバーカラテなんだよ空手でも中国武術でも無い新時代の純粋外家拳だからそういう安易なカテゴライズは不要なのわかる？！
        locator: {}
        spoiler_after: ch0015
      - event_ref: E_ch0015_アキラ_thinks_他の転生者_p676
        quote: 「あ、何か『俺も転生者だからわかるけどこれ空手っつーより中国武術とかじゃね』だって」
        locator: {}
        spoiler_after: ch0015
      - event_ref: E_ch0015_アキラ_thinks_トリシューラの邪悪_p708
        quote: カイン達は、あんな無残な死に方をすることもなかったのではないか、という最低の思考が消しても消しても次々と湧き上がってくるからだ。
        locator: {}
        spoiler_after: ch0015
      - event_ref: E_ch0015_アキラ_asks_時間_p710
        quote: 「少し、時間が欲しい」
        locator: {}
        spoiler_after: ch0015
      - event_ref: E_ch0015_アキラ_thinks_トリシューラを売らない_p711
        quote: 勿論、トリシューラを売る気は無い。 だが、積極的にキロンと敵対する気があまり起きないのも、彼の誘いに心が動いているのも事実だった。
        locator: {}
        spoiler_after: ch0015
      - event_ref: E_ch0015_アキラ_thinks_現実逃避_p712
        quote: のべつ幕無しに襲来する面倒事。コルセスカではないが、布団にくるまって現実逃避したい気分だった。
        locator: {}
        spoiler_after: ch0015
      - event_ref: E_ch0015_アキラ_thinks_レオとの差異_p715
        quote: 俺とレオとの、決定的な差異。 レオにある尊い資質。それを俺は、有していない。ただそれだけなのだ。
        locator: {}
        spoiler_after: ch0015
      - event_ref: E_ch0015_アキラ_says_死にたい_p716
        quote: 「なんか、もう一回死にてー」
        locator: {}
        spoiler_after: ch0015
      - event_ref: E_ch0015_アキラ_thinks_マクガフィン_p716
        quote: 多分それは金メッキのトロフィーに価値を仮構するような、偽りの値札なんだよ。ゲーム用のおもちゃの通貨。舞台用のマクガフィン。
        locator: {}
        spoiler_after: ch0015
    action:
      observations:
      - event_ref: E_ch0015_アキラ_observes_メールの殺到_p671
        quote: 調査研究や商業広告、果ては殺害予告まで幅広いメールが押し寄せたが、その中に目当ての名前を見つけることはできなかった。
        locator: {}
        spoiler_after: ch0015
      - event_ref: E_ch0015_アキラ_arrives_貧民街_p689
        quote: 端末上で描かれた仮想の地図を転送して貰い、店員さんにいずれお礼をすると約束して目的の場所へ向かう。
        locator: {}
        spoiler_after: ch0015
      - event_ref: E_ch0015_アキラ_finds_レオ_p712
        quote: 【Ｄｏｐｐｌｅｒ】をフル活用して探すこと数分。 案の定、というべきだろうか。レオは樹木系種族が固まって住んでいるあたりにいた。
        locator: {}
        spoiler_after: ch0015
