      - event_ref: E_ch0015_アキラ_remembers_石の迷宮の悪夢_p669
        quote: 俺はこの世界に来て以来、ずっと同じ夢を見続けている。半年前の石の迷宮を無限に彷徨い、戻らないアズーリアを待ち続ける悪夢を。
        locator: {}
        spoiler_after: ch0015
      - event_ref: E_ch0015_アキラ_asks_アズーリアらの名前併記_p674
