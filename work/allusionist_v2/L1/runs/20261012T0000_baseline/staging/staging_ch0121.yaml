- canonical_target: '[[E_char_ルウテト]]'
  entity_type: character
  aspects:
    name:
      observations:
      - event_ref: E_ch0121_ルウテト_names_ルウテト_p4277
        quote: 蜂蜜色の髪を揺らす左右で生死が非対称な女性は、改めて俺にルウテトと名乗り、ひとまずトリシューラとコルセスカとの和解に合意してくれた。
        locator: {}
        spoiler_after: ch0121
    speech:
      observations:
      - event_ref: E_ch0121_ルウテト_promises_和解_p4277
        quote: 改めて俺にルウテトと名乗り、ひとまずトリシューラとコルセスカとの和解に合意してくれた。
        locator: {}
        spoiler_after: ch0121
      - event_ref: E_ch0121_ルウテト_says_巡節_p4279
        quote: '「この世界には、太陰の運行を基準とした暦をはじめとして幾つも

          ゼオーティア

          の歳月の区切り方があります。巡節という数え方もそのひとつ」'
        locator: {}
        spoiler_after: ch0121
      - event_ref: E_ch0121_ルウテト_says_アキラ_p4280
        quote: 「アキラ様、ちょっと、いやかなりお顔が、その、凛々しく、というか、とっても素敵に――ああ、そう、好みに――え？ 好きなキャラ要素を毎日自由に組み込み放題？
          そ、そう」
        locator: {}
        spoiler_after: ch0121
      - event_ref: E_ch0121_ルウテト_says_六王巡節_p4280
        quote: 「春季と冬季で分けたとか、諸説あるのですが、こういう言い伝えがあります。巡節というのはかつては六王巡節と言われており、再生者の女神が最も力の強い眷族である六王にその半身を不死の果実として分け与えた逸話に由来すると」
        locator: {}
        spoiler_after: ch0121
      - event_ref: E_ch0121_ルウテト_other_キュトスの姉妹_p4281
        quote: 「その通り。そして転生者は、大いなる地母神キュトスの生まれ変わりの一人として認められました。キュトスの姉妹として迎え入れられたのです」
        locator: {}
        spoiler_after: ch0121
      - event_ref: E_ch0121_ルウテト_reveals_正体_p4282
        quote: 「――私はキュトスの死。敗北と喪失、選ばれなかったという結末から生まれる、有り得ざる可能性。そう、前世の決定的な死が、私を再生と死を司る女神として転生させたのです」
        locator: {}
        spoiler_after: ch0121
      - event_ref: E_ch0121_ルウテト_says_末妹_p4282
        quote: 「私が望んでいた在り方は九姉ではない。もう一度、今度こそ、末妹に――それが叶わないのなら、自らそうなれる子供たちを育て上げるだけ」
        locator: {}
        spoiler_after: ch0121
      - event_ref: E_ch0121_ルウテト_names_コルセスカ_p4283
        quote: 「私の前世での名前は――コルセスカと言います」
        locator: {}
        spoiler_after: ch0121
    visual:
      observations:
      - event_ref: E_ch0121_ルウテト_appears_as_蜂蜜色の髪_p4279
        quote: 言い終わらぬうちにコルセスカの肩くらいまでの長さの白銀の髪が、背中まで伸びる蜂蜜色に変化して行く。右の義眼は虚ろに、光妖精と再生者を左右で分け合った眩暈のするような容貌の女性が現れた。
        locator: {}
        spoiler_after: ch0121
    action:
      observations:
      - event_ref: E_ch0121_ルウテト_gives_主導権_p4279
        quote: ルウテトはひとまず身体の主導権をコルセスカに譲るらしい。
        locator: {}
        spoiler_after: ch0121
  first_appearance_candidate: true
