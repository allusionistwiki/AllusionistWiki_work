  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0144_炎天使アルマ_attacks_地上_p4905
        quote: 空が荒れていた。塔が対空呪撃を繰り返すも、全ては嵐に飲み込まれて消失。 八枚の翼が赫々と燃え上がり、朱金の鎧が地上を無差別に焼き払 う。
        locator: {}
        spoiler_after: ch0144
  first_appearance_candidate: true
- canonical_target: '[[E_char_アルマ]]'
  entity_type: character
  aspects:
    action:
