episode: ch0166
created: '2026-10-10'
status: pending_merge
entities:
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0166_アキラ_makes_最適な笑顔_p5569
        quote: ありとあらゆる握手のパターンに応じて表情筋を制御、『相手にとっての最適な笑顔』を形成していく。
        locator: {}
        spoiler_after: ch0166
      - event_ref: E_ch0166_アキラ_uses_握手会基本スタイル_p5569
        quote: 左手で迎え入れ、右手で上から包み込む。 左右の義肢、両方と握手したいというファンの要望に応えよう。 そんな思いからこのようなやり方が握手会の基本スタイルとなった。
        locator: {}
        spoiler_after: ch0166
      - event_ref: E_ch0166_アキラ_defeats_巨漢_p5570
        quote: 流れる水が形を変えてするりと動き、指関節を開くように捻って相手の痛覚を刺激する。一瞬だけ生じた相手の隙は逃さない。左右の手で包み込んだ相手の腕を可動域とは逆の外側へと強引に回転させる。機械義肢と流水義肢の馬力頼みの強引な護身術だが、巨漢はたまらずに真横によろめき、うめき声をあげて膝をついた。
        locator: {}
        spoiler_after: ch0166
      - event_ref: E_ch0166_アキラ_fights_襲いかかるファン_p5572
        quote: 俺は次々と『襲いかかってくる』ファンたちを相手に手を握り潰したり投げ飛ばしたり関節を極めたり力比べのすえ押し返したり腕相撲を延々繰り返したりといった荒っぽいアピールをやらされる羽目になった。
        locator: {}
        spoiler_after: ch0166
      - event_ref: E_ch0166_アキラ_helps_受刑者_p5572
        quote: アイドルの中には『慰問ライブ』を行って受刑者たちにひとときの癒しを与えようとするものもいたが、陰惨な雰囲気たちこめるこの地に二度足を運ぶものはいなかった。
          ――俺たちを除いては。
        locator: {}
        spoiler_after: ch0166
      - event_ref: E_ch0166_アキラ_makes_マジカル・アピール_p5582
        quote: 「マジカル・アピール！」 トリシューラの叫びと共に、『杖』のドレスが開花する。 両手を花のように開き、包み込むような形にして舞う。
        locator: {}
        spoiler_after: ch0166
      - event_ref: E_ch0166_アキラ_uses_立体幻像_p5582
        quote: だがそれと同時、観客たちの目の前に立体幻像の窓が幾つも表示されていく。 『この銃撃を受けた人は、こんなレーザーでも焼かれています』『オススメの暴力はこれ！』『あなたのお暴力傾向から』『よく一緒に使用されるサブウェポン』『この兵装のレビューはこちらから』
        locator: {}
        spoiler_after: ch0166
      - event_ref: E_ch0166_アキラ_kills_観客_p5583
        quote: 朗らかなトリシューラの声と俺の「発勁用意」という叫びが重なり、阿鼻叫喚の地獄絵図が地下空間に現出する。 より効率的に殺戮を実行した俺のバトルドレスがステージを廃墟へと変貌させ、音楽の終了と共に死の静寂が降りてくる。
        locator: {}
        spoiler_after: ch0166
    speech:
      observations:
      - event_ref: E_ch0166_アキラ_thinks_握手会の本質_p5570
        quote: この一連の流れに慣れ始めている自分が恐ろしい。 そもそもの話。 ――これ、握手会か？
        locator: {}
        spoiler_after: ch0166
      - event_ref: E_ch0166_アキラ_asks_トリシューラ_p5574
        quote: 「なあトリシューラ。これでいいのかな」 休憩中、ふと気になって小さなマスコットマネージャーに尋ねてみる。
        locator: {}
        spoiler_after: ch0166
      - event_ref: E_ch0166_アキラ_thinks_独りよがりの欠点_p5575
        quote: 対して俺は、ファンを楽しませてはいるもののあくまでも『芸』による身体的なおもしろさ、刺激、アトラクションとしての快楽だけで握手をこなしている。
          本当にこれでいいのか――その問いは常につきまとう。
        locator: {}
        spoiler_after: ch0166
      - event_ref: E_ch0166_アキラ_asks_トリシューラ_p5576
        quote: 「トリシューラ、次のライブまで、少しだけ時間が欲しい」
        locator: {}
        spoiler_after: ch0166
      - event_ref: E_ch0166_アキラ_asks_ゼド_p5579
        quote: 「お前のところ――『パイロマスター』ってグループ、サイン会とか握手会とか、ファンサービスみたいなイベント全然やらないよな。あれって何でだ？」
        locator: {}
        spoiler_after: ch0166
      - event_ref: E_ch0166_アキラ_threatens_ゼド_p5581
        quote: 「今ので腹が据わったよ。 お礼に、あとで叩きのめしてやる。 首洗って待ってろ」
        locator: {}
        spoiler_after: ch0166
      - event_ref: E_ch0166_アキラ_thinks_不純な純粋さ_p5583
        quote: それは余分を積み重ねた『まがいもの』のアピールなのかもしれない。 だがそんな『不純』を貫くことこそが俺たちにとっての『純粋さ』であると、俺は確信している。
        locator: {}
        spoiler_after: ch0166
    relationship:
      observations:
      - event_ref: E_ch0166_アキラ_other_ゼド_p5578
        quote: 「久しぶりだな、盗賊王」「――意外と、会いに来るのが遅かったな」 呼びかけに振り返ったテンガロンハットの男――ゼドは、相変わらず陰気な顔つきでこちらに暗い視線を向けた。
        locator: {}
        spoiler_after: ch0166
    visual:
      observations:
