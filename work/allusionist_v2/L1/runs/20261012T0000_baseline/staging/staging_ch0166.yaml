- canonical_target: '[[E_char_ゼド]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0166_ゼド_other_散開_p5577
        quote: 「散開」 テンガロンハットを被った陰気な男が短く命じた途端、狭い通路の中で集団が一斉にばらけた。
        locator: {}
        spoiler_after: ch0166
      - event_ref: E_ch0166_ゼド_says_探索者としての矜持_p5577
        quote: 古き誇りを穢す恥知らず。 だがそう呼ばれてなお不敵に笑う彼らは、臆面もなく自分たちを挑戦者であると誇る。
        locator: {}
        spoiler_after: ch0166
      - event_ref: E_ch0166_ゼド_asks_アキラの同一性_p5578
        quote: 「お前はずいぶんと様変わりしたな。 おおまかな状況は把握しているが、結局拡散したシナモリアキラは拡散したままなのだろう？ ここにいるお前は、正しくお前だと解釈してもいいのか？」
        locator: {}
        spoiler_after: ch0166
      - event_ref: E_ch0166_ゼド_says_アイドル活動の位置づけ_p5578
        quote: 「まあな。 アイドル活動も探索の一環でしかない。 『死人の森』に関わったのも第五階層の裏面である古代世界を調査する上で必要だったからでしかない」
        locator: {}
        spoiler_after: ch0166
      - event_ref: E_ch0166_ゼド_asks_アキラ_p5580
        quote: 「そうだな――シナモリアキラ。 お前、『殺し屋』時代に思った事は無いか。 この仕事は純度が低い、と」
        locator: {}
        spoiler_after: ch0166
      - event_ref: E_ch0166_ゼド_says_殺しの純度_p5580
        quote: 「俺たちは殺意を殺しに変える仕事をしている。 加工、翻訳、なんでもいいが――その過程で必ず取りこぼすんだ。 本来の熱量を。 ただの殺しは燃えさかる炎だ。
          それは明るく輝く暴力の灯火となる。 だが殺し屋が手に持つ松明はどうだ。 うす暗い篝火じゃあないか。 俺たちは不純な殺しをしているのさ。 あるいは余計な仕事を」
        locator: {}
        spoiler_after: ch0166
      - event_ref: E_ch0166_ゼド_promises_勝利の要求_p5581
        quote: 「俺は勝利が欲しい。 栄光、富、称賛、価値あるもの全てを手に入れる。 だからシナモリアキラ、お前は勝て。 勝って価値ある存在として俺の前に立て。
          俺は価値ある全ての勝利を欲している」
        locator: {}
        spoiler_after: ch0166
      - event_ref: E_ch0166_ゼド_says_純粋さの輝き_p5581
        quote: 「純粋な方が、明るく輝けるとお前は言うのか？」「ああ。 余分さが無いものこそが輝く。 雑多なもの、混沌としたものが目を引くのはそれが多いからだ。
          だがそれは輝度も彩度も明度も低い――まがいものだ」
        locator: {}
        spoiler_after: ch0166
      - event_ref: E_ch0166_ゼド_says_闇を照らす蝋燭_p5582
        quote: 「ああ、だから俺は闇を照らす蝋燭が欲しい。 俺の罪を、盗みと殺しとを照らす、栄えある屍の蝋燭に手を伸ばしたいんだ――」
        locator: {}
        spoiler_after: ch0166
