      - event_ref: E_ch0072_ユネクティア_defeats_歌姫_p2694
        quote: あらゆる呪文を両断する剣によって、魔将ユネクティアはついに歌姫の極大呪文を打ち破ったのだ。
        locator: {}
        spoiler_after: ch0072
      - event_ref: E_ch0072_ユネクティア_activates_浄界_p2695
        quote: 「浄界――【影の海を越えて】」それは一見して世界に何の変化も齎さないが、『影』であるユネクティアの存在が目に見える世界全てに浸透していくのを感じた。
        locator: {}
        spoiler_after: ch0072
      - event_ref: E_ch0072_ユネクティア_dies_第十魔将_p2698
        quote: 黒衣の端が灰になっていき、巨大な存在がゆっくりと希薄化していく。
        locator: {}
        spoiler_after: ch0072
      - event_ref: E_ch0072_ユネクティア_gives_解析結果_p2698
        quote: 「いいかいエスフェイル。あれの正体がわかった。解析結果をこの剣に封じたから、後は任せたよ」
        locator: {}
        spoiler_after: ch0072
    speech:
      observations:
      - event_ref: E_ch0072_ユネクティア_says_エスフェイルへの指示_p2666
        quote: 「エスフェイル！　君は二人を連れて先を急ぐんだ！」「師兄？！　ですが――」「未来を参照する聖女に対抗できるのは過去を参照する者、つまり死霊使いと死人使いだけだ！」
        locator: {}
        spoiler_after: ch0072
