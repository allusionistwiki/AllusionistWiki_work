episode: ch0072
created: '2026-10-10'
status: pending_merge
entities:
- canonical_target: '[[E_term_フィリス]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch0072_フィリス_has_property_非実体としての強大さ_p2662
        quote: 実体として極めて脆弱なフィリスは、その逆に非実体としてはこの上なく強大な存在である。私に掌握される前のフィリスは、相手を見ただけで瞬時にその本質を解析し、再解釈してしまうことができた。
        locator: {}
        spoiler_after: ch0072
      - event_ref: E_ch0072_フィリス_functions_as_歌姫の力の模倣_p2666
        quote: 今、私の左手に宿ったフィリスは、歌姫の力を摸倣し、再現している。そして、類似したものは『同じ』であるとみなされる呪術の基本法則により、私の左手と彼女の呪文は、完全に遅延無く同調し、その効果を相乗させる。
        locator: {}
        spoiler_after: ch0072
  first_appearance_candidate: true
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0072_アキラ_activates_金鎖_p2663
        quote: 二つ目の金鎖を砕いた私は、歌の翼を広げながら夜の闇を飛翔した。
        locator: {}
        spoiler_after: ch0072
      - event_ref: E_ch0072_アキラ_kills_ハルハハール_p2664
        quote: 左手で巨大な蝶の翅を貫通する。『歌う左手』が内部から呪文を炸裂させて、その命を刈り取る。
        locator: {}
        spoiler_after: ch0072
      - event_ref: E_ch0072_アキラ_kills_アケルグリュス_p2665
        quote: 流動し変幻し続ける呪文群によって極小の意味の群れに還元されたアケルグリュスが消滅していく。
        locator: {}
        spoiler_after: ch0072
      - event_ref: E_ch0072_アキラ_other_浄界_p2666
        quote: それはユネクティアの影の浄界を破壊し、アインノーラの決闘場の浄界を粉砕し、サイザクタートの夢を引き裂いていった。
        locator: {}
        spoiler_after: ch0072
      - event_ref: E_ch0072_アキラ_defeats_サイザクタート_p2667
        quote: 一撃で粉砕した。その手の攻撃はもう効かない。何しろ、もっと凶悪な守護天使――古き神の夢を克服したばかりなのだ。
        locator: {}
        spoiler_after: ch0072
      - event_ref: E_ch0072_アキラ_uses_金鎖_p2669
        quote: 第三の金鎖が砕けて、堅牢なる防御が全ての攻撃を完璧に受け止めた。
        locator: {}
        spoiler_after: ch0072
      - event_ref: E_ch0072_アキラ_other_パルプ・フィクション_p2677
        quote: 「パルプ・フィクション！」呪文の名は自然と口をついて出てきた。二人の呪力を即興で組み合わせて、更なる力を顕現させる。
        locator: {}
        spoiler_after: ch0072
      - event_ref: E_ch0072_アキラ_uses_金鎖_p2679
        quote: 第四の金鎖を砕く。大量の紙片が消失すると同時に左手が灰色に輝いた。
        locator: {}
        spoiler_after: ch0072
      - event_ref: E_ch0072_アキラ_uses_金鎖_p2680
        quote: 五つ目の金鎖を砕いて、明るい藍色に輝く左手を前に出す。
        locator: {}
        spoiler_after: ch0072
      - event_ref: E_ch0072_アキラ_uses_金鎖_p2686
        quote: 六つ目の金鎖が砕け散った。枝角にプリエステラの時よりも鮮やかな緑色が宿る。
        locator: {}
        spoiler_after: ch0072
      - event_ref: E_ch0072_アキラ_uses_金鎖_p2692
        quote: 第七の金鎖が砕け散った。透き通るような黄色い輝きが左手に宿り、私はリーナから渡された袋を掴むと左手で投擲した。
        locator: {}
        spoiler_after: ch0072
      - event_ref: E_ch0072_アキラ_breaks_左手の爪_p2696
        quote: 可動式の左手部分の篭手が開放されて、露わになった左手の薬指を摘むと、そのまま剥がした。感じたことの無い痛みが、離れた場所にいる誰かを参照する。続けて小指の爪も無理やり剥がす。
        locator: {}
        spoiler_after: ch0072
      - event_ref: E_ch0072_アキラ_other_斧槍_p2697
        quote: 出現したのは長大な柄、白銀に輝く斧の刃、反対には鉤、そして中央に鋭角の穂先――優美さと力強さを併せ持った斧槍。舌獣イキューを素材にした、舌という部位による邪視能力を高める機能を持つ。
        locator: {}
        spoiler_after: ch0072
      - event_ref: E_ch0072_アキラ_uses_金鎖_p2697
        quote: 第八の金鎖が開放される。左手小指から出現した凍結の呪力が煙を吐き出す異形の怪物を停止させ、薬指から出現した眩い光がユネクティアの神速の斬撃を硬質な音と共に弾き返す。
        locator: {}
        spoiler_after: ch0072
    visual:
      observations:
      - event_ref: E_ch0072_アキラ_transforms_森_p2670
        quote: 私は黒衣に変わって大樹を身に纏い、木の『うろ』の中に隠れ潜む。
        locator: {}
        spoiler_after: ch0072
    speech:
      observations:
      - event_ref: E_ch0072_アキラ_says_名前_p2706
        quote: 黒百合の子供たちによって詠唱、維持される超高度な複合呪文。幼馴染たちが過去の思い出を語り、私を外部から再生するとは、つまりそういうことだ。
        locator: {}
        spoiler_after: ch0072
      - event_ref: E_ch0072_アキラ_names_アズーリア・ヘレゼクシュ_p2707
        quote: 「キュトスの姉妹の七十一番、未知なる末妹ハルベルトの使い魔にして一番弟子！　私の名は、永続者アズーリア・ヘレゼクシュ！」
        locator: {}
        spoiler_after: ch0072
      - event_ref: E_ch0072_アキラ_thinks_自己の本質_p2707
        quote: 私という存在の本質は、幻。うつろい、不確かで、形のない、そして本当はなにものでもない。
        locator: {}
        spoiler_after: ch0072
  first_appearance_candidate: true
