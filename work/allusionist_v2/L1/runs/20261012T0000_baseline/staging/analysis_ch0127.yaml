  mysteries:
  - kind: mystery
    name: MY_ミヒトネッセの真の目的とラクルラールとの関係
    note: ミヒトネッセはラクルラールの命令でトリシューラを「使い魔」にしようとしているが、その過程でトリシューラへの個人的な執着（愛？）が混在しており、ラクルラールの意図とミヒトネッセの自我の乖離が今後の展開で問題化する可能性がある。
    quotes:
    - quote: だから私は、トリシューラをトライデントの左腕にして『使い魔と杖の座』にしてあげるの。
      paragraph: p4411
    - quote: トリシルシリーズ八号機、ＴＳＸ－８ミヒトネッセ――狂おしいほど愛しているわ、私のトリシューラ
      paragraph: p4415
    expected_payoff: ラクルラールがミヒトネッセを操っているのか、それともミヒトネッセがラクルラールの命令を歪めて利用しているのかの判明、およびトリシューラの「使い魔」化の回避または受容。
