    name: MY_ブウテトの固定化とコルセスカとの関係
    note: ブウテト（ルウテト/コルセスカ）が「三枚のお札」の呪術の影響か、あるいは別の理由で元の姿に戻れなくなった。コルセスカとしての人格とブウテトとしての人格の統合、または分離が今後の物語の鍵となる。
    quotes:
    - quote: も、戻れなくなっちゃいました、ぶうぶう
      paragraph: p4429
    - quote: アキラ様、もう一人の私――コルセスカが言っているぶう。
      paragraph: p4424
    expected_payoff: ブウテトの姿が固定されることによる戦闘スタイルの変化、コルセスカとの対話、あるいはミヒトネッセの逃走術の代償としての呪いの解除方法の模索。
  - kind: mystery
    name: MY_ミヒトネッセの「摂取」能力の限界とアキラへの影響
    note: ミヒトネッセの「摂取」は他者の感情を取り込む能力だが、アキラはちびシューラによって防がれた。しかし、ミヒトネッセがアキラの「カッサリオ因子」や「サイバーカラテ道場」のデータをどう評価し、次回以降の戦いにどう活かすかが伏線。
    quotes:
    - quote: 他者の感情や価値観を自分のものとして『取り入れ』てしまう能力！
      paragraph: p4417
    - quote: 目的は達した。名残惜しいけど、またねトリシューラ
      paragraph: p4427
    expected_payoff: 次回以降の戦闘で、ミヒトネッセがアキラの戦闘データや感情を模倣・強化して再登場する展開。
  - kind: mystery
    name: MY_トリシューラの「がらくた」コンプレックスとミヒトネッセの幼馴染設定
    note: ミヒトネッセはトリシューラを「がらくた」と罵倒しつつ、幼馴染としての親密さを主張する。トリシューラがこれに激怒するのは、ミヒトネッセの指摘が事実（あるいはトラウマ）を含んでいるためであり、トリシューラの過去と自己像の崩壊が示唆される。
    quotes:
    - quote: ふん！　相変わらずのぽんこつっぷりね、このがらくた！
      paragraph: p4407
    - quote: あんたは幼なじみの私が手助けしてあげないと何もできないがらくたなんだから
      paragraph: p4408
    expected_payoff: トリシューラの過去（星見の塔時代）の詳細な回想、ミヒトネッセとの過去の出来事（十二月騒乱など）の全貌、トリシューラの精神的な成長または破綻。
  themes:
  - kind: theme
    theme: 人工知能・人造人間における「自我」の形成は、他者からの欲望の投影と吸収によってのみ可能であるという存在論的問い
    weight: 0.9
    quotes:
    - quote: 他者が投影した欲望を吸収して、他者から感情を摂取して複写する。そうすることで人形の身でありながら、自我や意識、感情や欲望などを育んでいる
