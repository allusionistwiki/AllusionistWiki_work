  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0087_ネドラド_appears_軽鎧_p3219
        quote: 無精髭の生えた、中年に差し掛かる手前といった年代の男。　守護の九槍第八位、【二本足】のネドラド。
        locator: {}
