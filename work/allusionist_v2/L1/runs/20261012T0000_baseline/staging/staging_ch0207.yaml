episode: ch0207
created: '2026-10-10'
status: pending_merge
entities:
- canonical_target: '[[E_org_キノコ人]]'
  entity_type: organization
  aspects:
    action:
      observations:
      - event_ref: E_ch0207_キノコ人_attacks_黒紫の煙_p6935
        quote: 巨大化したキノコの怪物たちは半球状に膨らんだ頭部を風船のように膨張させ、大きく跳躍した。着地と同時、キノコ人たちは帽子を被り直すかのように傘を下げる。傘裏のひだから散布された黒紫の煙は必殺の呪毒。
        locator: {}
        spoiler_after: ch0207
    relationship:
      observations:
      - event_ref: E_ch0207_キノコ人_functions_as_ゴミ処理_p6936
        quote: キノコ人たちには長老樹の根に取り付いて養分や穢れを吸い取るという習性がある。古くから種族の使命と定められていたのはゴミ処理や埋葬などの汚れ仕事で、それらを埋めた土から呪力を得る姿は多数派にとっては軽蔑の対象であった。
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_キノコ人_is_located_陰花族_p6936
        quote: この夜の民にも似たあり方と暗所を好む性質から、彼らは多数派の樹木系ティリビナ人から陰花族と蔑まれていた。
        locator: {}
        spoiler_after: ch0207
    symbolic:
      observations:
      - event_ref: E_ch0207_キノコ人_has_property_霊的菌糸体_p6936
        quote: 傘と柄のような物理的実体はキノコ人たちの本体ではない。彼らにとっての核はその足下、影の中に広がった霊的菌糸体である。
        locator: {}
        spoiler_after: ch0207
  first_appearance_candidate: true
- canonical_target: '[[E_char_セラメル]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0207_セラメル_says_毒と瘴気_p6935
        quote: 「気をつけな、奴らは毒と瘴気を使う！」  セラメルが霊薬を飲み干しながら叫んだ。
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_セラメル_fears_アルティウス_p6951
        quote: 怒りに満ちた声が、次第に震えていく。  そこに込められた感情は怯え、不安、悲しみ、そして期待。  強靱な意志力を持っているはずの熟練の探索者が、あっさりと心を揺さぶられていた。
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_セラメル_promises_魔槍_p6953
        quote: 「舐めンじゃないよ二つ頭。私を誰だと思ってる。鍛冶師として手抜き仕事はしない。魂なら最初から賭けてるよ。氷血のコルセスカに対抗？  抜かせ、それ以上の魔槍を見せてやる」
        locator: {}
        spoiler_after: ch0207
    action:
      observations:
      - event_ref: E_ch0207_セラメル_uses_炸撃_p6935
        quote: 「燃えろっ」  『炸撃』を次々と放射していくセラメルだったが、何かが飛翔して熱線を遮った。
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_セラメル_attacks_キノコ人_p6939
        quote: 「いつまでも何やってる！  こいつらはもう化け物だ、楽にしてやるしかないんだよっ！」  四方から襲う傘状槌を焼き払う猛火。両腕に炎を纏わせたセラメルが鬼気迫る表情で叫び、キノコ人の胴体を焼き尽くす。
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_セラメル_uses_金槌_p6940
        quote: 呼び声に応じて飛来したのはノゴルオゴルオに投擲したあの金槌だった。セラメルは空中で掴んだ金槌を巨大化させると、激しく燃え立つ炎を纏わせて床に叩きつける。  瞬間、猛火に照らされた影の形が激しく歪み、魂を振るわせるような絶叫を上げた。  影中に存在するアストラル体が打ち据えられる。
        locator: {}
        spoiler_after: ch0207
  first_appearance_candidate: true
- canonical_target: '[[E_char_ハエの使い魔]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0207_ハエの使い魔_dies_キノコ_p6935
        quote: 誘われるようにキノコに殺到した虫たちの羽音は唐突に途切れてしまう。ふらふらと落下して、無数の巨大ハエたちはことごとく絶命していった。
        locator: {}
        spoiler_after: ch0207
  first_appearance_candidate: true
- canonical_target: '[[E_char_ユディーア]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0207_ユディーア_uses_抗毒呪符_p6935
        quote: ユディーアは抗毒呪符を取り出しつつ迫り来るキノコ人たちの成れの果てを迎え撃つ。
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_ユディーア_uses_空圧の呪文_p6935
        quote: 呪符が展開する障壁で頭部を保護しつつ、ユディーアは『空圧』の呪文を鉤爪に纏わせる。両腕を振るうたびに突風が吹き荒れて毒煙が散っていくが、重量のあるキノコ人たちはびくともしない。
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_ユディーア_fights_キノコ人_p6936
        quote: 操られている巨大ハエをセラメルに任せ、ユディーアは一気に踏み込んだ。無造作に放った突き、踏み出した足による打撃、重量バランスの悪いキノコ人は重心を崩せば容易く倒れる。落ちてきた傘を切り裂いて灰に変える。
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_ユディーア_remembers_過去視_p6936
        quote: 親から子へと呪いのように受け継がれてきた苦痛の記憶に息が詰まる。振るわれた長い腕を交差した鉤爪で受けた瞬間、ユディーアは怪物たちの過去を瞬間的に体験していた。
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_ユディーア_other_銀貨_p6950
        quote: 「銀貨は渡さない」
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_ユディーア_other_過負荷_p6959
        quote: 許容量を超えた情報を処理しきれず頭から湯気が噴き出す。  「きゅう～」  ばたん。ユディーアは妙な鳴き声を上げながらその場で倒れた。
        locator: {}
        spoiler_after: ch0207
    speech:
      observations:
      - event_ref: E_ch0207_ユディーア_thinks_ドラトリア系_p6937
        quote: キノコ人たちを裏切ったカマソッソ氏族、あれはもしかするとドラトリア系のアヴロノではなかったか？
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_ユディーア_thinks_罠_p6938
        quote: おそらく敵の狙いはキノコ人たちを殺させることだ。  あの言語魔術師は魔将ベフォニスの関係者だ。こちらがユディーアだと知られている以上、その実力も把握済みと見るべきだろう。だとすれば、このキノコ人ではユディーアを倒すことはできないと理解しているはず。  邪悪な怪物として自らを位置づけ、弱者を異獣化させてけしかける。正義の側として怪物たちを退治するユディーアとセラメルは定番の構図に吸収されることだろう。
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_ユディーア_fears_決断_p6939
        quote: 殺さなければ殺される。殺してしまえば術中にはまる。  八方塞がりの状況でユディーアは迷い、決断できないまま時間が流れていく。
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_ユディーア_thinks_ディスケイム_p6954
        quote: 黒幕は他ならぬユディーアの血族。この身体に流れる来訪者の血、ディスケイムという呪いこそがクナータを苦しめ、救世主トリアイナを汚染しようとしている元凶だったのだから。  『守る』などと良く言えたものだ。ユディーアは自嘲する。  敵がいるとすればそれは自分。  ユディーアがクナータの傍にいること自体が罪深い過ちだった。
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_ユディーア_other_方針_p6962
        quote: 「お姉様。あたし、小さいときの経験から過剰にディスケイムを忌避していたかもしれません。けどもう少しだけそのやり方を信じてみようかと思います。ジャッフハリムのやり方は少なくとも天獄よりは救世主の示す未来に近いはず。その中にディスケイムが含まれていてもいいのかなって考えを改めました」
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_ユディーア_thinks_裏切り者_p6978
        quote: だからユディーアは正面から勝ちに行くという選択肢を最初から捨てていた。  操りやすい駒でいい。中途半端な位置で揺れ動く裏切り者で構わない。  事態を打開するのが自分である必要など無いのだ。
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_ユディーア_thinks_氷血呪_p6979
        quote: どのような発動原理だろうと、『自分だけの世界』を求める行為は究極的に『氷血呪』という名の『紀』に繋がっている。  ユディーアはアルティウスと固定された世界観を奪い合い、敗北した。  融血呪は他我と融け合うが、氷血呪は逆に個我を固体化・確定させる。
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_ユディーア_thinks_ディスケイム_p6980
        quote: ディスケイムは父を殺した。  ディスケイムはキノコ人たちを殺した。  ディスケイムは最後の聖域に土足で踏み込んだ。  その過去の上に、現在がある。確かな事実はそれだけだ。
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_ユディーア_hopes_誰か_p6981
        quote: ただ、『誰か』が代わりにそれをやってくれたなら。  ユディーアの心には家族を殺された恨みや憎しみなんてこれっぽっちも湧き上がりはしないだろう。だってユディーアにはそういうのは向いていないのだから。  ずっと『誰か』を望んでいた。
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_ユディーア_thinks_沈黙_p6982
        quote: 呪文なんていらない。  美しい言葉に変えてしまうことで、醜い感情に変えてしまうことで、世界は決定的に変質してしまう。優柔不断なユディーアはその歪みを恐れていた。「だから、あたしは」  その先に続く言葉は存在しない。  今はまだ？  いいや違う。これからもずっと、その続きは沈黙だけ。  それだけが、ユディーアに向いている唯一のことだった。
        locator: {}
        spoiler_after: ch0207
    relationship:
      observations:
      - event_ref: E_ch0207_ユディーア_other_テッシトゥーラ_p6977
        quote: 「わかりました。第五階層の人たちを皆殺しになんてしたくないし、クナータとリーナを犠牲になんてしたくない。テッシトゥーラさんの言葉に従います」
        locator: {}
        spoiler_after: ch0207
  first_appearance_candidate: true
- canonical_target: '[[E_char_巨大ハエ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0207_巨大ハエ_transforms_使い魔_p6936
        quote: 先ほど引き寄せられて毒で死んだはずの巨大ハエたちが動き出し、襲いかかってきたのだ。散布された黒紫の呪毒を浴びた虫の身体の一部が隆起して脈動している。
        locator: {}
        spoiler_after: ch0207
  first_appearance_candidate: true
- canonical_target: '[[E_org_カマソッソ氏族]]'
  entity_type: organization
  aspects:
    relationship:
      observations:
      - event_ref: E_ch0207_カマソッソ氏族_betrays_キノコ人_p6937
        quote: ある日、カマソッソ氏族は友人となったキノコ人が迫害され困窮していると聞いて彼らの共同体に住まいと仕事を紹介すると持ちかける。その結果がこれだ。友人たちからも食い物にされたキノコ人たちは世界の全てを憎んでいる。
        locator: {}
        spoiler_after: ch0207
  first_appearance_candidate: true
- canonical_target: '[[E_char_ノゴルオゴルオ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0207_ノゴルオゴルオ_says_憎しみの煽り_p6938
        quote: 「憎め、殺せ、世の中の全てがおめたつの敵だ！  味方なんていねえだよ。間違った世界をぶっ壊せ！」  背後で憎しみを煽り続ける呪術師を一刻も早く倒すべきだが、立ちはだかるキノコ人たちがそれを許してくれない。
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_ノゴルオゴルオ_says_ハズレ_p6940
        quote: 「グハハハ！  あんま笑わせんなや。こいつらはハズレだ、大して惜しくもねえ。聖なる祭司の素質があれば幻覚を見せられたはずだよ。穢れた毒持ちなんぞここで使い捨てられんのがお似合いってもんだべや」
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_ノゴルオゴルオ_reveals_ディスケイム_p6941
        quote: 「ほーう、さっすがは大した目ん玉でねえか。その通りだよ、とんかちセラメル。『上』のおなごが良く気づくもんだ」
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_ノゴルオゴルオ_reveals_イェレイド_p6942
        quote: 「ああ、イエレドか？  あれはおらたつの傑作のひとつだよ。紀源分離と基礎構築はレストロオセとガドールが、異獣化はおらほの祭壇で仕上げた。まだ見所のある言語支配者どもがいた時代の話だよ、懐かしいなあ」
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_ノゴルオゴルオ_other_取引_p6944
        quote: 「おらたつはおめえと取引がしてえだ。銀貨をおらたつに渡せ。このノゴルオゴルオの名に賭けて、裏切り者になってやるだよ」
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_ノゴルオゴルオ_reveals_アルティウス_p6946
        quote: 「ディスケイムの計画には幾つもの保険が掛けられてる。亜竜王の落とし胤から脈々と受け継がれてきたペラティアの血統と、似せた名の死体に亜竜王の鱗を移植した紛い物の器。失敗した方は成功した方の全てを奪い、その『天眼』で救世主誕生を見届ける。どっちが亜竜王になっても問題はねえっちゅうわけだ」
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_ノゴルオゴルオ_other_鉤爪_p6949
        quote: 「んだ。わかってねえみてえだから教えとくが、そいつはおめえが『血』を活性化させるたんびに進行する。その『鉤爪』ばっか使ってっとさっさと縮んでしまうからやめとけ。アルティウスと競い合う前に完成されても困る。物事には適切な時機っちゅうもんがあるだよ」
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_ノゴルオゴルオ_reveals_アルティウスの復活_p6951
        quote: 「んだ、そのアルティウスだ。大地の眷族に伝わる『死の地霊』の力で復活させた。火葬される前に遺体を確保できたのは幸いだっただよ」
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_ノゴルオゴルオ_threatens_魂の誓約_p6953
        quote: 「ああ、それでいいだよ。どうやらユディーアはおらたつを警戒しちまってるみてえだし、せめてうっかりおっ死んでしまわねえように鍛えてやってけろ。ああ、それでも手抜きはしねえで欲しいだよ。アルティウスに生き残って欲しいからとやわな武器を持たされたんでは王の試練にならねえだからな。そこは『魂の誓約』で呪縛させてもらう」
        locator: {}
        spoiler_after: ch0207
    action:
      observations:
      - event_ref: E_ch0207_ノゴルオゴルオ_binds_口約束_p6954
        quote: 方言使いにとって話し言葉は書き言葉に優越する。正式な書面や血文字による誓約儀式などが無くともノゴルオゴルオは口約束のみで相手の魂を呪縛することが可能なのだ。
        locator: {}
        spoiler_after: ch0207
  first_appearance_candidate: true
- canonical_target: '[[E_char_ポルガー]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0207_ポルガー_other_ディスケイム_p6962
        quote: 「そうね。けどジャッフハリムとして言わせてもらうと、あの来訪者はクロウサーやリーヴァリオンほどの脅威ではない。油断ならない相手ではあるけれど、場合によっては共闘できるし、これまでもそうしてきた。あなたが好例でしょう？」
        locator: {}
        spoiler_after: ch0207
  first_appearance_candidate: true
- canonical_target: '[[E_item_テッシトゥーラ]]'
  entity_type: item
  aspects:
    action:
      observations:
      - event_ref: E_ch0207_テッシトゥーラ_appears_銀貨の円_p6968
        quote: 脈絡の無い声が明るく室内に響く。  ユディーアの表情は変わらない。相手が出現したのは銅貨が囲んだ円の中心。  自分で呼び出したのだ。
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_テッシトゥーラ_uses_オルガンローデ_p6976
        quote: 「今、この瞬間にも。わたしが詠唱したオルガンローデたちは相互に参照し合いながら新しいオルガンローデたちを紡ぎ続けている。自動化した呪文竜たちの防火壁を構築するのに数日。祝祭が始まったら一日ごとに『キューブ』を組み上げて、九日目にきちっと完了する予定かな。ちなみに必要無ければ六層に投げるだけだから、無駄にはならないよ」
        locator: {}
        spoiler_after: ch0207
      - event_ref: E_ch0207_テッシトゥーラ_takes_銀貨_p6977
        quote: 「うんうん、物分かりが良くて結構。それじゃあ友情の証に銀貨を一枚、貰っていくね？」  「どうぞ。銅貨十枚が銀貨一枚分です。軍勢召喚の門にもなっているので、何かあればそれを使って来て下さい」
        locator: {}
        spoiler_after: ch0207
    speech:
      observations:
      - event_ref: E_ch0207_テッシトゥーラ_reveals_クナータの記憶_p6969
        quote: 「大丈夫だよ。クナータの未来回想は本当は何も変化していない。表のクナータがあなたに教えてたやつはちょちょいっていじった記憶だからさ」  「あの子の記憶を操作したの？！」「わたしじゃないよ？  クナータがやったの。裏側のリーヴァリオンが。ここまではわたしたちの予定通りなんだよね、実は。あの子は自分からディスケイムへの釣り餌になってくれたってわけ。表の方には自覚が無いけどね」
        locator: {}
