- canonical_target: '[[E_char_アニス]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0016_アニス_attacks_キロン_p723
        quote: 袖口から出現したのは旋棍型の呪具。柄に刻印された溝に指を這トンファーわせて安全装置を解除。エンチャントされた呪術を起動。吸い込んだ空気をコンプレッサが圧縮、内部の燃素と混合することで高温高圧のガスが発生する。呪具の後部から爆発的な推進力を発生させ、ジェット噴射の打撃を叩き込むのがアニスの得意とする戦術である。
        locator: {}
        spoiler_after: ch0016
      - event_ref: E_ch0016_アニス_attacks_アルテミシア_p729
        quote: 轟音を伴って、高速で回転する旋棍が振るわれた。速度、威力共に直撃すれば絶命は免れないであろう一撃。まして、狙いは側頭部である。
        locator: {}
        spoiler_after: ch0016
      - event_ref: E_ch0016_アニス_kills_親子_p734
        quote: 旋回した棍が勢いよく女性の後頭部に叩きつけられ、血と脳漿を飛び散らせる。頭蓋を砕いただけでは物足りないとばかりに、もう一方の旋棍が首筋に、更に肩、腕、背骨と次々と骨を砕いていく。
        locator: {}
        spoiler_after: ch0016
