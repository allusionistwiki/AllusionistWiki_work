        locator: {}
        spoiler_after: ch0016
      - event_ref: E_ch0016_キロン_says_アキラへの恩義_p728
        quote: 「親友を送ってくれたことに対しての礼だ。魂が異獣に穢される前に安らぎを与えたのは彼だと、報告にはそうあった。――尤も、彼にとっては傷になっているかもしれないことだ。あえて口に出したりはしないが」
        locator: {}
        spoiler_after: ch0016
    action:
      observations:
      - event_ref: E_ch0016_キロン_appears_ロドウィの背後_p723
        quote: いつからそこに男がいたのか、誰も気付くことができなかった。その男は、まるで社内に設置されたモニュメントのように風景と一体化していたのだ。
