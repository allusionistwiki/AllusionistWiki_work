        spoiler_after: ch0016
      - event_ref: E_ch0016_キロン_says_クラッキングの逆効果_p725
        quote: 「しかし、そのような攻撃を全て防御することができたとすればどうなるか。そのような無意味な攻撃は、強奪者自身が暗号通貨の価値を認めていると白状しているに等しい。同時に、強奪者たちがこぞって価値を認めており、加えて強固な金庫番を持った信用度の高い通貨であるという証明になる」
        locator: {}
        spoiler_after: ch0016
      - event_ref: E_ch0016_キロン_promises_魔女狩り_p726
