        quote: そして調子の外れた下手で耳障りな歌を聴かせてごめんなさい、もうしないから誰にも言わないでと素早く打ち込んで、そのままその場を立ち去ろうとする。
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ジル_other_主人公の言葉_p2124
        quote: 『ありがとう。嘘でも嬉しい』
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ジル_promises_勝利_p2126
        quote: 『大した自信。だけど、勝つのは私』
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ジル_reveals_末妹の目的_p2127
        quote: 『沢山、たくさんある。最初にお母様にお知らせするの。そしたらいっぱい褒めて欲しい。お姉様にも、本当に妹になれましたって胸を張って言いたい。故郷のみんなにどうだって威張ってやりたい。『図書館』のシステムを改革して、もっと効率化したい。それに』
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ジル_reveals_聴力喪失の理由_p2127
        quote: 『女神の眷族になれば、耳が聞こえるようになっても大丈夫かもしれない』
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ジル_other_呪われた運命_p2128
        quote: それを恨みに思うことも、悲観することも無く、ただ呪われた運命を尊ぶようにヴァージリアは言葉を紡いだ。 最愛の庇護者たちからの呪い。 かくあれと望まれた期待。
          それは重く、おぞましく、けれども彼女にとってなにより尊く聖なるもの。
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ジル_has_property_アストラルの波動_p2128
        quote: 『けれど、聴力の喪失は意図されたものだった。ジルの異形の耳は大気の震えではなくアストラルの波動を捉える。』
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ジル_reveals_虐殺の真相_p2130
        quote: リクシャマー帝国と槍神教の神官たちが全ての元凶なの。 カタルマリーナお姉様とビークレットお姉様は二人を救出に向かったの。 そして、もう二度と星見の塔に手出しをしようと思わなくなるように、見せしめとして虐殺を行った。
          そうして恐怖を世界に刻み付けたの』
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ジル_reveals_構造の欠落_p2132
        quote: 『本質的には同じものが欠落しているの。 それは構造。 あるいは繋がり。 もしくは、そう――連関』
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ジル_other_夜の民_p2133
        quote: 『疑似細菌の群体によって創造される創発的生命。 夜の民は天然の呪術式汎用計算機である性質上、知能の在り方が呪術的になる。 だからこそ全眷族種で最大の呪術適性を持っているの。
          呪術的思考――すなわち寄せ集めの仕事。 理論に基づいて設計する杖の対極』
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ジル_other_科学的思考_p2134
        quote: 『杖の世界観――科学的思考の枠組みというのは、少なくともこの世界では絶対じゃない。 再現性のある事象や対象への分析といった事が正確に行えない――あるいは間接的にしかできないこの世界においては、不確かな物理法則を前提とした反科学的思考こそが実践的な科学的思考になり得てしまう。』
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ジル_asks_創造_p2135
        quote: 『それも、実際には言葉遊びでしかないけど――ねえマリー。 真似だけで創造ができるかどうかを答えてみて』
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ジル_reveals_未知の定義_p2136
        quote: 『本質的な未知とは、未知の定義ゆえに存在できないし確かめられないの。 星見の塔がやっている試み――未知なる末妹の選定も同じ。 実のところこの選定は本質的な誤謬と矛盾を抱えている』
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ジル_reveals_自己の目覚め_p2137
        quote: 『ジルが――お母様やお姉様じゃなくて、ジル自身が何かをしてみたい。 それが、綺麗で、素敵なことであればいい。 イルディアンサの王族であるジルに何ができるのか。
          何をすべきなのか。 何がしたいのか。 ずっと考えてた』
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ジル_hopes_世界秩序_p2138
        quote: 『普遍なる言語。 それによって創造される世界秩序。 ジルは、それが見たい』
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ジル_promises_平和_p2139
        quote: 『ジルは、末妹に――女神になったら、世界に秩序をもたらすの』
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ジル_other_主人公の末妹就任_p2139
        quote: 『それはだめ。 末妹になるのはジルだから』
        locator: {}
        spoiler_after: ch0055
    visual:
      observations:
      - event_ref: E_ch0055_ジル_other_悲しい涙_p2123
        quote: 振り向いたジルはそこでようやく私に気がついて、さっと頬を赤らめた。 それから、傷付いたように息を飲んで、無言のまま涙を流した。
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ジル_has_property_聴力喪失_p2123
        quote: ヴァージリアは耳が聞こえない。だから、自分の歌声がどんなに素敵なのか知らないんだと私は思った。
        locator: {}
        spoiler_after: ch0055
