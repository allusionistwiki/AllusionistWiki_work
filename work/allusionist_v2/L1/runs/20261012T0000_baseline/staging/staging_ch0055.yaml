- canonical_target: '[[E_char_ブラック]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0055_ブラック_teaches_呪文_p2113
        quote: ブラック――と言っても二人の時はだいたい本名で呼んでいたけれど――が私に呪文の勉強を教えてくれるようになってからしばらく経った。
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ブラック_kills_パープル_p2118
        quote: とその時、同じくそれまで息をひそめていた黒き兎が、無防備になった攻撃の瞬間を狙って必殺の一撃をお見舞いした。 大量の光線が空間を駆け抜ける。
          パープルの全身が穴だらけになり、ブラックが作戦を成功させたことに全員が沸き立つ。
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ブラック_defeats_ホワイト_p2119
        quote: 結局そのホワイトもブラックに返り討ちにあい、フルブライトを破ったヴァーミリオンとの一騎打ちにも勝利したブラックがその戦いの勝者となった。
        locator: {}
        spoiler_after: ch0055
    speech:
      observations:
      - event_ref: E_ch0055_ブラック_asks_未来予知_p2114
        quote: 『ブラックからグレーへ。ジルも知りたい。無敵だとか未来予知ができるとか聞いてるけど本当なの』
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ブラック_other_連動_p2116
        quote: 『その事ならジルも気になってた。単にあの大量のブルーを警戒して、接近を予知しているのだとばかり思っていたけれど――注意して見ていると、両者が連動しているように見えることがある。』
        locator: {}
        spoiler_after: ch0055
    visual:
      observations:
      - event_ref: E_ch0055_ブラック_other_嬉しい涙_p2119
        quote: 初めて一位になった、と実世界でジルは声もなく静かに泣いた。彼女が涙を流している所を初めて見た私は驚いてしまったけれど、それは悲しい涙ではなく、嬉しい涙だったから、私はよかったねと帳面に書き付けて、お祝いに自分用にとっておいたお菓子をあげた。
        locator: {}
        spoiler_after: ch0055
