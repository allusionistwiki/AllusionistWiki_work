      - event_ref: E_ch0055_カタルマリーナ_wounds_ジル_p2128
        quote: ジルは生まれる前からお姉様とお母様に呪詛をかけられて、末妹になるための調整を受けてきた。 星見の塔にこの人ありと謳われた碩学の三女カタルマリーナお姉様と、その弟子にして呪いにおいて並ぶ者無しとまで言われたお母様の呪詛はジルの肉体を変異させ、高い呪術適性と引き替えに異形の耳を与え、代わりに聴力を喪失させたの
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_カタルマリーナ_other_ジル_p2129
        quote: お姉様はときどき防音の結界を張った部屋で、ジルひとりを聴衆にして歌うことがある。 ジルにはそれを聴くことが叶わないけれど、それでいいの。
