        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ダーシェンカ_reveals_霊長類の女の子_p2108
        quote: 霊長類の女の子。 魔女の影、その卵なのだと彼女は教えてくれた。
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ダーシェンカ_asks_創造とは_p2109
        quote: 『創造とは、人格とは、智慧とは、そして知能とは、果たしてどのようなものでしょうか』
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ダーシェンカ_asks_知恵競べ_p2109
        quote: 『知恵競べ、してみませんか？』
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ダーシェンカ_promises_失った何か_p2109
        quote: 『それを確かめるのに、うってつけの場がありますよ』 うってつけ？『貴方が失った何かを取り戻す為に』
        locator: {}
        spoiler_after: ch0055
    action:
      observations:
      - event_ref: E_ch0055_ダーシェンカ_takes_手紙_p2110
        quote: 長老様の所に滞在していたダーシェンカという女性に手紙を手渡すと、彼女はあらと口に手を当てて、それから私の頭を撫でてこう言った。
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_ダーシェンカ_departs_主人公_p2111
        quote: それから、ダーシェンカが『えこひいきに見られちゃうから』と言って私のそばを離れていった。
        locator: {}
        spoiler_after: ch0055
  first_appearance_candidate: true
- canonical_target: '[[E_char_主人公]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0055_主人公_learns_抽象化と推論能力_p2108
        quote: 『抽象化と推論能力の自覚まであと一歩ですね』
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_主人公_thinks_色の違い_p2112
        quote: 私の見ている色は、他の人が見ている色と同じ？ 違うのはわかるけど、その『違い』は同じ『違い』なのだろうか。
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_主人公_asks_パープル_p2114
        quote: そう思った私は、以前はパープルと同じ【虹のホルケナウ】という場所にいたグレーに葉っぱの伝言板で質問した。『アズールからグレーへ。パープルってどんな人？』
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_主人公_confesses_歌の美しさ_p2123
        quote: 私は取りすがって、そんなことないと否定した。『素敵な歌声だったよ。私は喋れないけど耳は聞こえるからわかるよ。とっても上手だった』
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_主人公_other_世界中に聴かせる_p2124
        quote: 『もっと色んな人にジルの歌を聴いて貰えばいいんだよ。黒百合宮だけじゃない。外の世界の色々な人に。きっとみんな認めてくれるよ』
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_主人公_thinks_妹の喪失_p2126
        quote: だって私には、切実な末妹になりたいという動機が無かったから。 元々私は、この場所に声を――妹を取り戻す為の術を探しにやってきたのだ。
        locator: {}
        spoiler_after: ch0055
    action:
      observations:
      - event_ref: E_ch0055_主人公_transforms_変身形態_p2108
        quote: 妹の形態に引き摺られていた私の変身形態は、そうしてちょっとだけ変化したらしい。自分ではよくわからないけれど、摸倣先が二つに増えて『個我』が強固になったとかなんとか。
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_主人公_other_手紙_p2110
        quote: 実のところ、妹に書き方は教わっていたけれど、実際に書くのはそれが始めて。
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_主人公_other_彩石の儀_p2111
        quote: ダーシェンカに言われるがまま適当に手足を動かしていたら、いつの間にか一番だと言われてしまった。 びっくりした。
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_主人公_loses_アストラル界の戦い_p2114
        quote: ある日、アストラル界での戦いで初めて負けた。 とっても強いパープルとヴァーミリオン、それからフルブライトとノーレイが一斉に襲いかかってきて、今までずっと負け知らずだった私はとうとう敗れてしまった。
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_主人公_finds_星見の塔_p2122
        quote: とてとて走り出して、何度か転びながらも歌声が聞こえる方へと急ぐ。 大理石の廊下を突っ切り、浮遊する螺旋階段を駆け上がり、光の滝を通り抜け、影の扉を開いて屋上へ。
          そこは小さな『星見の塔』だった。
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_主人公_other_感動_p2124
        quote: どうにかして今の自分の気持ちを伝えたいと私は思って、精一杯の言葉を文字にしていった。 それはとても遅くて、ひどくもどかしい作業だった。
        locator: {}
        spoiler_after: ch0055
    relationship:
      observations:
      - event_ref: E_ch0055_主人公_loses_ベアトリーチェ_p2109
        quote: 私は二つのものを同時に見失った。 なにより大事なベアトリーチェと、妹を呼び止める為の言葉を。
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_主人公_fears_会話_p2111
        quote: 迷惑をかけてしまうから、というのもあるけれど、声を使って素早く話せない自分がなんだか惨めな気がしたからだ。
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_主人公_loves_ブラック_p2113
        quote: なんだか妹と一緒にいるみたいで、私はついつい彼女に甘えてしまう。 ――それはなんだかいけないことのような気がしたけれど、気がつけば彼女は私にとって一番身近な人になっていた。
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_主人公_loves_ジル_p2122
        quote: 同じように綺麗だと思った人はいる。 私にとってそれは妹ビーチェだった。あの子だけが私の一番綺麗で素敵なもの。 けれど――その日はじめて私はそうではない誰かを『一番素敵だ』と思った。
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_主人公_bonds_ジル_p2140
        quote: 難しいお話じゃなくなっても、私たちの軽やかなやりとりはちょっとだけ遅くてもどかしくて――けれど二人の間では完璧に呼吸が合っていた。
        locator: {}
        spoiler_after: ch0055
    visual:
      observations:
      - event_ref: E_ch0055_主人公_observes_模倣子_p2110
        quote: 高級な服を着ていると、『流行ミーム』や『デザインミーム』が運動するらしい。不思議だと感じたのは、他の三人にはそういうものが私ほどはっきりと見えていないらしいと知った時だ。
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_主人公_observes_歌声_p2121
        quote: ふと気付く。 黒百合の子供たちの中に、声を出さない子供は二人いる。 声が出せない私と、耳が聞こえないヴァージリア――ジルだ。
        locator: {}
        spoiler_after: ch0055
      - event_ref: E_ch0055_主人公_observes_下弦の月_p2125
        quote: 太陽の圧倒的な存在感のせいで目立たないけれど、空の端に下弦の月が見えている。そこから放たれる微弱な呪力を、私は敏感に感じ取っていた。
        locator: {}
        spoiler_after: ch0055
  first_appearance_candidate: true
