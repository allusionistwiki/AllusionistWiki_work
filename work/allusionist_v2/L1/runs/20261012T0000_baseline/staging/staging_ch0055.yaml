        quote: 『音声言語を聞いてしまうがゆえに陥穽に捕らわれる事もある。 話し言葉とはとても便利。 速くて強力。 けれど同じくらい危うく慎重さにかけることがある。
          呪文使いは言葉の繰り手。 だから、言葉を誰よりも丁寧に扱わないとならない。 その戒めを込めて、あえて私の耳を閉ざしたのだとお姉様は教えてくれた』
