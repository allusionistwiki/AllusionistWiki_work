      observations:
      - event_ref: E_ch0055_ホワイト_has_property_びくびく屋_p2112
        quote: 周囲の全てを怖がっているようなびくびく屋のホワイトは、背丈が小さくて少し親近感。でも一番年上なんだってシアンに聞かされてびっくり。
        locator: {}
        spoiler_after: ch0055
    speech:
      observations:
      - event_ref: E_ch0055_ホワイト_suspects_パープルとブルー_p2116
        quote: 『私ちょっと気付いたことあるんですが。多分、パープルとブルーって組んでますよね』
        locator: {}
        spoiler_after: ch0055
    action:
      observations:
      - event_ref: E_ch0055_ホワイト_betrays_黒百合の子供たち_p2119
        quote: 首尾良く勝利したのは良かったのだが、その直後にホワイトが裏切ってグレーとティールを倒し、消耗した私たちは次々とホワイトに敗れていった。
        locator: {}
        spoiler_after: ch0055
