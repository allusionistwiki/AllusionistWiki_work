        spoiler_after: ch0188
      - event_ref: E_ch0188_シナモリアキラ_says_教育ドラマ_p6220
        quote: 「説明なんてしても劇は進まない。ここはラクルラールが仕切る教育ドラマ、応用ドラマの世界なんだから。今はまだ、な」
