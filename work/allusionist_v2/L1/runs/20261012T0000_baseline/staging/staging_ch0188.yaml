        spoiler_after: ch0188
      - event_ref: E_ch0188_コズエ_travels_螺旋階段_p6233
        quote: 螺旋階段を一歩一歩進むごとに、周囲を炎が舞っていく。燃える天使たちに導かれ、少女は天に召されていく。
        locator: {}
        spoiler_after: ch0188
      - event_ref: E_ch0188_コズエ_defeats_クルミ_p6239
