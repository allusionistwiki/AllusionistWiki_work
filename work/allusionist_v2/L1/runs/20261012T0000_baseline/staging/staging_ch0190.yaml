  aspects:
    action:
      observations:
      - event_ref: E_ch0190_少年_flees_家庭_p6263
        quote: 枕元に書き置きを残して、少年はわずかな名残惜しさと罪悪感を振り切って旅立とうとしていた。
        locator: {}
        spoiler_after: ch0190
      - event_ref: E_ch0190_少年_makes_刃_p6264
        quote: 伸びた手指が刃を模せば、剣となって世界を切り裂く。剣詩舞の鮮やかさに舞台はひとときだけ呼吸を止めた。
        locator: {}
        spoiler_after: ch0190
      - event_ref: E_ch0190_少年_makes_髪_p6264
        quote: ふと思い立って、長い髪を後頭部で括る。馬の尻尾のように垂れ下がる長髪の気配。しっくりとくる。これでいい。けれど、黒いゴムをどこで手に入れたのかは思い出せない。
        locator: {}
        spoiler_after: ch0190
      - event_ref: E_ch0190_少年_other_王の役目_p6265
        quote: 舞い手は拍手と声援に応えなければならない。そうしなければ舞いが止まってしまうからだ。踊り続けるため、彼は王の役目を引き受けた。
        locator: {}
        spoiler_after: ch0190
      - event_ref: E_ch0190_少年_defeats_魔獣_p6265
        quote: 颯爽と島に現れた強く美しい若者によって悪しき謎かけの魔獣は討伐された。
        locator: {}
        spoiler_after: ch0190
      - event_ref: E_ch0190_少年_kills_イアテム_p6266
        quote: 昇天する魂の下で、うつろな生身の首が王によって切断された。
        locator: {}
        spoiler_after: ch0190
    visual:
      observations:
      - event_ref: E_ch0190_少年_has_property_黒髪_p6263
        quote: 眉目秀麗にしてすらりと長い手足は鋭く、艶やかな長い黒髪は冷たい夜風に流れて闇に溶けていた。
        locator: {}
        spoiler_after: ch0190
    speech:
      observations:
      - event_ref: E_ch0190_少年_says_父_p6263
        quote: 「だから行ってきます、父さん。先輩が言っていたあの島に行けば、俺は何かを掴める気がするんだ」
        locator: {}
        spoiler_after: ch0190
      - event_ref: E_ch0190_少年_thinks_忘却_p6263
        quote: とても大切なことを忘れている気がして、旅に出ようと少年は思い立った。
        locator: {}
        spoiler_after: ch0190
  first_appearance_candidate: true
