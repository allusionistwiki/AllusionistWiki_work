- canonical_target: '[[E_char_リーナ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0270_リーナ_says_ポニーテール眼鏡委員長触手_p8397
        quote: 「ポニー！ 眼鏡！ 触手！ ポニーテール眼鏡委員長触手ぅぅうううわぁああああああああああああああああああああああん！！！ ポニーポニーポニーうぁわぁああああぁクンカクンカ！
          ポニーテールのうなじクンカクンカ！ 揺れる髪の先っぽスーハースーハー！ スーハースーハー！ いい匂いだなぁ…くんくんはぁっ！ 萌え萌え委員長たそのつやつやキューティクルポニーをクンカクンカしたいお！
          クンカクンカ！ あぁあ！！ 間違えた！ モフモフしたいお！ 髪モフモフ！ 毛先モフモフ！ 髪髪モフモフ！ かわいい！ ポニーしゅき！ あっああぁああ、いやぁああああああ！！！
          ポニーとはメイクラブできない！ 子供産めない！ 眼鏡も触手もよく考えたら…萌要素とは仲良しできない？ にゃあああああああああああああん！！ そんなぁああああああ！！
          いやぁぁぁあああああああああ！！ この！ ちきしょー！ 否定してやる！！ 現実なんか壊して、ああ、やめ…て…え！？ 誘って…る？ 揺れる髪の毛にも意思はある？
          眼鏡が知性のアイコンなら眼鏡にも知性が宿る？ 触手の神経束は原始的な脳？ ふおおおちゅきちゅきラブちゅっちゅ！ いけるいけるベビー作れる私に槍は無いけど生やせば問題なしなしいっそ私が妊娠するよ！
          きた！ もう妊娠した！ ポニーベビーたそがお腹蹴ってるぞ！ ポニー、ポニーポニー髪の毛らぶらぶ仲良しどっきゅんこ髪の毛即妊娠いけたぞやったああああああ！！！！
          畸形嚢腫ポニーかあわいいよ腫瘍でも愛してあげられるからね萌え萌えラブキュン真実の慈愛よ萌次元に届け！ よかった…世の中まだまだ捨てたモンじゃないんだねっ！
          いやっほぉおおお！！！ 私の想いよポニー眼鏡触手へ届け！！ 萌え六芒星に託した願いよ紀元槍へ届け！」
        locator: {}
        spoiler_after: ch0270
      - event_ref: E_ch0270_リーナ_says_テセトへの反応_p8399
        quote: 「うおお、大変そう。おつかれさまです」 とぼけた反応をするリーナだったが、内心は口調ほど穏やかではない。
        locator: {}
        spoiler_after: ch0270
      - event_ref: E_ch0270_リーナ_says_テセトへの感謝_p8401
        quote: 「良く知ってるよ。私の援護、こっそりしてたよね」
        locator: {}
        spoiler_after: ch0270
      - event_ref: E_ch0270_リーナ_asks_クロウサーの最終目的_p8402
        quote: 「情報を操って、血族を繫栄させる。それはわかるよ。でもその先は？ トライデントの融血呪ってなんでも融かしてくっつけちゃうんだよね？ まさか、全人類をドロドロのスープにして支配する、とかが最終目的だったり？」
        locator: {}
        spoiler_after: ch0270
      - event_ref: E_ch0270_リーナ_thinks_クロウサーの目的_p8402
        quote: 呪術的な儀式。霊的位階の向上。優秀なリーダーの選抜。そしておそらくは、優秀な『生贄』を用いた救世主トライデントの降臨と、それに伴う『クロウサー家にとって都合のいい世界の実現』。このあたりの目的はある程度は推測ができる。
        locator: {}
        spoiler_after: ch0270
    visual:
      observations:
      - event_ref: E_ch0270_リーナ_observes_モーエンの残影_p8398
        quote: コースに焼き付いた残影だとわかっていても驚嘆と畏怖、そしてレコードゴースト忌避感が理性を上回る。追い付ける気がまるでしない。『速』がありすぎる。
        locator: {}
