- canonical_target: '[[E_char_テセト]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0270_テセト_appears_天宮神官の正装_p8398
        quote: 無形の大気は有形の人影へと変じ、若い男の姿をとった。 すっぱりと切りそろえられたヘルメット状の頭髪に細い目、柔和ながら底知れない凄みを秘めた顔立ち。純白の貫頭衣と儀典用の鉄扇が目につく立ち姿は逆さ城エクリーオベレッカに仕える天宮神官の正装だ。
        locator: {}
        spoiler_after: ch0270
    speech:
      observations:
      - event_ref: E_ch0270_テセト_says_クロウサーの暗部_p8398
        quote: 「お分かりでしょうか、リーナ様。これがクロウサーの暗部。世界の闇。語る事さえ憚られる負の歴史。我らアルゾラ家は世の風聞を影から操り、こうしたおぞましき光景を闇から闇へと葬り、美しき虚飾で糊塗して参りました」
        locator: {}
        spoiler_after: ch0270
      - event_ref: E_ch0270_テセト_says_試練の性質_p8399
        quote: 「はい。何なりとお申し付けください、リーナ様。既にレースは始まっておりますが、先を行くモーエン様との距離や時間を気にする必要はございません」
        locator: {}
        spoiler_after: ch0270
      - event_ref: E_ch0270_テセト_other_七つ風_p8400
        quote: 「真の空使いが掌握すべき視座。神話の時代には『囲いのない浄界』が主流であり、クロウサーの誕生に関わった賢者アルカェはそれを『風』と定義しました。呪術的には、特定の角度から切り取った『連続的なテクストの遷移と風化』のパターンを『運命』と解釈することで過去から未来までの時間を支配する、という捉え方がわかりやすいでしょうか。クロウサーが天の支配者たる理由のひとつがこれです」
        locator: {}
        spoiler_after: ch0270
      - event_ref: E_ch0270_テセト_says_アルゾラ家の使命_p8401
        quote: 「我らアルゾラ家は長きにわたり神の託宣を民に広めてきた神官の家系。時代を下るにつれて『伝える』という役割は新聞、出版、水晶テレビといったマスメディアへと形を変えましたが、その本質は同じです。全ては、血族の繁栄のために」
        locator: {}
        spoiler_after: ch0270
      - event_ref: E_ch0270_テセト_says_怠惰な当主への態度_p8401
        quote: 「怠惰な当主であればそれも良し。支える甲斐があるというものです」
        locator: {}
        spoiler_after: ch0270
      - event_ref: E_ch0270_テセト_says_愛_p8404
        quote: 「あ、愛です」「はあ。なんて？」「あの、愛です。リーナ様。愛情」「うっそだろお前」 リーナは自分の一族のスローガンやら最終目的やらが『愛』であると知り、なんとも言い難い心持ちになった。確かにいい感じの額縁に入っていたり壁に飾られていたりしそうな言葉ではあるが、しかしまさかの愛である。「何かの比喩？
          呪術的な意味があって、みたいなやつ？」「まあ、ドライに表現すると『生殖』や『結婚』や『種の存続』になりますが。ただ、これらはあくまでも『行為と結果』に過ぎません。クロウサー家という血族の本質を説明しようとすると、やはりこう、ああいった表現になりますね」
        locator: {}
        spoiler_after: ch0270
      - event_ref: E_ch0270_テセト_confesses_宇宙人であること_p8407
        quote: 「確かにその通り、我々は宇宙人です。核心を突いてきますね。あなたは太陰の『司書』ですか。それとも、それすら隠れ蓑でしょうか」
        locator: {}
        spoiler_after: ch0270
      - event_ref: E_ch0270_テセト_reveals_播種_p8407
        quote: 「リーナ様、今のは妄想ではなく真実ですよ。クロウサーとは隣接する内世界イヴァ・ダストに起源を持つ異邦人であり、生命の可能性が潰えた星から希望を求めて旅立った種子。つまるところ、我ら来訪者の最終目的とは、『播種』なのですよ」
        locator: {}
        spoiler_after: ch0270
    relationship:
      observations:
      - event_ref: E_ch0270_テセト_other_アルゾラ家当主_p8400
        quote: リーナはこの七つ風の末席、テセト・アルゾラ・クロウサーとは面識がある。 彼は先代の空使いサイリウスの首席秘書官だ。 そして、最古のゾラ分家であるアルゾラ家の当主にして祭司長でもあった。
          若く見えても親戚の古老。本家と分家という家格の違いを踏まえても、リーナにとってはやや苦手意識のある相手だ。
        locator: {}
        spoiler_after: ch0270
      - event_ref: E_ch0270_テセト_loses_役職_p8401
        quote: しかし今回、ガロアンディアンとの合同開催となったことでテセトは誉れある役職を解任されている。アルゾラ家は、いわばリーナとメートリアンの登場によって冷遇されることになった有力血族の筆頭であった。
        locator: {}
        spoiler_after: ch0270
    name:
      observations:
      - event_ref: E_ch0270_テセト_names_扇風_p8400
        quote: 「『扇風』。暗示する呪術的な意味は『伝播する神の御言葉』。すなわち神官の扱う呪文のことです。我がアルゾラ家が担う本来の使命なのですが、残念ながらリーナ様にはあまりご理解いただけていなかったようで、少々残念ですね」
        locator: {}
        spoiler_after: ch0270
  first_appearance_candidate: true
