episode: ch0140
created: '2026-10-10'
status: pending_merge
entities:
- canonical_target: '[[E_char_観客]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0140_観客_attacks_互い_p4751
        quote: 暴徒と化した観客たちは目を血走らせ、喉も涸れよとばかりに罵声を吐き出している。
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_観客_breaks_携帯端末_p4751
        quote: ある者は携帯端末や応援用の拡声器を破壊して見せた。技術力を誇りとするガロアンディアンとトリシューラに対する敵意の表明。
        locator: {}
        spoiler_after: ch0140
    symbolic:
      observations:
      - event_ref: E_ch0140_観客_other_理性_p4751
        quote: そこに理性は無く、まるで会場の雰囲気に支配されているかのようだ。
        locator: {}
        spoiler_after: ch0140
    speech:
      observations:
      - event_ref: E_ch0140_観客_says_侮辱_p4751
        quote: ある者はこれ見よがしに地面に唾を吐いて見せた。大地の民に向けての最大級の侮辱。
        locator: {}
        spoiler_after: ch0140
  first_appearance_candidate: true
- canonical_target: '[[E_char_ルバーブ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0140_ルバーブ_names_アレッテ・イヴニル_p4752
        quote: 元凶の正体は自明だった。アレッテ・イヴニル。忌まわしい毒婦。
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_ルバーブ_thinks_扇動_p4752
        quote: 扇動した者がいる。恐らくは、呪術的な力によって。
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_ルバーブ_thinks_アルト王の力_p4753
        quote: 無論、アルト王の力の強大さを信用しての命令だ。
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_ルバーブ_other_アレッテの正体_p4754
        quote: 私は、アレッテという女が本物の貴種であることを知っている。亜竜王に連なる名前の由来も、ラフディの王家に連なっているのだというその来歴も、全て。
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_ルバーブ_thinks_公言の禁止_p4754
        quote: だがそれは致命的な情報であった。公言することは決して出来ない代物だ。その事実が明かされたが最後、ガロアンディアン、竜王国、そしてラフディの三国は間違い無く根底から揺るがされてしまうことだろう。
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_ルバーブ_fears_文化侵略_p4757
        quote: 文化侵略によって内側から攻撃されたラフディは、その名と文化の名残を持ちながら、ガロアンディアンを無秩序に混ぜ込まれた『何か』になってしまう。
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_ルバーブ_thinks_危険な考え_p4757
        quote: それは途方もなく危険な――ラフディに忠誠を誓った戦士として考えてはならないことだった。つまり、逆に考えれば、あらゆるものを包括するサイバーカラテの中でなら『ラフディ』を生かし続けることができるのではないか、という。
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_ルバーブ_other_アレッテ_p4760
        quote: 「馬脚を現したな、邪悪な魔女め。聖なる球神の名を騙り、穢れた儀式でラフディを穢そうとする貴様はもはや一秒足りとて捨て置けん。陛下、どうか一言ご命令下さい。この女を排除する許可を！」
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_ルバーブ_other_球神_p4771
        quote: 「球神の御為に！　奴らの頭を持って来おおおおぉぉい！！」
        locator: {}
        spoiler_after: ch0140
    action:
      observations:
      - event_ref: E_ch0140_ルバーブ_other_アレト_p4753
        quote: 「それからアレトは自分の名を媒介にしてアレッテ・イヴニルに呪縛をかけろ。あの魔女めの動きを多少なりとも妨害できるはずだ」
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_ルバーブ_other_部下_p4753
        quote: 「落ち着け。まずは陛下の安全を確保することが先だ。カルメーキフとドルン、ゴガベズは私と共に貴賓席に向かうぞ。ソーレル、ドック、ペルシカリア、エキドナで暴動の鎮圧に当たれ。多少手荒になっても構わん」
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_ルバーブ_attacks_観客_p4758
        quote: 部下を引き連れて疾走し、場内に下りてきて乱闘を始めている観客たちを強引に薙ぎ倒しながら突き進む。
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_ルバーブ_attacks_敵_p4770
        quote: 気付けば私は突撃を開始していた。兵を率い、民の声援を背に受け、かつてのように戦場へと駆け出していく。
        locator: {}
        spoiler_after: ch0140
    visual:
      observations:
      - event_ref: E_ch0140_ルバーブ_observes_紅紫の髪_p4754
        quote: 見ると、触手が触れた部分にびっしりと紅紫の髪が絡みついている。おぞましいのは、それが私の身体から直接生えていたことだ。
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_ルバーブ_observes_シナモリアキラ_p4755
        quote: 一瞬だけシナモリアキラと視線がぶつかった。サイバーカラテの紀人。意思決定の外部化。その極致にして体現者。その在り方に、どうしようもなく私は共感していた。
        locator: {}
        spoiler_after: ch0140
  first_appearance_candidate: true
- canonical_target: '[[E_item_死人の森の断章]]'
  entity_type: item
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch0140_死人の森の断章_functions_as_王権_p4752
        quote: これこそは書物の形で分割された王権。
        locator: {}
        spoiler_after: ch0140
  first_appearance_candidate: true
- canonical_target: '[[E_char_アレト]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0140_アレト_asks_アルト王への影響_p4753
        quote: 「しかし、そうしますとアルト王にも影響が」
        locator: {}
        spoiler_after: ch0140
    action:
      observations:
      - event_ref: E_ch0140_アレト_dies_呪い返し_p4754
        quote: 大地に手をついて呪いの文言を唱え始めた彼は、数秒の後に呪いを返されて崩れ落ちた。目から黒い血を流し、口から歯をぼろぼろと落としながら肉と骨を朽ち果てさせている。
        locator: {}
        spoiler_after: ch0140
  first_appearance_candidate: true
- canonical_target: '[[E_term_サイバーカラテ]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch0140_サイバーカラテ_defines_意思決定の外部化_p4755
        quote: ラフディのサイバーカラテは、基本となる『経験の釜』と『意思決定の神託』を球神の加護に委ねている。
        locator: {}
        spoiler_after: ch0140
  first_appearance_candidate: true
- canonical_target: '[[E_char_トリシューラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0140_トリシューラ_other_評価の獲得_p4756
        quote: その成果によって、彼らは勝敗に関わらず『評価』を獲得しようとしていた。
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_トリシューラ_other_詰み_p4756
        quote: そうすることで、どちらが勝ってもサイバーカラテへの評価が高まってしまうという『詰み』の状況を狙っていたのだ。
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_トリシューラ_other_ワルシューラ_p4766
        quote: 「そいつはワルシューラ！　私の偽物だよ！　みんな騙されないで！」
        locator: {}
        spoiler_after: ch0140
  first_appearance_candidate: true
- canonical_target: '[[E_char_アレッテ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0140_アレッテ_other_関与_p4758
        quote: 「いいえ。私は何もしていないわ」
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_アレッテ_other_救済_p4759
        quote: 「この騒乱も、全てはその後に訪れる救済の為。これは歴とした呪術。古い形のラフディーボールなのだから」
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_アレッテ_says_使い魔_p4759
        quote: 「そうね。みんな、私想いの優しい子たちよ。何にも言わなくたって、私のして欲しいことを自分からしてくれる素敵な騎士様。
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_アレッテ_other_ルバーブ_p4761
        quote: 「ひどい男。ひどい偽り。ねえ陛下。このルバーブを信じてはいけません。だって、彼はどうしようもない嘘つきなんですもの。
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_アレッテ_says_愛_p4761
        quote: 「ねえ、麗しい陛下。可愛い、可愛い――かわいそうなマラード様。どうかこれだけは信じて欲しいのですけれど、私はあなたのことが大好きで、いつだって味方のつもりなんですよ？」
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_アレッテ_says_グレイシス_p4764
        quote: 「こら、駄目よグレイシス。ぺってしなさい、ぺって。全く、悪食なんだから」
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_アレッテ_says_祭壇_p4767
        quote: 「生命の坩堝と化したこの儀式場は、血を神に捧げるための祭壇に他ならない」
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_アレッテ_threatens_民_p4768
        quote: 「早くしないと、罪なき『仲間たち』が球神の怒りによって挽き潰されてしまうことでしょう。
        locator: {}
        spoiler_after: ch0140
    action:
      observations:
      - event_ref: E_ch0140_アレッテ_other_ちびシューラ_p4762
        quote: 「そう。ならもういいわ。面倒だし、適当に済ませてしまいましょう――封鎖を開始なさい、ちびシューラ」
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_アレッテ_binds_ルバーブ_p4763
        quote: アレッテの手指から、細い糸が伸びている。糸が貴賓席の端にある柱を経由して私の足に絡みついていたのだ。
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_アレッテ_defeats_カルメーキフ_p4764
        quote: 空間をずらして境界線を定めるかのような異様な『歪み』がアレッテの右の五指から伸びて、カルメーキフの堅固な守りをいとも容易く断ち切ったのだ。
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_アレッテ_kills_ゴガベズ_p4764
        quote: ゴガベズは噛み砕かれていた。波打つ巨大な大顎――紅紫の大蛇の牙によって。
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_アレッテ_kills_ドルン_p4764
        quote: 呪いの視線によって石化したドルンが砕け散った。
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_アレッテ_other_マラード_p4765
        quote: アレッテはするりと私の拘束を解いて、無造作に足を進める。陛下が思わず一歩退くが、魔女はそちらには目もくれず競技場の方へと向かって行った。
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_アレッテ_other_塔_p4767
        quote: 直後、真上から巨大な柱が落下してきたのだ。無数の岩石を積み上げて出来た硬い質量。その正体は、塔だ。
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_アレッテ_other_塔の上_p4769
        quote: 「私の居場所は塔の上。本当は、球技の観戦なんてアウトドアな趣味はあまり無いのよ。おとなしく引きこもってお人形遊びでもしているわ」
        locator: {}
        spoiler_after: ch0140
  first_appearance_candidate: true
- canonical_target: '[[E_char_マラード]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0140_マラード_asks_アレッテ_p4758
        quote: 「これはどういうことなのだ、アレッテよ！」
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_マラード_asks_説明_p4759
        quote: 「待て、待ってくれ！　お前たちは一体何を言っている？！　何故こんなことが起きているのだ、誰か俺に説明してくれ！」
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_マラード_other_嘘_p4759
        quote: 『嘘』を信じて追い求めることがマラード王の本質であるからだ。
        locator: {}
        spoiler_after: ch0140
    action:
      observations:
      - event_ref: E_ch0140_マラード_other_ルバーブ_p4762
        quote: 「――俺は、ルバーブを信じよう」
        locator: {}
        spoiler_after: ch0140
  first_appearance_candidate: true
- canonical_target: '[[E_term_ラフディーボール]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch0140_ラフディーボール_defines_儀式_p4759
        quote: 元々のラフディーボールは現代のような競技というよりも、神に捧げる儀式という側面が強かった。
        locator: {}
        spoiler_after: ch0140
  first_appearance_candidate: true
- canonical_target: '[[E_term_ワルシューラ]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch0140_ワルシューラ_other_棺桶化_p4765
        quote: 「この競技場は、これからみんなの棺桶に大改築しまーす！　再生者の増大は大問題！　なので、お墓や棺桶でみんなの数をいっぱい減らして、呪力エネルギーに還元します！
        locator: {}
        spoiler_after: ch0140
    visual:
      observations:
      - event_ref: E_ch0140_ワルシューラ_appears_ちびシューラ_p4765
        quote: サイバーカラテを司る小さな妖精、『ちびシューラ』だ。しかし何か様子がおかしい。表情は獰猛で悪辣、目の縁は濃い化粧によって凶悪さを強調されている。
        locator: {}
        spoiler_after: ch0140
    action:
      observations:
      - event_ref: E_ch0140_ワルシューラ_activates_騒乱_p4766
        quote: 「使い魔系呪術【騒乱】でしっちゃかめっちゃかにするよー！」
        locator: {}
        spoiler_after: ch0140
  first_appearance_candidate: true
- canonical_target: '[[E_term_競技場]]'
  entity_type: terminology
  aspects:
    visual:
      observations:
      - event_ref: E_ch0140_競技場_transforms_球形の檻_p4766
        quote: 半球状の競技場が、球形の檻と化していく光景を。第五階層の理が歪み、即時に形成されていく半球状の天蓋。入り口を塞ぎ、逃げ道を閉ざす無数の壁、壁、壁。
        locator: {}
        spoiler_after: ch0140
  first_appearance_candidate: true
- canonical_target: '[[E_char_使い魔]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0140_使い魔_other_アレッテ_p4768
        quote: 人形姫の前に立ちはだかった二つの影によって。一つは血塗れの全身甲冑姿、一つは全身を暗がりに隠した長衣姿。
        locator: {}
        spoiler_after: ch0140
    speech:
      observations:
      - event_ref: E_ch0140_使い魔_says_仲間_p4768
        quote: 「レッテを傷つける奴は」「許さないぞ！」
        locator: {}
        spoiler_after: ch0140
  first_appearance_candidate: true
- canonical_target: '[[E_char_民]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0140_民_other_ガロアンディアン_p4769
        quote: 「かくなる上は、あの女の言うとおりガロアンディアン人どもの血で球神の怒りを静める他ありませぬ！
        locator: {}
        spoiler_after: ch0140
  first_appearance_candidate: true
- canonical_target: '[[E_char_ラクルラール]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0140_ラクルラール_observes_下界_p4772
        quote: 世界を薄いガラスで隔てた高み。高次の世界から下界を見下ろして、一人の男が呟いている。
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_ラクルラール_other_身体_p4777
        quote: 散らばった部品が時間を巻き戻すように人形の欠損を埋め、完全に再生していく。
        locator: {}
        spoiler_after: ch0140
    name:
      observations:
      - event_ref: E_ch0140_ラクルラール_names_前髪_p4773
        quote: 誰が知ろう、彼の名はラクルラールの【前髪】。
        locator: {}
        spoiler_after: ch0140
    speech:
      observations:
      - event_ref: E_ch0140_ラクルラール_other_パーン_p4774
        quote: 「パーン、なるほどそういう役割か。王にして悪漢、偽の英雄。援助者の力を束ねて冒険を制覇する巨人殺し。そして自身もまた援助者である――」
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_ラクルラール_names_代替王権_p4777
        quote: 「なるほど、巨人殺しの冒険者と援助者たち――その銀の腕は【猫の国】で言うところの【代替王権】というわけだ」
        locator: {}
        spoiler_after: ch0140
  first_appearance_candidate: true
- canonical_target: '[[E_item_パーン]]'
  entity_type: item
  aspects:
    action:
      observations:
      - event_ref: E_ch0140_パーン_arrives_高み_p4773
        quote: 銀色の腕がガラス片を撒き散らしながら飛び出してくる。途轍もなく長い義肢だ。藍色の波打つオーラを纏い、『物語のレベル』という断絶を突き抜けて高みへと到達する。
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_パーン_uses_SilverNo.18_p4776
        quote: 「墓の下から甦れ、失われた未来の亡霊よ。Ａｔｔｒｉｂｕｔｅ――［Ｓｉｌｖｅｒ］Ｎｏ．１８」
        locator: {}
        spoiler_after: ch0140
    speech:
      observations:
      - event_ref: E_ch0140_パーン_threatens_ラクルラール_p4774
        quote: 「まず貴様らを駆逐する。駆除が終わった後にはそれなりに盤面が進み、俺に挑むに相応しい者だけが残っていることだろう。
        locator: {}
        spoiler_after: ch0140
      - event_ref: E_ch0140_パーン_other_役割_p4775
        quote: 「――悪いが、そんな呪術に縛られてやるほど大人しい俺ではないぞ！」
        locator: {}
        spoiler_after: ch0140
    visual:
