  mysteries:
  - kind: mystery
    name: MY_神々の図書館の破壊者
    note: ディーテが過去改変の理由として「【神々の図書館】を壊した何者かのせい」と言及しており、その正体と動機が今後の物語の核心となる。
    quotes:
    - quote: 【神々の図書館】を壊した何者かのせい。では、過去に遡って【図書館】を守れば、もっといい未来が実現できるのではないかしら
      paragraph: p3643
    expected_payoff: 過去改変後の章で、図書館を破壊した真犯人（あるいはその意図）が明かされ、主人公たちの敵対関係が再定義される。
  - kind: mystery
    name: MY_アキラの正体と内なる法
    note: ディーテが「アキラ様」と呼びかけ、彼の「内なる法」と「外なる法」による歪みについて言及している。アキラが誰であり、どのような罪や苦痛を抱えているかが不明。
    quotes:
    - quote: ねえ、アキラ様。あなたの『内なる法』は、今もあなたを裁いているのかしら。律しているのかしら。苦しめているのかしら。
      paragraph: p3642
    expected_payoff: アキラが主人公（あるいは重要なキーパーソン）であり、彼の精神的葛藤や過去のトラウマが、このループや世界改変の根本原因であることが判明する。
  - kind: mystery
    name: MY_断章の全容と効果
    note: 九巻本の五巻目「道徳」が登場したが、他の巻（特に前回言及された「愛情」など）の内容や、断章を集めた際の究極的な効果（世界改変の完全なルール）が未だ不明。
    quotes:
    - quote: 前回が『愛情』でしたから、恐らくあちらの手にあるのは『道徳』です。
      paragraph: p3630
    expected_payoff: 他の断章を集める過程で、異なる倫理観や概念が衝突し、世界観のメタ構造がさらに複雑に展開する。
  - kind: mystery
    name: MY_グレンデルヒの真の目的
    note: グレンデルヒは現実主義を装いながら、ディーテによって「破裂」させられている。彼の正体や、なぜディーテが彼を排除したのか、また彼が本当に敵なのか味方なのかの真意が不明。
    quotes:
    - quote: その全身がぶれたかと思うと、次の瞬間には破裂して、無数のがらくたとなって四方八方に散らばっていった。
      paragraph: p3641
    expected_payoff: グレンデルヒが単なる悪役ではなく、物語の構造を維持するための「必要な悪」あるいは「観測者」であったことが示唆される。
  themes:
  - kind: theme
    theme: 言語と権力の不可分性
    weight: 0.9
    quotes:
    - quote: 『言葉』を与え、奪う力。白い亜竜を、神なる権威の下に王たらしめる権力。
      paragraph: p3632
    - quote: 今後、我が王国の秩序を揺るがすような『悪しき言葉』を発した者からは、『言葉』の全てを剥奪する。
      paragraph: p3628
    note: 「言葉」が単なるコミュニケーション手段ではなく、知性、人権、そして統治権そのものとして描かれ、言語支配が政治支配と直結していることを示す。
  - kind: theme
    theme: 内なる法と外なる法の対立
    weight: 0.85
    quotes:
    - quote: 自らが自らを律することができるようになれば、それに勝ることは無いと私は思います。実際に罰や看守がいる必要は無く、架空の規律を誰もが心に抱き、『内なる法』に従って善く生きる。
      paragraph: p3629
    - quote: ああ、けれど、『外なる法』で歪めてしまっているその形を、私はとても愛おしいと、そう思っているんですよ
      paragraph: p3642
    note: アルトが試みた外的強制（外なる法）による秩序維持の失敗と、ディーテが説く自律的倫理（内なる法）の理想、そしてその狭間で歪む人間（あるいは存在）の姿を描く。
  - kind: theme
    theme: 善悪の相対性と鏡像としての他者
    weight: 0.8
    quotes:
    - quote: ダエモデク、お前こそがこの身を律する『内なる法』だったのだな。お前が悪を為すからこそ、俺は正義でいられた。
      paragraph: p3636
    - quote: ダエモデクは、飴をちらつかせることによって民を支配しています。これは彼が誰よりも欲深いために、人は欲に従うのだということを知っているからこそできる行いでしょうね
      paragraph: p3629
    note: 敵対する二人が実は互いを定義し合う「半身」であり、善と悪が対立するのではなく、相互依存する鏡像関係にあることを示す。
  - kind: theme
    theme: メタフィクションとしての時間遡行と救済の虚構性
    weight: 0.75
    quotes:
    - quote: 『そうなるはずだった筋書き』は、ここでは書き換えられる。
      paragraph: p3640
    - quote: さあ、また遡りましょう。この破局はそもそも何が原因なのだったかしら。
      paragraph: p3643
