entities:
- canonical_target: '[[E_char_アズーリア]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0053_アズーリア_remembers_プリエステラとの勉強_p2057
        quote: 呪文にもよく用いられるからとハルベルトに暗記するように言われている。 昨夜も小試験があり、わからないところをこっそりプリエステラ に教えて貰って一緒に怒られたものだ。
        locator: {}
        spoiler_after: ch0053
      - event_ref: E_ch0053_アズーリア_thinks_文芸と芸術_p2059
        quote: どちらかというと私は文芸寄りだ。 今でも基礎物語類型を参照して自動生成された詩や物語を加工しては、文体模写と世界観のコラージュで私なりに編纂したお話を公開しているけれど、ああやって世界の一次的参照から作品を作れる人は凄いと思う。
          ――いや、だから敵を尊敬してどうするんだ私は。
        locator: {}
        spoiler_after: ch0053
      - event_ref: E_ch0053_アズーリア_other_安堵と汚さ_p2071
        quote: 哀れみや同情よりも先に、ひどく浅ましい感情を抱いてしまった。 それは安堵。 私は勝利することができた。英雄と認められたのだという、安心。
          そのことに気がついて、私は自分がひどく汚い人間になってしまったような感覚に囚われた――いいや、元々私はそうだったのだ。
        locator: {}
        spoiler_after: ch0053
      - event_ref: E_ch0053_アズーリア_fears_アキラの答え_p2072
        quote: 彼と話がしたいと強く思い、同時にそれを恐れている自分に気付く。 問いかけたい。 けれど、答えは聞きたくない。 ――ねえ、貴方は今、何を思っているの？
        locator: {}
        spoiler_after: ch0053
      - event_ref: E_ch0053_アズーリア_thinks_アキラへの注釈_p2072
        quote: カインを手にかけたことで錯乱したアキラに、私がフィリスを使ったあの時。 彼が一時的に、どうにか戦えるだけの精神状態に戻れたのは確認した。けれど、本当のところはどうだったのか。そして、今はどうなのか。
          せめて彼の感じている負担が和らげられればと思ってささやかな注釈をつけたりもした。
        locator: {}
        spoiler_after: ch0053
    action:
      observations:
      - event_ref: E_ch0053_アズーリア_uses_魔導書の照明光_p2058
        quote: 私はそれきりガルズの言葉には耳を貸さず、魔導書が生み出す照明光で前方を照らす作業に集中する。
        locator: {}
        spoiler_after: ch0053
  first_appearance_candidate: true
- canonical_target: '[[E_char_ガルズ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0053_ガルズ_asks_黒いアネモネの花言葉_p2057
        quote: 「黒いアネモネの花言葉？」 驚きの余り、思わず聞き返してしまった。 その話題を振ってきたのが、意外な人物だったからということもある。「そうだよ。知っているかな、アズーリア・ヘレゼクシュ」
        locator: {}
        spoiler_after: ch0053
      - event_ref: E_ch0053_ガルズ_remembers_飴玉の贈与_p2060
        quote: 「不思議な気分だよ。小さい頃は僕が飴玉をあげていたのに、今では逆だ」
        locator: {}
        spoiler_after: ch0053
      - event_ref: E_ch0053_ガルズ_says_生理的欲求_p2060
        quote: 「マリー、耐えるんだ。生理的欲求など所詮は死の前ではまやかしでしかない」
        locator: {}
        spoiler_after: ch0053
      - event_ref: E_ch0053_ガルズ_confesses_目的_p2061
        quote: 「僕の目的は宣言した通り、クロウサー家とそれに関連した巨大企業や槍神教の要人たちを殺害することだ」
        locator: {}
        spoiler_after: ch0053
      - event_ref: E_ch0053_ガルズ_says_秩序の破壊_p2061
        quote: 「腐りきった地上の秩序を破壊する為だ」
        locator: {}
        spoiler_after: ch0053
      - event_ref: E_ch0053_ガルズ_confesses_復讐_p2063
        quote: 「これは復讐でもあるんだよ、リーナ。【骨組みの花】が壊滅したのはクロウサー家のせいだ。仲間たちを奴らに殺された僕は、正当な報復を行う」
        locator: {}
        spoiler_after: ch0053
      - event_ref: E_ch0053_ガルズ_says_血族の呪い_p2063
        quote: 「いいかいリーナ。君も理解しているはずだよ。クロウサー家というのは呪いなんだ。血族という巨大な機械。自動的に動き続けるだけの怪物だ。感情はもちろん、知性や理性なども無いから、たとえ身内だろうと平気で圧殺しようとする。僕のようにね」
        locator: {}
        spoiler_after: ch0053
      - event_ref: E_ch0053_ガルズ_says_結婚の自由_p2064
        quote: 「わかっているだろう。クロウサー家に身を置く限り、自由に結婚相手を選ぶ事なんてできないよ。君の母親とて優れた血を取り入れる為だけにアルタネイフの家に入った。そして用が済んだら別の血を宛がわれる。君の新しい父親はエジーメの血族の分家から選ばれたんだったね。
        locator: {}
        spoiler_after: ch0053
      - event_ref: E_ch0053_ガルズ_other_リーナ_p2064
        quote: 「リーナの場合は母胎としての性能を期待されているだろうから、君自身に災厄が降りかかることはそうそう無いだろうけど。何しろ覇王メクセトの血を取り込んだゾラの長子だ。水面下では君を手に入れるべく争いが始まっているはずだ」
        locator: {}
        spoiler_after: ch0053
      - event_ref: E_ch0053_ガルズ_says_死ね_p2065
        quote: 「簡単だよ。死ねと命じられたのさ」
        locator: {}
        spoiler_after: ch0053
      - event_ref: E_ch0053_ガルズ_remembers_父の期待_p2068
        quote: 「そうだ、下らない。けどねリーナ。僕は君と仲良く遊んでいた頃から言い聞かされ続けてきたよ。ゾラには負けてはならない、とね。親の期待に応えるべく必死に努力したけれど、何をやってもまだだと言われた。サイリウス翁――君の曾祖父を超える傑物にならなければ意味がないのだと」
        locator: {}
        spoiler_after: ch0053
      - event_ref: E_ch0053_ガルズ_says_人質_p2068
        quote: 「愚かさの結果として僕たちは無謀な攻略に挑むことになった。全てを捨てて逃げられないように人質までとられていた。
        locator: {}
        spoiler_after: ch0053
      - event_ref: E_ch0053_ガルズ_confesses_敗北と無力_p2071
        quote: 「笑ってくれよ。僕は弱い。復讐をする、地上を浄化すると息巻いておきながら、結局惨めに敗北するだけだ。何もできない。英雄になんてなれやしない」
        locator: {}
        spoiler_after: ch0053
      - event_ref: E_ch0053_ガルズ_says_地上の浄化_p2071
        quote: 「こんな風になってしまっても、マリーはマリーだよ。彼女が生きることが許されない地上なんて滅茶苦茶になってしまえばいい。そう思ったとして、それの何がいけないんだい？
          誰も僕を責めることはできない。何故ならそう仕向けたのは地上だからだ――なんて、思っていたんだけれどね」
        locator: {}
        spoiler_after: ch0053
    visual:
      observations:
      - event_ref: E_ch0053_ガルズ_has_property_拘束状態_p2057
        quote: ガルズ・マウザ・クロウサーは目隠しをされ、両手を後ろでに縛られながらも平然と歩いている。真後ろにいるサリアが短剣で背中を軽く触れさせてもまるで動揺したところがない。
        locator: {}
        spoiler_after: ch0053
    name:
      observations:
      - event_ref: E_ch0053_ガルズ_other_マウザの長子_p2063
        quote: ガルズは四大血族の一つ、マウザの血族の長子だ。 外側にいる誰よりもクロウサー家というものを知る機会に恵まれていた彼は、その内側に蠢く闇を直視してしまったのかもしれない。
        locator: {}
        spoiler_after: ch0053
    action:
      observations:
      - event_ref: E_ch0053_ガルズ_fights_イェレイド_p2069
        quote: 「その後は知っての通り。僕たちは負けた。あの恐ろしい大魔将に――ああ、思い出すのも忌まわしい。
        locator: {}
        spoiler_after: ch0053
      - event_ref: E_ch0053_ガルズ_makes_死霊の幻視_p2070
        quote: 「僕はせめてもの慰めに、死霊を幻視して実体化させた。僕の『死』を見つめる忌まわしい邪視がマリーの心を慰める役に立てばと思ったんだ。浅はかな行動だったと思い知ったよ。僕は傲慢にも死者の言葉を代弁しようとして――かえってマリーの心を傷つけてしまった。
        locator: {}
        spoiler_after: ch0053
  first_appearance_candidate: true
