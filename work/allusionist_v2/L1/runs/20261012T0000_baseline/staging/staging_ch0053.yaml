      observations:
      - event_ref: E_ch0053_リーナ_gives_飴玉_p2060
        quote: 私は飴玉をリーナに渡した。 彼女は「ありがとう！」と笑顔を浮かべてガルズとマリーに近付き、「はい、あーんしてあーん」などと言いつつ飴玉を与える。
