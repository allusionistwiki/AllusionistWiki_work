      - event_ref: E_ch0053_マリー_other_アストラル体の自傷_p2070
        quote: 「マリーの自殺方法はアストラル体の自傷――マリーは自らを苦しめている心だけを砕いたんだ。今のマリーはアストラル体や感覚質の存在しない哲学的ゾンビだ。杖的には生者と変わらないが、邪視や呪文の観点から見れば死者だよ。法的にも異獣と分類されている。
        locator: {}
        spoiler_after: ch0053
  first_appearance_candidate: true
