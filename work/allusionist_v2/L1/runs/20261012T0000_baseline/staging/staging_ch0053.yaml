        quote: 【骨組みの花】――ガルズが率いていた探索者集団。 第六階層で大魔将イェレイドに挑み、ガルズを残して全滅したと言われている。
        locator: {}
        spoiler_after: ch0053
      - event_ref: E_ch0053_骨組みの花_other_無謀な任務_p2066
        quote: 「そこで白羽の矢が立ったのが僕たち【骨組みの花】というわけだ。クロウサー家四大血族が一つ、マウザの長子が率いる四英雄に準ずる探索者集団。なるほど、順当ではあるだろうね。だが余りに無謀だ」
        locator: {}
        spoiler_after: ch0053
  first_appearance_candidate: true
