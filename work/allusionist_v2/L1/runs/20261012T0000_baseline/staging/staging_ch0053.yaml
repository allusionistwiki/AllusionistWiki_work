    action:
      observations:
      - event_ref: E_ch0053_マリー_kills_リオンとギザン_p2069
        quote: イェレイドの『本体』を直視して発狂してしまったリオンを、『端末』に掴まって狂怖に改造されてしまったギザンをマリーは楽にし ホラー てあげた。けれど誰よりも優しかったマリーは、仲間を手にかけた事を深く気に病んでしまったんだ」
        locator: {}
