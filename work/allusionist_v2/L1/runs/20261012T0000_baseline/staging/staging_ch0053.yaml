      observations:
      - event_ref: E_ch0053_クロウサー家_has_property_腐敗の象徴_p2062
        quote: 「あれが腐敗の象徴だからだよ。抑圧と序列化と階層の固定。富を独占し末端の労働者から搾取を続け、労働の場を提供するインフラだと言って憚らない巨大企業群の巨悪ども。政略結婚を繰り返すこ
          メガコーポ とで聖と俗の区別を問わずあらゆる場所に浸透し、政財界に深く食い込んだクロウサー家の毒は地上を汚染している。
        locator: {}
        spoiler_after: ch0053
  first_appearance_candidate: true
- canonical_target: '[[E_term_血統呪術]]'
  entity_type: terminology
  aspects:
    name:
      observations:
      - event_ref: E_ch0053_血統呪術_defines_秩序派と混沌派_p2062
        quote: 血統呪術というものがある。 血にこそ力が宿ると信じるその呪術は、近親婚を繰り返して血の純化を図る【秩序派】と様々な血を取り込む事で呪的性質の多様性を確保できると考える【混沌派】に分かれるが、クロウサー家の血統呪術は【混沌派】である。
        locator: {}
        spoiler_after: ch0053
  first_appearance_candidate: true
