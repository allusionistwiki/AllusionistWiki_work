        quote: 「それって、歴代の当主の眼球を集積させて演算するっていう、あの呪術コンピュータだよね？」 恐らくクロウサー家の機密なのだろう。 何というか、不気味だと思った。眼球でできた機械が、ではない。それを延々と続けているマウザという血族がだ。
