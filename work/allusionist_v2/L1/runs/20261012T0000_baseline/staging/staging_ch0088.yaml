entities:
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0088_アキラ_remembers_前回のあらすじ_p3227
        quote: 折悪しくトリシューラは言語魔術師試験のため単身月へと向かうことに。離ればなれになった二人はそれぞれ危機に陥る。どうにか強敵を退けたアキラだったが、一方でトリシューラは囚われの身となってしまう。
        locator: {}
        spoiler_after: ch0088
      - event_ref: E_ch0088_アキラ_says_トリシューラへの罪悪感_p3228
        quote: 「もう朝か。というか、こんな事をやっていていいのか俺たち。トリシューラは言語魔術師試験だっていうのに」
        locator: {}
        spoiler_after: ch0088
      - event_ref: E_ch0088_アキラ_thinks_徹夜の理由_p3228
        quote: というか寝ていない。 それもこれも、コルセスカに付き合って徹夜でゲームをしていたからである。
        locator: {}
        spoiler_after: ch0088
      - event_ref: E_ch0088_アキラ_other_羞恥の喪失_p3229
        quote: 俺の感情はコルセスカのものだ。だから、何も隠せない。 羞恥すら奪われて、ただただ朝日に輝く異相を見つめることしかできなかった。
        locator: {}
        spoiler_after: ch0088
      - event_ref: E_ch0088_アキラ_thinks_ハルベルトとの対峙_p3230
        quote: トライデントとの戦いで一時共闘ができるとすれば心強いが、いずれ相対しなくてはならないと思うと身が引き締まる思いだった。
        locator: {}
        spoiler_after: ch0088
      - event_ref: E_ch0088_アキラ_learns_左腕の制限解除条件_p3233
        quote: 「その通りです。そして、アキラを支援するガロアンディアンという『王国』の加護が一定まで高まれば、その外で左腕を行使することも不可能ではありません。恐らく、あと二階層分の拡大によって地獄あるいは地上でも全力戦闘が可能になると思います」
        locator: {}
        spoiler_after: ch0088
      - event_ref: E_ch0088_アキラ_thinks_外交の必要性_p3234
        quote: そうした問題を考えると、太陰の王族であるというハルベルトやドラトリアの王族であるリールエルバとの関係性を深める事はやはり必要不可欠なのだ。
          トリシューラが上手くやっていてくれればいいのだが。 俺は外交だとか交渉だとかいった細々とした事はわからないので、こうした実務面は全てトリシューラに委ねるしかない。
          その事が、少しだけ歯痒かった。
        locator: {}
        spoiler_after: ch0088
      - event_ref: E_ch0088_アキラ_thinks_待ち続ける魔女_p3239
        quote: 愚直に誰かを待ち続ける。 放棄された第五階層でひたすらに『約束』を盲信し続けるかつての俺と、その魔女のイメージが重なった。
        locator: {}
        spoiler_after: ch0088
      - event_ref: E_ch0088_アキラ_other_寒邪の影響_p3241
        quote: 感じるのは、冷たさだけ。 コルセスカの傍に一晩中いたことで、その感覚にはすっかり慣れきっていた。 だから気付くのが遅れたのかも知れない。
        locator: {}
        spoiler_after: ch0088
      - event_ref: E_ch0088_アキラ_thinks_カーインとの関係_p3243
        quote: 立場上敵対関係ではなくなり、すっかり馴れ合いめいた空気が生まれてしまってはいる。しかし、こうして明確な借りを作ってしまうのはあまり好ましくないように思えてならない。
        locator: {}
        spoiler_after: ch0088
      - event_ref: E_ch0088_アキラ_other_体調不良の原因_p3244
        quote: トリシューラの不在、内功を無理に使ったことの反動、そしてコルセスカとの長時間の過剰な密着。 これらの積み重ねによって、俺の肉体は限界を迎えてしまった。
        locator: {}
        spoiler_after: ch0088
      - event_ref: E_ch0088_アキラ_other_コルセスカの本性_p3250
        quote: 「全部受け入れる。使い魔になると決めた時から、お互いにそういうことになってただろう。だからいいんだ。俺はコルセスカのそういう所も好ましいと感じている。なら、少なくとも俺の前でだけは自分を責める必要は無い」
        locator: {}
        spoiler_after: ch0088
      - event_ref: E_ch0088_アキラ_thinks_自我の所在_p3251
        quote: 【Ｅ－Ｅ】を失ってもコルセスカが感情を制御してくれて、トリシューラに行動と決断を委ねているからこそ俺はシナモリ・アキラでいられる。 だから俺は何度転生しても、二人がいる限り俺のままだ。
        locator: {}
        spoiler_after: ch0088
      - event_ref: E_ch0088_アキラ_says_生存の必要性_p3252
        quote: 「コルセスカがいないと、生きていけない」 青い目がゆっくりと見開かれていった。 視線が一瞬だけ逸れて、恐る恐る、こちらを窺うように瞳が向けられる。
          目と目が合う。
        locator: {}
        spoiler_after: ch0088
    action:
      observations:
      - event_ref: E_ch0088_アキラ_stops_目覚ましシューラ_p3228
        quote: 目覚ましシューラの頭を軽く叩いてアラームを停止させる。
        locator: {}
        spoiler_after: ch0088
      - event_ref: E_ch0088_アキラ_other_体調不良_p3240
        quote: ぐらり、と視界が傾いだ。 床を踏みしめる足が正しく前に運ばれていくという感覚が消失して、全身を襲う倦怠感のようなもので意識が朦朧としていく。
          身体の自由の一切が失われて、受け身もとれずにその場に倒れ込んだ。
        locator: {}
        spoiler_after: ch0088
    visual:
      observations:
      - event_ref: E_ch0088_アキラ_observes_コルセスカとの密着_p3229
        quote: 寝台で二人寄り添って、携帯型ゲーム機の画面を覗き込んでいる一晩だった。 だらだらと、不健康に菓子だの茶だのを飲み食いしながら密着してひたすら遊び倒すだけ。
        locator: {}
        spoiler_after: ch0088
      - event_ref: E_ch0088_アキラ_observes_コルセスカとディスマーテルの類似_p3248
        quote: 瞬間、コルセスカに違う魔女の姿が重なった。 蜂蜜色の髪と灰色の瞳、死したる屍と生ける美貌の魔女。 白銀の髪、青の瞳、氷の義眼と煌めく美貌――似ていない、ようでいて、よく見ればどことなく顔立ちの雰囲気に共通点があるような気がしてくる。
        locator: {}
        spoiler_after: ch0088
    relationship:
      observations:
      - event_ref: E_ch0088_アキラ_bonds_コルセスカ_p3234
        quote: 俺たちは感情を共有して、目的を共有している。たとえ本来は競い合い、排除し合わなくてはならないのだとしても構わない。 トリシューラとコルセスカの力になる。
          それが俺の、そして二人の望みだ。
        locator: {}
        spoiler_after: ch0088
  first_appearance_candidate: true
