  first_appearance_candidate: true
- canonical_target: '[[E_char_セロナ・ハーヴェスト]]'
  entity_type: character
  aspects:
    relationship:
      observations:
      - event_ref: E_ch0236_セロナ・ハーヴェスト_other_ガリヨンテの鎌_p7737
        quote: 飛行船の主はセロナ・ハーヴェスト。迷宮の遺品と盗品を漁って売りさばくならず者たちの長は、船内に設えられた応接室の中央で大きく息を吸った。
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_セロナ・ハーヴェスト_other_盗賊王_p7738
        quote: 男は地上の英雄として名高い『盗賊王』を構成する歯車のひとつ。 無法者の六化身からなる『新しき神』である。
        locator: {}
        spoiler_after: ch0236
    visual:
      observations:
      - event_ref: E_ch0236_セロナ・ハーヴェスト_wears_クリーム色のストール_p7737
        quote: ゆったりとしたシルエットのクリーム色のストールの内側で、細いなで肩がひどく縮こまって見えた。この青年は機械女王が用意した『護衛』である獅子や豹といった猫科魔獣に常に囲まれている。
        locator: {}
        spoiler_after: ch0236
    symbolic:
      observations:
      - event_ref: E_ch0236_セロナ・ハーヴェスト_has_property_植物に近い性質_p7738
        quote: 植物に近い性質を有するセロナの精神が揺らぐのは、同格以上の超越者と相対した時のみである。
        locator: {}
        spoiler_after: ch0236
    speech:
      observations:
      - event_ref: E_ch0236_セロナ・ハーヴェスト_asks_道を譲る_p7739
        quote: 「仰る通り、僕の望みはあくまでも対話と取引です。ですからマダム、どうか道を譲っていただけませんか。我々とガロアンディアンの亀裂が致命的なものになる前に、機械女王との対話によってこの状況を平和裏に解決したいのです。僕ならば『あの方』と直接交渉してお諌めすることができる。問題の解決をお約束します」
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_セロナ・ハーヴェスト_says_死神様の代用品_p7741
        quote: 「言っておきますが、僕を殺す価値はありませんよ、キュトスの魔女。あの方にとって、僕たちはしょせん死神様の代用品に過ぎません」
        locator: {}
        spoiler_after: ch0236
    action:
      observations:
      - event_ref: E_ch0236_セロナ・ハーヴェスト_wounds_両目_p7740
        quote: 出し抜けに、セロナ・ハーヴェストの両目から血の涙が流れ落ちた。 文字通りの意味で目にも留まらぬ攻防。現実改変前の段階で、不可視の邪視戦闘が決着したのだ。
        locator: {}
        spoiler_after: ch0236
  first_appearance_candidate: true
- canonical_target: '[[E_item_飛行船群]]'
  entity_type: item
  aspects:
    visual:
      observations:
      - event_ref: E_ch0236_飛行船群_is_located_第五階層上空_p7737
        quote: 第五階層の上空に、虚飾の風が吹く。 人々が見上げるテキストベース・サーキットよりも更なる高みに浮かぶ大小の飛行船。
        locator: {}
        spoiler_after: ch0236
  first_appearance_candidate: true
- canonical_target: '[[E_char_クレアノーズ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0236_クレアノーズ_appears_as_白骨死体_p7738
        quote: テーブルの向こう、ソファに腰かけた白骨死体が喋っている。 きらびやかな衣装を纏った、貴婦人とでも形容すべき恰好の再生者だ。 赤の義眼、灰のウィッグ、右の背からは銀の片翼。
        locator: {}
        spoiler_after: ch0236
    action:
      observations:
      - event_ref: E_ch0236_クレアノーズ_makes_即席の箱庭_p7738
        quote: 玩具は生きているかのように鼻を巡らせ、水を噴き上げ雲と虹を作り出した。 中空に生まれた即席の箱庭で、雲を渡る翼人と虹を駆ける犬が稲光を追って競い合う。
          全ては幻だ。儚い楽園を、骨の手がぐしゃりと握り潰した。
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_kills_獅子_p7740
        quote: ぐしゃり、と鮮血が飛び散った。 一体の獅子が再生者の細い手で舌を引き抜かれたのだ。 喉を鳴らすように吼えた魔獣は、口の中から血と一緒に燃えかけの人参をごろりと吐き出して絶命した。
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_uses_林檎榴弾_p7740
        quote: 呪石義眼は呪具使いが用いる伝詞演算装置としての宝珠を邪視者向けにチューンナップしたものだ。『セレスティアルゲイズ』が誇る傑作機として名高い『林檎榴弾』はコルセスカが使用する巨大義眼ほどではないが、前世代のハイエンド品である。
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_makes_簡易浄界_p7742
        quote: 言いながら、魔女は呪力の無菌室とでも呼ぶべき真空地帯を呪った。 構築されたのは簡易浄界。邪視の奥義を発動させるための前段階とも呼べる基本的な結界術だが、その手並みは鮮やかの一言に尽きた。
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_observes_空使いレース_p7754
        quote: 奇術のように魔女の掌に現れた魔導書端末が開かれて、空中に幻像を投影した。 魔女は監視用の水晶や使い魔の目を通して、何らかの異常を検知したのだ。
          表示された複数の窓に、遥か下の市街地の光景が映し出される。
        locator: {}
        spoiler_after: ch0236
    speech:
      observations:
      - event_ref: E_ch0236_クレアノーズ_says_囮_p7738
        quote: 「要するに囮よね。お前たち『ガリヨンテの鎌』にかまけている間に他の五人が仕込みを終える。ことが終わった後でも、ここは交渉の窓口にすればいい」
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_threatens_セロナ・ハーヴェスト_p7739
        quote: 「差し出がましいようですが、少々過保護なのでは？」 軽めの牽制に、強烈な悪意の反撃。 白骨死体から匂い立つのは死臭ではない。 『殺す』という臭気だ。
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_says_楽園願望_p7740
        quote: 「間違った前提から導かれるのは間違った結論だけ。同じように、偽りの神から生まれるのは偽りの世界だけ。穢れたこの世界を祓い清め、浄化された世界を創造する。『ここではないどこか』を求める楽園願望こそが邪視の根幹。
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_says_ハグレス_p7741
        quote: 「敗北した偽神。惨めなハグレス、お前は前提の矛盾に気付きながら止まることができない。価値に飢えるばかりの醜態を、せめて私が蔑んであげましょう」
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_says_シスター・コンプレックス_p7742
        quote: 「私はね、末妹候補であるトリシューラたちや予備候補であるリーナたちも含めた姉妹たちがだーい好きな、度を越したシスター・コンプレックスってだけ」
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_says_反撃者_p7742
        quote: 「守護の九姉と私は違う。たとえ姉妹が皆殺しにされても、この怒りを絶やすことだけはできない。悪意を遮る守り手ではなく、支配と従属への抵抗を示す反撃者こそが私の役目よ。理解なさい、私やトリシューラはお前ごときの恫喝には屈しない」
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_names_クレアノーズ_p7745
        quote: 「私の名はクレアノーズよ。姉妹の十一女としても、末妹選定の発案者のひとりとしても、これ以上の横槍は敵対と見なす」
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_says_六つの呪詛_p7746
        quote: 「死神の腕、弱者の盗人、刈り取る者、猫の死、こぼれない鎌、外れない矢」 クレアノーズが並べた六つの呪詛が、調子のいい戯言を中断させた。
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_says_ハグレスの正体_p7747
        quote: 「シェロン、クラララリア、ティーアードゥ、ダーカンシェル、ラウス、そしてレメス。いずれの神話も賞味期限切れ。全盛期を過ぎた今のお前は正統な紀神としての格を保つことさえ出来ていない。『静謐』で解体するまでもない要介護老人。歴史の敗残者のゴミ捨て場。それがお前の正体よ、ハグレス」
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_asks_退避_p7748
        quote: 「この祝祭が引き起こす激流と災禍に、既にお前の神格では耐えきれない。手遅れになる前に一時的にでもいいから退避しなさい。七つの風と双銃を『塔』に返還すれば、私の名において代替信仰圏を用意するわ。教団と奉仕種族のあてもある。他に望みがあれば」
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_says_小物の神_p7750
        quote: 荒くれたちが崇める武神が理知的ではありえないように、盗賊たちの神が超越的な振る舞いをするはずもない。狡賢く卑しい、欲望に忠実な俗物。正しい道からはみ出した世界の敗北者。ハグレスはそうした者たちを肯定する、言ってしまえば『小物の神』なのだ。
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_says_ユディーア_p7751
        quote: 「系譜から考えれば、次のお目当てはユディーアよね？ ジュティアとミナに渡した銀貨から因果を辿るつもりでしょうけど、やめておいた方が賢明ね。残念だけど、亜竜王の遠い娘は私の妹候補よ。これ以上の干渉は許さない」
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_says_レナリア_p7751
        quote: 「それに関しては、既に手を打ってあるわ。ユディーアはいま、とても不安定な運命の渦中に放り込まれている。当然そこには都市の中心が現れるわよね？
          都市の法はあらゆる無法を許さない。今のお前が虜囚の身に等しいように」
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_other_取引_p7752
        quote: 「次はお前よ。その器が藍天主の片割れと同じ商売の悪魔である以上、この私といえども封じるのは少々手間がかかる。だから取引しましょう」
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_asks_兵力_p7753
        quote: 「お前たち『ガリヨンテの鎌』の兵力を、私が買いましょう。ハグレスはもちろん邪魔だけど、それ以外の問題に対処するための手が足りないの」
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_suspects_ノゴルオゴルオ_p7756
        quote: 「ノゴルオゴルオの手にしては少し迂遠ね。スーリウム配下の呪文使い？ この段階で『上』に仕掛けを打つ勢力が他にも？」
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_asks_タマラ_p7757
        quote: 「タマラ、犬の尖兵は？」「本日は雲ひとつない快晴、絵本の虹はまだ架かっておりません。おねむの時間まではまだまだありますわよ。わたくし少しばかり退屈になってきたのでその辺の雲にお宝を隠してもよろしいでしょうか。つきましてはわんちゃんの大好きな骨ガムと骨クッキーを作るためにお姉さまの指先をちょいと拝借」「先に夢界で準備だけしておいて。流れ次第だけど、もしかすると私はそちらにまで手が回らないかもしれない」
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_says_破滅の炎_p7758
        quote: 「七つの風を掌握し、七日目を乗り越えられるのか。だとしても、八日目に訪れる破滅の炎と九日目に再臨する絶対者の瞳だけは逃れることがかなわない」
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_says_ノアズアーク_p7759
        quote: 「間に合わなければ、第五階層は世界を喰らう風と火の波濤に沈むことになる。アララトの頂きさえ乗り越えられる、巨大な方舟と次元を超えて吹く風が必要よ」
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_says_末妹選定_p7759
        quote: 「ハグレスは奪い合う生存競争を肯定したけれど、そこには先がない。男だとか女だとかの象徴を破壊と創造になぞらえることさえ言葉の陥穽に足をとられている。競い合うことをゼロサムゲームとして捉えている限り、勝利という限界が定められてしまうからよ。だからこそ、末妹選定は潰し合いであってはならない。このレースも同じこと」
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_says_シナモリアキラ_p7760
        quote: 「シナモリアキラ、わかっているわね？ お前に課せられた七番目の魔女の指令は、この空と風の掌握ではない。お前なりの認識と理解よ」
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_クレアノーズ_says_末妹選定_p7761
        quote: 「冥道の先に、産道が開く。転生を経た心臓は鼓動を始めるでしょう。もはや神にさえ止めることはできない。選定のレースは、ここに幕を開けた」
          敵意を込めて殴りつけるように。 激情によって不完全な神に祈るように。 矛盾に満ちた天使の翼から、銀色の羽が零れ落ちた。「末妹選定は、ここから始まる」
        locator: {}
        spoiler_after: ch0236
    relationship:
      observations:
      - event_ref: E_ch0236_クレアノーズ_other_結界の六十二妹_p7745
        quote: 結界の六十二妹と呼ばれる大多数の魔女たちの中核であり、『姉』たちが不在時にはその代行を務めるという有力者のひとり。
        locator: {}
        spoiler_after: ch0236
  first_appearance_candidate: true
- canonical_target: '[[E_char_ハグレス]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0236_ハグレス_appears_セロナのアストラル体_p7743
        quote: 再生者の頭蓋骨が、微塵に砕け散った。 赤い義眼は精緻な世界観ごと強引に打ち破られて機能を完全に停止している。 あまりにも暴力的な呪詛。空間を削り取った念動力は不可視ながらも誇示するような荒々しさで破壊という結果をもたらした。
        locator: {}
        spoiler_after: ch0236
    speech:
      observations:
      - event_ref: E_ch0236_ハグレス_says_クレア_p7743
        quote: 「知らないうちに空虚大公なんて大げさな名前で呼ばれるようになっちゃって、少し気が大きくなってるのかな、かわいいクレア」
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_ハグレス_says_英雄譚_p7747
        quote: 「クレアノーズ。不死なる女神の欠片がそれを言うのかい？ 老いた者は消えてしまえと、そんな残酷なことを？ あの輝かしい日々を諦めろと？
          やめてくれよ。僕たちはまだ誰も諦めていないんだ。弟子、残滓、眷属、子孫、息子、娘。続く希望は残された。僕の中ではまだ何も終わっていない。もう一度、僕らの英雄譚を始めたいのさ」
        locator: {}
        spoiler_after: ch0236
      - event_ref: E_ch0236_ハグレス_says_トロフィー_p7749
        quote: 「返還？ 馬鹿を言え、勝ち取ったんだよ、強者の特権として！ それこそが英雄の力、勝利者の栄誉！ 女よ、男たちが競い合い、勝利し、全てを奪うことを否定するな！
          僕と下界の世界観は一致している。これは合意に基づく神の支配だ！」
        locator: {}
        spoiler_after: ch0236
  first_appearance_candidate: true
- canonical_target: '[[E_char_羊人]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0236_羊人_other_目覚めよ_p7755
        quote: 赤子のように無垢で純粋な羊人の瞳が、それを捉えた。『目覚めよ』 なるほど、それは都市という森にありふれた木の葉だった。 広告を伝達するための単純なツール。チラシである。
        locator: {}
        spoiler_after: ch0236
  first_appearance_candidate: true
- canonical_target: '[[E_char_メナル人]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0236_メナル人_other_目覚めよ_p7756
        quote: 『目覚めよ』 大量の広告に紛れ、見知らぬアドレスから端末に送られてきたメッセージ。 諦観に曇った老いた瞳が、その呪文を捉えた。 ささやかな、けれど重大な異変。
        locator: {}
        spoiler_after: ch0236
  first_appearance_candidate: true
