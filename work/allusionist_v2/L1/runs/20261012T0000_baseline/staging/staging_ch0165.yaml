    speech:
      observations:
      - event_ref: E_ch0165_ヒュドラボルテージ_names_ミルーニャ_p5557
        quote: ミルーニャこそメクセトの名を継ぐ真なる中原の覇王であると。
        locator: {}
        spoiler_after: ch0165
      - event_ref: E_ch0165_ヒュドラボルテージ_has_property_太陽核の欠損_p5558
        quote: 彼の心臓部である『太陽核』と呼ばれるコアユニットが『リールエルバ』を名乗る魔女に盗まれ、最下層に隔離されてしまったから、だそうだ。
        locator: {}
        spoiler_after: ch0165
      - event_ref: E_ch0165_ヒュドラボルテージ_defines_時間の加速装置_p5561
        quote: 「で、その元になったのが『氷血のコルセスカ』と『炎冠のヒュドラボルテージ』なわけ。コアちゃんが減速、ヒュドちゃんが加速ね」
        locator: {}
        spoiler_after: ch0165
      - event_ref: E_ch0165_ヒュドラボルテージ_has_property_疑似太陽化_p5562
        quote: 使ったが最後、持ち主の命を燃やし尽くしながら小型の 熱核融合炉となり、周囲の全てを焼き尽くす疑似太陽と化す――とかなんとか」
        locator: {}
        spoiler_after: ch0165
