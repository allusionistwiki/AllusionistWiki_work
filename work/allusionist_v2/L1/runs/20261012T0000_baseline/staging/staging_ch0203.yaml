      - event_ref: E_ch0203_男_dies_自害と証拠隠滅_p6817
        quote: 灰色の『窓』が開こうとしたその瞬間、死にかけの男が奥歯で何かを噛み潰す。灰色の彩域が歪む。時空が早回しで進み、男が急速に老けていったかと思うと朽ち果てる。骨と皮ばかりの老人から風化した白骨死体、最後は風に舞う塵に。
        locator: {}
        spoiler_after: ch0203
    speech:
      observations:
      - event_ref: E_ch0203_男_says_霊媒増加への歓迎_p6813
        quote: 「なんだこいつも竜の巫女か。質のいい霊媒が増えて助かるぜ。ボスも喜ぶ」
        locator: {}
        spoiler_after: ch0203
  first_appearance_candidate: true
