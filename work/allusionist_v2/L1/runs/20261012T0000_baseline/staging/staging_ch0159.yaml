- canonical_target: '[[E_char_イアテム]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0159_イアテム_betrays_ヴァージル_p5406
        quote: 「我に貴様を助けろだと？ 馬鹿を言え。貴様が劣勢に置かれた今こそ千載一遇の好機。忌まわしい支配を断ち切り、弱った貴様の首を討ち取らせて貰う」
        locator: {}
        spoiler_after: ch0159
      - event_ref: E_ch0159_イアテム_kills_マイカールの家族_p5410
        quote: 族誅呪術が三親等以内の血縁へと触手を伸ばし、イアテムの呪力が『地上』と『槍神教』という絶対的加護を突破してマイカールの家族を虐殺する。
        locator: {}
        spoiler_after: ch0159
    symbolic:
      observations:
      - event_ref: E_ch0159_イアテム_uses_男根_p5409
        quote: 仲間たちからの男根コールにより存在しない男根が世界に幻視され、『雄々しい』『立派』『見事』と褒めそやされる度にイアテムは男性としての自信を取り戻していく。
        locator: {}
        spoiler_after: ch0159
    speech:
      observations:
      - event_ref: E_ch0159_イアテム_asks_ファル_p5419
        quote: 「癪に障るがやむを得まい。そこの中傷者、セージを頼むぞ」
        locator: {}
        spoiler_after: ch0159
  first_appearance_candidate: true
- canonical_target: '[[E_char_マイカール]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0159_マイカール_attacks_イアテム_p5407
        quote: 「強がりはよせ。無理をする必要は無い。勇者だ何だと言ってもお前は可哀相な傷病者でしかないのだ。跪き、媚びを売り、我が贖罪に感激してこの罪深き身を許すがいい。」
        locator: {}
        spoiler_after: ch0159
  first_appearance_candidate: true
