- canonical_target: '[[E_char_ミシャルヒ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0159_ミシャルヒ_appears_パーン_p5423
        quote: 「動けるか、パーン」「気配は感じていたが、まさか本当にお前だったとは。変わらないな、ミシャルヒ」
        locator: {}
        spoiler_after: ch0159
    speech:
      observations:
      - event_ref: E_ch0159_ミシャルヒ_other_二重存在_p5424
        quote: 「完全に同一だからな。実際の所、奴の目的が『六王を取り込む』ことであるとすればそれを達成されている。もう一人のお前は確かに死に、奪われたのだ」
        locator: {}
        spoiler_after: ch0159
