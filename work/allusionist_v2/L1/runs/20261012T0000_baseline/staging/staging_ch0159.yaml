- canonical_target: '[[E_char_アルト・イヴニル]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0159_アルト・イヴニル_kills_パーン_p5415
        quote: 幼い胸が血を吹き出し、細い手が心臓ごとパーンの魂を貫き砕いた。
        locator: {}
        spoiler_after: ch0159
      - event_ref: E_ch0159_アルト・イヴニル_takes_断章_p5416
        quote: 「断章は得た。門番の権能もまたこの手に――これで冥道は私のもの」
        locator: {}
        spoiler_after: ch0159
      - event_ref: E_ch0159_アルト・イヴニル_other_青い糸_p5422
        quote: 出し抜けに骨剣が振るわれた。青い糸が切断され、束の間だけ人形は糸から解放される。
        locator: {}
        spoiler_after: ch0159
    visual:
      observations:
      - event_ref: E_ch0159_アルト・イヴニル_transforms_右腕_p5417
        quote: 人形の腕を『創造』のクラフト光が覆い、機械的な鎧のような装甲が追加されていく。変化は構造そのものにも及び、アルトの右腕は関節を無数に持つ長い義肢へと作り替えられた。
        locator: {}
        spoiler_after: ch0159
