        spoiler_after: ch0086
      - event_ref: E_ch0086_コルセスカ_names_初恋の人_p3194
        quote: 「まず、この人が私の初恋の人で、最初の恋人です」
        locator: {}
        spoiler_after: ch0086
      - event_ref: E_ch0086_コルセスカ_reveals_ゲームの恋人_p3194
        quote: 「けっこう古いゲームなんですけど、かなり流行ったんですよ。内部でも時間が流れてて、ずっと放置してると拗ねちゃったりとか――ほら、立体幻像をタッチすると色々台詞とか喋ってくれて、中には際どい」
        locator: {}
        spoiler_after: ch0086
      - event_ref: E_ch0086_コルセスカ_defines_現実とゲームの等価値_p3195
        quote: 「そもそも現実の男性とゲーム内の男性との間に優劣はありません。もちろん女性にも。ああ、選択肢次第で性別を選べるキャラもいましたね」
        locator: {}
        spoiler_after: ch0086
      - event_ref: E_ch0086_コルセスカ_promises_ゲームの共有_p3195
        quote: 「私の経験は全部共有してもらいます。トリシューラもいないことですし、徹夜で一緒にプレイしましょう。面白さは保証するので！ 絶対楽しいので！
          是非！」
        locator: {}
        spoiler_after: ch0086
      - event_ref: E_ch0086_コルセスカ_asks_アキラ_p3197
        quote: 「それは」「大人がするようなこと。私と、して下さい」
        locator: {}
        spoiler_after: ch0086
      - event_ref: E_ch0086_コルセスカ_confesses_大人への拒絶_p3197
        quote: 「いいじゃないですか。遊べなくなるくらいなら、私はもう子供のままでいいです――子供のままがいいです。それが許されなくても、間違っていても、幼稚さにしがみつくことが、私は止められません。
        locator: {}
        spoiler_after: ch0086
      - event_ref: E_ch0086_コルセスカ_flees_アキラ_p3201
        quote: 「だだだだ駄目です！ まだ出会って三ヶ月しか経ってません！ 一年、最低でも一年はじっくりとお互いを知ってから――！」
        locator: {}
        spoiler_after: ch0086
      - event_ref: E_ch0086_コルセスカ_other_サイバーカラテ_p3202
        quote: 「駄目！ それは駄目です！ サイバーカラテユーザーの思考をゲームに持ち込まないで下さい！ 身一つで体当たりするのが私のプレイスタイル！」
        locator: {}
        spoiler_after: ch0086
