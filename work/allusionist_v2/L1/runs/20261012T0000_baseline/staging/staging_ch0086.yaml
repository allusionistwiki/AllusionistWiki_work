        spoiler_after: ch0086
      - event_ref: E_ch0086_ヴィク_activates_ステュクス_p3175
        quote: 「己の甘さを悔い、苦しむといいでしょう。第一浄界――【ステュクス】」 強化外骨格の背後に異形の世界が顕現する。
        locator: {}
        spoiler_after: ch0086
      - event_ref: E_ch0086_ヴィク_other_古き神_p3176
