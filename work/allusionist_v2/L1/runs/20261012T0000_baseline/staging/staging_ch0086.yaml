- canonical_target: '[[E_char_ヴィク]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0086_ヴィク_appears_アキラ_p3158
        quote: 「苦痛に歪む顔が好き。自省を怖がる表情が可愛らしい。歩いてきた道を恐る恐る振り返るような自信の無さが愛おしくてたまらない。自分ではないものに拠り所を求めようとする弱さを抱きしめてあげたい」
