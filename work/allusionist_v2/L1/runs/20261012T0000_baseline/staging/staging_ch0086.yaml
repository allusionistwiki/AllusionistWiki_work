        spoiler_after: ch0086
      - event_ref: E_ch0086_ヴィク_activates_鎧骨弐式_p3173
        quote: 装着――【鎧骨弐式】 骨の渦の中から、異形の鎧を纏った魔女が姿を現す。 それは文字通りの外骨格だった。
