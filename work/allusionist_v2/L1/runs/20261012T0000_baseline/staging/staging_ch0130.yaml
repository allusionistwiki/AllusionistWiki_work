- canonical_target: '[[E_char_カーイン]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0130_カーイン_attacks_イアテム_p4494
        quote: 音もなくイアテムの背後に回り込んでいたカーインが、槍のように貫手を放つ。分厚い筋肉質の背中、脊髄に近い箇所にめり込んだ指先がごり、と抉られて、イアテムが背筋を反らせた。
        locator: {}
        spoiler_after: ch0130
      - event_ref: E_ch0130_カーイン_attacks_セージ_p4510
        quote: 残像を生むほどの速度でセージの全身を立て続けに指先で突いていく。点穴は僅かでも誤差があれば成功しない、精密さを要求される技術だ。
        locator: {}
        spoiler_after: ch0130
    speech:
      observations:
      - event_ref: E_ch0130_カーイン_thinks_宿命_p4495
        quote: 「それでいい。所詮、生まれという呪縛から自由にはなれぬものだ。ならばせめて、宿命を楽しむのも一興」
        locator: {}
        spoiler_after: ch0130
    relationship:
      observations:
      - event_ref: E_ch0130_カーイン_fears_レオ_p4510
        quote: 花のような笑顔を向ける主を、カーインは恐ろしいものを見たような目で凝視していた。それこそ先程の古き神にも向けないような恐怖の視線だ。
        locator: {}
        spoiler_after: ch0130
