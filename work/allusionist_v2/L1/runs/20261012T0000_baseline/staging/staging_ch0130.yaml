- canonical_target: '[[E_char_ブウテト]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0130_ブウテト_says_信仰の修正要求_p4489
        quote: 「ぶうぶう。彼らのハザーリャ解釈は、リザが女王だった最悪の時代と同じ悪しき信仰ぶひ。ヒュールサスの退廃をもう一度引き起こすわけにはいかないですぶう。信仰を捨てるか、信仰を周囲に害を与えない形に修正するかしてくれないと共存は無理だぶう」
        locator: {}
        spoiler_after: ch0130
    visual:
      observations:
      - event_ref: E_ch0130_ブウテト_transforms_雌豚_p4512
        quote: 「ぶう」そこに豚がいた。豚鼻の美しい女王ではない。雌の豚である。丸々とした四足歩行の豚が蹄をとことこと鳴らしてこちらに近付いて来ていた。
        locator: {}
        spoiler_after: ch0130
  first_appearance_candidate: true
- canonical_target: '[[E_char_セージ]]'
  entity_type: character
  aspects:
