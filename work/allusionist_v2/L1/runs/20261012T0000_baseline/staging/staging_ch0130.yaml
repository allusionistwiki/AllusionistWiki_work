      observations:
      - event_ref: E_ch0130_セージ_appears_上空_p4491
        quote: 蝶の翅を背に広げ、上空に浮かぶ闇妖精。少女趣味のワンピースを着て大きな熊のぬいぐるみを抱き抱えた女の子が、周囲で海水を流動させながら言った。
        locator: {}
        spoiler_after: ch0130
    speech:
      observations:
      - event_ref: E_ch0130_セージ_says_カーインへの殺意_p4495
        quote: 「ご、ごめんなさい。いつもレオくんと一緒で羨ましいから消えろって思うし絶好の機会って感じだけどレオくんに悪く思われたくないから不本意だけど謝るフリくらいはしとくし。でもカーイン死ねばいい」
        locator: {}
        spoiler_after: ch0130
    action:
      observations:
      - event_ref: E_ch0130_セージ_other_デーデェイア_p4498
        quote: 「我が祖は人魚、異教の悪魔に捧げられるべき忌まわしき贄！　まことの名を【海雌豚】！　貪られるべき供物なり！」
        locator: {}
        spoiler_after: ch0130
  first_appearance_candidate: true
