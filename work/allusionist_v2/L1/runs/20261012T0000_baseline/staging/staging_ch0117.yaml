  entity_type: terminology
  aspects:
    visual:
      observations:
      - event_ref: E_ch0117_トリシューラ_appears_as_残骸_p4093
        quote: 有り体に言って、今のトリシューラは残骸だ。
        locator: {}
        spoiler_after: ch0117
    symbolic:
      observations:
      - event_ref: E_ch0117_トリシューラ_has_property_生贄貯蔵庫リンク_p4093
        quote: トリシューラの体内に構築された【扉】は巡槍艦の生贄貯蔵庫と繋がっており、アンドロイドの魔女はそこから呪力供給を受けることで活動している。
        locator: {}
        spoiler_after: ch0117
    action:
      observations:
      - event_ref: E_ch0117_トリシューラ_transforms_肉塊_p4094
        quote: 溢れる鮮血が流動し、蠢き、厚みを持って肉塊となる。それらはトリシューラの機械の身体と一つに融け合い、生物とも機械とも言い難い異形へと変質させていた。
        locator: {}
        spoiler_after: ch0117
      - event_ref: E_ch0117_トリシューラ_thinks_アキラとの関係_p4101
        quote: つい最近も、同じようなことがあった。あれは、シナモリアキラに拒絶されて、存在が窮地に追い込まれた時のこと。
        locator: {}
        spoiler_after: ch0117
      - event_ref: E_ch0117_トリシューラ_remembers_九姉の呪い_p4102
        quote: 守護の九姉――その中の八人がそれぞれの呪いを新たなる末妹候補に与えて彼女は生誕した。
        locator: {}
        spoiler_after: ch0117
      - event_ref: E_ch0117_トリシューラ_remembers_偽物の叫び_p4104
        quote: 違う、私が負けるはず無い、私は偽物なんかじゃない！ どうして？ どうしてお前などが『本物』なのよ。
        locator: {}
        spoiler_after: ch0117
      - event_ref: E_ch0117_トリシューラ_other_上位の存在_p4107
        quote: 無限に引き延ばされた時間の中で、巨大な歯車が出現して回り出す。文字盤が九つという奇妙な時計。
        locator: {}
        spoiler_after: ch0117
    speech:
      observations:
      - event_ref: E_ch0117_トリシューラ_says_有機物と機械_p4095
        quote: 私に言わせれば、有機物だって機械だよ――けれど貴方にとっては違う。これらの、生贄として捧げられた動物たちの血肉は神に与えられた神聖な自然物。だから貴方の世界観ではこの守りは貫けない。
        locator: {}
        spoiler_after: ch0117
      - event_ref: E_ch0117_トリシューラ_says_進歩の必要性_p4097
        quote: それにそんなことを言っていたら、進歩なんてできやしな――ぐっ
        locator: {}
        spoiler_after: ch0117
      - event_ref: E_ch0117_トリシューラ_reveals_ネドラドの出自_p4098
        quote: 純粋な霊長類じゃなくて、空の民との混血か、第一位の守護天使の加護を拒絶して後天的に霊長類になったんじゃない？
        locator: {}
        spoiler_after: ch0117
      - event_ref: E_ch0117_トリシューラ_other_ネドラド_p4100
        quote: それで寂しくて屍体ババアと赤ちゃんプレイしたくなったのかな。つまり貴方ってママとセックスしたい人だよね
        locator: {}
        spoiler_after: ch0117
      - event_ref: E_ch0117_トリシューラ_remembers_アーザノエルの落とし子_p4103
        quote: 忌まわしいアーザノエルの落とし子め。庇護者たるクレアノーズでさえ、星見の塔において忌み嫌われているその呼び名こそがトリシューラの『まことの姿』だと語る。
        locator: {}
        spoiler_after: ch0117
      - event_ref: E_ch0117_トリシューラ_says_アッシアー_p4108
        quote: 「アッシアー」 言葉はそれだけ。
        locator: {}
        spoiler_after: ch0117
      - event_ref: E_ch0117_トリシューラ_says_嫌い_p4117
        quote: それはそれとして、やっぱり私、貴方が嫌いみたい
        locator: {}
        spoiler_after: ch0117
      - event_ref: E_ch0117_トリシューラ_says_決まり文句_p4119
        quote: 『わたしはみんなであってみんなじゃない。みんなはわたしであってわたしじゃない』
        locator: {}
        spoiler_after: ch0117
      - event_ref: E_ch0117_トリシューラ_says_融血呪_p4120
        quote: 私が使うのは融血呪じゃないんだよ」「安心するな馬鹿。鮮血呪は、黒血呪の裏返しだっていうのに。
        locator: {}
        spoiler_after: ch0117
  first_appearance_candidate: true
- canonical_target: '[[E_char_ネドラド]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0117_ネドラド_attacks_トリシューラ_p4093
        quote: 男の拳が振るわれるたび、真っ赤な鮮血が飛散していった。
        locator: {}
        spoiler_after: ch0117
      - event_ref: E_ch0117_ネドラド_thinks_即殺の失敗_p4095
        quote: そもそも、時間を与えてしまったのが間違いだったのだとネドラドは思う。後になって考えても仕方が無いが、やはり即座に殺しておくべきだったのだ。
        locator: {}
        spoiler_after: ch0117
      - event_ref: E_ch0117_ネドラド_activates_波動_p4099
        quote: 高まった戦意が可視化されて藍色の光となる。その輝きは波動と呼ばれる種類の呪力だった。
        locator: {}
        spoiler_after: ch0117
      - event_ref: E_ch0117_ネドラド_uses_神焔返還_p4100
        quote: 自然に還れ――【神焔返還】
        locator: {}
        spoiler_after: ch0117
      - event_ref: E_ch0117_ネドラド_fears_トリシューラ_p4109
        quote: 修道騎士として数々の戦いを潜り抜けてきた勘はこう告げていた。挑めば死ぬ。決して勝てない。
        locator: {}
        spoiler_after: ch0117
      - event_ref: E_ch0117_ネドラド_fights_アズーリア_p4123
        quote: 藍色の波動を纏って疾走するネドラドと、影絵の戦斧と厚みのない黒い方形盾を構えたアズーリアが激突した。
        locator: {}
        spoiler_after: ch0117
    name:
      observations:
      - event_ref: E_ch0117_ネドラド_names_二本足_p4094
        quote: まして彼は守護の九槍第八位、【二本足】のネドラド。あらゆる機械を破壊する【野蛮】の邪視者。
        locator: {}
        spoiler_after: ch0117
    speech:
      observations:
      - event_ref: E_ch0117_ネドラド_says_自然への回帰_p4094
        quote: 虚飾を剥ぎ取り、ありのままの自然に還れ。君は不自然だ。この世にあってはならない。鉄は鉄らしく、地に埋没せよ
        locator: {}
        spoiler_after: ch0117
      - event_ref: E_ch0117_ネドラド_says_魔女への憎悪_p4096
        quote: 君が屍体を操る杖の呪術を敵味方双方に普及させた件。あれでどれだけの死霊使いたちが失職したと思う？ 君は邪悪な魔女だ。社会に害悪しかもたらさない。
        locator: {}
        spoiler_after: ch0117
      - event_ref: E_ch0117_ネドラド_says_原始の世界_p4097
        quote: 不自然な形での進歩など不要だ。人は、杖など無くてもただ二本の足だけで立っていくことが出来る。原始の世界こそが人のあるべき姿だ。
        locator: {}
        spoiler_after: ch0117
      - event_ref: E_ch0117_ネドラド_confesses_血族の没落_p4099
        quote: 確かに、僕は元々空の民だった。だが杖が苦手というのは間違いだ。むしろ、例外的に僕たちの血族は杖の適性が高かったんだ。
        locator: {}
        spoiler_after: ch0117
      - event_ref: E_ch0117_ネドラド_says_父への憎しみ_p4099
        quote: 父は屑でね。存在しない過去の栄光、血族の誇りを振りかざして、周りの人を苦しめるようなことを平気でしていた。
        locator: {}
        spoiler_after: ch0117
  first_appearance_candidate: true
