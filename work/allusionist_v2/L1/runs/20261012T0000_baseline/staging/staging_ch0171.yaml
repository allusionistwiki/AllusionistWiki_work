        quote: 「祝祭が始まったらすぐに目を閉じなさい。死人の舞いは黄泉の喜び。私たち生者がそれを直視してしまえば魂は奈落へと引き摺られ、瞳は二度と現世を映すことはなくなるでしょう。いいですね？
          絶対に、絶対に、どれだけ見たくなっても死人の舞いを直接見てはなりませんよ」
        locator: {}
        spoiler_after: ch0171
  first_appearance_candidate: true
