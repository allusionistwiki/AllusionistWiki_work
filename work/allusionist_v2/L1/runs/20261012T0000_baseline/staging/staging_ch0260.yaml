      observations:
      - event_ref: E_ch0260_ダウザール_says_融血呪の暴挙_p8280
        quote: 「ダウザール、まさか矛盾史そのものに融血呪を？ 暴挙だっ！ 世界が滅茶苦茶になるぞ！」「既に滅茶苦茶なのですよ、このような世界！！」
        locator: {}
        spoiler_after: ch0260
  first_appearance_candidate: true
- canonical_target: '[[E_term_ハグレス]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch0260_ハグレス_observes_並行矛盾史_p8280
        quote: 「並行矛盾史？ まさか、この規模で分岐させるつもりなのか？！ 馬鹿め、そんな力づくの史観を主流にできるとでも思っているのか！」 槍の英雄が慄く。眼前では、世界が『動物性愛をあらゆる価値観の頂点に置いた人類史』へと書き換えられつつあった。
        locator: {}
        spoiler_after: ch0260
      - event_ref: E_ch0260_ハグレス_thinks_生意気な女への憎悪_p8283
        quote: 殺す。ハグレスは激怒を拡張し、『生意気な女すべてを躾ける必要がある』という意識に己の男性性を同調させた。クレアノーズへの憎悪が、全人類の半数に対する攻撃権へとすり替わる。
        locator: {}
        spoiler_after: ch0260
    action:
      observations:
      - event_ref: E_ch0260_ハグレス_flees_ライラの軍勢_p8281
        quote: 思念のみで答えるダウザールに槍を向けるハグレスは、しかしライラの『餓犬の軍勢』によって追い込まれていく。 何度も変身を繰り返し、幾つもの化身を繰り出すが地上における支配権を完全に確立したクロウサーに堕ちた神が叶うはずもない。
          這う這うの体で逃げ出した少年神だが、追い込まれた先で待ち構えていたのは更なる悪夢だった。
        locator: {}
        spoiler_after: ch0260
      - event_ref: E_ch0260_ハグレス_attacks_クレアノーズ_p8283
        quote: 怒れるハグレスは即座に攻撃を開始した。 強力無比な高位呪術の連打。 無詠唱で放たれた呪術の束が拡散し、重なり合って瞬時に少年神にとって有利な戦場を作り上げていく。
          『泥濘』によって呪力を生成、『鼓舞』で強化した『火無しの煙』を基点にして『炎上』で周囲一帯にに呪詛を拡散、即座に全方位から集中攻撃。爆炎が魔女を呑み込む。
        locator: {}
        spoiler_after: ch0260
      - event_ref: E_ch0260_ハグレス_activates_連節骨槍ファラクランティア_p8284
        quote: 「起動せよ、連節骨槍ファラクランティア。第一頸椎から順に対抗呪文を構えて待機。第十二胸椎まで分離、並列で自動詠唱。基底仙骨から尾骨までの呪力循環を加速」
          槍を振るう。死が広がる。交わる動物たちの世界が崩壊していく。
        locator: {}
        spoiler_after: ch0260
      - event_ref: E_ch0260_ハグレス_travels_虫王の庭_p8285
        quote: 痕跡を辿って逃亡した魔女を追撃する。 神の権能による隣接異界への移動。やってきたのは箒レーサーたちが通り過ぎ、世界から注視されなくなった虫王の庭だ。
          ハグレスは、そこに滞留していたはずの穢れが神秘的な香りによって遠ざけられていることに気付いた。これは上空に漂う瘴気混じりの空気を寄せ付けないための浄化作業だ。香水呪術での防護を行いながら浄界の展開準備をしていると見て間違いない。
        locator: {}
        spoiler_after: ch0260
  first_appearance_candidate: true
- canonical_target: '[[E_term_キュトス]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch0260_キュトス_has_property_地母神の権能_p8281
        quote: かつて槍神の対であった不死女神キュトスは、無数の欠片に引き裂かれた後もなお強大な女神としての権能を有している。 総体としてのキュトスの姉妹は天なる槍神と拮抗するだけの力をもった地母神だ。
        locator: {}
        spoiler_after: ch0260
  first_appearance_candidate: true
- canonical_target: '[[E_term_クレアノーズ]]'
  entity_type: terminology
  aspects:
    visual:
      observations:
      - event_ref: E_ch0260_クレアノーズ_appears_星見の塔の魔女_p8281
        quote: 古い因縁で結ばれた『星見の塔』の魔女クレアノーズは獣たちが情愛を交わすただ中で、ひどく冷ややかに少年神を見下ろしている。
        locator: {}
        spoiler_after: ch0260
      - event_ref: E_ch0260_クレアノーズ_transforms_空虚な抜け殻_p8290
        quote: 魔女は自分を抉る。自分を切り落とす。腕を、脚を、翼を、皮を割いて肉を引きずり出し、鮮血と共に骨を砕く。 臓腑を千切り、頭蓋を割り、脳と眼球を引きずり出す。
          クレアノーズはクレアノーズを抉り続けて、その中身全てを排出した。 残ったのはがらんどう。 空っぽになった、魔女の残骸。
        locator: {}
        spoiler_after: ch0260
    speech:
      observations:
      - event_ref: E_ch0260_クレアノーズ_says_俗界の中間管理職_p8281
        quote: 「まさか。星々が下す運命に近いお姉さま方と違って、私の意思はもっと俗っぽいの。ここにいるのは高みから遊戯盤を見下ろす小女神などではない。俗界の呪術師組織の中間管理職がいいところね。目的だってたかが知れている」
        locator: {}
        spoiler_after: ch0260
      - event_ref: E_ch0260_クレアノーズ_says_末妹選定の矮小化_p8282
        quote: 「そのために我々の選定計画に『末妹選定』などというナンセンスな儀式を重ねたと言うのか？ 馬鹿げている」「そう、馬鹿げている。なぜなら末妹選定というのはね、矮小化の儀式なのだから」「なに？」
          問い返すと、クレアノーズは心底から愉快そうにせせら哂った。
        locator: {}
        spoiler_after: ch0260
      - event_ref: E_ch0260_クレアノーズ_says_ハグレスへの嘲笑_p8284
        quote: 「間抜け。雑魚。その程度の術に失敗したの？ ほらほら、はやく私を捕まえてごらんなさい？ それともクロウサーがいないと何にもできないのかしら、ボウヤ？」
        locator: {}
        spoiler_after: ch0260
      - event_ref: E_ch0260_クレアノーズ_says_浄界の基礎_p8287
        quote: 封印者クレアノーズは結界術に精通した魔女として知られている。 聖俗の境界を切り分け、特定の空間領域に『区切り』を与える神秘の名付け。
          広く知られている『塔』式の呪術の奥義、浄界の基礎を形作ったのは彼女に他ならない。
        locator: {}
        spoiler_after: ch0260
      - event_ref: E_ch0260_クレアノーズ_confesses_妹たちへの愛_p8289
        quote: 「飽きる？ いいえ、私はむしろ足りない。目に焼き付けてもまだ。もっと見ていたいと思うのよ。私が守るべき、『結界の六十二妹』を！！」 神に投擲した斬撃が弧を描いて魔女の手元に戻る。
          そして、女の肉体から鮮血が飛び散った。 自傷。それが結界守護者クレアノーズの浄界を発動させる鍵だった。
        locator: {}
        spoiler_after: ch0260
    action:
      observations:
      - event_ref: E_ch0260_クレアノーズ_uses_香水呪術_p8285
        quote: くんくんと、少年神は鼻で大気に流れる呪力の残滓を嗅ぎ分けた。 香水呪術。この『嗅覚』と密接に関わる術はクレアノーズの得意技だった。 トップノートは微かなシトラスの香調。そこに混じった甘さとフローラルさは恐らく白薔薇が基調となっているが強くはない、中香というところだ。調和を重視した香り立ちは十中八九ティーベースのモダンローズ。わずかな柑橘風味は木蓮だろう。
        locator: {}
        spoiler_after: ch0260
      - event_ref: E_ch0260_クレアノーズ_uses_古代の呪具_p8286
        quote: 前に放り投げたのは複顔済みの水晶髑髏、身代わりとしては破格にも程がある骨董品。 続けて繰り出した呪具はフロントクロンの古代箒、沸騰する置時計、多次元渾天儀。
          博物館にでも寄贈すべき古めかしい呪具を湯水のように投入して猛攻を凌ぐ杖使いは、数秒の時間を稼ぐためだけに浪費と蕩尽を繰り返す。
        locator: {}
        spoiler_after: ch0260
      - event_ref: E_ch0260_クレアノーズ_uses_振り子剣_p8286
        quote: 刀身が胞子に塗れた片刃の剣と、柄尻から糸が伸びている振り子剣。 二振りの刃が、ハグレスの左右から迫りつつある。 片方は『毒牙』の呪術基盤を定着させた呪具だろうが、恐らくはキノコ人の呪術がベースになっているため『弾圧される少数者』の象徴としての側面が強い。
          『征服する槍神』に対するカウンターだ。それは理解できる。 問題はもう片方の振り子剣だ。
        locator: {}
        spoiler_after: ch0260
      - event_ref: E_ch0260_クレアノーズ_makes_結界_p8288
        quote: 「二色の虹、双頭の川、蒼い孤島、対の聖堂、境界線を重ねて結べ」 魔女の詠唱が空を裂き、作り出された虹を手に世界を区切る。 結界を構築する手順それ自体が攻撃手段だった。
        locator: {}
        spoiler_after: ch0260
      - event_ref: E_ch0260_クレアノーズ_uses_神性零落の斬撃_p8288
        quote: 「竜脳を裂く木製のメス、水晶液の未来点滴、トントロポロロンズのコーヒー、レイスを喚起するための鏡餅、荒野で外科手術を行うための四つの作法」「神性零落の斬撃か。君も懲りないね。僕にそれは無意味だよ」
          陳腐でナンセンスな詠唱を暴力で切って捨てる。
        locator: {}
        spoiler_after: ch0260
      - event_ref: E_ch0260_クレアノーズ_makes_結界の六十二妹_p8291
        quote: この浄界は地母神キュトスから分かたれた小女神たち、その縮小再生産。 それは不死なる魔女の軍勢。姉妹たちの浄界。女神たちの化身。 その名を『結界の六十二妹』。
          クレアノーズを含む全ての『妹』たちを再現する『化身』の大量構築術。 不死性と多様性を併せ持つ、数と質を兼ねた暴力。 トリシューラがシナモリアキラに与えた義肢、ウィッチオーダーの発想の原型だ。
        locator: {}
        spoiler_after: ch0260
  first_appearance_candidate: true
- canonical_target: '[[E_item_ちびシューラ]]'
  entity_type: item
  aspects:
    action:
      observations:
      - event_ref: E_ch0260_ちびシューラ_observes_戦場_p8291
        quote: その様子を、カメラを搭載した監視ドローンがじっと見つめている。 師を前に居住まいを正す生徒のように。 無機質で貪欲な二つのまなざしが、学習を続行する。
          この戦場の主役は、見学者なのだという事実を示すように。 ドローンの上に、ちょこんと二頭身のちびキャラたちが座り込んでいた。 ちびシューラとちびアキラ。
        locator: {}
        spoiler_after: ch0260
      - event_ref: E_ch0260_ちびシューラ_makes_天形_p8292
        quote: 粘土だ。 魔女と使い魔は、二人で一緒に粘土を捏ねていた。 形作ろうとしているのは、二人と同じような小さなヒトガタ。 二人が見ているのが神々の戦場であることを踏まえると、あるいはそれは大いなる存在を模した、天形であるのかもしれない。
          あまがつ 獣たちが交わる愛の世界から離れ、死によって生まれ出ずる不死女神たちの世界で生まれつつある神の似姿。 その意味に、ハグレスはまだ気付いていない。
        locator: {}
        spoiler_after: ch0260
  first_appearance_candidate: true
