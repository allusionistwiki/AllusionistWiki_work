      observations:
      - event_ref: E_ch0260_レメス_defines_情愛の世界_p8279
        quote: 虹犬の神レメスが統べる世界は情愛に満たされている。 獣たちの咆哮は恋の競争に挑まんとする勇者たちの名乗り口上。 草木の躍動は愛の争奪に胸躍らせる翼と風たちによる舞踏会への招待状。
          勝者は天にも昇る法悦を手にするが、落伍者は奈落へと失墜する。
        locator: {}
        spoiler_after: ch0260
    visual:
      observations:
      - event_ref: E_ch0260_レメス_makes_大乱交アニマルランド_p8279
        quote: すなわちレメスが創造した大乱交アニマルランド。 紀人の浄界では至る所で情交が行われ、その光景はひどく退廃的だ。
        locator: {}
        spoiler_after: ch0260
  first_appearance_candidate: true
- canonical_target: '[[E_term_第五階層]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch0260_第五階層_has_property_死生観の崩壊_p8279
        quote: 死人の森の女王が顕現し、シナモリアキラが転生紀人として成立してしまった第五階層では通常の死生観が通用しない。 生死は融け合い、冥府の中でさえ生命は祝福される。
          あるはずのない『死せる生殖』さえも、この祝祭では成立する可能性があるのだ。
        locator: {}
        spoiler_after: ch0260
  first_appearance_candidate: true
