  mysteries:
  - kind: mystery
    name: MY_クレナリーザの中身
    note: 部屋の隅にある謎のトランクケース「クレナリーザ」。呪われた遺物のように付きまとうとされるが、その正体と目的は不明。
    quotes:
    - quote: それから気になるのは部屋の隅に鎮座している中身の分からないトランクケース。謎めいた再生者の忘れ物だ。クレナリーザ空気のように軽いがいったい何が入っているのか。
      paragraph: p7799
    expected_payoff: 物語の重要な鍵となるアイテム、あるいは敵対勢力の仕掛けられた罠として後で開封される。
  - kind: mystery
    name: MY_ニアホンの不在と奪取
    note: 当初不在だった仲間「ニアホン」が、後にレナリアによって人質として握られていることが判明する。なぜレナリアが持っていたのか、その経緯と目的。
    quotes:
    - quote: 携帯端末や各種の呪具、武器などは無事だったが、ニアホンがない。
      paragraph: p7798
    - quote: レナリア・Ｖ・オルガナ。ライラと互角の戦いを演じた紀人の暗殺者だ。その一歩後ろで控えているのは口から耳までを覆う鉄マスクと右半身の刺青が特徴的な巨漢・ゴーリーだった。
      paragraph: p7820
    expected_payoff: ニアホンの奪還、あるいはレナリアとの交渉材料、もしくはニアホン自体が持つ特殊な機能の発動。
  - kind: mystery
    name: MY_メートリアンのペレケテンヌルの祝福
    note: メートリアンが「永遠の幼さ」を強制されていたという過去。この呪縛が解けた経緯と、それが現在の彼女の精神状態や能力にどう影響しているか。
    quotes:
    - quote: 「普通の魔女たちにとってはそうでしょう。けれど私はペレケテンヌルの祝福によって永遠の幼さを強制されていました。私にとってはね、あの頃の記憶は遠い昔ではあるけれど、つい最近のことでもあるんですよ」
      paragraph: p7812
    expected_payoff: メートリアンの真の年齢や正体、あるいは彼女が抱えるトラウマの克服と成長の鍵。
  - kind: mystery
    name: MY_シャルマキヒュの真意
    note: 紀神シャルマキヒュがエレクトラにレナリアとの協力を命じた真の意図。単なる試練なのか、より大きな計画の一部なのか。
    quotes:
    - quote: 「聞くがよい。これは宿命である。そなたはこの者と手を取り合い、大いなる試練に立ち向かわねばならぬ。この世界に迫る危機を人の子が乗り越えるために、これは避けては通れぬ道なのだ。」
      paragraph: p7821
    expected_payoff: レナリアとの共闘が必須となる大規模なイベント、あるいは神々同士の対立構造の露呈。
  - kind: mystery
    name: MY_トリシューラの沈黙
    note: 機械女王トリシューラからの返信がなく、あえて反応していないとされる状況。彼女が何を見守り、何を隠しているのか。
    quotes:
    - quote: 「トリシューラは何のつもりなんだろう。直接の返信はないし」いくら二人で不平を申し立てても、機械女王からの反応は定型の応答文だけ。
      paragraph: p7799
    expected_payoff: トリシューラが仕掛けた大きな罠の発動、あるいは彼女自身の介入による状況の急変。
