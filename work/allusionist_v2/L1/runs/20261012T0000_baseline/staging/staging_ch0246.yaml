- canonical_target: '[[E_char_キニス]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0246_キニス_appears_as_灰都の中心の幼子_p7997
        quote: 展示の演出は灰色だ。滅ぼされた文明は灰都の名を与えられ、過去の中に封じられている。だがそれ以上に、その中心で朽ちた玉座に背を預ける幼子には色彩が欠落していた。
        locator: {}
        spoiler_after: ch0246
    speech:
      observations:
      - event_ref: E_ch0246_キニス_names_アルト王の血を引く者_p7998
        quote: 偉大なるアルト王の血を引く者よ。誉れ高きダーカンシェルの言葉を受け継ぐ子よ。恐るべきカズキスの呪いを刻まれた器よ。
        locator: {}
        spoiler_after: ch0246
      - event_ref: E_ch0246_キニス_says_せんせい_p8001
        quote: 「せんせい？」
        locator: {}
        spoiler_after: ch0246
    action:
      observations:
      - event_ref: E_ch0246_キニス_fears_希望_p8002
        quote: 希望。それが実在するかもしれないという未来から目を背け、怯えて縮こまる。
        locator: {}
        spoiler_after: ch0246
  first_appearance_candidate: true
- canonical_target: '[[E_char_観客]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0246_観客_observes_キニス_p7997
        quote: それを見た者たちはいずれも喪失を見る。絶望を視る。諦観を観る。だからこそ、彼らの心にはそれに反するような熱意が燃え上がるのだ。
        locator: {}
        spoiler_after: ch0246
  first_appearance_candidate: true
- canonical_target: '[[E_char_アテンプレク]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0246_アテンプレク_says_ティシリアの発言力の決定_p7998
        quote: 「もはや藍の天主やクロウサーの後塵を拝すこともない、というわけですな。これでティシリアの発言力は決定的なものとなってしまった。ダーカンシェル実験の成功が認められた以上、我々も次期城主に従わざるを得なくなる」
        locator: {}
        spoiler_after: ch0246
      - event_ref: E_ch0246_アテンプレク_promises_命の捧げ_p8000
        quote: 「喜んで」
        locator: {}
        spoiler_after: ch0246
      - event_ref: E_ch0246_アテンプレク_says_父上の死の価値_p8002
        quote: 「キニス様。あなたがそう願う限り、お父上の死は無価値にはならないのです」
        locator: {}
        spoiler_after: ch0246
      - event_ref: E_ch0246_アテンプレク_reveals_アキラとの交戦と会談_p8007
        quote: 「トリシューラ様とマーネロア様は、アキラ殿がこの階層に現れた直後、二回ほど交戦と会談を行っております。その際に協定を幾つか。
        locator: {}
        spoiler_after: ch0246
      - event_ref: E_ch0246_アテンプレク_says_チリアットという号_p8007
        quote: 「女王からはヴァラーハのあざ名とチリアットの号を与えられております。今はどうか、そちらの名で呼んでいただければと」
        locator: {}
        spoiler_after: ch0246
    relationship:
      observations:
      - event_ref: E_ch0246_アテンプレク_has_property_金猿のふん_p7999
        quote: 口さがない者たちの言葉を借りれば『金魚のふん』ならぬ『金猿のふん』といったところだが、アテンプレクはその立場に満足していた。
        locator: {}
        spoiler_after: ch0246
    visual:
      observations:
      - event_ref: E_ch0246_アテンプレク_wears_黒亜竜の生体義手_p8006
        quote: 機械女王の仕事であろう黒亜竜の生体義手がいやに目を惹いた。魔将ダエモデクの骸を利用した寄生異獣。
        locator: {}
        spoiler_after: ch0246
  first_appearance_candidate: true
- canonical_target: '[[E_char_マーネロア]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0246_マーネロア_says_ディスケイムからの動物想への血統_p7998
        quote: 「ついにディスケイムから動物想に届く血統が現れたか」
        locator: {}
        spoiler_after: ch0246
      - event_ref: E_ch0246_マーネロア_says_ダエモデク卿との関係性への布石_p7999
        quote: 「城主アゥルメイアに抗し得る古竜、ダエモデク卿との関係性に布石を打つこと。テテリビナ穏健派の『緑の御者』殿との同盟を今以上に強固にしておくこと。
        locator: {}
        spoiler_after: ch0246
      - event_ref: E_ch0246_マーネロア_asks_アテンプレクの命_p8000
        quote: 「アテンプレク。あの娘の未来に意思を届ける。お前の命を私に捧げよ」
        locator: {}
        spoiler_after: ch0246
      - event_ref: E_ch0246_マーネロア_says_境界動物解放戦線の使命_p8000
        quote: 「我ら『境界動物解放戦線』は、為すべきことを為そう。ダーカンシェルの鎖を砕き、血と肉体から解き放たれた真なる自由を創り出すために」
        locator: {}
        spoiler_after: ch0246
      - event_ref: E_ch0246_マーネロア_says_キニスへの託宣_p8001
        quote: 「聞こえているか、灰の娘。滅びに飾られた血の器よ。お前はいま、戦の始点に立っている。戦火のあとに降り積もった灰は全ての終点だ。ゆえにこそ、お前は悲しみと怒りのための薪としてくべられている。
        locator: {}
        spoiler_after: ch0246
      - event_ref: E_ch0246_マーネロア_says_死の価値_p8002
        quote: 「だが血のさだめに臆してはならぬ。死は恐ろしいが、もっと恐ろしいのは死の価値が損なわれることだ。
        locator: {}
        spoiler_after: ch0246
      - event_ref: E_ch0246_マーネロア_says_死者の言葉_p8003
        quote: 「死者の言葉を探すといい。色褪せぬものは、必ずそこにある」
        locator: {}
        spoiler_after: ch0246
    symbolic:
      observations:
      - event_ref: E_ch0246_マーネロア_appears_as_抗う者たちの旗印_p8004
        quote: マーネロアはその支配に抗う者たちの旗印だ。
        locator: {}
        spoiler_after: ch0246
  first_appearance_candidate: true
