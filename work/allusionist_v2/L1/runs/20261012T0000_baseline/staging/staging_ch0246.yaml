        quote: 言語支配者ダーカンシェルとその子アルトは動物に言葉を与え人としての知性を与え、また逆にその特権を剥奪する権能を有していた。
        locator: {}
        spoiler_after: ch0246
  first_appearance_candidate: true
- canonical_target: '[[E_char_セリア]]'
  entity_type: character
  aspects:
