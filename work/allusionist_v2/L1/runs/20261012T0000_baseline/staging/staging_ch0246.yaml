        quote: 最後に顔を見たのはセインディアの博物城で行われたとある展示でのことだ。
        locator: {}
        spoiler_after: ch0246
      - event_ref: E_ch0246_ユディーア_remembers_アテンプレク_p8003
        quote: 「アテンプレク先生？」
        locator: {}
        spoiler_after: ch0246
      - event_ref: E_ch0246_ユディーア_remembers_父とマーネロアの親交_p8004
        quote: もちろん知っていた。父が母親に隠れてマーネロアと親交を深めていたことも、小さなキニスは知っていた。
        locator: {}
        spoiler_after: ch0246
      - event_ref: E_ch0246_ユディーア_thinks_親不孝者_p8005
        quote: （きっとあたしは親不孝者だ）
        locator: {}
        spoiler_after: ch0246
      - event_ref: E_ch0246_ユディーア_thinks_カバーストーリー_p8007
        quote: 『チリアット』の過去として開示されている、『魔将ダエモデクの部下であった敗残兵に機械女王が手を差し伸べた』というストーリーは嘘ではないが全てを語ってはいない。ある種の欺瞞呪文だ。
        locator: {}
        spoiler_after: ch0246
    relationship:
      observations:
      - event_ref: E_ch0246_ユディーア_has_property_ダーカンシェルの権能の継承_p8004
        quote: ユディーアはその傲慢なまでの権能を血の中に受け継ぐ者であり。
        locator: {}
        spoiler_after: ch0246
    visual:
      observations:
      - event_ref: E_ch0246_ユディーア_remembers_母の剥落の鉤爪_p8004
        quote: あの瞬間からずっと。血に染まる母の『剥落の鉤爪』を目に焼き付けて、それと同じものが己の血肉に備わっているという恐ろしい事実を理解した時からずっと。
        locator: {}
        spoiler_after: ch0246
    action:
      observations:
      - event_ref: E_ch0246_ユディーア_thinks_七情掌法_p8008
        quote: ユディーアは自分に対して七情掌法を打ち込んで強引に『喜』を喚起すべきかどうかを真剣に悩み始めた。
        locator: {}
        spoiler_after: ch0246
  first_appearance_candidate: true
