      observations:
      - event_ref: E_ch0246_セリア_asks_解説_p8008
        quote: 「にあ！ レナリアぼこって戻ってきた！ セリアも解説ほしい！」「は～い、ぼこられたレナリアも複雑そうな事情を知りたいで～す」
        locator: {}
        spoiler_after: ch0246
  first_appearance_candidate: true
