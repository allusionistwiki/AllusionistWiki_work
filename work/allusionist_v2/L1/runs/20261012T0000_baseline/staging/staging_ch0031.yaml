        quote: 「その魔将を倒す為に、彼の助力が必要と判断したのですと、先程ご説明しましたが」
        locator: {}
        spoiler_after: ch0031
      - event_ref: E_ch0031_アズーリア_says_鎧_p1285
        quote: 「それはもう。私のもう一つの身体ですから」
        locator: {}
        spoiler_after: ch0031
      - event_ref: E_ch0031_アズーリア_says_運命_p1287
        quote: 「失礼ですよ、幾ら何でも。それにいいじゃないですか、前世からの運命で繋がった恋人同士って。夢があって――いえ、もちろん本人達の意思が一番大切ですけど」
        locator: {}
        spoiler_after: ch0031
      - event_ref: E_ch0031_アズーリア_hopes_守護の九槍_p1293
        quote: つまり、君の霊的な潜在能力は本来ずば抜けて高いはずなんだよ。それこそ、九人の管区長、【守護の九槍】に匹敵するほどにな
        locator: {}
        spoiler_after: ch0031
      - event_ref: E_ch0031_アズーリア_fears_第七位_p1294
        quote: 【守護の九槍】第七位。第四階層で私達の存在をゴミ掃除でもするかのように切り捨てたあの男に対抗できる力が手に入るのだとすれば。
        locator: {}
        spoiler_after: ch0031
      - event_ref: E_ch0031_アズーリア_fears_ジアメア_p1303
        quote: 問題は、一番高位の呪術師だと推測されるジアメアさんには何かを教えてもらえるような気が全くしないことだった。
        locator: {}
        spoiler_after: ch0031
      - event_ref: E_ch0031_アズーリア_hopes_妹_p1307
        quote: なにより大事なもの――魔軍の総帥にして迷宮の主、二重転生者セレクティフィレクティに魂と影を奪われた、私の妹を取り戻す為に。
        locator: {}
        spoiler_after: ch0031
    name:
