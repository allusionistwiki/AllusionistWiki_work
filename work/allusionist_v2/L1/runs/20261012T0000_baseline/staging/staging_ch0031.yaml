entities:
- canonical_target: '[[E_term_ラーゼフ・ピュクシス]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch0031_ラーゼフ・ピュクシス_asks_フィリス使用_p1282
        quote: 「外世界人の精神状態を安定させるためだけに【フィリス】を使った？　本気で？　魔将もまだ倒していなかったというのに？」
        locator: {}
        spoiler_after: ch0031
      - event_ref: E_ch0031_ラーゼフ・ピュクシス_says_アズーリア_p1282
        quote: 「君は馬鹿だな」　　ラーゼフ・ピュクシスは神経質そうに呟いて、白衣の裾を靡かせて室内を闊歩する。
        locator: {}
        spoiler_after: ch0031
      - event_ref: E_ch0031_ラーゼフ・ピュクシス_other_パーソナルヒストリー_p1283
        quote: 君のその未熟な呪術の腕前で、そんな繊細な干渉が必要な術を使ったこと自体が間違っている。その青年のパーソナルヒストリーに傷が付いて、歴史上から消滅していた可能性だってあったんだぞ？
        locator: {}
        spoiler_after: ch0031
      - event_ref: E_ch0031_ラーゼフ・ピュクシス_says_アズーリアの希少性_p1284
        quote: 君は私が――我が【智神の盾】が独力で完成させた初の異獣憑きなんだ。しかも今まで誰にも適合しなかった『あの』第一魔将の適合者。
        locator: {}
        spoiler_after: ch0031
      - event_ref: E_ch0031_ラーゼフ・ピュクシス_says_新型呪動装甲_p1285
        quote: 「君が馬鹿な真似をして地下にぶち込まれている間に、新型の呪動装甲だって出来上がったというのに」
        locator: {}
        spoiler_after: ch0031
      - event_ref: E_ch0031_ラーゼフ・ピュクシス_reveals_アストラル投射_p1287
        quote: 確か拘留期間が長引いたのは、地下で思想的に問題がある創作物をアストラル投射で拡散させようとしたからとか聞いたぞ
        locator: {}
        spoiler_after: ch0031
      - event_ref: E_ch0031_ラーゼフ・ピュクシス_reveals_アズーリアの接触者_p1288
        quote: 「――ちなみに、君が夜な夜な『おいた』をしていることは筒抜けだ」
        locator: {}
        spoiler_after: ch0031
      - event_ref: E_ch0031_ラーゼフ・ピュクシス_other_異端審問官_p1288
        quote: 目に余るようなら上に報告せねばならん。異端審問官どもに目を付けられて順正化処理なんて嫌だろう？
        locator: {}
        spoiler_after: ch0031
      - event_ref: E_ch0031_ラーゼフ・ピュクシス_reveals_接触者5人_p1289
        quote: 「確か全部で五人だったな。うち二人が北ドラトリアからのアクセス――そういえば君の故郷の隣国だったな。あとは探索者に学生、それと君と同じ不良修道騎士。
        locator: {}
        spoiler_after: ch0031
      - event_ref: E_ch0031_ラーゼフ・ピュクシス_says_眷族神_p1293
        quote: 君の守護天使は大神院が定める位階では第二位。第一位が最高神である槍神の半身のようなものであることを考えれば、事実上最高位の天使からその加護を賜っているわけだ。
        locator: {}
        spoiler_after: ch0031
      - event_ref: E_ch0031_ラーゼフ・ピュクシス_other_濫用_p1300
        quote: 「このままフィリスを使い続ければ、浸食されるのは君だけに留まらないだろう、ということだ。世界そのものか、より根源的な何かか、ありとあらゆる存在か――もしかしたら、条理を外れた侵しがたい何かにまで手を伸ばしているのかもしれない」
        locator: {}
        spoiler_after: ch0031
      - event_ref: E_ch0031_ラーゼフ・ピュクシス_other_高位呪術師_p1302
        quote: 世界中とまではいわずとも、この広い迷宮都市のどこかにはとびきりの突然変異である君に教えられる高位呪術師がいるかもしれない。探して、教えを請うてみてはどうかな
        locator: {}
        spoiler_after: ch0031
      - event_ref: E_ch0031_ラーゼフ・ピュクシス_promises_反魂の術_p1307
        quote: フィリスを使いこなせるようになれば、現代の呪術では到底不可能と言われた事もきっとできるようになると、ただ一人私が戦う理由を知っているラーゼフは保証してくれた。
        locator: {}
        spoiler_after: ch0031
    action:
      observations:
      - event_ref: E_ch0031_ラーゼフ・ピュクシス_takes_きぐるみの魔女の役職_p1284
        quote: 【星見の塔】から派遣されていた【きぐるみの魔女】が謎の失踪を遂げた後は、その役職を引き継いで私達【異獣憑き】の調整や管理を担当しており
        locator: {}
        spoiler_after: ch0031
      - event_ref: E_ch0031_ラーゼフ・ピュクシス_activates_呪動装甲_p1291
        quote: 寝台の上下左右から複数の関節を持った腕が伸び、鎧の各部位を私の身体に装着していく。
        locator: {}
        spoiler_after: ch0031
      - event_ref: E_ch0031_ラーゼフ・ピュクシス_observes_神働術適性_p1294
        quote: 「やはりな――前に計測した時よりも、神働術適性が全体的に上昇している」
        locator: {}
        spoiler_after: ch0031
      - event_ref: E_ch0031_ラーゼフ・ピュクシス_gives_魔導書_p1301
        quote: 「――これを返しておく。正式に君の装備として登録しておいた」　そう言ってラーゼフが渡してきたのは、見覚えのある黒表紙の書物と槌矛だ。
        locator: {}
        spoiler_after: ch0031
      - event_ref: E_ch0031_ラーゼフ・ピュクシス_gives_部下_p1304
        quote: 「――私の部下に、一人器用な奴がいる。そいつも異獣憑きでな。環境適応能力に優れている。汎用的に使うために手元で雑用をやらせていたんだが――端末のアドレスを教えるから迷宮に潜る時には呼び出して組め。貸してやる」
        locator: {}
        spoiler_after: ch0031
  first_appearance_candidate: true
