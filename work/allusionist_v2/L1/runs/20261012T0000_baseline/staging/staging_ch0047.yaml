      - event_ref: E_ch0047_アズーリア_asks_サイン_p1940
        quote: 項垂れたハルベルトに駆け寄り、色紙を差し出しながら勢い込んで言う。「あのっ、サイン下さいっ」
        locator: {}
        spoiler_after: ch0047
    speech:
      observations:
      - event_ref: E_ch0047_アズーリア_thinks_四英雄の仲間_p1907
        quote: では、四英雄の仲間たちを雇えばいいのではないか。私はそう考えたのだ。
        locator: {}
