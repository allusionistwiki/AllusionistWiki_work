  first_appearance_candidate: true
- canonical_target: '[[E_char_サリア]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0047_サリア_says_忠告_p1906
        quote: 「それは無茶。やめておいた方がいい」 探索者サリアは、怜悧な瞳に静かな光を湛えながらそう忠告した。
        locator: {}
        spoiler_after: ch0047
      - event_ref: E_ch0047_サリア_says_条件付き協力_p1911
        quote: 「言っておくけど、さっきのお菓子とは別に護送任務の報酬は相応に貰う。その条件でなら手を貸す」
        locator: {}
        spoiler_after: ch0047
  first_appearance_candidate: true
- canonical_target: '[[E_char_アルマ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0047_アルマ_reveals_霊的視力_p1907
        quote: だが、二人の探索者は見分けのつかない黒衣を見て、一目で私個人を特定していた。フードの内部が見えないように認識妨害の呪術が働いているにも関わらずだ。それはつまり、二人の霊的視力が高い事を――邪視の能力が高い事を示している。
        locator: {}
        spoiler_after: ch0047
      - event_ref: E_ch0047_アルマ_other_サリア_p1909
        quote: アルマは私の手からお菓子を素早く掴み取ると、神速の手さばきで包み紙を剥がしてそれを相方の口の中に放り込む。 不意を突かれたサリアは目を丸くした。どうにかしてそれを吐き出そうとするが、アルマの両腕が形の良い頭部と顎をがっしりと掴む。
        locator: {}
        spoiler_after: ch0047
    speech:
      observations:
      - event_ref: E_ch0047_アルマ_says_断絶_p1909
        quote: 「私は事情があって手伝いたいけど手伝えないんだ。だからサリアちゃんよろしく」
        locator: {}
        spoiler_after: ch0047
  first_appearance_candidate: true
- canonical_target: '[[E_char_青年]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0047_青年_says_異獣駆逐_p1914
        quote: 「――清浄なる世界を実現せんが為、皆さんの力をお借りしたい！ 野蛮で汚らわしい異獣どもをこの世から完全に駆逐し！ 偉大なる槍神の威光によってこの世の全てを平定する！
          これこそが正義！ これこそが我々が完全なる自由と平和を獲得するための唯一の方法なのです！」
        locator: {}
        spoiler_after: ch0047
    symbolic:
      observations:
      - event_ref: E_ch0047_青年_transforms_思想_p1914
        quote: 一昨日、私は同じように駅前で叫ぶ青年を見た。 下方勢力との対話や融和を叫ぶ、地上の在り方に疑問を投げかける青年の姿を。 順正化処理。その結果が、いまこの場所に現れていた。
        locator: {}
        spoiler_after: ch0047
  first_appearance_candidate: true
- canonical_target: '[[E_char_ハルベルト]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0047_ハルベルト_makes_家ルキー妖精_p1916
        quote: 「さわさわ、かさかさ、お手伝い、お掃除お天気お留守番――【家ルキー妖精】よ、在れ」 ハルベルトが呪文を唱えると、仮想使い魔が出現して瞬く間に布団を敷き、床に熱を発生させて少し冷えていた部屋を温めていく。
        locator: {}
        spoiler_after: ch0047
    speech:
      observations:
      - event_ref: E_ch0047_ハルベルト_says_メタテクストの改変_p1924
        quote: 「世界のゆらぎ。構造への共時的な干渉。メタテクストの改変。そして非局所的な応答。ある時空の一点に加えられた外力が、他の点においても変化を引き起こす。これと同じふるまいをする呪術を、アズは知っているはず」
        locator: {}
        spoiler_after: ch0047
      - event_ref: E_ch0047_ハルベルト_says_隠れた変数_p1927
        quote: 「杖的な量子力学を破壊し、否定するもの。古典物理の延長である現代呪術理論では、二重スリット実験の結果を観測可能量を決定する観測困難な変数を導入して説明する。それこそが隠れた変数――すなわち呪力であり摸倣子。情報を媒介するもの」
        locator: {}
        spoiler_after: ch0047
      - event_ref: E_ch0047_ハルベルト_says_四魔女の目的_p1929
        quote: 「私たち四魔女の目的は、その紀元槍に四通りの手段で辿り着くこと。四通りの摸倣と呼ばれる極めて困難な儀式呪術を執り行い、そうして紀元槍に到達することで【紀】に触れた存在となる――すなわち紀神の末席に加わることができるの」
        locator: {}
        spoiler_after: ch0047
      - event_ref: E_ch0047_ハルベルト_defines_呪文の座の目的_p1931
        quote: 「そして呪文の座――ハルの目的は、絶対言語の再生。引き裂かれた世界の言葉、混沌の坩堝に叩き落とされた人類に秩序を取り戻し、大いなる調和をもたらす」
        locator: {}
        spoiler_after: ch0047
      - event_ref: E_ch0047_ハルベルト_says_差延_p1932
        quote: 「より厳密には、言語が言語であるがゆえに宿命的に有してしまう『差延』が原因」
        locator: {}
        spoiler_after: ch0047
      - event_ref: E_ch0047_ハルベルト_reveals_歌姫Spear_p1938
        quote: 「歌姫Ｓｐｅａｒ――地上において知らぬ者無き天上の美声、楽神の囀り。世紀の歌姫とは、このハルベルトのもう一つの姿。ハルのライブは全世界に同時中継され、広がった摸倣子は世界を変える」
        locator: {}
        spoiler_after: ch0047
  first_appearance_candidate: true
- canonical_target: '[[E_term_ミルーニャ]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch0047_ミルーニャ_says_オープンソース_p1917
        quote: 「はあ、これだから呪文使いはせこいって言われるんですよ。そうやって呪術を独占するから、既得権益を抱え込んだ血統系呪術師の貴族なんかが未だに大きな顔をしている。格差が拡大して資源は偏るばっかり。古代の言語支配者たちの理念に立ち返れば、あらゆる呪術はオープンソースであるべきだというのに」
        locator: {}
        spoiler_after: ch0047
      - event_ref: E_ch0047_ミルーニャ_says_摸倣子_p1922
        quote: 「この実験結果から、私たち杖使いは『広がった空間の確率分布を支配する何か』の存在を仮定しました。
        locator: {}
        spoiler_after: ch0047
      - event_ref: E_ch0047_ミルーニャ_says_紀元槍_p1925
        quote: 「そして、全く同時に世界の構造そのものを改変するフィリスは、世界が常に参照し続けているアカシックレコード――この宇宙の全存在を貫く紀元槍の制御盤ではないかという推測が可能です」
        locator: {}
        spoiler_after: ch0047
      - event_ref: E_ch0047_ミルーニャ_says_世界槍_p1926
        quote: 「要するに、この世界そのものが一つの巨大な世界槍内部に構築された世界なのではないか、ということです」
        locator: {}
        spoiler_after: ch0047
      - event_ref: E_ch0047_ミルーニャ_defines_杖の座の目的_p1930
        quote: 「杖の座は人類という枠組みそのものを変容させ、世界と対峙する人の在り方それ自体を更新する。人間以上的アプローチ」 ミルーニャは、それを全人類の不死という方法で為し遂げようとしていた。
        locator: {}
        spoiler_after: ch0047
      - event_ref: E_ch0047_ミルーニャ_says_言震_p1934
        quote: 「最悪の場合は言語汚染災害――言震に至ります」 言震――それは、現代でもまれに起こりうる大規模な災厄である。 人が用いる言葉が衝突し、意思が混沌に飲み込まれ、あらゆる物質とアストラル体が呪波汚染に曝される。
        locator: {}
        spoiler_after: ch0047
    action:
      observations:
      - event_ref: E_ch0047_ミルーニャ_makes_二重スリット実験_p1919
        quote: 「はあ。まあいいですけど。本当は、厳密な結果を得るためにはもっときちんとした環境と設備が必要なんですが――この中で杖使いとしての純度が高いのはミルーニャだけみたいですし、実験に厳密さを求める必要は無さそうですね」
          肩をすくめながら、ミルーニャは機材を床に置いて実験を開始した。
        locator: {}
        spoiler_after: ch0047
      - event_ref: E_ch0047_ミルーニャ_observes_干渉縞あり_p1921
        quote: 「杖使いのミルーニャが同じ事をすると、こうなるのです」 ミルーニャはゆっくりと時間をかけて、単発の電子を感光板に発射していった。 メイファーラは首を傾げた。
          今度はメイファーラの時とは異なる実験結果が得られたのである。 すなわち、干渉縞が生じているのだった。
        locator: {}
        spoiler_after: ch0047
  first_appearance_candidate: true
- canonical_target: '[[E_char_メイファーラ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0047_メイファーラ_observes_干渉縞なし_p1921
        quote: 「では、実際に試して見て下さい」 ミルーニャに促されるまま、新たな写真乾板に電子銃を向けるメイファーラ。 結果は、「ほら、やっぱり」
          ――メイファーラの言った通りだった。
        locator: {}
        spoiler_after: ch0047
  first_appearance_candidate: true
- canonical_target: '[[E_char_プリエステラ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0047_プリエステラ_observes_感光なし_p1922
        quote: ちなみに、プリエステラが行うと電子が写真乾板に到達しているにも関わらず感光しないという奇妙な結果が生まれた。 素朴な自然崇拝の信仰心がこのような結果を引き起こすらしい。
        locator: {}
        spoiler_after: ch0047
  first_appearance_candidate: true
- canonical_target: '[[E_char_リーナ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0047_リーナ_says_グロソラリア_p1928
        quote: 「なんかねー、始祖が転生者だったらしーよ。代を経るたびに色んな血を取り入れまくったから、色んな内世界の因子も入ってて――ごちゃ混ぜなグロソラリアなんだって聞いたことある」
        locator: {}
        spoiler_after: ch0047
  first_appearance_candidate: true
- canonical_target: '[[E_char_コルセスカ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0047_コルセスカ_defines_邪視の座の目的_p1930
        quote: 「邪視の座は伝承をなぞり、迷宮攻略と竜退治によって神話を再生する。世界法則の表象である竜を打ち倒すことで世界そのものを破壊し、改変する。遊びと演劇という呪術的ふるまいになぞらえた、抽象的扮演遊戯的アプローチ」
        locator: {}
        spoiler_after: ch0047
  first_appearance_candidate: true
