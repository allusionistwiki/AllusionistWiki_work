  note: トリシューラ謹製の自動機銃が制御を奪われ、アキラを攻撃した。乗っ取ったのは「流体の少女」ではなく、別の言語魔術師（コルセスカ？）である可能性が示唆されている。
  quotes:
  - quote: コントロールを乗っ取られてる！
    paragraph: p786
    quote_verified: true
  - quote: あーもうセスカは敵なのか味方なのかはっきりしてほしい！
    paragraph: p794
    quote_verified: true
  expected_payoff: コルセスカがアキラを保護するために自動機銃を乗っ取ったことが判明し、彼女の「敵対的支援」の構造が露見する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_アルテミシアの逃走
  note: アルテミシアが自らの脚を石化・破壊して砂塵とし、凍結の視線を遮って地下へ沈み込み逃走した。彼女の正体と、地下へ逃げた先の意味。
  quotes:
  - quote: 自らの脚を石化させたかと思うと、それを根本から砕き、へし折ったのだ。唖然とするコルセスカに向けて投擲された石の脚が、中空で微細な砂塵となって飛散する。
    paragraph: p809
    quote_verified: true
  expected_payoff: アルテミシアが地下の勢力（悪鬼や別の邪視者）と合流し、再登場する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_神滅具の暴走
  note: キロンが「ミエスリヴァ」を発動し、世界がモノクロに染まるほどの現象を起こした。神滅具が宿主を殺し、暴走する可能性が示唆されている。
  quotes:
  - quote: 「我が価値を問え、【ミエスリヴァ】」 そして世界が、モノクロに染まる。
    paragraph: p829
    quote_verified: false
  - quote: 急に宿主を殺して神滅具が暴走してもいけませんので、まずは生きたまま凍結隔離するか解呪をしないとならないのです
    paragraph: p828
    quote_verified: true
  expected_payoff: キロンが死亡し、神滅具が暴走して第五階層を壊滅させる危機が発生する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_コルセスカの野暮用
  note: コルセスカが「野暮用」で第五階層に現れ、アキラたちを陰ながら支援していた。その「野暮用」とは何か。
  quotes:
  - quote: 「ちょっと色々と。野暮用がありまして」
    paragraph: p804
    quote_verified: true
  expected_payoff: コルセスカの目的（火竜の討伐など）が明かされ、彼女がアキラたちと共闘する理由が明確になる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_少年達の武器化
  note: キロンが少年たちを武器（弓、槍、馬）へと変化させる。少年たちが人間としての自我を保っているのか、完全に武器化されているのか。
  quotes:
  - quote: その全身が黄金の煌めきに満たされたかと思うと、その輪郭が不意に歪み、異なる形状へと変化していく。
    paragraph: p812
    quote_verified: true
  expected_payoff: 少年たちが武器化されたままアキラたちに利用され、キロンの死後にアキラたちの戦力となる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_ミエスリヴァの正体
  note: キロンが叫んだ「ミエスリヴァ」とは何か。世界がモノクロに染まるほどの現象の正体。
  quotes:
  - quote: 「我が価値を問え、【ミエスリヴァ】」 そして世界が、モノクロに染まる。
    paragraph: p829
    quote_verified: false
  expected_payoff: ミエスリヴァが世界改変能力や大量破壊兵器の起動であり、物語のクライマックスを飾る。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 技術と倫理の乖離
  weight: 0.8
  quotes:
  - quote: 【Ｅ－Ｅ】が感情を分離したことで、相手の客観的な魅力や価値といったものが自分とは関係の無い事のように感じられる。
    paragraph: p792
    quote_verified: true
  - quote: 「負傷した者を狙うとは、卑劣なっ」 最適な戦略はそれだと俺は思ったのだが、生憎とコルセスカの方はそうじゃないらしい。
    paragraph: p820
    quote_verified: true
  note: アキラの感情制御装置【E-E】による非人間的な戦闘行動と、コルセスカの倫理的な批判の対立。技術が倫理を超越する構造。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 組織の暴力と個人の信頼
  weight: 0.7
  quotes:
  - quote: 【松明の騎士団】は信用に値しない。故に、俺が悩んだのはどのようにして彼らを打倒するか、どのようにして騙し、陥れ、裏切り、殺害するかという事だけだ。
    paragraph: p810
    quote_verified: true
  - quote: 「異獣は人では無い」 文法の不備を正すように、聖騎士は人とその他を峻別した。
    paragraph: p818
    quote_verified: true
  note: キロンの個人的な信頼と、松明の騎士団という組織の暴力性の対立。組織の論理が個人を殺す構造。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 環境汚染と技術の副作用
  weight: 0.6
  quotes:
  - quote: 使い手だけではなく周囲の環境全てに呪波汚染を撒き散らす、神話時代の産業廃棄物です！
    paragraph: p824
    quote_verified: true
  - quote: 「触らないで、そしてできれば近くで息をしないで下さい。肺を病みます」
    paragraph: p825
    quote_verified: true
  note: 神滅具が環境と人体に害をなす描写。技術の進歩が環境を破壊する現代の産業構造のメタファー。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 監視社会とプライバシー
  weight: 0.5
  quotes:
  - quote: 彼女は目の前に氷で鏡を作って、背後の光景を視認していた。鏡越しに邪視が発動し、キロンの身体に霜が走っていく。
    paragraph: p827
    quote_verified: true
  - quote: 俺は勢いよく飛び出して、無防備にふよふよと浮かんでいる眼球型の使い魔に背後から接近していく。撃ち出された右手は正確にそれを掴み取って、そのまま一気に握り潰す。
    paragraph: p807
    quote_verified: true
  note: コルセスカの「氷の鏡」による全方位監視と、アキラによる監視装置（眼球）の破壊。監視社会におけるプライバシーの侵害と抵抗。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 兵器の人間化と消耗
  weight: 0.6
  quotes:
  - quote: その全身が黄金の煌めきに満たされたかと思うと、その輪郭が不意に歪み、異なる形状へと変化していく。曲線を描くシルエット。弧の両端を繋ぐ、燐光を放つ細い弦。白い、弓？
    paragraph: p812
    quote_verified: true
  - quote: コルセスカの視線と氷の球体から放たれる氷槍。面制圧の呪術攻撃と夥しい密度の物理攻撃が同時に襲いかかるが、キロンは慌てることなく悠然と少年達を武器に変化させる。
    paragraph: p822
    quote_verified: true
  note: 少年たちが武器へと変化し、消耗品として扱われる様。人間が兵器として消費される構造。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 非ゼロサムゲームへの移行
