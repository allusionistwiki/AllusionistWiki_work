  - kind: mystery
    name: MY_オルヴァの再現計画
    note: トリシューラとミヒトネッセの会話で明かされた、レッテによる「我神十二限界」と「紫」を用いたオルヴァ再現計画。
    quotes:
    - quote: 『我神十二限界』と『紫』が完成すればオルヴァは再現可能。
