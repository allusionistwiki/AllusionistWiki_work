    name: MY_レオの「流れ」の正体
    note: レオが偶然を装って強力な援軍を引き寄せる「流れ」の正体と、それがもたらす代償。
    quotes:
    - quote: 既に運命の竜にでも働きかけているとしか思えない偶然の数々。
      paragraph: p5218
    - quote: レオは『流れ』の中心となる器の持ち主である。
      paragraph: p5219
