        locator: {}
        spoiler_after: ch0238
    speech:
      observations:
      - event_ref: E_ch0238_メートリアン_suspects_エレクトラのスキル_p7803
        quote: 「メイ、エレクトラ？　あなた最初から『広域知覚』と『スピードハック』、それに『ＲＭＴ』まで保有してませんか？　そういう人だったんですか？」
        locator: {}
        spoiler_after: ch0238
      - event_ref: E_ch0238_メートリアン_asks_色号論の起源_p7807
        quote: '「眼鏡を発明したのは亜大陸境界域の錬金術師って説、ご存じですか？　第五世界槍の錬金術は亜大陸の精霊術と相互に影響を与え合

          トゥルサ

          いながら発展してきました。'
        locator: {}
        spoiler_after: ch0238
      - event_ref: E_ch0238_メートリアン_reveals_黒百合宮の記憶_p7810
        quote: 「ええ。ですが、私には大学どころか初等学校より前に黒百合宮にいた記憶があります。それでいて、大学中退後に黒百合宮に行ったという時系列の認識も同時に存在している」
        locator: {}
        spoiler_after: ch0238
      - event_ref: E_ch0238_メートリアン_reveals_ペレケテンヌルの祝福_p7812
