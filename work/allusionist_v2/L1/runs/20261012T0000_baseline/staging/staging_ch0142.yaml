        locator: {}
        spoiler_after: ch0142
    speech:
      observations:
      - event_ref: E_ch0142_ルバーブ_suspects_カーイン_p4827
        quote: 「瘴気の強力さからしてまず間違い無く吸血鬼。だが、その幻術は幻姿霊のものにも見える」
        locator: {}
