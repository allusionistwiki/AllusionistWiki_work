  mysteries:
  - kind: mystery
    name: MY_巨大な剣の正体と落下
    note: 天空の裂け目から落下した巨大な剣が、【死人の森】の破壊と六王の復活という結果をもたらした。この剣が誰によって、何の目的で投げ込まれたのか、また「ダモクレスの剣」と呼ばれる呪術儀式の真の意図が不明。
    quotes:
    - quote: 天空の裂け目から巨大な剣が現れ、今まさに落下した所だった。
      paragraph: p4523
    - quote: 【ダモクレスの剣】という呪術儀式は無駄に終わったのか？
      paragraph: p4527
    expected_payoff: 剣の投下者が判明し、それがイアテムの計画の一部なのか、あるいは外部からの介入（ラクルラールなど）なのかの真相が明かされる。
  - kind: mystery
    name: MY_ヴァージルの真の目的と禁呪
    note: ヴァージルが「オーファの禁呪」を唱え、世界根や世界樹の灰を用いて第五階層の掌握者権限を奪取しようとしている。彼の最終目標が単なる権力奪取なのか、より大きな世界改変にあるのか不透明。
    quotes:
    - quote: 【死人の森】は再生する――逆位置の『王国』、さかしまのテテリビナ、原初の歌を紡げ九罪源の断章、我こそは権力の選定者
      paragraph: p4544
    - quote: まずい、シューラが万人に開いた第五階層の掌握者権限――ヴァージルはそれを奪取しようとしてる！
      paragraph: p4540
    expected_payoff: 禁呪の発動による世界構造の変化、またはヴァージルの背後にいる存在（もしいるなら）の出現。
  - kind: mystery
    name: MY_アキラの自我の分裂と「俺」の正体
    note: アキラがパーンとの戦闘中に「俺は俺のままなのに、俺という存在が引き延ばされて」という違和感を覚え、意識が希薄になる描写がある。これは転生者としてのアイデンティティの崩壊か、別の存在との混同か。
    quotes:
    - quote: 俺は俺のままなのに、俺という存在が引き延ばされて、その距離が拡大し続けるような――意識が希薄になっていくような。
      paragraph: p4542
    - quote: 面白いことになっているな、未来人。貴様、揺らいでいるな？
      paragraph: p4542
    expected_payoff: アキラの「前世」と「現世」の記憶の衝突、あるいは彼が単なる転生者ではなく、何らかの呪術的・メタ的な存在であることの示唆。
  - kind: mystery
    name: MY_コルセスカの浄界改変
    note: コルセスカが「コキュートス」の設定に手を加えようとしている。彼女が「現実をゲーム的に改変できないか」と言及しており、この改変が下界の戦乱にどう影響するか。
    quotes:
    - quote: いえ、実はまだ【コキュートス】は弄る余地があるんですよね。この際ですから、ちょっとやってみましょうか。リスクもありますけど
      paragraph: p4555
    expected_payoff: コルセスカの能力による戦況の劇的な変化、または改変の代償としての彼女の存在の不安定化。
  - kind: mystery
    name: MY_六王の「リビドー」による暴走
    note: 六王がコルセスカへの欲動（リビドー）によって理性を失い、互いに殺し合っている。この衝動が自然発生的なものか、誰か（あるいは何か）によって仕組まれたものか。
    quotes:
    - quote: 原初的な衝動――リビドーの命ずるがまま。あの女を手に入れろ。さもなくばお前に生きる価値は無い。
      paragraph: p4551
    expected_payoff: この暴走を止める鍵、あるいは暴走を引き起こした真の黒幕の登場。
