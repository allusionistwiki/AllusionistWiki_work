- canonical_target: '[[E_char_ユディーア]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0220_ユディーア_thinks_マルガリータ_p7313
        quote: 頼もしさに心が暖かくなるのを感じた。「よーし、あたしも頑張ろうっと」
        locator: {}
        spoiler_after: ch0220
      - event_ref: E_ch0220_ユディーア_thinks_戦略_p7313
        quote: 表舞台に上がらないのであれば、ゴーリーやレナリアを活用していく必要があった。本選における駒であるジュティアとミナの働きは未知数だ。打てる手は打っておくに越したことはない。我ながら用意周到、などと考えつつ
        locator: {}
        spoiler_after: ch0220
      - event_ref: E_ch0220_ユディーア_thinks_ロードデンドロン_p7318
        quote: これがパフォーマンスで、呪文戦の一種であることには誰もが気付いている。　悪趣味にもほどがある過激さ。一歩間違えれば戦争になりかねない危うさ。
        locator: {}
        spoiler_after: ch0220
      - event_ref: E_ch0220_ユディーア_thinks_ロードデンドロン_p7324
        quote: それはそれとして流れが見えてきたせいでムカついてきた。なんだこいつ。
        locator: {}
        spoiler_after: ch0220
      - event_ref: E_ch0220_ユディーア_thinks_ロードデンドロン_p7325
        quote: 「王になるつもりなんだね、この自己陶酔野郎」
        locator: {}
        spoiler_after: ch0220
      - event_ref: E_ch0220_ユディーア_says_ダサ_p7327
        quote: 「え、ダサ」
        locator: {}
        spoiler_after: ch0220
    action:
      observations:
      - event_ref: E_ch0220_ユディーア_uses_迷宮刑罰者_p7313
        quote: ニアホンとは別の端末を操作しながら近くの暗がりで待機させていた迷宮刑罰者に指示を出す。
        locator: {}
        spoiler_after: ch0220
      - event_ref: E_ch0220_ユディーア_observes_呪文_p7315
        quote: 夢想家の言葉、詩人の響き、そして役者の発声。　ユディーアのみならず、その場にいた呪文の心得がある者すべてが警戒したはずだ。　開戦の狼煙は既に上がっている。
        locator: {}
        spoiler_after: ch0220
    visual:
      observations:
      - event_ref: E_ch0220_ユディーア_observes_ミスマッチ_p7316
        quote: 目を疑うような、それは異質過ぎる取り合わせだった。　『拳銃を持ったティリビナ人』などというミスマッチを、誰が思い描くだろう？
        locator: {}
        spoiler_after: ch0220
      - event_ref: E_ch0220_ユディーア_observes_動画_p7320
        quote: ユディーアには気づいたことがある。　動画に登場しているのは子供や若者だけだ。年経た古株、大柄で枯葉を纏った老人たちはどこにも見当たらない。
        locator: {}
        spoiler_after: ch0220
      - event_ref: E_ch0220_ユディーア_other_エスト_p7323
        quote: 映し出されたのはユディーアにとって馴染み深い『仲間』の姿。
        locator: {}
        spoiler_after: ch0220
  first_appearance_candidate: true
