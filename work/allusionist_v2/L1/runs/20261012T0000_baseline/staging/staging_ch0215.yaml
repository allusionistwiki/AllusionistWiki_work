- canonical_target: '[[E_char_ミブリナ・ゾラ・クロウサー]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0215_ミブリナ・ゾラ・クロウサー_names_空使い選定レース_p7222
        quote: 『無目的』のミブリナ・ゾラ・クロウサーだ。 存在の否定と我の確信という矛盾した前提から導き出される『無への飛翔』を目指した大魔女は、生まれついての傲慢さからこう言い放った。「クロウサーが最速なのは当然。しかし血統に慢心するようでは『空使い』の名は早晩腐る。ゆえに私に挑むがいい、空に焦がれる地虫どもよ。私は枷と重しをつけ有象無象どもと同等の速度域に降りてやる。この条件下でもなおクロウサーこそが最速の技巧を誇るのだと証明してみせようではないか」
        locator: {}
        spoiler_after: ch0215
      - event_ref: E_ch0215_ミブリナ・ゾラ・クロウサー_asks_ダウザール_p7224
        quote: 「ダウザール。血脈の主導権を渡せ」 回答はにべもない。老人の嗄れた声が強い否定を返す。「拒否する。叛逆者パーン・ガレニスを今度こそ粛清しなければならない。この私が直々に手を下さねば因縁は断ち切れまい」「ならパーンを掃除した後でいい。私はリーナと飛んでみたい」「構わぬが、寄り代である肉の器とどうやって競うつもりだ？」
        locator: {}
        spoiler_after: ch0215
      - event_ref: E_ch0215_ミブリナ・ゾラ・クロウサー_hopes_自分を超える者_p7224
        quote: いつか、自分を超える者が現れるのではないかと。しかし待てど暮らせど弟子を鍛え人工生命や呪術機械を創造すれど自分以上の存在はついに現れず、悠久の時の中で彼女の意識は青い融血に呑み込まれていこうとしていた。
          そんな時だ。 リーナ・ゾラ・クロウサーが現れたのは。 これだ。これこそが望まれた流れだ。
        locator: {}
        spoiler_after: ch0215
    action:
      observations:
      - event_ref: E_ch0215_ミブリナ・ゾラ・クロウサー_makes_自分に有利なルール_p7223
        quote: 手の込んだルール整備は実際のところ、挑戦者たちが揃いも揃って因果を歪め、空間を渡り、速度の厳密な測定を拒み、時間さえあやふやにしようと画策したことで激怒したミブリナが練り上げた『自分に有利なルール』だったのだが、とにかく彼女はそのやり方で『空使い』の座を死守してみせた。
        locator: {}
        spoiler_after: ch0215
  first_appearance_candidate: true
