        locator: {}
        spoiler_after: ch0099
      - event_ref: E_ch0099_アルト_helps_太陰_p3608
        quote: 哀れに思ったアルト王は兎の為に、そして神々の図書館の再建のために、太陰に援助を行うことを決めた。
        locator: {}
        spoiler_after: ch0099
      - event_ref: E_ch0099_アルト_defeats_ダエモデク_p3610
