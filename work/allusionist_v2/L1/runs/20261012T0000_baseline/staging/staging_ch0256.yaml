- canonical_target: '[[E_char_チリアット]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0256_チリアット_saves_ユディーア_p8201
        quote: 加速ブルータ状態で疾駆したチリアット＝アテンプレクが魅了浄界から彼女を救出したのだ
        locator: {}
        spoiler_after: ch0256
      - event_ref: E_ch0256_チリアット_transforms_超加速状態_p8209
        quote: 死の恐怖に怯えた牙猪の目が血走り、彼の体感時間が引き伸ばされていく。三眼瞬知。超加速状態に突入したチリアットが疾走する
        locator: {}
        spoiler_after: ch0256
      - event_ref: E_ch0256_チリアット_other_右腕_p8214
        quote: 漆黒の右腕が膨張し、本体からは独立した動きでチリアットの口の中に突っ込んだ。即座に自切
        locator: {}
        spoiler_after: ch0256
      - event_ref: E_ch0256_チリアット_other_牙_p8215
        quote: 迷わずに己の下顎に残ったもう一本の牙を折り、ユディーアに向けて投擲。虚空で火花を散らして大気が焼き焦げていく。衝撃の後、同調を強いる無形の魔導書が霧散
        locator: {}
        spoiler_after: ch0256
      - event_ref: E_ch0256_チリアット_uses_牙_p8215
        quote: 見れば、チリアットは倒れた状態で下顎から伸びた牙を大地に突き刺していた。四肢が動かせない状態でも自由に呪力を込められる部位。それが牙や角や爪だ
        locator: {}
        spoiler_after: ch0256
    visual:
      observations:
      - event_ref: E_ch0256_チリアット_wounds_自身_p8201
        quote: ユディーアを抱えていた左腕の火傷と裂傷。背中にへばり付いた怨念呪詛。黒鱗に覆われた右拳の流血。男は見てわかる部分だけで三か所は負傷していた
        locator: {}
        spoiler_after: ch0256
    speech:
      observations:
      - event_ref: E_ch0256_チリアット_other_ディスケイム陣への逃走_p8207
        quote: ユディーア様。この場を離脱してディスケイムの陣に逃れましょう
        locator: {}
        spoiler_after: ch0256
  first_appearance_candidate: true
