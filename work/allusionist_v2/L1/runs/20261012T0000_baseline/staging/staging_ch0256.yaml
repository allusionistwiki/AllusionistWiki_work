- canonical_target: '[[E_char_イナータルゴ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0256_イナータルゴ_other_チリアット_p8205
        quote: 過去の後悔に起因するもの。別の対象への友愛を投影、血縁者、なるほど父親との交友関係、ならばこいつもディスケイムか。冥府への親和性から見てティーアードゥ型の二次加護持ちの天眼猪人。牙猪の特性は死の直視。恐怖を誘発条件にした三眼瞬知が得意技だな
        locator: {}
        spoiler_after: ch0256
      - event_ref: E_ch0256_イナータルゴ_other_呪術師たち_p8205
        quote: お前たち、殺意を消せ。手足は折ってもいい。呪術による捕縛に切り替える
        locator: {}
        spoiler_after: ch0256
      - event_ref: E_ch0256_イナータルゴ_other_トランクケース_p8208
        quote: 優先目標にあのトランクケースを追加だ。亜竜人と共にあれを奪取せよ
        locator: {}
        spoiler_after: ch0256
      - event_ref: E_ch0256_イナータルゴ_reveals_浄界加工技術_p8210
        quote: イナータルゴは浄界に対しての『加工技術』を持っている。それはつまり、敵対者の浄界に対して優位性を持つということでもあった
        locator: {}
        spoiler_after: ch0256
      - event_ref: E_ch0256_イナータルゴ_other_捕縛_p8212
        quote: だが、私は理性に逆らいあえて空気を読まないことにする。お前たちは捕縛し、私の管理下で封印する
        locator: {}
        spoiler_after: ch0256
    visual:
      observations:
      - event_ref: E_ch0256_イナータルゴ_appears_空の民_p8205
        quote: 大小の百目を禿頭に貼り付けた壮年男性。イナータルゴと呼ばれていた空の民が、胡坐の姿勢で上空に浮遊している
        locator: {}
        spoiler_after: ch0256
    action:
      observations:
      - event_ref: E_ch0256_イナータルゴ_other_チリアットの加速_p8209
        quote: 同じ速度域だ。ユディーアは思わず目を瞠った。百目の男イナータルゴが、チリアットと全く同じ加速倍率で行動している
        locator: {}
        spoiler_after: ch0256
      - event_ref: E_ch0256_イナータルゴ_uses_神経支配_p8211
        quote: 『神経支配』の呪術だ。生体電流の制御を行うことで自己の反応速度を強化する術だが、熟達した使い手は接触した生物の支配さえ可能とする
        locator: {}
        spoiler_after: ch0256
      - event_ref: E_ch0256_イナータルゴ_uses_魔導書化_p8211
        quote: 非言語的な関係性の気流、その乱雑さを魔導書化できる
        locator: {}
        spoiler_after: ch0256
      - event_ref: E_ch0256_イナータルゴ_uses_融血呪_p8213
        quote: そして紀なる光よ、形を成せ！　平伏せよ、世界を束ねるクロウサーの融血呪に！
        locator: {}
        spoiler_after: ch0256
