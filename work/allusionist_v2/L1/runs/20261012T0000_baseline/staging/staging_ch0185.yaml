- canonical_target: '[[E_char_シナモリアキラ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0185_シナモリアキラ_transforms_身体感覚_p6136
        quote: 手が遊離・分裂し、第五階層の至る所をがっちりと掴む。切り離されても身体の延長線上のまま、伸張された身体感覚が道路を、街頭を、監視水晶を、公共端末を、余さず覆い尽くしていった。
        locator: {}
        spoiler_after: ch0185
      - event_ref: E_ch0185_シナモリアキラ_uses_幻肢_p6136
        quote: 俺はその遊離する幻肢を呪術的端末として『幽体離脱』させてアストラル投射が可能になったが、思えばこれもトリシューラにとっては下準備だったのだろう。
        locator: {}
        spoiler_after: ch0185
      - event_ref: E_ch0185_シナモリアキラ_makes_公園_p6138
        quote: なにやらトリシューラとコルセスカが俺の意識に語りかけてきているようだ。二人の言葉に従って、俺は未開発の地区を選んで開発計画を実行。大枠の布地は『公園』に決定。
        locator: {}
        spoiler_after: ch0185
      - event_ref: E_ch0185_シナモリアキラ_makes_ライブシアター_p6141
        quote: 俺はアイドル時代の経験を生かし、まず呪術医院周辺をライブシアターへと大改造していく。戦場は戦場のまま、瘴気に満ちたおぞましい世界はそのままに。
        locator: {}
        spoiler_after: ch0185
      - event_ref: E_ch0185_シナモリアキラ_other_宝石_p6169
        quote: 事態を解決に導いてくれた空組、とりわけセリアック＝ニアに感謝しなくてはならない。彼女がこの第五階層にちりばめてくれた宝石を俺は確かに受け取った。
        locator: {}
        spoiler_after: ch0185
    speech:
      observations:
      - event_ref: E_ch0185_シナモリアキラ_confesses_裏切り_p6139
        quote: 「二人とも、俺は」
        locator: {}
        spoiler_after: ch0185
      - event_ref: E_ch0185_シナモリアキラ_thinks_無能_p6139
        quote: 俺は無能だ。砂場遊びすら満足にできない。もう自分のセンスを信じるのはやめて空間構築の細部はトリシューラやコルセスカに任せよう。
        locator: {}
        spoiler_after: ch0185
      - event_ref: E_ch0185_シナモリアキラ_other_グレンデルヒ_p6141
        quote: 「いや、髭太夫の知識を借りるからいい」
        locator: {}
        spoiler_after: ch0185
      - event_ref: E_ch0185_シナモリアキラ_asks_オルヴァ_p6142
        quote: 「お前の力が必要だ。あるだけ寄越せ、時空を統べる技の全てを！」
        locator: {}
        spoiler_after: ch0185
  first_appearance_candidate: true
