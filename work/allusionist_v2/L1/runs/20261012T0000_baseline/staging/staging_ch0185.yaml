      - event_ref: E_ch0185_トリシューラ_says_忘却なし_p6142
        quote: 「私にとっての過去は今の自分が認識できる過去。だって私に忘却は無い。歴史は記録で、等しく参照できるデータなんだもの。だから、私のスタンスは変わらない。過去でも現在でも未来でも、同じように進むだけ！」
        locator: {}
        spoiler_after: ch0185
      - event_ref: E_ch0185_トリシューラ_other_拡張_p6143
        quote: 「あっはは！ ねえリールエルバ、アキラくんの首孔を自分のサイズに広げて得意げにいきがってたけどさ、私の方がずっと致命的にアキラくんを拡張できる！
          さあ見せてあげようアキラくん。あの程度の不可逆変化じゃ、もう満足できない体なんだってことを！」
        locator: {}
        spoiler_after: ch0185
    action:
