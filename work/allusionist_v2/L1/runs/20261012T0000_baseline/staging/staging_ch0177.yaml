entities:
- canonical_target: '[[E_char_アズーリア]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0177_アズーリア_arrives_エルネトモラン特別区_p5866
        quote: 私はそんなことを願いながら、喧噪の中へと一歩足を踏み出した。
        locator: {}
        spoiler_after: ch0177
      - event_ref: E_ch0177_アズーリア_activates_金鎖_p5887
        quote: 怒りが弾けると同時、左手首を裏返す。跳ね上がった金色の鎖、その環が私の口元に到達すると同時、私は大口を開けた。素早く噛み砕く。お菓子のようにぱりんと砕け、言の葉の妖精が世界を改変する。対抗呪文――『静謐』が発動。
        locator: {}
        spoiler_after: ch0177
      - event_ref: E_ch0177_アズーリア_transforms_黒騎士_p5888
        quote: 足元の影と黒衣の内側から広がった闇が私を覆いつくし、漆黒の装甲となってアズーリア・ヘレゼクシュを一騎の英雄へと変質させていった。黒と青を基調とした全身鎧、頭部を雄々しく飾る鹿の角飾り、右手には厚みのない手斧――新型装甲は一瞬で私の動きに同調、最適化。
        locator: {}
        spoiler_after: ch0177
      - event_ref: E_ch0177_アズーリア_fights_白騎士_p5891
        quote: 叫ぶや否や、槍を押し退けて束縛呪術による牽制。斧による一撃は流れるような槍捌きで凌がれて、束縛呪術もあっさりと射程外へと逃げられて失敗。黒と白が空間の主導権を奪い合う。
        locator: {}
        spoiler_after: ch0177
      - event_ref: E_ch0177_アズーリア_gives_ナッツ入りチョコ_p5903
        quote: 「ちょっと用事があっただけ。もう終わりだから、片付けて撤収するけど」 振り返ると、そこにタマルがいた。午前中に出会った時と同じように、落ち着いた佇まい。どうやらテロの被害には遭わなかったらしい。ほっと胸を撫で下ろす。「どうしたの、スー。え、私にくれるの？」
          戸惑ったように包みを受け取るタマル。私がどうしても渡したかったのは、手作りのチョコレートなのだった。
        locator: {}
        spoiler_after: ch0177
    relationship:
      observations:
      - event_ref: E_ch0177_アズーリア_bonds_エスト_p5868
        quote: 「無事に開催できてよかったね、エスト」「うん。アズーリアが手伝ってくれたおかげ」 二人、音を立てて手を合わせる。
        locator: {}
        spoiler_after: ch0177
    speech:
      observations:
      - event_ref: E_ch0177_アズーリア_says_言理の妖精_p5870
        quote: 「言理の妖精」「語りて曰く」 不安と期待を込めた、形だけのおまじない。具体的な願いがないからことばはすぐに解けて消えてしまったけれど、今はそれだけで良かった。
        locator: {}
        spoiler_after: ch0177
      - event_ref: E_ch0177_アズーリア_asks_タマル_p5876
        quote: 『呪文使い』としての好奇心が不安を打ち消していた。「あのっ、すごかったです、今の。どうやって彼とお話したんですか」
        locator: {}
        spoiler_after: ch0177
      - event_ref: E_ch0177_アズーリア_says_スー_p5876
        quote: しかも無意識に良くない癖が出てしまった。ちかごろ名前が売れてきたせいで名乗ると面倒だからアズーリアじゃなくてスーって名乗るようにしているのだ。
        locator: {}
        spoiler_after: ch0177
      - event_ref: E_ch0177_アズーリア_says_呪文_p5904
        quote: 「甘さもお菓子も夢物語も、現実に存在する言葉と想いだよ。不用意なんかじゃない。慎重で綿密な、現実で戦うための理想――私はそう考えてる」「そう。呪文ね、それは」「うん、そう。私は呪文に希望を託すの」
        locator: {}
        spoiler_after: ch0177
    visual:
      observations:
      - event_ref: E_ch0177_アズーリア_observes_黒檀の民の広告_p5882
        quote: 検索――黒檀の民が出ている広告幻像。端末の上に立体的に表示されたのは黒檀の民。有名な陸上競技選手の姿だ。躍動感溢れる疾走で、運動靴が最高のパフォーマンスを発揮していることを示す。音楽に乗せて謳われる文句は『ワイルド』『パワフル』『野性』『力強い』などなど。
        locator: {}
        spoiler_after: ch0177
  first_appearance_candidate: true
