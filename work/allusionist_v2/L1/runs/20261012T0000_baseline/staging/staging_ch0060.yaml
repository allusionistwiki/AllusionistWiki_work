- canonical_target: '[[E_char_セリアック＝ニア]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0060_セリアック＝ニア_names_アズーリア_p2255
        quote: 「アズーリア？」　その名前は誰もが知らないものだったが、それがマリーの事であると即座に承認され、認識は共有された。　それが私にとって最も相応しい名前であるのだと、誰もが最初から知っていたようにアズーリアという名前が世界に確定し――他者による宣名という変則的な手続きを経て、私はその存在を強固にしていく。
        locator: {}
        spoiler_after: ch0060
    action:
      observations:
      - event_ref: E_ch0060_セリアック＝ニア_fights_フィリス_p2259
        quote: 「よくもお姉様を！　と姉様が仰っています。セリアもそう思います」　その瞬間だけはただの追従ではなく、本心からの怒りを滲ませてセリアック＝ニアが言い放った。
        locator: {}
        spoiler_after: ch0060
  first_appearance_candidate: true
- canonical_target: '[[E_char_ディスペータ]]'
  entity_type: character
  aspects:
