- canonical_target: '[[E_char_メイファーラ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0060_メイファーラ_carries_ヴァージリア_p2261
        quote: メイファーラが何かをしきりに口にしているが、それはどうしてか無音だった。　先程までのやりとりは、無音の映像に後でメートリアンから教えてもらった音声を当て嵌めて再構成した記憶なのだ。
        locator: {}
