- canonical_target: '[[E_char_黒百合の子供たち]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0060_黒百合の子供たち_uses_対抗呪文_p2267
        quote: それから、私たちは頷き合うと、声を揃えて歌い始めた。　それは呪文。　絶望を塗り替えて希望へと導く、呪いへの対抗呪文。　高らかに歌われた言葉が黒百合宮に響いていくと、黒百合の子供たちが元の姿に戻っていく。
        locator: {}
        spoiler_after: ch0060
      - event_ref: E_ch0060_黒百合の子供たち_uses_フィリスの分散封印_p2273
        quote: 唱和する声と共に、それぞれの身体にフィリスの一部が吸い込まれていく。　全員が何度もフィリスに干渉していたからこそ可能な手段だった。　強力な魔将の力を分解して、少しずつ負担を受け持つ事によって、フィリスの浸食を食い止める。
        locator: {}
        spoiler_after: ch0060
  first_appearance_candidate: true
