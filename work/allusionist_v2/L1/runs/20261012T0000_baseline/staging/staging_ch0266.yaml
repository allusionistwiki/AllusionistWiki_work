entities:
- canonical_target: '[[E_char_メートリアン]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0266_メートリアン_appears_舞台_p8365
        quote: （クロウサーの王女リーナと巫女メートリアン、上手から舞台に登場）
        locator: {}
        spoiler_after: ch0266
    speech:
      observations:
      - event_ref: E_ch0266_メートリアン_says_死者の姿_p8365
        quote: 「何を驚くことがありましょう。あなたが生者のまま冥府に足を踏み入れたように、私は死者のまま生者の姿をとったまでのこと。この洞穴の外に広がる死人の森にて、魂の巡るさまを見守る神々が黄泉路の案内をしてくださり、このとおり私はあなたの前に姿を現すことが叶いました。
        locator: {}
        spoiler_after: ch0266
      - event_ref: E_ch0266_メートリアン_says_神々への祈り_p8365
        quote: 「まずはじめに、偉大なる神々のうち、こうしてお祈りを捧げますのは、この黄泉路に導いて下さったシナモリアキラ様、その次にはルウテト様、そして我が肉を土くれから捏ね上げて下さったペレケテンヌル様。
          輝かしき神々から神託を授けられたガロアンディアンの女王は、ペラティア神殿が健在であった頃から続く由緒ある祝祭を蘇らせましたが、数々の祭事のうちで最も苛烈な箒駆け、かのレメス神の戦車競技のごとく、黄泉路を下るこの葬列に我が妹が加わっていると聞き及び、いてもたってもいられずに参った次第」
        locator: {}
        spoiler_after: ch0266
      - event_ref: E_ch0266_メートリアン_says_引き返す命令_p8366
        quote: 「いいですかリーナ、すぐにこの黄泉路を引き返しなさい。失われた過去の悲しみに浸るばかりで目の前のことをおろそかにして何になります？ クロウサーの主よ、老いた亡霊の言いなりになるばかりでは、あなたは傀儡も同然です！」
        locator: {}
        spoiler_after: ch0266
      - event_ref: E_ch0266_メートリアン_says_自由への誘い_p8367
        quote: 「いいえ、リーナは奈落に向かうべきではありません。偽りの慰めを求めるのはやめなさい。顔を上げて、光を見つめるのです！ 自由は地の底にはないのだから。自由は空の向こうにあるのだから」
        locator: {}
        spoiler_after: ch0266
      - event_ref: E_ch0266_メートリアン_says_黄泉の掟の警告_p8368
        quote: 「そうしたいのであれば、もう咎めますまい。よくお聞きなさい、死人の声を。ですが、黄泉の掟はひとつきりではありません。忘れてはおりますまい、我が手が掴む死人の森の断章、その叡智の深きことを」
        locator: {}
        spoiler_after: ch0266
      - event_ref: E_ch0266_メートリアン_says_呪文の座_p8371
        quote: 「わたしたちは呪文の座。言の葉ならば、むなしきそらであろうとも、虚ろな空であろうとも、過去に遺し、今に伝えることができるのだから」
        locator: {}
        spoiler_after: ch0266
    action:
      observations:
      - event_ref: E_ch0266_メートリアン_makes_ガルズの演じ_p8369
        quote: （メートリアンがコロスに合流し、照明が当たる。断章を手に、黒布を被り、死人を率いる男を演じる）
        locator: {}
        spoiler_after: ch0266
  first_appearance_candidate: true
- canonical_target: '[[E_char_リーナ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0266_リーナ_appears_舞台_p8365
        quote: （クロウサーの王女リーナと巫女メートリアン、上手から舞台に登場）
        locator: {}
        spoiler_after: ch0266
    speech:
      observations:
      - event_ref: E_ch0266_リーナ_says_姉の無事_p8365
        quote: 「いったいこれはどうしたことだろう！ 憎きパーンに命を奪われた姉を、暗き冥府の底より救い出さんと奈落へと赴いてみたところ、まさに我が姉、白きメートリアンの無事な姿を目にしようとは！」
        locator: {}
        spoiler_after: ch0266
      - event_ref: E_ch0266_リーナ_says_民草への慈悲_p8367
        quote: 「雲上人とは民を良く導き、慈悲の心をもって治めるもの。空を統べる者たらんとするならば、目先の王冠ではなく足下の民草を見るべきと存じまする。哀れな魂たちよ、なにか望むことはありますか？
          救いを求めるならば、私にできることを教えて下さい」
        locator: {}
        spoiler_after: ch0266
      - event_ref: E_ch0266_リーナ_says_ガルズへの想い_p8368
        quote: 「ああ、ガルズ！ 懐かしい彼の声を、もうどれだけ聞いていないだろう」
        locator: {}
        spoiler_after: ch0266
      - event_ref: E_ch0266_リーナ_says_帰ってくる愛_p8370
        quote: 「いいえ、私は今まさに、すっかり目を開き、なすべきことを知りました。私の愛がただうつろに響くばかりでなく、うつろからも帰ってくる愛があるのだと、はっきりとわかったのです」
        locator: {}
        spoiler_after: ch0266
      - event_ref: E_ch0266_リーナ_says_生と死の意味への不安_p8370
        quote: 「死んだはずの方々が、私の前に現れて口々に目を覚ませとおっしゃる。私は愛する人たちを蘇らせたいと願っているけれど、望みがこうも容易く覆り、生と死の全てがまやかしだと言われては、いったい生きることや死ぬことにどんな意味があるのかと不安になってしまいます。果たして本当に全てがむなしいのであれば、私がこうして箒にまたがる意味とはなんなのでしょう」
        locator: {}
        spoiler_after: ch0266
      - event_ref: E_ch0266_リーナ_says_言理の妖精_p8371
        quote: 「この魂が重力の虜囚となり、この肉体が地の底に呪縛されたとしても、紡ぐ言葉まで奪うことは叶いますまい。言の葉とは沈黙の中にさえ生じるもの。空を駆け、光のように宙を舞うもの。私はその名をよく知っている。過去より現れ、今に伝えるための妖精たちの名を！
          言理の妖精語りて曰く、台詞だけで飛べばいいっ！」
        locator: {}
        spoiler_after: ch0266
  first_appearance_candidate: true
- canonical_target: '[[E_org_コロス]]'
  entity_type: organization
  aspects:
    visual:
      observations:
      - event_ref: E_ch0266_コロス_appears_舞台_p8366
        quote: （冥府を下る大勢の精子たちからなる合唱隊、白布を被り、宙吊り台に乗って登場）
        locator: {}
        spoiler_after: ch0266
    speech:
      observations:
      - event_ref: E_ch0266_コロス_says_悲しみの歌_p8366
        quote: 「我ら黄泉路に降り注ぎ、しとしと泣き濡れる徒労の雫。 ああ、この悲しみの深さといったら！ いかにして慰めを得ようか。 ああ、この雨の冷たさといったら！
          いかにして暖を取ろうか。 晴れた空に虹が架かろうと、深き暗闇に底はない。 天つ神レメスよ、黄泉つ神アキラよ、我らに道を示したまえ。 門はいずこか。都市はいずこか。祭壇に捧ぐ供物はいずこの倉から持ち出そうか」
        locator: {}
        spoiler_after: ch0266
      - event_ref: E_ch0266_コロス_says_眠りと目覚めの掟_p8368
        quote: 「人の世のむなしさよ、恐れ満ちる生の終わりよ。 ハザーリャによって定められた、眠りの掟を聞くがよい。 地の底のさびしさよ、懐かしき歌の終わりよ。
          レメスによって定められた、目覚めの掟を聞くがよい。 さすれば、虹の橋を渡った先に、愛する故郷を見つけるであろう」
        locator: {}
        spoiler_after: ch0266
      - event_ref: E_ch0266_コロス_says_ルウテトへの祈り_p8369
        quote: 「天つ神レメスよ、黄泉つ神ルウテトよ、我らに道を示したまえ。 門はいずこか。森はいずこか。祭壇に捧ぐ供物はいずこの倉から持ち出そうか」
        locator: {}
        spoiler_after: ch0266
  first_appearance_candidate: true
- canonical_target: '[[E_char_コロスの長]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0266_コロスの長_says_地上の惨状_p8366
        quote: 「むなしさゆえに。黄泉を騒がす祭りに負けじと、天神レメスは美酒を池に注ぎ、肉を林にひっかけ、地上の至る所で肉欲の限りを尽くしております。されど我らはその栄光から零れ落ちた亡者に過ぎぬ。生まれることもできぬ命は芽吹きもせずに消えゆくばかり。ああまったく、ひどい目にあったもの」
        locator: {}
        spoiler_after: ch0266
      - event_ref: E_ch0266_コロスの長_says_慰めへの渇望_p8367
        quote: 「決して我らはあなた様に多くを望みはしません。ただこの暗闇に参ったのは、ささやかな光を求めてのこと。地底は死人のふるさと、過ぎ去りし王国。歌と芝居が過去を呼び起こすこの地であれば、心震わす慰めが得られるかもしれませぬ。黄泉路の旅人、哀れなリーナよ、それはあなたも同じでしょう？
          失ったものを思い出してごらんなさい！」
        locator: {}
        spoiler_after: ch0266
  first_appearance_candidate: true
- canonical_target: '[[E_char_ダウザール]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0266_ダウザール_appears_舞台_p8367
        quote: （クロウサーの王ダウザール、下手から登場）
        locator: {}
        spoiler_after: ch0266
    speech:
      observations:
      - event_ref: E_ch0266_ダウザール_says_亡者の誘惑への警告_p8367
        quote: 「ゾラの娘よ、暗がりから響く声に惑わされてはならぬ。黄泉路を彷徨う亡者どもは甘き誘惑を囁くが、それは全てお前を墓の下へと引きずり込まんがためのはかりごと。我らを導く天神レメスへの信仰を忘れるな」
        locator: {}
        spoiler_after: ch0266
      - event_ref: E_ch0266_ダウザール_says_奈落への誘導_p8367
        quote: 「偉大なる血族の父祖たちに倣い、奈落に向かうのだ。さすればお前は失った愛を取り戻せるであろう。愛する姉、愛する男、愛する家族の全てを！
          見よ、この雨こそは男の愛。お前に血脈を繋ぐ歓びを教える祝福の雨である」
        locator: {}
        spoiler_after: ch0266
      - event_ref: E_ch0266_ダウザール_says_凱旋と家庭_p8368
        quote: 「冥府下りの偉業を果たせば、お前の愛するガルズも喜ぶだろう。蘇ったまことの姉と共に凱旋し、恋人とあたたかな家庭を築くがよい」
        locator: {}
        spoiler_after: ch0266
      - event_ref: E_ch0266_ダウザール_says_茶番の終了と宿命_p8370
        quote: 「ならぬ、ならぬぞ！ このような茶番はもうたくさんだ！ 歌も芝居も既に無用、暗がりの舞台は役目を終えた。黄泉路への道行きは半ばを越えて、降り注ぐ種は奈落に播かれている。獣が孕み、花が孕み、石が孕み、世界が卵を産むその時は目の前だ。リーナよ、愛しき母よ！
          その魂は既に闇に浸されておる。まじないの声がどれだけお前の意思を覆そうと、もはやその血はこの場より抜け出すことなど叶わぬと知れい！ さあさ、観念して我らの大願を果たすがよいぞ」
        locator: {}
        spoiler_after: ch0266
    action:
      observations:
      - event_ref: E_ch0266_ダウザール_makes_コロスの平伏_p8368
        quote: （ダウザールが手を振って合図をすると、コロスが一斉にその場に平伏す）
        locator: {}
        spoiler_after: ch0266
  first_appearance_candidate: true
- canonical_target: '[[E_char_ガルズ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0266_ガルズ_says_まやかしの意味_p8369
        quote: 「さよう、この身はまやかし。されどそらごとにも意味はある！」
        locator: {}
        spoiler_after: ch0266
      - event_ref: E_ch0266_ガルズ_says_決闘の申し出_p8369
        quote: 「門を開け、道を拓け！ このガルズの金色の瞳が見ている限り、死者が偽りを申すことは許されぬ！ それに加えて、黄泉路を歩む者を操り人形の如く弄ぶ狼藉、我が父祖ダウザールと言えどもまことに看過しがたく、不遜と知りつつも諫言申し上げ、聞き入れられぬのであれば決闘の申し込みにて神々の裁定を求むる所存」
        locator: {}
        spoiler_after: ch0266
      - event_ref: E_ch0266_ガルズ_says_言の葉の力_p8370
        quote: 「私にそれはわかりませぬ。こうして巫女の身体を借りて蘇ってはみたものの、死人を呼ぶ呪文とはつまるところ過去に遺された言の葉をかき集めただけのもの。舞台の上、芝居の台詞のひとかけらにしがみついたわずかな魂を届ける程度のまじないに過ぎないのです。
          ですが、リーナ。過去は今に続き、進んでいくものです。過ぎ行く時の中で、後ろや暗がりを見て、俯いてばかりいてはその澄んだ目もやがては曇ってしまうでしょう。私たちはそれを望まない。あなたには、空と笑顔が似合っている」
        locator: {}
        spoiler_after: ch0266
      - event_ref: E_ch0266_ガルズ_says_自由な意思_p8371
        quote: 「もはや自由な意思を阻むものは何もない。君を、信じているよ」
        locator: {}
        spoiler_after: ch0266
    action:
      observations:
      - event_ref: E_ch0266_ガルズ_makes_断章の固定_p8371
        quote: （ガルズ、リーナと共に断章を掲げて空中に固定する。二人は奈落へと沈んでいく）
        locator: {}
        spoiler_after: ch0266
  first_appearance_candidate: true
