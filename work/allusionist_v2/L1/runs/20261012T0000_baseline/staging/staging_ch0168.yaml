        locator: {}
        spoiler_after: ch0168
      - event_ref: E_ch0168_サイバーカラテ道場_reveals_親密圏_p5624
        quote: 『サイバーカラテ道場』が導き出した親密圏の測定は、白骨妊婦の距離感がギタリストとベーシストの双方と極めて近い事実を示していた。
        locator: {}
        spoiler_after: ch0168
  first_appearance_candidate: true
- canonical_target: '[[E_char_冷凍睡眠者]]'
