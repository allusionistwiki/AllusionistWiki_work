entities:
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0168_アキラ_uses_サイバーカラテ道場_p5612
        quote: 『道場』の予測に従って空に浮かぶドーナツを足場に跳躍、空を泳ぐイルカたちに飛び乗った。
        locator: {}
        spoiler_after: ch0168
      - event_ref: E_ch0168_アキラ_uses_ゲストアカウント_p5613
        quote: 俺はいま、ゲストアカウントでこの夢に参加している。目的は二つ。ひとつは日中に夢見人から頼まれた問題を解決するため。もうひとつは『サイバーカラテ道場』と競合する可能性がある『朱色の夢』の内情を探り、先人から良い部分を盗――いや学びとるためだ。
        locator: {}
        spoiler_after: ch0168
      - event_ref: E_ch0168_アキラ_uses_パーソナルスペースデータ_p5619
        quote: 「偏見発言はやめろ。まあただ、ふるまいとバンドメンバーとの距離感がちょいひっかかるな――ちびシューラ、うちのユーザーのパーソナルスペースデータとあの四人とを比較できるか？
          カップルの平均的な親密圏を図りたい」
        locator: {}
        spoiler_after: ch0168
    speech:
      observations:
      - event_ref: E_ch0168_アキラ_observes_朱色の夢_p5613
        quote: 「アストラルネットとは違うんだよな」（似て非なるものだね。シューラも入れるのが面白いところ！）見た通り、これは夢だ。
        locator: {}
        spoiler_after: ch0168
      - event_ref: E_ch0168_アキラ_thinks_搾取_p5614
        quote: 哀れな獲物たちは自らが持つ創造性を少しずつ搾取されている。そんな意地の悪い見方もできなくはない。
        locator: {}
        spoiler_after: ch0168
      - event_ref: E_ch0168_アキラ_thinks_クレイ_p5626
        quote: だとすると、ひとつ疑問が残る。なぜクレイは生まれてきたのか。あるいは、クレイだけが純粋な再生者として存在できる理由があるのか。
        locator: {}
        spoiler_after: ch0168
  first_appearance_candidate: true
