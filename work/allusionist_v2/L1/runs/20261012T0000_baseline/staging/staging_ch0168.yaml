        locator: {}
        spoiler_after: ch0168
      - event_ref: E_ch0168_オルヴァ_says_再生者の必然_p5626
        quote: 「選択権を与えられた再生者の赤子たちは必ずその答えに辿り着く――彼らは、彼らを宿した命の母よりも冥府というより大いなる母を選ぶのだ。そう、必ず。絶対にだ。例外は無い」
        locator: {}
        spoiler_after: ch0168
    visual:
      observations:
