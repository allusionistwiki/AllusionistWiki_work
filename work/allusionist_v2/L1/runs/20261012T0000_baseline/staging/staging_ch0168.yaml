        spoiler_after: ch0168
      - event_ref: E_ch0168_オルヴァ_other_カシュラム王_p5625
        quote: 絶好調のカシュラム王が少年期青年期老年期全ての姿を使って嘆きを演出する。
        locator: {}
        spoiler_after: ch0168
