- canonical_target: '[[E_char_クロウ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0216_クロウ_uses_霊薬_p7235
        quote: 己の翼で飛翔する鳥人は霊薬によるドーピングがもたらす『肉体の力』で、複座式マジックミサイルはアヴロノたちが持つ『自然の力』で加速を続け、文明を無効化するハイマンの妨害を潜り抜けていく。
        locator: {}
        spoiler_after: ch0216
    speech:
      observations:
      - event_ref: E_ch0216_クロウ_other_エキゾチックエフェクト_p7238
        quote: 「エキゾチックエフェクト狙いかよ！」 後先を考えずに突撃を敢行しようとしていたクロウが悔しそうに叫ぶ。
        locator: {}
        spoiler_after: ch0216
  first_appearance_candidate: true
- canonical_target: '[[E_char_ジュティア]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0216_ジュティア_other_マジックミサイル_p7235
        quote: 複座式マジックミサイルで加速を続けるジュティアとミナ。猛追をものともせず、ティリビナ人はトップを譲らない。
        locator: {}
        spoiler_after: ch0216
    speech:
      observations:
      - event_ref: E_ch0216_ジュティア_observes_ロードデンドロンの箒_p7236
        quote: 「ジュティアちゃん！ あれ改造してあるよ、フツーの木製のやつじゃない！」「どういう改造？ 樹木神の加護なら天使認定を利用して同格の妖クニー精神ぶつけるけど」「んー、なんかキモいの！
          キノコとか生えてて、虫がキノコと箒にくっついてる感じ！ うわっ、動いてる生きてるなんかこっち見てるゾワゾワする～！」
        locator: {}
        spoiler_after: ch0216
  first_appearance_candidate: true
- canonical_target: '[[E_char_ハイマン]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0216_ハイマン_activates_文明拒絶の力_p7235
        quote: 黒曜騎士ハイマンが展開した文明を拒絶する力により、多くの選手たちは減速を余儀なくされた。
        locator: {}
        spoiler_after: ch0216
      - event_ref: E_ch0216_ハイマン_other_機体_p7237
        quote: 爆発する呪力の風が吹き荒れる中、幾多の妨害に晒された黒曜騎士は体勢を崩し、機体をクラッシュさせた。
        locator: {}
        spoiler_after: ch0216
  first_appearance_candidate: true
- canonical_target: '[[E_char_ロードデンドロン]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0216_ロードデンドロン_other_非杖的飛翔者_p7235
        quote: ハイマンの妨害によって一気に前に躍り出た非『杖』的な手段で飛翔する者たちの争いは、ティリビナ人のロードデンドロンを中心とした展開となりつつあった。
        locator: {}
        spoiler_after: ch0216
      - event_ref: E_ch0216_ロードデンドロン_other_未知の言語_p7237
        quote: サーキットが振動する。風に乗って未知の呪力が世界を塗り替えていく。 歌だ。知らない響き、理解できない音の羅列。
        locator: {}
        spoiler_after: ch0216
      - event_ref: E_ch0216_ロードデンドロン_other_飛躍の門_p7238
        quote: 歓声によって勢いがついたティリビナ人の前方に輝く環が形成されていく。 それは空飛ぶキノコ。フライングマッシュルームなどと呼ばれる幻想の菌糸だ。
          それらが環を描き、門となってロードデンドロンを待ち受ける。
        locator: {}
        spoiler_after: ch0216
      - event_ref: E_ch0216_ロードデンドロン_defeats_アサブ_p7243
        quote: 瞬間、歌うティリビナ人の腕が鋭く閃いた。 何が起きたのか、ユディーアの目をもってしても捉えきれなかった。 確かなことは、砂の精霊が勢いを失ってただの塵と化したこと。
          黒檀の民がよろめいて落下していったことだけだ。
        locator: {}
        spoiler_after: ch0216
      - event_ref: E_ch0216_ロードデンドロン_other_門_p7245
        quote: ティリビナ人の歌はこの場に相応しい文脈を踏まえた加速呪文だったのだ。 その理解が聴衆に浸透した瞬間、ロードデンドロンが纏っていた風が二位と三位を大きく突き放す。前方に形成された門を一瞬で潜り抜けたティリビナ人は『飛躍』する。
        locator: {}
        spoiler_after: ch0216
    visual:
      observations:
      - event_ref: E_ch0216_ロードデンドロン_has_property_異様な速度_p7236
        quote: ティリビナ人が速すぎる。近代箒の在り方と逆行するかのような昔ながらの木製箒にあるまじき異様な速度だった。
        locator: {}
        spoiler_after: ch0216
    speech:
      observations:
      - event_ref: E_ch0216_ロードデンドロン_reveals_伝承_p7244
        quote: 正確には、断片的な意味が周囲に伝わり始めていたのだ。 理解不能な現象。 風の温度が上昇する。ティリビナ人を取り巻いていた未知なる空気、知らないものに対する恐れや興味がその色彩を変えていく。
          それは伝承だった。古い信仰、神への祈り。 大いなる母、あらゆる恵みをもたらす春への喜び。 祝祭の祈り。
        locator: {}
        spoiler_after: ch0216
  first_appearance_candidate: true
- canonical_target: '[[E_term_叙述回路]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch0216_叙述回路_functions_as_物語の舞台_p7235
        quote: 叙述回路を物語が巡る。 サーキットを走る選手たち、そのひとりひとりが回想を開始。箒の上から彼ら自身の実体を『空』にしていく。停滞した現在の記述にかわって箒が乗せるのは『負けられない理由』である。
        locator: {}
        spoiler_after: ch0216
  first_appearance_candidate: true
- canonical_target: '[[E_char_ユディーア]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0216_ユディーア_other_対ハイマン同盟_p7236
        quote: その更に後ろ、後方集団の中に紛れたユディーアは手の中で銀貨を弄んでいた。 『暗躍』『策略家』『悪役』『トリックスター』あたりの文脈を充填しながら併走する後方集団をまとめて手勢に引き入れて『対ハイマン同盟』を一時的に結成。
        locator: {}
        spoiler_after: ch0216
      - event_ref: E_ch0216_ユディーア_uses_悪役カード_p7236
        quote: 真剣勝負を穢す『結託した集団』の最大派閥として『悪役』のカードを切る。
        locator: {}
        spoiler_after: ch0216
      - event_ref: E_ch0216_ユディーア_other_亡き幼馴染への弔い_p7237
        quote: ユディーアも亡き幼馴染への弔いというそれっぽい過去を匂わせつつ仇への憎悪を燃やして加速する。
        locator: {}
        spoiler_after: ch0216
      - event_ref: E_ch0216_ユディーア_uses_ジュティアとミナ_p7241
        quote: ジュティアとミナに波乱に満ちた過去の戦場を回想させながら砂嵐を乗り切ってもらう。二人でいることには大きな意味がある。会話による絆の強調や自然体でのやりとりによる歴戦の探索者であることのアピール。
        locator: {}
        spoiler_after: ch0216
      - event_ref: E_ch0216_ユディーア_other_オルガンローデ_p7242
        quote: 後方集団を買収、指示したのは単純な呪文詠唱。 大人数による大規模な儀式呪術がユディーアひとりに物語の流れを注ぎ込む。 オルゴーの滅びの呪文。
        locator: {}
        spoiler_after: ch0216
      - event_ref: E_ch0216_ユディーア_other_マジックミサイル_p7242
        quote: ぐんぐんと加速していくユディーアはついに二位争いをしている集団に追いつき、その勢いで二人乗りのマジックミサイルに追い付いた。
        locator: {}
        spoiler_after: ch0216
    name:
      observations:
      - event_ref: E_ch0216_ユディーア_uses_にっこりゴーリー_p7237
        quote: ユディーアは『にっこりゴーリー』という迷宮刑罰者たちのボス、ならず者集団の名を背負って出場していた。
        locator: {}
        spoiler_after: ch0216
    speech:
      observations:
      - event_ref: E_ch0216_ユディーア_promises_賞金分配_p7242
        quote: ライバルたちの想いを胸に、勝利した暁には賞金を分配すると約束して飛翔するユディーアを、巨大な呪文が包み込んでいく。
        locator: {}
        spoiler_after: ch0216
      - event_ref: E_ch0216_ユディーア_other_結果_p7248
        quote: 上位三名。こちらを振り向いて何とも言えない表情をしている二人組との間に横たわるのは気まずい沈黙。ユディーアは瞬きして口を開いた。「えっ？」
        locator: {}
        spoiler_after: ch0216
  first_appearance_candidate: true
- canonical_target: '[[E_org_鉄願の民]]'
  entity_type: organization
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch0216_鉄願の民_has_property_杖無効化_p7236
        quote: 鉄願の民が持つ『杖』を無効化する力は極めて強力だが、このような自然由来の呪術には完全に無力だ。
        locator: {}
        spoiler_after: ch0216
  first_appearance_candidate: true
- canonical_target: '[[E_term_使い魔]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch0216_使い魔_defines_人間関係_p7237
        quote: だが『使い魔』の真髄は『人間関係』だ。 関係性を結ぶ相手が強く在る必要はない。選択肢の多さも強さのひとつ。
        locator: {}
        spoiler_after: ch0216
  first_appearance_candidate: true
- canonical_target: '[[E_term_飛躍]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch0216_飛躍_defines_勝敗の鍵_p7238
        quote: 飛翔にワープスピードを与える飛躍の門。 歌速レギュレーションにおける華。テキストベースサーキットではこの『飛躍』によってどれだけ『勝つ流れ』を手繰り寄せられるかによって勝敗が決すると言っても過言ではない。
        locator: {}
        spoiler_after: ch0216
  first_appearance_candidate: true
- canonical_target: '[[E_char_アサブ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0216_アサブ_attacks_ロードデンドロン_p7240
        quote: 彼は勝利など望んでいない。完全にロードデンドロン個人を狙って妨害しようとしているだけなのだ。
        locator: {}
        spoiler_after: ch0216
      - event_ref: E_ch0216_アサブ_uses_砂の精霊_p7240
        quote: 黒い肌の男がほとんど動いていない箒を担いで飛翔している。 速い。既に鳥人の横に並んでいる。 彼に速度を与えているのは箒ではない。本来であれば清められるはずの対象、浄化によって速度を生み出す『穢れ』が、箒の一時的な機能停止によって凝縮されていた。
        locator: {}
        spoiler_after: ch0216
      - event_ref: E_ch0216_アサブ_attacks_ロードデンドロン_p7243
        quote: 激しく動く砂の風を纏った拳を振りかぶり、嵐の如き打撃を加えようとする。
        locator: {}
        spoiler_after: ch0216
    speech:
      observations:
      - event_ref: E_ch0216_アサブ_other_観客_p7240
        quote: 黒檀の民は前方の『枯れ木野郎』と罵声を浴びせながら加速し、観客からのブーイングを背に受けながら大炎上する。 政治的に望ましくない差別発言は意図的な挑発だ。
        locator: {}
        spoiler_after: ch0216
  first_appearance_candidate: true
- canonical_target: '[[E_char_黒マント]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0216_黒マント_appears_ダークホース戦略_p7245
        quote: 抜かれた。予兆や気配を一切感じさせない圧倒的な『劇的』が全てを一変させた。 オルガンローデの威圧感にも怯まず、その真横を更に強大な呪力を纏って飛翔していく選手がいた。夜の民さながらの黒マントで全身を隠した典型的な『ダークホース戦略』。
        locator: {}
        spoiler_after: ch0216
      - event_ref: E_ch0216_黒マント_uses_オルゴーの滅びの呪文_p7246
        quote: 自分が纏った集団構築オルガンローデを遥かに凌駕する強度の呪文竜による大飛躍。 個人で実現可能な規模としては破格のそれは、呪文的な精度や複雑さにおいてハルベルトが用いるような優れたものには遠く及ばない。
          にもかかわらず、それは明らかにユディーアが知るどんなオルガンローデよりも力強かった。
        locator: {}
        spoiler_after: ch0216
      - event_ref: E_ch0216_黒マント_other_レース_p7247
        quote: 竜の如き神話的飛翔で全ての参加者を抜き去った巫女が、トップを独走していたロードデンドロンに並び、ほぼ同時にゴールする。
        locator: {}
        spoiler_after: ch0216
    visual:
      observations:
      - event_ref: E_ch0216_黒マント_has_property_シェイドラン_p7246
        quote: 箒に刻まれたエンブレムが輝き影を走らせる。スポンサーは『シェイドラン』。
        locator: {}
        spoiler_after: ch0216
      - event_ref: E_ch0216_黒マント_has_property_竜導師の祭服_p7246
        quote: 驚嘆すべき加速を続ける女、その華奢な身体が纏っているのは大きく改造されてはいるが、ユディーアが良く知る『竜導師』の祭服。 それも創世竜の神託を受ける者だけが身に着けることを許された巫女服だった。
        locator: {}
        spoiler_after: ch0216
    symbolic:
      observations:
      - event_ref: E_ch0216_黒マント_defines_主役_p7247
        quote: 全ての物語を強引に完結させる圧倒的な存在感。 このレースは彼女の活躍を引き立てるためにあったのだと万人に思わせる疾走。 決着は確定した。語るべきことは語られた。
          他の選手たちは余白や数行の地の文で次々とゴールしたとだけ記されて終わり。
        locator: {}
        spoiler_after: ch0216
  first_appearance_candidate: true
