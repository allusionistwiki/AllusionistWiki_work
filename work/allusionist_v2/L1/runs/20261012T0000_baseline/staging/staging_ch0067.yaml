  entity_type: item
  aspects:
    visual:
      observations:
      - event_ref: E_ch0067_ディルガッハ_wears_試作型神働装甲四型_p2511
        quote: 試作型神働装甲四型。　魚に変形するその甲冑は、アストラル界においても同様に変形してアバター代わりの強力な機体となる。
        locator: {}
        spoiler_after: ch0067
  first_appearance_candidate: true
- canonical_target: '[[E_relation_歌姫]]'
  entity_type: relationship
  aspects:
    action:
      observations:
      - event_ref: E_ch0067_歌姫_fights_アケルグリュスとハルハハール_p2511
        quote: 斧槍を持った黒ウサギが、巨大な蝶と有翼人魚という実世界そのままの魔将と互角以上に戦闘を繰り広げていた。
        locator: {}
        spoiler_after: ch0067
      - event_ref: E_ch0067_歌姫_defeats_ドルメイス_p2515
        quote: そして、筆致探査によって正確に攻撃位置を特定した斧槍がドルメイスのアストラル体を貫通した。「へ？」　一瞬にして侵入される。　赤い魔導書が物理的に【焚書】され、神働装甲が機能停止してただの鋼鉄の棺桶となる。
        locator: {}
        spoiler_after: ch0067
  first_appearance_candidate: true
- canonical_target: '[[E_relation_ボガール]]'
  entity_type: relationship
  aspects:
    speech:
      observations:
      - event_ref: E_ch0067_ボガール_betrays_槍神教_p2512
        quote: 「雌伏の時は終わった。決起するぞディルガッハ。偉大なる精霊たちを皆殺しにしたおぞましきデーデェイアを守護天使などと言って崇めさせられる屈辱の時代を、我らが終わらせるのだ！」
        locator: {}
        spoiler_after: ch0067
  first_appearance_candidate: true
- canonical_target: '[[E_relation_ドルメイス]]'
  entity_type: relationship
  aspects:
    action:
      observations:
      - event_ref: E_ch0067_ドルメイス_attacks_歌姫_p2513
        quote: 無数の文字列が赤く発光し、ドルメイスのいる場所から何度も迂回を繰り返し、複数の地点を経由して空中を走っていく。　文字列は炎となって戦場に突き進み、圧倒的な破壊をもたらした。
        locator: {}
        spoiler_after: ch0067
    name:
      observations:
      - event_ref: E_ch0067_ドルメイス_has_property_炎上使い_p2513
        quote: 序列四十位のドルメイスは【炎上使い】として知られていた。　対象の精神を焼く高位呪術【炎上】はもちろん使えるが、アストラルネット上で工作した結果としての【炎上】の方が得意である。
        locator: {}
        spoiler_after: ch0067
