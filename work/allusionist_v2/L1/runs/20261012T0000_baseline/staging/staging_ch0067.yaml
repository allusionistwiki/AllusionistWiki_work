- canonical_target: '[[E_char_エスフェイル]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0067_エスフェイル_attacks_セリアック＝ニア_p2492
        quote: 「くははははは！　どうしたどうした、ぬるいぞ小娘ぇっ！　片腕一本でこれとは、少々情けないのではないかなぁ？」　　剛腕が一閃され、セリアック＝ニアは吹き飛ばされる。
        locator: {}
        spoiler_after: ch0067
      - event_ref: E_ch0067_エスフェイル_activates_影の呪文円_p2496
        quote: エスフェイルは棘まみれの棍棒となった右腕を自らの影に突き刺した。　途端、無数の影が棘のように大地を走り、セリアック＝ニアの周囲に黒い線を引いていく。
        locator: {}
        spoiler_after: ch0067
      - event_ref: E_ch0067_エスフェイル_attacks_セリアック＝ニア_p2497
        quote: 気力のみで起き上がった彼女の小さな頭部を左手が鷲掴みにして外壁に叩きつける。
        locator: {}
        spoiler_after: ch0067
      - event_ref: E_ch0067_エスフェイル_other_玲瓏_p2497
        quote: '「逆さまに天を衝け――【玲瓏】」

          ルナティック

          　セリアック＝ニアの真下から、凄まじい呪力と閃光が立ち上った。'
        locator: {}
        spoiler_after: ch0067
      - event_ref: E_ch0067_エスフェイル_kills_ディムズ兄弟_p2499
        quote: 途端、エスフェイルを攻撃していたディムズ兄弟団が一斉に倒れる。　鎧や長衣の隙間から流血しており、全員が絶命していた。
        locator: {}
        spoiler_after: ch0067
      - event_ref: E_ch0067_エスフェイル_activates_陥穽_p2510
        quote: 'エスフェイルによる独自の改変が施された影による【陥穽】。

          エンスネア

          「さらばだ。高純度の呪波汚染に曝されて姉妹揃って影に沈むがいい」'
        locator: {}
        spoiler_after: ch0067
    visual:
      observations:
      - event_ref: E_ch0067_エスフェイル_has_property_黒棘の右腕_p2492
        quote: 直立二足歩行する狼は、右腕のみを漆黒の黒棘で包み込んで武器としている。
        locator: {}
        spoiler_after: ch0067
      - event_ref: E_ch0067_エスフェイル_has_property_体毛による触手_p2495
        quote: ふさふさとした茶色の毛並み、その全てがエスフェイルの触手である。
        locator: {}
        spoiler_after: ch0067
      - event_ref: E_ch0067_エスフェイル_transforms_異形の姿_p2504
        quote: 少女の身体の下には模造の月。　その前面から狼の頭部が迫り出し、右手側からは黒い触手、左手側からは霊長類めいた闇色の左手が生える。　後部からは鋭い黒棘が連なったような　長い尾が伸びていた。
        locator: {}
        spoiler_after: ch0067
    speech:
      observations:
      - event_ref: E_ch0067_エスフェイル_has_property_万能の超高位呪術師_p2496
        quote: 人狼であるエスフェイルは、呪文と杖に特に秀で、邪視と使い魔の適性まで有する上に近接戦闘もこなせる万能の超高位呪術師だ。
        locator: {}
        spoiler_after: ch0067
      - event_ref: E_ch0067_エスフェイル_has_property_体毛の防御構造_p2496
        quote: 全身の体毛を硬質化、更に縦に三層構造に変異させる。外部の呪力に反応して尖端部である第三層を分離。それを確認した第二層が瞬時に危機を信号として我が体細胞群に伝達、肉体は反射としてプログラムされた回避行動を選択する。最終的に第一層が肉体の防御と体毛の再生を同時に実行するというわけだ
        locator: {}
        spoiler_after: ch0067
      - event_ref: E_ch0067_エスフェイル_reveals_セリアック＝ニアの出自_p2506
        quote: 「名前を呼んでも実感が湧かぬか、所詮は偽物の姫よな。猫の取り替え子――生まれたばかりのセリアック＝ニアは異世界である【万猫殿】に攫われ、貴様と取り替えられた――猫が憑いた貴様とな。はてさて、貴様は一体何なのだろうな？　セリアック＝ニアとして育てられたナーグストールか？　それともナーグストールを宿した他の何かかね？」
        locator: {}
        spoiler_after: ch0067
      - event_ref: E_ch0067_エスフェイル_attacks_セリアック＝ニアの精神_p2507
        quote: 「自己の立ち位置すら定められず、他者に依存するばかりの脆弱な寄生精神、それが貴様だ。そしてその依存先すら極めて不安定な紛い物ときた。笑わせてくれるなあああ？　貴様の本質である名とは『トリシル＝リールエルバの付属品』よ。そして不安定なその足場は既に崩れている」
        locator: {}
        spoiler_after: ch0067
  first_appearance_candidate: true
- canonical_target: '[[E_char_セリアック＝ニア]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0067_セリアック＝ニア_fights_エスフェイル_p2492
        quote: セリアック＝ニアは苦戦していた。　戦いが成立していたのは、ほとんど奇跡にも等しい僥倖である。　第十五魔将にして人狼の長、エスフェイル。
        locator: {}
        spoiler_after: ch0067
      - event_ref: E_ch0067_セリアック＝ニア_makes_ナーグストール_p2493
        quote: 「ナーグストール！」　セリアック＝ニアは壁面を殴りつけ、砕けた建材を球体に変化させる。彼女の動きに連動するように、球体が連結したような巨大人体模型が壁を粉砕していた。
        locator: {}
        spoiler_after: ch0067
      - event_ref: E_ch0067_セリアック＝ニア_makes_呪宝石弾_p2493
        quote: セリアック＝ニアは先程手に握っておいた球体を完全に宝石化させた。　呪石弾。それも、精緻に加工された高位の呪宝石弾である。
        locator: {}
        spoiler_after: ch0067
      - event_ref: E_ch0067_セリアック＝ニア_uses_夜の民の弱点知識_p2493
        quote: '夜の民の弱点を知悉しているセリアック＝ニアは最適な呪文を瞬

          時に選択して呪宝石を創り出す。'
        locator: {}
        spoiler_after: ch0067
      - event_ref: E_ch0067_セリアック＝ニア_makes_肉塊球の使い魔_p2508
        quote: 球状の肉塊は、呪術抵抗の低い前衛職を個別に球化させた後、中に後衛や神官、使節などを詰め込み、その周囲を球化した前衛たちで固めて全体を繋げるという手間を掛けて作成した使い魔である。
        locator: {}
        spoiler_after: ch0067
      - event_ref: E_ch0067_セリアック＝ニア_uses_呪術のバグ_p2509
        quote: 対象の呪術抵抗を無視して、『球体にする』というプロセスが既に完了していると見なされるのである。　呪術というのは、その体系の中で一連の流れを正常なものとして認識しようとする。それゆえにバグも発生しやすいのだが、これはそれを利用した小技であった。
        locator: {}
        spoiler_after: ch0067
    visual:
      observations:
      - event_ref: E_ch0067_セリアック＝ニア_has_property_チェンジリングの怪力_p2492
        quote: '細腕からは想像もつかない猫の取り替え子特有の

          チェンジリング

          怪力。常人を超える瞬発力。'
        locator: {}
        spoiler_after: ch0067
    speech:
      observations:
      - event_ref: E_ch0067_セリアック＝ニア_has_property_夜の民の呪術知識_p2492
        quote: ドラトリアというマロゾロンドの加護を利用した技術の研究が盛んな国で王族として育ったセリアック＝ニアは、当然のように夜の民が使える呪術に関する詳しい知識を有していた。
        locator: {}
        spoiler_after: ch0067
      - event_ref: E_ch0067_セリアック＝ニア_has_property_三工程の能力_p2493
        quote: セリアック＝ニアの攻撃は三工程に分かれる。　物体を爪で斬りつけるか殴りつけることで対象の球化を行う第一工程。　球体を宝石に加工する第二工程。　そして任意の呪文を封じ込めた呪宝石を一斉に炸裂させる第三工程。
        locator: {}
        spoiler_after: ch0067
  first_appearance_candidate: true
