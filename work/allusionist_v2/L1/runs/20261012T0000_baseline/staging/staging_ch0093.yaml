- canonical_target: '[[E_char_少女]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0093_少女_asks_牙猪_p3454
        quote: 「可哀想な狼さん。こんなにたくさん苦しんで。ねえ、そこの方、どうかお願いです。この子を救ってあげられるのは、あなただけ」
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_少女_reveals_目撃_p3454
        quote: 「私たちは――いつかの私は見ていました。あなたがこの子の命を断ち切る瞬間を。大切な命を奪ったところを。ねえ、この子に命を返してあげることはできませんか？」
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_少女_asks_牙猪の生死_p3455
        quote: 「まあ、それではあなたは、死んだ事がおありなのですね」
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_少女_asks_生死の非対称性_p3456
        quote: 「私にはわかりません。生きている人は死んでいる人になれるのに、死んでいる人は生きている人になれないの？ それは、なんだか不思議な感じだわ」
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_少女_reveals_死者の声_p3456
        quote: 「私には、死者の声が聞こえるのです」
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_少女_other_狼の遺言_p3456
        quote: 「死にたくない。もっと生きていたい。仲間たちを助けに行きたい。地上に置いてきた、傷付いた親友のことが心配だ。辛い役目を、あなたに背負わせたくない」
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_少女_reveals_自身の記憶喪失_p3457
        quote: 「気がついた時、私はこの森にいた。自分の名前さえわからなかった。覚えているのは、遠くから響く言葉と、強い黒百合の香りと、色褪せた思い出の欠片だけ。ねえ、あなたはどちらからやってきたの？」
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_少女_other_協力_p3458
        quote: 「私にも手伝えることはないかしら。苦しんでいる人を見捨てたくはないもの。この子も、あなたも」
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_少女_other_アキラ_p3461
        quote: 「アキラッ！」
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_少女_promises_同行_p3464
        quote: 「それでは参りましょうか。困難な旅路も、二人で力を合わせればきっと最後まで歩き通せるはず」
        locator: {}
        spoiler_after: ch0093
    action:
      observations:
      - event_ref: E_ch0093_少女_other_牙猪_p3462
        quote: 「大丈夫。怖くない、怖くないですよ」「う、うう、本当、本当に？」「ええ。あなたは悪くありません。あなたが本当はとっても優しい人だということは、ちゃんとわかってますからね。だから落ち着いて、ね？」
        locator: {}
        spoiler_after: ch0093
  first_appearance_candidate: true
- canonical_target: '[[E_char_牙猪]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0093_牙猪_other_傲慢な行い_p3455
        quote: 「確かに俺は、今ここに生きている分際で、傲慢な行いをした。だがそれでも、俺は彼の苦しむ声を無視できなかった」
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_牙猪_confesses_殺害の動機_p3455
        quote: 「違う、俺は、彼を楽にしてやろうとしたんだ！ そのまま生きていることが苦しいと彼が、カインが言うから、仕方無く！」
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_牙猪_other_出身_p3457
        quote: 「俺は、遠いところから来た」
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_牙猪_promises_狼の救出と少女の帰郷_p3464
        quote: 「よろしく頼む――先程の礼も含め、必ずや彼を救い、君のふるさとを見つけて見せるとも」
        locator: {}
        spoiler_after: ch0093
    action:
      observations:
      - event_ref: E_ch0093_牙猪_other_取り返しのつかない罪_p3456
        quote: 「ああ、そうだ。俺は間違っていた。だが、他にどうすればよかった？ 俺はこれからどうすればいい？ 俺には一度奪った命を返すことなんてできない！
          もう取り返しがつかないことなんだ！」
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_牙猪_other_狼の屍_p3457
        quote: 牙猪は横たわる屍に近寄ると、恐る恐るといったふうに手を伸ばした。最初に右手を出そうとして、それから一度手を引っ込めて、今度は左手を伸ばす。
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_牙猪_attacks_ティーアードゥ_p3460
        quote: 牙猪が口から吐き出した黒い靄がティーアードゥに襲いかかる。たまらず両手で顔を覆う神は、そのまま地面へと叩きつけられてしまう。
        locator: {}
        spoiler_after: ch0093
    visual:
      observations:
      - event_ref: E_ch0093_牙猪_transforms_右腕_p3460
        quote: 牙猪の目から涙がこぼれ落ちると同時、右腕が膨張し、黒々とした肉腫に包まれた。かと思うとそれは瞬時に漆黒の鱗に覆われた蜥蜴のような腕となる。
        locator: {}
        spoiler_after: ch0093
  first_appearance_candidate: true
- canonical_target: '[[E_char_ティーアードゥ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0093_ティーアードゥ_appears_罰神_p3458
        quote: 機械仕掛けより現れたのは、この世のものとは思えぬ美貌を有した女性とも男性ともつかぬ人物だった。新たに現れたその人物は浮遊しており、大仰な機械仕掛けから伸びる目に見えない糸で吊されているようにも見えた。
        locator: {}
        spoiler_after: ch0093
    speech:
      observations:
      - event_ref: E_ch0093_ティーアードゥ_names_自身_p3458
        quote: 「私は罪人を裁く荒々しき罰神、ティーアードゥ。生者の法を統べる秩序の神。平伏せよ、罪深き牙猪よ！ お前は罪なき者の命を奪った大罪人である！」
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_ティーアードゥ_other_罰_p3459
        quote: 「その、牙！ お前の目の前に伸び上がる、禍々しき槍。それこそは、お前が生きているという罪そのもの。それは伸び続け、やがてお前の脳天を貫くであろう。それこそがお前が生きている事に対する罰である。死ぬまでの時間を、存分に生きて苦しむが良い」
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_ティーアードゥ_other_贖罪の機会_p3462
        quote: 「罪深き人の子よ。心よりその罪を悔いるならば、お前に機会を与えよう」
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_ティーアードゥ_other_牙猪_p3463
        quote: 「まずは北へ行け。その獣道を進み、川を下るのだ。さすればヒュールサスという国に出るだろう。かの国は我が兄弟たる生と死の神が住まう聖地。お前たちの求めるものはその地にある」
        locator: {}
        spoiler_after: ch0093
    action:
      observations:
      - event_ref: E_ch0093_ティーアードゥ_other_牙猪_p3459
        quote: 不可思議な光が牙猪に当たったかと思うと、その湾曲した牙がひとりでに輝き始める。すると、淡く発光する牙はわずかに伸張し、猪の頭部により近付いた。
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_ティーアードゥ_attacks_牙猪_p3461
        quote: 雷光のように踏み込んだティーアードゥは刃の平の部分で牙で守られていない、頭部の中心をしたたかに打ち据えた。
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_ティーアードゥ_takes_狼の屍_p3463
        quote: 「この哀れな屍は私が引き取ろう。この者の魂を救う術を見つけ出し、浄罪の月に戻ってくるのだ。さすれば私がお前に道を示そうではないか」
        locator: {}
        spoiler_after: ch0093
  first_appearance_candidate: true
