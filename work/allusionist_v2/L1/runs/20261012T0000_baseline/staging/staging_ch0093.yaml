entities:
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0093_アキラ_thinks_舞台への没入_p3453
        quote: 台本に書かれていた筋書きを思い出しながら、俺もまた舞台の上という世界に没入する。かくして、過去を演じるという時間旅行が始まった。
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_アキラ_other_妄想の妖精_p3467
        quote: 結局俺は、チリアットに主導権を委ねた。肝心な所では介入するつもりだが、基本的には彼の左腕として、また脳内に寄生する【妄想の妖精】として振る舞う。
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_アキラ_thinks_カイン_p3467
        quote: 今は舞台裏を上手から回り込んでチリアットの傍にまで来ているカインのことだ。人懐っこい犬のように、落ち込んだ牙猪の足に頭をすり寄せている。慰めてくれているのだろうか。
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_アキラ_other_チリアットの感情_p3468
        quote: チリアットの、千々に乱れた感情。争いに向いた性質に反するかのように弱々しい心。嵐のように俺を殴りつける異質な思考、こちらの共感を強要するかのような巨大な感情の濁流。
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_アキラ_other_グレンデルヒ討伐_p3468
        quote: あの二人に巡り会えたという望外の幸運に安堵して、同時に強く思う。グレンデルヒを倒し、二人を必ず助け出さなくてはならない。
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_アキラ_other_トリシューラへの想い_p3469
        quote: だとしても、古くさい神などに膝を屈したいとは思わない。俺が跪く相手は既に決めているのだから。
        locator: {}
        spoiler_after: ch0093
    speech:
      observations:
      - event_ref: E_ch0093_アキラ_confesses_チリアット_p3465
        quote: 「すまぬ、師範代、すまぬ、コルセスカ殿！」
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_アキラ_other_役割分担_p3467
        quote: 「――基本的には、師範代は『思考台本』を読み上げてくれるだけです。他はほぼ俺に一任してくれとります。もちろん、先程のように左腕は完全に師範代のものですが」
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_アキラ_says_コルセスカ_p3469
        quote: 「だとしたら、その罰を与えるべきは神なんかじゃなくてトリシューラだろ。裁かれたいなら、まずあいつを助けてからだ」
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_アキラ_names_自身_p3470
        quote: これからは、そうだな。ちびアキラとでも呼んでくれ。よろしくね、チリアットくん！
        locator: {}
        spoiler_after: ch0093
  first_appearance_candidate: true
- canonical_target: '[[E_char_コルセスカ]]'
  entity_type: character
  aspects:
