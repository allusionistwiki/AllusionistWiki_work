- canonical_target: '[[E_char_ヴィヴィ＝イヴロス]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0093_ヴィヴィ＝イヴロス_other_第四の壁_p3466
        quote: 「ちなみにこの世界にドーランという言葉は無く、完全に私たちの趣味でしかない。異世界語の参照という、ね。漢字で胴乱という当て字を用いることすらある。というわけで、賢明なる読者、観客の皆々様方におかれましてはそこの所をご了承いただきたい」
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_ヴィヴィ＝イヴロス_asks_アキラ_p3467
        quote: 「さて、シナモリ・アキラ。今、主導権はどちらにある？」「で、アキラ。君は何だ、『宿主』を尊重するあまりに役者ではなくプロンプターになったというわけか？
          私に何の断りも無く？」
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_ヴィヴィ＝イヴロス_other_演出の失敗_p3468
        quote: 「まあ、こちらの役のチョイスもまずかったのは認めよう。『史実』を重視したとはいえ、君の運命を過度に思い出させてしまう演出ではあった」
        locator: {}
        spoiler_after: ch0093
  first_appearance_candidate: true
- canonical_target: '[[E_char_チリアット]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0093_チリアット_other_ティーアードゥ_p3468
        quote: 「すまぬ師範代。せめて、与えられた役目は果たして見せよう。もうあんな失態はさらさぬ。この牙と、我が神ティーアードゥに誓う」
        locator: {}
        spoiler_after: ch0093
      - event_ref: E_ch0093_チリアット_other_アキラ_p3470
        quote: 「ぬぅ、薄気味悪いですぞ、師範代」
        locator: {}
        spoiler_after: ch0093
  first_appearance_candidate: true
