      - event_ref: E_ch0093_コルセスカ_transforms_役柄_p3453
        quote: コルセスカは見慣れない幼さでうっすらとした微笑みを作り、そして表情を切り替える。そこにいるのは、既にコルセスカではありえない。
        locator: {}
        spoiler_after: ch0093
    speech:
      observations:
      - event_ref: E_ch0093_コルセスカ_other_ヴィヴィの奇行_p3466
        quote: 「ああ、あれはヴィヴィお姉様の癖といいますか。時折、ああやって何も無い所から観客が見ているという設定で語り始めるのですよ。どうやら『この世界は劇である』という認識を強固にするための儀式のようです」
        locator: {}
        spoiler_after: ch0093
  first_appearance_candidate: true
