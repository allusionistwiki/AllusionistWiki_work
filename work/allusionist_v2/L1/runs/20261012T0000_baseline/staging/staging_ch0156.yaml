        spoiler_after: ch0156
      - event_ref: E_ch0156_レストロオセ_other_シナモリアキラの獲得_p5288
        quote: 「わたくし、今回は趣向を凝らしてみようかと思います。『シナモリアキラ』をひとつ、いただきますわ。そろそろ古びてきたわたくしを更新します」
        locator: {}
        spoiler_after: ch0156
      - event_ref: E_ch0156_レストロオセ_says_死の欲動の肯定_p5289
        quote: 「こちらの台詞ですわ。俺は死の欲動を肯定し、祝福する」
        locator: {}
        spoiler_after: ch0156
    action:
      observations:
