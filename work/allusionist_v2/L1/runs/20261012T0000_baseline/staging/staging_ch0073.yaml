      observations:
      - event_ref: E_ch0073_ハザーリャ_appears_世界槍_p2719
        quote: 序列十三位――つまりは異獣の天使ハザーリャは深海を司ると言われている。細かい網目状の海綿質繊維によって構成された身体が次元を引き裂いて出現し
        locator: {}
        spoiler_after: ch0073
  first_appearance_candidate: true
- canonical_target: '[[E_term_死者]]'
  entity_type: terminology
  aspects:
    action:
      observations:
      - event_ref: E_ch0073_死者_appears_エルネトモラン_p2719
        quote: 死者が蘇り、過去が現在と混濁しつつある第一階層――エルネトモランは、混沌とした狂騒に満ちていた。天地から溢れる死者たちは実体、非実体を問わずに地上に次々と出現していき
        locator: {}
        spoiler_after: ch0073
  first_appearance_candidate: true
- canonical_target: '[[E_term_世界槍]]'
  entity_type: terminology
  aspects:
    visual:
      observations:
      - event_ref: E_ch0073_世界槍_has_property_自己相似形_p2720
        quote: 正方形をより小さい合同な正方形に九分割し、中央の正方形を取り除く。同じ処理をそれぞれ残りの八つの正方形に適用していくことで、自己相似な形を作り上げ続けているのである。
        locator: {}
        spoiler_after: ch0073
  first_appearance_candidate: true
- canonical_target: '[[E_char_アズーリア]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0073_アズーリア_transforms_半幻獣形態_p2721
        quote: 神働装甲を変形させながら新たな形態に変身する。
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_アズーリア_observes_青空_p2777
        quote: だから、せめてこの瞬間だけは地上の空を目に焼き付けておこうと、私は首が痛くなってもずっと空を見続けた。 いつまでも。 祈るように。
        locator: {}
        spoiler_after: ch0073
    action:
      observations:
      - event_ref: E_ch0073_アズーリア_binds_エスフェイル_p2723
        quote: 束縛に成功する。呪文を断ち切る致命の剣、【言理の真葉】が光り輝くが、影の束縛は維持されたままだ。
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_アズーリア_uses_闇の静謐_p2724
        quote: ミルーニャ＝メートリアンが開発した【闇の静謐】が、黒百合の子供たちの協力によって更に強化されて私に力を与えていた。「その呪術は、もう効かない」
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_アズーリア_uses_連関合成_p2740
        quote: 私は瞬時に狙いを理解して、左手の中にかろうじて残留していた藍色、緑色、黄色の三色を繋ぎ合わせる。
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_アズーリア_uses_フィリス_p2744
        quote: 私は、左手に残された最後の金鎖、その九つ目を割り砕く。メイファーラの力を参照して、灰色の光を左手に収束させる。
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_アズーリア_uses_フィリス_p2754
        quote: フィリスがその本領を発揮する。 世界の色調が反転して、白が黒に、明が暗に、次々に切り替わっていく。
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_アズーリア_uses_幻想の再構築_p2757
        quote: 私の左手が、世界に響く歌声が。 幻想を解体し、再構築する。 異獣をまつろわせ、人という枠組みの中に組み入れる。 哲学的ゾンビを鉄願の民に。枯れ木族をティリビナの民に。
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_アズーリア_takes_マリー_p2762
        quote: けれど、私は天高く飛翔して、左手でマリーを掴んだ。 消えかけたマリーを、マリーだった私という類似した存在に重ねる。 仮想使い魔として再構成された私たちは、とても似ている。
          だから、同一であるとみなすことも可能だ。
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_アズーリア_uses_ペリドット_p2762
        quote: 私は、左手に目が痛くなるような黄緑の稲妻色が宿るのを確認して、斧槍を伝う色彩を天に解き放った。 限界を超えてフィリスを行使して、幻想韻雷の雷が死の奔流、創生竜の吐息を押し留める。
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_アズーリア_uses_万色彩星_p2768
        quote: 青い翼を広げ、枝角に呪力を纏わせ、斧槍から稲妻を迸らせる。 そして左手には、夥しい数の色、色、色。「言理の妖精語りて曰く――【万色彩星】」
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_アズーリア_uses_瑠璃彩星_p2770
        quote: 鎧の腕が稼いだ一瞬が、私の左手を空の色に染め上げた。「射影即興喜劇――瑠璃彩星」
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_アズーリア_kills_クルエクローキ_p2771
        quote: 膨れあがった幻想の刃が斧槍から溢れ出し、守護竜クルエクローキの口から入って目と目の間を通り脳を断ち切り首を裂いて鱗を砕き翼を吹き飛ばし心臓を始めとした臓器を蹂躙し尾へと抜けていった。
        locator: {}
        spoiler_after: ch0073
    speech:
      observations:
      - event_ref: E_ch0073_アズーリア_says_哲学的ゾンビ_p2745
        quote: 「全ての人を哲学的ゾンビにすると貴方は言った。それは地上の理ではアストラル体が無い事が『死』と見なされるから。貴方たちは生ける死人という異獣として迫害され続けてきた。異獣は殺してもいいから」
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_アズーリア_says_アストラル体_p2748
        quote: 「私は新しくアストラル体を獲得なんかしていなかった。それは知識で理解していた色彩という言葉や物理的な光を、新しい様式で再解釈したというだけ。方法が違うだけで、参照先は同じ。」
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_アズーリア_says_言震_p2749
        quote: 「地上と地獄。地上と天獄。二つの世界に存在する視座の違いとギャップ。それが全ての原因。遠い過去に起きた言震が、人類と哲学的ゾンビを分断してしまった」
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_アズーリア_says_マリーの行為_p2752
        quote: 貴方はただ杖使いとして死をありのままの死として受け止めた。そして、ガルズの世界を守ったんだ」
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_アズーリア_says_死の受容_p2752
        quote: 「死者の言葉を代弁なんかしたら、その世界観は揺らいでしまう。貴方はただ杖使いとして死をありのままの死として受け止めた。そして、ガルズの世界を守ったんだ」
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_アズーリア_other_救い_p2753
