- canonical_target: '[[E_char_ヲルヲーラ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0073_ヲルヲーラ_appears_マリー_p2717
        quote: ねじくれた角と翼を持ったどぎつい色の【猫】。こことは違う世界からやってきた、審判者を名乗る存在。
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_ヲルヲーラ_appears_エルネトモラン_p2734
        quote: 世界槍内部を突き破って現れたそれは、途方も無く巨大な翼を持つ【猫】だ。無数の小さな翼猫が隙間無く組み合わさって構成された大規模な群体。
        locator: {}
        spoiler_after: ch0073
    speech:
      observations:
      - event_ref: E_ch0073_ヲルヲーラ_threatens_ガルズ_p2717
        quote: 『このまま地上に挑めば、【右目】は確実に死ぬでしょう』
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_ヲルヲーラ_threatens_人類_p2735
        quote: 『原始的な土人の皆さんには我々の導きに従っていただきます。序列化というあなた方のルール、槍神教の正しさを、更なる正義で修正して最適化して差し上げましょう。』
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_ヲルヲーラ_activates_世界の修正力_p2759
        quote: 『まだです！ この為に、緻密な誘導を繰り返して餌を地上に運んだのですから。世界の修正力は言震の火種を見逃さない！ 決定的な瞬間が訪れる前に、秩序を守護する世界法則に下らない呪文を破壊してもらいましょう！』
        locator: {}
        spoiler_after: ch0073
    action:
      observations:
      - event_ref: E_ch0073_ヲルヲーラ_other_ゲルシェネスナ_p2739
        quote: 『無駄です』翼猫の群体は、究極の一撃を真正面から受け止めた。炸裂した威力に耐えきったわけではない。あれは、歌姫の呪文の性質に干渉して書き換えているのだ。
        locator: {}
        spoiler_after: ch0073
  first_appearance_candidate: true
