episode: ch0073
created: '2026-10-10'
status: pending_merge
entities:
- canonical_target: '[[E_term_お姉様]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch0073_お姉様_asks_色とは何か_p2709
        quote: 「さてマリー。色とは何でしょうか？」
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_お姉様_says_災厄と運命_p2711
        quote: 「貴方の持つ巨大な運命を狙って、これから災厄が貴方を襲い、確実な死をもたらすでしょう。それを阻止するために、私は貴方の存在を揺らがせる」
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_お姉様_names_猫に名付けられた名前_p2712
        quote: 借用したその『猫に名付けられた名前』が、災厄の矛先をずらす助けになればいいのですが。
        locator: {}
        spoiler_after: ch0073
    visual:
      observations:
      - event_ref: E_ch0073_お姉様_has_property_色_p2709
        quote: 色が無いのは、狭い世界の中で一番大きな存在であった『お姉様』もだ。
        locator: {}
        spoiler_after: ch0073
    action:
      observations:
      - event_ref: E_ch0073_お姉様_teaches_色と光_p2710
        quote: そして、色についての勉強。光についての勉強。杖における自然科学的な説明と、邪視や呪文における人文科学的な説明の両面から学び
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_お姉様_activates_振り子_p2711
        quote: そして、絶えず姿を変える振り子のとがった先端を（次の瞬間には丸くなっていた）こつんとこちらの額に当ててくる。
        locator: {}
        spoiler_after: ch0073
  first_appearance_candidate: true
- canonical_target: '[[E_char_マリー]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0073_マリー_remembers_地底の一室_p2709
        quote: そこは、色の無い地底にある閉じられた一室。『彼女』は、そこで育てられた。
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_マリー_thinks_色の不在_p2709
        quote: だって、『マリー』の育った世界には色が無い。色彩の無い大地の底。
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_マリー_other_感動_p2713
        quote: 胸に、感動が溢れていく。世界には未知が溢れている。知識だけでは得られなかった、この感覚はなんだろう？
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_マリー_says_湖中穴からの投棄_p2714
        quote: 「えるねともらん？ なる都市の一番高い位置にある第一区とやらにいるとかいないとか。なーんか、小さな私を不憫に思って湖中穴から投棄したとかなんとか」
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_マリー_thinks_殺すこと_p2715
        quote: 楽にしてあげることこそ正しさだと判断して仲間たちを『殺してあげた』。
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_マリー_says_全人類のゾンビ化_p2733
        quote: 「みんなを殺すけど、ガルズを殺さない方法。私が、ガルズと一緒にいられない理由。それを全部、壊します――全人類を、哲学的ゾンビにする。そうして、『本物よりも優れた偽物』であるアリスお姉様に世界を救ってもらうんです」
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_マリー_says_色の感じ_p2746
        quote: 「否定します。私だって色のない地底都市の地下室で育てられました。私は色について全ての事を教えられてから色を知ったけれど、新しい事なんて学んでいません！
          全ては脳内で発生している物理的な反応でしかない」
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_マリー_says_ガルズの世界観_p2747
        quote: 「邪視はまやかしですが、唯一肯定できる邪視があるとすればそれはガルズの世界観だけっ！」
        locator: {}
        spoiler_after: ch0073
    action:
      observations:
      - event_ref: E_ch0073_マリー_arrives_地上_p2712
        quote: 視界の端から端まで振り子が移動して、次に目が覚めたとき、知らない場所にいた。空が青い。太陽が眩しい。
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_マリー_transforms_アストラル体_p2713
        quote: 肉体と重なるもう一つの体――アストラル体が形成されていく。エーテル体、魂魄、体内呪力――そうした『地上人にとっての当たり前』が次々と備わっていき
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_マリー_kills_仲間たち_p2715
        quote: 『マリー』は苦しむばかりのリオンを、殺してくれと懇願するギザンを、槌で潰して、鑿で貫いた。
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_マリー_breaks_アストラル体_p2716
        quote: 最後に残っていた骨花の使い魔に自分を攻撃させて、アストラル体を粉々に砕いた『マリー』は、そうして色々なものを失った。
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_マリー_fights_クナータ_p2718
        quote: 【骨組みの花】副長であるマリーは、乱戦の中、たった一人で聖女クナータに挑み、あっけなく敗れて死に行く中で、今が『その時』なのだと確信した。
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_マリー_transforms_ズタークスターク_p2718
        quote: それは転生。『沼女』として復活を果たしたマリー＝ズタークスタークが、地上に閃光を撒き散らす。
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_マリー_dies_クナータ_p2730
        quote: 聖女クナータの神働術を受けた者は、既に死んでいたことになってしまうのだ。
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_マリー_uses_思考の根茎_p2747
        quote: 頭部から放たれる呪文の雷撃は、沼女として再構成された脳内で発生している電気信号を増幅して呪文として放つ呪術、【思考の根茎】だ。
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_マリー_stops_稲妻_p2752
        quote: 拘束帯を破壊して何かを言おうとするマリー。 けれど、言葉にならない。 稲妻の呪文は大気の中で減衰して消えていく。
        locator: {}
        spoiler_after: ch0073
      - event_ref: E_ch0073_マリー_fights_死の奔流_p2760
        quote: 「そんなの、ダメですっ！」 稲妻が天に昇り、大魔将の圧倒的な力が絶望的な死を一時押し留める。 だが天の御殿から降り注ぐ膨大な霊魂の流れ、滝のような霊的エネルギーは止まらない。
          全身を構成する呪文を崩壊させながら、マリーが消滅していく。
        locator: {}
        spoiler_after: ch0073
    visual:
      observations:
      - event_ref: E_ch0073_マリー_observes_色_p2712
        quote: ――特別な驚きは、何も無かった。だって、『お姉様』はありとあらゆる情報を与えてくれた。
        locator: {}
        spoiler_after: ch0073
  first_appearance_candidate: true
