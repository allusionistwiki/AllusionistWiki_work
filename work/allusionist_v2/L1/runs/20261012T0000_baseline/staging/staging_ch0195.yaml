        spoiler_after: ch0195
    relationship:
      observations:
      - event_ref: E_ch0195_アルト・イヴニル_has_property_マレブランケ_p6549
        quote: 紫の天主にとっての『マレブランケ』は彼が引き継いだ王権を証明する力だ。彼はこの軍勢を使って大魔将イェレイドさえも第六階層から追いやることに成功していた。
