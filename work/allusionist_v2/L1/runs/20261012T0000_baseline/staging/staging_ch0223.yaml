        locator: {}
        spoiler_after: ch0223
      - event_ref: E_ch0223_ユディーア_thinks_裏切り_p7408
        quote: （最終的にはどうせ裏切るんだろうけど） そのうち利害がかみ合わなくなったり思想面で譲れない部分が出たりして内部から崩壊するに決まっている。
        locator: {}
        spoiler_after: ch0223
