- canonical_target: '[[E_char_イアテム]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0133_イアテム_other_セージ_p4581
        quote: 【眠れる三頭】の頭首、白眉のイアテムは第五階層の掌握者権限に対しての造詣が深いセージに命じて自らに相応しい居城を造らせた。
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_イアテム_other_分身_p4582
        quote: 豊穣の呪力に満たされた液体の中から次々とイアテムが生産され続けていた。
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_イアテム_other_クレイ_p4584
        quote: イアテムは水流を鞭のように操ってクレイの背や胸を強かに打ち据えた。
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_イアテム_other_支配_p4585
        quote: 「では、支配はお前に任せるぞラクルラール。我の融血呪は軍勢を率いての征服には向くが統治は苦手なのだ。息子を戦士として教育するのは教師であるお前の仕事
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_イアテム_other_人形化_p4587
        quote: 「まあ良い、これも人形に仕立て上げ、きぐるみの魔女にぶつけてくれよう」
        locator: {}
        spoiler_after: ch0133
    speech:
      observations:
      - event_ref: E_ch0133_イアテム_other_ラクルラール_p4583
        quote: 「序列二位のお前で駄目なのだ、【髪】が扱える融血呪では氷血呪の守りはどうにもできんということだ。しばらく捨て置け。【男根】の融血呪は貫通力に優れる。なあに、時が来れば乳臭い小娘の頑なな部分をこじ開けるくらいわけはない」
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_イアテム_names_クレイ_p4584
        quote: 「いい顔だな、クレイ。いや、我が息子となるお前にはクラテムという名を授けよう。嬉しかろうが。どら、酒を酌み交わし、親子の仲を深めるとしよう」
        locator: {}
        spoiler_after: ch0133
  first_appearance_candidate: true
- canonical_target: '[[E_term_コキュートス]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch0133_コキュートス_defines_戦争のルール_p4581
        quote: 【コキュートス】がゲームという形式に落とし込んでしまったこの『戦争』は、決められたルールに則ったものであるため『無法』とは受け取られない。ゆえに、第五階層の物質創造能力はルールに従って戦う限り剥奪されず
        locator: {}
        spoiler_after: ch0133
  first_appearance_candidate: true
- canonical_target: '[[E_item_男根城ファルス]]'
  entity_type: item
  aspects:
    visual:
      observations:
      - event_ref: E_ch0133_男根城ファルス_appears_as_肉と皮膚の巨塔_p4581
        quote: ビルを覆うようにして、生々しい肉と皮膚が巨塔を構成している。先端は丸く膨らみ、全体的に反り返ってあちこちに青い血管が浮き上がっているような模様があった。
        locator: {}
        spoiler_after: ch0133
    symbolic:
      observations:
      - event_ref: E_ch0133_男根城ファルス_is_located_異界_p4582
        quote: アストラル界を認識する為の視界があれば、そこが呪術的な意味で海中に没していることに気が付くだろう。この城の中は異界なのだ。海の民がその全力を発揮できる海中――この空間であれば、たとえ六王を相手にしても遅れは取らない。
        locator: {}
        spoiler_after: ch0133
  first_appearance_candidate: true
- canonical_target: '[[E_char_セージ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0133_セージ_other_洗脳失敗_p4582
        quote: 「かなり呪的抵抗が強くて、中々脳髄洗いを実行することができません」
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_セージ_other_侵入者_p4585
        quote: 「あの、お師匠様。実は、侵入者が」「殺せ」「いえ、ですが、その、少し利用できそうっていうか、ガロアンディアン側の重要戦力だったので――」
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_セージ_other_ファルファレロ_p4586
        quote: 「いや頼んでないし。ていうかファルくんだっけ？ 君を捕獲したのわたしのトラップだし。ふつーにトリシューラは今度こそぶっ殺すよー？」
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_セージ_other_ファルファレロ_p4587
        quote: 「いや、ファルくんは魂が美少年の形をしてないから無理。生理的に」
        locator: {}
        spoiler_after: ch0133
    relationship:
      observations:
      - event_ref: E_ch0133_セージ_other_家族_p4591
        quote: 「お父様！ ローズマリー！ アニス！」 恰幅の良い壮年の男、妖艶な姿態の女、硬質な佇まいの女――セージにとって最も近しい家族が再生者として復活していた。
        locator: {}
        spoiler_after: ch0133
  first_appearance_candidate: true
- canonical_target: '[[E_char_コルセスカ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0133_コルセスカ_other_自身_p4583
        quote: 氷の封印は、コルセスカが自らに施したものだった。ラクルラールの融血呪による干渉を完全に遮断するために自分自身の存在そのものを完全に停止させて外部から孤立させたのである。
        locator: {}
        spoiler_after: ch0133
    visual:
      observations:
      - event_ref: E_ch0133_コルセスカ_other_氷晶_p4583
        quote: 半地下となった広大な空間に入ると、まず目に入るのは宙に浮かぶ巨大な菱形である。透き通った氷の結晶――その内部で、一人の女性が眠りについている。
        locator: {}
        spoiler_after: ch0133
    speech:
      observations:
      - event_ref: E_ch0133_コルセスカ_other_候補者_p4601
        quote: 「黒檀予定の人はエスフェイルと戦った三人の探索者の一人でアキラの目の前で死んでます。亜竜候補はパレルノ山に出現した突然変異の蛇の王で、これもサリアが捕獲せずに仕留めてしまいました。
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_コルセスカ_reveals_ループごとの変動_p4601
        quote: 「ループごとに微妙にメンバー違ったりしますしね」 ぼそっとコルセスカが衝撃の事実を発表する。
        locator: {}
        spoiler_after: ch0133
  first_appearance_candidate: true
- canonical_target: '[[E_char_クレイ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0133_クレイ_other_男根城ファルス_p4584
        quote: 後ろで括っていた黒髪は解けており、上半身は裸で全身が水に濡れている。呪われた枷が動きを封じ、身体の至る所に火傷や打擲の痕跡があった。更に左右に伸ばされた両の掌を杭が貫通している。
        locator: {}
        spoiler_after: ch0133
    speech:
      observations:
      - event_ref: E_ch0133_クレイ_threatens_イアテム_p4585
        quote: 「殺す。貴様だけは、必ず殺してやる」
        locator: {}
        spoiler_after: ch0133
  first_appearance_candidate: true
- canonical_target: '[[E_char_ファルファレロ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0133_ファルファレロ_other_探索者_p4586
        quote: 男たちは暴れる侵入者をどうにか抑え付けてその場に投げ出した。眼鏡をかけた少年が、束縛呪符をべたべたと貼り付けられて無力化されていた。
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_ファルファレロ_attacks_イアテム_p4587
        quote: 少年はせめて言葉だけでも一矢報いようと攻撃的な呪文を紡いでいく。それらは呆気なくイアテムの分厚い面の皮に弾かれて霧散するが、中傷者はくじけなかった。
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_ファルファレロ_activates_感染呪術_p4588
        quote: 「感染呪術は切り離した自己に働く遠隔作用――血族同士で繋がるお前たちの結束は武器であり同時に弱点だ。アストラル体ごと狂い死ね」
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_ファルファレロ_attacks_セージ_p4589
        quote: 呪文が螺旋を描いてセージを、イアテムを、探索者たちを襲う。最も呪術抵抗力の低い探索者が眼球と鼻から血を流して倒れる。
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_ファルファレロ_other_仮想使い魔_p4589
        quote: 少年は二体の仮想使い魔を同時に顕現させた。やや形が粗いが、角の生えた兎と毛が生えた亀。
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_ファルファレロ_other_コルセスカ_p4590
        quote: 「コルセスカさんを起こして、『王国の剣』を解放することくらいはできる！ そうすれば突破口は必ず開けるっ」
        locator: {}
        spoiler_after: ch0133
    speech:
      observations:
      - event_ref: E_ch0133_ファルファレロ_confesses_セージ_p4588
        quote: 「好きです、セージさん。だから、それ以上の醜態を晒す前に死んで下さい――腐った一族郎党を道連れにして」
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_ファルファレロ_reveals_太陰の理想_p4588
        quote: 「いいか、太陰ではな、妖精と兎たちが長い時間かけて融和していった。今でも衝突はあるけど、平和と共存の為に身を捧げている人は大勢いる」
        locator: {}
        spoiler_after: ch0133
    visual:
      observations:
      - event_ref: E_ch0133_ファルファレロ_transforms_アヴロノ_p4589
        quote: 中傷者の背に、燃えるように赤い翼が広がった。幻影の翼は少年の呪力の高まりに呼応して出現した鳥態の半妖精としての証である。
        locator: {}
        spoiler_after: ch0133
  first_appearance_candidate: true
- canonical_target: '[[E_char_ヴァージル]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0133_ヴァージル_appears_三頭犬_p4590
        quote: 狂王子ヴァージル・イルディアンサ。垂れ耳兎の少年が、雷によって構成された三頭犬の上に立ってゆっくりと登場した。
        locator: {}
        spoiler_after: ch0133
    action:
      observations:
      - event_ref: E_ch0133_ヴァージル_attacks_ファルファレロ_p4590
        quote: 中傷者の背後から青白い稲妻が飛来して、少年と使い魔たちを撃墜する。仮想使い魔が消滅し、少年が翼を失って床に叩きつけられた。
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_ヴァージル_other_イアテム_p4591
        quote: ヴァージルは【健康】の断章を開くと、短く呪文を唱えた。すると床に巨大な穴が出現し、そこから黒々とした瘴気が立ち上ってくる。黒い靄に触れたイアテムとセージが瀕死の状態から持ち直し、息絶えたはずの探索者二人が甦る。
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_ヴァージル_other_感染呪術_p4596
        quote: 「感染呪術でさ、家族を本人の切り離された一部として捉える術があるじゃない。三親等くらい捕捉できればまずまず使い物になる。九親等いけたら弟子にしてあげてもいいかなって感じだよね」
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_ヴァージル_captures_海の民_p4597
        quote: 床の深淵から、大量の人体が持ち上げられてくる。死者ではない。呪文の縛鎖によって動きを封じられた生者たちだ。両手に水掻きを持った種族と、クラゲのような頭部をした種族である。
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_ヴァージル_other_異戮_p4597
        quote: 「【異戮】」 何も起きなかった。
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_ヴァージル_other_オリジナル幻獣_p4598
        quote: 「うん、そうだよ。どんな資料にも出てこない、僕が作り出した下等な獣」
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_ヴァージル_other_ラクルラール_p4598
        quote: 「利用価値がある限り、使ってあげるよ――家畜として、道具として、ね」 人形は、いつの間にか口を鳴らすことをしなくなっていた。
        locator: {}
        spoiler_after: ch0133
    speech:
      observations:
      - event_ref: E_ch0133_ヴァージル_other_闘争の本質_p4590
        quote: 「王を決める戦いなんて表向きの構図に過ぎないよね。本質的にはこの闘争は末妹選定の一部に過ぎない――重要なのはトライデントの【心臓】がいつ、どこで、どうやって生まれるか。その為の地母神、その為のハザーリャ。ねえ、そうなんでしょ？
          これは揺りかご造りなんだ」
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_ヴァージル_other_カーティス排除_p4593
        quote: 「僕があなたたちにしてほしいのは、厄介なカーティスの排除だよ。六王の中で、あれとだけは本当に相性が悪いんだ。
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_ヴァージル_other_レミルス_p4594
        quote: 「レミルス、黙らせて」
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_ヴァージル_threatens_呪文の座_p4594
        quote: 「『呪文の座』――勝って欲しくないっていうかさ。あれ、潰したいな。欠片も残さず、あらゆる歴史軸から消去しておきたい」
        locator: {}
        spoiler_after: ch0133
      - event_ref: E_ch0133_ヴァージル_asks_イアテム_p4595
        quote: 「僕をもう一度生み直して欲しい――ねえ、お父さんになってくれる？」
        locator: {}
        spoiler_after: ch0133
  first_appearance_candidate: true
- canonical_target: '[[E_char_レミルス]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0133_レミルス_appears_虹犬_p4595
        quote: そこに立っていたのは虹犬の少年だった。無数の呪符を折り重ねたような衣服を身につけた三色のビーグル犬。
        locator: {}
        spoiler_after: ch0133
  first_appearance_candidate: true
- canonical_target: '[[E_char_ちびシューラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0133_ちびシューラ_other_マレブランケ表記_p4600
        quote: 「今回から、ちょっと【マレブランケ】の表記方法変更しようかなって。モブではないけど準主要キャラくらいの位置で、微妙な出番と印象だから覚えづらいと思うんだ。だから特徴をまとめてルビふることにしました。
        locator: {}
        spoiler_after: ch0133
  first_appearance_candidate: true
