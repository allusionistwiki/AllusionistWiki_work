        locator: {}
        spoiler_after: ch0046
      - event_ref: E_ch0046_アキラ_other_共闘_p1892
        quote: 「わかった。どちらにせよ、私はガルズと戦わなくちゃいけない。目的が同じなら共闘できるはずだよ」
        locator: {}
