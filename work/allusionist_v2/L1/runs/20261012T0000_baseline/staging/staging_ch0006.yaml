      - event_ref: E_ch0006_アキラ_fights_エスフェイル_p306
        quote: 最後には迷宮最深部にいるエスフェイルと対峙し、そこで無数の黒い棘を突き刺され、剣山のような屍を晒す。
        locator: {}
        spoiler_after: ch0006
      - event_ref: E_ch0006_アキラ_transforms_意識_p310
        quote: そうして、俺の意識はゆっくりと解体され。 浮上するような感覚と共に、覚醒した。
        locator: {}
        spoiler_after: ch0006
    speech:
      observations:
      - event_ref: E_ch0006_アキラ_observes_明晰夢_p306
        quote: 明晰夢。 これは夢だ、という自覚のある夢。 現在、俺が見ているこれがそうだが、しかしどうだろう、それは本当に正しいのか、とも思う。
        locator: {}
        spoiler_after: ch0006
      - event_ref: E_ch0006_アキラ_remembers_石の迷宮_p306
        quote: 半年前に戦った石の迷宮、人狼がひしめく無機質な闘争の場。
        locator: {}
        spoiler_after: ch0006
      - event_ref: E_ch0006_アキラ_thinks_六人との出会い_p306
        quote: もしかしたら、あそこで六人に出会ったというのは死ぬ間際に見た都合の良い妄想だったのではないか。そんなことを考えてしまうほど、長い長い繰り返し。
          勿論そんなことは無い。六人と共に戦った記憶は確かな現実だ。
        locator: {}
        spoiler_after: ch0006
      - event_ref: E_ch0006_アキラ_fears_敗北_p307
        quote: ああそうだ、敗北するとはこういうことだ。 何処にも行けない。 何もできない。 無力感に全身を押しつぶされ、自分すら見失って消えていく。
          怖い。 途方もなく心が寒かった。
        locator: {}
        spoiler_after: ch0006
      - event_ref: E_ch0006_アキラ_thinks_過去の牢獄_p307
        quote: ここは過去の牢獄だ。現実ならば時間が流れている為、記憶が蓄積され続ける。未来へ進んでいるという実感がある。だがここでは記憶は蓄積されない。全てが既知の記憶だけで構成されているから、どこに行くこともできない。ゆえに出口のない牢獄。
        locator: {}
        spoiler_after: ch0006
      - event_ref: E_ch0006_アキラ_asks_アズーリア_p308
        quote: どうして、アズーリアはあの時来てくれなかったんだ？
        locator: {}
        spoiler_after: ch0006
      - event_ref: E_ch0006_アキラ_hopes_アズーリア_p308
        quote: きっと今でも、アズーリアを待ち続けている。 再び出会わなければ、俺にとって牢獄にも等しいこの第五階層を抜け出すことが出来ないのだという気がしてならない。
        locator: {}
        spoiler_after: ch0006
      - event_ref: E_ch0006_アキラ_remembers_待ち時間_p308
        quote: あの時の俺は、精神が肉体から離れているようなものだったから。 ただ待つ。ひたすらに耐える。愚か者だと自分を非難しながらも、どこかで希望を捨てきれなかった、あの地獄のように長い一日。
        locator: {}
        spoiler_after: ch0006
      - event_ref: E_ch0006_アキラ_confesses_動機の機能不全_p309
        quote: 未来を繋いでくれたものから解放されることで未来へと進みたいという、矛盾したこの意思こそが俺の本当の渇望なのだ。だからこれは動機の機能不全。論理の破綻。
        locator: {}
        spoiler_after: ch0006
      - event_ref: E_ch0006_アキラ_thinks_反証としての現実_p309
        quote: あの六人に出会わなかった俺という最悪の結果を夢として見続けているからこそ、反証としての現実の記憶が際立つ。 目が覚める度に自分の記憶を確認して、出会っていたという過去に縋り付いて正気を保つ。
        locator: {}
        spoiler_after: ch0006
      - event_ref: E_ch0006_アキラ_thinks_社会からのドロップアウト_p309
        quote: 人間の社会で生きることは俺には無理だ。 だって感情は機械で制御できても、意思と動機は制御できなかっ たから。 その二つは一時の感情だけではなく、蓄積した記憶にも左右されてしまう。
        locator: {}
        spoiler_after: ch0006
      - event_ref: E_ch0006_アキラ_thinks_馬鹿_p310
        quote: 馬鹿は死んだって治りはしない。直りもしない。なぜならそれは病でも故障でもない、ただの仕様だから。 俺は、馬鹿だ。
        locator: {}
        spoiler_after: ch0006
