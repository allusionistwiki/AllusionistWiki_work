- kind: mystery
  name: MY_カタルマリーナの正体
  note: カタルマリーナは「不死女神の欠片の名前を冠していた」とされる。これが単なる名前だけでなく、物理的な「欠片」がハルベルト（歌姫Spear）の体内に存在し、彼女を不死にしている可能性を示唆する。
  quotes:
  - quote: 不吉な名前。それでも、歌姫は強くその名前で活動することを希望した。その理由が、かつてはわからなかった。やがて理想を押し通すことができなくなり――彼女は消えていった。
    paragraph: p1942
    quote_verified: true
  - quote: けれど、不死女神の欠片の名前を冠していた歌姫は、そこから奇跡のように甦った。
    paragraph: p1942
    quote_verified: true
  expected_payoff: ハルベルトが死んでも蘇る理由、あるいはガルズが彼女を狙う理由（不死の欠片を奪取するため）として回収される。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_アヴロノの正体
  note: ハルベルトがPVを加工して「半妖精の振り」をしているという事実。これは単なる隠蔽工作ではなく、アヴロノという別人格（または別種族）としての活動が、後の展開で重要な役割を果たす伏線。
  quotes:
  - quote: 実はＰＶを加工して半妖精の振りをしてアヴロノいるのだという事実をハルベルトが明かした事で、ようやくミルーニャとリーナもここにいるのが歌姫Ｓｐｅａｒだと納得してくれたようだった。
    paragraph: p1944
    quote_verified: true
  expected_payoff: アヴロノとしての活動が、太陰の王族としての立場やキュトスの姉妹選定において、ある種の「逃げ道」や「裏工作」として機能する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_骨の槍のメカニズム
  note: 外部からの侵入を完全に遮断した状態で、被害者自身の骨が凶器となる現象。これは「呪術による外部攻撃」ではなく、「体内の呪力構造の暴走」または「事前の仕掛け（時限式）」の完全な成功を示す。
  quotes:
  - quote: 侵入の形跡は無し。感知呪術には何の反応もなく、外部から呪術が発動した形跡も無いという。名のため、事前に時限式呪術を仕掛けられていないかどうかを確認することになった。名簿に名前が記された全員に身体検査が行われた。
    paragraph: p1953
    quote_verified: false
  - quote: それでも一切の異常が認められない。異常が無いということがなによりも異常だった。
    paragraph: p1953
    quote_verified: true
  expected_payoff: ガルズの能力が「呪力操作」ではなく「因果律操作」や「概念改変」であることの証明。対策が不可能であることを示し、アズーリアたちの絶望を深める。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
