  mysteries:
  - kind: mystery
    name: MY_ラクルラールの正体と力
    note: トリシューラが「乗り越えるべき壁」と呼んだ存在。球神ドルネスタンルフの遺物であり、史実であることが明かされたが、具体的な能力やアキラへの影響は不明。
    quotes:
    - quote: その名前には聞き覚えがある。 トリシューラが言っていた、いずれ乗り越えるべき壁――。
      paragraph: p3587
    - quote: 今は零落した球神ドルネスタンルフが人に授けたという叡智にして神造の遺物、それがアレの起源であると言われているよ
      paragraph: p3588
    expected_payoff: ガロアンディアン編やその後の展開で、アキラが直面する最大の障害、あるいは強力な武器として登場する。
  - kind: mystery
    name: MY_コルセスカの人格の行方
    note: 死人の森の女王との統合・上書き・共存のいずれになるか不明。アキラが「同一性」をどう定義し、変化したコルセスカとどう向き合うかが問われている。
    quotes:
    - quote: 人格を多重化して共存する場合もあれば、片方が打ち勝ってどちらかが消滅、ないし封じ込められることもある。あるいは、統合されてしまうことも。その場合、以前までのコルセスカとの同一性は保証できないが
      paragraph: p3587
    - quote: かつてキロンに敗れ、俺を俺として成り立たせている【Ｅ－Ｅ】を失った時、トリシューラが俺を見限ったように。俺はコルセスカでなくなってしまったコルセスカを、『同じ』だと見なせるのだろうか。
      paragraph: p3587
    expected_payoff: コルセスカが女王の人格を完全に吸収した状態、あるいは分裂した状態で再登場し、アキラとの関係性が試される。
  - kind: mystery
    name: MY_断章（鍵）の必要性
    note: 霊王が落とした書物であり、死人を操る力を持つ魔導書。過去から現代へ繋げる（再生者を甦らせる）ために不可欠なアイテム。
    quotes:
    - quote: 霊王フィフウィブレスが『鍵』と呼び、死人の森の女王が『断章』と呼んでいた黒い本だ。 恐らく、あれは文字通り『鍵』なのだ。
      paragraph: p3592
    - quote: 死人の森の女王が大幅に筋書きを変えてしまったせいだが、『流れ』そのものを覆す気はないらしい。
      paragraph: p3590
    expected_payoff: アキラが女王やグレンデルヒとの争奪戦を経てこの書を入手し、カインや過去の王たちを蘇生させるキーアイテムとなる。
  - kind: mystery
    name: MY_ガロアンディアンの建国王アルト
    note: チリアットの主ダエモデクの兄弟・好敵手とされる緑の亜竜。ガロアンディアンの建国王。
    quotes:
    - quote: ガロアンディアンの建国王アルトは、ダエモデクと同じくらい力のある、当時もっとも名の知れた亜竜だったのです
      paragraph: p3595
    expected_payoff: ガロアンディアン編の主要キャラクターとして登場し、チリアットの過去との対峙や、アキラの協力者（あるいは敵）となる。
  - kind: mystery
    name: MY_ドラトリア建国王カーティス一世
    note: アキラが関わる過去の王の一人。リールエルバの国ドラトリアの建国王。
    quotes:
    - quote: 君が関わることになる過去の王は六人だ。その中には、ドラトリアの建国王カーティス一世も含まれている。
      paragraph: p3592
    expected_payoff: ガロアンディアン編の合間、あるいはその後の舞台で、現代のドラトリアとの関連性を示す形で登場する。
