      - event_ref: E_ch0196_クナータ・ノーグ_appears_第二位_p6584
        quote: 守護の九槍第二位、聖女とも称される可憐な予言者クナータ・ノーグ。槍の穂先で揺れる神秘的な紫色の炎が、カシュラム系アヴロノであるノーグ氏族最後の生き残りの横顔を照らす。
        locator: {}
        spoiler_after: ch0196
  first_appearance_candidate: true
