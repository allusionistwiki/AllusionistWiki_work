      observations:
      - event_ref: E_ch0196_フォルス＝エウリュティオン・キャレプター_appears_第三位_p6585
        quote: その姿は天上の美を体現し、輝く貌は直視すれば目を灼かれかねない。頭上には燃える光輪、長い髪は光の奔流、背には六枚の翼。
        locator: {}
        spoiler_after: ch0196
  first_appearance_candidate: true
- canonical_target: '[[E_char_カーズガン]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0196_カーズガン_arrives_第四位_p6586
        quote: 『扉』から飛び込んできたのは巨大な馬――いや、騎乗した修道騎士だった。騎士は荒々しくそして華麗に馬を操ると、やあ、とう、といったかけ声と共に広間をひとしきり駆け回ってフォルスの隣に辿り着く。
        locator: {}
        spoiler_after: ch0196
  first_appearance_candidate: true
- canonical_target: '[[E_char_テッシトゥーラ・ティータ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0196_テッシトゥーラ・ティータ_appears_第五位_p6587
        quote: 寡黙な第五位は『詠唱者』テッシトゥーラ・ティータ。彼女は聖女派とでも呼ぶべき特殊な立ち位置で、司祭ですらない一介の読師だが、クナータたっての希望により抜擢された天才的呪文使いだ。
        locator: {}
        spoiler_after: ch0196
  first_appearance_candidate: true
- canonical_target: '[[E_char_ネッスス]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0196_ネッスス_appears_第六位_p6587
        quote: 藍色の炎が灯る下で、鋭く小さい黒目が私に狙いを定めている。脱色された短髪、細い眉に三白眼、ノコギリじみたギザギザの歯。
        locator: {}
        spoiler_after: ch0196
    speech:
      observations:
      - event_ref: E_ch0196_ネッスス_threatens_アズーリア_p6588
        quote: 「おいガキ、英雄が辛くなったら言えや。金出しゃ贖宥状くらい馬鹿みてえに刷ってやる。特別サービスで俺様の告解室に招待してもいいぜ」
        locator: {}
        spoiler_after: ch0196
      - event_ref: E_ch0196_ネッスス_observes_影の炎_p6596
        quote: 「『この世界』にはな。目を閉じてよく観ろ。影が揺らめいてるだろうが」
        locator: {}
        spoiler_after: ch0196
      - event_ref: E_ch0196_ネッスス_other_シナモリアキラの狩猟_p6602
        quote: 「シナモリアキラって紀人は俺様に狩らせろ。異邦の神なら俺らの流儀で染めればそれで終わりだ。クソみてえに浄化して天使コレクションに加えてやるよ」
        locator: {}
        spoiler_after: ch0196
  first_appearance_candidate: true
- canonical_target: '[[E_char_フォルス]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0196_フォルス_stops_ネッスス_p6588
        quote: 「ネッスス、あまり若者を脅かすものではありません」「了解。以後は控えます、フォルスさん」
        locator: {}
        spoiler_after: ch0196
    speech:
      observations:
      - event_ref: E_ch0196_フォルス_other_ネドラドの罪_p6591
        quote: 「前第八位ネドラドの独断専行は我ら『松明』とは関わり無きこと。彼の後先を考えぬ身勝手な愚行はけして槍神教の教えに基づいたものではなく、彼独自の妄想が行き過ぎたゆえのものです。」
        locator: {}
        spoiler_after: ch0196
      - event_ref: E_ch0196_フォルス_stops_ネッスス_p6603
        quote: 「控えなさい、ネッスス。第五階層の見極めはまだ済んではいません。強引な宣教や改宗の強制は禍根を残します。まず対話から始める必要があり、そのために最も適した人材がアズーリア卿なのですよ」
        locator: {}
        spoiler_after: ch0196
  first_appearance_candidate: true
- canonical_target: '[[E_org_義国派]]'
  entity_type: organization
  aspects:
    speech:
      observations:
      - event_ref: E_ch0196_義国派_defines_普遍史_p6588
        quote: 神働教皇機構『啓示告白』は世界最高の魔導書として現在も大神院で人類のあるべき姿たる『普遍史』を紡ぎ続けており、その維持と保全こそが彼らにとって至上目的であるとされている。
        locator: {}
        spoiler_after: ch0196
  first_appearance_candidate: true
- canonical_target: '[[E_char_第七位]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0196_第七位_other_ヴィティス_p6589
        quote: 第四位の言葉通り、第七位の席には誰もいない。しかし何故かそこには緑色の炎が灯されており、また不在が問題視される事も無かった。
        locator: {}
        spoiler_after: ch0196
  first_appearance_candidate: true
- canonical_target: '[[E_char_アレッシオ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0196_アレッシオ_appears_第八位_p6590
        quote: 朱色の炎が揺らめくと同時、良く通る声が広間の隅々まで響き渡った。現れた顎髭の男性はすらりとした長身で、演説向きの低い声を持った美丈夫だ。
        locator: {}
        spoiler_after: ch0196
    speech:
      observations:
      - event_ref: E_ch0196_アレッシオ_other_死人の森の女王_p6601
