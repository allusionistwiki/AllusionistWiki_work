- canonical_target: '[[E_char_トリシューラ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0119_トリシューラ_fights_ケイト_p4174
        quote: 倉庫街の上を飛び交う二つの影があった。トリシューラとケイト、アンドロイドとサイボーグの激闘が続く。重厚な機械鎧は共に艶のない黒金。片方はゼオーティア最高峰の杖呪術の結晶、もう片方は民間に払い下げられた中古品とはいえ正規の軍用機。
        locator: {}
        spoiler_after: ch0119
      - event_ref: E_ch0119_トリシューラ_fights_ケイト_p4176
        quote: 電子兵装がグラマー／アストラル界へとデフォルメアバターを投射して、二頭身のちびシューラとちびケイトが壮絶な殴り合いを行う。両者の実力は拮抗していた。短い手足がばたばたと振り回される。
        locator: {}
        spoiler_after: ch0119
      - event_ref: E_ch0119_トリシューラ_flees_ケイト_p4201
        quote: トリシューラは追い詰められつつあった。 無数の壁面を倒壊させながら、強化外骨格の巨大質量が地を滑っていく。波濤のような呪文、迫り来る磁力を纏った拳などを捌きつつ撤退するが、既に武装は杖銃を含めて全て失ってしまっている。後が無い状態だった。
        locator: {}
        spoiler_after: ch0119
      - event_ref: E_ch0119_トリシューラ_activates_融血呪_p4206
        quote: 「あまり気は進まないけど、もうなりふり構ってられないからね――禁戒を破るよ。アッシアー・エミュレート――融血呪」 イェツィラー 呪文詠唱と同時に、トリシューラの瞳から鮮血の涙が零れ落ちる。
          禁呪の発動によって少女は深く『何か』を喪失し、傷付いた心を奮い立たせて更なる呪術を行使する。
        locator: {}
        spoiler_after: ch0119
      - event_ref: E_ch0119_トリシューラ_uses_脳と頭部_p4207
        quote: 青の小球が群れをなして脳髄や顔面に接触して、細長く引き延ばされた青い血の呪力がそれらを浮遊させた。血が糸となって頭部と脳を繋いでいき、数珠つなぎとなったそれらはトリシューラを輝かせる首飾り。
        locator: {}
        spoiler_after: ch0119
      - event_ref: E_ch0119_トリシューラ_other_ケイトの攻撃_p4208
        quote: 「まさか、脳を直結して演算能力を上げているとでも？ いやまさか。そんな無駄なことを？ この世界ではそれが意味を持つというのか？」「うーん、ちょっと外れ。これは単なる邪視的アプローチだから。要するに、見た目と視座の複合なんだけど」
          ケイトにはもはやトリシューラの言葉を理解する余裕が無かった。 立て続けに放つ異界神話の呪文が、全て無効化されてしまっているからだ。
        locator: {}
        spoiler_after: ch0119
      - event_ref: E_ch0119_トリシューラ_other_大いなる女神_p4209
        quote: 「参照する神話の精度で敵わないなら――」 トリシューラの夢は、ゆらぐ神話の復活とその中で自分を女神として確立させるという複雑もののようでいて、一言で纏めればひどく単純明快だ。「――もっと強く、もっと私に適合した形で！
          最強にして絶対なる、キュトスに対応するほどの大いなる女神を甦らせてやればいい！！」
        locator: {}
        spoiler_after: ch0119
      - event_ref: E_ch0119_トリシューラ_uses_衣装占い師_p4210
        quote: 衣装占い師トリシューラ。 ストリスオマンサー 衣装を織り上げ、衣服の着こなしやドレスコードといった文化様式に文脈と意味を乗せてまじないを行うもの。
          きぐるみの魔女はその名の通り、衣服で身体を拡張する。
        locator: {}
        spoiler_after: ch0119
    speech:
      observations:
      - event_ref: E_ch0119_トリシューラ_says_アキラへの執着_p4175
        quote: 「死ね、死ね、私の邪魔をする奴も私からアキラくんを奪おうとする奴も、とりあえず嫌いだからみんな死んじゃえっ」
        locator: {}
        spoiler_after: ch0119
      - event_ref: E_ch0119_トリシューラ_other_融血呪の仕組み_p4206
        quote: 「禁呪の神秘を零落させて、融血呪を購入した。リース契約みたいな？ 要するに貴方の所のグレンデルヒと一緒だよ。他人が使ってる呪術の価値を貶めて、交換可能で再現可能な『もの』や『技術』に零落させる。そうしたら、ほら。杖の座である私にも利用可能になるんだよ」
        locator: {}
        spoiler_after: ch0119
      - event_ref: E_ch0119_トリシューラ_asks_人の定義_p4207
