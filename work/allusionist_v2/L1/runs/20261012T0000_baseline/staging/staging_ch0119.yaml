      observations:
      - event_ref: E_ch0119_グレンデルヒ_appears_主肢グレンデルヒ_p4168
        quote: 黄褐色のスーツを着た主肢グレンデルヒは、空中で彼女を待ち構えていた。といっても彼単独で浮遊しているわけではない。彼が足場としているのは、下部から呪力を噴射し続けている巨大な構造物。金属製の三角錐。変異の三手という名の古き神の化身。
        locator: {}
        spoiler_after: ch0119
      - event_ref: E_ch0119_グレンデルヒ_reveals_球体関節人形_p4197
        quote: 無惨に破れたスーツの内側に隠れていた姿態は女性的な丸みを帯びている。ルウテトは細めた灰色の左目に嗜虐的な輝きを宿らせて言った。「残念ですが、あなたはあまりグレンデルヒを使いこなせているとは言い難いようです。もっと可愛い服装の方がきっと似合いますよ？
          お人形さん」
        locator: {}
        spoiler_after: ch0119
    speech:
      observations:
      - event_ref: E_ch0119_グレンデルヒ_says_ルウテトの正体_p4168
        quote: 「なるほどなるほど。その名前は予想外だったな。複数の紀を有する神話構造体。古い女神特有の錯綜した伝承の蓄積。そんな所が正体だと予想していたのだが、まさか妖精とはね」
        locator: {}
        spoiler_after: ch0119
      - event_ref: E_ch0119_グレンデルヒ_other_創世記の呪文_p4187
        quote: 「『お前の出産の苦しみを大きなものにする。お前は、苦しんで子を産む。お前は男を求め、彼はお前を支配する』――」 突如として唱えられた異界の呪文。日本語という異界言語によって詠唱された響きが第五階層へと浸透し、真正面からそれを受けたルウテトの顔が苦痛に歪み、膝をつく。
        locator: {}
        spoiler_after: ch0119
      - event_ref: E_ch0119_グレンデルヒ_says_男女の支配関係_p4188
        quote: 「無いわけが無いだろう？ 男に男根が存在する限り、それは消えない。そのように生まれついたのだ、自然に振る舞うのが『正しさ』というものだよ。そら」
        locator: {}
        spoiler_after: ch0119
      - event_ref: E_ch0119_グレンデルヒ_other_運命_p4215
        quote: 「私は、人の為に存在している。人に望まれて在る英雄にして賢人なのだ。ならばこそ、地上に勝利をもたらさねばならない。敵を倒し、屈伏させなければならない。敵を、敵を、闘争を、勝利を！
          雄々しく、血湧き肉躍る冒険を！ 財宝を獲得し女を組み敷き敵を殺す、純粋な快楽を追求するのだよ！ 何故か？ それが人間というものだからだ！ それが私、グレンデルヒ＝ライニンサルの存在証明であるからだ！！」
        locator: {}
        spoiler_after: ch0119
    action:
      observations:
      - event_ref: E_ch0119_グレンデルヒ_other_機械天使_p4169
        quote: グレンデルヒの背後で空間が歪曲し、【扉】が増援を呼び寄せる。 ハイパーリンク 機械によって形成された杖の叡智、その結晶。 錬金術の精髄たる鋼鉄の飛行機械、その数七体。
        locator: {}
        spoiler_after: ch0119
      - event_ref: E_ch0119_グレンデルヒ_wears_紀械神_p4170
        quote: そして、グレンデルヒの下で変形する三角錐が司るのは悪意と加虐。 変異の三手が蠢いて、三角の翼が展開する。三角錐の内側に存在していたのは禍々しい人型のシルエット。翼持つ三手の完全者となった鋼鉄が、胴体を開いてグレンデルヒを内側に招いていく。
          それは杖の叡智の結晶、呪術の鎧たる強化外骨格。
        locator: {}
        spoiler_after: ch0119
      - event_ref: E_ch0119_グレンデルヒ_other_ゾーイ_p4183
        quote: 力士が立ち上がると、その顔を雑に上書きするように蓬髪の壮年男性の顔が貼り付けられる。醜悪なテクスチャ呪術。グレンデルヒの顔をした力士が高みからアキラを見下ろして、蔑みの言葉を吐き捨てた。
        locator: {}
        spoiler_after: ch0119
      - event_ref: E_ch0119_グレンデルヒ_escapes_ルウテト_p4199
        quote: 「金遁・錬金手裏剣！」 小型の金属片はその形を大きく変貌させた。金属が柔らかく流動し、薄く広く引き延ばされた十字の刃となって回転しながらルウテトに迫る。
        locator: {}
        spoiler_after: ch0119
      - event_ref: E_ch0119_グレンデルヒ_other_倉庫_p4200
        quote: 屈強な力二つ分に挟まれて身動きがとれないまま、グレンデルヒは真っ逆さまにとある倉庫に墜落。運の悪いことに、そこには大量の火器が補完されていた。
        locator: {}
        spoiler_after: ch0119
    symbolic:
      observations:
      - event_ref: E_ch0119_グレンデルヒ_is_made_of_男根主義的思想_p4212
        quote: 男女問わず、過酷な巨大複合企業の競争に晒された企業探索者たちが内面化している男根主義的な思想――それらが『最も優れた探索者像』を通して表現されたとき、グレンデルヒという英雄が生まれる。
        locator: {}
        spoiler_after: ch0119
