- canonical_target: '[[E_char_ゾーイデルヒ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0119_ゾーイデルヒ_attacks_ガロアンディアン側_p4184
        quote: 詠唱状態を維持していた時間に比例してその威力を増大させる極大呪文が炸裂。呪文の群れは天高く昇っていくと、無数の頭部を持った蛇となって急降下を始める。そして、トリシューラたちガロアンディアン側の勢力へと一斉に攻撃を仕掛けた。
        locator: {}
        spoiler_after: ch0119
      - event_ref: E_ch0119_ゾーイデルヒ_attacks_アキラ_p4217
        quote: その技の名は、『サマーソルトキック』。 天へと伸ばされた足は狙い違わずシナモリアキラの顎を打撃し、そのままの勢いでトバルカインの首から上を砕いて吹き飛ばした。
        locator: {}
        spoiler_after: ch0119
    speech:
      observations:
      - event_ref: E_ch0119_ゾーイデルヒ_other_コルセスカ_p4185
        quote: 「馬鹿め。貴様が自信満々に開陳している世界観は所詮、アマチュアレベルの代物だ。厳しい競争社会に出れば誰にも相手にされない。いいかね？
          一流のゲームクリエイターでありプロゲーマーでもある私の目から見て、この世界は論外だといわざるを得ない。貴様は遊戯の上っ面だけを見て喚いているだけの程度の低い消費者だ。本当のゲーム性、競技に真剣に向き合うという意味がわかっていない。まこと、女というのはあらゆる面において害悪だな。物事の『深さ』を理解できない低脳が増えたせいで業界に底の浅い駄作が蔓延るのだ。
        locator: {}
        spoiler_after: ch0119
      - event_ref: E_ch0119_ゾーイデルヒ_says_権威の失墜_p4185
        quote: 「この無様な姿をアストラルネットに晒し続ければ、そちらの権威は地に堕ちていくというわけだ。勝利している者は強く、情けなく見える者は弱い。それが世の理というものだ――わかるだろう、冬の魔女」
        locator: {}
        spoiler_after: ch0119
  first_appearance_candidate: true
