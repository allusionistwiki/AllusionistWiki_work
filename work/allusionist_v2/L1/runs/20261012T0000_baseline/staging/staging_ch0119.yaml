          コルセスカは――膨大な数の逸話を参照して前世とする神話の魔女は、常に前世に侵食されてしまう危険と隣り合わせだ。 だからこそ、グレンデルヒの在り方が理解できる。
          その悲哀に、共感できてしまう。
