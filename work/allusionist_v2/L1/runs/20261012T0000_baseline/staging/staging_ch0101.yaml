  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0101_クレイ_other_姓_p3661
        quote: 「宣名の内容を途中で変えたんです。最初はライニンサルって言ったけど、何かに気付いてすぐにドーレスタって。それからしばらくして、また訂正するようにクレイ・ダーカンシェルって言い直してました」
        locator: {}
        spoiler_after: ch0101
  first_appearance_candidate: true
