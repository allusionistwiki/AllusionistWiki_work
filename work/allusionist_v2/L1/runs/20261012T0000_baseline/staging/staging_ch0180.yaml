        quote: シナモリアキラは『サイバーカラテ道場』としての役割を果たすだけだ。
        locator: {}
        spoiler_after: ch0180
    speech:
      observations:
      - event_ref: E_ch0180_シナモリアキラ_other_一人称_p5953
        quote: 一人称はいらない。 俺は思う、私は考える、不変の自我を前提とする古い邪視者の流儀。 カーティスには、シナモリアキラには相応しくない。
        locator: {}
        spoiler_after: ch0180
      - event_ref: E_ch0180_シナモリアキラ_says_陛下_p5953
        quote: 「陛下、使い魔たちと交戦していたオルヴァの気配が拡散したようだ」「数では勝てないと判断して新たに聖油を垂らしたか。アキラ、カシュラム人となった探索者どもを蹴散らせ」「お任せを、我らが夜の王」
        locator: {}
        spoiler_after: ch0180
      - event_ref: E_ch0180_シナモリアキラ_other_コルセスカ_p5991
        quote: 「私たち三百三十三人が相手よ、新人アイドルさん。私たちの頂点に立つあのお方に挑みたければ、私たちシナモリアキラとライブバトルをしてランキングを駆け上がることね！」
        locator: {}
        spoiler_after: ch0180
    visual:
      observations:
      - event_ref: E_ch0180_シナモリアキラ_transforms_十二の影_p5956
        quote: シナモリアキラの影が蠢き、無数の闇となって大地に放たれていった。 形式が変わっても、その本質は変わらない。 ガロアンディアンの残骸を今度こそ奈落の底に叩き落とすため新たに転生を果たしたシナモリアキラ。
          大地を駆ける十二の影、それらは全て『病気持ち』である。
        locator: {}
        spoiler_after: ch0180
    symbolic:
      observations:
      - event_ref: E_ch0180_シナモリアキラ_has_property_第七識の不完全_p5977
        quote: 現在シナモリアキラの第七識は不完全、つまり紀人としても十分な状態ではない。 このシナモリアキラは、歪んだ欲望に汚れている。
        locator: {}
        spoiler_after: ch0180
