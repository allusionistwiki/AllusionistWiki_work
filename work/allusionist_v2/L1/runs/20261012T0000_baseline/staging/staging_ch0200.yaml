  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0200_ルーシメア_other_ユディーア_p6747
        quote: 無垢で純粋で可愛らしく、そしてどこまでも暴力的な、有無を言わせない言葉。　裁くものの言葉。神の摂理を代弁するものの言葉。真理を知るものの言葉。
        locator: {}
        spoiler_after: ch0200
      - event_ref: E_ch0200_ルーシメア_other_ユディーアの問い_p6749
        quote: 「うん。いいよ。ユディーアはそうでなくちゃ。話してくれる？　あなたの惑いと正義を」　殺意と叛意を『善し』と受け止め、玉座の何者かは鷹揚に振る舞った。
