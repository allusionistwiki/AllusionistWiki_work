- canonical_target: '[[E_char_ミルーニャ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0066_ミルーニャ_saves_プリエステラ_p2473
        quote: ミルーニャは咄嗟にプリエステラの使用している呪術の規模を計算し、瞬時に呪石弾の種類を選択して発射、自らに近い位置で炸裂させた。無数の球体がより大きい呪力に反応してミルーニャに殺到していく。使い捨ての防御護符で【霧の防壁】を展開しながら、舞台を大地に見立てながらブーツで踏みしめて【報復】を発動。ミアスカ流脚撃術の流麗にして苛烈な動きで球体を蹴り飛ばしていく。幾つかは離れた位置に飛ばされてそのまま爆発したが、大半はミルーニャの至近距離で爆発してしまう。
        locator: {}
        spoiler_after: ch0066
      - event_ref: E_ch0066_ミルーニャ_activates_盲目の守護者像_p2476
        quote: 「くっ、右手親指、解錠！　来たれ【盲目の守護者像】！」アンロックミルーニャは右手親指の爪をベフォニスの眼前に弾き飛ばして【汚泥】を発動させて悪臭と泥で視覚と嗅覚を遮ると、体内倉庫から切り札の一つを出現させた。祝福者でなくなったことによりその最大容量は大幅に減少していたが、この呪鉱石製の動く巨大石像だけはどうにか使用可能にするべく改良を重ね、強度はそのままに動きの最適化と機動力の上昇という奇跡のような効率化が実現したのである。
        locator: {}
        spoiler_after: ch0066
      - event_ref: E_ch0066_ミルーニャ_travels_リーナの箒_p2481
        quote: 「私が残る！　呪石弾じゃ相性悪いでしょ！　私なら治療もできるし！」ミルーニャは一切迷わなかった。リーナの箒の前に飛び乗ると、自分で箒を操作して浮遊する。「エストっ、無茶しないでねっ、あとおっさんもっ」リーナが叫ぶと、プリエステラが頷き、ペイルが憤慨しながら、「まだおっさんて歳じゃねえよ！　てめー後で押し倒すぞオラ！」「生きてたらデートくらいはしたげるよっ」
        locator: {}
        spoiler_after: ch0066
      - event_ref: E_ch0066_ミルーニャ_activates_無神論の結界_p2484
        quote: 絶え間ない移動の間に、ミルーニャは準備を済ませていた。浮遊する呪符と呪符が線で結ばれ、巨大な結界が空中に完成する。内側に鉄願神セルラテリスの加護が満ちていく。あらゆる加護を否定する『無神論』の加護によってサジェリミーナが失速する。
        locator: {}
        spoiler_after: ch0066
  first_appearance_candidate: true
