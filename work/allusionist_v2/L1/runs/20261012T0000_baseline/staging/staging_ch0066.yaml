        quote: 「悲しいな。悲しいね。長く生き続けていると子供たちの死を見ることも多くなるけれど、やはり子孫たちがこうして若くして死んでいくのは耐え難い痛みだ――ねえマリキアン。もう止めにしないかな？　君は僕たちと来るべきだよ。もう君には、地上に味方する理由がないはずだ」マリキアンは起き上がると、そのまま短槍をダエモデクに突きだした。
        locator: {}
        spoiler_after: ch0066
