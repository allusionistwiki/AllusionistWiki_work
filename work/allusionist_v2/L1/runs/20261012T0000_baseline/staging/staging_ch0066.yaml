        quote: 「さあ、僕の身体を好きなだけ食べるがいい。構うことはない、ほら、肉はたっぷりあるのだから」ガルズの口元に涎が溢れる。腕だけで地を這うと、猛烈な勢いでダエモデクに齧り付いた。
        locator: {}
