        quote: 石の肌が灰色に輝く。『灰』の色号――時間を司る呪術。異常な呪石の加工速度。体内の工房が外界とは時間の流れ方が異なるために実現できているのだろう。自己加速の呪術は動きを高速化して身体強化を行う事が可能だ。
        locator: {}
        spoiler_after: ch0066
