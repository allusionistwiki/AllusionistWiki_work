      - event_ref: E_ch0066_ダエモデク_fights_修道騎士_p2466
        quote: 音速で突撃してくる修道騎士の一人を超人的な空間把握能力――天眼によって補足し、素手で掴んで握りつぶしながらダエモデクは言った。穏和な口調、鈍重そうな見た目だが、その重量級の脂肪と鱗の内側には恐るべき筋肉質の身体が秘められている。それに加えて三次元的な知覚能力は短時間ではあるが未来予測すら可能とし、音速で突撃する修道騎士の位置を正確に捉えて反撃を行う。
        locator: {}
        spoiler_after: ch0066
      - event_ref: E_ch0066_ダエモデク_transforms_死人_p2466
        quote: 更に、彼の肉を分け与えられた死人たちの姿が変異を開始する。膨張し、膨れあがり、骨格が変形し、最終的な姿は霊長類を大きく逸脱したものとなった。巨大な蜥蜴の骨格のみが腐肉をまとわりつかせて足音を響かせ、腐った大蜥蜴や大蛇が漆黒の吐息を吐き出していく。屍亜竜。ドラゴンゾンビ
        locator: {}
