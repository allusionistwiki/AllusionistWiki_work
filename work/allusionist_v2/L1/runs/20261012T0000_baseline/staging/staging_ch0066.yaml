- canonical_target: '[[E_term_サジェリミーナ]]'
  entity_type: terminology
  aspects:
    action:
      observations:
      - event_ref: E_ch0066_サジェリミーナ_fights_リーナ_p2483
        quote: 「ハハハ、つれないじゃないか！　ご一緒にお茶でも如何かな？　水銀茶でよければいくらでもあるけれど」リーナの箒を上回る速度で回り込んだ魔将に行く手を阻まれる。急制動をかけ、直角に下に曲がるがそこにも魔将が。横に、上にと移動するが、どこに行っても回り込まれてしまう。
        locator: {}
        spoiler_after: ch0066
      - event_ref: E_ch0066_サジェリミーナ_activates_創生の闇_p2486
        quote: 『白』の色号――知識を司る呪術が発動し、魔将の手に双頭の蛇を象った水銀の杖が握られる。そして、世界が塗り変わる。「上なるものは下なるもののごとく、下なるものは上なるもののごとく。小宇宙を解き明かし、大宇宙をこの手の中に――【創生の闇】コロニュービア」サジェリミーナの詠唱と同時に、浄界が発動した。巨大な暗黒の宇宙空間が創造され、彼方で惑星が爆発し、寿命を迎えた恒星が光すら飲み込む闇の質量体に変貌し、途方もない規模の磁気嵐、流星群、その他宇宙規模の災厄が些末事のように荒れ狂う深淵が現実を浸食していく。
        locator: {}
        spoiler_after: ch0066
      - event_ref: E_ch0066_サジェリミーナ_other_リーナ_p2487
        quote: サジェリミーナが流動する顔でにやりと笑いながら呪術を発動させた。帽子から流れ出す水銀が加速度的にその量を増し、凄まじい勢いで膨張しながら巨大な水銀の大地に、天体になっていく。膨れあがる流動体――重金属の星。それは地上とは違う文化圏、地獄で語られる天体で、名を水銀星と言う。
        locator: {}
        spoiler_after: ch0066
    speech:
      observations:
      - event_ref: E_ch0066_サジェリミーナ_reveals_錬金術師_p2484
        quote: 「ハハハ！　銀霊は自己強化以外の呪術が苦手だという常識が邪魔をしたね？　始祖たる私は例外、まさかの特例！」張り巡らされた結界が、夜空から舞い降りた無数の輝きによって破壊されていく。魔将の周囲に輝く無数の光は線で結ばれ、特定の意味を持つ図像を形成。はっとしてミルーニャが夜空を見上げると、広がる闇の中、無数の星々に様々な線が引かれていた。「星座や天体の運行から特定の意味を引き出す古代呪術――まさか、占星術師？！」アストロマンサー
        locator: {}
        spoiler_after: ch0066
    name:
      observations:
      - event_ref: E_ch0066_サジェリミーナ_defines_銀霊_p2489
        quote: 彼――いえ彼女――仮に『それ』とか『あれ』としておきましょうか。性別の存在しないあれは銀霊という種族を自ら創り出した伝説上の錬金術師で、更にはペレケテンヌルの加護を使いこなす神働術の使い手でもあるようです。
        locator: {}
        spoiler_after: ch0066
  first_appearance_candidate: true
