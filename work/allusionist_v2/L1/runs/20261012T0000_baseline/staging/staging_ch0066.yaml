        quote: 目にも留まらぬ早撃ちを、ベフォニスは正面から掴み取ると呪術が発動するより先に大きく口を広げて中に放り込む。ばりぼりと喰らうと、その頬から輝きを放つ呪宝石が迫り出す。「んー、結構いい石使ってるじゃねえの。美味い美味い」
        locator: {}
