- canonical_target: '[[E_char_ディセクター]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0066_ディセクター_activates_火蜂_p2457
        quote: 後方で待機していた序列十五位の修道騎士、【養蜂師】ディセクターが背負った巨大な金属貨物箱が解放され、開かれた扉から一斉に使い魔が飛び出す。無数の穴蔵から解放されたのは蜂だ。膝を着いて呪文を唱え続けるディセクターの周囲には九つの蜜蝋が並び、灯された炎が舞い上がると無数の蜂に燃え移る。火炎を纏った大量の蜂――火蜂と呼ばれる扱いの難しい使い魔を使役したディセクターは、囮部隊に気をとられている魔将たちの上空を通過して真っ直ぐにガルズの方へと向かう。
        locator: {}
        spoiler_after: ch0066
      - event_ref: E_ch0066_ディセクター_wounds_ディセクター_p2461
        quote: ディセクターの周囲に灯っていた蜜蝋の火が一斉に消え、同時に彼は自らの『三本足』が引き裂かれた苦痛に絶叫する。身動きがとれなくなるほどの激痛。倒れ込んだ彼に、無数の矢が降り注いでいく。
        locator: {}
        spoiler_after: ch0066
  first_appearance_candidate: true
- canonical_target: '[[E_char_サイザクタート]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0066_サイザクタート_appears_道化服_p2458
        quote: 霊長類の平均よりやや大きいと言う程度の体格。そして二足歩行する犬としか言いようのない肉体を包む、極彩色の道化服。虹犬の習性として、様々な色彩を身につけるその魔将は、ある一点を除けばごく普通の異獣に見えた。ある一点――すなわち、首が三つあるという点である。左右の犬型頭部はどこを向いているのか分からない目をあちこちに彷徨わせながら長い舌を出しっぱなしにして話している。涎が飛び散って舞台を濡らした。「こんなに騒がしいとサイザクタートが起きちゃうよ」「それは困った、困ったぞ。上手く寝かしつけないと大変だ」中央の頭部は、何故かすやすやと眠っている。首には涎掛け、口にはおしゃぶり。さらにその両手にはがらがら鳴るおもちゃが握られていた。
        locator: {}
        spoiler_after: ch0066
    action:
      observations:
      - event_ref: E_ch0066_サイザクタート_saves_ガルズ_p2459
        quote: 「ありがとうサイザクタート。助かったよ」火蜂に襲われて確実に絶命していたはずのガルズとマリーは復活していた。
        locator: {}
        spoiler_after: ch0066
      - event_ref: E_ch0066_サイザクタート_attacks_修道騎士_p2461
        quote: そして無数の矢が放射状に番えられたかと思うと、一瞬だけ引き絞られたように内側に動き、そのまま弾性エネルギーを解放してあらゆる方向に矢が発射された。多彩な色に輝く呪術の矢は、それぞれ発火、凍結、雷撃、猛毒、石化、旋風、分解など様々な効果を発揮しながら修道騎士たちに命中して致命傷、良くて重傷を負わせていく。
        locator: {}
        spoiler_after: ch0066
    speech:
      observations:
      - event_ref: E_ch0066_サイザクタート_says_世界は夢_p2459
        quote: 「だって僕らはサイザクタートの夢だからね」「だってこの世はサイザクタートの夢だからね」「目が醒めちゃったらこの世は全部おしまいだ」「目が醒めなくたってこの世はみんなあやふやだ」
        locator: {}
        spoiler_after: ch0066
    name:
      observations:
      - event_ref: E_ch0066_サイザクタート_defines_朱の色号_p2460
        quote: 魔将の多くは『色号』と呼ばれる方法で呪術を系統立てている。時間を司る灰、知識を司る白、夢を司る朱、記憶を司る藍、言語を司る黒。地上ではよほどの辺境か専門的な研究機関などでなければまずお目にかかれない呪術体系だが、『朱』の色号使いであるサイザクタートは現実を『夢』であるということにして起きた出来事を一瞬のみ無かったことにできるという。
        locator: {}
        spoiler_after: ch0066
  first_appearance_candidate: true
- canonical_target: '[[E_item_火蜂]]'
  entity_type: item
  aspects:
    action:
      observations:
      - event_ref: E_ch0066_火蜂_attacks_ガルズ_p2458
        quote: 即座に金眼が邪視によって迎撃するが、炎が発生させる熱によって光を屈折させてその所在を欺瞞し続ける火蜂たちはこれを全て無力化。アインノーラが蜂の大群を宝石のような浄界を展開して捕らえようとするが失敗する。蜂という矮小な存在一つ一つと『決闘する』というイメージを、アインノーラは強固に想起することができなかったのである。恐るべき量の蜂がガルズのもとに到達し、鋭い針で次々とその身体を突き刺していく。赤熱する針がガルズの体内に猛毒を流し込んでいく。
        locator: {}
        spoiler_after: ch0066
      - event_ref: E_ch0066_火蜂_kills_ガルズ_p2458
        quote: マリーが蜂の群れを追い払おうと槌を振り回すが、炎を纏った蜂たちはマリーにまで群がってくる。一瞬の間を置いて、二人の肉体が内側から爆発した。火蜂が注入したのは燐血の民の血液から精製した爆裂毒の一種である。体内に入り込むと血中の成分と反応して起爆、標的を体内から爆砕する。威力としては初級の【炸撃】に満たないが、体内に浸透した毒が一斉に起爆して生きていられる者はいない。
        locator: {}
        spoiler_after: ch0066
  first_appearance_candidate: true
- canonical_target: '[[E_char_ナト]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0066_ナト_appears_白銀のカラス型神働装甲_p2461
        quote: 天から無数の羽型攻撃端末が飛来して、呪術の矢を正確に叩き落とした。遠隔誘導攻撃端末――優れた使い魔と杖の才覚を有する者のみが扱える、超高度な呪動武装。「申し訳ありません、再装填に手間取りました」白銀のカラス型神働装甲にその身を包んだ修道騎士序列二十六位、ナトが空から舞い降りてくる。
        locator: {}
        spoiler_after: ch0066
    action:
      observations:
      - event_ref: E_ch0066_ナト_fights_サイザクタート_p2462
        quote: かぎ爪の付いた両腕が分離し、無数の攻撃端末と共に魔将に襲いかかっていく。それを迎え撃つ、虹の弓と呪術の矢。眠る頭と涎を垂らしながら叫ぶ二つの頭が揺れて、朱色の眼光が魔将の周囲の空間を歪めていく。
        locator: {}
        spoiler_after: ch0066
    speech:
      observations:
      - event_ref: E_ch0066_ナト_says_痛み_p2462
        quote: ナトは一瞬だけ担架で後方に運ばれていくディセクターを見て、鋭く呟く。「手足をもがれる痛みってやつはね、あれで中々きついんだ。痛みを無かったことにする力、大変結構な事だけどさ――」
        locator: {}
        spoiler_after: ch0066
  first_appearance_candidate: true
- canonical_target: '[[E_char_ガルズ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0066_ガルズ_travels_時の尖塔_p2462
        quote: 「さて、サジェリミーナ、クエスドレム、ダエモデク。ここは他の魔将に任せて、僕たちは時の尖塔に向かうとしよう。じきに追いついてくるだろうしね」ガルズはそう言うと、浮遊しながら会場を去っていく。目指すは時の尖塔、その一番奥で守られている聖女クナータである。
        locator: {}
        spoiler_after: ch0066
      - event_ref: E_ch0066_ガルズ_wounds_ガルズ_p2465
        quote: 咄嗟にマリーを突き飛ばしたガルズの肉体は粉々に粉砕され、地面に叩きつけられた胸から上が痙攣する。傷口は無数の泡で塞がれつつあるが、何らかの加護による再生も追いついていないようだ。浮遊する【死人の森の断章】が自動で【修復】をかけはじめたが、突撃の第二波が迫ろうとしていた。
        locator: {}
        spoiler_after: ch0066
  first_appearance_candidate: true
- canonical_target: '[[E_char_クエスドレム]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0066_クエスドレム_kills_修道騎士_p2463
        quote: クエスドレムが指を弾くと、その場に十人の修道騎士が出現する。魔将が「斬首刑に処す」と口にする前に、臨戦体勢であった修道騎士たちは超至近距離であっても戦える短剣を抜きはなって一斉にクエスドレムに突き刺す。滅多刺しであった。腹を、胸を、背中を、首を、後頭部を。はね飛ばされたクエスドレムの頭部がごろごろと転がっていく。「対処など出来ぬと言うたろうが」朱色の影から飛び出した巨大な心臓たちが牙を剥き、修道騎士を鎧ごと噛み砕いていく。
        locator: {}
        spoiler_after: ch0066
      - event_ref: E_ch0066_クエスドレム_transforms_死人_p2463
        quote: いつの間にか傷ひとつ無い状態に戻っていたクエスドレムが、そのまま心臓たちを使役して周囲を徘徊する死人たちに取り付かせる。無数の触手を伸ばした心臓が死人と同化していき、腐敗した肉体を変異させていった。肉体の各部位がそれぞれ異常発達したり、硬化したり、燃え上がったり、果ては人外の獣じみた姿になったりと、死人の軍勢は強化されていく。「これらを我が親衛隊とする。異論無いな、死霊使い？」「ご随意に」
        locator: {}
        spoiler_after: ch0066
  first_appearance_candidate: true
- canonical_target: '[[E_char_グラル・アーニスタ]]'
