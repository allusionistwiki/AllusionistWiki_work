      - event_ref: E_ch0066_ベフォニス_other_盲目の守護者像_p2477
        quote: ベフォニスは拳を受け止めてなどいなかった。その口を限界まで、というより限界以上に広げ、拳をすっぽりと飲み込んでしまっていたのである。そのまま呪鉱石の石像を囓り、噛み砕き、飲み込み、嚥下していく。恐るべき勢いで石像を全て喰らったベフォニスの全身が膨れあがり、耐えきれずに鎧が弾け飛ぶ。露わになった裸の上半身、その灰色の肌に、美しくカットされた無数の呪宝石が浮かび上がった。「いやぁー、美味かった美味かった。ご馳走さん。こんな美味い石は久々に喰ったぜ。いい仕事してんなあ、アンタ」
        locator: {}
