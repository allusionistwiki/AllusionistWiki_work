- canonical_target: '[[E_org_修道騎士]]'
  entity_type: organization
  aspects:
    action:
      observations:
      - event_ref: E_ch0066_修道騎士_fights_ガルズ_p2456
        quote: 全修道騎士は死霊使いガルズ・マウザ・クロウサーの討伐という最優先目標を再確認し、その為にそれぞれが行動を開始する。
        locator: {}
        spoiler_after: ch0066
      - event_ref: E_ch0066_修道騎士_learns_攻略用資料_p2456
        quote: まず復活した魔将たちの編集済み『攻略用資料』が全修道騎士に配布され、続けて探索者たちにも閲覧可能なようにアストラルネット上にもアップロードされる。
        locator: {}
        spoiler_after: ch0066
      - event_ref: E_ch0066_修道騎士_attacks_ガルズ_p2465
        quote: ガルズたちの気が緩むであろう一瞬を狙って、伏せられていた二部隊による同時攻撃が行われた。空中から空の民を主体とした空戦修道騎士たちが一斉攻撃を行い、更には側面から自らの視界を遮る透明化を解除しながら重槍修道騎士が音速で突撃する。共に幻術による隠蔽を行っていたのだ。二番隊の奮闘によって前方に引き付けられていた死人の軍勢はこの攻撃に対処出来ず、壊滅的な被害を受けた。空中からの猛烈な邪視や呪文が死人を焼き払い、続いて巨大な突撃槍を構えて足から呪術噴射による突進が死人を引き裂きながらガルズへと向かう。
        locator: {}
        spoiler_after: ch0066
  first_appearance_candidate: true
