        quote: 修道騎士バルと魔将アインノーラが一騎打ちを開始し、ガルズが操る死人たちを精鋭たる修道騎士たちが蹴散らして突き進む。
        locator: {}
        spoiler_after: ch0066
      - event_ref: E_ch0066_バル・ア・ムント_other_修道騎士_p2457
        quote: 第十位バルは松明の騎士団の地上戦力、高位序列者を含む修道騎士約五千名（うち純粋な戦闘要員は三千七百名余）からなる変則二個連隊に命令を下していった。部下や同格の部隊長たちに指示を飛ばし、自らは一番大隊に所属する約六百人の修道騎士を直接率いる。負傷した修道騎士を後方に下げつつ死霊使いに向かって突撃を開始。
        locator: {}
        spoiler_after: ch0066
    visual:
      observations:
      - event_ref: E_ch0066_バル・ア・ムント_appears_赤熱する髭_p2457
        quote: 聖騎士バルは兜を脱いで先陣を切った。強面にもみ上げと繋がった濃い髭が、赤い色そのままに燃え上がる。高い呪力を有する燐血の民の証。敵を威圧し味方を鼓舞しながら、赤熱する槍を振り上げて雄叫びを上げて突撃する。
        locator: {}
        spoiler_after: ch0066
