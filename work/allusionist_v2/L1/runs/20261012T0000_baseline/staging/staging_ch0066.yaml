        quote: 「ちょっと待ったぁぁぁぁ！！」猛烈な勢いで会場上空を飛行してくる者がいた。三角帽子に長い箒。金色の光を噴射しながら進むのは、「リーナか」「ガルズ！　このくそやろーいい加減にしろ！」リーナの箒は立ち塞がる亜竜たちを一瞬で振り切っていく。苦戦する空の民たちに空中から投げつけられたのは拡散治癒呪符や霊薬。リーナの前に乗っているのはミルーニャだ。
