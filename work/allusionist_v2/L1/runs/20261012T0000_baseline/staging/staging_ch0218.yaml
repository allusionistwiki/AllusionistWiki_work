      - event_ref: E_ch0218_実況者_says_マルガリータ・ジャッフハリム_p7277
        quote: 堂々の一位は当日飛び入り参加、『シェイドラン』より出走のマルガリータ・ジャッフハリム選手！
        locator: {}
        spoiler_after: ch0218
      - event_ref: E_ch0218_実況者_says_ロードデンドロン_p7277
