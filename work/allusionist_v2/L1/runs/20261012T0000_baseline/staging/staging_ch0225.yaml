      observations:
      - event_ref: E_ch0225_トロメリア_appears_声_p7436
        quote: 無明の暗黒に包まれた異界、輪郭すら捉えられない世界の隙間で、声だけがかろうじて彼の実在を証明していた。
        locator: {}
