    speech:
      observations:
      - event_ref: E_ch0225_トロメリア_other_カーインの理解_p7436
        quote: 「うん、おおむね合ってる。さっすがカーくん、呑み込みが早い」
        locator: {}
        spoiler_after: ch0225
      - event_ref: E_ch0225_トロメリア_other_ティリビナ人の死生観_p7436
        quote: 「スーリウムとノゴルオゴルオに敗れた私たちは『死んだ』。舞台から退場し、自然界において役割を持った生命としての機能を喪失し、土に還って世界に還元されていく。『ティリビナ人たちの世界観』に基づけば、我々は既に終わった存在に過ぎない」
        locator: {}
        spoiler_after: ch0225
      - event_ref: E_ch0225_トロメリア_other_カーイン_p7437
        quote: 「なになに、カーくんめっちゃヘコむじゃん。まだまだ本番これからよ？」
        locator: {}
        spoiler_after: ch0225
      - event_ref: E_ch0225_トロメリア_other_裏工作_p7437
        quote: 「そそ。表で色々動くのはユディニアコンビにお任せして、俺らは仲良く悪巧みとか裏工作とかやっていきましょーってことでよろしく！ クナータちゃんを助けてあげないとね」
        locator: {}
        spoiler_after: ch0225
      - event_ref: E_ch0225_トロメリア_other_スーリウムの弱点_p7438
        quote: 「まーね。誰だってあれに正面から勝つのは難しい。けど奴は全知全能じゃない。というより、全知全能っていう自己規定は『外』を処理できなくて小鬼化まっしぐらだ。『全知全能じゃない自分』を知覚できなくなるのも弱点だしさ」
        locator: {}
        spoiler_after: ch0225
      - event_ref: E_ch0225_トロメリア_other_時間樹の限界_p7439
        quote: 「お、いい例えだねカーくん。実在と有限性は不可分だ。時間樹ってのも、無尽蔵の分岐に見えて限られた数の枝しかないと思うよ。ほら、葉っぱが重なってたら光合成の邪魔なわけじゃん？
          スーリウムが思い描く自然な生命ってのが合理的で美しい樹木の形をしてるとすれば、それは座標や配置の縛りを受けるはずなんだ。時間って空間と不可分だしね」
        locator: {}
        spoiler_after: ch0225
      - event_ref: E_ch0225_トロメリア_other_カーインの撤退_p7441
        quote: 「とはいえカーくんの撤退はかなりいい感じだったよね～。実はこっそり助けようと思ってたんだけど、あの状況を自力で切り抜けるのはちょっとびっくり。おにーさん後輩の成長に思わず涙。キミいつの間に『楽園の抱擁』なんて覚えたの？」
        locator: {}
        spoiler_after: ch0225
      - event_ref: E_ch0225_トロメリア_other_ユディーアとの対話_p7444
        quote: 「話変わるけどさ、カーイン。ユディーアと話した方がいいよ。まず誤解なんとかしよ？」
        locator: {}
        spoiler_after: ch0225
      - event_ref: E_ch0225_トロメリア_other_情報の共有_p7446
        quote: 「カーくんがそれでいいならこれ以上は言わないよ。けど、俺ら四騎士は仲間だ。いくらカーくんの売りが秘密主義だとしても、情報は最終的には共有すべきだって思うよ。今はまだそのタイミングじゃないとしてもさ」
        locator: {}
        spoiler_after: ch0225
      - event_ref: E_ch0225_トロメリア_other_聖妃暗殺の件_p7447
        quote: 「だから聖妃様暗殺の件。ウォンウォンとかアヌちゃんまでマジギレしてるし、本国に戻ったらカーくん主演のスプラッタ映画始まっちゃうやつ。
        locator: {}
        spoiler_after: ch0225
      - event_ref: E_ch0225_トロメリア_other_セリアック＝ニア_p7447
        quote: 「ほーんと頑固だなあ、カーくんは。そう思わない？ ニアちも」
        locator: {}
        spoiler_after: ch0225
      - event_ref: E_ch0225_トロメリア_asks_ユディーアの監視_p7448
        quote: 「今のニアホンに記録してくれたよね？ ユディちの方、任せてもいい？」
        locator: {}
        spoiler_after: ch0225
      - event_ref: E_ch0225_トロメリア_other_沈黙_p7448
        quote: 「みんなドライだねー。沈黙なんて、つまんないと思うんだけどなあ」
        locator: {}
        spoiler_after: ch0225
    action:
      observations:
      - event_ref: E_ch0225_トロメリア_hides_死の狭間_p7441
        quote: トロメリアとカーインは死の狭間で息を殺し、好機を待っていた。 全てはスーリウムの時間樹に捕捉されないために。
        locator: {}
        spoiler_after: ch0225
    relationship:
      observations:
      - event_ref: E_ch0225_トロメリア_observes_カーインの心理_p7441
        quote: 向かい合うカーインがいつになく気落ちしているように感じられたからかもしれない。この男がただ一度の敗北で精神的に崩されることなどあり得ないから、これには別の原因があると見るべきだった。
        locator: {}
        spoiler_after: ch0225
    symbolic:
      observations:
      - event_ref: E_ch0225_トロメリア_other_どこでもないどこか_p7449
        quote: 暗がりから声が途絶える。他者の存在に依存する使い魔の気配が消えていく。 それでも、それはなかったことにはならない。 どこでもないどこかに、確かに存在しているのだ。
        locator: {}
