  mysteries:
  - kind: mystery
    name: MY_スキリシアの神の真意
    note: 神が「世界は遊戯盤」と述べ、カーティスとミシャルヒを「期待できる端末」として選んだ理由。彼の介入が最終的にどのような結末（望む未来）をもたらすのか。
    quotes:
    - quote: 元々僕にとっては世界の全てが遊戯盤で、舞台のようなものに過ぎない。
      paragraph: p3935
    - quote: だがカーティスとミシャルヒは僕の期待に応えてくれることだろう。
      paragraph: p3934
    expected_payoff: 神の介入が単なる娯楽ではなく、より大きな物語の構造（例えば他章の主人公たちとの対比や、世界改変のトリガー）に繋がる。
  - kind: mystery
    name: MY_秩序の更新と災厄
    note: カーティスが予言した「大地が平面となり、それから二つに引き裂かれる」という災厄。これが第五階層の崩壊や、世界そのものの再編成を指すのか。
    quotes:
    - quote: 秩序の更新が近づいている証拠だ
      paragraph: p3945
    - quote: まず大地が平面となり、それから二つに引き裂かれることだろう
      paragraph: p3945
    expected_payoff: 物語のクライマックスで、スキリシアや関連する世界が物理的・概念的に分裂・再統合されるイベントとして描かれる。
  - kind: mystery
    name: MY_少女の正体とアキラとの関係
    note: カーティス（アキラ）を「アキラ様」と呼ぶ少女。彼女が「死人の森を復活させる」と言い、アキラの「罪の苦痛」を愛している理由。彼女が誰なのか（過去の記憶、別世界の存在、あるいは概念的存在）。
    quotes:
    - quote: ねえ、アキラ様
      paragraph: p3957
    - quote: 私は、貴方にあのままであって欲しかった
      paragraph: p3959
    expected_payoff: 少女がアキラの過去（人間時代や転生前）に関わる重要なキーパーソンであることが判明し、アキラのキャラクター成長や悲劇の核心に触れる。
  - kind: mystery
    name: MY_ミシャルヒの裏切りと神の勅命
    note: ミシャルヒが「我が神の勅命だ」としてパーンに牙を剥いた。彼女の神（スキリシアの神？）の真の目的と、ミシャルヒの自我がどこまで残っているのか。
    quotes:
    - quote: 我が神の勅命だ。逆らえん。
      paragraph: p3953
    - quote: 全ては、我らの神こそが紀元槍を手に入れるために
      paragraph: p3953
    expected_payoff: ミシャルヒが完全に支配されているのか、それとも内部で抵抗しているのか。パーンによる救出劇や、ミシャルヒの自我回復の過程が描かれる。
  - kind: mystery
    name: MY_トライデントの命令の真意
    note: トライデントホールディングスがゾーイにカーティスの殺害を命じた理由。単なる競合排除なのか、それともカーティスが持つ「秩序の更新」に関する情報や力を狙っているのか。
    quotes:
    - quote: カーティスと行動を共にして、可能ならば殺害せよ。
      paragraph: p3942
    expected_payoff: トライデントが異世界転生システムそのものや、世界の改変権限を狙っていることが明かされ、ゾーイの立場が複雑化する。
