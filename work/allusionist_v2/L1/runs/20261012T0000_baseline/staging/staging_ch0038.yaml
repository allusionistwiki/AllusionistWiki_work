entities:
- canonical_target: '[[E_char_ミルーニャ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0038_ミルーニャ_reveals_模造品_p1598
        quote: 「面倒な三つ目の奴を先に潰せたのは僥倖でしたぁ。咄嗟の事とは言え、確認もせずに【自殺の黒槍】なんて手に取るあのお気楽女はスーサイダルブラック迂闊としか言いようがないですぅ。自作の模造品ですけど、良くできているでしょう？
          私独自の改良によって、自傷効果を蓄積、遅延させて一気に解放するようになってるんですよー。自殺用オルゴガンローデオルーの滅びの呪文ってとこですかねー。ぶっちゃけ本物より優れてる気しません？」
        locator: {}
        spoiler_after: ch0038
      - event_ref: E_ch0038_ミルーニャ_reveals_トライデントの消化_p1658
        quote: 「喰ってやりました。融血呪というのも案外大した事はないですね。それとも使い手が低位の細胞だったためでしょうか。生意気にも取り込もうとしてくれたので、逆に私が取り込んでやりました。あの程度の脆弱な意思力でこの私を抑え込もうだなんて、ちゃんちゃらおかしいです」
        locator: {}
        spoiler_after: ch0038
      - event_ref: E_ch0038_ミルーニャ_reveals_不死の量産_p1680
        quote: 「メクセトの神滅具、命脈の呪石。宿主に擬似的な不死性を与える呪具ですが、私がフィリスを併用して改良すれば、これは私の不死を再現可能になる。そして私は、これを量産します」
        locator: {}
        spoiler_after: ch0038
      - event_ref: E_ch0038_ミルーニャ_reveals_白血呪_p1680
        quote: 「私は融血呪を凌駕した。氷血呪もあと少しで再現できる。フィリスなら黒血呪を再現できる。そしてこの私が生み出した新たな鮮血呪が完成すれば、私は四つの禁呪全てを掌握した最高の魔女になる！
          全ての禁忌を統合した至高の呪術。万色を合わせた眩い光輝――白血呪が発動するんですよ」
        locator: {}
        spoiler_after: ch0038
      - event_ref: E_ch0038_ミルーニャ_reveals_邪神化_p1681
        quote: 「不死という神秘の零落。星見の塔の連中が後生大事に抱え込んでいる不死資源を世界中にばらまいて、その価値を紙きれと同じになるまで貶めてやるんです――そして実現する、全生命の不死！
          溢れる生命力によってあらゆる既存の価値を崩壊させ、有史以来最大最悪の災厄をこの世にもたらすのです。その後で私はこの世全てを呪う邪神、死ざる女神キュトスとして君臨してやるんですよ。世界中の人間が生の苦しみに喘ぐ様を眺めながらね」
        locator: {}
        spoiler_after: ch0038
    symbolic:
      observations:
      - event_ref: E_ch0038_ミルーニャ_has_property_自己愛_p1711
        quote: 「私の三本足は、『私』です。あはは、『家族』とか『関係』とか『幸福』とかだったらまだ救いがあって綺麗な話だったかもしれないですけどね。けど違った。結局私が大切に思っていたのは、そのままであって欲しいと願ったのは、誰かの為とかそういう立派なものじゃなかった。私は私だけしか大事じゃなかった！
          それを、あの天使は突きつけて証明してくれたんですよ、この身体を弄くり回してね！ 天罰って、こういうことなんでしょうか。ねえ、アズーリア様？ 利己的で保身しか考えていなかったから、だからこんなことになったのかな――？」
        locator: {}
        spoiler_after: ch0038
    visual:
      observations:
      - event_ref: E_ch0038_ミルーニャ_has_property_再生_p1732
        quote: ミルーニャの爪が、ゆっくりと生えつつあった。以前ほどではない。けれど、普通の霊長類よりその治癒速度は上だった。その現象を引き起こす呪力が、どこからもたらされているのか。それは存在しないはずのものだった。失われた、あり得ない現象。
        locator: {}
        spoiler_after: ch0038
  first_appearance_candidate: true
