      - event_ref: E_ch0038_アキラ_observes_ミルーニャの過去_p1691
        quote: メイファーラに託された記憶を想起する。彼女は、ミルーニャに呪具を渡された瞬間にその狙いに気付いた。けれど、裏切られると分かっていてあの黒槍を使い続けた。短い間でも仲間として共に戦った少女のことを信じたかったからだ。
          私は、メイファーラの想いを肯定したかった。 メイファーラが接触感応によって知った、ミルーニャという少女の過去。
