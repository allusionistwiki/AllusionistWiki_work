      observations:
      - event_ref: E_ch0204_ユディーア_uses_銀貨_p6834
        quote: 銀貨を指先で弄び、弾く。夜の闇を裂く銀の軌跡。その先にいる腰の曲がった老婆が、外見からは想像もつかないほど俊敏に硬貨を掴み取った。
        locator: {}
        spoiler_after: ch0204
      - event_ref: E_ch0204_ユディーア_finds_ウルムゾリム_p6839
        quote: 迷宮刑罰者にして名のある探索者でもある『刺青彫り』のウルムゾリム。その名前と居場所はあっさり判明した。
        locator: {}
        spoiler_after: ch0204
      - event_ref: E_ch0204_ユディーア_gives_ニアホン_p6841
        quote: 少し考えてから、ユディーアはニアホンを取り出して見せる。二頭身の猫姫が「にあ」と鳴く。
        locator: {}
        spoiler_after: ch0204
      - event_ref: E_ch0204_ユディーア_attacks_ライラ・ラプス_p6849
        quote: ライラの膝の上にいた犬の胴が突如として伸び上がり、大蛇のように鎌首をもたげたかと思うとユディーアの鉤爪と激突、同規模の呪力を撒き散らしながら弾き飛ばした。
        locator: {}
        spoiler_after: ch0204
      - event_ref: E_ch0204_ユディーア_attacks_ライラ・ラプス_p6858
        quote: 一撃、二撃、そしてとどめ。心臓を抉り出した後で臓物と骨を真横にぶちまけ、追撃で首をはね飛ばした上で頭蓋に鉤爪を突き入れた。
        locator: {}
        spoiler_after: ch0204
    speech:
      observations:
      - event_ref: E_ch0204_ユディーア_learns_天主_p6835
        quote: 『下』で最も尊敬を集める大呪術師にして彩域の支配者が『天主』だ。生半可な覚悟で口にすれば称号の呪力に潰される重みのある異称である。
        locator: {}
        spoiler_after: ch0204
    visual:
      observations:
      - event_ref: E_ch0204_ユディーア_arrives_牢獄街_p6837
        quote: 最初に目指すのは壁に包囲された罪人の棲家。名を、牢獄街という。
        locator: {}
        spoiler_after: ch0204
      - event_ref: E_ch0204_ユディーア_wears_踊り子衣装_p6844
        quote: 水着のような踊り子衣装のトップスと胸部の間に無視できない空隙が存在している。
        locator: {}
        spoiler_after: ch0204
  first_appearance_candidate: true
