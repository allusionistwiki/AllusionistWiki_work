- canonical_target: '[[E_char_ライラ・ラプス]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0204_ライラ・ラプス_captures_ゴーリー邸_p6842
        quote: その名は『傘の魔女』ライラ・ラプス。彼女の目的は『ゴーリーズ』勢力の掌握。怪物ライラの圧倒的な力を前にギャングは抵抗虚しく屈従を強いられた。
        locator: {}
        spoiler_after: ch0204
      - event_ref: E_ch0204_ライラ・ラプス_kills_失敗作の犬_p6847
        quote: 手を握る。肉が潰れ、断末魔の鳴き声と共に鮮血が滴り落ちた。何食わぬ顔で生まれたばかりの命を握り潰し、膝の上の犬を愛おしげに撫でる。「失敗作でしたね。殺処分が妥当でしょう」
        locator: {}
        spoiler_after: ch0204
      - event_ref: E_ch0204_ライラ・ラプス_makes_異形の犬_p6847
        quote: 空間の歪みから湧き出したのは二頭の犬だ。魔女の指先がくるりくるくると踊るたび、犬が粘土のように混ぜ合わされて一つの作品へと変質していく。
        locator: {}
        spoiler_after: ch0204
      - event_ref: E_ch0204_ライラ・ラプス_other_バナナの皮_p6857
        quote: ライラ・ラプスは足下に転がっていたバナナの皮で足を滑らせた。すってんころりん、という間抜けな擬音が可視化され、受け身すら取れない派手な転倒。
        locator: {}
        spoiler_after: ch0204
      - event_ref: E_ch0204_ライラ・ラプス_flees_影_p6861
        quote: 言うが速いか、ライラは黒馬が床に広げた黒い影の中に入って行く。四人の長寿者たちが続けて去って行くと、影は縮小してその場から消滅した。
        locator: {}
        spoiler_after: ch0204
    speech:
      observations:
      - event_ref: E_ch0204_ライラ・ラプス_says_犬の地位向上_p6846
        quote: 「動物愛護？　いいえ、私は犬の地位を向上させたいだけ。『ことば』を与えてね」
        locator: {}
        spoiler_after: ch0204
      - event_ref: E_ch0204_ライラ・ラプス_has_property_命数十九万八千_p6852
