- canonical_target: '[[E_char_ライラ・ラプス]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0237_ライラ・ラプス_appears_使い魔_p7769
        quote: 「あらあら、誰かと思えば宝石の悪魔のお人形じゃないですか」 喋ってもかまわないと判断したのか、使い魔の口を借りて話すライラ。 レメス神の長女にとっては冥府から現世に声を届けることさえ容易いのだろう。
          アバターの犬が器用に口の端を歪めて笑みを浮かべた。「ご安心を。この状況になった以上、私はあなた方と共闘可能です。少なくとも、あの邪魔者を排除するためにはどれだけ手があっても足りないでしょう？」
        locator: {}
        spoiler_after: ch0237
    speech:
      observations:
      - event_ref: E_ch0237_ライラ・ラプス_reveals_ハグレス_p7769
        quote: 「何の話です？」「あら、情報共有が徹底されていないのかしら。ハグレスを認識できていない？ それどころか互いの立場さえ？ ふふ、心を許し合っているように見えたのに、面白いのね」
        locator: {}
        spoiler_after: ch0237
      - event_ref: E_ch0237_ライラ・ラプス_threatens_セリアック＝ニア_p7770
        quote: 「ええ、この間の軽い小競り合いについての説明はあなたにお任せします。『公社警備部の外部協力員』として、侵入者に無様に土をつけられたなんて事実をばらされたら恥ずかしいですものねえ？」
        locator: {}
        spoiler_after: ch0237
      - event_ref: E_ch0237_ライラ・ラプス_suspects_プーハニア_p7771
        quote: 「プーハニアって、確か元マレブランケの人だっけ？ 報告書で名前見た記憶があるよ。虹犬なんだよね。もしかしてライラの知り合いだったりして」
          アズーリアが思いついたように話を振ると、犬は耳をぱたつかせながら小首を傾げた。「プーハニア？ おかしいですね。あの子がその場所にいるはずが」
        locator: {}
        spoiler_after: ch0237
  first_appearance_candidate: true
- canonical_target: '[[E_char_ちびニア]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0237_ちびニア_dies_影_p7772
        quote: 小さな二頭身の胴体が衝撃によって床に叩きつけられる。じたばたともがいても動くのは手足だけ。鋭利な刃で貫かれ、固定されてしまったのだ。爆発は誘い出し。油断していたのは猫姫の方だった。
          せめて襲撃者の正体だけでも確認してセリアック＝ニアの総体に共有しなければ。 命運尽きたちびニアは強引に首をひねり、その姿を目撃した。 絶句。得た情報を別のちびニアたちと同期しようとして、周囲を覆う闇に気付く。
          広がる影の世界が一帯を包み込んでいた。 セリアック＝ニアの総体は己の一部からの連絡が途絶したことを受けてすぐに動くだろう。しかし全ては手遅れだ。先入観と同期の時間差を完全に利用された。
          漆黒の影から突き出した無数の棘に貫かれ、小さな猫姫は沈黙する。
        locator: {}
        spoiler_after: ch0237
      - event_ref: E_ch0237_ちびニア_fights_使い魔_p7772
        quote: 襲撃者の無知と油断を好機と捉えたちびニアはコックピットから緊急脱出して着地、爆風の中を疾走して付近に潜伏しているであろう『爆撃』の詠唱者を探す。
          通路に飛び出し、くんくんと匂いを辿って呪詛の原因を遡る。 濃密な呪力がわだかまる一室に飛び込んで爪を伸ばし、容赦なく飛び掛かる。 引き裂いたのは魔導書を背負った大型猟犬の使い魔だった。
        locator: {}
        spoiler_after: ch0237
  first_appearance_candidate: true
