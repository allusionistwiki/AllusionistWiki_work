  entity_type: terminology
  aspects:
    action:
      observations:
      - event_ref: E_ch0237_爆発_attacks_セリアック＝ニア_p7772
        quote: ライラの発言を遮るような轟音、熱波、衝撃。 突然の爆発が立体幻像を表示する端末ごと猫姫人形を吹き飛ばしたのだ。 猫姫を狙った暗殺。
        locator: {}
