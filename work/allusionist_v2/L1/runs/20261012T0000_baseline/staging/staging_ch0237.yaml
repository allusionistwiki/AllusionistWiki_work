      observations:
      - event_ref: E_ch0237_セリアック＝ニア_other_観覧席_p7762
        quote: 周囲に緊急の要件のためと断りを入れてから席を外す。通路から移動して空いたミーティングルームに入ると、この第五階層における数少ない協力者に柔らかく声をかける。
        locator: {}
        spoiler_after: ch0237
      - event_ref: E_ch0237_セリアック＝ニア_observes_ちびニア_p7762
        quote: 無数の『ちびニア』たちの情報収集は順調とは言い難いものの、人海戦術による地道な監視網は可能性を潰していく作業には向いている。
        locator: {}
        spoiler_after: ch0237
      - event_ref: E_ch0237_セリアック＝ニア_other_通信_p7765
        quote: 情報を共有するべく三人の『同僚』に通信を送る。 トロメリアからのみ『りょーかい！』と『クレイのきらきらおめめウィンクスタンプ』（サイバーカラテ道場公式サイトにて販売中）が返ってくるが、カーインは既読無視、ユディーアは未読のまま。
        locator: {}
        spoiler_after: ch0237
      - event_ref: E_ch0237_セリアック＝ニア_conceals_トリアイナ_p7770
        quote: 救世主トリアイナの降臨はあらゆる利害関係を超越した先に未来を示す。 だが、今はまだこの事実を開示することはできない。 ハルベルトとアズーリアには、特に。
        locator: {}
        spoiler_after: ch0237
    name:
      observations:
      - event_ref: E_ch0237_セリアック＝ニア_names_亡命した王族_p7762
        quote: 彼女に求められているのはクロウサー家の関係者や他の文明圏からの賓客、公社を介した提携関係にある企業の重役といった面々を相手に『亡命した王族』として振る舞うこと。
        locator: {}
        spoiler_after: ch0237
    speech:
      observations:
      - event_ref: E_ch0237_セリアック＝ニア_says_プーハニア_p7762
        quote: 「こんにちは、プーハニアさん。そんなに慌てて、どうかなさいましたか？」
        locator: {}
        spoiler_after: ch0237
      - event_ref: E_ch0237_セリアック＝ニア_asks_中継映像_p7764
        quote: 「あの、レースの中継は確認していますか？」 自信満々に断言するプーハニアの言動に違和感を覚え、猫姫は問いを投げた。
        locator: {}
        spoiler_after: ch0237
      - event_ref: E_ch0237_セリアック＝ニア_says_必要なプロセス_p7766
        quote: 「必要なプロセスです。もっとも、レース中にリーナが立ち直れるかはわかりませんが」 感情を露にするアズーリアとは対照的に冷静に振る舞う。
        locator: {}
        spoiler_after: ch0237
    relationship:
      observations:
      - event_ref: E_ch0237_セリアック＝ニア_suspects_パピヨン犬_p7768
        quote: 「セリアが気になるのはむしろそっちの犬です。何か嫌な感じがするのでどこかに閉じ込めておきませんか？ いえこれは犬が嫌いとかではなく」
          すぐ近くでレースの中継を見ていたプーハニアがショックを受けていたので『関係ない』と首を振って否定しつつ、アズーリアの傍らにいるパピヨン犬に警戒を示す。
        locator: {}
        spoiler_after: ch0237
  first_appearance_candidate: true
- canonical_target: '[[E_char_プーハニア]]'
  entity_type: character
  aspects:
    name:
      observations:
      - event_ref: E_ch0237_プーハニア_names_ブルドッグ氏族_p7763
        quote: 元マレブランケの一員にして現在は公社の警備部職員、ブルドッグ氏族の虹犬プーハニア・トストンスはセリアック＝ニアとユディーアの協力者だ。
        locator: {}
        spoiler_after: ch0237
    speech:
      observations:
      - event_ref: E_ch0237_プーハニア_says_手紙のやり取り_p7763
        quote: 「会場入りの直前、ジュティアとミナがこっそり誰かと連絡してたみたいでよ。それもまじないでの通信とかじゃねえ。鳥を使った手紙のやり取りだ。逆に念入りだろ？」
        locator: {}
        spoiler_after: ch0237
      - event_ref: E_ch0237_プーハニア_promises_制圧_p7764
        quote: 「こいつは当たりかもしれねえ。まあ安心しな。あいつらが何か不審な動きを見せたら、我が警備部が誇る屈強なドローン部隊や猫科魔獣たちがきっちり制圧するからよ」
        locator: {}
        spoiler_after: ch0237
      - event_ref: E_ch0237_プーハニア_says_兵器の購入_p7764
        quote: 「行先を調べたらなんとびっくり、最近になって第八階層からやってきた公社の取引先の支社でよ。情報部の言語魔術師に調べて貰ったら、大量の兵器やら呪具やらが流れまくっててこりゃやべえって報告入れに来たわけよ。ほれ見てくれよ。個人で購入するような量じゃねえだろ？
          テロどころか戦争する気だぜあいつら」
        locator: {}
        spoiler_after: ch0237
      - event_ref: E_ch0237_プーハニア_says_序盤_p7764
        quote: 「いや、最初に選手が揃ったあたりをちらっと見ただけだな。まだ序盤だし、そんなにでかい動きはねえだろ？」 「にあ」 鳴き声と共に端末を突き出し、中継映像を見せる。
          プーハニアの顎が外れた。「えっ、あの二人が反則？ 俺の調査、手遅れかよ！」
        locator: {}
        spoiler_after: ch0237
  first_appearance_candidate: true
