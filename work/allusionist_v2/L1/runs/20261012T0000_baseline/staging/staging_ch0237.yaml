  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0237_ジュティアとミナ_hides_破壊的呪具_p7764
        quote: 購入した大量の破壊的呪具は会場に持ち込まれてこそいないものの、密かに第五階層の外部、レースで通過する予定となっている隣接異界に運搬されているらしい。
        locator: {}
        spoiler_after: ch0237
      - event_ref: E_ch0237_ジュティアとミナ_attacks_選手たち_p7773
        quote: トリシューラの実況から意図的に外されていた『失格者』がリングによって規定されたコースを無視して嵐のように呪詛を放射する。 ジュティアとミナ。より厳密には、ハグレスを名乗る存在の反則行為だった。
          レースから早々に脱落し、背後から迫る死と化した探索者ペア。 二人がやろうとしているのは競技ではなく殺し合いだ。
        locator: {}
        spoiler_after: ch0237
    name:
      observations:
      - event_ref: E_ch0237_ジュティアとミナ_names_ガリヨンテの鎌_p7764
        quote: プーハニアの調べた情報によれば、ジュティアとミナの二人組は『ガリヨンテの鎌』という商会と不自然な取引を行っていたという。
        locator: {}
        spoiler_after: ch0237
  first_appearance_candidate: true
- canonical_target: '[[E_char_アズーリア]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0237_アズーリア_appears_立体幻像_p7765
        quote: 果たして作戦は上手く行っているのか。 転生先は隣接異界の隠し病院と聞いているため、機械女王に依頼してニアホンを運ばせてもらったが、何らかのトラブルが起こったのか反応が途絶している。
          状況は動き続けているが、先手を打つことができない。 内心の焦燥を押し殺して各地のちびニアたちの動きを再考しようとしていたその時、等身大人形が持つ端末に着信。相手の名を見て、一瞬だけプーハニアを気にするがまあいいかと判断して通話を開始。立体幻像の窓の向こうに見慣れた黒衣姿が現れる。
        locator: {}
        spoiler_after: ch0237
      - event_ref: E_ch0237_アズーリア_has_property_使い魔_p7766
        quote: セリアック＝ニアが見咎めたのは、アズーリアの傍らにいる二匹の動物だった。 お座りの姿勢で大人しく待機するパピヨン犬と、黒衣の肩にちょこんと載せられている鹿と鳥に似た奇妙な獣。枝角と翼は青禍鳥のペリュトンようだが、蹄ではなく霊長類的な手足をわさわさと動かして黒衣の上を這いまわっているのがやや気味悪い。
        locator: {}
        spoiler_after: ch0237
    speech:
      observations:
      - event_ref: E_ch0237_アズーリア_asks_中継映像_p7765
        quote: 「セリア、レースの中継映像、観た？！」「落ち着いて下さい、アズーリア。機械女王とミルーニャから連絡があったはずでしょう」
        locator: {}
        spoiler_after: ch0237
      - event_ref: E_ch0237_アズーリア_confesses_呪い_p7768
        quote: 「まさかとは思いますが、倒したライラ・ラプスに呪われたなんてことは」「はい」「はいじゃないでしょう怒りますよ」
        locator: {}
        spoiler_after: ch0237
      - event_ref: E_ch0237_アズーリア_other_作戦_p7771
        quote: 「とにかく、レースの件はトリシューラに対処を任せてセリアたちはそのサポートに回りましょう。アズーリアはそこの駄犬と『虫王の庭』でハグレスを待ち構える、ということでいいんですよね？」「うん、任せといて。あんなのがいたらレースもライブも台無しだからね」
        locator: {}
        spoiler_after: ch0237
  first_appearance_candidate: true
