- canonical_target: '[[E_char_トリシューラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0237_トリシューラ_says_実況_p7773
        quote: 「さあ、いよいよ開幕した空使い選定レース、序盤から大荒れの展開となっております！ 現在トップを独翔するのは言わずと知れた天空の反逆者、賊王パーン！
          それに続くように二番手グループが団子状態！ クロウサーの本流ダウザールと分家エンハが機を窺うようにパーンの後ろを追い、マルガリータ、ファーガスト、クリーナー、やや遅れてビルメーヤ、リーナ、ロードデンドロン、大きく引き離されたジーゼロが続く！」
        locator: {}
        spoiler_after: ch0237
      - event_ref: E_ch0237_トリシューラ_other_炎天使_p7795
        quote: 「ここまでが表向きの機能。『天使を再現可能なものとして召喚する』から化身なんだけど、その隠された本質は『寿命価値の零落』なんじゃないかな。長命者だろうと転生者だろうと来訪者だろうと天寿を百分率で数値化してフラットに捉えることで、寿命価値を老若問わず均している。ジュティアとミナがパーンに対して使うなら有利に働くし、ダウザールに対してはもっとだよね」
        locator: {}
        spoiler_after: ch0237
  first_appearance_candidate: true
- canonical_target: '[[E_char_ジュティア]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0237_ジュティア_uses_シャルマキヒュの凍視_p7774
        quote: ジュティアの浄界は、『シャルマキヒュの凍視』という『視線を実在化する呪術基盤』によって魔弾として成型された追尾矢弾である。 弾丸はそれ自体が持つ『主観視点』に立脚した浄界を構築し続けていた。
          すなわち、追尾型魔弾は捕捉した対象の背後に『追い縋る世界』を展開する。
        locator: {}
        spoiler_after: ch0237
      - event_ref: E_ch0237_ジュティア_kills_ミナ_p7780
        quote: 必中のはずのジュティアの魔弾は狙いを逸れていった。 その先にいたのは、不運にも炎の翼を広げて飛翔していたジュティアのパートナーだ。 魔弾がパーンに対する妨害を繰り返していたミナの心臓を貫く。
          あまりにもあっけない、誤射による絶命。
        locator: {}
        spoiler_after: ch0237
      - event_ref: E_ch0237_ジュティア_other_ミナ_p7780
        quote: 「再装填。圧縮。成型。サイクル進行」 事故で仲間を失ったとは思えないほどに無機質な言葉が静寂を打ち破り、墜落していくミナの死体を回収したジュティアが次の魔弾を構築していく。「殉死ニヨル天寿完遂ヲ確認。条件達成。審判ヲ開始シマス」
        locator: {}
        spoiler_after: ch0237
      - event_ref: E_ch0237_ジュティア_transforms_小鬼_p7790
        quote: 意に添わぬ行動への反発によって邪視者の自我に亀裂が走った。 ミナの死によって半狂乱となったジュティアは既に正常な精神状態を維持できていない。浄界は暴走し、半ば小鬼に堕ちかけている。
          ゴブリン級の現実改変呪力が空中をでたらめに荒れ狂う。
        locator: {}
        spoiler_after: ch0237
      - event_ref: E_ch0237_ジュティア_flees_ハグレス_p7792
        quote: 光の中で、ジュティアの瞳が大切なものを取り戻していく。 ハグレスの呼び声が遠ざかっていくようだった。 遠ざかる魔女の背がアヴロノの狩人に何かを語ることはなかったが、輝くような空の道は紛れもなく救いだ。糸を断ち切って、ジュティアは墜落したミナのもとに急ぐ。
          地上で待機していたガロアンディアンの機械人形が保持していた燐血の民の遺体は、呪縛から解放された安らかな表情を浮かべていた。
        locator: {}
