        locator: {}
        spoiler_after: ch0251
      - event_ref: E_ch0251_ファーガスト・ガディン_other_閃空騎士団_p8087
        quote: その後、カーズガンが守護の九槍入りすると共にファーガストを含めた愚連隊の構成員たちは『聖印による赦免』を受けて釈放。全員が新たに結成された『閃空騎士団』と呼ばれる探索者集団に加入する。
        locator: {}
        spoiler_after: ch0251
      - event_ref: E_ch0251_ファーガスト・ガディン_uses_ラーテ_p8087
        quote: １２歳で加護を選択するより前から街のシンボルである『英雄の母』フリグメルタの大蟻塚とその夫である『豊穣の死神』フルグントの大宝物庫を遊び場に、愛馬ラーテと共に空や異界が内包された古代迷宮を駆け巡っていた。草の民として加護を得た後は三本足を愛馬ラーテに定め、
        locator: {}
        spoiler_after: ch0251
      - event_ref: E_ch0251_ファーガスト・ガディン_fights_罠_p8096
        quote: 『売られたケンカは買うだろ。当然』『上等だ、かましてやるよ。お前らタイミング最高。いい感じに盛り上げてくぞ』『ファーガスト参上だゴラァ！！』『夜・路・四・駆』
        locator: {}
