- kind: mystery
  name: MY_ルバーブの出自と師匠の罪
  note: ルバーブが「純粋な大地の民」ではない可能性と、人形師（邪法使い）の下で修行していた背景。後の「混じりもの」としてのアイデンティティ確立に繋がる。
  quotes:
  - quote: ルピナス爺さん――元人形師の老人に弟子入りできたのは望外の幸運だと考え、必死に教えを吸収した。師が逮捕され、初めてそれが邪法だと知った。
    paragraph: p3
    quote_verified: true
  - quote: 『お前の親は多分、純粋な大地の民じゃねえ。俺に近い、夜と夢のにおいがする。どっちつかずの混じりものだ。』
    paragraph: p6
    quote_verified: false
  expected_payoff: ルバーブが「王」になる過程で、この出自（大地の民ではない＝球神の加護の外側）が彼の統治哲学や、「美しさ」への執着（代償行為）の源泉として回収される。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_王宮への憧憬と美の定義
  note: 貧民街での生活を経て王宮の「曲線」や「清浄さ」に憧れた経験が、後のマラード（またはルバーブが見た理想の王）像の原型となっている。
  quotes:
  - quote: 汚れた都市の周辺には木板を組み合わせた不格好な小屋しかなかったから、綺麗な曲線に憧れた。
    paragraph: p18
    quote_verified: true
  - quote: 砂で関節が軋むようなことのない清浄な空気。泥の混じっていない水。汚れていない布。均整のとれた柱やアーチ、階段や天井。
    paragraph: p23
    quote_verified: true
  expected_payoff: マラードが追求する「完璧な美」とは、ルバーブが幼少期に渇望した「汚れていない世界」の投影であることが判明し、それが虚構（幻想）であることの悲劇性として回収される。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_マラードの白い部屋での実験記憶
  note: マラードが人間として生まれる前、試験管や薬品の中で「試作」されていたという記憶。「アダム・カドモン」「レゴン細胞」などの用語から、人造人間またはクローンである可能性が高い。
  quotes:
  - quote: 始まりは白い部屋。幾つもの薬瓶、消毒液の臭い、清潔な空気。
    paragraph: p65
    quote_verified: true
  - quote: 『アダム・カドモン』『最終始祖イネクシュネ』『原初の土』『ベルラクルラール』『代替者』『レゴン細胞』『ワイヤード』『呪髪の精神加工端子化』
    paragraph: p70
    quote_verified: true
  expected_payoff: マラードが「王」としての義務を全うできなかったのは、彼が「人間」ではなく「実験体」であり、愛着や自己肯定感の回路（母性）が欠落していたためであるという真相の回収。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_アレッテとルバーブの対立構造
  note: アレッテは「マラードを愛する者」として、ルバーブは「マラードを操る者（従僕）」として対立している。両者のマラードに対する執着の質の違い。
  quotes:
  - quote: 「お前はマラードを言い訳に使った。彼を利用した。王者の責を押しつけた！ その罪、生ぬるい死くらいで贖えるものではないと知りなさい！」
    paragraph: p262
    quote_verified: true
  - quote: 「俺は許されると知っていてルバーブを殺した！ これが自立なものか、これが操り人形であることへの反抗なものか。これは甘えだ、俺の弱さだ！」
    paragraph: p372
    quote_verified: true
  expected_payoff: 最終的にルバーブは「マラードを解放する（殺す）」ことで、アレッテが求めた「美しさの保持」ではなく、「苦痛からの解放」を選んだことが示唆される。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_ダモクレスの剣の落下
  note: 物語の結末で突如出現する「幻想の法、ダモクレスの剣」。これが単なる兵器なのか、世界を修復するための「メタフィクション的強制力」なのか。
  quotes:
  - quote: 夜の闇を切り裂いて、天空から巨大な剣が落下する。 幻想の法、ダモクレスの剣。 それは権力を選定し、制御を失った暴力を切り裂く。
    paragraph: p432-p434
    quote_verified: true
  expected_payoff: この世界が「物語（ナラティブ）」であり、その崩壊を防ぐためのメタ的な介入（あるいは作者の意志）として機能していることが暗示される。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
