entities:
- canonical_target: '[[E_term_異世界転生保険]]'
  entity_type: terminology
  aspects:
    name:
      observations:
      - event_ref: E_ch5053_異世界転生保険_requires_加入額_p101
        quote: 異世界転生保険。その加入額にすら手が伸ばせない、ただその日の糧を得ることすら難しい、極寒の世界を生きる人々。選択肢などあるようで実は無い。用意された道は全てが空求人。
        locator: {}
        spoiler_after: ch5053
  first_appearance_candidate: true
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5053_アキラ_makes_感情制御による人格形成_p106
        quote: 屍を直視するたび、感情に蓋をする。そうやって心を平常に保ち続けて、シナモリ・アキラが出来上がっていく。外圧によってではない。外圧を全て感情制御ではね除けて、シナモリ・アキラは内圧だけで形成されたのだ。
        locator: {}
        spoiler_after: ch5053
      - event_ref: E_ch5053_アキラ_takes_壊れた左義肢_p133
        quote: '壊れてしまった左の義肢を、そっと持ち上げる。

          どうしてかは分からなくても、身体は反射のように動いた。'
        locator: {}
        spoiler_after: ch5053
      - event_ref: E_ch5053_アキラ_other_少年の左手_p135
        quote: 砕け、融解した機械の義肢と、闇色の左手が触れあった。
        locator: {}
        spoiler_after: ch5053
      - event_ref: E_ch5053_アキラ_loses_見当識_p48
        quote: '右と左という観念すらあやふやになりそうな錯覚。

          見当識を失って、視界が反転する。

          上下が逆さまになった中で、少年の何もかもを見透かすかのような視線が俺を貫く。'
        locator: {}
        spoiler_after: ch5053
      - event_ref: E_ch5053_アキラ_kills_殺戮_p6
        quote: 俺が振りまいた殺戮、それによって大切な者を失ったという嘆き、悲しみ、怒り、憎しみ。
        locator: {}
        spoiler_after: ch5053
      - event_ref: E_ch5053_アキラ_other_シナモリ・アキラとしての生_p72
        quote: 'シナモリ・アキラという存在を回想する。

          半年前ではなく、新たな生を受ける前。暗く、沈んだ人生を思い起こす。'
        locator: {}
        spoiler_after: ch5053
    speech:
      observations:
      - event_ref: E_ch5053_アキラ_says_感情の交換可能性_p120
        quote: シナモリ・アキラはその感情をただありふれたものだと見なして、交換可能と声高に叫ぶ。
        locator: {}
        spoiler_after: ch5053
    visual:
      observations:
      - event_ref: E_ch5053_アキラ_observes_虚空の眼球_p28
        quote: 飛び出して、虚空に浮かぶ眼球がぐるりと周囲を見渡す。
        locator: {}
        spoiler_after: ch5053
      - event_ref: E_ch5053_アキラ_finds_猫耳の少年_p36
        quote: '猫耳。

          闇の中に、猫耳の少年が立っている。

          悪鬼たちの包囲の外、ひとりだけで立ち尽くす彼は、俺を見ていた。

          そう、彼には意識があるようだった。'
        locator: {}
        spoiler_after: ch5053
      - event_ref: E_ch5053_アキラ_has_property_高性能なオーダーメイド義肢_p88
        quote: シナモリ・アキラは腕が無いということで不自由した経験が無かった。裕福だったからだ。親は小さな赤ん坊に高性能な義肢を与えた。
        locator: {}
        spoiler_after: ch5053
  first_appearance_candidate: true
- canonical_target: '[[E_term_E-EEmotional-Emulator]]'
  entity_type: terminology
  aspects:
    name:
      observations:
      - event_ref: E_ch5053_E-EEmotional-Emulator_functions_as_感情制御アプリ・人格の代行_p110
        quote: '人格に深く根ざした感覚・感情制御アプリ『E-E』＝『Emotional-Emulator』はそれ自体がシナモリ・アキラをエミュレートして、あらゆる決定を代行している。

          決断をアウトソーシングする為のアプリケーション。'
        locator: {}
        spoiler_after: ch5053
  first_appearance_candidate: true
- canonical_target: '[[E_char_シナモリ・アキラ]]'
  entity_type: character
  aspects:
    name:
      observations:
      - event_ref: E_ch5053_シナモリ・アキラ_defines_E-Eのユーザー登録名_p117
        quote: 'だから『それ』は本名ではなく、シナモリ・アキラと呼ばれるのだ。

          本来いた筈の誰かは、ずっと昔にどこかに引っ込んでいなくなってしまったのだから。

          その代用、模倣と言いつつ、もはやそれが真実になってしまった存在。

          『E-E』のユーザー登録名シナモリ・アキラは、そうやって生起された。'
        locator: {}
        spoiler_after: ch5053
  first_appearance_candidate: true
- canonical_target: '[[E_org_悪鬼たち]]'
  entity_type: organization
  aspects:
    action:
      observations:
      - event_ref: E_ch5053_悪鬼たち_wounds_アキラの身体_p12
        quote: 激流によって既に原形をとどめていない身体に、刃の群れが突き刺さる。胸を抉り、腹を貫き、脚を引き裂いて、腕を砕く。
        locator: {}
        spoiler_after: ch5053
      - event_ref: E_ch5053_悪鬼たち_wounds_アキラの顔面・感覚器官_p14
        quote: 顔面を拳が殴打する。鼻がひしゃげて血を吹き出す。絶叫が耳を裂いて鼓膜を破る。用を為さなくなったと知ると今度は口に言葉が注ぎ込まれて舌と歯が残らず抜かれる。大量の血。眼球を抉り出してその穴に悪口雑言。頭蓋を開いて脳髄に刻み込む。
        locator: {}
        spoiler_after: ch5053
      - event_ref: E_ch5053_悪鬼たち_breaks_アキラの全身_p16
        quote: 全身を解体される。ばらばらになって、欠片のひとつひとつに憎悪の刃が突き立てられる。
        locator: {}
        spoiler_after: ch5053
      - event_ref: E_ch5053_悪鬼たち_repairs_アキラの肉体_p22
        quote: '青い血涙を流す悪鬼たちが、いつしか引き裂く手を止めて、針と糸を手に肉片を縫合する。

          元通りになった肉体を、そしてまた蹂躙する。'
        locator: {}
        spoiler_after: ch5053
      - event_ref: E_ch5053_悪鬼たち_transforms_復讐の意思_p9
        quote: 悪鬼たちの無数の感情は、いつしか結実し、復讐という名の意思となって実体化していく。
        locator: {}
        spoiler_after: ch5053
    speech:
      observations:
      - event_ref: E_ch5053_悪鬼たち_says_お前が殺した_p18
        quote: 'お前が殺した。

          愛する人を。大切な者を。かけがえのない家族を。

          死者の無念を聞け。その苦痛を味わえ殺人鬼め。'
        locator: {}
        spoiler_after: ch5053
      - event_ref: E_ch5053_悪鬼たち_says_永劫の苦痛_p26
        quote: 永劫の苦痛、終わりのない死。貴様が殺してきた分だけの死を体験するがいい。
        locator: {}
        spoiler_after: ch5053
    symbolic:
      observations:
      - event_ref: E_ch5053_悪鬼たち_has_property_感情の坩堝_p3
        quote: '感情の坩堝。

          悪鬼たちが融合した肉塊の内部は、俺という邪悪への感情が煮えたぎる大釜だった。'
        locator: {}
        spoiler_after: ch5053
  first_appearance_candidate: true
- canonical_target: '[[E_char_猫耳の少年]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5053_猫耳の少年_says_規範は外部にある_p127
        quote: 『心を鎖した貴方は、だからこそ規範を外部に求めている。貴方にとって大切なものは、内側じゃなくて外側にあるんだね』
        locator: {}
        spoiler_after: ch5053
      - event_ref: E_ch5053_猫耳の少年_says_真実は行動に宿る_p131
        quote: 『貴方の真実は心ではなく行動に宿る。ちょうど、言葉を真実にしてしまうアズーリアと対になるように』
        locator: {}
        spoiler_after: ch5053
      - event_ref: E_ch5053_猫耳の少年_says_道を信じて立つべき場所_p137
        quote: 『自分の歩いてきた道を信じて。その先に、貴方が立つべき場所がある』
        locator: {}
        spoiler_after: ch5053
      - event_ref: E_ch5053_猫耳の少年_says_巡り合わせ_p41
        quote: 『どうしてだろうね。貴方は何をどうやっても僕と引き合ってしまう巡り合わせらしい』
        locator: {}
        spoiler_after: ch5053
      - event_ref: E_ch5053_猫耳の少年_says_アズーリアとの引き合い_p51
        quote: 『いずれ貴方はアズーリアとも引き合うんだろうね、儚く危ういゼノグラシア』
        locator: {}
        spoiler_after: ch5053
      - event_ref: E_ch5053_猫耳の少年_says_救済の宣言_p58
        quote: 『であれば、貴方はここで失われるべきではない。貴方が僕を救い出してくれたように、今度は僕が貴方を救い出そう』
        locator: {}
        spoiler_after: ch5053
      - event_ref: E_ch5053_猫耳の少年_says_存在の遡行と語り直し_p65
        quote: 『さあ、貴方という存在を、遡って。そして語り直すことを許して欲しい。それがどんな痛みでも、そこから貴方という存在が立ち上がってくるはずだから』
        locator: {}
        spoiler_after: ch5053
    visual:
      observations:
      - event_ref: E_ch5053_猫耳の少年_has_property_左手は影のような黒_p43
        quote: その左手が影のような黒であることに、今更気がつく。
        locator: {}
        spoiler_after: ch5053
      - event_ref: E_ch5053_猫耳の少年_has_property_右手は淡い輝き_p44
        quote: '反対の右手は淡い輝きを纏っている。

          否、逆だろうか。左手は闇かと思えば光のようであり、右手は輝いているかと思えば色を失っている。'
        locator: {}
        spoiler_after: ch5053
    symbolic:
      observations:
      - event_ref: E_ch5053_猫耳の少年_has_property_全き慈悲の心_p54
        quote: '透徹した意思が、俺の中に染み込んでくるようだった。

          無色透明なその感情は、全き慈悲の心。'
        locator: {}
        spoiler_after: ch5053
    action:
      observations:
      - event_ref: E_ch5053_猫耳の少年_stops_悪鬼たちの手_p60
        quote: '悪鬼たちの手が、一斉に静止する。

          夥しい数の憎悪。その動きが、より巨大なものによって遮られている。'
        locator: {}
        spoiler_after: ch5053
      - event_ref: E_ch5053_猫耳の少年_repairs_アキラの実体_p63
        quote: 少年の左手、あるいは右手から流出する無彩色の光。それは瞬時に俺の欠片を取り囲むと、新しい輪郭を創造する。光り輝く輪郭は形を成し、脈動と共に実体を持ち始める。最後に、俺という実体が活動を始める。
        locator: {}
        spoiler_after: ch5053
  first_appearance_candidate: true
- canonical_target: '[[E_char_カイン三つの手]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5053_カイン三つの手_appears_光と言葉_p141
        quote: 'そして、空が割れ、光と共に言葉が降り注ぐ。

          『君を殺すのは私だと言ったはずだ』

          『守るという約束、嘘にする気はありません』

          『ぽんこつって言葉、撤回させるまで絶対に死なせないからっ』'
        locator: {}
        spoiler_after: ch5053
  first_appearance_candidate: true
- canonical_target: '[[E_char_三つの手]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5053_三つの手_saves_アキラ_p147
        quote: '壊れた左腕を、三つの手が掴む。

          引き上げられる。

          空へ。

          世界へと。'
        locator: {}
        spoiler_after: ch5053
  first_appearance_candidate: true
- canonical_target: '[[E_term_社会]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5053_社会_defines_正しさの樹脂・トリクルダウン_p81
        quote: 正しさという樹脂を固めて成型。モデルは豊かな現実。五十六億七千万年後に来たる救世トリクルダウン。優しくて柔らかな虐殺の文法。仮構した問題の最終的解決。存在しない衝突の解消。異常はすべて処理。社会の完全なる正常化。バックグラウンドでは既にして内戦状態。凍死の十二月。無造作な死。千引きの岩は段ボールで出来ている。来世は実在する。
        locator: {}
        spoiler_after: ch5053
  first_appearance_candidate: true
- canonical_target: '[[E_char_片腕の男]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5053_片腕の男_has_property_義肢への羨望・路上生活_p86
        quote: ある男が義肢を羨ましそうに見ている。右腕を失った男。倉庫作業中の事故。日雇いの仕事で食いつないでいた彼は路上で生きることになる。男がその思いをはっきりと口に出すことはついに無かった。
        locator: {}
        spoiler_after: ch5053
  first_appearance_candidate: true
- canonical_target: '[[E_char_あのひと]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5053_あのひと_says_罪悪感の見当外れ_p90
        quote: 『あの人』が言った。その罪悪感は見当外れだと。奇しくも、アズーリアと似た言葉だった。
        locator: {}
        spoiler_after: ch5053
  first_appearance_candidate: true
- canonical_target: '[[E_term_世界]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5053_世界_defines_決定論的世界観_p93
        quote: 'それは決定論の世界観。最初から定められている不平等。

          自分は与えられている人間なのだと、いつのまにか見なくなってしまった片腕の男、その定位置を眺めながら思った。行き先を尋ねると、あの人はただ無言で首を振った。そういうことなのだと思った。'
        locator: {}
        spoiler_after: ch5053
  first_appearance_candidate: true
- canonical_target: '[[E_term_来世]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5053_来世_defines_決定論を覆す救い_p97
        quote: '来世は実在する。

          決定論を覆す、どうしようもない現実に救いをもたらす次の世界。

          死は救いだ。転生が選べない生まれを選べるようにしてくれる。'
        locator: {}
        spoiler_after: ch5053
  first_appearance_candidate: true
