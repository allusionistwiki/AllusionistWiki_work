- canonical_target: '[[E_item_チッセ]]'
  entity_type: item
  aspects:
    speech:
      observations:
      - event_ref: E_ch5584_チッセ_says_踊ってあげる_p100
        quote: 「そっちのドレスも出しなよ～、踊ってあげる～！」
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_チッセ_says_呪力不足_p116117
        quote: 「あは～！　まさか、呪力が足りなかったの～」
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_チッセ_says_時系列の整合性_p17
        quote: 「幼少期に灰の天主に弟子入りして～？　悪鬼女王の直属部隊から緑の君とスーリウムに接触ぅ？　でもって小さいころはティリビナ人として育てられて、姉をリンチで焼き殺されて、そのあと別の歴史の姉と仲良くしてて？　ティリビナ人のために緑の天主を目指す？　時系列とか整合性めちゃくちゃじゃ～ん！　いらいら～！！」
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_チッセ_says_辻褄が合わない_p6
        quote: 「それだとさぁ～、辻褄が合わないじゃ～ん！」
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_チッセ_says_盗めない_p86
        quote: 「見ただけで盗めるわけないでしょ～」
        locator: {}
        spoiler_after: ch5584
    symbolic:
      observations:
      - event_ref: E_ch5584_チッセ_appears_as_黄金偶像_p102104
        quote: '間違いない、黄金のドレスだ。

          かつて相対した圧倒的な影の存在感と、魔竜の恐ろしさを思い出してリーナは逃げ出したくなった。チッセは紛れもなく、現代における黄金偶像のひとり。'
        locator: {}
        spoiler_after: ch5584
    action:
      observations:
      - event_ref: E_ch5584_チッセ_makes_慈雨_p106109
        quote: 'それだけではない。輝く雲が、主役を引き立たせるように慈雨を降らせている。

          クロウサーとティリビナの調和を、レルプレアのレコードゴーストを上書きすることで強引に成立させている。強大な力を持つがゆえの有無を言わさぬ権威の誇示。'
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_チッセ_makes_矢弾_p2628
        quote: '追い付こうとするチッセの大河が爆ぜた。

          あらゆる生物種の可能性に分岐するチッセの体内生態系は、突然変異の群れが織りなす『軍勢』となって星の数ほどの矢弾と化す。'
        locator: {}
        spoiler_after: ch5584
    visual:
      observations:
      - event_ref: E_ch5584_チッセ_transforms_女神レルプレア_p8890
        quote: 'チッセの容貌が、ティリビナ的な花や草木に覆われた女神の如き姿に変わる。

          それは樹木巨人でありながら、神話に語られる女神レルプレアにどこか似ていた。

          遠ざかるレコードゴーストに自ら重なっていくように、世界の座標を操作して残影とひとつになる。'
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_チッセ_wears_黄金のドレス_p9298
        quote: '編み込んだ麦をイメージしたようなティアラが星の光を反射してきらめく。

          黄金に輝くドレスが、大量の生命を少女の形に整えていく。

          神々しい天衣だった。淡い金色は風にそよぐ豊穣の風景を想起させ、差し色のオリーブグリーンや褐色が強い生命の輝きを更に際立たせている。'
        locator: {}
        spoiler_after: ch5584
  first_appearance_candidate: true
- canonical_target: '[[E_char_ロードデンドロン]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5584_ロードデンドロン_fights_チッセ_p111113
        quote: '絶望的な戦力差があるにも関わらず、ロードデンドロンは相手の挑戦を受けて立った。

          対抗するようにティリビナ人が幻惑的な光を解き放つ。

          出現した天衣のメインカラーは黄金ではなく白銀。'
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_ロードデンドロン_uses_融血呪_p142145
        quote: 'その対抗手段として、ロードデンドロンは一体化を図ることで女神の権威とクロウサー家の権威の総取りを目論んでいるのかもしれない。

          なんという蛮勇だろうか。失敗すれば彼はチッセの世界に取り込まれて、個我と魂を塗りつぶされながら存在ごと消滅するだろう。'
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_ロードデンドロン_travels_暗黒のサーキット_p24
        quote: ロードデンドロンは無限の広さを持つ暗黒のサーキットを踏破すべく更に加速。
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_ロードデンドロン_fights_チッセ_p34
        quote: キノコに覆われた箒の上に立つロードデンドロンは、生命の激流を乗りこなすかのように飛び回る。曲芸飛行さながらの機動でレルプレアの残影に追随し、時にチッセに対して挑発するように肉薄。レースと並行しての高速呪文戦闘によって両者の間に火花が散った。
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_ロードデンドロン_fights_呪文戦_p5760
        quote: '歴史教科書に関する呪文戦を継続しながら、ロードデンドロンはその都度、論点を何度もずらして攻め手を変えていく。

          だが彼の指針はぶれておらず、スタンスはずっと一貫していた。

          ティリビナ人の未来のために。'
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_ロードデンドロン_other_闘争心_p7880
        quote: '回想では協調を重んじるタイプであった彼が、いまは剝き出しの闘争心で巨人たちに果敢に挑みかかっている。

          少なくとも、道を選んでいるという一点において彼はリーナの先を行く。'
        locator: {}
        spoiler_after: ch5584
    visual:
      observations:
      - event_ref: E_ch5584_ロードデンドロン_wears_白銀の天衣_p117121
        quote: '白銀を基調にしたスカートは濡れた花弁のような光沢のある素材だが、随所にツツジの花冠をイメージしたデザインを取り入れていた。

          上半身は透け感が特徴的なオーガンジー生地。濃緑の長髪を幽かな光を帯びた透明な筒状の花飾りが彩り、ショートブーツの上には小さな菌傘を抽象化したチャームが付いた白銀のアンクレット。'
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_ロードデンドロン_transforms_天衣への適合_p125127
        quote: 'いつの間にか、ロードデンドロンの容貌が天衣に合わせるように変化していた。

          ティリビナ人の身体に突き刺さったチッセの生物群の矢。'
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_ロードデンドロン_appears_as_もう一人の女神_p146148
        quote: 'ロードデンドロンはいまやもう一人の女神としてそこにあった。

          皮肉なことに、チッセの力が彼の呪力を引き上げているのだ。'
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_ロードデンドロン_appears_as_エスト_p170176
        quote: 'ティリビナ的な樹皮の肌が変化して、別人のような容貌になっている。

          「エスト？」

          友人であるティリビナの巫女に瓜二つ、どころか完全に同一に見えた。'
        locator: {}
        spoiler_after: ch5584
    speech:
      observations:
      - event_ref: E_ch5584_ロードデンドロン_says_略奪の歌_p123
        quote: 「そう。足りないから、奪うしかない。この激情は寄生。ギンリョウソウとマイコニドが歌う、略奪の歌」
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_ロードデンドロン_says_融合の意図_p152
        quote: 「見ただけで盗めない。だから、この時を待っていた。私がお前に融け合えば、クラウビューラもお前を傷つけることを恐れて迂闊に動けない」
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_ロードデンドロン_says_歌_p3638
        quote: '圧倒的な力を前にしながら、ロードデンドロンは歌い続けていた。

          現代的な電子音が響いている。星のスポットライトを浴びながら、小さな仮想使い魔（ボーカルフェアリー）が踊り出す。

          耳慣れないティリビナの文化の響きが、あるはずもない宇宙の大気を振動させて、世界に少数種族の存在を知らしめようとしていた。'
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_ロードデンドロン_says_歴史の勝者_p5355
        quote: 「歴史を書き換え、非道な虐殺の責任を回避しようとするのはクロウサーだから許されると？！　ならば我らの行いも同じこと。ロードデンドロンは、歴史の勝者であるクロウサーなのだから！！」
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_ロードデンドロン_says_浄界への招致_p82
        quote: 「私を浄界の中に招いたのは失敗だ、チッセ。カーインの因子と植物想は、お前の世界にあるのだからな」
        locator: {}
        spoiler_after: ch5584
    relationship:
      observations:
      - event_ref: E_ch5584_ロードデンドロン_other_ティリビナ人部隊の矛盾_p13
        quote: 儀式後も以前の形質は保存されるはずで、つまりロードデンドロン＝カーインが正しいならそのモロレク部隊はティリビナ人部隊でなければおかしい。
        locator: {}
        spoiler_after: ch5584
  first_appearance_candidate: true
- canonical_target: '[[E_term_青い血]]'
  entity_type: terminology
  aspects:
    action:
      observations:
      - event_ref: E_ch5584_青い血_binds_ロードデンドロンとチッセ_p128133
        quote: 青い血は、いつの間にかロードデンドロンから生命群をロープのように伝ってチッセまでも侵食している。術者であるチッセがそれによって傷つくことは無かったが、それによって両者の間には呪術的に強固なつながりができていた。
        locator: {}
        spoiler_after: ch5584
  first_appearance_candidate: true
- canonical_target: '[[E_char_リーナ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5584_リーナ_thinks_融血呪_p136140
        quote: '（嘘でしょ？　自殺行為じゃん！）

          リーナの知る限り、サンブル家の夫婦が得意としていた青い血は『星見の塔』が禁呪に指定している危険な呪術、融血呪だ。

          異なる個我を魂や肉体ごと融け合わせ、ひとつにしてしまう極めて危険な秘術。'
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_リーナ_thinks_エクリエッテの盟約_p15
        quote: 噂だとティリビナ人たちはキュトス戦団のエクリエッテ直属部隊だけに力を貸すという盟約を結んでいるってエストが言ってた。なのに）
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_リーナ_thinks_歌声の仕組み_p168
        quote: （あれって、声帯まで完全に変化してるの？　それともボカフェの機能？　ピッチシフトとフォルマント変調で、女の人の歌声みたいに聴こえてるのかな？）
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_リーナ_thinks_レルプレア参照_p176182
        quote: '状況から考えれば明らかにレルプレアを参照したことが原因で、エストもロードデンドロンも女神レルプレアにそっくり、ということなのだろうが。

          （なんでこんなにざわざわするんだろ）

          美しい音楽と心地良い歌声だからこそ、その裏に秘められた不吉さが怖かった。'
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_リーナ_thinks_外見の違い_p183193
        quote: '（なんで、普通のティリビナ人と女神レルプレアの容姿が違うの？）

          エストの霊長類的な外見は始祖たるアルラウネやその子供たちであるベルカーイン、スーリウム、レルプレアに近いはずだ。

          つまり現ティリビナ人の樹木的な肌は、きっとレルプレア以降の特徴なのだ。'
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_リーナ_thinks_差別の理由_p193196
        quote: '（おかしい。外見の違いで差別するなんてあっちゃいけない。けど、それは明らかに異獣認定の理由に使われてしまっている。どうして女神がわざわざそんなことをしたんだろう。どんな理由があったらそうなるの？）

          この疑問を放置してはならない。'
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_リーナ_asks_どゆこと_p2
        quote: 回想シーンの終了と同時に、リーナは「どゆこと？」と呟いた。
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_リーナ_asks_死せる女神の言葉_p202205
        quote: 'リーナもまた過去の残影に手を伸ばす。

          その遺志と向き合い、答えを出すために。

          「死せる女神よ、どうか教えて。あなたの言葉を」'
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_リーナ_thinks_接ぎ木の意味_p4345
        quote: 'それは『脳髄洗い』や『精神加工』で精神や記憶を操作する呪術のことだろうか。

          星雲の巨人の口ぶりだと、まるで本当に異なる歴史が存在しており、それを現実において形にしているようにも受け取れる。'
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_リーナ_thinks_共闘の可能性_p6270
        quote: '（あの人の在り方は私やエストとは違う。けど、ものすごく強い）

          確かに彼がクロウサー家の一員になれば、エストと共にティリビナ人を守りやすくなるはずだ。

          （共闘、すべきなのかな。仲間になってくれたら、もしかすると）'
        locator: {}
        spoiler_after: ch5584
      - event_ref: E_ch5584_リーナ_thinks_当主の資質_p7176
        quote: 'もとより、この空使い選定レースは仲間を増やすための戦いだ。

          クロウサーの長老たちに力を示し、その協力を取り付けるための自己アピールの場所。

          我を貫き利を勝ち取るか。和によって利を分配するか。'
        locator: {}
        spoiler_after: ch5584
    action:
      observations:
      - event_ref: E_ch5584_リーナ_uses_死人の森の断章_p197201
        quote: '瞳が熱い。世界が金色に輝くのをリーナは感じた。

          すぐそばで、ガルズが力を貸してくれている。

          死人の森の断章の力が骨で覆われた箒から溢れ出す。

          女神のレコードゴーストと合一した二者に、金の視線を向けた。'
        locator: {}
        spoiler_after: ch5584
  first_appearance_candidate: true
