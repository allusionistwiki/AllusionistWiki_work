- canonical_target: '[[E_char_ミルーニャ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5156_ミルーニャ_says_エンチャンターとしての理想_p10
        quote: ――ミルーニャは駆け出しですけど、気持ち的にはいっぱしの呪具製作者（エンチャンター）なのです。必要な人に必要な呪具を提供できればいいなあって思ってます。
        locator: {}
        spoiler_after: ch5156
      - event_ref: E_ch5156_ミルーニャ_says_最終目的の簡略化_p112
        quote: 「もういいですっ、貴方と話すことは何もありません！ ヴァージリアを殺して、貴方を連れて帰る。それで全部終わりです」
        locator: {}
        spoiler_after: ch5156
      - event_ref: E_ch5156_ミルーニャ_says_全生命の不死と邪神化_p19
        quote: 「不死という神秘の零落。星見の塔の連中が後生大事に抱え込んでいる不死資源を世界中にばらまいて、その価値を紙きれと同じになるまで貶めてやるんです――そして実現する、全生命の不死！
          溢れる生命力によってあらゆる既存の価値を崩壊させ、有史以来最大最悪の災厄をこの世にもたらすのです。その後で私はこの世全てを呪う邪神、死ざる女神キュトスとして君臨してやるんですよ。世界中の人間が生の苦しみに喘ぐ様を眺めながらね」
        locator: {}
        spoiler_after: ch5156
      - event_ref: E_ch5156_ミルーニャ_says_長年の欲求_p34
        quote: 「ずっと、こうしたかったんですよ」
        locator: {}
        spoiler_after: ch5156
      - event_ref: E_ch5156_ミルーニャ_says_演技への嫌悪_p40
        quote: 「ああ忌々しい、汚らわしい、吐き気がする。演技とはいえ貴方みたいな人にべたべたしなきゃならないなんて、最悪の気分でした」
        locator: {}
        spoiler_after: ch5156
      - event_ref: E_ch5156_ミルーニャ_says_記憶の書き換え完了_p46
        quote: 「もうすっかり書き換えられてますね。当たり前か。どれくらい復元できるかな――」
        locator: {}
        spoiler_after: ch5156
      - event_ref: E_ch5156_ミルーニャ_threatens_ハルベルト_p58
        quote: 「黙れ」 かつてなく低い声でミルーニャの恫喝が響いた。刃の如き眼光が荒れ狂う殺意を宿してハルベルトを刺していた。
        locator: {}
        spoiler_after: ch5156
      - event_ref: E_ch5156_ミルーニャ_says_感謝の強要_p64
        quote: 「そもそも私には恨むような気持ちは皆無なのです。そんなのは筋違いでしょう？ ええ、私は感謝していますよ、勿論です。今は敵対していますが、利害関係とは別に、お礼を言わなくてはなりませんよね」
        locator: {}
        spoiler_after: ch5156
      - event_ref: E_ch5156_ミルーニャ_asks_父の死に様_p68
        quote: 「遅くなってしまいましたが、仇を討ってくれてありがとうございます。あんなのでも父親ではありますし、とりあえず形だけでも。ああそうだ、あれはどんな風に死んだんでしょうか？
          私、松明の騎士団に問い合わせてみたんですけど詳しい事は機密だからって追い返されちゃって。ねえ、どうせ無様にやられて、みっともなく犬死にしたんでしょう？
          自分の力量も弁えずに上位魔将に挑む、あの救いようのない三流呪術師は――」
        locator: {}
        spoiler_after: ch5156
      - event_ref: E_ch5156_ミルーニャ_conceals_父の立派さ_p88
        quote: 「違いますよ。話を作らないで下さい。呪文使いが過去を捏造して嘘を並べ立てるのが仕事ってことはわかりますけどね。でも余りに現実感が無い虚構は時に人を不快にさせますよ。だって、そんなあり得ない話は信じられません。あの男は最低のクズです。無能だし度胸も無い。命を捨てて誰かに後を託すなんて真似、するわけないでしょう？」
        locator: {}
        spoiler_after: ch5156
      - event_ref: E_ch5156_ミルーニャ_says_父への軽蔑維持の必要性_p92
        quote: 「やめて！ あいつを肯定しないで！ ちゃんと最後までクズだったって言って下さいよ！ 家族に暴力を振るう父親なんてクズです。死んで正解でした。私はあの父親から解放されて自由になりました。幸せになったんです。だから、最後まで軽蔑していたいんです、わかるでしょう？！」
        locator: {}
        spoiler_after: ch5156
    action:
      observations:
      - event_ref: E_ch5156_ミルーニャ_wounds_アキラ_p16
        quote: 爪から注ぎ込まれる呪力は既に私の全身を完全に麻痺させていた。もう口を開くことすらままならない。
        locator: {}
        spoiler_after: ch5156
      - event_ref: E_ch5156_ミルーニャ_makes_呪文の構成_p2
        quote: ミルーニャは指先を虚空に踊らせて、複雑な呪文の構成を描き出した。その式の全容は理解できなかったけれど、私にはそれが杖に関わる――生体系の呪術に見えた。
        locator: {}
        spoiler_after: ch5156
      - event_ref: E_ch5156_ミルーニャ_takes_魔導書_p30
        quote: ミルーニャは力を失った魔導書を手に取って、どこか愛おしげに胸にかき抱いた。
        locator: {}
        spoiler_after: ch5156
      - event_ref: E_ch5156_ミルーニャ_wounds_アキラ_p36
        quote: 憎悪。爪をねじるように動かして、呪力を苦痛に変換して私の身体を蝕んでいく。悲鳴。視界が白くなる。息が出来なくなって、涙と涎が溢れ出して止まらない。
        locator: {}
        spoiler_after: ch5156
      - event_ref: E_ch5156_ミルーニャ_wounds_アキラ_p98
        quote: 爪ではなく、足が振り下ろされた。腹部に鳥の足が食い込み、私は唾液と息を吐き出した。そのまま何度も何度も足が振り下ろされる。
        locator: {}
        spoiler_after: ch5156
  first_appearance_candidate: true
