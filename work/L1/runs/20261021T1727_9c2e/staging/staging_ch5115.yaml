      - event_ref: E_ch5115_アキラ_activates_鮮血呪_p10
        quote: （アキラくんの死によって【鮮血呪】をトリガー。呪力を通せ、価値を否定せよ！）
        locator: {}
        spoiler_after: ch5115
      - event_ref: E_ch5115_アキラ_flees_攻撃の回避と打撃_p111
        quote: その全てを赤く光り輝く軌跡を残しながら回避し、すれ違う瞬間に打撃を加え、確実にダメージを与えていく。
        locator: {}
        spoiler_after: ch5115
      - event_ref: E_ch5115_アキラ_fights_キロンへの逆回転打撃_p135141
        quote: 更には右から放った一撃が次の瞬間には左からの打撃に入れ替わり、それを放った直後には既に右拳を振り終わっているという異様な連撃。
        locator: {}
        spoiler_after: ch5115
      - event_ref: E_ch5115_アキラ_wears_トリシューラ_p38
