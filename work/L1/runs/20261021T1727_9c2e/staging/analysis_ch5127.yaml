- kind: mystery
  name: MY_p5127_kobold_thief
  note: 掲示板システム障害の直後に現れた「泥棒カササギ」「吸血鬼」と呼ばれる人物。アキラの獲物（依頼）を奪う行為への対抗意識を示唆しており、後の展開での直接対決や、この人物が誰かの仲間である可能性が高い。
  quotes:
