- kind: mystery
  name: MY_上に見つかった意味
  note: コルセスカが「上」に見つかったと告げ、聖騎士が殺処分を叫んでいる。この「上」とは組織の上位者か、あるいは異世界の管理者か。その意図とアキラに対する敵対理由は不明。
  quotes:
  - quote: 騒ぎが大きすぎて、『上』に見つかったようです
    paragraph: p26
    quote_verified: true
  - quote: おいこれ、退路絶たれてないか？！
    paragraph: p33
    quote_verified: true
  expected_payoff: 聖騎士がアキラを単なる犯罪者ではなく「上」の命令で追っていることが判明し、世界観の階層構造（管理者や神）との対立へ発展する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_生命吸収の秘儀
  note: トリシューラがコルセスカの不死性を「生命吸収」と解説している。この術の代償や、アキラへの適用可能性（魂を奪わない契約の背景）が今後のテーマとなるか。
  quotes:
  - quote: 『他人の生命をストックしておいて、自分が死んだ時に代わりの生命力にするっていう高位呪術だね
    paragraph: p16
    quote_verified: true
  expected_payoff: コルセスカが倒れた際にそのストックされた命がどう処理されるか、あるいはアキラが同じ技術に手を出す展開への伏線。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_義肢の回収率と信用度
  note: トリシューラがアキラを「優秀な前衛」と評価し、死にかけても直せるから回収率が高いと言っている。アキラの社会的地位や金銭的価値が具体的にどう定義されているか不明。
  quotes:
  - quote: 私の見たところ貴方はそれなりに優秀な前衛だよ。大丈夫、死にかけてもシューラが直してあげるから、けっこう回収率は高いと思うの
    paragraph: p142
    quote_verified: true
  expected_payoff: アキラが単なる冒険者ではなく、特定の組織や世界にとって「資産」として扱われている事実が判明する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_運動する感覚とちびシューラの笑み
  note: アキラの中で何かが「運動」している感覚があり、ちびシューラが戯画化された微笑を湛えている。これがアキラの精神変質やトリシューラの寄生の影響なのか。
  quotes:
  - quote: '俺はかつてと比べて何も変質していない。

      だというのに、何かが自分の中で『運動』しているという感覚がつきまとって離れない。'
    paragraph: p170-p171
    quote_verified: true
  - quote: 視界の隅で、ちびシューラが戯画化された微笑を湛えている。
    paragraph: p173
    quote_verified: true
  expected_payoff: アキラの自己認識（変質していない）と実際の精神状態のズレが描かれ、最終的にトリシューラの完全な支配や人格融合へ向かう伏線。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
