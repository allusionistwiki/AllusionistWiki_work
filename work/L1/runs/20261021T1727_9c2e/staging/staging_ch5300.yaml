- canonical_target: '[[E_char_ヴァージルアキラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5300_ヴァージルアキラ_other_サイザクタート_p52
        quote: 「ありがとうサイザクタート。君はいつでも僕の傍にいてくれるね」
        locator: {}
