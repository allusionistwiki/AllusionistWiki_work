          強力無比な高位呪術の連打。'
        locator: {}
        spoiler_after: ch5556
      - event_ref: E_ch5556_ハグレス_uses_連節骨槍ファラクランティア_p91
        quote: 「起動せよ、連節骨槍ファラクランティア。第一頸椎から順に対抗呪文を構えて待機。第十二胸椎まで分離、並列で自動詠唱。基底仙骨から尾骨までの呪力循環を加速」
