- kind: mystery
  name: MY_Ribuer_05_Riviere_Treatment
  note: 白騎士（リビュエー05）がウネムに回収され「機体の修理と貴様の治療」を受ける指示が出る。彼女の状態、正体、そしてウネムとの関係性が未解明。
  quotes:
  - quote: 状況を報告せよ、リビュエー05――いや、速やかに帰投し、機体の修理と貴様の治療を行うべきだな。
    paragraph: p220
    quote_verified: true
  expected_payoff: 白騎士の正体（人間性・過去の経歴）や、ウネムとの因縁の詳細が明かされる回での再登場。
