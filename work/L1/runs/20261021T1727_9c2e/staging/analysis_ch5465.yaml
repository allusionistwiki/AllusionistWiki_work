  review_status: unreviewed
- kind: mystery
  name: MY_Unem_Ribuer_Betrayal
  note: ウネム・リビュエーは「守護の九槍」第七位であり、かつてアキラ（キール隊）を裏切り壊滅に追い込んだ張本人である。この再会が今後の戦いにどう影響するか。
  quotes:
  - quote: かつて私たちキール斑を、否、より正確には小隊規模であったキール隊を敵側に売り、故意に壊滅に追い込んだ最悪の裏切り者。
    paragraph: p261
    quote_verified: true
  expected_payoff: アキラとウネムの直接的な対決、過去の裏切りの真実の暴露、あるいは和解へのプロセス。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_Filis_Spell_Usage
  note: アキラが「フィリス」を使うためにここにいると決意したが、白騎士の介入で実行されなかった。この呪文の効果と必要性は何か。
  quotes:
  - quote: きっと、今この時にフィリスを使うために私はここにいる。決意を込めて金鎖を砕こうと意識を集中し呪文を構築、魂を影の中へと沈ませていった。
    paragraph: p41
    quote_verified: true
  expected_payoff: フィリスの真の効果（救済・改変）が発動する決定的な瞬間、またはその代償に関する描写。
