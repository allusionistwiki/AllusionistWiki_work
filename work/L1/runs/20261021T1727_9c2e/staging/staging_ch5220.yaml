        locator: {}
        spoiler_after: ch5220
      - event_ref: E_ch5220_アキラ_kills_アインノーラ_p331
        quote: 戻ってきた神滅具がその亀裂を押し広げ、砕き、体内で炸裂した猛火と稲妻がアインノーラを焼き尽くしていった。これで四人。
        locator: {}
        spoiler_after: ch5220
      - event_ref: E_ch5220_アキラ_kills_ハルハハール_p45
        quote: 左手で巨大な蝶の翅を貫通する。『歌う左手』が内部から呪文を炸裂させて、その命を刈り取る。
        locator: {}
        spoiler_after: ch5220
      - event_ref: E_ch5220_アキラ_makes_第九の創生竜_p64
        quote: 歌姫が創造した第九の創生竜、【オルゴーの滅びの呪文】と一体化した私は、二体の魔将を立て続けに圧殺した。
        locator: {}
        spoiler_after: ch5220
      - event_ref: E_ch5220_アキラ_fights_ユネクティア_p85
        quote: 私は世界を震撼させる竜の咆哮を上げた。それ自体が一つの呪文。それはユネクティアの影の浄界を破壊し、アインノーラの決闘場の浄界を粉砕し、サイザクタートの夢を引き裂いていった。
        locator: {}
        spoiler_after: ch5220
    visual:
      observations:
      - event_ref: E_ch5220_アキラ_transforms_森_p166
        quote: 私は黒衣に変わって大樹を身に纏い、木の『うろ』の中に隠れ潜む。
        locator: {}
        spoiler_after: ch5220
    speech:
      observations:
      - event_ref: E_ch5220_アキラ_makes_ブリコラージュ_p19
        quote: 寄せ集めの仕事（ブリコラージュ）。野生の思考。呪術的思考。
        locator: {}
        spoiler_after: ch5220
      - event_ref: E_ch5220_アキラ_says_パルプフィクション_p308
        quote: 森が巨大な魔導書に変わる。溢れ返った紙、紙、紙、そして浮かび上がるのは漆黒のインクで綴られた呪文。「パルプ・フィクション！」
        locator: {}
        spoiler_after: ch5220
      - event_ref: E_ch5220_アキラ_says_一人も残さない_p342
        quote: だから、一人も残さない。魔将は私が全て殺す。蘇った魔将も、残る四人も。妹を、ビーチェを取り戻す為に邪魔な者は全て排除する。
        locator: {}
        spoiler_after: ch5220
      - event_ref: E_ch5220_アキラ_says_断ち切れ_p78
        quote: 「断ち切れ、エアル・ア・フィリス！」
        locator: {}
        spoiler_after: ch5220
