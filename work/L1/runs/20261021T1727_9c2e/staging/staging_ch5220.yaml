- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5220_アキラ_breaks_結界_p104
        quote: 一撃で粉砕した。その手の攻撃はもう効かない。何しろ、もっと凶悪な守護天使――古き神の夢を克服したばかりなのだ。
        locator: {}
