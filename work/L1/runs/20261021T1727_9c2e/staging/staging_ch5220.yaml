      - event_ref: E_ch5220_アキラ_breaks_第三の金鎖_p159
        quote: 「射影即興喜劇（アトリビュート）・深林雲母（アベンチュリン）」第三の金鎖が砕けて、堅牢なる防御が全ての攻撃を完璧に受け止めた。
        locator: {}
        spoiler_after: ch5220
      - event_ref: E_ch5220_アキラ_kills_サジェリミーナ_p200
        quote: 神速を発揮する事もできぬまま第五魔将サジェリミーナが滅んでいく。
        locator: {}
        spoiler_after: ch5220
      - event_ref: E_ch5220_アキラ_breaks_金鎖_p24
