- kind: mystery
  name: MY_レオの正体と権限
  note: 記憶喪失の猫耳少年「レオ」が、魔軍元帥ベアトリーチェを震え上がらせるほどの高位貴種（獅子王関係者）であることが判明した。彼がなぜ第五階層に現れ、何者なのか。
  quotes:
  - quote: 「そんな馬鹿な。ありえない。獅子王の――あの方がなぜここに？」
    paragraph: p203
    quote_verified: true
  - quote: （そっか。やっぱあの子、地獄の貴種か何か――それも相当高位の『やんごとない身分』って奴だよきっと）
