    quote_verified: true
  expected_payoff: キロン復活の手口と、ベアトリーチェの「融血」能力の真の用途（転生者エネルギーの搾取システム）の全貌。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
