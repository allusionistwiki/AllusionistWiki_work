  review_status: unreviewed
- kind: mystery
  name: MY_下位の意向（レストロオセ/フィリス）
  note: ベアトリーチェが撤退する理由として「その上の意向」「【下】」に逆らえないと述べている。また「レストロオセめ、これを見越して横槍を」「フィリスといい」という名前が挙がり、彼女たちがレオの存在を知っていた暗示がある。
  quotes:
  - quote: わたくしは所詮魔軍の元帥――その上の意向にまでは逆らえません。今ここであなた方を殲滅する事を【下】は望んでいない
    paragraph: p217
    quote_verified: true
  - quote: レストロオセめ、これを見越して横槍を――フィリスといい、勝手ばかりして！
    paragraph: p215
    quote_verified: true
  expected_payoff: 地獄の勢力図における上位者（あるいは裏切り者）との関係性、およびレオ保護に関する陰謀が今後の展開に関わる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_キロンを操った真犯人
  note: ベアトリーチェは「ついでの用事」としてキロンの回収をしたが、キロンを使って転生者の力を集める計画の黒幕としての詳細（特にキロンの「融血呪」との関連）は語られていない。キロンを復活させたのは彼女か？
  quotes:
  - quote: 三度目がキロンを融血呪によって復活させた時。俺達が窮地に陥る時、必ずこの眼球型使い魔の姿がある。その主人が誰なのか。左右に立つ二人の魔女にはその確信があるようだった。
