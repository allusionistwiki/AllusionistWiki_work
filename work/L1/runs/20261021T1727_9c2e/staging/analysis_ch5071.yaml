- kind: mystery
  name: MY_kiron_true_name_effect
  note: キロンの「真名」を聞くだけで意識を失うほどの効果を持つ名前とは何か。また、アキラが耐性を持っていた理由は何か。
  quotes:
  - quote: 俺の真名は用意も無しに聞かせるには少々刺激が強すぎてね。
    paragraph: p54
    quote_verified: true
  - quote: 世界が、振動した。ぐらり、と視界が揺れて、見当識を失う。
    paragraph: p63-p65
    quote_verified: true
  expected_payoff: キロンの真名に隠された「概念」や「呪力」の正体、およびアキラの転生者としての特性（耐性）の解明。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_handshake_refusal_meaning
  note: アキラがキロンから差し出された手を取らなかったのは「しなかった」のか「できなかった」のか、その真意は何か。
  quotes:
  - quote: どうしてか、手をとることはしなかった。いや、できなかったのか。
    paragraph: p101-p102
    quote_verified: true
  expected_payoff: アキラの精神的な葛藤、またはシューラとのリンクによる拒絶反応（物理的・呪術的な制限）の発覚。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_shura_sister_identity
  note: 「キュトスの姉妹」の一人であるトリシューラ（きぐるみの魔女）が、なぜ人間に害をなす技術（寄生異獣など）を提供したのか。その動機と過去。
  quotes:
  - quote: 地上に寄生異獣という技術、いや業をもたらしたのはあの魔女だ
    paragraph: p265
    quote_verified: true
  - quote: （うん、そうだけど？）あっさりと。あまりにも簡単に、彼女はそれを肯定した。
    paragraph: p278-p280
    quote_verified: true
  expected_payoff: トリシューラの動機、キュトス神話との関連、そして彼女が「邪悪」とされる理由の真実（あるいは逆転）。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_azuriah_fate_details
  note: キロンが「アズーリアに言わせれば背負わなくてもいい責任を背負わないで」と言う文脈。アズーリアが第四階層の罠（使い潰し）からどのように生還したのか、または死亡しているのか。
  quotes:
  - quote: アキラくんと戦うつもりはないんだ。君は結果として我々と敵対することになっているだけだ。
    paragraph: p114
    quote_verified: false
  - quote: 身内が身内を殺す。そういう腐りきった組織なんだよ、松明の騎士団は。
    paragraph: p183
    quote_verified: true
  expected_payoff: アズーリアの現在の状態（生存/死亡）、および彼女を追う「上層部」の具体的な勢力との対決。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 組織の論理と個人の倫理の衝突
  weight: 0.9
  quotes:
  - quote: 無辜の命を犠牲にして何が正義だ！　貴族として、聖騎士として、異獣から尊き命を守る事こそが我々が抱く至上の使命であるべきなのだ。
    paragraph: p161
    quote_verified: true
  - quote: 俺はそういう物事をちゃんと見ようとしない上層部に唯々諾々と従うつもりはない。
