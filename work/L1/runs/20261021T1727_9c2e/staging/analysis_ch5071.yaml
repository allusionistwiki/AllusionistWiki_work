  - quote: 今まで、自らの呪力を完璧に隠蔽していたというの？
    paragraph: p79
    quote_verified: true
  expected_payoff: キロンの真名（呪術的効果）による不死性や、シューラの攻撃に対する対抗手段の発覚。
