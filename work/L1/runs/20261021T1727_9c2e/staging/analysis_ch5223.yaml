- kind: mystery
  name: MY_sister_identity
  note: 「お姉様」の正体は、第三の創生竜クルエクローキそのもの、あるいはその意図を反映する存在（守護竜）である可能性。マリーの保護者として機能しているが、運命修正力の一部としての役割を担っている。
  quotes:
  - quote: 世界に既知が増えれば増えるほどそこからは純粋なランダムは見出せなくなってしまう。秩序を貫いて世界を更新する紀元槍には決して勝てない、矮小な対存在。
    paragraph: p41-p42
    quote_verified: true
  - quote: 運命の調律者――世界の修正力。第三の創生竜は運命を司る。守護竜クルエクローキは世界の揺らぎを修正しようとする秩序の象徴。
    paragraph: p72-p73
    quote_verified: true
  expected_payoff: マリーの起源と、彼女が「色」を与えられた（地上に転生させられた）理由が、世界の秩序維持システムの一部であることが明かされる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
