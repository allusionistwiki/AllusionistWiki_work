        quote: 戦いの形式は変わったが、戦いの本質は何も変わっていない。これもまた、ガロアンディアンとラフディの戦争の続きなのだ。
        locator: {}
        spoiler_after: ch5343
  first_appearance_candidate: true
- canonical_target: '[[E_org_ちびシューラ]]'
  entity_type: organization
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5343_ちびシューラ_functions_as_ドローンスタッフ_p14
        quote: 運営や審判は遍在するちびシューラを中心としたドローンスタッフが行っており、今のところ問題は起きていない。至る所で目を光らせている見張り（センチネル）ドローンが機能している証拠だ。
        locator: {}
        spoiler_after: ch5343
  first_appearance_candidate: true
- canonical_target: '[[E_char_トリシューラ]]'
  entity_type: character
  aspects:
    name:
      observations:
      - event_ref: E_ch5343_トリシューラ_names_ラフディーボール_p145
        quote: もう一つは棘付きの球を投げ合う危険な競技、ラフディーボールだ。
        locator: {}
        spoiler_after: ch5343
    speech:
      observations:
      - event_ref: E_ch5343_トリシューラ_reveals_アレッテ・イヴニルの出自_p207
        quote: 「ラクルラールお姉様は人形を手足のように操って第六位代行としての役目を果たしていた。ミヒトネッセとアレッテ・イヴニルは近年になって作られた最高傑作と言われているよ――ていうか、私やリールエルバの姉妹機なんだけど」
        locator: {}
        spoiler_after: ch5343
      - event_ref: E_ch5343_トリシューラ_threatens_ルバーブ_p238
        quote: 「そうそう、試合の話だけど。あんまり油断してると、足下を掬われるかもね？」
        locator: {}
        spoiler_after: ch5343
      - event_ref: E_ch5343_トリシューラ_says_ブルームレースの予定_p9
        quote: 「今回は球技大会だから一種目限定だけど、元々箒を使った競技は人気だからね。今後は【シアンクリーニング】との協賛でブルームレースとかも開催予定だよ。レースを応援しながら着順を予想する健全な賭博」
        locator: {}
        spoiler_after: ch5343
    visual:
      observations:
      - event_ref: E_ch5343_トリシューラ_wears_豚鼻ジャージ_p95
        quote: 本日のトリシューラは伸縮性のあるトレーニングウェアを着ているのだが、何故かシャープな豚の鼻がプリントされていた。どういう趣味なんだろう。
        locator: {}
        spoiler_after: ch5343
  first_appearance_candidate: true
- canonical_target: '[[E_char_ルバーブ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5343_ルバーブ_appears_会場隅_p150
        quote: 丸々とした体型と長い髪。典型的な大地の民体型だが、鍛え上げられた彼の肉体は立ち姿からしてものが違う。重心が一切ぶれない安定した姿勢、脂肪を押し上げる屈強な筋肉。力士のような彼にとって、『醜』という言葉はむしろ力強さを強調する形容となるだろう。
        locator: {}
        spoiler_after: ch5343
      - event_ref: E_ch5343_ルバーブ_appears_as_猛獣_p247
        quote: 面白がるような、舌なめずりをするような、彼のこれまでの印象からは全くかけ離れた、野卑で獰猛な気配。戦いに飢えた、猛獣の顔だと思った。
        locator: {}
        spoiler_after: ch5343
    speech:
      observations:
      - event_ref: E_ch5343_ルバーブ_asks_アレッテ・イヴニルの情報_p177
        quote: 「星見の塔に所属する魔女についての情報が欲しい。アレッテ・イヴニルという名に聞き覚えは？」
        locator: {}
        spoiler_after: ch5343
      - event_ref: E_ch5343_ルバーブ_promises_マラードの守護_p220
        quote: 「あの女は何かを企んでいる。もし、この大会で奴が動くことがあれば、私は陛下をお守りする為に必要なことをするだろう」
        locator: {}
        spoiler_after: ch5343
  first_appearance_candidate: true
