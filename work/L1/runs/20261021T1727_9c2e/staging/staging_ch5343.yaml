- canonical_target: '[[E_char_パーン・ガレニス・クロウサー]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5343_パーン・ガレニス・クロウサー_appears_空の競技場_p25
        quote: 空の競技場を一条の稲妻が駆け抜けていく。他を圧倒する速度での飛翔。縦横無尽に飛び回り、たった一人で試合の趨勢を決定付けてしまう男の名はパーン・ガレニス・クロウサーといった。
        locator: {}
        spoiler_after: ch5343
      - event_ref: E_ch5343_パーン・ガレニス・クロウサー_appears_as_野獣_p30
        quote: 獰猛な笑みを浮かべるパーンの前髪が風圧で逆立ち背後に流れていく。四角い眼鏡の古典的イメージとは裏腹に、野獣のような印象を周囲に与えていた。
        locator: {}
        spoiler_after: ch5343
    speech:
      observations:
      - event_ref: E_ch5343_パーン・ガレニス・クロウサー_says_遅い_p28
        quote: 「遅い、そんなものか！」
        locator: {}
        spoiler_after: ch5343
      - event_ref: E_ch5343_パーン・ガレニス・クロウサー_promises_非殺伐な競い合い_p42
        quote: 「約束しただろうが。クロウサー家当主、『空使い』リーナ・ゾラ・クロウサーとの競い合いは血の流れないものにしてやるとな。再生者である俺が命を懸けず、相手に命を懸けさせるというのも公平ではない。舞台はそちらで用意しておけ。相手はもう呼んでいるのだろうな？　あまり待たせるなよ、俺の気は長くない」
        locator: {}
        spoiler_after: ch5343
    action:
      observations:
      - event_ref: E_ch5343_パーン・ガレニス・クロウサー_other_箒競技_p31
        quote: 第五階層の戦いが始まってからというものずっと沈黙を保っていたこの男は、球技大会の知らせを聞くとふらりとやって来て飛び入り参加し、箒競技に片端から参加しては優勝を攫っていった。
        locator: {}
        spoiler_after: ch5343
    relationship:
      observations:
      - event_ref: E_ch5343_パーン・ガレニス・クロウサー_is_located_中立_p39
        quote: 暫定的な中立。当然のように第五階層を支配するつもりらしいが、今のところ六王同士で戦うつもりはない――というかバトルロイヤルには一番最後に参加する気のようだ。
        locator: {}
        spoiler_after: ch5343
  first_appearance_candidate: true
