- canonical_target: '[[E_char_アルト]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5343_アルト_helps_人材交流_p103
        quote: その代わり、【道徳の断章】によって甦った竜王国の再生者たちをガロアンディアンの現代人たちのチームに分散させて、人材の交流を行ってくれている。ラフディの再生者への対抗策にもなっており、波風を立てない良い手だった。
        locator: {}
        spoiler_after: ch5343
  first_appearance_candidate: true
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5343_アキラ_asks_賭博の健全性_p11
        quote: 「健全なのかそれ。嵌って身を持ち崩す奴とか出そうだけど」
        locator: {}
        spoiler_after: ch5343
      - event_ref: E_ch5343_アキラ_promises_真の平和の実現_p125
        quote: その勘違いを真実に変えて、ガロアンディアンの女王に献上しよう。決意を固め、拳を握る。
        locator: {}
        spoiler_after: ch5343
      - event_ref: E_ch5343_アキラ_thinks_リソースの有限性_p18
        quote: 主催者側の用意した選手が賞金を獲得するのはどうかと思わなくもないが、少しでも資金を回収しておかないと後々厳しくなってくるのも確かだ。リソースは限られている。時間と同様に。
        locator: {}
        spoiler_after: ch5343
      - event_ref: E_ch5343_アキラ_hopes_非武力競争の定着_p20
        quote: 「これで武力闘争とは違う形式の競い合いが少しでも定着すればいいんだけど」
        locator: {}
        spoiler_after: ch5343
      - event_ref: E_ch5343_アキラ_thinks_クロウサー家問題の解決_p22
        quote: 「そうだな。とりあえず箒による競技ができる仕組みを作っておけばクロウサー家の問題はある程度穏便に片付くだろう」
        locator: {}
        spoiler_after: ch5343
      - event_ref: E_ch5343_アキラ_observes_ルバーブの忠誠_p229
        quote: だが、ルバーブの目に邪心は無い。それに俺たちは彼が常にマラードを第一に考えていることを知っていた。ルバーブは忠臣だ。
        locator: {}
        spoiler_after: ch5343
      - event_ref: E_ch5343_アキラ_hopes_正面からの勝利_p256
        quote: そう、俺たちは勝つつもりでいる。『地上で最も激しい球技』ラフディーボールを国技とするラフディのチーム相手に、真正面から勝利する。
        locator: {}
        spoiler_after: ch5343
      - event_ref: E_ch5343_アキラ_thinks_パーンの危険性_p48
        quote: 現在は中立を謳っているとはいえ、奴が第五階層の覇権とコルセスカを狙う敵であることは間違い無く、いずれどうにかして排除しなくてはならない相手だ。
        locator: {}
        spoiler_after: ch5343
      - event_ref: E_ch5343_アキラ_thinks_再生者撃破の条件_p51
        quote: 「どっちにしろ、再生者たちを倒すには命を奪い合う戦いだけじゃ足りないんだ。形の無いものにダメージを与える『何か』が無いと勝利にはならない」
        locator: {}
        spoiler_after: ch5343
    action:
      observations:
      - event_ref: E_ch5343_アキラ_conceals_書き込み欲求_p83
        quote: だから俺は対六王トピックには目を通しているだけで一切書き込んでなどいない。書き込みたいとも思っていない。その欲求は生まれた瞬間に捨てている。
        locator: {}
        spoiler_after: ch5343
  first_appearance_candidate: true
- canonical_target: '[[E_term_カシュラム]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5343_カシュラム_is_located_再生者の王国_p116
        quote: オルヴァを崇拝していたカシュラム人たちは殆ど死亡したらしいが、王の遺体は忽然とどこかに消えていたという。【地位の断章】も未だラフディの手には渡っていないと聞いている。『再生者の王国』としてのカシュラムはまだ死んでいないのだ。
        locator: {}
        spoiler_after: ch5343
  first_appearance_candidate: true
- canonical_target: '[[E_org_サイバーカラテ道場]]'
  entity_type: organization
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5343_サイバーカラテ道場_enables_効率的な練習_p132
        quote: ラケットやバット、シューズといった道具にセンサーを埋め込み、動作のデータを蓄積。サイバーカラテ道場に集まった膨大な試合データを参照し、認定コーチたちの遠隔指導によりあらゆる初心者は最大効率で上達していくことができる。
        locator: {}
        spoiler_after: ch5343
      - event_ref: E_ch5343_サイバーカラテ道場_functions_as_情報交換の場_p71
        quote: サイバーカラテ道場の対六王トピックは常に侃々諤々だ。対パーンのトピックなんか本人が動画付きで書き込んで有効そうな対策を片っ端から論破していくので有力な回答がいつまでも出てこない。それでも『勝つために何が必要か』『誰が最強なのか』という話題は常に人を楽しませ、場を盛り上げる。
        locator: {}
        spoiler_after: ch5343
  first_appearance_candidate: true
- canonical_target: '[[E_term_球技大会]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
