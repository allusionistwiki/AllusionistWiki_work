        spoiler_after: ch5114
      - event_ref: E_ch5114_キロン_appears_as_人馬の聖騎士_p6
        quote: 一方は虚空を馬の蹄で蹴り、蝶の翅が巻き起こす突風によって飛翔する人馬の聖騎士。
