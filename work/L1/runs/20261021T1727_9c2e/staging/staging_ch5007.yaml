      observations:
      - event_ref: E_ch5007_キール達と青年_fights_口論の予兆_p18
        quote: 'キールと中央の青年が何を話しているのかは全く分からなかったが、どうも会話の雲行きが怪しい気配がする。

          お互いの表情や口調が、徐々にヒートアップしているのが傍目にも明らかだった。'
        locator: {}
        spoiler_after: ch5007
  first_appearance_candidate: true
- canonical_target: '[[E_char_アズーリア]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5007_アズーリア_attacks_三人組_p21
        quote: '会話から口論へと移行するかと思われたその時、何かがその逆鱗に触れてしまったのか、唐突にアズーリアが前に飛び出した。薄々感じてはいたが喧嘩っ早いというか猪突猛進というか。

          先陣を切って突撃する戦士としては優秀かもしれないが、この場合には短所にしかならない。流石に槌矛は抜かず、籠手で殴りかかるつもりのようだ。'
        locator: {}
        spoiler_after: ch5007
      - event_ref: E_ch5007_アズーリア_wounds_自分自身衝撃_p26
        quote: かろうじて盾で防いだアズーリアだが、衝撃と轟音、閃光にやられてか膝を着いてしまう。
        locator: {}
        spoiler_after: ch5007
      - event_ref: E_ch5007_アズーリア_gives_糧食三つアキラへ_p61
        quote: 背後からマントを引かれた。アズーリアだ。言葉はない。が、腰の収納から糧食を三つ取り出して、差し出してくる。
        locator: {}
        spoiler_after: ch5007
  first_appearance_candidate: true
