- canonical_target: '[[E_char_青年]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5007_青年_says_キー結果選択_p38
        quote: これには三人組も意表を突かれたのか、しばしの沈黙がその場を支配する。やがて中央の青年がおもしろがるようにして、「キー」と言う。俺が手を広げると結果は松明の絵。
        locator: {}
        spoiler_after: ch5007
      - event_ref: E_ch5007_青年_says_アキラの勝ち宣言_p40
        quote: 「あんたの勝ちだ！」
        locator: {}
        spoiler_after: ch5007
      - event_ref: E_ch5007_青年_asks_アキラ名前_p48
        quote: '「なあ、あんた、名前はなんて言うんだ？」

          実際には二人称と名前の二単語しか聞き取れなかったのだが、多分そんなことを青年が訊いてきた。'
        locator: {}
        spoiler_after: ch5007
      - event_ref: E_ch5007_青年_kills_巨大狼_p86
        quote: そしてリーダー格らしき巨大な剣の青年。巨大狼の死骸には深く大きな刃物で切り裂かれたとおぼしき傷跡があった。あの青年の攻撃は、巨大狼を鎧ごと斬り裂けるほどに強烈なのだ。どう立ち回れば、あの男を殺せるだろうか？
        locator: {}
        spoiler_after: ch5007
    action:
      observations:
      - event_ref: E_ch5007_青年_departs_その場_p55
        quote: それで十分だったのだろう、彼は何事かを言うと、そのまま二人の仲間を連れてその場から立ち去っていった。
        locator: {}
        spoiler_after: ch5007
  first_appearance_candidate: true
