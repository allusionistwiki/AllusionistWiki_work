- canonical_target: '[[E_char_壮年男性]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5007_壮年男性_has_property_白髪と貫頭衣_p14
        quote: 右側には黒一色の貫頭衣を着た、白髪の壮年男性。そう歳がいっているようには見えないが、若白髪だろうか。
        locator: {}
        spoiler_after: ch5007
    action:
      observations:
      - event_ref: E_ch5007_壮年男性_stops_アズーリア_p23
        quote: 'が、両集団の中間でその脚は止まる。

          壮年男性が杖の先に取り付けられたクロスボウを発射したからだ。'
        locator: {}
        spoiler_after: ch5007
      - event_ref: E_ch5007_壮年男性_uses_浮遊する本と魔法の文字_p29
        quote: ゆったりとした服の内側から次弾を弓に番え、ぎりぎりと引き絞っている。更にこれも魔法の道具なのか、勝手に腰の本が浮遊したかと思うと、ぱらぱらと開いてページから光を放ち始める。何かの模様（おそらく文字だ）が宙に浮かび上がり、それらは火の玉になって彼の周りを浮遊し始める。
        locator: {}
        spoiler_after: ch5007
  first_appearance_candidate: true
- canonical_target: '[[E_item_クロスボウ付き杖]]'
  entity_type: item
  aspects:
    visual:
      observations:
      - event_ref: E_ch5007_クロスボウ付き杖_functions_as_武器兼呪文発動装置_p15
        quote: その手に杖の先にクロスボウが取り付けられた見慣れない道具を持っているのが目立つ。キールが持っているような巻物を持っているのも彼だ。更にはベルトから黒い装丁の本を一冊吊り下げていた。
        locator: {}
        spoiler_after: ch5007
  first_appearance_candidate: true
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5007_アキラ_observes_文明の発展段階_p16
        quote: 予想していたことだが、文字や印刷技術なども発達しているらしい。この世界の文明発展段階は俺が当初希望していた異世界の水準よりもずっと発達しているようだ。
        locator: {}
        spoiler_after: ch5007
      - event_ref: E_ch5007_アキラ_learns_他集団の存在_p2
        quote: その後、この迷宮には彼ら以外の集団もいるのだと知った。人と人が集まると、ちょっとしたトラブルが発生することもだ。
        locator: {}
        spoiler_after: ch5007
      - event_ref: E_ch5007_アキラ_says_カインの真似裏か表_p36
        quote: '「さあ、裏か表、どっちだ」

          カインの言葉をそっくりそのまま真似た、俺の発言だった。'
        locator: {}
        spoiler_after: ch5007
      - event_ref: E_ch5007_アキラ_names_シナモリ・アキラ_p53
        quote: '「アキラ。シナモリ・アキラ」

          とだけ叫んだ。'
        locator: {}
        spoiler_after: ch5007
      - event_ref: E_ch5007_アキラ_thinks_贈与の意味_p63
        quote: '一度も言葉をかけてきたことがない相手。カインとは逆だ。言葉を重ねることの無意味さを知っている。

          物品の贈与に意味を見出す事は、どのような文化においても見られることなのだという。俺がそういった概念を有していることを、先ほどの一幕でアズーリアも知ったのだ。'
        locator: {}
        spoiler_after: ch5007
      - event_ref: E_ch5007_アキラ_says_ありがとう_p68
        quote: '「ありがとう」

          礼と共に、三つの糧食を受け取り、口にする。じんわりとした甘みが口の中に広がる。'
        locator: {}
        spoiler_after: ch5007
      - event_ref: E_ch5007_アキラ_says_甘くておいしい日本語_p72
        quote: '「甘くておいしい。糖分が補給できて助かる」

          日本語なので意味が伝わるはずも無かったが、アズーリアは一度頷いて、キール達の方へ駆けていった。'
        locator: {}
        spoiler_after: ch5007
      - event_ref: E_ch5007_アキラ_thinks_コイン投げの愚策性_p76
        quote: '――しかし、首尾良く場の空気を和らげることに成功したから結果的には良いものの、あの張り詰めた状況であんなことをするのは我ながら愚策としか思えない。

          賽の目が良い方に出たから平和な結果に終わったが、あの行為を挑発や策略、何らかの攻撃だと判断されたらそこで戦いが始まっていただろう。'
        locator: {}
        spoiler_after: ch5007
      - event_ref: E_ch5007_アキラ_thinks_戦闘への準備と三人組の評価_p81
        quote: '実際の所、俺は半分以上戦闘になっても構わないと思っていたと知ったら、キール達は何を思うだろうか？

          あの2メートルを超す巨漢、プロレスラーじみた太い腕に、俺のサイバーカラテが何処まで通用するのか。'
        locator: {}
        spoiler_after: ch5007
      - event_ref: E_ch5007_アキラ_conceals_戦闘意図_p89
        quote: '言う必要が無いこともある。

          アズーリアは、それを良く分かっているようだった。

          行動と、その結果が全てだ。'
        locator: {}
        spoiler_after: ch5007
    action:
      observations:
      - event_ref: E_ch5007_アキラ_makes_コイン投げの音_p34
        quote: キール達も武器を構えようかというその時、ぱちん、というコインを弾く音が響いた。
        locator: {}
        spoiler_after: ch5007
      - event_ref: E_ch5007_アキラ_asks_カイン糧食要求_p42
        quote: 俺はカインに糧食を三つ要求した。カインは即座に俺の意を汲んでくれた。この中で一番多くコミュニケーションをとってきただけある。
        locator: {}
        spoiler_after: ch5007
      - event_ref: E_ch5007_アキラ_uses_弾道予報Ver2.0_p44
        quote: 貰った糧食を、俺は『弾道予報Ver2.0』を立ち上げて三人に正確に投擲した。大きく放物線を描いてそれぞれの手に収まったそれらは、どうやら和解のきっかけくらいにはなったようだ。
        locator: {}
        spoiler_after: ch5007
  first_appearance_candidate: true
