- canonical_target: '[[E_char_青嶺瑠璃]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5194_青嶺瑠璃_observes_幼馴染み_p108
        quote: 舞台裏で幼馴染みが活躍する姿を見守りながら、私はこれでいいんだと自らに言い聞かせ続ける。
        locator: {}
        spoiler_after: ch5194
      - event_ref: E_ch5194_青嶺瑠璃_finds_Spearに見出される機会_p16
        quote: 私は些細な切っ掛けから彼女に見出されて、何とマネージャーを務めることになっちゃったんです。
        locator: {}
        spoiler_after: ch5194
      - event_ref: E_ch5194_青嶺瑠璃_other_命令_p34
        quote: こんな感じで、とっても綺麗だけど冷たい声で命令されると私は勝手に身体が動いてしまうと言いますか――でも不思議と嫌じゃないんです。
        locator: {}
        spoiler_after: ch5194
      - event_ref: E_ch5194_青嶺瑠璃_helps_Spear_p9
        quote: 私はタオルとスポーツドリンクを手渡しながら通路を歩いていく彼女の一歩後ろに付き従います。
        locator: {}
        spoiler_after: ch5194
      - event_ref: E_ch5194_青嶺瑠璃_other_メイ_p99
        quote: 私は鋭く誰何しながらメイを背後に庇うが、足下から突然溢れ出した影の群れに飲み込まれて、遂には意識が遠のいていく。
        locator: {}
        spoiler_after: ch5194
    relationship:
      observations:
      - event_ref: E_ch5194_青嶺瑠璃_bonds_幼馴染み_p110
        quote: 中卒で芸能事務所に就職し、共に同じ世界で支え合って行こうと誓い合った私たちは、依存にも似た関係のまま事務所の方針に逆らうことができず、そのままずるずると不本意な仕事を続けていく。
        locator: {}
        spoiler_after: ch5194
    speech:
      observations:
      - event_ref: E_ch5194_青嶺瑠璃_other_兎キャラクター化_p120
        quote: '見て、今は兎のキャラクターが受けてる。

          この路線でファンのハートを掴むのよ！

          兎の垂れ耳にイメージを統一しましょう。'
        locator: {}
        spoiler_after: ch5194
      - event_ref: E_ch5194_青嶺瑠璃_loves_幼馴染み_p128
        quote: '与えられた役割を、震えて涙目になりながらも精一杯こなす貴方が、どこまでも愛おしい。

          ああ――なんて甘美なんだろう。'
        locator: {}
        spoiler_after: ch5194
      - event_ref: E_ch5194_青嶺瑠璃_other_Spearの要求_p178
        quote: '「やめて！」

          突き飛ばそうとして、寸前で躊躇う。'
        locator: {}
        spoiler_after: ch5194
      - event_ref: E_ch5194_青嶺瑠璃_remembers_過去の記憶_p221
        quote: '骨花に襲われていた所を助けて貰った時？

          一緒に崖から転落して、二人きりになって喧嘩した時？

          それとももっと昔――唐突に現れて本を取り上げるという悪戯をされた時？'
        locator: {}
        spoiler_after: ch5194
      - event_ref: E_ch5194_青嶺瑠璃_confesses_相応しくない_p233
        quote: 「だいたい、私は最初から貴方に釣り合わない。こんな化け物――こんな、知能が無い――脳すら存在しない下等な生き物、貴方の使い魔に相応しくない」
        locator: {}
        spoiler_after: ch5194
      - event_ref: E_ch5194_青嶺瑠璃_loves_Spear_p266
        quote: 私はずっと前から歌姫のファンで――だから当然、応援の手紙を送り続けていた。何かの記事で読んで以来頭に刻み込んでいた、彼女の好きな花を添えて。
        locator: {}
        spoiler_after: ch5194
      - event_ref: E_ch5194_青嶺瑠璃_fears_消失_p281
        quote: 'ああそうか、私は特別じゃないと嫌なんだ。

          なんて傲慢なんだろう。

          恥ずかしい。

          このまま消えてしまいたい。'
        locator: {}
        spoiler_after: ch5194
    visual:
      observations:
      - event_ref: E_ch5194_青嶺瑠璃_fights_影と黒衣の女性_p140
        quote: ああ、私の目の前で争う沢山の影と黒衣の女性は、私の内心の葛藤を可視化した天使と悪魔なのだろうか？
        locator: {}
        spoiler_after: ch5194
      - event_ref: E_ch5194_青嶺瑠璃_is_located_高校一年生_p3
        quote: ちょっと夢見がちだけど、ごくごく平凡な高校一年生。
        locator: {}
        spoiler_after: ch5194
    name:
      observations:
      - event_ref: E_ch5194_青嶺瑠璃_names_自分_p2
        quote: 私、青嶺瑠璃（あおねるり）、十六歳。
        locator: {}
        spoiler_after: ch5194
      - event_ref: E_ch5194_青嶺瑠璃_other_アイドル_p74
        quote: なにしろ私は高校生でありながら、アイドルとして売り出しているから。
        locator: {}
        spoiler_after: ch5194
    symbolic:
      observations:
      - event_ref: E_ch5194_青嶺瑠璃_has_property_普通じゃない顔_p4
        quote: そんな私だけど、実はちょっとだけ普通じゃない顔があるんです。
        locator: {}
        spoiler_after: ch5194
  first_appearance_candidate: true
