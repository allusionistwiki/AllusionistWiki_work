        locator: {}
        spoiler_after: ch5194
      - event_ref: E_ch5194_Spear_other_決闘_p293
        quote: 「ハルと――ううん、ジルと存在をかけて決闘して。勝った方が、ハルベルトの名を受け継ぎ、存在基盤を確立する。頷いてくれないとあなたを殺してジルも死ぬ。頷いてくれたらあなたかジルのどちらかが死ぬ。さあ選んで」
        locator: {}
        spoiler_after: ch5194
      - event_ref: E_ch5194_Spear_other_青嶺瑠璃_p30
        quote: '「ルリ、お手」

          「わんっ」'
        locator: {}
        spoiler_after: ch5194
      - event_ref: E_ch5194_Spear_threatens_リアン_p50
        quote: 「どうしてあいつはトーク系ばっか回してくるの。馬鹿なの。死ぬの」
