entities:
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5015_アキラ_reveals_組織の責任体系_p10
        quote: 正確に言えば、私が発案しキールが承認した。アキラ以外の全員が納得済みだ。部隊行動の責任者であるキールの方がこういう時には責任が重く、更に言えばその上位者である『松明の騎士団』総団長ソルダ・アーニスタ卿が責任を持って遺族に対応する、というのが我々のやり方だ。
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5015_アキラ_other_魔将_p111
        quote: 「異獣の中でも強力な固体を魔将と呼ぶ。魔将は異獣の統率者で、奴らには迷宮の階層を掌握、支配するほどの力がある。あのエスフェイルは我々が確認した中では十五番目の魔将で、この第五階層の掌握者。私のこの『左手』も魔将級の寄生異獣。同等かそれ以上のポテンシャルを持ってるから、奴にも対抗できる」
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5015_アキラ_reveals_適合者としての役割_p117
        quote: '私のような新兵がこんな前線まで来ているのはそういった背景もあるが、同時に第一魔将の適合者として、その力を測られているというのが大きい。

          結果で私の有用性を証明しなくては、私は地上でも生き残れない。'
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5015_アキラ_thinks_カインへの怒り_p12
        quote: 'だから実を言えば、アキラは私に怒っていい。

          捨て石の中に、私は彼を含めた。しかも何の説明もないまま。

          殴られる程度は当然だし、殺されたってまあ文句は言えないだろう。'
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5015_アキラ_other_エスフェイル討伐_p120
        quote: '第十五魔将エスフェイルは私が倒す。

          あれだけ強力な個体だ、核を奪って寄生異獣にすれば、さぞ我々の役に立ってくれるだろう。

          そうして私たちは、また一歩勝利へと近付くのだ。'
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5015_アキラ_promises_カインへの対応_p17
        quote: 'ただそれでも、生きて帰れたら。その時は、彼が望むできるかぎりの事をしようと思う。

          それを今口に出さないのは私の卑劣さだが、お前は死んでもいい、と正直に言って気分を良くする人間はいない。協力を取り消されても困るし、生きて帰れたらありったけ罵ってもらうとしよう。'
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5015_アキラ_says_状況説明_p2
        quote: 'そのあと、彼と情報交換をした。私は簡単に状況を説明する。

          私が魔導書を託されたこと。

          その魔導書を使えば、エスフェイルを倒せること。

          魔導書を使えるまで、しばらく時間がかかること。

          そして、時間稼ぎの為にバラバラに逃げたこと。'
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5015_アキラ_other_敵の特定_p21
        quote: '今、考えるべきことがあるとしたら、それはカインを殺したのはエスフェイルだということ。

          これだけは絶対にはき違えてはならない。'
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5015_アキラ_defines_戦い方_p31
        quote: '「悲しみではなく、怒りを抱くこと。そして怒りは闘志に変えること。怒りや憎しみをそうして使ってやれば、遺された者は感情に溺れること無く戦い続けられる」

          説教じみた私の語りを、アキラは神妙な表情で受け止めていた。じみたというか実際に説教である。私達が掲げる神は荒ぶる戦神としての側面を有する。松明の騎士団は、怒りと憎しみを否定しない。それは乗りこなし、制御すべき友なのだから。'
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5015_アキラ_other_エスフェイルのルール_p38
        quote: 'それが呪術である以上、術者の世界観に適応した論理が必ず存在する。脚だけが無かった、というアキラの報告は、その裏付けになる。

          奴のルールを暴き、確実に存在ごと解体してやる。'
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5015_アキラ_reveals_寄生異獣_p78
        quote: '「ええ。他のみんなは違うけど、私は寄生異獣を宿しているから、ゾンビ化しないように厳重に管理されてる」

          「寄生異獣？」

          「これ」

          『左手』を示す。そういえば、彼には教えていなかった。'
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5015_アキラ_confesses_責任_p8
        quote: 「私は、仲間の命を捨て石にしたの。だからカインが死んだことで責められるべきは私」
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5015_アキラ_other_左手の危険性_p96
        quote: 「一応言っておく。寄生異獣を左腕の義肢にしようとか思わない方が良い。非常に危険だから」
        locator: {}
        spoiler_after: ch0000
  first_appearance_candidate: true
