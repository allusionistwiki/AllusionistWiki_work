- kind: mystery
  name: MY_クレイの出生の特異性
  note: オルヴァが「再生者の赤子は必ず冥府を母に選び、現世への生誕を拒絶する」と断言した中で、なぜクレイだけが純粋な再生者として存在し得たのかという疑問。彼の存在そのものが世界のルールから外れている可能性を示唆する。
  quotes:
  - quote: だとすると、ひとつ疑問が残る。なぜクレイは生まれてきたのか。
    paragraph: p245
    quote_verified: true
  - quote: 選択権を与えられた再生者の赤子たちは必ずその答えに辿り着く――彼らは、彼らを宿した命の母よりも冥府というより大いなる母を選ぶのだ。そう、必ず。絶対にだ。例外は無い
    paragraph: p242
    quote_verified: true
  expected_payoff: クレイが単なる再生者ではなく、アルト・イヴニルや冥府との間に特殊な契約・由来（例：意図的な召喚、あるいは世界の歪みの産物）を持つことの伏線として回収される。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
