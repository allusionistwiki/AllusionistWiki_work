    speech:
      observations:
      - event_ref: E_ch5197_アズーリア_says_さよなら_p118
        quote: '「さよなら」

          それだけ告げると、世界が闇に包まれた。'
        locator: {}
        spoiler_after: ch5197
      - event_ref: E_ch5197_アズーリア_says_諦めないで_p13
        quote: '「諦めないで」

          ヴァージリアは、どこかで聞いたような言葉を口にした。

          当然だった――それは私が彼女に告げた言葉なのだから。'
        locator: {}
        spoiler_after: ch5197
      - event_ref: E_ch5197_アズーリア_defines_ハルベルトの使い魔としての誇り_p204
        quote: '尊敬する素敵な人の、一番近くにいられるということ。

          大切な人を、支えてあげられるということ。

          大切な人に、支えてもらえるということ。'
        locator: {}
        spoiler_after: ch5197
      - event_ref: E_ch5197_アズーリア_confesses_ヴァージリアへの感謝_p28
        quote: '「同じ事。ジルもあなたが呼びかけてくれなかったら自分を、そしてお母様とお姉様のことを信じられなくなっていた。あなたの言葉が今日までの支えになったの。あなたの言葉を信じたから」

          救いだと思った。'
        locator: {}
        spoiler_after: ch5197
      - event_ref: E_ch5197_アズーリア_thinks_フィリスの封印_p5
        quote: フィリスの封印は黒百合の子供たち全員で行っているもの。
        locator: {}
        spoiler_after: ch5197
    action:
      observations:
      - event_ref: E_ch5197_アズーリア_uses_マロゾロンドの力_p149
        quote: 加えて、存在が確かになった今、私は自由自在にマロゾロンドの力を引き出せる。掌握した呪力を影に注ぎ込んでも乗っ取られることはもはや無い。膨れあがる影は古き神の力を宿し、ペレケテンヌルを撃退した時の如き威力で斧槍を押し返していく。
        locator: {}
        spoiler_after: ch5197
      - event_ref: E_ch5197_アズーリア_observes_斧槍の引き抜き_p22
        quote: ゆっくりと、斧槍が引き抜かれていく。
        locator: {}
        spoiler_after: ch5197
    name:
      observations:
      - event_ref: E_ch5197_アズーリア_names_アズーリア・ヘレゼクシュ_p197
        quote: '私、アズーリア・ヘレゼクシュ、歳は三十二歳、霊長類の数え方だと十六歳。

          キュトスの姉妹の末妹候補、ハルベルトの弟子にして使い魔。'
        locator: {}
        spoiler_after: ch5197
  first_appearance_candidate: true
