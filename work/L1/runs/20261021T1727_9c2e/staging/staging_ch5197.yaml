entities:
- canonical_target: '[[E_relation_ヴァージリア]]'
  entity_type: relationship
  aspects:
    action:
      observations:
      - event_ref: E_ch5197_ヴァージリア_attacks_マロゾロンドの触手_p113
        quote: 深淵の向こうで、父にして母なるマロゾロンドが触手を氷の刃で切り裂かれ、更にはお菓子に変えられていく。
        locator: {}
        spoiler_after: ch5197
      - event_ref: E_ch5197_ヴァージリア_fights_アズーリア_p123
        quote: 'ハルベルトは斧槍を逆手に持ち、投擲する構えをとった。

          「アズ、あの時の続きをしよう」

          「そういえば、ちゃんとした決着、つけてなかったね」'
        locator: {}
        spoiler_after: ch5197
      - event_ref: E_ch5197_ヴァージリア_activates_第九位の加護_p154
        quote: '荒れ狂う二つの神格の加護を全くの等量分だけ引き出していたハルベルトは、そこで何を思ったか両方の力を外側に向けるのではなく内側に向けて、相殺させてしまう。

          二つの力は打ち消し合い、残ったのは中庸――そして虚無。

          「三叉槍は三相女神の象徴――第三位と第六位の加護を打ち消した後に残るのは、神の加護を否定した無神論――第九位」'
        locator: {}
        spoiler_after: ch5197
      - event_ref: E_ch5197_ヴァージリア_fights_金眼_p35
        quote: ヴァージリアは、悪夢の群れの一番奥で強く輝きを放っている巨大な金眼を見つけると、斧槍を突きつけて告げる。
        locator: {}
        spoiler_after: ch5197
      - event_ref: E_ch5197_ヴァージリア_breaks_邪視の速度_p40
        quote: 邪視の圧倒的速度を、しかし斧槍は力強く両断した。
        locator: {}
        spoiler_after: ch5197
      - event_ref: E_ch5197_ヴァージリア_activates_名前交換の呪文_p49
        quote: '突然、ヴァージリアは鋭く斧槍を投擲した。

          私は向かってくるそれをどうにか枝角で受け止める。

          凄まじい呪力を有する斧槍の呪文を完全に保持すると、途端に私のアストラル体が改変されていくのを感じた。

          「これって」

          「はい、これで今からあなたはハルベルト」'
        locator: {}
        spoiler_after: ch5197
      - event_ref: E_ch5197_ヴァージリア_takes_斧槍_p59
        quote: こんなに簡単に私に名前を明け渡して大丈夫なのかと心配になったけれど、ヴァージリアはすかさず私に飛びかかって擦れ違いざまに斧槍を奪っていく。
        locator: {}
        spoiler_after: ch5197
    speech:
      observations:
      - event_ref: E_ch5197_ヴァージリア_other_ゲルシェネスナ_p166
        quote: 「天空世界の言い伝えに曰く、その槍こそは紀元槍の枝の一つ、名は『威力』。月に放てば月を滅ぼし、陽に放てば陽を滅ぼす。万象貫け――【ゲルシェネスナ】」
        locator: {}
        spoiler_after: ch5197
      - event_ref: E_ch5197_ヴァージリア_threatens_マロゾロンド_p175
        quote: 「ハルのものに手出しするようなら、またゲルシェネスナをお見舞いしてあげる。それが嫌なら、大人しく加護を引き出されるだけの無害な存在でいること。あなたはアズの生みの親で加護発生装置なんだから、これからも働いてもらう」
        locator: {}
        spoiler_after: ch5197
      - event_ref: E_ch5197_ヴァージリア_other_アズーリアと仲間_p18
        quote: 「あなたもジルも、そしてみんなも。もうフィリスに負けるほど弱くない。呪文の力を掌握して、自在に操る一人前の魔女なんだから。力を合わせればフィリスに負ける事なんてない。もちろん、マロゾロンドにだって」
        locator: {}
        spoiler_after: ch5197
      - event_ref: E_ch5197_ヴァージリア_says_エミュレータ論_p37
        quote: 「摸倣だから、偽物だから、その中には本物が無いとあなたは言う。けれどジルはそうは思わない。外側の観測者たちが偽物だと思えないのなら、その振る舞いはジルたちの呪術的なものの見方によって本物だと確定できる。ならそれは、本物を一から再現するエミュレータと同じ事」
        locator: {}
        spoiler_after: ch5197
      - event_ref: E_ch5197_ヴァージリア_says_言葉と存在の構造_p42
        quote: 「そう、誰もが詭弁と幻想の世界に生きている。本当じゃないフィルター越しの、目や耳や鼻や肌や舌、そして記号と意味、信号と言葉の構造の中にしか存在しない――ううん、そもそも『存在』なんてものは言葉の中にしか存在してない。なら、『ほんとう』は誰もが言葉の中にしか存在できないはずなの」
        locator: {}
        spoiler_after: ch5197
      - event_ref: E_ch5197_ヴァージリア_other_ハルベルトの意味の所在_p65
        quote: '「ハルベルトなんて言葉に過ぎない。その意味は、その了解は、本当は別の所にある。例えば」

          ヴァージリアあるいはハルベルトは私との間の距離を手の仕草で示した。

          それから、斧槍で両者の距離を測るようにする。'
        locator: {}
        spoiler_after: ch5197
      - event_ref: E_ch5197_ヴァージリア_other_ハルベルトの共有_p82
        quote: '「私たちで、ハルベルトを共有する――？」

          「ぶつかり合う度に、ハルベルトという名前は移動する」

          「そうしたら、記号だけが移り変わって、意味も少しずつ揺らいでいって――」

          「中身と器を移し替えて、揺らしながらぐるぐる回す」'
        locator: {}
        spoiler_after: ch5197
  first_appearance_candidate: true
- canonical_target: '[[E_term_アズーリア]]'
  entity_type: terminology
