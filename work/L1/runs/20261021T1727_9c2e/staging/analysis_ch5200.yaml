- kind: theme
  theme: 言語と感情の不可分性による真実の強制
  weight: 0.85
  quotes:
  - quote: 呪文を使えない者は、呪文使いに言葉で嘘はつけない。 『筆致』に込められた感情で、それが本心かどうかすぐにわかってしまうから。
    paragraph: p335-p336
    quote_verified: true
  - quote: 私はその一瞬、確かにアキラと再会した。
    paragraph: p388
    quote_verified: true
  note: 虚構の中で「嘘」が機能しない世界において、キャラクター間の関係性は言葉（感情）の真実性によってのみ成立する。アズーリアのアキラへの想いも、呪術的な強制力なくしては伝達不能だが、ゆえに深く確信される。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 境界の溶解と自己定義の自由
  weight: 0.75
  quotes:
  - quote: 空の向こうって、きっと私が想像してる以上に、怖いくらいに自由で … それって不自由なのか自由なのかわかんないね。
    paragraph: p174-p181
    quote_verified: false
  - quote: そこに境界は無く、色を定める言葉があるとすれば、その数は無限。 私たちは、声を揃えてこう言った。 「万色！」
    paragraph: p265-p268
    quote_verified: true
  note: 地上と地獄、昼と夜、虹の色といったカテゴリー（境界）が意味を失い、無限の解釈可能性に開かれる瞬間。これは世界の理から外れた「自由」への恐怖と解放を描く。
