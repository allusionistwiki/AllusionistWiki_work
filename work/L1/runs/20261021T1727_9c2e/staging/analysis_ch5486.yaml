- kind: mystery
  name: MY_テッシトゥーラの真意とハルベルトとの関係
  note: テッシトゥーラがハルベルトに似ている（p35）とされるが、ユディーアは「根本的に異質」（p39）と認識。また、テッシトゥーラ自身もトライデントの細胞であることを明かす（p125）。この二重構造の真意と、ハルベルトとの関係性が今後の対立軸となるか。
  quotes:
  - quote: 美しい容貌の輪郭や気配が、どことなくあの太陰の王女と重なるような気がする。似ていると言うほどではない。
    paragraph: p34
    quote_verified: true
  - quote: わたしの立場は内密にね。ついでに明かすとわたしもトライデントの細胞だったりするんだよ。
    paragraph: p125
    quote_verified: true
  expected_payoff: テッシトゥーラがハルベルトを利用した存在なのか、それとも対立する派閥の工作員として機能しているのかの判明。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
