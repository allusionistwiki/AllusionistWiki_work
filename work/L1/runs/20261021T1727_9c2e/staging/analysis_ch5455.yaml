  quotes:
  - quote: 呪的逃走の逸話を持つ私は、逃げる力ではこの盗賊に敵わないことが理解できていた。ここにいるのは既にゼドの残滓でしかない。彼は自分の影を経由してとっくにステュクスの外部に移動している。
    paragraph: p230
