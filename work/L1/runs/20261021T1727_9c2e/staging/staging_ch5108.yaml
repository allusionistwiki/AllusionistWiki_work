      observations:
      - event_ref: E_ch5108_漆黒のシャクティ_defines_視野の求道者_p145
        quote: 想起されたのは、黒い肌の尼僧。あらゆる異世界、あらゆる時空を想像と予測のみによって見透かすという恐るべき視野の求道者である。
        locator: {}
        spoiler_after: ch5108
  first_appearance_candidate: true
- canonical_target: '[[E_item_石版]]'
  entity_type: item
  aspects:
    action:
      observations:
      - event_ref: E_ch5108_石版_stops_幻肢_p22
        quote: だがその時、キロンの周囲で待機していた石版がその能力を発揮した。展開された文字列が鏡の世界の幻影の腕に対して接触すると、ワイヤーのように巻き付いてその動きを押し止めたのである。
        locator: {}
        spoiler_after: ch5108
  first_appearance_candidate: true
- canonical_target: '[[E_item_クレーター中心部]]'
  entity_type: item
  aspects:
    visual:
      observations:
      - event_ref: E_ch5108_クレーター中心部_is_located_無傷の地面_p59
        quote: 俺が立つクレーターの中心。その場所だけ、一切の破壊に晒されなかったかのように地面が高くなっている。事実、俺の真下にはキロンの突撃による破壊力が届いていなかったのである。当然俺にもだ。
        locator: {}
        spoiler_after: ch5108
  first_appearance_candidate: true
- canonical_target: '[[E_item_神滅具]]'
  entity_type: item
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5108_神滅具_has_property_自動修復機能_p6
        quote: コルセスカとの戦闘で確かに破壊されたはずだが、修復する手段があったのか、それともあの呪具は自動で修復する機能を有していたのか。少年達の姿はとらず、ただ戦力を集中して俺を即座に殲滅する構えのようだ。
        locator: {}
        spoiler_after: ch5108
  first_appearance_candidate: true
- canonical_target: '[[E_term_神働術]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch5108_神働術_defines_聖人のエピソード摸倣_p72
        quote: キロンが使うあの神働術は、俺の知らない過去の聖人のエピソードを摸倣し、その性質を自らに重ねて自己を強化する術なのだと二人の魔女は説明していた。【松明の騎士団】が誇る膨大な歴史と伝統、その重みがそのまま呪力の強度となって襲いかかる。
        locator: {}
        spoiler_after: ch5108
  first_appearance_candidate: true
- canonical_target: '[[E_char_ヴァレリアンヌ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5108_ヴァレリアンヌ_appears_as_扉職人_p89
        quote: 刹那、脳裏に見知らぬ誰かの姿が浮かぶ。緑色の短い髪と、身の丈よりも巨大な斧が特徴的な背の低い少女。年の頃は十四かそこらのミドルティーン。その周囲には無数の扉。少女が一つの扉を開いて向こう側を覗き込むと、その他の全ての扉から少女の顔が現れる。【扉】――この世界における、空間制御技術。その叡智を統べる、【星見の塔】随一の扉職人（ハイパーリンカー）ヴァレリアンヌ。
        locator: {}
        spoiler_after: ch5108
  first_appearance_candidate: true
