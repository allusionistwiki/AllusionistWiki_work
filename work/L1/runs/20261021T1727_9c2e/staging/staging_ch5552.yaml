        locator: {}
        spoiler_after: ch5552
      - event_ref: E_ch5552_ユディーア_arrives_階層外周境界壁_p4
        quote: 階層の外周境界壁付近に転移してきたユディーアたちを照らすのは眩い文明の灯火だった。
        locator: {}
        spoiler_after: ch5552
