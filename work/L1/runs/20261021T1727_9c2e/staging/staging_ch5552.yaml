entities:
- canonical_target: '[[E_char_チリアット＝アテンプレク]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5552_チリアット＝アテンプレク_other_離脱_p102
        quote: 「ユディーア様。この場を離脱してディスケイムの陣に逃れましょう」
        locator: {}
        spoiler_after: ch5552
      - event_ref: E_ch5552_チリアット＝アテンプレク_other_ユディーア_p240
        quote: '「行きなさい！　友を助けられぬ後悔など、背負う必要はない！」

          チリアットは上空のイナータルゴを迎撃しに。

          ユディーアはメートリアンが囚われている温泉の方に。'
        locator: {}
        spoiler_after: ch5552
    action:
      observations:
      - event_ref: E_ch5552_チリアット＝アテンプレク_transforms_超加速状態_p137
        quote: '怒則気上。点穴による感情制御で激昂し、発生した本気の殺意をチリアットに叩きつけた。死の恐怖に怯えた牙猪の目が血走り、彼の体感時間が引き伸ばされていく。

          三眼瞬知。超加速状態に突入したチリアットが疾走する。'
        locator: {}
        spoiler_after: ch5552
      - event_ref: E_ch5552_チリアット＝アテンプレク_other_右腕_p222
        quote: '漆黒の右腕が膨張し、本体からは独立した動きでチリアットの口の中に突っ込んだ。

          即座に自切。高位の亜竜人は髪の毛や牙、爪、尾を呪物として扱うが、時には痛みを堪えながら眼球や腕さえも生贄に呪術を実行する。'
        locator: {}
        spoiler_after: ch5552
      - event_ref: E_ch5552_チリアット＝アテンプレク_breaks_牙_p230
        quote: '見れば、チリアットは倒れた状態で下顎から伸びた牙を大地に突き刺していた。

          死を直視する邪視。冥府と結びついたその力は、冥界として解釈できる第六階層の大地への干渉を可能とした。代償として牙の一本が砕け散る。'
        locator: {}
        spoiler_after: ch5552
      - event_ref: E_ch5552_チリアット＝アテンプレク_other_牙_p232
        quote: 迷わずに己の下顎に残ったもう一本の牙を折り、ユディーアに向けて投擲。虚空で火花を散らして大気が焼き焦げていく。衝撃の後、同調を強いる無形の魔導書が霧散。
        locator: {}
        spoiler_after: ch5552
      - event_ref: E_ch5552_チリアット＝アテンプレク_other_ユディーア_p9
        quote: 気が付けばユディーアは巨躯の猪人（ブルータ）に片腕で担がれていた。加速状態で疾駆したチリアット＝アテンプレクが魅了浄界から彼女を救出したのだ。
        locator: {}
        spoiler_after: ch5552
    visual:
      observations:
      - event_ref: E_ch5552_チリアット＝アテンプレク_wounds_自身_p16
        quote: ユディーアを抱えていた左腕の火傷と裂傷。背中にへばり付いた怨念呪詛。黒鱗に覆われた右拳の流血。男は見てわかる部分だけで三か所は負傷していた。
        locator: {}
        spoiler_after: ch5552
  first_appearance_candidate: true
