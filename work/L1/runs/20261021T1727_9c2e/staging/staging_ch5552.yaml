        quote: 'ユディーアという個を特徴づけるサイドテールの髪房を、伸ばした指を一閃させて切り落とす。髪は呪物で、角は誇りだ。

          「来たれ我が軍勢（レギオン）。『勇士（サムソン）の髪秤』！！」'
        locator: {}
        spoiler_after: ch5552
      - event_ref: E_ch5552_ユディーア_other_軍勢_p262
        quote: '『裏切りの戦乙女（ユディーア）』の権能が時空を超えて勇士たちを召喚。

          その場に輝く召喚円が次々と現れ、真下からせり上がるように人影が形を作っていく。'
        locator: {}
        spoiler_after: ch5552
      - event_ref: E_ch5552_ユディーア_other_トランクケース_p299
        quote: '使い魔に回収させた巨人の濡れ髪を握ったまま、ユディーアはトランクケースを鳥人クロウから受け取る。既に遮るものはない。

