- kind: theme
  theme: 技術体系の差異（サイバー/AR vs 呪術）による相互理解の限界と翻訳
  weight: 0.8
  quotes:
  - quote: 私達の世界では人間の五感を器質的に操作する技術は様々な理由から発達しませんでした... 拡張現実や仮想現実の技術はその存在のみが示唆されていましたが、実現には至っていません。
    paragraph: p105
    quote_verified: false
  - quote: この世界は、元世界とよく似ている。文明の発達度合いもそう変わらないようでもある。しかしその技術的な基盤は大きく異なっていた。呪術という、未知の力が働いているからだ。
    paragraph: p115-p116
    quote_verified: true
  note: 現代科学と魔法が同じ機能（AR、投影）を異なる原理で実現しており、その違いがキャラクター間の認識のズレを生んでいる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
