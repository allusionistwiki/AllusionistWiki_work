  theme: 異世界生活の日常化と「異常」への慣れ
  weight: 0.7
  quotes:
  - quote: 最初の頃はちょっとした現実感の喪失を感じたものだった。今ではもう慣れたものだ。ごく自然に、雑踏の中に埋没していく。
    paragraph: p76-p78
    quote_verified: true
  - quote: すれ違う人々の半分は俺と似たような『上』系の人種で差異は肌の色や顔立ち、体格程度のものだ。だが『下』系の人種はその形態からして多種多様である。
