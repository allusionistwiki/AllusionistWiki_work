- kind: theme
  theme: メタフィクションにおける『作者』と『登場人物』の境界崩壊：物語外からの介入（アプリ、作者の声）が物語内の物理法則を凌駕する。
  weight: 0.9
  quotes:
  - quote: この世の全てが劇場、というわけだ。ならば、もはや神だろうが語り部だろうが作者だろうが全て舞台の上の登場人物に過ぎないのだ。
    paragraph: p70
    quote_verified: true
  - quote: ちびシューラが持つ電子ボードには「そこでボケて」と表示されているが、お前はそこでボケんでいい。真面目にやれ。
    paragraph: p153
    quote_verified: true
  note: アキラ（主人公）がメタ的な視点を持ち、アプリや作者の指示を劇中の力として利用する構造。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 身体性と意識の分離：幻肢・幻脳という錯覚によって構成される『自己』と、物理的実体の間の葛藤と優位性。
