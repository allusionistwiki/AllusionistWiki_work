  quotes:
  - quote: 存在しない脳そのものが脳という構造をあると勘違いするという壮大な喜劇。幻肢ならぬ『幻脳』が俺の意識をあやふやな土台の上で継続させる。
    paragraph: p79
    quote_verified: true
  - quote: 空想を打撃力に変換することでパーンへ渾身の一撃を見舞う。
    paragraph: p134
    quote_verified: true
  note: 肉体を持たない（幻肢化）アキラが、錯覚と信念によって実体を持つ敵と対等に渡り合う能力の探求。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
