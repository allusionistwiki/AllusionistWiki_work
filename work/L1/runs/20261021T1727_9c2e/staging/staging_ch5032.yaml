          カイン。そしてアズーリア。 未だに整理できない記憶が、頭の中にわだかまっていた。纏まらない思考を続けても仕方がない。息を吐いて、気を取り直す。だが、持論を吐き出してすっきりした俺とは対照的に、コルセスカは何事かを思案していた。
        locator: {}
