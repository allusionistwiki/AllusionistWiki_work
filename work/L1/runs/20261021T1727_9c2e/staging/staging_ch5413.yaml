        locator: {}
        spoiler_after: ch5413
    speech:
      observations:
      - event_ref: E_ch5413_シナモリアキラ_remembers_幼少期_p102
        quote: 幼いころ、誕生日にはじめて素敵なプレゼントを貰ったあの時から今この瞬間に至るまで、私は誰かからの贈り物の素敵さによって生かされてきた。
