        locator: {}
        spoiler_after: ch5413
      - event_ref: E_ch5413_シナモリアキラ_activates_発勁用意_p147
        quote: '「それじゃあみんな、行くよ！ 発勁用意――」

          お決まりの声に呼応してちびシューラたちが「のこった！」と叫ぶ。'
        locator: {}
        spoiler_after: ch5413
      - event_ref: E_ch5413_シナモリアキラ_uses_パイプ_p18
