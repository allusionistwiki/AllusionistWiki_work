- kind: mystery
  name: MY_text_cursing_mechanism
  note: 文字が記憶されず、視覚的に歪む現象。これが単なる言語習得の障壁なのか、世界法則への干渉能力（ルーン魔術等）の欠如を示すものか、あるいは主人公特有の精神異常・世界のバグであるかの示唆が必要。
  quotes:
  - quote: 問題は、俺がその文字を覚えようとしても、記憶や認識がぼやけるような妙な感覚に襲われ、できないということだった。そればかりではなく、こういう形だと思った瞬間、その文字がぐにゃりと歪んで別の形になってしまうことまであった。
    paragraph: p107
    quote_verified: true
  - quote: 文字が呪術的な力を帯びる、ということらしい。あらゆる文字は物理的な実体としてそこにあるのではなく、なにか奇妙な力や法則によって常に変化してしまうようなのだ。
    paragraph: p109
    quote_verified: true
  expected_payoff: 主人公が世界の本質（コード/呪文）を視認・操作できないことによる戦闘力の制限、あるいは世界の「書き換え」に対する耐性を持つ特異体質の伏線。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
