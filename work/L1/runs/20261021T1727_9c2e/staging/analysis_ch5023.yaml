  quotes:
  - quote: 第四階層、第六階層に侵入して自分の足で上か下に向かおうとすれば、俺は審判であるヲルヲーラによって敵味方識別用の呪的マーカーが付加され、両方の防衛側戦力から敵と見なされて排除されてしまう始末。
    paragraph: p44
    quote_verified: true
  - quote: この審判は複数いるらしく、次の瞬間には新しいヲルヲーラが現れて俺に対する一週間の第四階層立ち入り禁止ペナルティを科してきた。
    paragraph: p127
    quote_verified: true
  expected_payoff: ヲルヲーラの正体（AI、自動人形、あるいは神格）の判明と、主人公が「住人」として認定されるための条件（クリア条件）の提示。
  proposed_by:
    kind: agent
