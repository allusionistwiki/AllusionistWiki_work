- kind: mystery
  name: MY_azuriah_black_hand
  note: アズーリアの左手が通常の黒肌ではなく「光を飲み込む闇」として描写され、戦闘後に隠蔽された。これが彼の爆発力と信頼の源である可能性が高い。
  quotes:
  - quote: 剥き出しになった左手は、遠目にも華奢と分かる。だがそれ以上に気になるのは、あまりにもその色が黒いことだった。肌の色が黒い、というのなら驚くような事ではない。そうではなく、あらゆる光を飲み込むかのように色が無く、手そのものが深い闇のようだと感じて、思わず息をのんでしまった。
    paragraph: p120
    quote_verified: true
  expected_payoff: アズーリアが「影」や「虚無」を操作する能力、あるいは彼自身が何者でもない（人間ですらない）存在であることの露見。その力の代償として左手の存在が消滅/不可視化されている暗示。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_azuriah_hidden_power
  note: 主人公が「理解できないまま終わった」と記述し、アズーリアが盾と籠手を外すだけで即死級の一撃を与えた。そのメカニズムが不明。
  quotes:
  - quote: ――そして、俺が理解できないまま終わった。「何だ？」困惑。頭の中を占めるのはただそれだけだった。気がついたら決着が付いていた。
    paragraph: p107
    quote_verified: true
  expected_payoff: アズーリアの能力は物理的な攻撃ではなく、概念操作・因果律干渉・あるいは罠との共振によるもの。主人公の「理解不能」は彼の認知能力（ゲーム的UI）がその現象を検知できないことを示す。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_party_trust_basis
  note: アズーリアは最も危なっかしく孤立しやすいのに、全員から「あいつが負けるはずがない」という揺るぎない信頼を集めている。その根拠が明記されていない。
  quotes:
  - quote: 奇妙な事だが、アズーリアはこの中で最も危なっかしいように思えるのに、全員から「あいつが負けるはずがない」というような揺るぎない信頼を集めているようなのだ。
    paragraph: p89
    quote_verified: true
  expected_payoff: パーティの結成経緯やアズーリアの実績（過去の事件）が明かされる、あるいは彼の能力が「失敗しない」ことが確定的な事実であることの証明。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_giant_wolf_flashback
  note: 巨大狼戦でアズーリア（と思われる人物）が後方に下がり何かをしていた記憶があるが、詳細は不明確。
  quotes:
  - quote: 思い返せば巨大狼との戦闘の時、俺が走り回る反対側で、四人のうち一人が後ろに下がって何かをしていたような気がする。あの時は誰が誰なのかも分からなかったのだが――。
    paragraph: p98
    quote_verified: true
  expected_payoff: アズーリアの能力発動条件（準備動作・盾外し等）と巨大狼戦での行動がリンクしており、彼の力の制御方法や弱点、あるいは彼がパーティに加入したきっかけとなる事件の詳細。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_cursed_weapons_purpose
  note: 持ち帰った呪われた武具（殺し合いの呪い）をトッドが背負い続けている。これらはどう利用されるのか、あるいは誰に渡されるのか。
  quotes:
  - quote: 早速手に入れた武具で装備を更新するのかと思ったらどうやらそうではないらしい。全てトッドの背嚢行きだ。何故だろうと不思議に思っていると、カインとキールが揃ってそれらの武具を掴む振りをする。すると、お互いに架空の武器を握って戦いを始める。加えて「アレをとるのはダメだ」というようなことを言われた。
    paragraph: p14
    quote_verified: true
  expected_payoff: これらの武具は特定の敵（番人等）への鍵、呪い解除のアイテム、あるいは主人公に渡されることで彼のゲーム的性質と衝突する「バグ」の原因となる可能性。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_torch_symbolism_meaning
  note: 胸の松明の文様が迷宮探索と関連している暗示があるが、具体的な象徴的意味（組織の目的・信仰）は未定義。
  quotes:
  - quote: 実際に松明を持っている者はいないし、何かを照らしたり探したりする行為の比喩なのだろう。彼らが迷宮を探索していることと関係がありそうな感じだった。
    paragraph: p47
    quote_verified: true
  expected_payoff: パーティが所属する組織（ギルド/宗教/国家機関）のイデオロギー、あるいは「暗黒からの光」＝知識や技術の流出を管理する役割の露見。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
