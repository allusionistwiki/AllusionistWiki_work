- kind: theme
  theme: 迷宮の罠としての「誘因」と殺意の体系化
  weight: 0.6
  quotes:
  - quote: 考えて見ればこんな何でも無さそうな行き止まりに財宝を隠すはずもない。財宝は迷宮の一番奥で強大な番人に守られているというのが定番だろう。しかしわざわざ解錠して武具を持ち帰る所を見ると、使えないだけで無価値というわけでも無さそうだ。何らかの利用方法があるか、呪いを解く手段が存在するが、ここではできない、ということなのだろう。
    paragraph: p19
    quote_verified: true
  note: 罠は単なる物理的障害ではなく、「財宝」という誘因を通じて侵入者を殺すために設計されている。主人公の「定番」からの逸脱認識が、迷宮設計者の意図（資源回収・排除）を推測させる知性ゲームとしての側面。
  proposed_by:
