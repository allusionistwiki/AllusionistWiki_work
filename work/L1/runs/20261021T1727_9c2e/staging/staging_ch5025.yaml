- canonical_target: '[[E_term_言語魔術師]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5025_言語魔術師_functions_as_催眠効果を持つ特殊な発声_p109
        quote: 「いいえ、貴方には会話が成立しているように感じられるのでしょうが、実際には会話は成立していません。私の、催眠効果を持つ特殊な発声によって、貴方自身に『自分と会話している私』を想像させているのです」
        locator: {}
        spoiler_after: ch5025
      - event_ref: E_ch5025_言語魔術師_defines_過去遡及的な言語の翻訳_p117
        quote: 「実際に貴方は人工無能と対話しているに等しいのです。あらかじめ用意された会話パターンへ、貴方によって貴方自身が誘導される。意味のある会話をしているような気がするだけ。その間、私は貴方の発話から単語や文法を解析し、推測し、日本語の習得を行っています。習得がある段階まで進んだ時点で催眠から実際の対話へと移行。貴方の発言は全て記憶しているので、私はそれに合わせて会話内容に対応した、意味のある発言へとシームレスに繋げる。これにより過去に遡って会話が成立した事になります」
        locator: {}
        spoiler_after: ch5025
  first_appearance_candidate: true
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5025_アキラ_observes_言語翻訳装置の不在_p13
        quote: 目立つ機材などは無い。言語翻訳装置は巨大な装置だという話だったが、ここにはないのだろうか？
        locator: {}
        spoiler_after: ch5025
      - event_ref: E_ch5025_アキラ_thinks_論理破綻と魔術の定義_p130
        quote: 破綻しているのに見た目上は破綻していない感じや雰囲気があるから魔術であり呪術なのであって、そこを踏まえれば彼女は正しく異世界の住人なのだ。
        locator: {}
        spoiler_after: ch5025
      - event_ref: E_ch5025_アキラ_thinks_異世界転生の法的制約_p24
        quote: 美男美女との不用意な接触はまずい。不用意な動きをすれば逮捕まであるのだ。
        locator: {}
        spoiler_after: ch5025
      - event_ref: E_ch5025_アキラ_thinks_自ら死を選ぶ者_p45
        quote: '俺のように豊かな家庭に生まれ、先端技術によるサイバネ手術を受けられる者は限られている。

          そして金があっても、自ら死を選ぶ者もいる。

          俺がそうだ。'
        locator: {}
        spoiler_after: ch5025
      - event_ref: E_ch5025_アキラ_fears_エスフェイルとの対峙_p72
        quote: 蛇に睨まれた蛙のような気分。ぞっとする。エスフェイルと対峙したときのような薄気味の悪さ。
        locator: {}
        spoiler_after: ch5025
      - event_ref: E_ch5025_アキラ_thinks_日本語を耳にする稀有さ_p95
        quote: いや、『心話』では意味が理解できるが聞こえてくるのは未知の言語だったから、音として日本語を耳にするのは自分のものを除けば本当に久しぶりとなる。
        locator: {}
        spoiler_after: ch5025
    visual:
      observations:
      - event_ref: E_ch5025_アキラ_observes_カマキリのような無機質さ_p64
        quote: 彼女を見て連想してしまったのは、カマキリなどの昆虫だ。目はつるりとしたレンズで、複眼というわけではないのだが、意思や温度を感じさせない無機質な印象がどこか似ていた。
