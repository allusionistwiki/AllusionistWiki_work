        locator: {}
        spoiler_after: ch5025
      - event_ref: E_ch5025_コルセスカ_other_最初の改変不穏な呪術_p176
        quote: 「二回目の改変は貴方にとって救いだったのでしょう。けれど最初の改変は、どうも不穏なもののようです。最初に出逢った呪術師に気をつけるといいでしょう」
        locator: {}
        spoiler_after: ch5025
      - event_ref: E_ch5025_コルセスカ_says_さんさのやり_p83
        quote: 「さんさのやり」
        locator: {}
        spoiler_after: ch5025
      - event_ref: E_ch5025_コルセスカ_names_言語魔術師_p91
        quote: 「――図像的意味群を抽出しました。模造と推定の試行を開始します。申し遅れました。私は貴方の使用する言語の解析を依頼された言語魔術師です。どうか、『コルセスカ』とお呼びください」
        locator: {}
        spoiler_after: ch5025
    visual:
