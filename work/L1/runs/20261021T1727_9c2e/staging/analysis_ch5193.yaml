- kind: theme
  theme: 狂気と秩序の境界は脆く、「使い魔（ツール）」としての存在は、主の精神崩壊に伴い兵器化し暴走する。
  weight: 0.6
  quotes:
  - quote: もはや意味を為さない絶叫は理性を失った狂人のそれだ...誰彼構わず噛み付くだけの狂犬...狂乱しながら戦うサリアは、古き神相手に一歩も退いていない
    paragraph: p116-p125
    quote_verified: false
  note: サリアの描写を通じて、忠実な部下・使い魔が主の苦難に共鳴し狂気に転じる危険性（共依存的構造）を示唆している。
  proposed_by:
