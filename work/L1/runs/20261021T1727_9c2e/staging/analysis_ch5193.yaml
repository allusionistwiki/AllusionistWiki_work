- kind: theme
  theme: トラウマ（傷）は「記憶の再構成（ナラティブ・セラピー）」によってのみ克服可能であり、それは嘘（捏造された過去）を含む許容性を持つ。
  weight: 0.7
  quotes:
  - quote: 不安定なものとして固定されたアズーリアの自我を強制的に上書きし、不安定では無かったことにする...『信用できない時制と語り手の解決』を利用した過去遡及的な心療治癒呪術
    paragraph: p248-p249
    quote_verified: false
  note: 現実を直視するのではなく、語りの技術によって意味づけを変えることで精神を修復しようとする試み。真実性よりも「機能性」が優先される倫理観。
  proposed_by:
