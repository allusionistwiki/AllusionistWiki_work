- kind: mystery
  name: MY_Harbert_Trauma_Trigger
  note: ハルベルトがプリエステラの『優しさ』とキノコ人の裏切りによって受けた精神的ダメージは、彼の理想主義の限界を示唆し、今後の彼の性格変化（冷徹化、あるいは狂気）への転換点となりうる。
  quotes:
  - quote: '震えるハルベルトの手をプリエステラが優しく握る。

      もう片方の手でそっと頭を撫でた。慈しむような触れ方は間違いなく私たちが知るプリエステラのものだ。'
    paragraph: p243-p244
    quote_verified: true
  - quote: '掲げた理想を貫いたことに後悔は無いけれど、それでもそれは失敗だった。

      だからこそ、今はプリエステラの優しさがひどく痛い。'
    paragraph: p250-p251
    quote_verified: true
  expected_payoff: ハルベルトの『呪文の座』としての役割の変化、または彼個人の内面崩壊・成長の伏線として機能する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 理想主義（調停）と現実主義（生存）の衝突による相互の傷つけ合い
  weight: 0.8
  quotes:
  - quote: '「そうやって、あなたたちはキノコ人を迫害してきたの？　仲間同士で連帯して、あなたたちの正しさで黙らせて、よってたかって彼らをいじめて」

      私が止めようとする間も無かった。

      既にプリエステラは手を振り抜いている。'
    paragraph: p273-p276
    quote_verified: true
  - quote: '「ハルベルトは悪くないよ。悪いのは、ハルの優しさにつけ込んだ卑怯者たちのほう」

      優しく、そして正しい言葉だった。'
    paragraph: p246-p248
    quote_verified: true
  note: ハルベルトの「殺さない」という理想と、プリエステラの「殺すべき（経験に基づく）」という現実が衝突し、最終的に互いを傷つけ合う形で決着がつく構造。これは物語全体の倫理的対立軸を示唆している。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 集団の抽象化と個の喪失：仮想使い魔による戦力強化は、兵士の個を記号化し、非人間的な効率性をもたらす
  weight: 0.7
  quotes:
  - quote: 部隊という『個』の集合を『群』という記号に変換する呪文。部隊に所属する個々人をリソースと捉え、その観念的な上部構造に仮想使い魔を構築する。
    paragraph: p43
    quote_verified: true
  - quote: 'ハルベルトによって効率化された総体の力だ。

      私たちはひとつの仮想使い魔。その総力をもってすれば、不安定で実戦投入に向かない異獣であろうとも問題無く制御が可能となる。'
    paragraph: p160-p161
    quote_verified: true
  note: 戦闘描写において、個人の意思や肉体が「リソース」として処理され、指揮者の意志一つで動く機械的な集団として描かれることへの違和感と効用。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 内なる他者：同族（ティリビナ人）間の分断と、同じ森の民（キノコ人）への排他的な憎悪
  weight: 0.9
  quotes:
  - quote: 想像以上に根深い因縁が存在している。プリエステラたちティリビナ人にとって、キノコ人たちは同じ森の仲間ではないのだろうか。いや、同じティリビナ人として括られているからこその憎しみなのかもしれない。
    paragraph: p215
    quote_verified: true
  - quote: 「あいつらの文化は殺すことばかりだ。暴力以外を知らない、そういう育ちなんだよ。要するに環境のせいだが、すぐにどうにかなる問題じゃないからな」
    paragraph: p261
    quote_verified: true
  note: 外部の敵（キノコ人）を「異獣」として処理することで得られる結束と、その過程で生じる倫理的な歪み。同じ文化圏に属しながらも激しく対立する民族間の構造的暴力が主題化されている。
  proposed_by:
