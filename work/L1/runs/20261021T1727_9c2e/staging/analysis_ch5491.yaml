- kind: mystery
  name: MY_Jaffarim_Spy_Network
  note: ジャッフハリムがキノコ人コミュニティ内部に工作員を送り込み、祝祭でのテロや分断を画策しているというハルベルトの推測。これが真実である場合、敵は単なる蛮族ではなく組織化された勢力となる。
  quotes:
  - quote: それ、ジャッフハリムが背後にいるってことだよね？　私もその意見に賛成。あの傘を使う虹犬もだけど、私が遭遇した電撃使いの虹犬は魔将サイザクタートを名乗ってた
    paragraph: p229
    quote_verified: true
  - quote: 混沌とした第五階層はスパイも拠点にしやすいのだろう。ジャッフハリムの工作員はキノコ人たちを操って祝祭にでテロを起こすつもりなのかもしれなかった。
    paragraph: p230
    quote_verified: true
  expected_payoff: 物語の敵対勢力であるジャッフハリムの陰謀や、今後の戦線拡大（スパイ活動）の伏線となる。
