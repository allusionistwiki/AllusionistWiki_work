- kind: mystery
  name: MY_harbert_black_blood_origin
  note: ハルベルトの血液が黒く、血管が呪紋のように動くという特異な体質。これが「執念じみた偏執的な人体改造」（p62）によるものなのか、それともキュトスの因子によるものなのか、その起源と詳細は不明。
  quotes:
  - quote: '夜闇の如き命の水が、黒々とその全身を循環して高密度の呪力を運んでいく。

      さながら全身に呪紋を描かれ呪いをかけられているかのようだ。'
    paragraph: p57-p58
    quote_verified: true
  - quote: 執念――あるいは怨念じみた偏執的な人体改造がこれを可能としたのは間違いないように思われた。
    paragraph: p62
    quote_verified: true
  expected_payoff: この黒い血が、後の戦闘で特殊な呪術の触媒となるか、ハルベルト自身の悲劇的な背景（誰による改造か）を明かすためのキーとして回収される。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_philiss_counter_spell_limitation
  note: フィリスの対抗呪文【静謐】は「解析」による解体が本質だが、主人公はこれを「摸倣（再現）」に用いた。理論上可能とされるこの高度な術式操作が、今後どのような制約や代償を伴うかが未確定。
  quotes:
  - quote: '呪術の構造を解析するということは、裏を返せばその本質を掌握するということでもある。

      ならば、そこから全く同じ呪術を再現することだって可能な筈だ。

      あくまでも、理論上は。'
    paragraph: p122-p125
    quote_verified: true
  expected_payoff: 主人公がキロン級の神働術を「摸倣」することで得た代償（魔力枯渇、精神汚染など）が描かれ、今後の戦闘能力の限界を定義づける。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_kiron_divine_art_source
  note: 第九位キロンが使用した「神働術」は通常の医療では不可能な一瞬での治癒（p115）。この術の正体（神からの権能、禁呪の先取りなど）と、主人公がそれを引き寄せる際に接触した「天啓」のような言葉（p137）の由来が不明。
  quotes:
  - quote: '取り返しがつかないほどの負傷を一瞬にして治癒してしまう、神の御業としか思えぬ絶技。

      ...

      太陽が沈み、世界が闇に染め上げられた。

      その瞬間。天啓のようにその言葉は降りてきた。'
    paragraph: p115-p137
    quote_verified: false
  expected_payoff: この「天啓」の言葉が、世界の根幹に関わる禁呪や神々の介入を示唆しており、今後の世界観設定（メタフィクションの核心）に関連する重要な手がかりとなる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
