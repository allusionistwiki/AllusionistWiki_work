  - quote: 極小の小鬼ほど手がつけられない。優秀に、万能に、全知に近づいていく巨人ならばまだ倒す目がある。強靭に、先鋭化し、無知になろうと自分の世界に閉じ籠もる小鬼は無敵だ。
    paragraph: p225-p227
    quote_verified: true
  expected_payoff: このハイブリッドな存在が今後の物語の脅威となるか、グレンデルヒやシナモリアキラたちの能力定義（『杖』vs『使い魔』）に重大な影響を与える。
