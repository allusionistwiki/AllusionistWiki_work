    action:
      observations:
      - event_ref: E_ch5125_世界槍_functions_as_呪力供給源_p23
        quote: 鋭利な穂先と複雑に枝分かれした区画が効率的に陽光を吸収し、膨大な呪力を蓄えて都市に供給している。
        locator: {}
        spoiler_after: ch5126
    speech:
      observations:
      - event_ref: E_ch5125_世界槍_defines_迷宮構造_p26
        quote: 世界槍――九層からなる迷宮を内包する槍の形をした小世界群。地獄からこの地上までを貫く天廊にして戦場。
        locator: {}
        spoiler_after: ch5126
  first_appearance_candidate: true
