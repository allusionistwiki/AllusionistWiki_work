- canonical_target: '[[E_char_少女]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5125_少女_other_少年_p78
        quote: 俯いてその場を立ち去ろうとした時、怒りに震える少年を横から叱りつけるものがあった。一つ二つしか違わないであろう、幼い少女だ。小さな手で少年の頭を叩くと、そのままぐいと頭を下げさせる。「ごめんなさい使徒様、うちの弟が失礼な事をしてしまって」
        locator: {}
        spoiler_after: ch5126
    speech:
      observations:
      - event_ref: E_ch5125_少女_asks_父の魂_p94
        quote: 「ねえ使徒様、この間の大きな戦いで、お父さんはお墓に入ることになってしまったんです。マロゾロンド様は、ちゃんとお父さんを天の御殿に連れて行ってくれますよね？　うちの弟にはちゃんと言い聞かせますから、だからどうか――」
        locator: {}
        spoiler_after: ch5126
  first_appearance_candidate: true
- canonical_target: '[[E_item_金鎖]]'
