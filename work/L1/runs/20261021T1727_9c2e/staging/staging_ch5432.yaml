        locator: {}
        spoiler_after: ch5432
      - event_ref: E_ch5432_アキラ_other_都市機能の知能_p30
        quote: 俺は知る。ドローンの昆虫じみた思考を体感する。俺は感じる。自動化された都市機能の閃きを受け取る。俺は思う。第五階層のあらゆる電子機器の反応を受け、その結果としてシナモリアキラという機能が働いていく作用を理解する。
        locator: {}
        spoiler_after: ch5432
      - event_ref: E_ch5432_アキラ_other_小規模な公園_p41
