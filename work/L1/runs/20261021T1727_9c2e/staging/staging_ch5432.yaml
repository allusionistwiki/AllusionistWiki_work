        locator: {}
        spoiler_after: ch5432
      - event_ref: E_ch5432_アキラ_other_カーティス＝リールエルバ_p79
        quote: コルセスカとトリシューラのライブは現実世界に染み出して、リールエルバもまた夢から現実に混ざり、『チョコレートリリー空組』の観客となっていたカーティス＝リールエルバと一体になる。
        locator: {}
        spoiler_after: ch5432
      - event_ref: E_ch5432_アキラ_transforms_呪術医院跡地_p83
