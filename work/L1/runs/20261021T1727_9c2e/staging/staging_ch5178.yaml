          どうやら彼女は目ではなく耳で遠くの微かな音を拾っているらしい。'
        locator: {}
        spoiler_after: ch5178
    speech:
      observations:
      - event_ref: E_ch5178_サリア_reveals_コルセスカとの戦闘_p185
        quote: 「負けた。それはもう命からがら逃げてきた。三人で全力の凍結食らわせて時間稼ぎしてる間に空間に裂け目作って追放するので精一杯だった」
        locator: {}
        spoiler_after: ch5178
      - event_ref: E_ch5178_サリア_promises_陽動_p244
        quote: 「【死の囀り】の動きは不規則で、万が一ということもある。基本的に地上で歌ってるだけだとは思うけど、もし聞こえてきたら消音結界をお願い。私が陽動して遠ざけるから」
        locator: {}
        spoiler_after: ch5178
    action:
      observations:
      - event_ref: E_ch5178_サリア_fights_敵_p394
        quote: 'それからというもの、サリアは獅子奮迅の活躍を見せた。

          前後から接近する敵を誰よりも早く感知し、前方の敵を先行して仕留める。'
        locator: {}
        spoiler_after: ch5178
  first_appearance_candidate: true
