    speech:
      observations:
      - event_ref: E_ch5178_ペイル_asks_挨拶_p341
        quote: '「あ、挨拶って、お姉様に挨拶して何する気なの」

          「へ？　何って、色々ハルにお世話になってますとか、そういう事だけど」

          「だ、駄目。まだそんなの早い」'
        locator: {}
        spoiler_after: ch5178
      - event_ref: E_ch5178_ペイル_threatens_ミルーニャ_p61
        quote: 「つまりさー俺が担当してた腕の付け根あたりのお陰であの石像がぶっ壊れたわけ。まあお前もいい勉強になったんじゃね？　世界は広いし上には上がいるってことなわけよ。そう落ち込むことないさ、生きてればいいことあるって、な？」
        locator: {}
        spoiler_after: ch5178
    action:
      observations:
      - event_ref: E_ch5178_ペイル_fights_アキラとリーナ_p90
        quote: 私の槌矛が奴の顔面にめり込み、リーナの【空圧】が空高く巨体を舞い上げた。
        locator: {}
        spoiler_after: ch5178
