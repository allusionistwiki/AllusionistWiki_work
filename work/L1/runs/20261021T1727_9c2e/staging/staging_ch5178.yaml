- canonical_target: '[[E_char_サリア]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5178_サリア_appears_先導者_p110
        quote: 今回の護送において先導者となる探索者サリアだった。軽装で、腰の革袋と二振りの短剣以外にはさしたる装備も身につけていない。
        locator: {}
        spoiler_after: ch5178
      - event_ref: E_ch5178_サリア_has_property_超人的な聴力_p401
