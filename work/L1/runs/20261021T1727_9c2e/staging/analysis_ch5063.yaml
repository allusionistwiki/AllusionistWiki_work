  note: カード型端末、ライブラリ、サポート窓口、メールマガジン、デジタルコンテンツ購入など、現代のIT社会の構造が第五階層という異世界空間にそのまま移植されており、技術的・制度的な連続性が主題となっている。
  proposed_by:
    kind: agent
