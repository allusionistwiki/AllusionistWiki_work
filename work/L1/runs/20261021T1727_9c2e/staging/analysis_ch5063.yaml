- kind: mystery
  name: MY_ちびシューラの複雑な感情の理由
  note: ちびシューラがSpearの歌を聴くレオやアキラに対して「立場上複雑」と述べる。彼女が何者であるか、あるいはSpearとどのような関係があるのかを示唆する伏線。
  quotes:
  - quote: （別に【Spear】の歌がどうこうっていうわけじゃなくて、立場上、ちょっと複雑っていうか）
    paragraph: p129
    quote_verified: true
  expected_payoff: ちびシューラの正体（神性、異界との関係、Spear本人またはその派生など）が明かされる際、この「立場」の定義が語られ、彼女の行動原理や過去が判明する。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_ロドウィの突然出現と日本語使用
  note: 第五階層の雑踏の中で【公社】の首領ロドウィが現れ、流暢な日本語で挨拶する。彼の意図（敵対か交渉か）および日本語を話す理由（異世界接触の影響、彼自身の出自など）が未解決。
  quotes:
  - quote: '「やあ、久しいな、壮健そうでなによりだ」

      流暢な日本語で話す、恰幅のいい壮年の男。【公社】の首領ロドウィがそこに立っていた。'
    paragraph: p172
    quote_verified: true
  expected_payoff: ロドウィとの対話が始まり、彼がなぜ第五階層に現れたのか、日本語を話す背景（異世界からの影響）、およびアキラたちに対する次のアクション（取引、脅迫、同盟）が明らかになる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_レオの猫耳の起源とヲルヲーラの権限外
  note: レオの頭頂部の耳が機能しない「痕跡器官」である可能性と、審判ヲルヲーラが第五階層（地獄由来のレオ）を監視できないという事実。レオの素性がこの世界では追跡不能であることを示す。
  quotes:
  - quote: 頭の横の耳でしか聞こえません。何なんでしょうね、この上の耳
    paragraph: p148
    quote_verified: true
  - quote: 第五階層を除いた第二階層から第八階層までの六階層だけなんだ。...だから、多分地獄からやって来たレオのことは知らないと思うよ
    paragraph: p159
    quote_verified: false
  expected_payoff: レオが「地獄」由来であるという設定が深掘りされ、彼の猫耳の真の機能（魔力感知など）や、審判権限外の存在としての特異性が戦闘力や物語上の役割で回収される。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_店員さんの高速移動の謎
  note: 店を後にした直後の屋台に店員が息切れもせず出現する。物理的な移動距離と時間を考慮すると、呪術的移動能力を持つ可能性を示唆している。
  quotes:
  - quote: 全力疾走して俺たちの先に回り込んだので無ければ、何らかの呪術的な力で高速移動したのかもしれない。
    paragraph: p54
    quote_verified: true
  expected_payoff: 店員さんが単なるアルバイトではなく、探索者として高い実力（特に移動・索敵系）を持つ人物であることが判明し、今後の探索や戦闘で協力者となる伏線。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_Spearの音楽の受容の多様性
  note: Spearの音楽が聴く人によって「エスニック」「無国籍」「軽薄」「重み」など全く異なる印象を与える。これは異世界接触後の文化混雑を象徴しており、特定の人物（ちびシューラなど）にとって特別な意味を持つ可能性を示唆する。
  quotes:
  - quote: 聴く人によって受ける印象が全く異なる点だ。
    paragraph: p103
    quote_verified: true
  expected_payoff: Spearの音楽が、単なる娯楽ではなく、異世界の記憶やメッセージを埋め込んだ「媒体」であることが判明し、ちびシューラの「複雑な感情」の正体（音楽に含まれる彼女に関連する要素）に繋がる。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 現代消費社会のシミュレーションと異世界経済への適用
  weight: 0.9
