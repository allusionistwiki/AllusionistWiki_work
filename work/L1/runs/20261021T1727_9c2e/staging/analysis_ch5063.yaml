- kind: theme
  theme: 労働環境における搾取と生存戦略
  weight: 0.7
  quotes:
  - quote: 探索者としての能力以外を求められてくる方がそれなりの数いらっしゃるので、結局一人で探索に行っていますね
    paragraph: p60
    quote_verified: true
  - quote: 探索者一本では中々やっていけないものでして。最近は治癒符の価値も上がってきていますし、探索も中々はかどりませんね
    paragraph: p56
    quote_verified: true
  note: 店員さんの発言から、第五階層での生活が経済的に苦しく、特に女性職業者がセクシュアル・ハラスメントのリスクに晒されている現実が描かれ、異世界転生ものの「快適な冒険」を裏返す社会批判的側面を持つ。
