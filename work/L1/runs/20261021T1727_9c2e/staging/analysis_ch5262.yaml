  theme: メタフィクション的構造における自己の客体化
  weight: 0.6
  quotes:
  - quote: 'ちなみにこの世界にドーランという言葉は無く、完全に私たちの趣味でしかない。異世界語の参照という、ね。

      というわけで、賢明なる読者、観客の皆々様方におかれましてはそこの所をご了承いただきたい'
    paragraph: p244
    quote_verified: false
  - quote: 'よくもまあ、長いこと耐えてくれているものだと思う。俺ならとっくに投げ出しているに違いない。

      二人の魔女はやはり超人の類だと確信した。'
    paragraph: p285
    quote_verified: true
