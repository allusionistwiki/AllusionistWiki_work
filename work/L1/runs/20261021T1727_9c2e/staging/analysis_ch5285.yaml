- kind: mystery
  name: MY_clay_name_change_mechanism
  note: クレイの名前が「スマダルツォン」から「ガレニス・クロウサー」などへ変化する仕組みとその意味。呪術儀式の結果とされるが、これが単なる隠語なのか、アイデンティティの書き換えなのか不明確。
  quotes:
  - quote: それが、この呪術儀式の結果ということだ。次はさしずめクレイ・ガレニス・クロウサーにでもなるのだろうさ
    paragraph: p197
    quote_verified: true
  expected_payoff: 名前の変遷が、彼の所属勢力の移り変わりや、「役（キャラクター）」としてのアイデンティティの流動性を象徴する伏線として回収される可能性。
