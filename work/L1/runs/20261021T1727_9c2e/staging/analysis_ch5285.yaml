    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_raclurall_thread_control
  note: ラクルラールの糸が「役者」を狙ったとクレイが分析し、レオたちが支配下にあるように見せかけられている（ダミー接続）状態の維持。この欺瞞がいつ暴かれるか、または制御を逸脱するタイミング。
  quotes:
  - quote: 触手のように伸びてきていた糸が断ち切られ、同時にちびシューラが呪文を構築して切断された糸に接続する。敵の糸をクラッキングすることで、『俺たちが糸によって支配されている』と相手に思い込ませるための措置だ。
    paragraph: p239
    quote_verified: true
  - quote: 成功するかどうかはちびシューラによると五分五分だったが、どうやら賭けには勝ったらしい。
    paragraph: p242
    quote_verified: true
  expected_payoff: ダミー接続の破綻による敵側への露見、またはレオが糸を操作する真意（支配されているふりをすることで自由を得ている）の発覚。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_leo_kain_relationship_history
  note: 主人公が共有できない、レオとカーインが積み上げた数ヶ月間の時間。この関係性の背景にある「共同戦線」や「過去の出来事」。
  quotes:
  - quote: ここ数ヶ月間に二人が積み上げた時間は、俺には共有できないものだ。
    paragraph: p229
    quote_verified: true
  expected_payoff: レオがカーインを支配（または保護）するに至った経緯のフラッシュバック、あるいはカーインが「役者」として選ばれる必然性。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: mystery
  name: MY_grundelher_current_status
  note: グレンデルヒがラクルラールに支配されていたとされるが、その支配が「役者」を狙ったものだとされ、現在どちらの主導権があるか不明。彼の真の意図（自発的な反逆か、操られた結果か）。
  quotes:
  - quote: グレンデルヒとラクルラール、どちらと戦ってもいいように心構えをしておけ
