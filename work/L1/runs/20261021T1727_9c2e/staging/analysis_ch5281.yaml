- kind: theme
  theme: 物語（ナラティブ）は解釈の衝突によって生成され、支配される。
  weight: 0.9
  quotes:
  - quote: '呪文使いたちの解釈はそれぞれバラバラだったが、差異はかえって共通点を浮き彫りにしていった。

      異なる認識がぶつかり合い、互いに消滅した後に残ったもの。

      そこには、より強固な輪郭を有したオルヴァが立っていた。'
    paragraph: p197
    quote_verified: true
  - quote: レオ解釈のオルヴァは極めて慎重かつ大胆な人事を行い、良い統治者として振る舞ったが、グレンデルヒ解釈のオルヴァは権力を濫用し、地位という利権を売買するという腐敗を招きカシュラムを衰退させた。
    paragraph: p194
    quote_verified: true
  note: この章では戦闘が物理的衝突ではなく、異なる「台本（解釈）」のぶつかり合いとして描かれ、勝者が物語を書き換える権力者となるメタフィクション的な構造を主題としている。
  proposed_by:
    kind: agent
    id: swift-1.5-iq3_xxs
  review_status: unreviewed
- kind: theme
  theme: 理解不能な他者との共生は、言語による定義の限界と恐怖の受容を伴う。
