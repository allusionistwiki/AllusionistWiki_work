  quotes:
  - quote: 'その『神のようなもの』をカシュラム人はカシュラム人以外に説明することができない。

      説明して理解されたとき、その相手は既にカシュラム人であるから、カシュラム人以外がそれを理解することは定義上不可能なのだ。'
    paragraph: p238
