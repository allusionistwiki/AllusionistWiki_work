entities:
- canonical_target: '[[E_char_ルウテト]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5451_ルウテト_other_北風と凍てつく山_p102
        quote: '「第八の責め苦、北風と凍てつく山」

          吹きつける極寒の大気は、俺たちに『参った』と言わせるための幻だ。'
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_ルウテト_other_火炎を吐く井戸_p107
        quote: '「第九の責め苦、火炎を吐く井戸」

          コルセスカは想像を絶する痛みによって意識を何度も途絶させている。'
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_ルウテト_other_ステュクス_p118
        quote: '「第十の責め苦、冥府の川と試練の橋」

          『女王』の浄界、ステュクス。

          悠久の大河には舞台の大橋が架かり、その上に俺たちは立たされている。'
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_ルウテト_other_致命傷_p131
        quote: '即死級の攻撃を受けたルウテトは肉体の再生をしようともせず、両断され、血と肉と骨と内臓をぶら下げたまま平然とそこに立ち続けている。

          幾度アルマの斬撃が物理的実体を破壊し、サリアの矢があらゆる可能性を撃ち抜いて妨害しようとも、死ぬことが無い女神を殺せるはずもない。'
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_ルウテト_other_宣戦布告_p2
        quote: 宣戦布告と同時、舞台の上手と下手から同時に新たな役者が飛び込んできた。
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_ルウテト_uses_第九世界槍_p229
        quote: '「第九世界槍、展開」

          女神はこの世界を握りしめ、意のままに振り回す。'
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_ルウテト_defeats_アキラたち_p231
        quote: 'それで終わり。

          俺たちは全滅した。

          まず結果が確定し、事後的に過程と原因が生成されていく。'
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_ルウテト_other_事象_p238
        quote: '途中で過程と結果が書き換えられた。

          氷槍が振るわれたことで、いつの間にか俺はゼドに敗北して倒れ伏したことになっている。異様なことに、奴と正面から壮絶な戦いを演じたという記憶が確かにある。事象の改竄、時空の操作、そういった超越的な呪術が行使されたのだ。'
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_ルウテト_attacks_クレイ_p289
        quote: '「一番つまらない答えですね。このタイプのクレイが一番ありふれている」

          あまりにも無造作に、槍の穂先がクレイの胸を貫いた。

          存在の終焉という結果が最初に確定し、事後的な滅びがクレイを終わらせる。'
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_ルウテト_other_ミヒトネッセの残骸_p304
        quote: 彼女は氷槍でそれを貫くと、わざわざクレイの前に運んで致命傷を与えていく。何も出来ないクレイに見せつけるように、最大限の悪意を込めて。力尽きた人形の首を断ち、胸を抉り、腹部を開く。クレイの口が侍女人形の名を呼ぼうとする寸前、ルウテトは消滅寸前の我が子と人形の骸を槍で薙ぎ払い、川底に叩き落とす。
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_ルウテト_other_セレスティアル・オーブ_p51
        quote: '「見るがいい、これこそ周回軌道の地獄、森羅万象あまねく煌めきを統べる女王のセレスティアル・オーブ、『責め苦の全天』！」

          世界が支配者の望むままに作り替えられていく。'
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_ルウテト_other_火炎の柱_p62
        quote: '「第一の責め苦、火炎の柱」

          舞台を横切るようにして大地を焼き尽くす光が迫る。'
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_ルウテト_other_俯せ釘付けの獄_p67
        quote: '「第二の責め苦、俯せ釘付けの獄」

          天上から無数の釘が降り注ぐ。'
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_ルウテト_other_仰向け釘付けの獄_p71
        quote: '「第三の責め苦、仰向け釘付けの獄」

          理解不能な力に操られて俺たちは自分から舞台に倒れ込む。

          降り注ぐ釘が次々と俺たちの胴体に打ち込まれていく。'
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_ルウテト_other_全身釘打ちの獄_p80
        quote: '「第四の責め苦、全身釘打ちの獄」

          更には、舞台の天井のみならず床下、観客席、舞台袖など四方八方から釘が飛来して俺たちの肉体の全てを貫通していく。完全な致命傷にも思える攻撃も、『責め苦』を目的とする呪いであるためかただ苦しみだけが蓄積され続ける。'
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_ルウテト_other_拷問万般の獄_p84
        quote: '「第五の責め苦、拷問万般の獄」

          爪、皮膚、眼球、舌、鋭敏な感覚を責め立てるありとあらゆる拷問器具が『創造』されては苦痛の宇宙で踊り出す。'
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_ルウテト_other_炎の車輪_p88
        quote: '「第六の責め苦、炎の車輪」

          燃える鉄の車輪に貼り付けにされてぐるぐると転がされる。'
        locator: {}
        spoiler_after: ch5451
    symbolic:
      observations:
      - event_ref: E_ch5451_ルウテト_defines_ゲームとしての世界_p12
        quote: '女神にとっては全てがゲーム。

          俺たち矮小なユニットが持つひとつひとつのパラメータもゲームの進行と共に取捨選択を重ねていくべきものでしかない。'
        locator: {}
        spoiler_after: ch5451
    speech:
      observations:
      - event_ref: E_ch5451_ルウテト_other_宝珠の摂取_p208
        quote: '「なるほど、最初からそれが狙いでしたか――浅はかな」

          ルウテトの冷ややかな声には、明確な苛立ちがあった。

          つまりはこの手は正解――女神にとって不快な行動だったのだ。'
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_ルウテト_says_ゲームオーバーの宣告_p244
        quote: 「アキラ様、あなたはゲームオーバーです。でも大丈夫、また悪夢を見ればいいのですよ。あなたがこの世界にやってきたばかりの時みたいにね」
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_ルウテト_says_遊戯の誘い_p7
        quote: 「さあ、俺と遊んでくれ、シナモリアキラ」
        locator: {}
        spoiler_after: ch5451
  first_appearance_candidate: true
- canonical_target: '[[E_relation_コルセスカ]]'
  entity_type: relationship
  aspects:
    action:
      observations:
      - event_ref: E_ch5451_コルセスカ_other_アキラの痛みの代行_p111
        quote: 俺の痛みを全て引き受けているのも、この地獄が終わった瞬間に自分以外が即座に動けるようにするためだ。
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_コルセスカ_attacks_ルウテト_p3
        quote: 一人はコルセスカ、硝子窓を割るように空間を突き破って豪快に登場した冬の魔女が俺の横に並んでルウテトに氷の槍を突きつける。
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_コルセスカ_attacks_ルウテト_p41
        quote: 同時に走り出していたコルセスカが撃ち出した氷柱と併走しながらルウテトに迫る。
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_コルセスカ_other_アキラの激痛_p78
        quote: 首から伸びる呪力の経路を伝って、二人分の激痛がコルセスカを襲った。
        locator: {}
        spoiler_after: ch5451
    speech:
      observations:
      - event_ref: E_ch5451_コルセスカ_says_クレイとミヒトネッセの死_p21
        quote: 「二人は死にました。ミヒトネッセは全てを諦めて自らを縛る操り糸で首を括り、クレイはその後を追うようにして自刃を――」
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_コルセスカ_says_勝利の断言_p30
        quote: '「勝てます」

          力強い断言は、紛れもない英雄コルセスカのもの。'
        locator: {}
        spoiler_after: ch5451
  first_appearance_candidate: true
- canonical_target: '[[E_char_アルマ・アーニスタ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5451_アルマ・アーニスタ_attacks_ルウテト_p127
        quote: '瞬間、ルウテトの死角となった背後から氷の盾と燃えさかる斧を手にした重装甲の戦士が唐突に出現する。

          その光景が巻き戻り軌道を変えた斧が今度こそルウテトの背中を両断し、肉と骨を焼きながら女神を斜めに二分してみせた。'
        locator: {}
        spoiler_after: ch5451
  first_appearance_candidate: true
- canonical_target: '[[E_char_サリア]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5451_サリア_attacks_ルウテトの未来_p128
        quote: 舞台を上から照らす照明、それが吊られているバトンの上に氷の弓を持った射手がいる。冬の魔女第一の使い魔であるサリアはその背後に半透明のハエのビジョンを浮かび上がらせながらルウテトの『成功する未来』を撃ち抜いている。
        locator: {}
        spoiler_after: ch5451
  first_appearance_candidate: true
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5451_アキラ_activates_義肢_p136
        quote: 'だからこそ、ルウテトの『紀』に干渉して神としての性質を揺らがせる必要があった。かつて俺が有効打を与えられた唯一の義肢、キュトスの長姉ヘリステラの転生力であれば、あるいはルウテトの世界観と衝突を起こせるかもしれない。

          左腕に義肢を具現化した俺は『マレブランケ』たちにゼドを任せて疾走する。'
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_アキラ_flees_ゼド_p156
        quote: '冷たくなっていく思考でゼドへの戦意を全て切り捨てる。こいつは相手にしなくていい。

          素早く身を躱し、残った髪の毛の一部を手刀で切り捨てて身代わりにする。

          呪的逃走の術により創造された俺の分身がゼドを惑わせているうちに復帰した『マレブランケ』たちが参戦してくる。足止めを任せて俺はルウテトの下へ走った。'
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_アキラ_other_宝珠_p204
        quote: 俺は機能を果たすだけだ――血塗れの盗品が放つ呪力を義肢で押さえ込み、握り潰さんばかりの力で持ち上げるとそのまま口の中に放り込み、何度か咀嚼して嚥下する。
        locator: {}
        spoiler_after: ch5451
    speech:
      observations:
      - event_ref: E_ch5451_アキラ_asks_クレイたちの行方_p17
        quote: 「コルセスカ、クレイたちは？」
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_アキラ_observes_味方の不在_p25
        quote: '脳内でちびシューラとは繋がっているものの、コズエ役のトリシューラ本体は行方不明。現世に送り返されたメートリアンやイツノたちの姿も見えないまま。

          つまりいま戦えるのは俺とコルセスカだけだ。'
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_アキラ_asks_勝算_p28
        quote: 「やれるか？」
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_アキラ_other_諦観_p382
        quote: '沈んでいく暗い水底に、ミヒトネッセが運んでくれたものが確かな形をもって存在しているのを感じる。

          「――これはレッテの諦めだけど。そっか、私はこれを持って行けるのね」

          ひとみはかがみ。

          映るのは自分、小さな人形。

          反射する心の形を両手に感じながら、私は運命に身を委ね、全てを諦めた。'
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_アキラ_observes_敵の構成_p5
        quote: 奇しくもかつてルウテトと交戦したメンバーが揃っている。ゼドがルウテト側についている点が決定的に異なるが、思えばあの時点で奴はルウテトと密約を交わしていた可能性が高い。
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_アキラ_observes_ルウテトの限界_p97
        quote: '死と地獄を支配し、その全てを思うがままにできるとは言っても、ルウテトは生きている者たちの想像した死と地獄しかその瞳に映すことしかできない。

          『無』を見ることなどできないからだ。'
        locator: {}
        spoiler_after: ch5451
  first_appearance_candidate: true
- canonical_target: '[[E_char_ゼド]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch5451_ゼド_uses_トバルカインの装甲_p143
        quote: '重々しい足音と犬の唸り声のような駆動音。

          骨を加工した呪動装甲がゼドの肉体を隈無く覆い尽くしている。

          あれは盗賊王が俺から盗み出した骨犬の力。奪われたトバルカイン――俺が背負うべき罪の象徴を纏って、ゼドはこちらに突進してくる。'
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_ゼド_other_アキラ_p9
        quote: ルウテトの死神となったゼドは、欲望にぎらついた目で俺を舐め回すように見た。盗賊としての性なのか、奴は俺と習合して同一の存在になろうとしている。
        locator: {}
        spoiler_after: ch5451
    speech:
      observations:
      - event_ref: E_ch5451_ゼド_says_赦しの鎧_p147
        quote: '「どうだアキラ、似合うだろう？　これが俺とお前の『赦しの鎧』となる」

          『俺と遊ぼう』という言葉の通り、こいつは俺と殴り合いを楽しむつもりなのだろう。'
        locator: {}
        spoiler_after: ch5451
    action:
      observations:
      - event_ref: E_ch5451_ゼド_attacks_アキラ_p35
        quote: 'やがて、一瞬の静寂を銃声が引き裂く。

          ゼドが撃ち出した弾丸、それを俺が認識するより速く『髪の毛』が迎撃していたのだ。'
        locator: {}
        spoiler_after: ch5451
    relationship:
      observations:
      - event_ref: E_ch5451_ゼド_bonds_ルウテト_p4
        quote: テンガロンハットに薄汚れたコート、腰のガンベルトから巨大な拳銃を抜いて構えたガンマンは、今やルウテトの使い魔だった。
        locator: {}
        spoiler_after: ch5451
  first_appearance_candidate: true
- canonical_target: '[[E_char_クレイ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5451_クレイ_says_忠義の宣言_p167
        quote: 「陛下、偉大なる我らが再生者の女王よ。貴方が不要と命じたならば俺は骸となって眠るつもりでした。ですが陛下の真意が俺の奮起にあるならば、貴方の意を汲んで造反の刃を御身に向けましょう。それこそが真の忠義であると信じて」
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_クレイ_says_安心の言葉_p296
        quote: '「良かった――俺は何度生まれても、こうして貴方に剣を捧げられるのですね」

          大量生産された泥人形、使い捨てられるクレイの最もありふれた個性。

          そんな彼の核は常に同じなのだと知って、彼は安心したのだ。'
        locator: {}
        spoiler_after: ch5451
  first_appearance_candidate: true
- canonical_target: '[[E_char_ミヒトネッセ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5451_ミヒトネッセ_takes_宝珠_p174
        quote: ミヒトネッセもその手に血塗れの物体を握りしめており、恐らく『あれ』を盗み出すことに成功しているはずだ。
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_ミヒトネッセ_other_イヴァダスト_p189
        quote: '「運命軌道（サテライトオーブ）・『イヴァダスト』」

          侍女人形の指先から展開された呪文の帯が渦巻いて球形となり、情報構造体の衛星として周回し始める。膨大な量の情報を処理しながらミヒトネッセは雨霰と降り注ぐ呪いの数々を次々に回避してみせた。'
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_ミヒトネッセ_gives_宝珠_p193
        quote: '未来予測でもしているのか、ミヒトネッセは妨害をものともせずに俺、というよりアマランサスの下に走り寄って手にしたものを受け渡した。

          ぞっとするほどに重い。

          冷たく、熱く、血の臭いよりも濃密な呪いの重力に飲み込まれてしまいそうだ。'
        locator: {}
        spoiler_after: ch5451
    speech:
      observations:
      - event_ref: E_ch5451_ミヒトネッセ_says_時間稼ぎの依頼_p178
        quote: 「どう転ぶにしても、第六階層で次の準備をしているアルト・イヴニルのために時間稼ぎが出来ればそれでいい。アマランサス、あんたが今後シナモリアキラに肩入れしたとしても、この目的だけは共有できるって信じるから」
        locator: {}
        spoiler_after: ch5451
      - event_ref: E_ch5451_ミヒトネッセ_says_最後の言葉_p200
        quote: '「後、おねがいね。言っておくけど、そこのクズ野郎に塗りつぶされたら許さないから。あんたは、レッテの大事な、もう一つ――」

          力尽きたのか、そう言い残してミヒトネッセは倒れ伏した。'
        locator: {}
        spoiler_after: ch5451
  first_appearance_candidate: true
- canonical_target: '[[E_char_シナモリアキラ内的声]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5451_シナモリアキラ内的声_other_アキラ_p338
        quote: '「お前は筋がいい、アマランサス。サイバーカラテの極意は諦観から始まる」

          ふと、閉ざした瞼の闇に声が響いた。

          嫌いな声、聞きたくない声、この世で最も頭にくる男の声だ。'
        locator: {}
