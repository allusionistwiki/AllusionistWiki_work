  entity_type: terminology
  aspects:
    name:
      observations:
      - event_ref: E_ch5013_ノーペイン_activates_介錯支援アプリ_p162
        quote: ――介錯支援アプリ『ノーペイン』を起動。
        locator: {}
        spoiler_after: ch5013
    symbolic:
      observations:
      - event_ref: E_ch5013_ノーペイン_has_property_情動管理_p167
        quote: 精神的な痛みを消してくれる思想・情動管理型のアプリで、自責や罪悪感といった感情を抑制してくれる。
        locator: {}
        spoiler_after: ch5013
    speech:
      observations:
      - event_ref: E_ch5013_ノーペイン_defines_正当性保証_p169
        quote: '自分の行為の正当性を保証し、思考を安心へと誘導する。

          『貴方は、正しいおこないをしているのです』'
        locator: {}
        spoiler_after: ch5013
  first_appearance_candidate: true
- canonical_target: '[[E_char_エスフェイル]]'
  entity_type: character
  aspects:
    name:
      observations:
      - event_ref: E_ch5013_エスフェイル_names_闇の脚_p18
        quote: エスフェイルは、自分の名前を『闇の脚』という意味だと言っていた。
        locator: {}
        spoiler_after: ch5013
    visual:
      observations:
      - event_ref: E_ch5013_エスフェイル_disappears_闇色の脚_p2
        quote: 木の下敷きになったエスフェイルの体から、あの闇色の脚だけが消失している。
        locator: {}
        spoiler_after: ch5013
    symbolic:
      observations:
      - event_ref: E_ch5013_エスフェイル_has_property_反撃特性_p22
        quote: つまり不用意にあの狼の体に致命傷を与えようとすると、脚だけがその場から逃げ去って、それを与えた相手は自分が致命傷を受けてしまうのだ。
        locator: {}
        spoiler_after: ch5013
  first_appearance_candidate: true
