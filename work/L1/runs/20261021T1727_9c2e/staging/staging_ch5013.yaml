episode: ch5013
created: '2026-10-21'
status: pending_merge
entities:
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5013_アキラ_thinks_圧死の不可逆性_p116
        quote: '今この瞬間に木をどかしても無駄だ。圧死するとは肉体を面で破壊されるということだ。

          治癒のシールでは回復が追いつかないだろう。'
        locator: {}
        spoiler_after: ch5013
      - event_ref: E_ch5013_アキラ_thinks_介錯の決断_p122
        quote: '生きたまま怪物に作り替えられる恐怖とはどれほどのものだろうか。

          人間のまま死なせて――殺してやるのが情けではないのか。'
        locator: {}
        spoiler_after: ch5013
      - event_ref: E_ch5013_アキラ_other_神への祈り論争_p146
        quote: '『神に祈りたくなる気分ってのは、こういう時になるものなんだねえ』

          あのひとの声が、頭の奥で響いた。

          尊敬する人。自らの力であらゆる困難を切り開いていける人。だからそんなことを言って欲しくなくて、あの時の俺はなんて言ったんだっけ？'
        locator: {}
        spoiler_after: ch5013
      - event_ref: E_ch5013_アキラ_thinks_感謝の歪み_p208
        quote: 'それは果たして『殺し』と呼べるのか。

          望まれてある殺人などでは無く、不条理で無造作な死。殺される相手は俺を憎み、絶命の瞬間には苦しむ。'
        locator: {}
        spoiler_after: ch5013
      - event_ref: E_ch5013_アキラ_says_人殺しであること_p248
        quote: 「そうじゃない、いいか、俺はこの世界だけじゃない、元の世界でも、生前にも人を殺しているんだよ！　俺は人殺しだ、この世界に来ても何も変わってない！　死んでも馬鹿は治らなかったよ！」
        locator: {}
        spoiler_after: ch5013
      - event_ref: E_ch5013_アキラ_thinks_道具不足_p56
        quote: 倒木は俺の全体重をもってしても動かすことはできそうにない。梃子の要領で木を持ち上げるとして、そのための道具が無い。
        locator: {}
        spoiler_after: ch5013
      - event_ref: E_ch5013_アキラ_thinks_カインの犠牲_p6
        quote: エスフェイルは「まずは一人」と言った。だからきっと誰かが犠牲になったのだ。それはわかる。そしてそれはきっとカインだったのだろう。それも、わかる。わかるとしか言えない。
        locator: {}
        spoiler_after: ch5013
    action:
      observations:
      - event_ref: E_ch5013_アキラ_kills_カイン_p188
        quote: ためらいは無い。『ノーペイン』は完璧だ。俺は右腕を振り下ろした。
        locator: {}
        spoiler_after: ch5013
      - event_ref: E_ch5013_アキラ_stops_ノーペイン_p238
        quote: '心を満たす充実感の裏側で、『鎧の腕』という言葉が俺を震えさせる。

          俺は。

          『ノーペイン』を、停止させた。'
        locator: {}
        spoiler_after: ch5013
  first_appearance_candidate: true
- canonical_target: '[[E_char_カイン]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5013_カイン_makes_罠_p12
        quote: 'そしてカインはきっと、遭遇した時の事を考えて、即席の罠を仕掛けていたのだ。

          おそらく何か特殊な道具や技術があったのだろう、それで木を倒せるようにしておき、エスフェイルをおびき寄せて、下敷きにすることに成功した。'
        locator: {}
        spoiler_after: ch5013
    speech:
      observations:
      - event_ref: E_ch5013_カイン_says_ありが_p191
        quote: '拳がカインの顔に迫る寸前、それは聞こえた。

          「ありが」

          骨と肉が潰れる音でかき消えたそれは、紛れもなく日本語の感謝の言葉だった。'
        locator: {}
        spoiler_after: ch5013
      - event_ref: E_ch5013_カイン_says_助けてくれ_p36
        quote: 'いいか、戦闘中に危なくなったら、俺たちに向かってこう叫べ。

          「助けてくれ」'
        locator: {}
        spoiler_after: ch5013
      - event_ref: E_ch5013_カイン_says_痛い死にたくない_p44
        quote: '「痛い」

          息が、ひどく苦しい。

          「死にたくない」'
        locator: {}
        spoiler_after: ch5013
      - event_ref: E_ch5013_カイン_asks_右手での除去_p48
        quote: '「アキラ、俺たちの『鎧の腕』。その右手で、これをとってくれ」

          右手を、硬く握りしめる。

          「頼む」'
        locator: {}
        spoiler_after: ch5013
      - event_ref: E_ch5013_カイン_says_味方だ_p63
        quote: '俺はその場を離れようとしたが、すがるような声に引き戻される。

          「行かないでくれ、待ってくれ、俺は味方だ」'
        locator: {}
        spoiler_after: ch5013
      - event_ref: E_ch5013_カイン_says_殺す喰う_p76
        quote: 「腹が減った。喰いたい。殺す。お前を喰う。キールを喰う。テールを喰う。トッドを、マフスを、アズーリアを、喰う」
        locator: {}
        spoiler_after: ch5013
      - event_ref: E_ch5013_カイン_confesses_殺してくれ_p84
        quote: 「殺してくれ。アキラ、俺を殺してくれ」
        locator: {}
        spoiler_after: ch5013
    visual:
      observations:
      - event_ref: E_ch5013_カイン_appears_as_狼の胴体_p3
        quote: 狼の胴体からは甲冑の手足や胴の各部位がバラバラの方向に飛び出していて、肩に近い部分にカインの顔が浮き出している。地面に兜が落ちているので、顔が分からない、ということも無かった。
        locator: {}
        spoiler_after: ch5013
      - event_ref: E_ch5013_カイン_disappears_人面_p92
        quote: そして、狼の体に浮かび上がっているカインの人面や手足が、徐々に内部に埋まって消えていこうとしている。
        locator: {}
        spoiler_after: ch5013
  first_appearance_candidate: true
