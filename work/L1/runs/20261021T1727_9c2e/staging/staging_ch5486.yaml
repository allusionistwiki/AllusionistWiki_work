episode: ch5486
created: '2026-10-21'
status: pending_merge
entities:
- canonical_target: '[[E_term_テッシトゥーラ]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch5486_テッシトゥーラ_other_第五階層の全人口処分_p101
        quote: 「やだな、物理的に黙らせるわけじゃないよ。喉が振動しなくても言語は文字や身体で使えるでしょ？ 魂を揺さぶって言語を奪うの。世界を切り分ける視座ごとね。多分、第五階層の全人口をまとめて処分することになっちゃうかな」
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_テッシトゥーラ_reveals_太陰との関係_p114
        quote: 「これは来訪者リーヴァリオンの決定であり、同時に太陰の決定でもある。異界が隣接する特異点となった第五階層での言震は致命的な事態を引き起こしかねないからね」
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_テッシトゥーラ_says_ディスケイムの射程_p12
        quote: 「うん。ディスケイムが射程に入ったみたいだから、そろそろ教えとこうかなって」
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_テッシトゥーラ_reveals_トライデントの細胞_p125
        quote: 「ハルベルトと同じく、槍神教との橋渡し役ってところかなー。おっと、わたしの立場は内密にね。ついでに明かすとわたしもトライデントの細胞だったりするんだよ。救世主が生まれたら仲良くやってこーね！」
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_テッシトゥーラ_defines_使い魔としての関係_p151
        quote: 「ありがとー。それじゃあ、あなたの使い魔になったテッシトゥーラをよろしくね！」
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_テッシトゥーラ_reveals_クナータの記憶操作_p20
        quote: 「大丈夫だよ。クナータの未来回想は本当は何も変化していない。表のクナータがあなたに教えてたやつはちょちょいっていじった記憶だからさ」
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_テッシトゥーラ_defines_リーヴァリオンの本体_p30
        quote: 「あれに本体なんて無いよ、クロウサーじゃあるまいし。新しき美の神ミエスリヴァや最強の妖精王ラータエルスが最も有力なリーヴァリオンで、帝国がその棲家ってだけ。
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_テッシトゥーラ_defines_麗蝶の翼翅_p30
        quote: わたしやクナータみたいな妖精王の資格者は来訪者リーヴァリオンと一体化し、その光を身の内に取り込めるの。そうやって生まれた端末個体は『麗蝶の翼翅』として世界各地に散らばってる」
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_テッシトゥーラ_reveals_リーヴァリオンの目的_p37
        quote: 「わたしたちリーヴァリオンの望みはふたつ。クロウサーとディスケイムの排除。祝祭の混乱を利用して他の来訪者たちを討ち、未来に安寧をもたらすことが目的」
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_テッシトゥーラ_defines_アヴロノ種族の上位存在_p40
        quote: 来訪者リーヴァリオン。聖女クナータの内側に潜むものと同じ、アヴロノ種族を支配する絶対的上位存在の御使いこそが彼女の正体。
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_テッシトゥーラ_reveals_リーナの呪縛_p42
        quote: 「あなたはディスケイムの支配から逃れたいはず。そして友達であるリーナをクロウサーの呪縛から解き放ちたいし、クナータをリーヴァリオンから解放したい」
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_テッシトゥーラ_other_三つ巴の戦略_p46
        quote: 「あれ確証なかった？ なら気づけて良かったね。そろそろ彼女の中から出てきて暴れ出すんじゃないかな。パーンを上手くぶつければ勝算はあると思うし、三つ巴なら一番強いクロウサーを最初に狙うのが定石。できればレースで潰したいね」
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_テッシトゥーラ_other_クナータの生存方法_p50
        quote: 「ま、それは置いといて。あなたにとって残念なことにリーヴァリオンにとってクナータの犠牲は必要なもの。そこであなたが納得出来る解決法を提示しにきた」
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_テッシトゥーラ_other_ティエポロスとしての分離_p58
        quote: 「クナータという存在は生贄に捧げられ、その魂は転生して救世主に至る。その未来を変えることはできない。でも呪文的に解釈を変えることはできる。あらかじめ用意しておいた人工妖精の素体に『ティエポロス』として定義した魔女の存在を分離して封じれば、意識を継続させたままあなたの友達は生存が可能ってわけ」
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_テッシトゥーラ_other_記憶と人格の変化_p62
        quote: 「そ。けど新しいティエポロスは異能を失って通常の時間認識を持った人格になるから、その記憶も人格も変わってしまうかもしれない。この条件を受け入れられるなら、わたしたちリーヴァリオンはあなたと手を組めると思う」
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_テッシトゥーラ_other_来訪者の殺害手段_p66
        quote: 「リーナ・ゾラ・クロウサーなら足止めでいい。血の中に潜む来訪者だけを殺す手段を私は持っている。これだけでも私に協力する気になったんじゃない？」
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_テッシトゥーラ_other_世界平和の維持_p73
        quote: 「安心してくれていいよ。わたしの立場はあなたたち『呪文の座』に近い。世界が平和で秩序が維持されている状態を望んでいる。調子に乗った言語テロリストたちは救世主の降臨を待たずに始末してあげる」
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_テッシトゥーラ_names_敵対勢力_p80
        quote: 「全体の調和を乱す身勝手さがわたしは嫌い。ルッキズムと選民思想に偏った民族主義者、信仰を盾に愚行を正当化する神の走狗、地方と中央の対立と分断を創作する扇動者。そして一度痛めつけられたくらいじゃ懲りない聖女のストーカー。未来回想の記述通りにあなたたちが事態を収拾できなくても、わたしがちゃんと軌道修正してあげるよ」
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_テッシトゥーラ_defines_言震への対策_p94
        quote: 「言震って本質的には人が引き起こすものでしょ？ わたしの音響兵器は太陰で作られた特別製だから、原因になってる人たちを全員まとめて黙らせることができる」
        locator: {}
        spoiler_after: ch5486
    relationship:
      observations:
      - event_ref: E_ch5486_テッシトゥーラ_names_太陰の工作員_p117
        quote: 守護の九槍にしてリーヴァリオンのしもべ。その正体が太陰の工作員？
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_テッシトゥーラ_defines_クナータの護衛_p8
        quote: 聖女派最強の修道騎士。クナータの本来の護衛である。
        locator: {}
        spoiler_after: ch5486
    action:
      observations:
      - event_ref: E_ch5486_テッシトゥーラ_takes_銀貨_p147
        quote: 「うんうん、物分かりが良くて結構。それじゃあ友情の証に銀貨を一枚、貰っていくね？」
        locator: {}
        spoiler_after: ch5486
    visual:
      observations:
      - event_ref: E_ch5486_テッシトゥーラ_appears_ユディーア_p2
        quote: '脈絡の無い声が明るく室内に響く。

          ユディーアの表情は変わらない。相手が出現したのは銅貨が囲んだ円の中心。'
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_テッシトゥーラ_makes_二叉の槍_p83
        quote: 'いつの間に出現していたのか、奇術のように修道女の片手には槍が握られていた。

          それは二叉の槍。音叉を巨大化させたような奇妙な武器だった。'
        locator: {}
        spoiler_after: ch5486
    name:
      observations:
      - event_ref: E_ch5486_テッシトゥーラ_names_テッシトゥーラ・ティータ_p7
        quote: 守護の九槍第五位『詠唱者』テッシトゥーラ・ティータ。
        locator: {}
        spoiler_after: ch5486
  first_appearance_candidate: true
- canonical_target: '[[E_char_ユディーア]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5486_ユディーア_other_おぞましさ_p105
        quote: 'そのぶんだけおぞましいとユディーアは感じた。

          最悪の事態が発生した場合、第五階層の住人を皆殺しにすると彼女は言ったのだ。'
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_ユディーア_other_テッシトゥーラの条件_p145
        quote: 「わかりました。第五階層の人たちを皆殺しになんてしたくないし、クナータとリーナを犠牲になんてしたくない。テッシトゥーラさんの言葉に従います」
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_ユディーア_other_敗北感と屈辱_p154
        quote: どうしようもない敗北だ。暴力をちらつかされて恫喝に屈し、ノゴルオゴルオには渡さずに済んだ硬貨をみすみす渡す事になってしまった。
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_ユディーア_thinks_中間の立場_p158
        quote: ディスケイムとリーヴァリオン。上位存在たちの間で、ユディーアはどっちつかずの態度を続けるしかない。破滅と隣り合わせの綱渡りは、ユディーアに利用価値が無いと判断された瞬間に終わるだろう。
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_ユディーア_defines_自分の戦い方_p170
        quote: 「あたしの戦いは、第五階層の運命とは別の物語だ」
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_ユディーア_other_アズーリアとの巡り合わせ_p172
        quote: だから無理に前に出なくてもいい。裏で密かに這いずり回って、最後の最後でアズーリアとトリアイナを巡り合わせることができればそれがきっと正解になる。
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_ユディーア_defines_氷血呪の本質_p190
        quote: 早い話が『自分の世界』をより強固に確信するだけで氷血呪の第一歩と言える。
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_ユディーア_other_解呪の条件_p196
        quote: '解呪のために必要なのは、より強い『自分の未来』を示す確信に他ならない。

          ならばユディーアは未来を取り戻す必要がある。'
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_ユディーア_other_ディスケイムの思惑_p199
        quote: '強引に点穴を突いたことで覚悟は決まった。ディスケイムの思惑に乗ってやろう。

          それが仕組まれた計画、定められたレールの上であっても。'
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_ユディーア_other_父殺しの過去_p203
        quote: '父が母に殺されたあの時からどれだけ経っただろう。

          ユディーアとして成長した少女は何も赦してなどいない。'
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_ユディーア_other_キノコ人の恨み_p208
        quote: '踏みつけられ続けたキノコ人たちがティリビナ人への恨みを忘れたか？

          答えは否だ。

          ノゴルオゴルオは強力な呪いで彼らの感情を形に変えた。'
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_ユディーア_other_沈黙と隠密行動_p229
        quote: '要はばれなきゃいいのだ。

          母の前ではしおらしく。師の前では従順に。脅しつけてくる乱暴な親戚のおじさんの前では逆らえない無力な小娘を演じよう。'
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_ユディーア_thinks_他者による代行_p236
        quote: 'ただ、『誰か』が代わりにそれをやってくれたなら。

          ユディーアの心には家族を殺された恨みや憎しみなんてこれっぽっちも湧き上がりはしないだろう。'
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_ユディーア_other_言葉による変換_p253
        quote: '呪文なんていらない。

          美しい言葉に変えてしまうことで、醜い感情に変えてしまうことで、世界は決定的に変質してしまう。優柔不断なユディーアはその歪みを恐れていた。'
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_ユディーア_other_沈黙_p260
        quote: 'いいや違う。これからもずっと、その続きは沈黙だけ。

          それだけが、ユディーアに向いている唯一のことだった。'
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_ユディーア_thinks_選択の難しさ_p70
        quote: 'どの来訪者が残っても救世主トリアイナが無事に生まれる事ができるとは思えない。

          この危険極まりない誘いをどのように凌ぐべきか、ユディーアは必死に考え続けた。'
        locator: {}
        spoiler_after: ch5486
    visual:
      observations:
      - event_ref: E_ch5486_ユディーア_observes_テッシトゥーラの既視感_p14
        quote: '緩い口調で語るテッシトゥーラの表情に奇妙な既視感を覚える。

          誰かに似ているようで、それほどでもないような感じ。'
        locator: {}
        spoiler_after: ch5486
      - event_ref: E_ch5486_ユディーア_other_ハルベルトとの類似性_p33
        quote: '不意に、その気怠げな口調で気付いたことがあった。

          既視感の正体はハルベルトだ。'
        locator: {}
        spoiler_after: ch5486
  first_appearance_candidate: true
