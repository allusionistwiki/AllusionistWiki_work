- canonical_target: '[[E_char_レオ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5065_レオ_other_アキラの袖口_p136
        quote: 何も言えない俺に、レオはただ静かに目を伏せて、そっと掴んだ袖口を離す。
        locator: {}
        spoiler_after: ch5065
      - event_ref: E_ch5065_レオ_observes_修道騎士たちの行動_p153
        quote: 澄んだ瞳で、じっと修道騎士たちの行動を見つめる。
        locator: {}
        spoiler_after: ch5065
      - event_ref: E_ch5065_レオ_other_p180
        quote: だが、レオは静かに首を振った。
        locator: {}
        spoiler_after: ch5065
      - event_ref: E_ch5065_レオ_observes_周囲の動き_p2
        quote: 状況が把握できずとも、何か自分の与り知らぬ所で大きな動きがあると言うことは感じ取れるようで、レオはしきりに周囲を気にしていた。
        locator: {}
        spoiler_after: ch5065
      - event_ref: E_ch5065_レオ_observes_ティリビナ人_p214
        quote: レオは、そんな彼らをじっと見つめていた。何をするでもなく、ただ見て、聴いていた。
        locator: {}
        spoiler_after: ch5065
      - event_ref: E_ch5065_レオ_other_アキラの服の袖_p6
        quote: おずおずと、レオがこちらの服の袖を引いてくる。
        locator: {}
        spoiler_after: ch5065
      - event_ref: E_ch5065_レオ_observes_道ばたの人々_p60
        quote: 手足を失うという不便さは説明するまでもなくレオにも想像できたのだろう。道ばたに寝転んだり座り込んだりしている人々が皆そうであることに気付くと、顔を青ざめさせた。
        locator: {}
        spoiler_after: ch5065
    speech:
      observations:
      - event_ref: E_ch5065_レオ_says_声の冷たさ_p14
        quote: 「言ってることは分からなかったんですけど、二人ともにこやかなのに全然声が柔らかく無かったです。もの凄く寒くて、冷たい感じの響きがしました」
        locator: {}
        spoiler_after: ch5065
      - event_ref: E_ch5065_レオ_says_松明の騎士団の選別_p169
        quote: 「あの人達は、上の人たちだけしか助けないんですね。下の人たちには何もしない」
        locator: {}
        spoiler_after: ch5065
      - event_ref: E_ch5065_レオ_other_互助組織からも相手にされない人々_p182
        quote: 「でも、その人達からも相手にされてない人がいます」
        locator: {}
        spoiler_after: ch5065
      - event_ref: E_ch5065_レオ_says_老人の喉の奥の声_p21
        quote: 「特にあのお爺さん、見た目はすごく優しそうなのに、喉の奥で唸り声を隠しているみたいな感じがして、本当に怖かったです。アキラさん、あの人と喧嘩するんですか？」
        locator: {}
        spoiler_after: ch5065
      - event_ref: E_ch5065_レオ_asks_アキラ_p4
        quote: 「あの、アキラさん。さっきの場所で、何を話してたのか、訊いてもいいですか？」
        locator: {}
        spoiler_after: ch5065
      - event_ref: E_ch5065_レオ_asks_対策の有無_p41
        quote: 「なんとかならないんですか？」
        locator: {}
        spoiler_after: ch5065
      - event_ref: E_ch5065_レオ_asks_アキラ_p65
        quote: 「アキラさんが付けてるみたいな腕は、みなさんに差し上げられないんですか？」
        locator: {}
        spoiler_after: ch5065
      - event_ref: E_ch5065_レオ_says_アキラと老人の険悪さ_p9
        quote: 「なんだかさっき、アキラさんもあのお爺さんも、すごく険悪な感じで怖かったです」
        locator: {}
        spoiler_after: ch5065
    visual:
      observations:
      - event_ref: E_ch5065_レオ_other_猫耳_p16
        quote: 感覚的な表現を述べながら、レオは頭頂部の猫耳をぴくぴくと動かした。
        locator: {}
        spoiler_after: ch5065
  first_appearance_candidate: true
