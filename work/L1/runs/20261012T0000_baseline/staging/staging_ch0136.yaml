        spoiler_after: ch0136
      - event_ref: E_ch0136_セリアック＝ニア_attacks_ミルーニャ_p4661
        quote: セリアック＝ニアが私の顔に張り付いているのだ。「にゃあ、りーにゃ、わるくない！ みるーにゃ、きらい！」
        locator: {}
        spoiler_after: ch0136
    symbolic:
      observations:
      - event_ref: E_ch0136_セリアック＝ニア_has_property_曖昧な生死_p4665
        quote: 完全に復活させると『生きている』ことが確定してしまい本国に捕捉されてしまうため、生死が曖昧なまま必要に応じて呪石弾で召喚する形で利用させてもらっている。
        locator: {}
        spoiler_after: ch0136
