- canonical_target: '[[E_char_マラード陛下]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0136_マラード陛下_other_流星群_p4675
        quote: 天に散らばる無数の隕石たちが、次々と大地に降り注ぐ。流星群の大半は我が王の下に辿り着く前に燃え尽きるが、せめて少しでも役に立とうと奮起した愛の奴隷たちはその身を擲って陛下の敵へ突撃を敢行し、その速度と質量で恐るべき破壊をもたらすのである。
        locator: {}
        spoiler_after: ch0136
      - event_ref: E_ch0136_マラード陛下_other_ルバーブ_p4683
        quote: 陛下が大地に命じて、私を全力で支援させているのだ。陛下を背にして負けるわけにはいかぬ。
        locator: {}
        spoiler_after: ch0136
  first_appearance_candidate: true
