  mysteries:
  - kind: mystery
    name: MY_Geradius_Identity
    note: ゲラティウス＝グレンデルヒが「百二十八人」の一人であり、悠久の時を待つ存在であること。また、ゾーイ・アキラとケイトという外世界人が演じているというメタ情報。
    quotes:
    - quote: なあに、時間は幾らでもある。何しろ、今はまだ大地が引き裂かれてすらいないのだ！　悠久の時間を、我ら百二十八人は待ち続けるぞ、ミシャルヒよ！
      paragraph: p3917
    - quote: ベースとなる役者としてのゾーイ・アキラとケイトの外世界人二人組。
      paragraph: p3914
    expected_payoff: 百二十八人の正体、彼らが待つ「大地が引き裂かれる」事象、および外世界人の真の目的が明かされる。
  - kind: mystery
    name: MY_Mishari_Eye
    note: ミシャルヒの頭頂部に違和感があり、誰かが内側（あるいは外側）にいるような感覚があったが、疑問が雲散霧消した。
    quotes:
    - quote: ぴくりと、フードの内側が動いた。頭頂部に違和感があったが、即座に消える。
      paragraph: p3913
    expected_payoff: ミシャルヒへの寄生、精神支配、あるいはゲラティウスによる何らかの呪術的介入が後に発覚する。
  - kind: mystery
    name: MY_Curtis_Identity
    note: リールエルバの原型（あるいは祖先）であるカーティスが、フェロニアを「花嫁」として攫った。
    quotes:
    - quote: 攫いに来たよ――私の花嫁
      paragraph: p3928
    expected_payoff: カーティスとフェロニアの関係、リールエルバの出自、そして過去への干渉が現在の物語にどう影響するか。
  - kind: mystery
    name: MY_Pan_Shadow
    note: パーンがフェロニアの影を「影喰い」として攻撃し、正体を暴いた。
    quotes:
    - quote: そこにいるな――影喰いめがっ
      paragraph: p3926
    expected_payoff: 影喰いの正体、パーンの影に対する知識、およびフェロニアに付随していた呪いの詳細。
