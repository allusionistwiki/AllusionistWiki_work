      observations:
      - event_ref: E_ch0194_イツノ_saves_トリシューラ_p6450
        quote: 舞台を構成する橋が砕け、隆起した川面が水の防壁を作り出したのだ。トリシューラの傍に駆けつけたのは黒髪を靡かせた水使いの少女イツノだった。
        locator: {}
        spoiler_after: ch0194
