        locator: {}
        spoiler_after: ch0194
  first_appearance_candidate: true
- canonical_target: '[[E_char_ゼド]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0194_ゼド_attacks_アマランサス_p6442
        quote: ゼドの目的はアマランサスの中にいるシナモリアキラとの習合だ。
        locator: {}
        spoiler_after: ch0194
      - event_ref: E_ch0194_ゼド_takes_シナモリアキラ_p6443
        quote: 盗賊王の権能――『あらゆるものを盗む』というその力で、アマランサスの内部からシナモリアキラという紀人の核を掴み取る。
        locator: {}
        spoiler_after: ch0194
      - event_ref: E_ch0194_ゼド_attacks_ラプンシエル_p6486
        quote: 完全に気配を消していつの間にか塔内に侵入していた盗賊王ゼドは、私の姿を舐め回すように見ていた。この嫌悪感――シナモリアキラと同質のもの！「死ね！」
        locator: {}
        spoiler_after: ch0194
    speech:
      observations:
      - event_ref: E_ch0194_ゼド_threatens_ラプンシエル_p6486
        quote: 「アキラ、俺を喰ってその胎から産め。ああ、逆でもいいぞ。俺がお前を喰い、殺し、犯し、孕み、生み出す！　いっそ交互にやろう、延々と生と死を循環させ転生神としての強度を際限なく高めるんだ、俺がお前のパパで、お前が俺のママだ！」
        locator: {}
        spoiler_after: ch0194
      - event_ref: E_ch0194_ゼド_confesses_ルウテト_p6489
        quote: 「頼む、殺してくれ。俺が俺のままでいられるうちに。とても苦しいんだ。このまま紀神に喰われて自由意思の無い道具に成り下がるのは嫌だ」
        locator: {}
        spoiler_after: ch0194
  first_appearance_candidate: true
