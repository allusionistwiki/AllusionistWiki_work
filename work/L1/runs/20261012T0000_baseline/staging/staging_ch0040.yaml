      observations:
      - event_ref: E_ch0040_杖の技術体系_defines_仮想現実_p1750
        quote: 杖の技術体系では、脳に入出力される情報を操作してこのアストラル界を物質的に再現しようとする『仮想現実』や『拡張現実』というアプローチが幾度も試みられているが、公式な記録でそれが成功したことは一度も無い。
        locator: {}
        spoiler_after: ch0040
  first_appearance_candidate: true
- canonical_target: '[[E_char_杖使い]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0040_杖使い_thinks_車輪の再発明_p1750
        quote: 杖使いは車輪の再発明に終始してばかり――杖の技術は既に存在する神秘の後追いをすることしかできない。そんな常識が、この世界における杖技術の発展を妨げているのだった。
        locator: {}
        spoiler_after: ch0040
  first_appearance_candidate: true
- canonical_target: '[[E_char_ザリス]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0040_ザリス_is_made_of_車椅子_p1751
        quote: 両足が失われており車椅子で生活していることも、その壮絶な過去を想像させて他の候補達をおののかせる一因となっている。彼女が用いる車椅子という道具も、車輪の女王の異名を持つ偉大なるヘリステラを想像させて、むしろ威厳を感じさせていた。
        locator: {}
        spoiler_after: ch0040
  first_appearance_candidate: true
- canonical_target: '[[E_char_メートリアン]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0040_メートリアン_observes_レッド_p1751
        quote: '炎のごとき鮮烈なアバターイメージを遠巻きに眺めながら、ナンバーワンである真白――そのカラス型アバターを操作するメートリ

          ホワイト

          アン＝ミルーニャ・アルタネイフは冷静に思考を働かせる。'
        locator: {}
        spoiler_after: ch0040
      - event_ref: E_ch0040_メートリアン_other_車椅子の少女_p1763
        quote: 意気揚々と訓練室を出て、廊下へと一歩足を踏み出す。　　――衝撃。尻餅を突いて、メートリアンは倒れてしまう。曲がり角で人に激突してしまったのだ。
        locator: {}
        spoiler_after: ch0040
    speech:
      observations:
      - event_ref: E_ch0040_メートリアン_thinks_弱者の戦略_p1752
        quote: 慌ててはいけない。自分はここでも未熟な弱者でしかない。冷静さを失ったら食い物にされるだけだ。じっと堪え忍び、機会を待つ。強者達には潰し合わせて、弱ったところを狙うのが最善の戦略のはずだ。
        locator: {}
        spoiler_after: ch0040
      - event_ref: E_ch0040_メートリアン_asks_アズールの正体_p1759
        quote: '『最後のあれ、一体何者なんです？　貴方や明暗コンビをああまであっけなくやっつけるなんて。それにあのずるっことしか思えない

          チート

          ブルーの大群を一人で倒しちゃいましたよ』'
        locator: {}
        spoiler_after: ch0040
      - event_ref: E_ch0040_メートリアン_says_挑発_p1759
        quote: 直接話しかけることなく、端末の通信アプリを立ち上げる。高速で打鍵して、挑発の文字列を送信する。『ざまあないですねヴァージリア。見事な負けっぷりでしたよ』『ノーレイに秒殺されてたあなたに言われたくない』
        locator: {}
        spoiler_after: ch0040
      - event_ref: E_ch0040_メートリアン_asks_アズールの所属_p1760
        quote: 『あんなとんでもない人がいるなんて聞いたことないです。あれって星見の塔のひとじゃないですよね？　他の拠点にいる候補者なんです？』
        locator: {}
        spoiler_after: ch0040
      - event_ref: E_ch0040_メートリアン_thinks_壁の高さ_p1761
        quote: メートリアンは暗澹たる気分になった。壁は高い。道は険しい。わかっていたつもりだが、登ろうとしていた山が実は小さな丘だったと知らされたような感じだ。
        locator: {}
        spoiler_after: ch0040
      - event_ref: E_ch0040_メートリアン_thinks_アズールへの関心_p1762
        quote: 不思議だった。重大な決意とか、運命的な切っ掛けとかがあったわけじゃない。　それはふとした思いつき。　目標にしている相手が注目しているからという理由もある。　けれど、それ以上に、自分は不思議とその相手のことが気になり始めているのだ。
        locator: {}
        spoiler_after: ch0040
      - event_ref: E_ch0040_メートリアン_says_神経症じみた謝罪_p1763
        quote: 「ごっ、ごめんなさいごめんなさい私が悪かったです不注意でした謝りますから許して下さいぶたないでぶたないでぶたないでぶたないでぶたないでぶたないで――」　両手で頭を抱え、涙声で神経症じみた謝罪を繰り返すメートリアン。
        locator: {}
        spoiler_after: ch0040
      - event_ref: E_ch0040_メートリアン_thinks_敵_p1763
        quote: ――別に、あいつが行くから私も行く、なんて理由じゃない。私は何処まで行っても一人。周りは敵でしかない。そうだ。みんな敵だ。みんな敵だ。みんな敵だ。
        locator: {}
        spoiler_after: ch0040
      - event_ref: E_ch0040_メートリアン_promises_黒百合宮行き_p1764
        quote: メートリアンは決意を新たにした。　黒百合宮に行こう。　そして黒のヴァージリアよりも、謎めいたアズールよりもずっと優れた魔女になってみせる。
        locator: {}
        spoiler_after: ch0040
    visual:
      observations:
      - event_ref: E_ch0040_メートリアン_thinks_ヴァージリアの耳_p1761
        quote: ヴァージリアは左の垂れた兎耳をぱたぱたと動かして何やら思案している。彼女を見ていると何かこう名状しがたい衝動に駆られるのだが、それが何なのかメートリアンには判別しかねた。その手が耳を触りたそうにふらふらと虚空を彷徨っていることに、本人は気付いていないのだ。
        locator: {}
        spoiler_after: ch0040
  first_appearance_candidate: true
- canonical_target: '[[E_char_レッド]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0040_レッド_says_呪文_p1751
        quote: '「牙を剥け、赤かる顎、われらが怒りその身に宿し、鍵たる剣持て

          あぎと

          われらが土塊の出自を否定せよ！　われら、この身は水の御子、大海より出で暗闇に還る、深淵の申し子なりと知らしめよ！！」　燃える車輪が、高らかに呪文を歌い上げる。'
        locator: {}
        spoiler_after: ch0040
  first_appearance_candidate: true
- canonical_target: '[[E_term_勝利者]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch0040_勝利者_gives_万色の称号_p1751
        quote: 勝利した者は第十九番目の色彩『万色』の称号を獲得し、第二位ダーシェンカの教えを受けることができる。偉大なる次女の支援を受けることが出来れば、末妹の未来は確実に近付く。
        locator: {}
        spoiler_after: ch0040
  first_appearance_candidate: true
- canonical_target: '[[E_term_魔女の戦い]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch0040_魔女の戦い_defines_事前選考_p1751
        quote: 数多い候補者たちの中から、総合的な成績や資質などを考慮して選抜された十八名によって行われる魔女の戦い。いずれ行われる真の『選定』で競い合う四人は、この十八名の中から選ばれることだろう。　これはキュトスの姉妹第二位ダーシェンカが開催する呪術儀式にして事前選考だ。
        locator: {}
        spoiler_after: ch0040
  first_appearance_candidate: true
- canonical_target: '[[E_char_ブルー]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0040_ブルー_defeats_レッド_p1752
        quote: '途方もなく膨大な数の、それは青いアバターの群れだった。　ナンバーフォー、真蒼。それが能力なのか、それとも元々群体の

          ブルー

          デーモンなのか。とにかく圧倒的な物量はまるで大海を荒れ狂う大波のようで、それはあっという間にレッドの全身を押し流してしまった。自然災害のごとき青い流体が通り過ぎた後に、敗北者を示す光点が浮かぶ。'
        locator: {}
        spoiler_after: ch0040
  first_appearance_candidate: true
- canonical_target: '[[E_char_ホワイト]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0040_ホワイト_fears_大物食い_p1752
        quote: ホワイトは戦慄した。開幕早々の大物食い。優勝候補の一人が、あっけなく敗れてしまった。なんて恐ろしい戦いだろうと彼女は震えた。
        locator: {}
        spoiler_after: ch0040
      - event_ref: E_ch0040_ホワイト_thinks_対抗心_p1754
        quote: それにあのデーモン、多分だけど操作していたのは――いや、余計な感情、余計な感傷だ。その対抗心は邪魔でしかない。
        locator: {}
        spoiler_after: ch0040
      - event_ref: E_ch0040_ホワイト_thinks_敗北の糧_p1755
        quote: 落胆し、悔しさに唇を噛みつつも、今の自分はこんなものなのだ、と冷静に分析する思いもあった。この敗北を糧に、次の勝利の為に成長しなければならない。大丈夫だ、自分はまだ折れていない。
        locator: {}
        spoiler_after: ch0040
    action:
      observations:
      - event_ref: E_ch0040_ホワイト_flees_雲霞のミサイル_p1752
        quote: 生き残るんだ。ホワイトは翼をはためかせて空を舞った。　方眼を抜けていく無数の白い軌跡。前後左右からホワイトを襲う雲霞のミサイル。蒼穹を切り裂くカラスの翼が急速に傾いて回避行動をとる。
        locator: {}
        spoiler_after: ch0040
      - event_ref: E_ch0040_ホワイト_uses_ポイントブレイクレンジ_p1753
        quote: ポイントブレイクレンジで強引に左スラスタを噴射させ、悲鳴を上げるカラス型の機体を強引に制御して曲線の軌道を描く。脳みそがぐるぐる回る。精神が悲鳴を上げる。
        locator: {}
        spoiler_after: ch0040
      - event_ref: E_ch0040_ホワイト_defeats_シアン_p1754
        quote: '高速で飛行する雲を嘴からの通常射撃で撃ち抜いて、姿勢制御を乱した瞬間を狙ってすれ違いざまに足で引き裂く。背後で爆音。撃破ポイントが加算されて、スコアが表示される。　雲型のデーモン、ナンバーセブンの明藍を打倒したことを確認し

          シアン

          て、ホワイト＝メートリアンは快哉を上げた。'
        locator: {}
        spoiler_after: ch0040
      - event_ref: E_ch0040_ホワイト_uses_爆弾_p1754
        quote: '散逸していく雲の粒子。強い向かい風に流されそうなその瞬間を狙い澄まして、ホワイトは虎の子の爆弾を発動させ

          ボム

          る。　炸裂した巨大な熱量はしかし希薄化した敵には届かない。だが、付随して発生した爆風は向かい風に逆らうようにして雲を押し潰した。'
        locator: {}
        spoiler_after: ch0040
      - event_ref: E_ch0040_ホワイト_loses_アバター_p1755
        quote: 弾幕を必死に回避しようとするが、その圧倒的火力と正確無比な照準によってアバターの羽を撃ち抜かれ、ついには撃墜されてしまう。アストラル体を構成する呪力が散逸して、意識が剥がれていく感覚。
        locator: {}
        spoiler_after: ch0040
  first_appearance_candidate: true
- canonical_target: '[[E_item_シアン]]'
  entity_type: item
  aspects:
    action:
      observations:
      - event_ref: E_ch0040_シアン_attacks_ホワイト_p1753
        quote: 完全に背後を取られていた。相手はしつこいスピードホリック。空中での機動はおそらくこちらより上。
        locator: {}
        spoiler_after: ch0040
    visual:
      observations:
      - event_ref: E_ch0040_シアン_has_property_存在密度変化_p1753
        quote: 敵は存在密度を変化させることができる。一見万能にも見える機体特性だが、希薄になった状態から攻撃態勢に移行するのには時間がかかるようだ。
        locator: {}
        spoiler_after: ch0040
  first_appearance_candidate: true
- canonical_target: '[[E_term_フィールド管理乱数]]'
  entity_type: terminology
  aspects:
    action:
      observations:
      - event_ref: E_ch0040_フィールド管理乱数_makes_向かい風_p1753
        quote: その時、フィールドを管理する乱数が強い向かい風を発生させた。
        locator: {}
        spoiler_after: ch0040
  first_appearance_candidate: true
- canonical_target: '[[E_item_ノーレイ]]'
  entity_type: item
  aspects:
    action:
      observations:
      - event_ref: E_ch0040_ノーレイ_attacks_ホワイト_p1754
        quote: 地上から凄まじい呪力を感知して、ホワイトは咄嗟に身体を傾けて回避行動をとった。カラスの翼すれすれを熱線が通り過ぎていく。視線を眼下に向けると、異形のデーモンが無数の砲口をこちらに向けていた。
        locator: {}
        spoiler_after: ch0040
    visual:
      observations:
      - event_ref: E_ch0040_ノーレイ_is_made_of_四本の杖_p1755
        quote: 四本の杖でその巨大な質量を大地にがっしりと固定し、全身から針鼠のように突きだした砲身や箱形のミサイルポッドから無数の弾体を雨のように発射する。
        locator: {}
        spoiler_after: ch0040
  first_appearance_candidate: true
- canonical_target: '[[E_char_ブラック]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0040_ブラック_fights_ノーレイ_p1755
        quote: そう思って地上を見ると、ホワイトを打ち負かした機械狼は劣勢を強いられていた。　相手は一匹の黒ウサギだ。　機械狼は先程のように弾幕を張っているのだが、ウサギ型デーモンはその身を軽やかに躍らせて、虚空を蹴って攻撃を回避していく。
        locator: {}
        spoiler_after: ch0040
    speech:
      observations:
      - event_ref: E_ch0040_ブラック_is_made_of_英才教育_p1755
        quote: 'フォービットデーモンナンバーツー、真黒。生まれ

          ブラック

          る前から星見の塔の英才教育を受けて育ったという、魔女の中の魔女。黒のヴァージリア。天才にして秀才。'
        locator: {}
        spoiler_after: ch0040
  first_appearance_candidate: true
- canonical_target: '[[E_char_フルブライト]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0040_フルブライト_is_made_of_氷_p1756
        quote: 槍の穂先めいた細長い本体に、後部から前方に放射状に突き出す二本の刃じみた両翼。　氷の戦闘機とでも言い表せばいいだろうか。
        locator: {}
        spoiler_after: ch0040
    name:
      observations:
      - event_ref: E_ch0040_フルブライト_is_made_of_陽色_p1756
        quote: 'フォービットデーモンは十六色に加えて、明度の二色が番外として存在する。　ナンバーセブンティーン、陽色。

          フルブライト

          　ナンバーエイティーン、陰色。

          ノーレイ'
        locator: {}
        spoiler_after: ch0040
    speech:
      observations:
      - event_ref: E_ch0040_フルブライト_names_三叉槍_p1756
        quote: まだ最終選定も終わっていないのに、『三叉槍』を襲名している候補者がいる。　特別扱いを受けているというその二人は、今回の選定においても特別枠で出場しているらしいのだ。
        locator: {}
        spoiler_after: ch0040
    action:
      observations:
      - event_ref: E_ch0040_フルブライト_saves_ブラック_p1756
        quote: その時、彼方から飛来した青い光線がそれを遮った。　高速で飛来するのは氷でできた流線型のデーモンだった。
        locator: {}
        spoiler_after: ch0040
      - event_ref: E_ch0040_フルブライト_fights_ティール_p1757
        quote: 'ノーレイが要塞の如き大樹の深緑を壮絶な砲撃で破壊し、フルブ

          ティール

          ライトが閃光のごとき機動で三つ目トカゲの鈍灰の正確無比な照準

          グレー

          を振り切って逆に撃破。'
        locator: {}
        spoiler_after: ch0040
  first_appearance_candidate: true
- canonical_target: '[[E_char_アズール]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0040_アズール_defeats_イエロー_p1757
        quote: 'まさしく戦闘後の隙を狙って襲いかかってきた真黄と真緑の攻撃

          イエロー

          グリーン

          を軽々と回避し、架空の幻獣である黄色い翼猫と緑色の奇怪な深海魚のデーモンたちを一瞬で破壊する。'
        locator: {}
        spoiler_after: ch0040
      - event_ref: E_ch0040_アズール_defeats_ブルー_p1757
        quote: 大海が割れている。　その光景を目の当たりにしたホワイトは、信じられない思いでぽかんと口をあけてしまった。それほどまでにそのデーモンは圧倒的だった。　立派な角と翼を生やした牡鹿。その全身は空のように澄んだ色をしている。　その優美な姿で、あり得ない数にまでその勢力を膨張させたブルーの軍勢を単身で引き裂いているのだ。
        locator: {}
        spoiler_after: ch0040
      - event_ref: E_ch0040_アズール_defeats_フルブライト_p1758
        quote: '牡鹿の角が、地上で手を出しあぐねていた機械狼に一瞬だけ向け

          ノーレイ

