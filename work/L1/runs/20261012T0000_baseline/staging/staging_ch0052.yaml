        locator: {}
        spoiler_after: ch0052
      - event_ref: E_ch0052_サリア_says_未来回想の危険性_p2028
        quote: 「いいから、フィリスは温存しといて。それにあれは錯乱の危険性があるから止めることにしたの」
        locator: {}
        spoiler_after: ch0052
      - event_ref: E_ch0052_サリア_other_黒衣への回帰_p2053
        quote: 「アストラル体拡散させすぎ太らせすぎ。だらしないからさっさと黒衣に仕舞いなさい。ほら触手は影に引っ込める。イソギンチャク料理にして喰ってやろうか」
        locator: {}
        spoiler_after: ch0052
    visual:
      observations:
      - event_ref: E_ch0052_サリア_uses_時蝿_p2026
        quote: 影の甲冑ではなく軽装の背後に浮かぶのは半透明の蝿だ。腹に巨大な時計を抱えた、不気味だがどことなく愛嬌のある虫。
        locator: {}
        spoiler_after: ch0052
    action:
      observations:
      - event_ref: E_ch0052_サリア_teleports_過去_p2027
        quote: 長針と短針がめまぐるしく逆回転し、時間がぐるぐると巻き戻っていく。私たちは矢のように遡る。
        locator: {}
        spoiler_after: ch0052
