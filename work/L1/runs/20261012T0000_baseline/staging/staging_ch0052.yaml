      - event_ref: E_ch0052_サリア_says_精神の限界_p2021
        quote: 「なにより心の方が保たなくなる。どこかで妥協しないと、完璧な未来に辿り着くより先に頭がお花畑に旅立っちゃうの。これ、経験者からの忠告ね」
        locator: {}
        spoiler_after: ch0052
      - event_ref: E_ch0052_サリア_promises_買い物_p2023
