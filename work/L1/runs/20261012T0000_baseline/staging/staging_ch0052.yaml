  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0052_ガルズ_captures_囚人_p2031
        quote: 拘束用の縄で雁字搦めに縛られて、目隠しをされた男と少女。ガルズとマリーだ。
        locator: {}
