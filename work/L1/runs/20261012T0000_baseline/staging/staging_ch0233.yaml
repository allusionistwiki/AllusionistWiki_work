          超一流の変身者ＶＳここにいるみんな！ 名推理、散りばめられた手掛かりの発見、正体看破、交戦、有効打、捕縛など功績に応じてトロフィーと豪華賞金を獲得！
          会場で有名配信者のセスカや『王殺し』と握手！ 今ならまだまだ参加可能、みんな急げー！」
        locator: {}
        spoiler_after: ch0233
      - event_ref: E_ch0233_トリシューラ_other_レースコース_p7664
        quote: 「レースの日程は二日間！ まずは本中央区の市街地上空コースを巡り、『扉』型のガロアンディアン・ワープゲートから隣接異界へ！ 蒼空岩石群の複雑怪奇な乱気流と散らばった大地という障害物が行く手を阻む！
          次は白い濃霧に覆われた白翼海！ 太古の神秘が待ち受ける見晴らしの悪い荒海を乗り越え、前半戦最後の虫王の庭に突入！ 長閑な自然とは裏腹な迫力の巨大昆虫、突発的な黒い暴風が選手たちを待ち受ける！」
        locator: {}
        spoiler_after: ch0233
      - event_ref: E_ch0233_トリシューラ_other_後半戦コース_p7665
        quote: 「そして翌日、後半戦は獣将国の広大無辺の大地から始まります！ 龍脈に浸食された渓谷と呪力流の道をどう攻略するかが大きなポイントとなるでしょう！
          四つの異界を越えて、選手たちは本都市へと帰還しますがまだ終わりません！ 続いては複雑怪奇な森林ステージが箒乗りたちを幻惑する！ 古き『死人の森』の試練を突破した先には都市の深淵、恐るべき冥府への入り口が待ち受けています！」
        locator: {}
        spoiler_after: ch0233
      - event_ref: E_ch0233_トリシューラ_reveals_夢界でのレース_p7665
        quote: 「しかしただの休憩では終わりません！ 選手たちは睡眠中に夢界へとダイブ！ 朱の天主の協力で可能となった夢の世界でのレースは選手たちの精神に試練を与えます！
