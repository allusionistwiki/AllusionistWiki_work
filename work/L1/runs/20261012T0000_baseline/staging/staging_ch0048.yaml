- canonical_target: '[[E_char_歌姫Spear]]'
  entity_type: character
  aspects:
    name:
      observations:
      - event_ref: E_ch0048_歌姫Spear_names_カタルマリーナ_p1941
        quote: 歌姫カタルマリーナ。 その名前は、とてつもなく不吉で、おぞましいイメージを内包していた為に当初は悪目立ちして話題になったが――その後すぐに忘れられた。
        locator: {}
        spoiler_after: ch0048
      - event_ref: E_ch0048_歌姫Spear_has_property_太陰の王族_p1944
        quote: 素性を隠さなければならない理由は沢山あった。 太陰の王族であること。キュトスの姉妹の予備候補であること。 イルディアンサ その両耳が、左右非対称であること。
        locator: {}
        spoiler_after: ch0048
    action:
      observations:
      - event_ref: E_ch0048_歌姫Spear_functions_as_ネットミーム_p1942
        quote: 歌姫Ｓｐｅａｒはネットアイドルだ。 アストラル界とグラマー界に網目状に広がる情報の流れに乗って運ばれていくネットミーム。ちょっとした流行。けれどしつこく蘇り、決して下火になることがない。
        locator: {}
        spoiler_after: ch0048
      - event_ref: E_ch0048_歌姫Spear_transforms_不死女神の欠片_p1942
        quote: やがて理想を押し通すことができなくなり――彼女は消えていった。 けれど、不死女神の欠片の名前を冠していた歌姫は、そこから奇跡のように甦った。
        locator: {}
        spoiler_after: ch0048
  first_appearance_candidate: true
- canonical_target: '[[E_char_アズーリア]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0048_アズーリア_says_歌姫Spearの素性_p1943
        quote: 「――と言うわけ。わかった？」「う、うん」 私の念入りな説明を聞いて、プリエステラは引きつった声で答えた。
        locator: {}
        spoiler_after: ch0048
      - event_ref: E_ch0048_アズーリア_promises_ハルベルトの保護_p1946
        quote: 「返り討ちにしてやろうね！ 歌姫Ｓｐｅａｒのステージを邪魔するような屑は死ねばいいよっていうかぶっ殺すよ！ 大丈夫、私がハルを守るから」
          ぎゅっとハルベルトの手を両手で握りしめて力強く宣言する。
        locator: {}
        spoiler_after: ch0048
      - event_ref: E_ch0048_アズーリア_hopes_明日の脱出_p1957
        quote: 「明日、全員で無事にパレルノ山を脱出しようね」「うん。そしたら、みんなでお祝いしようか。」
        locator: {}
        spoiler_after: ch0048
