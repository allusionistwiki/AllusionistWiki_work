- canonical_target: '[[E_char_ハルベルト]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0057_ハルベルト_fears_マロゾロンドの顕現_p2179
        quote: だが、その為にはアズーリアが器になり犠牲にならなくてはならない。 ハルベルトはそんなことを断じて容認できなかった。
        locator: {}
        spoiler_after: ch0057
      - event_ref: E_ch0057_ハルベルト_names_紀元槍_p2180
        quote: 必要なのは、世界に刻まれた記憶。 アズーリアは度重なるフィリスの使用によって浸食を受けていた。 世界そのものを浸食する寄生異獣――その存在は紀元槍に刻み込まれている。
        locator: {}
        spoiler_after: ch0057
      - event_ref: E_ch0057_ハルベルト_asks_思い出話の協力_p2181
        quote: ハルベルトはアズーリアの置かれている状況を説明した上で、全員に懇願した。「思い出話をしたい。みんなに手伝って欲しい」
        locator: {}
        spoiler_after: ch0057
      - event_ref: E_ch0057_ハルベルト_other_羞恥_p2183
        quote: メイファーラが話している途中、自分の番では秘密にしていたマリーとの会話について暴露されてハルベルトが羞恥にのたうち回るという事があったが、誰も大して気にしなかった。
        locator: {}
        spoiler_after: ch0057
      - event_ref: E_ch0057_ハルベルト_asks_禁呪の代償の秘密_p2190
        quote: 「協力についてはもういい。ただ、みんなにお願いがある。禁呪の代償について、アズーリアには秘密にして欲しい。その為だったら、ハルは何でもする。だから、どうか」
        locator: {}
        spoiler_after: ch0057
    action:
      observations:
      - event_ref: E_ch0057_ハルベルト_activates_記憶の封印解除_p2181
        quote: アバターの姿のまま、ハルベルトは呪文を詠唱した。 そして、消去されたと思われていた記憶が復活していく。「失われた私たちの記憶――その封印を解除した」
        locator: {}
        spoiler_after: ch0057
      - event_ref: E_ch0057_ハルベルト_makes_思い出話の録音_p2183
        quote: 毎夜順番に一人ずつ過去の物語を語り、それを録音する。 そして最後にその呪術的な記録を手にした一人がアズーリアの精神に潜り、本人に聞かせることでその存在強度を高めるという計画。
        locator: {}
        spoiler_after: ch0057
      - event_ref: E_ch0057_ハルベルト_other_狂姫_p2193
        quote: 二つの情報を受け取ったハルベルトは、リールエルバを見て、それから深く頭を下げた。「ありがとう」
        locator: {}
        spoiler_after: ch0057
  first_appearance_candidate: true
- canonical_target: '[[E_char_リーナ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0057_リーナ_fears_ガルズの殺害_p2195
        quote: 目の前で、ガルズ・マウザ・クロウサーがアズーリアを殺害した事。 そして、その直後にサリアによって無惨に引き裂かれた事。 その二つの余りに衝撃的な光景に加え――事態がまるで終息する気配を見せないことがリーナの心を苛んでいるのだ。
        locator: {}
        spoiler_after: ch0057
      - event_ref: E_ch0057_リーナ_fears_歌姫の殺害_p2196
        quote: このまま行けば、葬送式典の前日には歌姫Ｓｐｅａｒ――すなわちハルベルトが殺害され、最終日にはリーナの祖父であるサイリウス・ゾラ・クロウサーもまた餌食となる。
        locator: {}
        spoiler_after: ch0057
      - event_ref: E_ch0057_リーナ_confesses_アズーリアへの謝罪_p2197
        quote: 「でも、やっぱ私、頭悪いからさ。どうすればいいかなんて自分では考えつかなくて。だから、私はアズーリアにまた会いたいよ。会って話して、謝って、それで――それで、まず目の前の事を片付ける！
          マリーをどうするかとかは後で考える！ っていうかアズーリアとみんなに相談する！」
        locator: {}
        spoiler_after: ch0057
      - event_ref: E_ch0057_リーナ_says_青空について_p2197
        quote: 共有できた話題は、お互いが関心のある事柄」 ――私たちは、青空について話したんだ。 そして、リーナの話が始まった。
        locator: {}
        spoiler_after: ch0057
  first_appearance_candidate: true
