  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0057_聖姫_helps_狂姫_p2172
        quote: 敵意を込めたメッセージを二重三重に送信するが、それを【狂姫】の隣にいる【聖姫】がにこやかに弾き返す。 三角の獣耳が生えた少女人形が、デフォルメされた手から鋭い爪を生やす。
        locator: {}
        spoiler_after: ch0057
    speech:
      observations:
      - event_ref: E_ch0057_聖姫_says_姉様への依存_p2172
        quote: 「姉様にひどいことはしないで下さい」
        locator: {}
        spoiler_after: ch0057
  first_appearance_candidate: true
- canonical_target: '[[E_char_道具屋]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0057_道具屋_threatens_狂姫_p2172
        quote: 「リールエルバ、次にふざけた事を言ったらその不愉快な顔にスパム呪石弾一括でブチ込んでやりますよ」 凄んだのは【道具屋】――大きな鞄を肩からかけた白いカラスである。
        locator: {}
        spoiler_after: ch0057
      - event_ref: E_ch0057_道具屋_says_アズーリアの意思尊重_p2173
        quote: 「そしてアズーリア様は容れ物じゃない。貴方たちの奉じる神がたとえアズーリア様の創造主であったとしても、その意思を圧殺する権利なんてありはしません。いいえ、たとえあったとしても私は認めない」
        locator: {}
        spoiler_after: ch0057
      - event_ref: E_ch0057_道具屋_says_リーナを煙幕として利用_p2174
        quote: 「ああ、貴方は怪しまれない為の煙幕です。お馬鹿さんと一緒に参加してれば、私が監視だとか利用しようとしているだとか想像もつかないでしょうからね」
        locator: {}
        spoiler_after: ch0057
      - event_ref: E_ch0057_道具屋_says_監視任務_p2174
        quote: 「別に、仲間はずれにしてたとかじゃないですよ？ アズーリア様に呪力が『戻る』までは接触しようと思ってもできませんでしたし――それに昔の面々が集まったのも偶然です。私はフィリス目当てで監視してただけですし、そこのお気楽お目々も智神の盾としての監視任務でしょう。
        locator: {}
        spoiler_after: ch0057
      - event_ref: E_ch0057_道具屋_names_パレルノ山の出来事_p2176
        quote: そう前置きして、ミルーニャは現在までの経緯――パレルノ山で起こったあの出来事を振り返る。 この場にいない黒衣の英雄に思いを馳せながら。
          アズーリア・ヘレゼクシュはハルベルトが禁呪を使用した事で一命を取り留めた――しかし、意識は戻らなかった。
        locator: {}
        spoiler_after: ch0057
      - event_ref: E_ch0057_道具屋_reveals_エクリーオベレッカの性質_p2180
        quote: 不勉強なリーナは知らなかったが、第一位の守護天使【睥睨するエクリーオベレッカ】は人格神ではない。天の御殿と呼ばれる建物であり、死した人々の魂の行き先と言われる空間だ。
          直接その力を引き出すことはできず、またそのような具体的な力を持たない。
        locator: {}
        spoiler_after: ch0057
      - event_ref: E_ch0057_道具屋_confesses_引き金を引いた責任_p2184
        quote: 「そんなのっ、アズーリア様が悪いわけじゃない！ やったのは私、全て私の責任で引き金を――」
        locator: {}
        spoiler_after: ch0057
  first_appearance_candidate: true
- canonical_target: '[[E_char_目玉]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0057_目玉_appears_as_浮遊する眼球_p2173
        quote: 暢気にお茶を楽しんでいるのは【目玉】だが、そのデフォルメされた眼球アバターはこの場から浮いている。比喩としても実際の意味でも。
        locator: {}
        spoiler_after: ch0057
    speech:
      observations:
      - event_ref: E_ch0057_目玉_asks_本名使用の可否_p2173
        quote: 「う、うん。ありがと。えっと質問いい？」「ほえ？」「ここって基本的に本名を口にしたら駄目って聞いてたんだけど、違うの？」
        locator: {}
        spoiler_after: ch0057
    action:
      observations:
      - event_ref: E_ch0057_目玉_observes_アズーリアの精神_p2177
        quote: そこでメイファーラが接触感応でアズーリアの精神の奥深くを探ることになった。そこで、最悪の事態が明らかになる。
        locator: {}
        spoiler_after: ch0057
  first_appearance_candidate: true
- canonical_target: '[[E_char_植木鉢]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0057_植木鉢_appears_as_鉢植えと花_p2174
        quote: 小さな鉢植えとデフォルメされた大輪の花、それが【植木鉢】のアバターだったが、目玉に押しつけられた焼き菓子を葉っぱの両手で抱えながら困惑している。
        locator: {}
        spoiler_after: ch0057
    action:
      observations:
      - event_ref: E_ch0057_植木鉢_uses_矯正呪具_p2174
        quote: 彼女もこの場所に来るのは初めてだったが、【道具屋】ことミルーニャに借りた邪視能力の矯正呪具である眼鏡によってこの談話室を訪れる事ができていた。
        locator: {}
        spoiler_after: ch0057
  first_appearance_candidate: true
- canonical_target: '[[E_char_箒]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0057_箒_says_事情を知らず参加_p2174
        quote: 「私！ 私は知らなかった！ 先輩に誘われて来たけどこれっぽっちも事情とか知らずにテキトーに参加してたよ、なんか楽しくお喋りする所なのかなって！」
        locator: {}
        spoiler_after: ch0057
      - event_ref: E_ch0057_箒_other_マロゾロンド撃退_p2179
        quote: 一つは、サリアに加勢してマロゾロンドを撃退すること。 この案はリーナから出されたが、余りにも無謀だった。
        locator: {}
        spoiler_after: ch0057
      - event_ref: E_ch0057_箒_other_守護天使の力_p2180
        quote: リーナは霊媒というわけではないが、序列第一位の空の民として、守護天使の力を引き出してアズーリアを救ってみせると豪語した。
        locator: {}
