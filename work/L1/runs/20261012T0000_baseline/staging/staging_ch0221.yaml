- canonical_target: '[[E_char_ユディーア]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0221_ユディーア_observes_祝祭_p7328
        quote: 活気に満ちた第五階層の主街区を天眼による俯瞰知覚で眺めながら、ユディーアはぼんやりとオープンテラスの席に座ってストローでジュースを啜っていた。
        locator: {}
        spoiler_after: ch0221
      - event_ref: E_ch0221_ユディーア_uses_使い魔_p7329
        quote: やれることと言えば、『使い魔』からの報告に目を通し、指示を下すことくらい。
        locator: {}
        spoiler_after: ch0221
      - event_ref: E_ch0221_ユディーア_fights_クレナリーザ_p7340
        quote: なぜかユディーアはその時むきになって反論した。理由はわからない。そうしなければ、自分の中にある何かが弾けてしまう気がした。
        locator: {}
        spoiler_after: ch0221
    speech:
      observations:
      - event_ref: E_ch0221_ユディーア_thinks_ロードデンドロン_p7329
        quote: ロードデンドロンの方針転換はあまりに急だ。背後にいるであろうスーリウムの存在と、機械女王トリシューラの暗殺計画を踏まえると、無条件で信用するのは危険過ぎる。
        locator: {}
        spoiler_after: ch0221
      - event_ref: E_ch0221_ユディーア_thinks_支配_p7330
        quote: ちょっとした女王様気分。自分の価値が他者を支配している、そのことに対する全能感が心を満たしていくようだった。
        locator: {}
        spoiler_after: ch0221
      - event_ref: E_ch0221_ユディーア_suspects_アヴロノ_p7332
        quote: 関わっているのは十中八九、ネビロン氏族のアヴロノたちだろう。
        locator: {}
        spoiler_after: ch0221
      - event_ref: E_ch0221_ユディーア_thinks_王殺し_p7332
        quote: そして、そのような後ろ暗い連中が出入りする勢力であれば、『王殺し』が潜り込むための隙間も大きくなるはずだというのがユディーアの推測だった。
        locator: {}
        spoiler_after: ch0221
      - event_ref: E_ch0221_ユディーア_fears_衝動_p7333
        quote: 腹いせに使い魔どもの妻子でも贄に捧げさせようか。不穏な思考が脳裏を過ぎる。
        locator: {}
        spoiler_after: ch0221
      - event_ref: E_ch0221_ユディーア_remembers_エルフェンバイン_p7338
        quote: エルフェンバインの塔。それはあるはずのない記憶。
        locator: {}
        spoiler_after: ch0221
      - event_ref: E_ch0221_ユディーア_says_結論_p7352
        quote: 「やっぱり、今のあたしにはまだわかんないよ」それが結論。いつまでも答えを留保して、正解が訪れるのを待ち続ける。
        locator: {}
        spoiler_after: ch0221
    visual:
      observations:
      - event_ref: E_ch0221_ユディーア_transforms_鉤爪_p7344
        quote: 右手を見て愕然とする。自分でも気づかぬうちに鉤爪が長く伸びていた。
        locator: {}
        spoiler_after: ch0221
  first_appearance_candidate: true
