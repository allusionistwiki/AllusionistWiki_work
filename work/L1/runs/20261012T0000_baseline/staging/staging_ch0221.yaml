- canonical_target: '[[E_char_クレナリーザ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0221_クレナリーザ_appears_ユディーア_p7335
        quote: いつのまにか対面の席に何者かが座っていることに気が付いた。パラソルの影の下、時代がかかったドレスに膨らんだスカートが目を惹く。闇に重く沈んでいく死の不吉。髑髏の貴婦人がそこにいた。
        locator: {}
        spoiler_after: ch0221
    speech:
      observations:
      - event_ref: E_ch0221_クレナリーザ_says_愚かしさ_p7335
        quote: 「可愛らしさとは愚かしさに似ている。この平和な光景がそうであるように」
        locator: {}
        spoiler_after: ch0221
      - event_ref: E_ch0221_クレナリーザ_asks_踏みつけ処刑_p7336
        quote: 「『踏みつけ処刑』をご存じ？」
        locator: {}
        spoiler_after: ch0221
      - event_ref: E_ch0221_クレナリーザ_says_杖_p7337
        quote: 「残酷さなど陳腐なものよ。後衛的な俗悪さを愛するのでなければ知らなくてもかまわない。あなたは杖の座ではないのだから」
        locator: {}
        spoiler_after: ch0221
      - event_ref: E_ch0221_クレナリーザ_teaches_象_p7337
        quote: 「それが象と呼ばれる生き物たち。彼らはかつてパンゲオンを絵画や彫刻に落とし込む際にモチーフに使われたこともあったのよ」
        locator: {}
        spoiler_after: ch0221
      - event_ref: E_ch0221_クレナリーザ_says_沼_p7338
        quote: 「そしてそこから命が生まれていった。多くの神話が起源を語るようにね。奇異なる鼻は想像力の源泉となったのでしょう。象の生息域は大食漢を養える豊かな地とされ、底無し沼はその恐ろしさと水源としての価値から地母神キュトスのいる世界に繋がっているとも、キュトスそのものであるともされた」
        locator: {}
        spoiler_after: ch0221
      - event_ref: E_ch0221_クレナリーザ_says_歴史_p7339
        quote: 「過去など変わる。歴史など変えられる。何も呪術など用いずとも、風と火が全てを時空から消していく。美しい呪文を重ねればその形さえ変えられてしまう」
        locator: {}
        spoiler_after: ch0221
      - event_ref: E_ch0221_クレナリーザ_says_罪_p7339
        quote: 「罪を遡り続ければ、やがて先住権の問題に行き着く。歴史を経た若き種族ほど身に覚えのない罪を背負わされて戸惑うものよ。緑の聖地を奪われたティリビナ人や黒檀の民も例外ではない。万民の平等を謳うガロアンディアンの民も同じ」
        locator: {}
        spoiler_after: ch0221
      - event_ref: E_ch0221_クレナリーザ_says_ティシムガンド_p7340
        quote: 「金髪黒肌の英雄たちがもたらしたティシムガンドの繁栄は、大きく穏やかなカシュタクル人を根絶やしにすることで完成を見た。アルラウネがレルプレアとスーリウム、ウェズロウに託した輝かしく美しい世界に暗く醜いものは存在を許されなかった。ねえ、樹皮の肌ではない『人らしい美貌』とはいったいどういう皮肉だと思う？」
        locator: {}
        spoiler_after: ch0221
      - event_ref: E_ch0221_クレナリーザ_says_言語_p7341
        quote: 「言語支配者ダーカンシェルとその子アルトは獣に言葉を与えることができたし、逆に奪うこともできた。神話が残っているということは、それに類する過去があったということ」
        locator: {}
        spoiler_after: ch0221
      - event_ref: E_ch0221_クレナリーザ_says_感情_p7342
        quote: 「心を押し殺して、本当のことを見ないふり。全てはそらごと、ああなんて空しい。善き社会のために制御された感情は、果たして無かったことになるのかしら」
        locator: {}
        spoiler_after: ch0221
      - event_ref: E_ch0221_クレナリーザ_says_鼻_p7347
        quote: 「あなたが、トライデントの『鼻』なんですか？」「至高天主の作った下らないおまじないだけどね。水増しなのか呪縛対象を増やしたいからなのか、やたらと数が増えていたけれど、要するに参照元はセフィロトでしょう？
          王冠から流出して王国までを形成する、神秘主義の例のあれ」
        locator: {}
        spoiler_after: ch0221
      - event_ref: E_ch0221_クレナリーザ_says_道具_p7348
        quote: 「道具とは使われるためにあるのよ、愚かで愛らしいユディーア。そこで縮こまっているセリアック＝ニアが情報端末に化けているように、鮮血呪から派生した杖の神秘は気軽に扱えるくらいがちょうどいい」
        locator: {}
        spoiler_after: ch0221
      - event_ref: E_ch0221_クレナリーザ_says_ハグレス_p7350
        quote: 「愚かなハグレスの遊び相手には私がなってあげる。運命は静かに巡ることでしょう」
        locator: {}
        spoiler_after: ch0221
      - event_ref: E_ch0221_クレナリーザ_says_選択_p7351
        quote: 「お前が自身を知らぬままでいることを選ぶのであれば、その鮮血が染め上げるのは血の畑となるでしょう。お前は呪いをまだ知らない。その心が望んでいる救済の地はどこにあるのか、想像してみたことはある？
          漠然とした夢想、白馬の王子様を待ち望む怠惰さはお前に赦しを与えない」
        locator: {}
        spoiler_after: ch0221
    action:
      observations:
      - event_ref: E_ch0221_クレナリーザ_helps_ユディーア_p7344
        quote: 「戻ってきなさい。まだ裏返るには早い」世界に光が満ちる。闇色の世界は既にどこにもなかった。
        locator: {}
        spoiler_after: ch0221
      - event_ref: E_ch0221_クレナリーザ_takes_銀貨_p7345
        quote: 銀貨だ。ユディーアはいつの間にか自分の中から『何か』が抜き取られていることに気が付いた。あり得ない。この禁呪は『塔』の秘奥。『銀貨』をユディーアから奪うなんてことは鮮血呪の正統な後継者であるトリシューラでさえ不可能な芸当のはず。
        locator: {}
        spoiler_after: ch0221
    name:
      observations:
      - event_ref: E_ch0221_クレナリーザ_names_クレナリーザ_p7345
        quote: 「私の名はクレナリーザ。死と再生の神ハザーリャの巫女、そしてヒュールサスの女王が代々受け継ぐ『沼の祭司』を示す記号」
        locator: {}
        spoiler_after: ch0221
  first_appearance_candidate: true
