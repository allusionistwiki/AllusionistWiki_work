episode: ch0075
created: '2026-10-10'
status: pending_merge
entities:
- canonical_target: '[[E_char_メイファーラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0075_メイファーラ_other_四十四士の義務_p2832
        quote: 「そっちだって立場は同じなんだから、わかるでしょ。四十四士の家に生まれたらさ、いつかはジャッフハリムに――レストロオセ様にお仕えしなきゃなんだし」
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_メイファーラ_says_勝ち逃げ_p2832
        quote: 少女は地に伏した相手に手を差し伸べるが、無視されてしまう。　自力で立ち上がった少年は、強い視線を向けながら言った。「勝ち逃げする気か」「知らないよー」
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_メイファーラ_asks_いじめ_p2833
        quote: 「ね、あたしがいなくなって、いじめられたりしないよね？」
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_メイファーラ_reveals_ポルガーの下での修行_p2833
        quote: 「すぐには行かないよ。ポルガーお姉様の下で三年は呪術の修行かなあ。難しそうだけど――っていうか、あんまり大声で言わないでよ」
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_メイファーラ_other_カインの真意_p2835
        quote: 口では父親を憎みつつも、その実は武功を上げる事で家の名誉を回復し、恩赦によって父親の刑期を縮めようとしていることを少女は知っていた。
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_メイファーラ_other_カインの家系_p2835
        quote: 「きみの所って確か道化師とか芸術家の家系だよね？　無謀じゃない？　っていうか何でガッチガチの武門と張り合おうと思ったの？」
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_メイファーラ_asks_窮屈さ_p2836
        quote: 「ね、それって窮屈じゃないの？」　問いに、少年は黙りこくった。
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_メイファーラ_other_邪悪への惹かれ_p2836
        quote: あらゆる『善さ』と『素晴らしさ』の普遍的価値を理解しつつも、『そうではないもの』に惹かれてしまう心がある。　それは弱さなのだろう。　あるいは、他者への共感性を欠いた邪悪さなのかもしれない。
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_メイファーラ_says_人殺しの技_p2836
        quote: 思い遣り、優しさ、命の尊さ。「結局は、人殺しの技なのにね」
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_メイファーラ_asks_信じてる？_p2837
        quote: 「信じてる？」「――無論だ」
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_メイファーラ_other_潜入設定_p2838
        quote: 『潜入』の際には、文化近似度が高いその近辺地域の片田舎出身、という設定がなされることだろう。　実際、東から中央に出てきた田舎者である。
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_メイファーラ_says_虹のホルケナウ_p2838
        quote: 「ま、あたしはしばらくジャッフハリムの王宮と虹のホルケナウを行ったり来たりすることになるのかなあ。ポルガーお姉様以外の魔女って良く知らないから怖いなー、なんて」
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_メイファーラ_other_偽り_p2839
        quote: 少女に隠し事は通用しない。だからだろうか。『公平ではない』という思いが、彼女を正直者にしていた。　だが、これからはそれも改めなければならないだろう。　少女は、何もかもを偽って生きることになる。
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_メイファーラ_other_カインの資質_p2839
        quote: 「ふーん。お父さんの事があるから？　でも資質無さそう」　またしても少年が黙ってしまい、少女はしまった、と思った。
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_メイファーラ_fears_脳_p2845
        quote: 優しく微笑む【脳】のことが、どうしてかメイファーラは無性に怖くてたまらない。こんなに無害で、か弱くて、守ってあげたくなるような姿なのに。　善良で素敵であるということが、こんなに恐怖を呼び起こすのは、自分が邪悪で醜いからなのだろうか――？
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_メイファーラ_promises_危害を加えない_p2846
        quote: 絶対遵守の誓い――決して破ることが出来ない契約。　黒百合の子供たちに危害は加えない。　あらゆる苦難から、仲間たちを守り抜く。
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_メイファーラ_other_トリアイナ_p2847
        quote: トリアイナ様の救世は、それをもたらしてくれると、仲間の細胞たちは保証してくれた。それに縋り付いて、盲信するだけ。　――嘘だ。　何も信じてなどいない。
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_メイファーラ_other_偽り_p2847
        quote: 嘘を嘘でないと偽りの証明をし続ける為に。　偽りの故郷、偽りの信仰、偽りの仲間たちを守り続ける。　それは、真実そのままでなければならない。
        locator: {}
        spoiler_after: ch0075
    action:
      observations:
      - event_ref: E_ch0075_メイファーラ_fights_カイン_p2832
        quote: 九十九戦して五十勝四十九敗。
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_メイファーラ_other_脳と髪_p2843
        quote: メイファーラは【脳】と【髪】を立場を超えて親友になったばかりの双子に引き合わせてしまう。
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_メイファーラ_other_脳と髪_2_p2843
        quote: それと前後するように、ジャッフハリムの王宮で偶然とある双子に出会い。　――【脳】と【髪】に出会ったのも、その頃のことだった。
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_メイファーラ_other_青い鳥_p2843
        quote: そして、透き通った青い鳥に出会い。
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_メイファーラ_other_彩石の儀_p2843
        quote: そうする内に、【彩石の儀】という事前選考を知り、それなりに成績も良かったメイファーラはホルケナウの他の魔女たちと同じようにそのアストラルの空での戦いに身を投じる事になる。
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_メイファーラ_other_黒百合宮_p2845
        quote: その『定期報告』は、黒百合宮を出てからも密かに続くことになる。　当の本人は、何も知らないまま。
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_メイファーラ_saves_幼馴染み_p2846
        quote: 自ら解き放った第一魔将が皆に牙を剥く中、かろうじて幼馴染みの一人を救い出し
        locator: {}
        spoiler_after: ch0075
    visual:
      observations:
      - event_ref: E_ch0075_メイファーラ_observes_魔女たちの天才性_p2842
        quote: そして、その場所にいた魔女たちの圧倒的な天才性にも。　はっきり言って、メイファーラはそこでは劣等生だった。
        locator: {}
        spoiler_after: ch0075
    name:
      observations:
      - event_ref: E_ch0075_メイファーラ_defines_第九魔将_p2848
        quote: それがメイファーラ・リト＝ユディーアというジャッフハリム四十四士にして存在を秘された真の第九魔将の本質だ。
        locator: {}
        spoiler_after: ch0075
  first_appearance_candidate: true
- canonical_target: '[[E_term_奉竜山]]'
  entity_type: terminology
  aspects:
    visual:
      observations:
      - event_ref: E_ch0075_奉竜山_is_located_ジャッフハリム東方_p2832
        quote: そこはジャッフハリムの東方に聳え立つ奉竜山。　外力無双で知られる西とは異なり、そこは内力を極めんとする武術家たちにとっての総本山であった。
        locator: {}
        spoiler_after: ch0075
  first_appearance_candidate: true
- canonical_target: '[[E_char_青海]]'
  entity_type: character
  aspects:
    name:
      observations:
      - event_ref: E_ch0075_青海_defines_内家拳の極致_p2832
        quote: 内家拳の極致と称される青海の教えを受けんが為に、胸に大志を抱いた様々な者達が集う武術の聖地。
        locator: {}
        spoiler_after: ch0075
    action:
      observations:
      - event_ref: E_ch0075_青海_teaches_座学_p2835
        quote: 奉竜山の教主、青海は門下生たちに徹底的な座学を行う。　それは内家拳に必須とされる人体構造と呪術的な『経絡』との相関から、丹田より『気』を練り上げて発するための呪術合理的な理論まで多岐に渡る。
        locator: {}
        spoiler_after: ch0075
  first_appearance_candidate: true
- canonical_target: '[[E_char_カイン]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0075_カイン_asks_天蓋の上_p2833
        quote: 「貴様は天蓋の上に向かうらしいではないか」
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_カイン_other_メイファーラ_p2833
        quote: 「何を恥じる。間諜とて重要な役目であろう。形の上では裏切ることになったとしても、魂まで売り渡すわけではない――」
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_カイン_other_メイファーラの同情_p2833
        quote: 「ふん。裏切り者の父を持った以上、仕方の無いことだ。貴様の余計なお節介など不要だ。私はかかる苦難なぞ自力ではね除けてみせる」
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_カイン_hopes_七勇士_p2834
        quote: 「私はもっと強くならねばならん。四十四士として認められ、傷付いた家の名誉を回復させる。この地で武術を修め、いずれはレストロオセ様より七連珠を授かりし筆頭七勇士に選ばれてだな――」
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_カイン_other_束縛_p2836
        quote: 共生社会、より良き世界、天獄のような邪悪を許さぬ善良。　それゆえに――少年は己の未来を予め束縛する父親を支えねばならぬ。救わねばならぬ。汚名をそそぎ、名誉を回復する。
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_カイン_says_心なき拳_p2836
        quote: 「だからこそ、であろう。心なき拳は空虚だ。天上の狂信者たちのように、保身と利益の確保に汲々とし、『経済性』などで戦いを語るようになればそれは生きながらにして死んでいるに等しい――」
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_カイン_says_ルスクォミーズ_p2838
        quote: 「私はここに来る前、悪鬼の女王たるルスクォミーズ様にお会いした事がある。大変に良くしていただいたが、悪鬼にならないかと誘われたのは参ったな」
        locator: {}
        spoiler_after: ch0075
    name:
      observations:
      - event_ref: E_ch0075_カイン_names_カーイン_p2840
        quote: 「じゃあね、カーイン。次に会ったら、百戦目ができるといいね」
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_カイン_names_ユディーア_p2840
        quote: 「さらばだ、ユディーア。次は私が勝つ。精々鍛錬を欠かさぬ事だ」
        locator: {}
        spoiler_after: ch0075
  first_appearance_candidate: true
- canonical_target: '[[E_term_ジャッフハリム]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch0075_ジャッフハリム_defines_共生_p2833
        quote: ジャッフハリムの理想である『共生』は、あらゆる在り方を許容しつつ、個人が社会に適応するための最善の方法を模索する。
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_ジャッフハリム_has_property_いじめ_p2834
        quote: ジャッフハリムは未だ『国家』という枠組み――使い魔の大規模呪術に依存している呪術共同体である。　『いじめ』という人類の宿痾を根治させるには至っていない。
        locator: {}
        spoiler_after: ch0075
    action:
      observations:
      - event_ref: E_ch0075_ジャッフハリム_other_個人の責任_p2834
        quote: ジャッフハリムは個人の責任を周りに波及させて問うたりはしない。　だから、たとえ少年の父親が裏切り者だったとしてもそれで彼が非難されたり、悪感情を抱かれたりすることは『謂われ無き事』である。
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_ジャッフハリム_other_天獄の理念への賛同_p2834
        quote: また、天獄の理念に賛同してジャッフハリムを敵に回すような『裏切り者』も同様に裁かれる定めである。
        locator: {}
        spoiler_after: ch0075
      - event_ref: E_ch0075_ジャッフハリム_has_property_死刑なし_p2835
        quote: ジャッフハリムに死刑は無い。　投獄された少年の父親は、途方もなく長い年月を奉仕労働に費やす余生を送ることになっている。
        locator: {}
        spoiler_after: ch0075
  first_appearance_candidate: true
- canonical_target: '[[E_term_奉竜山の拳法]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch0075_奉竜山の拳法_requires_心_p2835
        quote: 奉竜山の拳法を全て修めた者は、武術の達人にして同時に一流の呪術師であり、更には医師としての資格を有するのだ。　学ぶべき事はそれだけではない。　情、孝悌、仁義、忠義、誇り、自尊、その他ありとあらゆる『心』無くばいかなる精強を誇る武門であろうと魔教へ堕ちる。
        locator: {}
        spoiler_after: ch0075
  first_appearance_candidate: true
- canonical_target: '[[E_term_天獄]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch0075_天獄_defines_恐怖による掌握_p2837
        quote: 巨大な企業が冷たい論理を振りかざして資本主義経済の名の下に圧政を敷き、それを槍神教が包括する恐ろしい世界。　『労働の場』と『心の安堵』が保証された楽園とは名ばかりの、恐怖によって人を掌握するこの世の邪悪を煮詰めたような場所が天獄だ。
        locator: {}
        spoiler_after: ch0075
    action:
      observations:
      - event_ref: E_ch0075_天獄_has_property_暗殺_p2837
        quote: 天獄は、一致団結して戦うということをしない。　それどころか仲間同士で足を引っ張り合い、相争い、挙げ句の果てに武功を調整するために公然と暗殺までするらしい。
        locator: {}
        spoiler_after: ch0075
  first_appearance_candidate: true
- canonical_target: '[[E_char_シャルマキヒュ]]'
  entity_type: character
  aspects:
    name:
      observations:
      - event_ref: E_ch0075_シャルマキヒュ_is_made_of_実在の人物_p2838
        quote: 冗談のような武勇伝ばかりが残るシャルマキヒュは、歴史上で明確にその存在が確認されている実在の人物だ。神格化されすぎて天獄では神や天使として崇められているという。
        locator: {}
        spoiler_after: ch0075
  first_appearance_candidate: true
- canonical_target: '[[E_term_ディスカレイリーグ]]'
  entity_type: terminology
  aspects:
    visual:
      observations:
      - event_ref: E_ch0075_ディスカレイリーグ_is_located_ジャッフハリム東方の隣国_p2838
        quote: ディスカレイリーグは天獄で言えばヘレゼクシュ地方のアロイ＝ワリバーヤという国と対応関係にある、ジャッフハリム東方の隣国である。
        locator: {}
        spoiler_after: ch0075
  first_appearance_candidate: true
- canonical_target: '[[E_term_天眼の民]]'
  entity_type: terminology
  aspects:
    visual:
      observations:
      - event_ref: E_ch0075_天眼の民_has_property_優れた戦士_p2838
        quote: 天眼の民、あるいは蜥蜴人とも呼ばれる種族は優れた戦士として各地で重宝されている。
        locator: {}
        spoiler_after: ch0075
  first_appearance_candidate: true
- canonical_target: '[[E_char_クルエクローキ]]'
  entity_type: character
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch0075_クルエクローキ_has_property_気紛れ_p2841
        quote: 悪運の竜クルエクローキが気紛れを起こしたならば、二人はいずれ戦場で相まみえることにもなり得るだろう。　同じジャッフハリムの勇士でありながら、敵同士として。
        locator: {}
        spoiler_after: ch0075
  first_appearance_candidate: true
- canonical_target: '[[E_term_扉の呪術]]'
  entity_type: terminology
  aspects:
    action:
      observations:
      - event_ref: E_ch0075_扉の呪術_functions_as_空間移動_p2841
        quote: 扉の呪術は結果だけ見れば空間移動だが、距離を短縮するもの、重なり合う異世界を『近道』として利用するもの、類似を利用して物体同士を交換するものなど原理は様々である。
        locator: {}
        spoiler_after: ch0075
  first_appearance_candidate: true
- canonical_target: '[[E_term_虹のホルケナウ]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch0075_虹のホルケナウ_has_property_偏在者_p2841
        quote: キュトスの姉妹が三十位、虹のホルケナウは場所の姉妹である。　と同時に建物であり拠点であり空間であり土地であり領域でもある。　彼女は『どこにもいない』し、『いまここ』にいる。
        locator: {}
        spoiler_after: ch0075
  first_appearance_candidate: true
- canonical_target: '[[E_char_アリス]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0075_アリス_other_ルスクォミーズ派の姉妹たち_p2842
        quote: 北方の地底都市ザドーナからやってきたアリスは既に幾つかの分野では師であるルスクォミーズ派の姉妹たちを凌駕していたし
        locator: {}
        spoiler_after: ch0075
  first_appearance_candidate: true
- canonical_target: '[[E_char_ポルガー]]'
  entity_type: character
  aspects:
    name:
      observations:
      - event_ref: E_ch0075_ポルガー_is_made_of_天眼の民_p2842
        quote: ジャッフハリム四十四士にしてキュトスの姉妹の六十三位であるポルガーは、同時にシャルマキヒュその人から血を受けてジャスマリシュ――つまりは天眼の民となった身であり、メイファーラの家とは極めて深い繋がりを持つ。
        locator: {}
        spoiler_after: ch0075
    action:
      observations:
      - event_ref: E_ch0075_ポルガー_names_メイファーラ_p2843
        quote: 名付け親としてメイファーラの名を定めたのも、その霊媒としての資質を見込んで末妹候補に推挙したのもポルガーである。
        locator: {}
