  mysteries:
  - kind: mystery
    name: MY_オルプネとスマルトの同時失踪
    note: ダンススタジオ主宰のオルプネと影の世界の住人スマルトが、予兆なく影の中に引き摺り込まれるようにして同時に失踪した。この事件が地下空間の「大儀式」とどう関連するか。
    quotes:
    - quote: オルプネは足下の床に――正確には影の中に引き摺り込まれるようにして沈んでいったのだとか。
      paragraph: p5555
    - quote: なんとあの『スマルト』までもが同時刻に謎の失踪を遂げていたらしい。
      paragraph: p5555
    expected_payoff: 影の世界スキリシアへの侵食、あるいは地下空間の管理者による「選別」や「回収」の一環として、両者が何らかの役割（生贄、鍵、あるいは囚われの身）で連れ去られたことが明かされる。
  - kind: mystery
    name: MY_ヒュドラボルテージの太陽核の所在
    note: 神滅具ヒュドラボルテージの心臓部「太陽核」が魔女リールエルバに盗まれ、最下層に隔離されている。これが地下空間の瘴気や春冬の交代劇とどう関わるか。
    quotes:
    - quote: 彼の心臓部である『太陽核』と呼ばれるコアユニットが『リールエルバ』を名乗る魔女に盗まれ、最下層に隔離されてしまったから、だそうだ。
      paragraph: p5558
    - quote: ニワトリのコアユニット――『太陽』に擬されたパーツが地下に隠されて、地上に瘴気が漏れ出しているっていう構図が気になるね。
      paragraph: p5563
    expected_payoff: 太陽核の奪還が地下空間の浄化、あるいはコルセスカの目的達成のための重要なキーアイテムとなる。リールエルバとの対決や、太陽核の本来の力（疑似太陽化）の発動が描かれる。
  - kind: mystery
    name: MY_クレイの意図的な放置
    note: クレイがセスカと拉致された後、なぜ彼だけが地下アイドル空間に「置き去りに」されたのか。彼のダンス能力が何らかの儀式に利用されている可能性。
    quotes:
    - quote: 何らかの理由によりクレイだけが置き去りにされ、セスカだけが最深部に囚われている――という状況っぽい
      paragraph: p5551
    - quote: 舞い手として一流であるクレイはそのためにここで踊らされているかもしれないわけだ。
      paragraph: p5552
    expected_payoff: クレイが「踊り」を通じて地下空間の呪術的構造を維持、あるいは破壊しようとしていることが判明し、アキラたちとの合流や対立が生じる。
  - kind: mystery
    name: MY_ミルーニャの覇王としての覚醒
    note: ヒュドラボルテージがミルーニャを「メクセトの名を継ぐ真なる中原の覇王」と呼び、彼女に仕えている。ミルーニャの過去や潜在能力がどう開花するか。
    quotes:
    - quote: ミルーニャこそメクセトの名を継ぐ真なる中原の覇王であると。
      paragraph: p5557
    - quote: 「中原に轟く輝かしくも呪わしい名の数々――裁き司キャカラノート、碑文彫りジャッフハリム一世、忌み人メクセト！
      paragraph: p5557
    expected_payoff: ミルーニャが本格的に神滅具の力を制御し、あるいは「中原の覇王」としての記憶や権能を取り戻すことで、物語の戦力バランスが大きく変動する。
