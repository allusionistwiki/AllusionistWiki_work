episode: ch0064
created: '2026-10-10'
status: pending_merge
entities:
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0064_アキラ_says_見間違い_p2366
        quote: 「無いものをあると言い張ってしまうのは邪視者の悪い癖。それはきっと、何かの見間違い」 私は冷たく言い放った。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_アキラ_reveals_万能細胞_p2367
        quote: 私の身体は疑似細菌によって形成された万能細胞によって作られており、死霊使いが視覚的な死のイメージに依存して操る対象――つまり骨や肉が存在しない状態に変化可能だ。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_アキラ_says_信用できない語り手_p2371
        quote: 何故か？ リーナが普段から適当な事ばかり言っている、『信用できない語り手』だから。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_アキラ_says_大馬鹿者_p2372
        quote: 自らの下らない拘りのせいで、仲間たちに救ってもらった命を無駄に散らした大馬鹿者。ああ、確かにガルズの言う通り死は空虚だ。お前たち【骨組みの花】の死には何の意味も無かったと、他ならぬ無能なガルズが証明したのだから。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_アキラ_says_歌の受容_p2372
        quote: 今、この瞬間に世界に響いている歌が。 この歌を確かに耳にしている全ての人が、現在を受け入れてしまえば私たちの勝ちだ。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_アキラ_other_罪悪感_p2382
        quote: 私がキロンを惨たらしく殺す為の手伝いをしていることはわかっている。 酷い欺瞞。最悪の偽善。吐き気がするような私のためだけの自己満足。
        locator: {}
        spoiler_after: ch0064
    action:
      observations:
      - event_ref: E_ch0064_アキラ_uses_叙述悪戯_p2371
        quote: それと似た現象が、リーナの手記を利用して引き起こされていた。 連続した殺人の全てが曖昧な過去の中に沈んでいき、ハルベルトの死もまた同様に破綻していく。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_アキラ_fights_キロン_p2380
        quote: 裏切り者の討伐のために第五階層に向かったキロンがきぐるみの魔女トリシューラの使い魔となったアキラと激突するのは時間の問題だった。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_アキラ_other_物語素体_p2381
        quote: 設定した条件分岐に従って、用意した物語素体の呪文は想定され得る幾つかのシナリオのうち一つを採用して現実と同時に進行していくだろう。 それは、アキラを勝利に導き、キロンを敗北に導く物語。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_アキラ_other_魔導書奪取_p2405
        quote: 私は槌矛から光を伸ばして魔導書を奪い取ろうとするが、荒れ狂う暴風と天の御殿から放出される呪力の嵐によって拘束帯は弾き返されてしまう。
        locator: {}
        spoiler_after: ch0064
  first_appearance_candidate: true
- canonical_target: '[[E_char_マリー]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0064_マリー_asks_殺せて無かった_p2366
        quote: 「殺せて無かった――？」 はじまりの歌が鳴り響くのを呆然と見ているマリーは、ようやく状況を受け入れることができたようだった。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_マリー_learns_黒衣の共通項_p2367
        quote: 私とハルベルトの、黒衣とフードという共通項。 そして私たちは、同じハルベルトという名前を記号として行き来させる『お遊び』をついこの間やったばかりだ。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_マリー_says_執着_p2372
        quote: 「信仰というか、呪術的な、その――そう、執着っ、貴方に対して執着していたからっ、だから楽に暗殺するのではなく、正面から殺そうとしたんですっ」
        locator: {}
        spoiler_after: ch0064
  first_appearance_candidate: true
- canonical_target: '[[E_term_叙述悪戯]]'
  entity_type: terminology
  aspects:
    name:
      observations:
      - event_ref: E_ch0064_叙述悪戯_defines_事象改竄系過去遡及呪文_p2366
        quote: 事象改竄系過去遡及呪文【叙述悪戯】。 語りの焦点をずらし遠近感を狂わせ、時間を遡って過去の事象を再解釈し、『実はこうだった』という事実の開示（に偽装した過去改変）を行う類推呪術の一種。
        locator: {}
        spoiler_after: ch0064
  first_appearance_candidate: true
- canonical_target: '[[E_item_黒衣]]'
  entity_type: item
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch0064_黒衣_has_property_呪力増幅_p2366
        quote: 夜の民は自らの正体を隠匿することで神秘性を増幅させ、呪力を高める。呪力に満ちた黒衣の内側は呪術を働かせ易く、それゆえに自在に変身したり心の抽斗に持ち物を格納して即座に取り出したりといったことが可能である。
        locator: {}
        spoiler_after: ch0064
  first_appearance_candidate: true
- canonical_target: '[[E_char_リーナ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0064_リーナ_makes_手帳_p2368
        quote: 帽子の中から小さめの手帳を取り出して調査結果や推理を披露しようとしていたリーナが悲痛な声を上げる。
        locator: {}
        spoiler_after: ch0064
    speech:
      observations:
      - event_ref: E_ch0064_リーナ_says_台所の鍵_p2368
        quote: 「あらゆる感知呪術に引っかからない不可視の暗殺者、その正体にね！ それは美食家どもの盲点！ 地上には、公然と死霊使いが操作可能な死人たちが沢山いるんだよ！
          つまりその鍵は台所」
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_リーナ_asks_何になる_p2405
        quote: 「ガルズ！ この馬鹿！ こんなことして、何になるんだよっ」 リーナの悲痛な叫びには一切頓着することなく、ガルズはただひたすら愉快でたまらないというように哄笑する。
        locator: {}
        spoiler_after: ch0064
    action:
      observations:
      - event_ref: E_ch0064_リーナ_finds_共通点_p2370
        quote: 執念のなせる技か、リーナはほとんど全ての現場に居合わせ、その詳細を記録に残していた。
        locator: {}
        spoiler_after: ch0064
  first_appearance_candidate: true
- canonical_target: '[[E_char_ガルズ]]'
  entity_type: character
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch0064_ガルズ_functions_as_死霊使い_p2369
        quote: 全ての死は等しく空虚だと断定し、生命の根源的な恐怖心と生存欲求を邪視によって支配するガルズは、常識的に考えれば死霊使いが操れないものまで操れる。
        locator: {}
        spoiler_after: ch0064
    visual:
      observations:
      - event_ref: E_ch0064_ガルズ_appears_マリーの後頭部_p2373
        quote: マリーの長い髪を掻き分けて、後頭部から浮かび上がったガルズの顔が私たちを見上げていた。 切り裂かれもはや何も見えていないであろう両目。鋭く裂けた鼻、耳、顎下。
          傷だらけの顔面は、完全に死者の蒼白さとなっていた。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_ガルズ_transforms_死人の蜘蛛_p2374
        quote: それは浄界によって甦った【骨組みの花】の七人とガルズが融合してできた、死人の蜘蛛だ。 八つの顔の一つ、ガルズの傷だらけの顔が出ないはずの声で呟いていく。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_ガルズ_transforms_泡沫のハザーリャ_p2406
        quote: 漆黒の長衣に同色の魔導書を持ったガルズの周囲を、無数の呪力の泡が浮かんでは消える。 そのイメージが、ひとつの名前を連想させる。 泡沫のハザーリャ。
          既視感があったのも当然だ。 ガルズの雰囲気の変化は、二つの加護を同時に使いこなすハルベルトにそっくりだったのだ。
        locator: {}
        spoiler_after: ch0064
    speech:
      observations:
      - event_ref: E_ch0064_ガルズ_says_浄界_p2374
        quote: 邪視は外に向けて発動させるよりも体内に向けて発動させる方がずっと容易いからね。僕の浄界は思い描いた死の景色で現実を塗り替え、【骨組みの花】の仲間たちを甦らせる事ができる。残った頭部を死体を操作する要領で動かしていたんだよ。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_ガルズ_uses_道連れ呪術_p2403
        quote: 「両者の相似に基づいて――殺された瞬間に、殺人者を身の内に取り込む。魔将エスフェイルの道連れ呪術だ。君は良く知っているはずだ。何しろ君が詳細にこの魔導書に記録してくれたのだから。それだけじゃない、槍神教にも報告し、その情報は修道騎士の間で共有された。二度と同じ事を繰り返さない為に」
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_ガルズ_says_十三人揃った_p2404
        quote: 「これでサイリウスは死んだわけだ。君もまた一度死んでいる。生贄はこれで十三人揃った！」
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_ガルズ_says_公開処刑_p2405
        quote: 「屍の階段はここに積み上げられた――締め括りはこの上なく理想的な公開処刑！ 貴賓席の人間だけでもよかったんだけど、まさかここまで完璧な処刑になるとはね。まったく上手く行きすぎて怖いくらいだ！」
        locator: {}
        spoiler_after: ch0064
    action:
      observations:
      - event_ref: E_ch0064_ガルズ_uses_融血呪_p2374
        quote: トライデントの細胞がひとつ、右目としての能力。 四つの禁呪のひとつ、融血呪の使用。 青い流体が突如として雲の周囲を取り巻き、その内側に存在する何もかもをまとめて融け合わせていく。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_ガルズ_other_浄界_p2375
        quote: 大雑把に計算しても１，０３６，８００秒――十二日もの間邪視の奥義である浄界を維持し続けたということになる。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_ガルズ_uses_融血呪_p2385
        quote: ガルズの周囲で流動する融血呪が大波に、そして作り出された海そのものに溶け出し、逆に飲み込みつつあるのを。 小世界を浸食して体積を増していく融血呪は鋭い槍のようになると、そのまま術者へと突き進んでいく。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_ガルズ_activates_天の御殿_p2405
        quote: 天の御殿が鳴動する。 夜空が歪曲し、四つの赤い月がぐるぐると空を巡り、大地からは血の海の代わりに大量の死者が這いだしてくる。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_ガルズ_other_再生者_p2406
        quote: 天の御殿から舞い降りる死霊と虚空に浮かび上がる泡がガルズの周囲に浮かぶ。 死霊と泡が接触すると、死霊は実体を持った存在となり、確かな形でこの世に甦っていく。
          再生者――甦った者。
        locator: {}
        spoiler_after: ch0064
    name:
      observations:
      - event_ref: E_ch0064_ガルズ_names_第七魔将_p2408
        quote: 第七魔将、楽想のアケルグリュス。有翼人魚種の姫君。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_ガルズ_names_第九魔将_p2408
        quote: 第九魔将、賛同のピッチャールー。旧世界の古代兵器。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_ガルズ_names_第五魔将_p2408
        quote: 第五魔将、銀霊サジェリミーナ。銀霊種の将。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_ガルズ_names_第八魔将_p2408
        quote: 第八魔将、優美に泳ぐ蝶ハルハハール。闇妖精種の将。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_ガルズ_names_第六魔将_p2408
        quote: 第六魔将、石喰いのベフォニス。岩肌種の将。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_ガルズ_names_第十一魔将_p2408
        quote: 第十一魔将、光の幻姿ユネクティア。幻姿霊種の将。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_ガルズ_names_第十三魔将_p2408
        quote: 第十三魔将、朱大公クエスドレム。ジャッフハリムの王族たる色号使い。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_ガルズ_names_第十二魔将_p2408
        quote: ――そして第十二魔将、網膜を灼く稲妻ズタークスターク。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_ガルズ_names_第十五魔将_p2408
        quote: 第十五魔将、闇の脚エスフェイル。人狼種の将。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_ガルズ_names_第十四魔将_p2408
        quote: 第十四魔将、痩せた黒蜥蜴ダエモデク。黒蜥蜴人の将。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_ガルズ_names_第十魔将_p2408
        quote: 第十魔将、三つ首の番犬サイザクタート。虹犬種の将。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_ガルズ_names_第四魔将_p2408
        quote: 第四魔将、万殺鬼アインノーラ。牽牛種の将。
        locator: {}
        spoiler_after: ch0064
  first_appearance_candidate: true
- canonical_target: '[[E_char_サイリウス]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0064_サイリウス_other_ガルズ_p2377
        quote: ガルズからの猛攻を完全に無視しながら、サイリウスは呪術灯を振り始める。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_サイリウス_uses_質量操作呪術_p2388
        quote: 「質量操作呪術だよ。極限まで軽くした腕で加速して、接触した瞬間だけ質量を増大させて威力を高めているんだ。多分、あのペイルってムキムキな人より速くて重いんじゃないかな」
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_サイリウス_other_公開処刑の演出_p2396
        quote: サイリウスは翼耳によって声を拡大しながら会場全体に響き渡るように叫ぶ。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_サイリウス_kills_ガルズ_p2399
        quote: 老人の呪術は死体だけではなく死体を操作する魂を打ち砕き、今度こそガルズに復活を許さない死を与えたのだ。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_サイリウス_other_肉塊_p2401
        quote: 未だ崩壊していない浄界の闇空の下、屍を晒す肉塊。 その肉塊の中に同化して、苦痛と恐怖に顔を歪めながらサイリウス・ゾラ・クロウサーが蠢いていた。
        locator: {}
        spoiler_after: ch0064
    speech:
      observations:
      - event_ref: E_ch0064_サイリウス_asks_商品化_p2383
        quote: 「お前の目から見て、商品化はどの程度いけそうかと聞いている。英雄でも悪役でも良い。問題は偶像崇拝の呪力がどの程度引き出せるかどうかだ。かの歌姫と比較して、どうか」
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_サイリウス_other_リーナ_p2392
        quote: 「過去を切り捨てて見せよ。お前の意思を、ゾラの血族としての決意を一族の者らに知らしめるのだ」
        locator: {}
        spoiler_after: ch0064
    visual:
      observations:
      - event_ref: E_ch0064_サイリウス_transforms_巨人_p2390
        quote: 勢いよく膨れあがる老人の身体は、長身を通り越して巨躯と呼ぶべきものになっていた。
        locator: {}
        spoiler_after: ch0064
  first_appearance_candidate: true
- canonical_target: '[[E_char_歌姫Spear]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0064_歌姫Spear_other_ライブ_p2378
        quote: この日最大のイベントである歌姫Ｓｐｅａｒのライブは、活動の一時休止からの復活の上待望の新曲発表ということもあって注目を集めていた。 たった今歌い終わったの定番である【エスニック・ポリフォニー】だ。
          続けて間を置かずに【冬色モジュール】の軽快なイントロが流れ出した。
        locator: {}
        spoiler_after: ch0064
      - event_ref: E_ch0064_歌姫Spear_repairs_音響設備_p2386
        quote: 音響設備が異音を立てながら途切れるが、彼女は自らの歌に呪力を込め、些細な手の振りと歌とを組み合わせて呪文を発動し、会場の設備を強引に復活させる。
          異常事態にも関わらず、高位の言語魔術師は己のやるべき事を一切迷わなかった。
        locator: {}
        spoiler_after: ch0064
    name:
      observations:
      - event_ref: E_ch0064_歌姫Spear_other_カタルマリーナ_p2404
        quote: 「僕が名簿に載せた名前は歌姫Ｓｐｅａｒだ。知ってるかな、かの歌姫の最初の名は『カタルマリーナ』というのさ。不吉だと言われて炎上しただけで一度消えてしまったから、知らないのも無理はないかもしれないけど、僕はカタルマリーナ時代の彼女の歌も好きだったよ」
        locator: {}
        spoiler_after: ch0064
  first_appearance_candidate: true
- canonical_target: '[[E_char_セリアック＝ニア]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0064_セリアック＝ニア_says_幻惑ウィルス_p2384
        quote: 「杖系統の義肢に対する観衆の忌避感を考慮して、『主演者』の両腕に幻惑ウィルスを仕掛けておきましたわ。同様の措置をこの貴賓席にも。少々の事ではライブが中断されることなどありえないでしょう。と姉様は仰っています。セリアもそう思います」
        locator: {}
        spoiler_after: ch0064
