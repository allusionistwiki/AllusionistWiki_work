    note: チリアットの証言と人形劇の内容に齟齬があり、ディーテがアキラに対して特定のメッセージを伝えるために劇を改変した可能性。
    quotes:
    - quote: ディーテは、はっきりと俺に対して語りかけてきていた。あれは、俺に見せる為の人形劇だったというのは、考えすぎだろうか。
