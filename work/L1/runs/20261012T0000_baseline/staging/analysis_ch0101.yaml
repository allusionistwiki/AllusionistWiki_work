    note: 死んだはずのクレイの手だけが無傷で、レオがその「音」を不自然・不安定と感じた点。手が「手刀」を模しているという説明があるが、レオの感覚はそれ以上の何か（偽物であること、あるいは別の存在が宿っていること）を示唆している。
    quotes:
    - quote: 彼の『手』が、どうにも変な感じがして。『音』が、とっても不自然というか、不安定というか
      paragraph: p3662
    expected_payoff: クレイの手が単なる肉体の一部ではなく、何らかの呪具や別世界の存在との接続点であることが判明する。
  - kind: mystery
    name: MY_グレンデルヒの失敗した宣名
    note: 「グールェン・ドゥル・ウーフィ」と「ハタラドゥール・タラドカン・デ・ラ」の宣名時だけ効果がなく、注意が逸れた点。これらは先ほどの舞台でグレンデルヒが演じていた役名であり、演じた役と真名の間に矛盾や空白が生じた可能性を示す。
    quotes:
    - quote: グールェン・ドゥル・ウーフィに、ハタラドゥール・タラドカン・デ・ラという名前を宣言した時だけ、何も起こらなかったんです。
      paragraph: p3657
    expected_payoff: グレンデルヒの能力の弱点、あるいは彼が演じた役と彼の真のアイデンティティの間に存在する「空白」が攻略の鍵となる。
