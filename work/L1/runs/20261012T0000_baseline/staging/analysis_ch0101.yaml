  mysteries:
  - kind: mystery
    name: MY_クレイの姓の変遷
    note: クレイが「ライニンサル」→「ドーレスタ」→「クレイ・ダーカンシェル」と姓を変える現象。これは単なる名前の変更ではなく、過去改変によって彼の所属する歴史や家族関係が書き換えられていることを示唆する。
    quotes:
    - quote: 最初はライニンサルって言ったけど、何かに気付いてすぐにドーレスタって。それからしばらくして、また訂正するようにクレイ・ダーカンシェルって言い直してました
