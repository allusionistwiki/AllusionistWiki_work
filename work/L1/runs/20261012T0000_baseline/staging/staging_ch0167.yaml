        spoiler_after: ch0167
    name:
      observations:
      - event_ref: E_ch0167_オルヴァ_names_髭大夫_p5588
        quote: まことの名をオルヴァ、仮の名を『髭大夫』という老人は小さく肯きを返した。
        locator: {}
        spoiler_after: ch0167
    speech:
      observations:
      - event_ref: E_ch0167_オルヴァ_says_妥協_p5588
        quote: 「見えた――『うずめ、遂に再三の勧告に屈してボディペイントライブで妥協』――明日は彼女のファンが荒れるだろうな。心が離れた瞬間、こちらが付け入る隙が生まれる。シナモリアキラよ、脱ぐがいい」
        locator: {}
        spoiler_after: ch0167
      - event_ref: E_ch0167_オルヴァ_observes_妊婦_p5596
        quote: 「あの妊婦から妙な気配を感じた。気になってもう少し過去にさかのぼってみたのだが――奇妙なことに、地下に来る以前は妊娠していなかったようだ」
        locator: {}
        spoiler_after: ch0167
      - event_ref: E_ch0167_オルヴァ_says_純粋な再生者_p5596
        quote: 「あれは――『死せる者どもの王子』と同じ純粋な再生者になるだろう。彼ほど死の根源に近いということは無いにせよだ」
        locator: {}
        spoiler_after: ch0167
      - event_ref: E_ch0167_オルヴァ_says_女神の覚醒_p5597
        quote: 「ただひとりの純粋な再生者、それが増えるかもしれん。『死人の森』に変化が起きようとしている。あるいは、女神の覚醒が近づいているのか」
        locator: {}
        spoiler_after: ch0167
      - event_ref: E_ch0167_オルヴァ_promises_呪縛の解除_p5610
        quote: 「これも何かの縁だ。絡まりほつれた人の環の呪縛、私が解きほぐしてみせよう」
        locator: {}
        spoiler_after: ch0167
  first_appearance_candidate: true
