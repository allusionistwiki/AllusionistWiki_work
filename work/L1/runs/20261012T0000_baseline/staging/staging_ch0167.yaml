    action:
      observations:
      - event_ref: E_ch0167_アキラ_fights_イツノ_p5586
        quote: そのまま義肢の制御に割り込みをかけて『大蛇』の横っ面に平手を叩きつけた。
        locator: {}
        spoiler_after: ch0167
      - event_ref: E_ch0167_アキラ_travels_外出_p5587
        quote: 『俺』の方はもともと使っていた義体を利用すれば活動可能だ。偵察や情報収集などできることは幾らでもある。
        locator: {}
        spoiler_after: ch0167
      - event_ref: E_ch0167_アキラ_stops_カシュラム人_p5588
        quote: 全て言い終わらないうちに顎を掴んで強引に閉じさせた。
        locator: {}
        spoiler_after: ch0167
      - event_ref: E_ch0167_アキラ_stops_オルヴァ_p5589
        quote: 「承知した――ブレイ」「おい」素早く顎を押さえつけた。
        locator: {}
        spoiler_after: ch0167
      - event_ref: E_ch0167_アキラ_stops_オルヴァ_p5603
        quote: 「ブ」老人が唇を震わせた瞬間、二つの機械義肢が同時に動いた。長く伸びた念動アームが上から、俺の左手が下から、老人の頭と顎を挟み込んだのだ。
        locator: {}
        spoiler_after: ch0167
    speech:
      observations:
      - event_ref: E_ch0167_アキラ_says_内的闘争_p5586
        quote: 「落ち着け。今はお前の内的闘争に付き合う気は無いし、それは完成じゃない」
        locator: {}
        spoiler_after: ch0167
      - event_ref: E_ch0167_アキラ_thinks_統合_p5586
        quote: いや、『私』は正常だ。これこそ私／俺の完成に必要な統合なのだから。
        locator: {}
        spoiler_after: ch0167
      - event_ref: E_ch0167_アキラ_thinks_地雷_p5587
        quote: とにかく顔がいいのでアイドル活動には必要な人材であるのだが、これからは十分に気を付けなければならないだろう。中身が地雷過ぎる。
        locator: {}
        spoiler_after: ch0167
      - event_ref: E_ch0167_アキラ_thinks_遊び_p5597
        quote: 俺たちがアイドル活動なんかをやっていられるのも、この空間にどこか『遊び』があるからだろう。
        locator: {}
        spoiler_after: ch0167
      - event_ref: E_ch0167_アキラ_fears_破滅_p5611
        quote: こう言っては何だが、破滅の予感しかしない。俺と『眠り棺』は寒気を感じたかのようにぞっと身を震わせた。
        locator: {}
        spoiler_after: ch0167
  first_appearance_candidate: true
