  mysteries:
  - kind: mystery
    name: MY_オルヴァの回想とノーグの創造
    note: オルヴァ王が「未来を回想し、過去へ旅立つ」と決意し、その直後に「ノーグという血脈は、その瞬間に創造された」と記述される。この因果関係が、時間遡行による自己創生（ブートストラップ・パラドックス）なのか、あるいは世界改変の開始なのか。
    quotes:
    - quote: そう、必要なのは未来を回想し、過去へ旅立つことだったのではないか。
      paragraph: p5085
    - quote: ノーグという血脈は、その瞬間に創造された。
      paragraph: p5086
    expected_payoff: オルヴァの行動が物語の起源そのものに関与していることが判明し、彼の動機や能力の本質が明かされる。
  - kind: mystery
    name: MY_プーハニアの肉体改造
    note: プーハニアが「シナモリアキラ用の交換部品」として肉体を改造されていたことに気づく。誰が、いつ、なぜ彼を部品として扱っていたのか。
    quotes:
    - quote: 気づけば肉体を改造され、シナモリアキラ用の交換部品にされていた。
      paragraph: p5093
    expected_payoff: プーハニアの過去や、シナモリアキラという概念の物理的・技術的な実態（あるいは悪意ある利用）が明かされる。
  - kind: mystery
    name: MY_老人の頭痛と感情の復活
    note: 感情を失った吸血鬼の老人が、殺しのたびに頭痛を感じ始める。これは「七色表情筋トレーニング」による擬似感情が本物の感情へと変質し始めている兆候か、それとも別の呪いや副作用か。
    quotes:
    - quote: 老人は、ちかごろ殺しのたびに頭痛が酷くなるのを感じていた。
      paragraph: p5099
    - quote: 疑似細菌は『最適』が変化したことを鋭敏に察知して、その性質を少しずつ変化させていく。
      paragraph: p5099
    expected_payoff: 老人が再び人間らしい感情を取り戻す過程、あるいはその代償としての悲劇的な結末が描かれる。
  - kind: mystery
    name: MY_殺人鬼のナイフの正体
    note: 自警団の解析を拒否し、攻性防壁を持つ「生きた意思」を持つナイフ。その正体は「神滅具」「古代文明の遺産」「聖遺物」のいずれでもない。
    quotes:
    - quote: それらとは根本的に異質な『生きた意思』を感じる。
      paragraph: p5102
    expected_payoff: ナイフの真の由来、あるいは殺人鬼との関係性が明かされ、物語の核心に触れる手がかりとなる。
  - kind: mystery
    name: MY_品森晶のアニマ統合
    note: 品森晶が「アニマとしてアニムスを打倒し統合する」と語り、自己の解体と再構築を「内宇宙戦争」と呼ぶ。この統合が成功するのか、あるいは破綻するのか。
    quotes:
    - quote: 私はアニマだから。アニムスを打倒し、統合することを求めている。
      paragraph: p5109
    expected_payoff: 晶の人格の統合、あるいは分裂による能力の覚醒・暴走が描かれ、彼女が「シナモリアキラ」の概念にどう関わるかが決着する。
  - kind: mystery
    name: MY_シナモリアキラのモジュール化
    note: シナモリアキラという概念が「腕だけ、脚だけ、頭だけ」などのモジュールに解体され、各モジュールが独立して動き出す。
    quotes:
    - quote: シナモリアキラという紀人は解体され、複数の要素として検討され、再解釈されていく。
      paragraph: p5112
    expected_payoff: シナモリアキラという「主人公」の定義が崩壊し、複数のキャラクターがそれぞれ異なる側面を担う群像劇へと展開する。
