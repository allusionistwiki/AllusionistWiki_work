entities:
- canonical_target: '[[E_char_古き神]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0051_古き神_names_アズーリア_p2004
        quote: 君のフィリスと同じようにね。つまり、君たちは揃って狂人というわけさ。だからこそ、こんな事ができるわけだ。
        locator: {}
        spoiler_after: ch0051
      - event_ref: E_ch0051_古き神_says_アズーリア_p2004
        quote: 物事には流れというものがある。それに逆らうことなく、更なる速度を求めて疾走する――これは努力すればどうにか可能だ。無茶という程でもない。実はある程度までなら誰にでもできる。遅くするのはとても大変で、堰き止めるのはもっと大変。逆流するのは狂気の沙汰、というわけだ。
        locator: {}
        spoiler_after: ch0051
      - event_ref: E_ch0051_古き神_confesses_ロディニオへの放逐_p2005
        quote: 確かにえこひいきが過ぎるかもしれないね。ロディニオの向こうまで放逐してしまったのはちょっとやり過ぎだったかもしれない。
        locator: {}
        spoiler_after: ch0051
      - event_ref: E_ch0051_古き神_defines_影の子供たち_p2005
        quote: 僕が伸ばした手足であり分身である子供たち――四種に分かれた中で最も純粋な『影』である君たちは普段僕のことを認識することはできない。せいぜい夢の中で深層意識の泡が微かに触れて、それを『神託』とか『お告げ』とか言って言語化する程度だ。
        locator: {}
        spoiler_after: ch0051
      - event_ref: E_ch0051_古き神_says_プリエステラの死_p2006
        quote: 諦めなさい。どうやってもプリエステラは死ぬよ。いや、死んだ方がマシな結果になる、かな。ここで助かってもロクな結果にならないんだ。もっと酷いことになる。
        locator: {}
        spoiler_after: ch0051
      - event_ref: E_ch0051_古き神_says_プリエステラを見捨てる_p2006
        quote: 彼女が生きていると、とても不都合な事が起きてしまう。世界そのものを揺るがしかねない――それこそ、この世界を引き裂いて滅茶苦茶にしてしまうような天災が起きてしまうんだ。このどうしようもない繰り返しを抜け出す方法は一つだ。アズーリア。プリエステラを見捨てるんだ。
        locator: {}
        spoiler_after: ch0051
      - event_ref: E_ch0051_古き神_says_身代わりの死_p2007
        quote: 方法なら一応あるよ。同じだけの強い運命を保有する誰かが代わりに死ねばいい。幸い、君とその仲間たちはそうした資質に恵まれている。
        locator: {}
        spoiler_after: ch0051
      - event_ref: E_ch0051_古き神_threatens_アズーリア_p2007
        quote: アズーリア。君が犠牲になることは許さない。当然だろう。可愛い子供が死のうとしているのを止めない親はそういないと思うよ。僕は結構過保護なんだ。そもそも君が死んでしまった後、残された人達はどうするつもりだい？
          大切な妹を救い出すっていう目的を見失ってはいけないよ。
        locator: {}
        spoiler_after: ch0051
      - event_ref: E_ch0051_古き神_says_フィリスの浸食_p2008
        quote: フィリスに浸食されたぶんは巻き戻らないんだから。特異点としての性質が強まるから僕から力を引き出しやすくなるけど、他の神格からも干渉されやすくなるってことも覚えておいてくれよ。
        locator: {}
        spoiler_after: ch0051
      - event_ref: E_ch0051_古き神_says_後悔_p2008
        quote: 後悔するよ、アズーリア。君は必ず後悔する。彼女がここで死んでおかなかった為に、これからどれだけの血が流れ、どれだけの嘆きが広がり続けるのか。
        locator: {}
        spoiler_after: ch0051
      - event_ref: E_ch0051_古き神_says_あり得ない手_p2009
        quote: 危険を恐れず、今までやらなかった事をやってみなさい。あり得ない結果を生むために、一番あり得ない手に縋るんだ。もうわかっただろう、アズーリア？
          それがこの状況を全員無事に抜け出せるであろう、恐らく唯一の可能性だ。
        locator: {}
        spoiler_after: ch0051
      - event_ref: E_ch0051_古き神_says_第五階層の民_p2009
        quote: 第五階層に送り出したティリビナの民たちに、しっかりと気を配っておくんだ。いいかいアズーリア。関わったからには最後まで責任を持ちなさい。パレルノ山から護送して『はいおしまい』とはいかないよ。
        locator: {}
        spoiler_after: ch0051
      - event_ref: E_ch0051_古き神_names_アズーリア_p2010
        quote: 君はプリエステラやクナータと同じものだよ。珍しくも無い。どの眷族種にも一人は必ずいるんだから。色々あったせいで、覚醒が少しばかり遅れてしまったけれど。君は紛れもなく、僕の依巫だ。
        locator: {}
        spoiler_after: ch0051
  first_appearance_candidate: true
- canonical_target: '[[E_char_聖女クナータ]]'
