      - event_ref: E_ch0051_聖女クナータ_is_made_of_時十字の瞳_p2004
        quote: 聖女クナータはどうなんだって？ うん、あれは例外中の例外。だからこそ火竜復活の鍵となりうる存在なんだ。魔将たちが血眼になって彼女の首を取りに来るわけだよね。首というか眼球か。彼女の【時十字の瞳】もまた紀元槍の制御盤ってやつなんだよ。
        locator: {}
        spoiler_after: ch0051
  first_appearance_candidate: true
- canonical_target: '[[E_char_アズーリア]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0051_アズーリア_uses_フィリス_p2005
        quote: こんな風に直接会話のようなことができているのは、君がフィリスで紀元槍にアクセスしているからだ。
        locator: {}
        spoiler_after: ch0051
      - event_ref: E_ch0051_アズーリア_uses_万色彩星_p2013
        quote: 【万色彩星】でサリアの時間遡行能力を複製して同じ『距離』だけ遡れる
        locator: {}
        spoiler_after: ch0051
    speech:
      observations:
      - event_ref: E_ch0051_アズーリア_says_ガルズ・マウザ・クロウサーとマリー_p2019
        quote: 私の考えた、あり得ない奇策。それは、「ガルズ・マウザ・クロウサーとマリー。あの二人が倒される前に接触して、協力を仰ぐ」
        locator: {}
        spoiler_after: ch0051
  first_appearance_candidate: true
- canonical_target: '[[E_term_世界の修正力]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch0051_世界の修正力_functions_as_カタルマリーナとビークレットの亡霊_p2006
        quote: 今回の理不尽な出来事、つまりはカタルマリーナとビークレットの亡霊が君たちを襲うという災厄はね、彼女を消す為に世界の修正力が働いた結果なんだ。大抵の不運というやつは、そういう運命の帳尻合わせが露骨過ぎて可視化された結果なんだな。
        locator: {}
        spoiler_after: ch0051
  first_appearance_candidate: true
- canonical_target: '[[E_char_サリア]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0051_サリア_uses_実体が存在しない呪具_p2012
        quote: 彼女は古代の夜の民が作り出した『実体が存在しない呪具』を己の影に装備しており、その力によって私と同じように自在にスキリシアに侵入できるのだ。
        locator: {}
        spoiler_after: ch0051
    speech:
      observations:
      - event_ref: E_ch0051_サリア_confesses_コアとの喧嘩_p2015
        quote: その――今、ちょっと喧嘩してて『繋がり』切っちゃってるの。だからこっちの事も伝わりにくくなってるし――ちょっと怒らせちゃったからあっちも苛ついてるみたいで、どの周回でも口論みたいになって
        locator: {}
        spoiler_after: ch0051
      - event_ref: E_ch0051_サリア_says_使い魔の立場_p2017
        quote: 「そもそも、私は本来コアを守る使い魔なんだから。状況が切迫してるからといってもコアを頼るなんてできない。立場が逆でしょ」
        locator: {}
        spoiler_after: ch0051
      - event_ref: E_ch0051_サリア_says_グロソラリア_p2018
        quote: ここには運命を破壊し得る強力なグロソラリアが二人もいる。一人ぶんの『死の必然』くらいどうにでもできるに決まってる
        locator: {}
        spoiler_after: ch0051
      - event_ref: E_ch0051_サリア_says_古き神_p2018
        quote: 古き神の言うことなんて話半分に聞いておいた方がいいわよ。アルマの奴もピュクティエトの神託なんてほとんど無視してるし あいつらは結局、人間を手駒にして自分の都合のいいように世界をねじ曲げたいだけ。
        locator: {}
        spoiler_after: ch0051
  first_appearance_candidate: true
- canonical_target: '[[E_term_未来の私]]'
  entity_type: terminology
  aspects:
