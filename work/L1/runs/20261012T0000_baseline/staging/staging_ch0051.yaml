      observations:
      - event_ref: E_ch0051_未来の私_other_未来回想_p2013
        quote: それはどこかの未来で私が再現した聖女クナータの【未来回想】で、それによって未来の情報を過去の私に強制的に送信したのだとしばらくして理解できた。それは『失敗した私』『何も出来なかった私』の最後の悪足掻きだった。
        locator: {}
        spoiler_after: ch0051
  first_appearance_candidate: true
