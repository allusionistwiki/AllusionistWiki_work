entities:
- canonical_target: '[[E_char_チリアット]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0245_チリアット_flees_ダエモデク_p7982
        quote: とある理由から魔将ダエモデクの軍勢から逃亡していた彼は、迷宮内部で逃げ隠れする日々を送っていた。
        locator: {}
        spoiler_after: ch0245
      - event_ref: E_ch0245_チリアット_fights_ユディーア_p7983
        quote: 背後に存在する病院には無辜の民、そして守り抜かねばならない名無しの王。逃げるわけにはいかない。負けるわけにはいかない。
        locator: {}
        spoiler_after: ch0245
      - event_ref: E_ch0245_チリアット_observes_三眼瞬知_p7983
        quote: その術理は知っていた。天眼の民が用いる奥義、三眼瞬知。時を止め、神速を得るという恐るべきまじないである。
        locator: {}
        spoiler_after: ch0245
      - event_ref: E_ch0245_チリアット_defeats_ユディーア_p7984
        quote: 鋭いカウンターの拳は神速をわずかに上回る神速。強烈な打撃をまともに受けた女は吹き飛ばされてから数度バウンドして倒れ、即座にはね起きた。
        locator: {}
        spoiler_after: ch0245
      - event_ref: E_ch0245_チリアット_transforms_臨死加速_p7984
        quote: やがて限界を迎えた精神が破綻して臨死に近い変性意識状態に移行、思考速度が現実の速度を超過して知覚が限界以上に拡大していく。
        locator: {}
        spoiler_after: ch0245
      - event_ref: E_ch0245_チリアット_uses_寿命消費_p7985
        quote: 代償による呪術の強化。その代表例が寿命の消費だ。彼は死から遠ざかる代償として、己の命を削っていた。
        locator: {}
        spoiler_after: ch0245
      - event_ref: E_ch0245_チリアット_activates_ディシルキュトス_p7986
        quote: 「うおおおお死にたくない～！　ウィッチオーダー十六番・ディシルキュトス！」泣き言を叫びつつも頭は冷静に戦闘を続行していた。右腕は黒鉄と融け合うような黒鱗。回収された魔将ダエモデクの細胞を利用した寄生異獣。生物と人工物が融合した漆黒の義肢が、『創造』を重ねることで新たな形態に生まれ変わる。
        locator: {}
        spoiler_after: ch0245
    visual:
      observations:
      - event_ref: E_ch0245_チリアット_has_property_恵まれた体躯_p7982
        quote: 二メートルを超えた長身。はちきれんばかりの筋肉。
        locator: {}
        spoiler_after: ch0245
      - event_ref: E_ch0245_チリアット_is_made_of_牙猪氏族_p7982
        quote: 己に向かって弧を描く独特の牙を持った牙猪氏族の猪人だ。
        locator: {}
        spoiler_after: ch0245
      - event_ref: E_ch0245_チリアット_has_property_天寿値72歳_p7986
        quote: 現在、チリアットの天寿値は７２歳。４２歳であるチリアットに残された天寿値は３０歳ぶんとなる。その数値が、先ほどの回避で２９歳になったことを感じたチリアットは「ひゅっ」と息を吸い込んだ。
        locator: {}
        spoiler_after: ch0245
    relationship:
      observations:
      - event_ref: E_ch0245_チリアット_helps_ガロアンディアン_p7982
        quote: そんな彼にトリシューラが手を差し伸べたことから、成り行きでガロアンディアン勢力に手を貸し続けることになった。
        locator: {}
        spoiler_after: ch0245
      - event_ref: E_ch0245_チリアット_is_made_of_シャルマキヒュ眷属_p7984
        quote: 紀神シャルマキヒュの眷属。すなわち彼の加護系統は天眼の民である。
        locator: {}
        spoiler_after: ch0245
    speech:
      observations:
