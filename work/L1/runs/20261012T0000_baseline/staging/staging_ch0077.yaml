        quote: 露わになったのは、異形の右腕。 しわくちゃになった顔が、右の掌に張り付いていた。 人面疽という呪術が存在するが、男の奇怪な腕もそれを応用したものだろう。
          開いた掌には複製、縮小された男自身の顔が張り付いている。
        locator: {}
        spoiler_after: ch0077
