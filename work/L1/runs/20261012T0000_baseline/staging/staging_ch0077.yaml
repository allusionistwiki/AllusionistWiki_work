    name:
      observations:
      - event_ref: E_ch0077_ウィクトーリア_names_ウィクトーリア_p2890
        quote: 「ようこそ旦那様――当館の主人、ウィクトーリアと申します」
        locator: {}
        spoiler_after: ch0077
    action:
      observations:
      - event_ref: E_ch0077_ウィクトーリア_other_カイン_p2892
        quote: 「あら。甘えんぼさんですね。それじゃあ、みんなにはちょっとだけ我慢してもらいましょうか」 その言葉こそが呪文であったかのように、全ての異変がかき消えた。
        locator: {}
        spoiler_after: ch0077
      - event_ref: E_ch0077_ウィクトーリア_kills_カイン_p2901
        quote: 「ああ――ごめんなさい。子供たちが、少しやんちゃをしてしまったみたいです。本当に悪戯好きで――でも、けっして悪い子たちじゃないんですよ？」
        locator: {}
        spoiler_after: ch0077
    speech:
      observations:
      - event_ref: E_ch0077_ウィクトーリア_promises_おいた禁止_p2893
        quote: 「一つだけ、約束です。この中では決して『おいた』はしないこと。一夜の夢は、儚く優しく、そして醒めれば何事も無く当たり前の生活に帰るために――」
        locator: {}
        spoiler_after: ch0077
      - event_ref: E_ch0077_ウィクトーリア_says_痛みへの反応_p2899
        quote: 「それに、大した痛みではありません――どんな男性のものだって、赤ちゃんの頭に比べたら可愛らしいものでしょう？」
        locator: {}
        spoiler_after: ch0077
      - event_ref: E_ch0077_ウィクトーリア_says_ママ_p2902
        quote: 「大丈夫ですよー怖くないですよー。ほうら、私が貴方のママですからねー♪」 悪夢の泡がふわりと浮かび、やがて弾けた。
        locator: {}
        spoiler_after: ch0077
