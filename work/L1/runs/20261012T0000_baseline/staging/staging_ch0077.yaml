      - event_ref: E_ch0077_彼女_fears_灰色_p2873
        quote: あの灰色は、なにより綺麗な苦しみを、あっけなく塗りつぶしてしまった。 なんてひどい。 なんて傲慢。
        locator: {}
        spoiler_after: ch0077
