  mysteries:
  - kind: mystery
    name: MY_アーザノエルの正体
    note: トリシューラや氷の少女に似ているが別個体であり、「私の棲み家」と呼ぶ場所の所有者。アキラの「想像力」から作られた茶を振る舞うなど、アキラの内面や神話の深層に関わる存在である可能性が高い。
    quotes:
    - quote: 赤い髪、緑の瞳、黒銀の躯体、そして良く観察すれば半身たる氷の少女に似ているとわかる顔の造作。
      paragraph: p4221
    - quote: 「私の棲み家にようこそ。歓迎する、品森晶」
      paragraph: p4221
    expected_payoff: アキラの精神構造の核、あるいは世界を構成する「原初の混沌」の管理者としての役割が明かされる。
  - kind: mystery
    name: MY_アイゼルネハント社の関連性
    note: ゾーイのゴッツアンデルスの兵装が、アキラがかつて使用していた右腕と同じメーカー製であることが明かされた。トライデントホールディングスとの関係も含め、単なる偶然ではない可能性。
    quotes:
    - quote: これは本当に偶然だけど、シナモリアキラ君がかつて使用していた右腕と同じアイゼルネハント社製の兵装だったりするんだよね
      paragraph: p4260
    expected_payoff: トライデントホールディングスと外世界人、あるいはアキラの過去との隠された繋がり、あるいは技術流出の真相が判明する。
  - kind: mystery
    name: MY_グレンデルヒの予言と戦国時代
    note: グレンデルヒが消滅直前に、アキラたちの行動が「取り返しのつかない災厄」を呼び、第五階層が血みどろの戦国時代に入ると予言した。
    quotes:
    - quote: これより、この内世界は血みどろの戦国時代に突入するぞ。お前たちの行動の代償は高くつくであろう
      paragraph: p4251
    expected_payoff: 今後の展開で、第五階層の勢力図が激変し、複数の強敵や派閥が絡む大規模な争いが勃発する。
  - kind: mystery
    name: MY_ゾーイのサイバーカラテ黒帯化
    note: トリシューラが、ゾーイがサイバーカラテの黒帯レベルになればアキラを直接降ろすことが可能になると示唆した。
    quotes:
    - quote: ゾーイがサイバーカラテの黒帯レベルになれば、アキラくんをその身に直接降ろすことも可能になるでしょう？
      paragraph: p4274
    expected_payoff: ゾーイがアキラの「器」として再登場し、あるいは別世界での戦いでアキラの力の一部として活躍する展開が訪れる。
  - kind: mystery
    name: MY_アルレッキーノとしてのグレンデルヒ
    note: グレンデルヒが「アルレッキーノ」としてサイバーカラテ内部に組み込まれ、道化師として拘束された。彼の英雄としての権威がどのように利用されるか。
    quotes:
    - quote: 異界の名で呪縛されたグレンデルヒがその形を変えていき、道化師のような拘束具で自由を奪われる。
      paragraph: p4268
    expected_payoff: グレンデルヒの知識や権威が、アキラの戦闘能力の一部として、あるいは物語のメタ的な語り手として機能する。
  themes:
  - kind: theme
    theme: 自己同一性は他者との関係性（役者・観客・部品）によってのみ構成される
    weight: 0.9
    quotes:
    - quote: 俺はマラコーダの端整な顔で片目を閉じてみせた。おお、凄い、ウィンクが綺麗にできる。
      paragraph: p4237
    - quote: 『自己』とは、心という抽象的な概念だけに宿るのでも、脳という器質的な実体だけに宿るのでもない。
      paragraph: p4246
    note: アキラが複数の人格や身体部品、さらには観客の視座によって「演じられ」、その結果として存在が強化される過程が描かれている。
  - kind: theme
    theme: 市場経済の論理を超えた「無価値」の肯定と再生
    weight: 0.8
    quotes:
    - quote: 人間には価値があり、俺の値札はマイナスだということ。単純な理屈だ。
      paragraph: p4219
    - quote: 私はね、アキラくん。別にあなたじゃなくてもいい。そして、私はあなたの、そういう凡庸な、あなたじゃなくてもいい所ゆえにあなたを欲するの
      paragraph: p4249
    note: 冒頭で「赤字・違法」とされた存在が、交換可能性そのものを価値とする「杖」の原理によって、市場論理の外側で再生・昇華される。
  - kind: theme
    theme: 集合知の混沌と非合理性の受容
    weight: 0.7
    quotes:
    - quote: 不合理が合理となる、その有様を呪術的と呼び表す。
      paragraph: p4229
    - quote: これは融合じゃない。愚かな反発と激突だらけの、でたらめな不協和音の集積は綺麗な音楽なんて響かせない。これは混沌。
      paragraph: p4248
    note: サイバーカラテがあらゆる矛盾を内包し、取捨選択を放棄することで生まれる「混沌」こそが、新しい秩序（神話）を生む源であるとする思想。
  - kind: theme
    theme: 身体性の拡張と技術の継承
    weight: 0.6
    quotes:
    - quote: 身体性の拡張という視座に根ざした思考の枠組みである以上、俺たちはそれに従うだけだ。
      paragraph: p4222
    - quote: 身体性の拡張――それは増設、補綴された人工的部位であり、受け継がれ精練された技術、流派でもある。
      paragraph: p4234
    note: 義肢や強化外骨格、さらには他者の身体や記憶を「補綴（パッチワーク）」することで、個人の限界を超えた存在へと至る過程。
