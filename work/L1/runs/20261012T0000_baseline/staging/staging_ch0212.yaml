        locator: {}
        spoiler_after: ch0212
      - event_ref: E_ch0212_アイシャ_other_イルス_p7171
        quote: 床に横たえた兄の頭部に手を添えたアイシャは小さく呪文を唱え始めた。その儀式を眺めながら、ウネムは冷ややかに言った。
        locator: {}
        spoiler_after: ch0212
    visual:
      observations:
