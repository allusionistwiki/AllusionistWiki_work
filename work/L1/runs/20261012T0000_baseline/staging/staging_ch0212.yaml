        locator: {}
        spoiler_after: ch0212
      - event_ref: E_ch0212_アイシャ_says_兄さんのせいじゃない_p7170
        quote: 「これは私たちの意思。だから、何があっても兄さんのせいじゃない」
        locator: {}
        spoiler_after: ch0212
    action:
      observations:
