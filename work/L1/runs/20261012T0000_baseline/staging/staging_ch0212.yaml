        locator: {}
        spoiler_after: ch0212
      - event_ref: E_ch0212_アイシャ_confesses_裏切り者_p7156
        quote: 「もう帰る場所なんてない。イルハムはずっと戻ってないから知らないでしょう？　私は裏切り者。彼らにとって私たちは分断者でしかないの」
        locator: {}
        spoiler_after: ch0212
      - event_ref: E_ch0212_アイシャ_defines_知識層_p7156
        quote: 「人種が違うってこと。本大陸の思想で洗脳された『知識層』はね、もう黒檀の民じゃない。彼らを分断する悪魔の手先」
        locator: {}
        spoiler_after: ch0212
      - event_ref: E_ch0212_アイシャ_says_ガリヨンテ_p7158
        quote: 「大いなるガリヨンテの名において」　実体のない木々の間を抜けて精神が飛翔していくその途中、アイシャは小さく呪文のようなものを唱えた。
        locator: {}
        spoiler_after: ch0212
      - event_ref: E_ch0212_アイシャ_confesses_憎悪_p7159
