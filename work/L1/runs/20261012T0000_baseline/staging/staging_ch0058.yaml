        quote: マリーは黒衣を膨らませて小さな有翼の牡鹿に変身した。　まだ幼いからか、枝角の分岐は三本までだ。
        locator: {}
        spoiler_after: ch0058
  first_appearance_candidate: true
- canonical_target: '[[E_char_リーナ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0058_リーナ_hides_黒百合宮の境界線_p2199
        quote: 正確には裏庭と黒百合宮の敷地の外の境界線上にいた。　生垣の上でふよふよと浮遊しながら、リーナはぼんやりと空を眺めていたのだ。
        locator: {}
        spoiler_after: ch0058
      - event_ref: E_ch0058_リーナ_makes_雲の筆談_p2199
        quote: 朝と夜が混在した黒百合宮の上空で、二人は周囲に漂う雲を千切っては呪術で形を変えて、雲の筆談を行う。
        locator: {}
        spoiler_after: ch0058
      - event_ref: E_ch0058_リーナ_travels_空_p2199
