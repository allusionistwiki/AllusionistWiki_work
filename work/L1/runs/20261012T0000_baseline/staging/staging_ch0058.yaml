        spoiler_after: ch0058
      - event_ref: E_ch0058_マリー_says_授業からの逃亡_p2205
        quote: 『逃げてきた。呪術生命のお勉強って言って、引っ張ったりつついたり変な薬をかけられたりするの。今まではお菓子くれるから我慢してたけど、もう騙されない』
        locator: {}
        spoiler_after: ch0058
      - event_ref: E_ch0058_マリー_other_飛翔の条件_p2206
        quote: 『今は夜でもあるから、頑張れば飛べる。リーナの飛翔術の効果範囲内にいればすぐに落ちないと思う』
        locator: {}
        spoiler_after: ch0058
      - event_ref: E_ch0058_マリー_other_手伝い_p2206
        quote: 『手伝うよ？』
        locator: {}
        spoiler_after: ch0058
      - event_ref: E_ch0058_マリー_other_上下への逃亡_p2206
