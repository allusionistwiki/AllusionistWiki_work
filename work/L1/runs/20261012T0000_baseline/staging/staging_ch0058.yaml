        spoiler_after: ch0058
      - event_ref: E_ch0058_リーナ_flees_強制された仲_p2218
        quote: 嫌いな訳ではない。　ただ、強制されて仲良くするのは嫌だった。　『ほんとう』の仲の良さだと思っていたものを、何かの窮屈な枠に押し込められてしまうのが、たまらなく苦痛だった。
        locator: {}
        spoiler_after: ch0058
      - event_ref: E_ch0058_リーナ_observes_夢_p2218
