        spoiler_after: ch0058
      - event_ref: E_ch0058_リーナ_thinks_母の意図_p2217
        quote: わけのわからない発想だったけれど、母親は多分、己の結婚に不満を抱いているのだろう。　だから娘には自由を与えたいと願うのだ。
        locator: {}
        spoiler_after: ch0058
