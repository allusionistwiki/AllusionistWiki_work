        locator: {}
        spoiler_after: ch0058
      - event_ref: E_ch0058_リーナ_finds_自由_p2216
        quote: 息苦しい不自由の中で、ひとつでもいいから何か自由を見つけなさい。　そう教えられたリーナは、飛翔術にその自由を見出した。
