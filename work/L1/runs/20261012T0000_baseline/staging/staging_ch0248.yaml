  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0248_レナリア_names_フルグント六柱_p8027
        quote: 六つに連なる宣名のコイン。『死神の腕』シェロン、『弱者の盗人』クラララリア、『刈り取る者』ティーアードゥ、『猫の死』ダーカンシェル、『こぼれない鎌』ラウス、そして『外れない矢』レメス。
        locator: {}
