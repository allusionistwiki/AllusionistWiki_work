      - event_ref: E_ch0248_レナリア_says_ディスケイムの血統作品_p8027
        quote: 「別にいいでしょ、それが私たちの在り方なんだから！ アテンプレクとユディーアを前にして手段なんて選べない！ ティーアードゥとダーカンシェルの神威で満たされたディスケイムの血統作品！
          私たちはその両方を手に入れるの！」
        locator: {}
        spoiler_after: ch0248
