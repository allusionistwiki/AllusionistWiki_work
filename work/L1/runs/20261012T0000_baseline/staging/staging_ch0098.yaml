- canonical_target: '[[E_term_舞台]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch0098_舞台_functions_as_ゲーム盤_p3588
        quote: これは舞台というゲーム盤で、展開を操作し、役を奪い合うという勝負なのだ。 俺とチリアット、グレンデルヒとゾーイ、そしてコルセスカと死人の森の女王。『役』と『役者』のペアに分かれて、それぞれが更に別の役を演じ、舞台に干渉し、展開を操作するという、即興だらけの演劇遊戯。
        locator: {}
        spoiler_after: ch0098
  first_appearance_candidate: true
- canonical_target: '[[E_char_マラード王]]'
