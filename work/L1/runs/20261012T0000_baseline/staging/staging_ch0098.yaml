entities:
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0098_アキラ_asks_コルセスカの意識乗っ取り_p3586
        quote: 「――知っていたのか、コルセスカの意識が死人の森の女王に乗っ取られかけていたことを」
        locator: {}
        spoiler_after: ch0098
      - event_ref: E_ch0098_アキラ_asks_ラクルラール_p3586
        quote: 「それに何なんだ、あのラクルラールとかいうのは」
        locator: {}
        spoiler_after: ch0098
      - event_ref: E_ch0098_アキラ_remembers_トリシューラの言葉_p3587
        quote: その名前には聞き覚えがある。 トリシューラが言っていた、いずれ乗り越えるべき壁――。
        locator: {}
        spoiler_after: ch0098
      - event_ref: E_ch0098_アキラ_remembers_ラフディの悲劇_p3590
        quote: 「『ラフディの悲劇』だったか。ここ最近受けてたトリシューラの講義でも、コルセスカとやったゲームでも出てきたから良く覚えてる。史実、なんだよな」
        locator: {}
        spoiler_after: ch0098
      - event_ref: E_ch0098_アキラ_says_昔々あるところに_p3595
        quote: 俺とチリアットの口が同時に開いて、過去への扉が開かれた。「昔々、あるところに、ひとりの王さまがいました――」
        locator: {}
        spoiler_after: ch0098
    action:
      observations:
      - event_ref: E_ch0098_アキラ_other_コルセスカ_p3586
        quote: 完全に破綻した劇が幕を引いた後、俺はすぐさま主を求めて劇場内を駆けずり回った。しかし、ヴィヴィ＝イヴロスが展開している浄界の中をどれだけ探しても、雪の中に消えていった冬の魔女の姿は見つからなかった。
        locator: {}
        spoiler_after: ch0098
    relationship:
      observations:
      - event_ref: E_ch0098_アキラ_suspects_ヴィヴィ＝イヴロス_p3586
        quote: 俺には男装の麗人の落ち着きを払った態度が、どうにも胡散臭く感じられてならなかった。
        locator: {}
        spoiler_after: ch0098
    visual:
      observations:
      - event_ref: E_ch0098_アキラ_observes_現実の変容_p3595
        quote: その言葉が引き金であったかのように、現実の変容は引き起こされた。 死人の森の女王が人形劇によって過去への干渉を行ったように、俺たちもまた『昔話』という一種の呪文によっていにしえのガロアンディアンへと旅立とうとしているのだと、歪んでいく風景が教えてくれた。
        locator: {}
        spoiler_after: ch0098
  first_appearance_candidate: true
- canonical_target: '[[E_char_ヴィヴィ＝イヴロス]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0098_ヴィヴィ＝イヴロス_appears_アキラ_p3586
        quote: 「気は済んだかい？」 声をかけてきたのは劇場の主、キュトスの魔女ヴィヴィ＝イヴロス。
        locator: {}
        spoiler_after: ch0098
      - event_ref: E_ch0098_ヴィヴィ＝イヴロス_confesses_コルセスカの自覚_p3587
        quote: 「やれやれ、質問は一度に一つにして欲しいものだね。まあいい。まず最初の質問だが、知っていたよ。そして、彼女はそれを理解した上で自ら乗り越えようとしている。あるいは、受け入れようとしているのかな」
        locator: {}
        spoiler_after: ch0098
      - event_ref: E_ch0098_ヴィヴィ＝イヴロス_other_人格の多重化と消滅_p3587
        quote: 「未知数だ。人格を多重化して共存する場合もあれば、片方が打ち勝ってどちらかが消滅、ないし封じ込められることもある。あるいは、統合されてしまうことも。その場合、以前までのコルセスカとの同一性は保証できないが」
        locator: {}
        spoiler_after: ch0098
      - event_ref: E_ch0098_ヴィヴィ＝イヴロス_defines_ラクルラール_p3588
        quote: 「ああ、ついでに言えば、ラクルラールはただの史実だ。アレはそういう来歴を持っているというだけの話。今は零落した球神ドルネスタンルフが人に授けたという叡智にして神造の遺物、それがアレの起源であると言われているよ」
        locator: {}
        spoiler_after: ch0098
      - event_ref: E_ch0098_ヴィヴィ＝イヴロス_other_コルセスカの内部闘争_p3588
        quote: 「恐らくコルセスカは今も自らの内側で戦いを続けている。もしかしたらそれは戦いと言うよりも対話や交渉に近いのかもしれないが、とにかくそういうことだ」
        locator: {}
        spoiler_after: ch0098
      - event_ref: E_ch0098_ヴィヴィ＝イヴロス_names_ガロアンディアン_p3589
        quote: 「次の舞台はガロアンディアンだったよな」「ああ。古に存在した竜王国。トリシューラが第五階層に建国するにあたって参考にしたのがその国だ」
        locator: {}
        spoiler_after: ch0098
      - event_ref: E_ch0098_ヴィヴィ＝イヴロス_other_マラードの暗愚_p3590
        quote: 「ああ。物語などでは良く美化されているが、歴史上最も暗愚な王は誰かと問われれば、『虐殺王マラード』は真っ先に出てくる名前の一つだ。混乱と対立を収めようとして人狼系移民の『問題を解決』した――その後長きに渡る人狼種族の受難はとてもここで語りきれるようなものではないが、その発端とも言われているのがあの男だよ」
        locator: {}
        spoiler_after: ch0098
      - event_ref: E_ch0098_ヴィヴィ＝イヴロス_other_状況の切迫_p3591
        quote: 「だが、縋る相手を選んでいられる状況ではないのではないかな？」
        locator: {}
        spoiler_after: ch0098
      - event_ref: E_ch0098_ヴィヴィ＝イヴロス_reveals_過去の王六人_p3592
        quote: 「ちなみに」と魔女が補足した。「君が関わることになる過去の王は六人だ。その中には、ドラトリアの建国王カーティス一世も含まれている。まあ、当時は王国ではなかったのだが」
        locator: {}
        spoiler_after: ch0098
    visual:
      observations:
      - event_ref: E_ch0098_ヴィヴィ＝イヴロス_has_property_威圧への耐性_p3586
        quote: チリアットの体格は彼女を大きく上回るというのに、威圧に対してまるで臆したところが無い。それどころか、下手をすればこちらが気圧されかねない余裕のようなものが見受けられた。
        locator: {}
        spoiler_after: ch0098
  first_appearance_candidate: true
