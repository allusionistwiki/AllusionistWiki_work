      - event_ref: E_ch0098_四方の王_defeats_呪わしき恐怖の化身_p3594
        quote: 伝承によれば、当時ジャッフハリムで暴虐を振るっていたという『呪わしき恐怖の化身』と四方の王は、結束した小国の連合と運命に導かれて集った四十人の強者たちによって倒され、心を入れ替えた四方の王はそれ以来ジャッフハリムを守る勇士の一員になったということです」
        locator: {}
        spoiler_after: ch0098
  first_appearance_candidate: true
