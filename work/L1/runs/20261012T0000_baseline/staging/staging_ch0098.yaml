        quote: 本来の筋書きはこうだ。 マラード王は霊王フィフウィブレス＝ハルハハールに『美しさ』で勝負を挑む。 どれだけ多くの女性を誘惑できるかという競い合いで勝利した王は、自信を喪失して弱体化した霊王を追い返すことに成功する。
        locator: {}
        spoiler_after: ch0098
  first_appearance_candidate: true
