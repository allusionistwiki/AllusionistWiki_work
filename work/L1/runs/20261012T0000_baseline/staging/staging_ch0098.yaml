- canonical_target: '[[E_term_チリアット]]'
  entity_type: terminology
  aspects:
    speech:
      observations:
      - event_ref: E_ch0098_チリアット_confesses_ダエモデクへの裏切り_p3593
        quote: 「俺はかつてジャッフハリムが誇る四十四人の勇士にして第十四魔将であるダエモデクに仕えていました。俺にとって彼は尊敬すべき主であり、恩人であり、かけがえのない友人だった。お、俺は、そんな彼を命惜しさにみ、見捨て、て――」
        locator: {}
        spoiler_after: ch0098
      - event_ref: E_ch0098_チリアット_says_ガロアンディアンとの縁_p3593
        quote: 「師範代、古きガロアンディアンに関してですが、俺はそれについて幾ばくかの知識、そして縁があります」
        locator: {}
        spoiler_after: ch0098
      - event_ref: E_ch0098_チリアット_other_四十四士と四方の王_p3594
        quote: 「四十四士は偉大なるレストロオセ様に忠誠を誓う下方勢力きっての勇者たちですが、その中で最も強き力を有していた四方の王はレストロオセ様とあくまで対等な存在でありました。
        locator: {}
        spoiler_after: ch0098
    action:
      observations:
      - event_ref: E_ch0098_チリアット_other_アキラの腕_p3593
        quote: 決意を新たにしていたそのとき、俺は右腕がひとりでに動いて左腕に触れていることに気付いた。チリアットが何かを伝えたがっているのを察して、意識の中で問いかける。
        locator: {}
        spoiler_after: ch0098
  first_appearance_candidate: true
