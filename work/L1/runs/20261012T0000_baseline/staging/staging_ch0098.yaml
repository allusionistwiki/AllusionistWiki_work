        quote: 「我が主にして親愛なるダエモデクは悠久の時を生きる長命の亜竜。彼はいつか俺に語ってくれた事があります。己の半身、兄弟、好敵手、どのようにも喩えがたい、緑の亜竜のことについて」
        locator: {}
