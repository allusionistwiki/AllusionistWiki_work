- canonical_target: '[[E_item_マリー]]'
  entity_type: item
  aspects:
    visual:
      observations:
      - event_ref: E_ch0045_マリー_appears_アズーリア_p1863
        quote: どんよりとした虚ろな目。慢性的な不眠にでも悩まされているかのような隈が出来ている眼窩。そして顔色は蒼白。荒れ放題の長い髪はとても不健康。
        locator: {}
        spoiler_after: ch0045
      - event_ref: E_ch0045_マリー_appears_as_絵画のモデル_p1867
        quote: その中に混じって、唯一生者を描いた人物画があった。頭蓋骨を持った少女。柔らかに微笑む幼い美貌。
        locator: {}
        spoiler_after: ch0045
      - event_ref: E_ch0045_マリー_uses_骨の花_p1874
        quote: 放射状に伸びる鋭角の花弁。白くおぞましく咲き誇る骨の花。中央には金色の眼球。
        locator: {}
        spoiler_after: ch0045
    speech:
      observations:
      - event_ref: E_ch0045_マリー_says_存在の謝罪_p1864
        quote: 「なんか、すみません。ぶつかってしまってすみません。生まれてきてすみません。私が存在したのがそもそもの間違いでした」
        locator: {}
        spoiler_after: ch0045
      - event_ref: E_ch0045_マリー_asks_絵の購入_p1868
        quote: 「あのう、ここにある絵、少しでも気に入ったものがあったら買っていただけないでしょうか。そんなに高いものではないのです」
        locator: {}
        spoiler_after: ch0045
      - event_ref: E_ch0045_マリー_names_左目_p1874
        quote: 「私は『左目』のマリー。力作を何度も壊されて傷付きました。つらいのであなたたちを殺して私も死にます」
        locator: {}
        spoiler_after: ch0045
    action:
      observations:
      - event_ref: E_ch0045_マリー_other_ガルズ_p1873
        quote: しかし、目の前に立ちはだかったマリーがそれを妨げた。長い黒髪を振り乱しながら驚くべき速度で間合いを詰めると、どこからともなく取り出した槌で私の攻撃を止めたのだ。
        locator: {}
        spoiler_after: ch0045
  first_appearance_candidate: true
- canonical_target: '[[E_char_ガルズ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0045_ガルズ_makes_死の風景画_p1865
        quote: 描き出されていたのは、写実的なものではなく、非現実の風景画。死んだ街だ。道行く人々は服を着た白骨か、至る所から中身をこぼしていく腐乱死体。
        locator: {}
        spoiler_after: ch0045
      - event_ref: E_ch0045_ガルズ_uses_ペンタブレット_p1866
        quote: 男の座る丸椅子の下に、接触感応式の描画用端末が見えた。
        locator: {}
        spoiler_after: ch0045
      - event_ref: E_ch0045_ガルズ_makes_動く死体画_p1867
        quote: 動く死体。腐乱した身体で乾杯し、頭蓋骨の隙間から果実酒をこぼしていく。
        locator: {}
        spoiler_after: ch0045
      - event_ref: E_ch0045_ガルズ_has_property_邪視_p1870
        quote: 輝かんばかりに美しい金眼の中央で、黒目があらゆる光を飲み込もうとして口を開いている。邪視。
        locator: {}
        spoiler_after: ch0045
    speech:
      observations:
      - event_ref: E_ch0045_ガルズ_says_朽ちていくこと_p1868
        quote: 「僕は静かに絵を描きながら飢えて朽ちていく。それが自然でありあるがままの人の在り方だ」
        locator: {}
        spoiler_after: ch0045
      - event_ref: E_ch0045_ガルズ_promises_一緒に死ぬこと_p1869
        quote: 「君には苦労をかけて申し訳無いと思っているよ、マリー。だから一緒に死のう」
        locator: {}
        spoiler_after: ch0045
      - event_ref: E_ch0045_ガルズ_names_右目_p1871
        quote: 「使い魔のグロソラリア――いや、こう言うべきかな。僕はトライデントの細胞が一人。与えられた器官名は『右目』。まことの名はガルズ・マウザ・クロウサー。」
        locator: {}
        spoiler_after: ch0045
      - event_ref: E_ch0045_ガルズ_threatens_十三人の殺害_p1872
        quote: 「これから十三日後――１，１２３，２００秒後に大規模な葬送式典が行われるね。僕はそれまでに十三人を殺す。」
        locator: {}
        spoiler_after: ch0045
      - event_ref: E_ch0045_ガルズ_says_アズーリアとの同一性_p1873
        quote: 「同じだよ。君は屍の上に立つ影喰いじゃないか。死の匂いがこびりついているよ。臭い臭い、僕とおんなじ人でなしだ」
        locator: {}
        spoiler_after: ch0045
      - event_ref: E_ch0045_ガルズ_is_located_浄界の支配者_p1876
        quote: 今のガルズは、この空間の掌握者だ。第五階層の奧で待ち構えていたエスフェイルと同格かそれ以上の敵だと言っても過言ではない。
        locator: {}
        spoiler_after: ch0045
    action:
      observations:
      - event_ref: E_ch0045_ガルズ_activates_浄界_p1875
        quote: 「【浄界】――ヴァニタス・ヴァニタートゥム」直後、世界が一変した。
        locator: {}
        spoiler_after: ch0045
