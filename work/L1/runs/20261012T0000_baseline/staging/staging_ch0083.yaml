- canonical_target: '[[E_char_トリシューラ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0083_トリシューラ_defines_心_p3032
        quote: 心とは、脳を含む肉体の全てでありその認識が及ぶ連関全てだ。少なくともトリシューラはそう定義している。
        locator: {}
        spoiler_after: ch0083
      - event_ref: E_ch0083_トリシューラ_fears_言語魔術師試験_p3037
        quote: 同じく準一級である彼女は、きっと今回の試験で一級になるだろう。自分が落ちていてはお話にならない。たとえ専門分野でなくてもだ。
        locator: {}
        spoiler_after: ch0083
      - event_ref: E_ch0083_トリシューラ_other_クレイの捕縛_p3042
        quote: （アキラくん。手持ちの端末に【陥穽】あったでしょう。それで捕縛しといて）
        locator: {}
        spoiler_after: ch0083
      - event_ref: E_ch0083_トリシューラ_requires_誓約_p3064
        quote: 内容は簡単。この第五階層の『女王』に忠誠を誓うこと」
        locator: {}
        spoiler_after: ch0083
      - event_ref: E_ch0083_トリシューラ_other_アキラ_p3071
        quote: 「それはねえ。嫉妬だよ」「は？」「私が別の人を足蹴にして、屈伏させようとしたからむっとしちゃったんだよね」
        locator: {}
        spoiler_after: ch0083
      - event_ref: E_ch0083_トリシューラ_promises_アキラ_p3073
        quote: 「ずっと、離してあげないから」そして、宣言する。魔女のように。女王のように。獣のように。俺を咥えて離さない、獰猛な笑みを浮かべて。
        locator: {}
        spoiler_after: ch0083
    action:
      observations:
      - event_ref: E_ch0083_トリシューラ_uses_ちびシューラ_p3032
        quote: 破壊された脳細胞を『ちびシューラ』を原型としたプログラムと機械に置き換え、人格を傷つけるばかりのここでの記憶を全て消去した後、そこにいるのが果たして元の『その人』なのかどうかは定かでない。
        locator: {}
        spoiler_after: ch0083
      - event_ref: E_ch0083_トリシューラ_other_カルカブリーナの懇願_p3036
        quote: 「うん、いいよ」――少しだけ、思うところがあったけれど。柔らかく微笑んで、トリシューラは嘆願を聞き入れた。
        locator: {}
        spoiler_after: ch0083
      - event_ref: E_ch0083_トリシューラ_gives_突撃小銃_p3066
        quote: 「俺は、銃なんて――」「そうだね。今までの貴方はボウガンまでが限界だった。けれど【マレブランケ】としてはそれじゃまだ足りないな。階梯を昇って、その覚悟の程を私に見せて――カルカブリーナ」
        locator: {}
        spoiler_after: ch0083
      - event_ref: E_ch0083_トリシューラ_other_バル・ア・ムント_p3068
        quote: 呪術医としてトリシューラが駆けつけ、その場で治療を開始する。迅速な救命措置によって壮年の修道騎士の首が繋がり、やがて息を吹き返した。
        locator: {}
        spoiler_after: ch0083
  first_appearance_candidate: true
- canonical_target: '[[E_char_バル・ア・ムント]]'
