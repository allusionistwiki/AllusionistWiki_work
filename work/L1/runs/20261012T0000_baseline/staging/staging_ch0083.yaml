        locator: {}
        spoiler_after: ch0083
      - event_ref: E_ch0083_バル・ア・ムント_says_経歴_p3045
        quote: 「何の因果か、当時の団長が弱らせた巨人を倒して十位になっちまってよ。それ以来は前線の防衛指揮と地上勤務を行ったり来たりだ」
        locator: {}
        spoiler_after: ch0083
