        locator: {}
        spoiler_after: ch0083
      - event_ref: E_ch0083_クレイ_flees_アキラ_p3069
        quote: 「俺は――認めない。僣主は殺す、『女王』の敵は俺が一人残らず斬って捨てる。必ず――必ずだ。いずれ、貴様も斬る。勝負は預けるぞ、シナモリ・アキラ」
        locator: {}
        spoiler_after: ch0083
    speech:
      observations:
      - event_ref: E_ch0083_クレイ_reveals_ダモクレスの剣_p3050
        quote: 「あれはこの虚栄の王国を切り裂く剣だ。選定された担い手が女王を斬り殺すことで、かの剣を支えるか細い糸は断ち切られ、『滅び』が墜ちてくる」
        locator: {}
        spoiler_after: ch0083
      - event_ref: E_ch0083_クレイ_asks_解放_p3063
        quote: 「俺を解放しろ、僣主トリシューラ」クレイが、倒れた状態のまま要求した。
        locator: {}
        spoiler_after: ch0083
