      - event_ref: E_ch0201_クレイ_says_コルセスカへの忠誠_p6760
        quote: 「俺も似たようなものだ。この身は『死人の森』に捧げられたが、今はコルセスカお嬢様の行く末を見届けるために在る一振りの剣。冬の魔女伝説がどの結末に至るにせよ、この立場が最もお嬢様の望みを叶えるのに適していると判断した」
        locator: {}
        spoiler_after: ch0201
      - event_ref: E_ch0201_クレイ_says_英雄譚の準備_p6761
        quote: と、その片目がぱっと開き、内側から極小の銀河と軽薄な声が溢れ出す。「そーそー。火竜退治の英雄譚を演じるならまずは小道具と役者を揃えなきゃ！
          聖女の血、『心臓』の目覚め、俺たち四円とコキュートス！」
        locator: {}
