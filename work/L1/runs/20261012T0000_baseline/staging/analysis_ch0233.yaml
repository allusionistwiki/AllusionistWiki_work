  mysteries:
  - kind: mystery
    name: MY_王殺しの正体と潜伏場所
    note: 王殺しが会場内に潜伏しているという設定。コルセスカとのコラボという名目で隠されているが、その正体とトリシューラ暗殺の真意が不明。
    quotes:
    - quote: 『王殺し』の幻像に一瞬ノイズが走り、それから静止。画面中央に『王殺し潜伏中』の文字が大きく表示された。
      paragraph: p7661
    - quote: ご本人はプロ意識の塊なので既に会場への潜伏を開始しているとのこと。
      paragraph: p7662
    expected_payoff: レースの最中や終盤で、王殺しがトリシューラに接近し、暗殺劇が勃発する、あるいはその正体が判明する。
  - kind: mystery
    name: MY_クリーナー＆ダストの正体と能力
    note: 経歴不明、名前も偽名と思われる謎の参加者。コイントスで全て表を出すという異常な運の強さを持つ。
    quotes:
    - quote: 経歴一切不明、おそらく名前も偽名！もしや誰かの兄弟か？！
      paragraph: p7672
    - quote: その表示は全て表。槍が示すのは勝利の刻印だ。「俺は最高にツイてる。だから勝つ」
      paragraph: p7673
    expected_payoff: レース中に運命操作系の能力を発揮し、他の選手を翻弄する。あるいはパーンやリーナとの因縁が明かされる。
  - kind: mystery
    name: MY_夢界レースの危険性と朱の天主の意図
    note: 休憩中に夢界へダイブし、精神に試練を与えるという異例のルール。朱の天主が協力している点に不自然さがある。
    quotes:
    - quote: 選手たちは睡眠中に夢界へとダイブ！朱の天主の協力で可能となった夢の世界でのレースは選手たちの精神に試練を与えます！
      paragraph: p7665
    - quote: 事前に知らされていなかった情報に関係者たちにも動揺が広がる。機械女王と朱の天主に繋がりがあるという事実。
      paragraph: p7665
    expected_payoff: 夢界での出来事が現実の精神状態や記憶に影響を与え、レースの勝敗やキャラクター間の関係に変化をもたらす。
  - kind: mystery
    name: MY_ミシャルヒとカーズガンの握手の真意
    note: 敵対する二大陣営の英雄が公の場で握手をするという歴史的瞬間。これが公式な和解なのか、単なるパフォーマンスなのか不明。
    quotes:
    - quote: しかし両者はあろうことか人々の前で互いの手を握り合った。握手。ガロアンディアンでの意味は疑いようもなく友好を示すものだ。
      paragraph: p7677
    - quote: 果たしてこれは両陣営の公式な態度なのか？それともこの場だけの形式的なもの？
      paragraph: p7677
    expected_payoff: この握手がきっかけで、両陣営間の緊張関係が変化するか、あるいは裏で別の動き（戦争の準備など）が進んでいることが判明する。
  - kind: mystery
    name: MY_リーナの軽薄さの裏側
    note: クロウサー家当主としての真剣勝負の場でありながら、お祭りモードを貫き、チョコレートを食べている。その余裕の正体は何か。
    quotes:
    - quote: 当主の座を巡る真剣勝負の舞台だとか、歴史ある呪術儀式だとか、茶番めいた人質騒動があったばかりだとか、そういう細かい事情を全て無視するかのような軽薄な振る舞い。
      paragraph: p7675
    - quote: 完全に浮かれており、口の端のチョコレートが屋台食べ歩きの可能性を示唆していた。
      paragraph: p7675
    expected_payoff: レース中にパーンを圧倒する実力を見せつけるか、あるいは何か重大な秘密（例：既に勝敗が決まっている、など）を握っていることが明かされる。
  themes:
  - kind: theme
