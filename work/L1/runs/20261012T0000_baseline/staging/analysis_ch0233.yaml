  - kind: theme
    theme: 偽りの平和と砂上の楼閣
    weight: 0.6
    quotes:
    - quote: 祝祭の日。人々はわずかな時間、砂上の楼閣を幻視した。見かけ上の平穏の先、甘い誘惑を囁く楽園を夢想する。
