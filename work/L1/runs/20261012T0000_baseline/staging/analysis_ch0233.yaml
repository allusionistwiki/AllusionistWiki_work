      paragraph: p7659
    - quote: 写真は祝祭の記憶そのものだ。異質な景色を記録する、未知なる世界の非日常。
      paragraph: p7660
    note: カメラが魂を奪う凶器から記録装置へ変容した過程は、技術が現実認識や歴史の書き換えを支配する権力構造を示唆する。
  - kind: theme
