entities:
- canonical_target: '[[E_char_エリカ]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0228_エリカ_activates_緑神再生_p7516
        quote: 「緑神、再生！」 ミュークリマ 名称は違う。だが発動したのは現代呪術における奥義のひとつ、 浄界に相当する時空干渉。
        locator: {}
        spoiler_after: ch0228
      - event_ref: E_ch0228_エリカ_uses_エリカ独自の呪術観_p7517
        quote: 鈴国圏における色号論をベースにしているが、ティリビナの精霊術を混交させたエリカ独自の呪術観を反映させた術。
        locator: {}
        spoiler_after: ch0228
      - event_ref: E_ch0228_エリカ_other_キノコ人_p7517
        quote: 「全員、この場から離れてっ」 配下のキノコ人たちに警告を発した瞬間、無意味だと気づく。
        locator: {}
        spoiler_after: ch0228
      - event_ref: E_ch0228_エリカ_other_フォーメーション_p7519
        quote: 「『運び屋』と『宿し手』は竜呪を保持して地之四へ！ 『根守り』は虹射之一から外壁の突破を試みて可能なら増援要請を！ それ以外の者は星蟹、空鯨を抑えて防御陣形！」
        locator: {}
        spoiler_after: ch0228
      - event_ref: E_ch0228_エリカ_uses_陽閃_p7519
        quote: 暗所と閉所を苦手とするヘリオトロープは既に役立たず。 そもそも『陽閃』は洞窟の深部では使えない。
        locator: {}
        spoiler_after: ch0228
      - event_ref: E_ch0228_エリカ_says_ヘイトスピーチ_p7520
        quote: 「ヘイトスピーチでねえか！ かあっ、これだから都会もんは。差別はいけねえな。ティリビナ同胞団が炎上してまうぞ」
        locator: {}
        spoiler_after: ch0228
      - event_ref: E_ch0228_エリカ_says_夜鳴き刃_p7521
        quote: 「『夜鳴き刃』は常夜灯のように輝く」
        locator: {}
        spoiler_after: ch0228
      - event_ref: E_ch0228_エリカ_other_岩穿ち_p7522
        quote: 『静謐』を使わされるほどの高位呪術。加えてトロル呪術師が得意とする呪術基盤となれば十中八九、『岩穿ち』と見て間違いない。
        locator: {}
        spoiler_after: ch0228
      - event_ref: E_ch0228_エリカ_uses_インク_p7522
        quote: 曲刀に組み込んだ『鍵呪』を隠蔽。心門と魂扉を開き精霊を体内 キーワード に招き入れる。体内の藍神だけでどこまでやれるか。 クリマ 「銀詩よ開け！
          恵みの慈雨、育みの地脈、知恵の血脈、滴りの歌」 インク
        locator: {}
        spoiler_after: ch0228
      - event_ref: E_ch0228_エリカ_names_フローラ_p7542
        quote: 「私は『植物想』。祝祭を彩る、はじまりよりも古き者」 フローラ
        locator: {}
        spoiler_after: ch0228
    action:
      observations:
      - event_ref: E_ch0228_エリカ_observes_一方的な塗り替え_p7517
        quote: だがこの時に起きた事象は全く違った。 一方的な世界の塗り替え。 エリカの森はさしたる抵抗もないまま勝利し、一帯を染め上げていた。
        locator: {}
        spoiler_after: ch0228
      - event_ref: E_ch0228_エリカ_makes_トピアリー_p7519
        quote: 構築した仮想使い魔は造園呪術の応用だ。 トピアリー 咄嗟に地上から持ち込むことに成功した植物を加工。 動物を象る擬人化／擬獣化のまじないが、緑のフクロウとなって翼を広げた。
        locator: {}
        spoiler_after: ch0228
      - event_ref: E_ch0228_エリカ_transforms_夜鳴き刃_p7520
        quote: フクロウの形状を変化させ、使い魔に注いでいた精霊のリソースを変換。 鉤爪を中心に薄く鋭く引き伸ばされたそれは一振りの曲刀だった。
        locator: {}
        spoiler_after: ch0228
      - event_ref: E_ch0228_エリカ_uses_フクロウ_p7520
        quote: 呼び出したフクロウに呪文を書き込み、前方へと射出する。「翼運ぶ逢瀬の詩人よ、恋のように激しく食らいつけ！」
        locator: {}
        spoiler_after: ch0228
      - event_ref: E_ch0228_エリカ_fights_塗壁_p7521
        quote: まず斬りかかったのはエリカ。「文明の光が照らす岩の通り道」「そんなら、ほい。隘路に足を踏み入れれば」「っ西方より流れる大河の支流、地下に張り巡らされ」「栄えたる都の陰に嘆きは沈みぃ」「北に聳え立つ塔は石畳を割る強き」「雑草」「広がりゆく北東原野の鍵穴！」
        locator: {}
        spoiler_after: ch0228
      - event_ref: E_ch0228_エリカ_uses_オルガンローデ_p7523
        quote: 「けほっ、『運び屋』、『宿し手』、使って！」 もはや私情で出し惜しみをしている場合ではない。 エリカの切り札のひとつ、銀竜草滅呪は設置型だが、キノコ人を
          オルガンローデ 媒介とすることで自在に移動させることが可能だった。
        locator: {}
        spoiler_after: ch0228
      - event_ref: E_ch0228_エリカ_uses_霧の防壁_p7523
        quote: 高位呪術の構築は間に合わない。 咄嗟に『霧の防壁』を展開するが、一枚では減衰が足りない。 半減した威力のぶちかましで細い身体が吹き飛び、壁面に叩きつけられる。
        locator: {}
        spoiler_after: ch0228
      - event_ref: E_ch0228_エリカ_uses_修復_p7524
        quote: 苦痛の中で見上げた草花の竜は二体。勇ましく咆哮し、怪物に襲い掛かる。
        locator: {}
        spoiler_after: ch0228
      - event_ref: E_ch0228_エリカ_uses_風蝕刃_p7525
        quote: その場しのぎで『霧の防壁』を重ねて距離を稼ぎ、霧を巻き込むようにして『風蝕刃』を発動。合成呪文が水牛の赤色を削り石像の 頭部を削るが、『岩穿ちの剣』本体は無傷。
        locator: {}
        spoiler_after: ch0228
      - event_ref: E_ch0228_エリカ_loses_夜鳴き刃_p7526
        quote: 逆転した都市の象徴が空転し、行き場を失った『夜鳴き刃』の価値が急落する。 気付けばエリカは完封されていた。
        locator: {}
        spoiler_after: ch0228
      - event_ref: E_ch0228_エリカ_dies_上半身_p7527
        quote: ばくん。 岩石の呪文竜の口が閉じられ、エリカ・モノトロープの上半身が消失した。 血を噴き出しながら下半身が崩れ落ち、からんと音を立てて錫杖が倒れる。
        locator: {}
        spoiler_after: ch0228
      - event_ref: E_ch0228_エリカ_other_深み_p7527
        quote: 致命的な死。その終焉をどこか他人事のように客観視しつつ、呑み込まれた闇の中で意識を手放した。そうして、彼女は微睡むよう に深みへと沈んでいく。
        locator: {}
        spoiler_after: ch0228
      - event_ref: E_ch0228_エリカ_transforms_緑神彩域_p7539
        quote: かつてティリビナ人の女神レルプレアが成し遂げた、緑神彩域の再生。
        locator: {}
        spoiler_after: ch0228
      - event_ref: E_ch0228_エリカ_bonds_ハチェット_p7541
        quote: 混乱の中、高速で推測を重ねる『塗壁』を他所に樹妖精と歌妖精が契約を交わす。 二人は宙を舞うように闇の中で踊り、掌を合わせて見つめ合った。
        locator: {}
        spoiler_after: ch0228
    visual:
      observations:
      - event_ref: E_ch0228_エリカ_observes_暗い森_p7517
        quote: 彼女の視界に映るのは陽光の差し込まない暗い森の奥深く。 周囲を囲う大小のキノコが幻惑の紫霧を辺りに撒き散らす。
