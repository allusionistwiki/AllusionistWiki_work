      - event_ref: E_ch0228_エリカ_transforms_ドレス_p7540
        quote: 花開くようにローブはドレスへと変容し、下向きに咲く花のようなスカートと緑に染まった長い髪には色とりどりの花が飾られていた。 エリカを示す記号であった銀フードが持ち上がる。
        locator: {}
        spoiler_after: ch0228
      - event_ref: E_ch0228_エリカ_appears_as_プリエステラ_p7541
