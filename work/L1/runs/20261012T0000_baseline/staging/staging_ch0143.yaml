      - event_ref: E_ch0143_ルバーブ_other_少年_p4858
        quote: 地面に倒れた相手を見下ろして、驚きに目を見開いた。少年だった。驚愕すべきはその容貌である。
        locator: {}
        spoiler_after: ch0143
      - event_ref: E_ch0143_ルバーブ_other_マラード_p4864
        quote: 私は卑しく醜いルバーブ。王に傅き、その美貌を際立たせる忠実なしもべ。貴いものに従属する幸福を噛みしめる日々。
        locator: {}
        spoiler_after: ch0143
    speech:
      observations:
      - event_ref: E_ch0143_ルバーブ_remembers_陛下との会話_p4853
        quote: 「ヴァージルは、俺に父親になって欲しいそうだ」「彼は危険です。あの毒婦もですが、同盟者は慎重に選ぶべきでしょう、陛下」「しかし、機械女王に対抗するには二人の力は必要ではないか？
          見ろ、この黒く染まった妖精と、力ある紋章を」
        locator: {}
        spoiler_after: ch0143
      - event_ref: E_ch0143_ルバーブ_confesses_セレス姫への愛_p4855
        quote: 「だが俺はやはり唯一の物語が欲しいのだ。俺にとってセレス姫は唯一無二。彼女の遊戯を、彼女の物語を、我がものにしたいと願うのは傲慢だろうか？」
        locator: {}
        spoiler_after: ch0143
      - event_ref: E_ch0143_ルバーブ_says_恋の罪深さ_p4856
        quote: 「世の恋は、全て罪深い悪徳に堕するでしょう」
        locator: {}
        spoiler_after: ch0143
