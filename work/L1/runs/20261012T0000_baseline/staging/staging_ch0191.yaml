        locator: {}
        spoiler_after: ch0191
      - event_ref: E_ch0191_シナモリアキラ_other_習合_p6306
        quote: 「断る。お前の一部になる気はない。それと俺はシナモリアキラだ。前世のことはだいたい忘れた。殺し屋だっけ？ 何の話か覚えてねえよ」
        locator: {}
        spoiler_after: ch0191
