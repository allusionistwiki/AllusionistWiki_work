      - event_ref: E_ch0271_ジーゼロ_activates_自動整備システム_p8408
        quote: 続けて機体の上部装甲がスライドして内部構造が露出。自動整備システムの働きによってマイクロチップが排出される。自動音声がセキュリティソフトのアンインストールを告げ、ワクチン呪文の消去と自然派自己免疫システムの導入を開始。
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_ジーゼロ_attacks_テセト_p8425
        quote: その直後だった。ジーゼロが内包した呪詛を展開し、自爆の呪文を解放しながらとどめとばかりにテセトに突っ込んでいく。
        locator: {}
        spoiler_after: ch0271
    speech:
      observations:
      - event_ref: E_ch0271_ジーゼロ_says_ヨグウム社の監視陰謀_p8408
        quote: 告発する。ヨグウム社の製品には全てマイクロチップが埋め込まれており、密かに国民を監視している。抜き取られた個人情報は全てクロウサー家およびディープステートに流れており、不穏分子と見なされた場合は黒服の男たちによって拉致され、安全性の確かめられていない霊薬の実験体となり闇に葬られてしまうのだ
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_ジーゼロ_says_太陰文明の否定_p8408
        quote: 太陰文明はでっちあげ。聖絶はなかった。エーラマーンのフェイクニュースを信じてはならない。疫病型吸血鬼はドラトリア政府が開発した生物兵器で大神院と裏で繋がっている。これらすべてにディープステートが関与している
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_ジーゼロ_says_情報開示の要求_p8416
        quote: 政府は正しい情報を開示せよ！ 偏向報道をやめろ！ 国民の洗脳教育をただちに廃止し、世界の真実を子供たちに伝えろ！
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_ジーゼロ_says_混沌の叫び_p8417
        quote: 太陽のコロナはデマ！ 神授説によって王に与えられたコロナはフェイク！ 吸血鬼由来のワクチンは世界を影から支配しようとするスキリシアの陰謀！
          ティリビナ人工作員による世論誘導を許すな！ ティリビナの巫女はゴム人間！ 中身は枯れ木族の化け物！ 修道騎士には『下』のレプティリアンスパイが紛れ込んでいる！
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_ジーゼロ_says_バイトテロの裁き_p8423
        quote: 傲慢な義国のブラック企業どもに天誅を下す。これはバイトテロではない。お前たちの傲慢に対する裁きである。もだえ苦しんで死ね
        locator: {}
        spoiler_after: ch0271
    visual:
      observations:
      - event_ref: E_ch0271_ジーゼロ_wears_ティンホイル・ヘッドギア_p8408
        quote: 無人機ジーゼロの単眼宝珠が、いつの間にか出現していたティンホイル・ヘッドギアで覆われている。この導体篭は単に周囲の光学情報を遮断するだけのものではない。毒電波呪文による思考盗聴から身を守るための防衛機構だ。
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_ジーゼロ_makes_労働者の惨劇の幻像_p8423
        quote: たった一人で激務をこなす外国人労働者の目の前で、喉を押さえて次々と客が倒れていく。男の瞳にあるのは世界全てに対する憎悪。本物の『バイトテロ』が引き起こした惨劇がリーナの悪ふざけと相乗効果を引き起こし、延焼に次ぐ延焼が猛火を招き、暗い熱がアストラルネットを焼いた。
        locator: {}
        spoiler_after: ch0271
  first_appearance_candidate: true
- canonical_target: '[[E_term_テセト]]'
  entity_type: terminology
  aspects:
    action:
      observations:
      - event_ref: E_ch0271_テセト_other_陰謀論呪文_p8409
        quote: 波濤の如き陰謀論呪文の連射を、テセトはたじろぐ様子もなく受け止めている。 常日頃から荒れ狂う情報の乱流を制御している彼にとって、陰謀論は慣れ親しんだものでしかない。
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_テセト_loses_火消し_p8424
        quote: リーナの炎上速度にテセトの火消しが追い付けない。 熟練の呪文使いの胃に穴が開き、円形脱毛症になり、若々しく保たれていたテセトの容貌はやつれてボロボロになっていく。
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_テセト_other_リーナ_p8427
        quote: 空中で跪き、扇を閉じてから胸に手を当てて礼をする。 七つ風のひとりが、確かに己の主を認めた瞬間だった。
        locator: {}
        spoiler_after: ch0271
    speech:
      observations:
      - event_ref: E_ch0271_テセト_says_叡智の翻訳の必要性_p8415
        quote: 万民が叡智に辿り着くことはできない。叡智は抽出され、選別され、わかりやすく翻訳されなければならない。さもなくば人々は荒野の中で迷い、道を見失って困窮するのみです。その果てに待つのは悲劇でしょう
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_テセト_asks_情報統制解除の結果_p8416
        quote: では今から私がこの扇を畳み、広げていた言の葉の風を凪ぐように方針転換したとしましょう。どうなると思いますか？
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_テセト_asks_リーナの決断_p8417
        quote: さあ、リーナ様。より良い物語をお選び下さい。この私めの傲慢な風を打ち破るのか。大衆を家畜の如く飼い馴らすモーエン様の慈愛を砕くのか。あなた様が進むべき行き先、リーナ様だけの『道』とはどのようなものなのか。どうかご決断を
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_テセト_says_力を持つ者の責任_p8417
        quote: 確かに私は傲慢なのでしょうね。ですが、傲慢であることを放棄するのは無責任ではありませんか？ これを開き直り、思考停止だと言うのであればその通り。しかし私たちは、既に最も巨大な勢力のひとつとなってしまっているのです。生まれながらに、力を持つ者としての責任があります
        locator: {}
        spoiler_after: ch0271
  first_appearance_candidate: true
- canonical_target: '[[E_term_リーナ]]'
  entity_type: terminology
  aspects:
    visual:
      observations:
      - event_ref: E_ch0271_リーナ_observes_ジーゼロの乱入_p8409
        quote: リーナは乱入してきた黒鉄の棺がテセトに向かっていくのを呆然と見ていたが、すぐに我に返って状況の危険さを理解する。これは下界で行われていた選定レースの続きだ。このままではジーゼロに追い抜かれる。
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_リーナ_observes_老人神とダウザールの類似_p8414
        quote: あの天を統べる老人は、ダウザールとよく似ていた。 というより、ダウザールがあの神に似ているというべきだろう。 そして城内を満たす藍の海、『アレ』と呼ぶ他にない形容不能な存在から全く同じ印象を受けることにリーナは気付いていた。
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_リーナ_makes_炎の翼_p8420
        quote: 冥府を照らす炎の翼を意識する。モーエンが藍の海から不完全な記号を掬い出したように、リーナは真下に手を伸ばして熱を掬い上げた。 熱い。灼熱が腕を伝って肩に届き、風に流れていく。
          ちっぽけな翼を背に、大いなる慈愛と対峙する。
        locator: {}
        spoiler_after: ch0271
    speech:
      observations:
      - event_ref: E_ch0271_リーナ_asks_自由意志の尊重_p8416
        quote: それは、でも、傲慢な考え方じゃないの？ 自由意志や尊厳を無視してる
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_リーナ_thinks_権威への依存_p8418
        quote: クロウサーという血族の内側にいるリーナでさえ、何をもって信じるかの判断基準のほとんどは『権威』でしかない。封じられていた記憶が蘇ったことで『塔』という外部の視点を持てるようになったことは確かだ。しかし『塔』とて別の権威、別の立場、別の利害関係者でしかないこともリーナにはわかっていた。
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_リーナ_says_対人関係への回帰_p8419
        quote: 乱暴だよ、全体的に。テセトさんの言うこともわかるし、責任って重いんだろうし、私が思うよりずっと難しいことだらけなんだと思うけど。それでも、今のあなたの言い分をそのまま受け入れることはできない。そもそもの話として
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_リーナ_says_テセトへのからかい_p8423
        quote: てかおにーさん下半身すごくね？ もうあれじゃん安産型！ 安産型ブルドッグ！ あの念写動画ってガロアンディアンじゃなかった？ え、会見でダンスに派生するやつ投稿したのっておにーさんなの？
          すっげサインください！
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_リーナ_says_熱愛発覚の噂_p8424
        quote: 『地下アイドル『空組』のメンバーにしてクロウサー家の若き当主リーナ・ゾラ・クロウサー、まさかの熱愛発覚！ お相手はテロリストのネクロマンサー！』だってさ！
          いやーすっぱ抜かれちゃったなー困ったなー
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_リーナ_asks_ジーゼロへの共感_p8426
        quote: でも、私はこっちの声も無視できない。しちゃ駄目なんだって思うの
        locator: {}
        spoiler_after: ch0271
    action:
      observations:
      - event_ref: E_ch0271_リーナ_activates_炎上呪術_p8420
        quote: 今から私、超燃えるから
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_リーナ_makes_パイ投げイベント_p8421
        quote: はい、というわけでね。食べ物で遊ぶなってめっちゃ怒られましたんで、反省してぐちゃった食べ物でパイ投げ系のイベントやっちゃおうとおもいまーす！
          もうすぐレース始まるし、景気づけにみんなで騒いじゃおう！
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_リーナ_makes_ヨグウムチャレンジ_p8421
        quote: うおおおお店のアイスケースでコールドスリープチャレンジ！ ヨグウム製の監視宝珠の目を掻い潜って何秒間動画配信できるかな！ よっしゃあ新記録！
          ヨグウムチャレンジにも大成功！ 勝ったどー！
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_リーナ_makes_食べ歩きコンプリート_p8421
        quote: 祝祭食べ歩き記念！ 全お店と屋台の食べ物をコンプリートしてタワーにしちゃえ！ ものども見上げろ！ これがクロウサーの権力と資金力だー！
          うらやましかろー！ めっちゃおいしー！ たのしー！ うわああ倒れたああああ！！！
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_リーナ_makes_地虫ダンス_p8422
        quote: みてみて、『頭を垂れよ、地虫ども』ダンス。頭が下がってれば足は上がっててもいい理論！ これでパーンにも大勝利だ！ ありがとう地虫ダンサーのみんな！
          お礼に平伏してもらいました！ クロウサーの権威にひざまずけー、ウェーイ！
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_リーナ_makes_霊薬混入_p8422
        quote: 今回のレース、規定量までなら霊薬オッケーなんだって！ つまり魔女式ドラッグパーティ解禁ってこと！ ガロアンディアンはおおらかでいいよね！
          そんなわけで、じゃーん！ 今回は皆にもトリップ飛翔感を味わってもらいたいので、観客席で提供されるドリンクにサービスでいい気分になれる霊薬混ぜ混ぜしちゃいまーす！
          合法だしそんなに後には残らないから安全！ 皆で一緒にアゲてこーぜ！
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_リーナ_defeats_テセト_p8424
        quote: テセトはクロウサーの力によって敗れるのだ。 燃える翼がもたらす加速は、いつしかモーエンの速度を凌駕していた。
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_リーナ_saves_テセト_p8425
        quote: 言理飛翔・百倍減速！ 藍の海から掬い上げた触手が時間と空間を縛り上げ、破滅の瞬間を引き延ばす。 リーナの妨害呪術によってテセトは命を救われ、ジーゼロは起爆の瞬間を逃したまま停滞し、両者ともに沈黙する。
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_リーナ_bonds_テセト_p8426
        quote: いっぱいめんどい事後処理させちゃってごめんね。テセトさんは本当に頑張ってくれてると思う。私にはあなたが必要だし、これからも手伝って欲しい
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_リーナ_makes_仲良しフライトの投稿_p8427
        quote: 頼りになるテセトさんとの念写ツーショ♪ てか若過ぎて笑う！ これでは超セレブ空使いリーナ様が若い男を囲ってるって噂になっちゃいますな～。勝利の仲良しフライト！
          年齢的にはほぼパパ活で～す！ テセトパパ～お小遣いちょうだ～い！
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_リーナ_departs_テセト_p8428
        quote: 最後に火種を置いて去ったリーナに罵声を浴びせる暇さえなかった。 赤い爆発が咲き誇り、城内に衝撃と轟音が響く。
        locator: {}
        spoiler_after: ch0271
  first_appearance_candidate: true
- canonical_target: '[[E_term_モーエン]]'
  entity_type: terminology
  aspects:
    visual:
      observations:
      - event_ref: E_ch0271_モーエン_makes_六芒星の宴_p8410
        quote: モーエンの六芒星が天地を埋め尽くし、異形の宴が空を夜で染めた。
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_モーエン_makes_複乳と天牛の流通_p8414
        quote: 女神の乳房は千を超え万に達し億と連なりそれらの慈愛に吸い付いた記号の群れが家畜となって選別され配合され改良され完成していく。 大量生産された天牛は腹から切り開かれ、丁寧に臓腑を除かれたあと部位ごとに分けられ、羽の生えた肉となって小売り店へと飛んでいく。小売りから先は書物あるいは人の口へ。肉は食され、人のメディア滋養となる。その仕組みを大衆は知る由もないが、人もまたモーエンの乳で育まれた子供たちに他ならない。
        locator: {}
        spoiler_after: ch0271
    name:
      observations:
      - event_ref: E_ch0271_モーエン_names_クロウサー中興の祖_p8410
        quote: エジーメきっての天才、ダウザールやミブリナに続く偉大な魔女にしてクロウサー中興の祖とも呼ばれる大呪術師は、しかし晩年を苦悩の中で過ごした。
          下界の猥雑さと困難さ、社会の複雑性に圧倒され続け、己の愚かさに絶望する日々。
        locator: {}
        spoiler_after: ch0271
    speech:
      observations:
      - event_ref: E_ch0271_モーエン_says_理解不能な世界_p8410
        quote: これがミブリナ様の見ていた世界？ やっとたどり着いたのに、『アレ』はなに？ 理解できない、わからない、文字化けしてて読めない。空使いはこの先に進まないといけないの？
          ダウじい、無茶言わないでよ私には無理だよ
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_モーエン_thinks_萌えの必要性_p8411
        quote: わかんないわかんないわかんない！ 『 』と叫んでも声にはならない。文字にすらできない。ありのまま世界を理解なんてできない。この手に握らなければ理解ではない。物語がいる。記号が必要だ。感情によって『自分のこと』だと思わなければ熱意が持てない。つまり萌えがないとダメ
        locator: {}
        spoiler_after: ch0271
    action:
      observations:
      - event_ref: E_ch0271_モーエン_makes_頭装宮_p8411
        quote: 戦乙女たちの始祖と契約を結び、六芒星に記号と象徴を紐づけることで『天空神に連なる御使いの伝承』をひとつの呪術基盤として完成させた。 モーエン・エジーメ・クロウサーの建てた頭装宮は現在も義国アルセミットの文化遺産として知られ、髪の毛を呪力リソースとして扱う技術は現代でも発展を続け、民間レベルから企業レベルまで呪術文明を基底から支えている。
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_モーエン_makes_クロウサーの真実の神話_p8412
        quote: 超越的なものは、キャラクターとなった。 映画の場面転換のように、世界が切り替わる。 擬人化された神が、空の彼方から飛来する脅威と戦いを繰り広げる光景。
          『クロウサーの真実』を単純化すると、このようなものが出来上がる。『槍持つ少年神』と『天空城を統べる老人神』にしよう。『外なる未知』は邪悪な宇宙人だ。それがいい。わかりやすく、この世界の守護者と侵略者として配役する。
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_モーエン_makes_天牛_p8412
        quote: 魔女の股の間から大量の髪の毛たちが生み出されたのだ。異形の赤子たちは産声を上げる。世界への賛歌であり呪詛だった。また続けての出産でガラス細工の義眼が幾つも転がり落ちる。それらは濁った金色を宿そうとして失敗し、融け落ちて藍色の海に沈んでいく。最後に、無脊椎動物の如き触手が魔女の胎を突き破って産まれた。貪欲に喰らい増えるその特性が奏功し、無限回の試行と変容の果てにそれらは風を食む天牛に至った。牛たちの翼は触手の名残なのだ。
        locator: {}
        spoiler_after: ch0271
      - event_ref: E_ch0271_モーエン_makes_神話の結末_p8413
        quote: 清く正しく勇敢な若者による英雄的な献身。 徳深き古老による子供たちのための自己犠牲。 槍神は自己を保てぬほどの深手を負い、天神はうつろな残骸と成り果てた。
          モーエンの解釈した『設定』では、そういう神話になっている。 主なき楽園と天の御殿。空席を埋める必要があった。
