- canonical_target: '[[E_char_ダウザール]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0255_ダウザール_other_リーナへの肯定_p8184
        quote: 「リーナよ。お前が抱くクロウサーへの疑念は正しい」
        locator: {}
        spoiler_after: ch0255
      - event_ref: E_ch0255_ダウザール_teaches_家族と社会の必要性_p8185
        quote: 「誰も全能の外には辿り着けない。これが神に至らんとする巨人、すなわち『個』の限界だ。ゆえにこそ我らは仲間を作る。社会を築く。国家を欲する。そして、それら共同体の最も基本的で原始的な形が家族なのだ」
        locator: {}
        spoiler_after: ch0255
      - event_ref: E_ch0255_ダウザール_other_分断の時代の安全_p8188
        quote: 「現代ほど文明圏の力と大規模破壊呪術が発達した世界では、分断されている状態の方が安全だからだ。これは先ほど話した個を凌駕する集団の力、そして共感性の話でもある」
        locator: {}
        spoiler_after: ch0255
      - event_ref: E_ch0255_ダウザール_other_救世主トリアイナの役割_p8191
        quote: 「救済の名は真なる融血呪。二つの世界を正しく融け合わせる力。世界に作用する血の融合が成し遂げられた時、救世は果たされ新時代が到来する」
        locator: {}
        spoiler_after: ch0255
      - event_ref: E_ch0255_ダウザール_other_協力と支援_p8193
        quote: 「その上で絶対言語の探究にも協力すると約束しよう。ミブリナを始め、歴代の空使いが積み上げた神秘は太陰の王女にとっても役立つはずだ」
        locator: {}
        spoiler_after: ch0255
    action:
      observations:
      - event_ref: E_ch0255_ダウザール_other_心話の虚構性_p8186
        quote: 「心話とは『己の言語／母語理解』に寄せた『我々の世界』における相互理解であり、『翻訳』という形で矮小化、劣化、零落させる呪いでしかない。
        locator: {}
        spoiler_after: ch0255
      - event_ref: E_ch0255_ダウザール_other_神話破局のシミュレーション_p8189
        quote: ダウザールが示したのは、複数の国家が同時に巨大な呪詛を撃ち合う終末の光景だ。
        locator: {}
        spoiler_after: ch0255
    visual:
      observations:
      - event_ref: E_ch0255_ダウザール_other_絶対言語の魔導書_p8187
        quote: '『プロットレス・スペル』『物語を持たない呪文』『エーゼンティウス仮説』『ラヴァエヤナ統呪論』

          ものがたり

          『断絶された文明圏を超える、純化された理想のことば』といったタイトルはいずれも絶対言語に関連したものだが'
        locator: {}
        spoiler_after: ch0255
  first_appearance_candidate: true
