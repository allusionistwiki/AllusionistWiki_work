      observations:
      - event_ref: E_ch0056_ドラトリア_other_言語の混乱_p2163
        quote: ドラトリア北部では長年にわたる北の隣国との占領合戦、高山と河川に囲まれた特有の地形などの要因によって、隣国語、北部方言、ドラトリア語、大陸共通語の四つの言語が入り交じる状態となっていた。
        locator: {}
        spoiler_after: ch0056
      - event_ref: E_ch0056_ドラトリア_other_本国と北部_p2166
        quote: そして『ドラトリア』が――国家という使い魔の呪術に命名という古き呪文で蓋をしたその巨大な構造体が――割れる。
        locator: {}
        spoiler_after: ch0056
      - event_ref: E_ch0056_ドラトリア_other_槍神教圏からの脱退_p2167
        quote: その後、ドラトリアは槍神教圏から脱退を宣言。
        locator: {}
        spoiler_after: ch0056
