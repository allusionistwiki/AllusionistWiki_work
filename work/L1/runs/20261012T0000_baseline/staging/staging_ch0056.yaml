- canonical_target: '[[E_char_サリア]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0056_サリア_observes_ハルベルトとプリエステラ_p2142
        quote: 黒い泥のような何かとそれに取り縋って泣き叫ぶハルベルト、呆然とした様子のプリエステラたち。
        locator: {}
        spoiler_after: ch0056
    action:
      observations:
      - event_ref: E_ch0056_サリア_saves_アズーリアの仲間_p2142
        quote: サリアは蛇の王を可能な限りの速さで解体してアズーリアの仲間二人を救出。無事を確認して即座に反転する。
        locator: {}
        spoiler_after: ch0056
      - event_ref: E_ch0056_サリア_stops_氷弓の発動_p2142
        quote: 首筋に滞留し、己の心を侵し続ける『それ』は、許容閾値を超えれば容易く己の精神を食らいつくし『個我』を喪失せしめるだろう。
        locator: {}
        spoiler_after: ch0056
      - event_ref: E_ch0056_サリア_attacks_ガルズ_p2146
        quote: 「いいや、次はお前の番だ」　魔導書ごと腕が飛んだ。　その場にいる誰もが、サリアの動きを捉えられなかった。
        locator: {}
        spoiler_after: ch0056
      - event_ref: E_ch0056_サリア_kills_ガルズ_p2147
        quote: 瞬きをする間にガルズは死んだ。　一切の容赦が無く、あらゆる抵抗を許さず、圧倒的な暴力によって完膚無きまでに惨殺された。
        locator: {}
        spoiler_after: ch0056
      - event_ref: E_ch0056_サリア_stops_マリーへの攻撃_p2147
        quote: サリアの鳶色の瞳に浮かぶのは全き無である。　ただ目の前の全てを切り刻む。意思ですらない反射で暴力を振るおうとしたその時だった。　背後で、そして足下で、途方もない濃度の呪力が膨れあがる。
        locator: {}
        spoiler_after: ch0056
    speech:
      observations:
      - event_ref: E_ch0056_サリア_thinks_判断の正しさ_p2142
        quote: 否、二人を助けることができるだけの実力と速度を兼ね備えていたのはあの場では自分だけだ。
        locator: {}
        spoiler_after: ch0056
      - event_ref: E_ch0056_サリア_other_精神の喪失_p2143
        quote: そうなれば、自分が自分ではなくなってしまう。　コルセスカの使い魔としての自分を規定できなくなる。　それだけは耐えられない。
        locator: {}
        spoiler_after: ch0056
      - event_ref: E_ch0056_サリア_remembers_過去の死の繰り返し_p2145
        quote: この光景には、見覚えがある。　そう、自分の時もそうだった。　サリアの脳裏をよぎる、過去の記憶。膨大な想いの奔流。　決して逃れられない死の繰り返し。
        locator: {}
        spoiler_after: ch0056
      - event_ref: E_ch0056_サリア_other_アズーリアの破滅_p2148
        quote: アズーリアは、自分は、手を出してはならないものに手を出してしまった。　ガルズは恐らくこの最悪の展開を予想せず、ただ己の目的を達成する為にアズーリアを殺したのだろうが――その結果がこれだ。
        locator: {}
        spoiler_after: ch0056
      - event_ref: E_ch0056_サリア_other_ハルベルト_p2149
        quote: 「迷うな！」　　ただ一言。ハルベルトの瞳が、かすかに見開かれる。
        locator: {}
        spoiler_after: ch0056
      - event_ref: E_ch0056_サリア_other_マロゾロンド_p2149
        quote: 「マロゾロンド。貴様、アズーリアを誘導したな」
        locator: {}
        spoiler_after: ch0056
      - event_ref: E_ch0056_サリア_other_神の存在_p2153
        quote: 「いいことを教えてやる。私の信仰は『無神論』だ。というわけで回答はこうだ――『お前は、存在しない』」
        locator: {}
        spoiler_after: ch0056
  first_appearance_candidate: true
- canonical_target: '[[E_char_白黒兎]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0056_白黒兎_appears_サリアとハルベルト_p2143
        quote: 白黒の兎。なぜか片眼鏡をかけて小さな帽子をかぶっている。　闇色の泥の陰に隠れるようにして存在しているその兎に気がついているのは、不思議と自分とハルベルトだけのようだった。
        locator: {}
        spoiler_after: ch0056
    relationship:
      observations:
      - event_ref: E_ch0056_白黒兎_functions_as_アズーリアの使い魔_p2143
        quote: 白黒兎の魔女。　手を叩く度に砂糖菓子が弾けるように現れる、不可思議で無害な使い魔。
        locator: {}
        spoiler_after: ch0056
  first_appearance_candidate: true
- canonical_target: '[[E_char_ハルベルト]]'
  entity_type: character
  aspects:
    name:
      observations:
      - event_ref: E_ch0056_ハルベルト_has_property_第二の末妹候補_p2144
        quote: 呪文の座の候補者――コルセスカに次ぐ、第二の末妹候補。
        locator: {}
        spoiler_after: ch0056
    relationship:
      observations:
      - event_ref: E_ch0056_ハルベルト_requires_コルセスカとの共闘_p2144
        quote: ハルベルトの目的――地上、世界の中心、そして地獄の三界で大規模呪術儀式を行うという、最後の一つが極めて困難なそれ――を達成する為には、同じく地獄を目指しているコルセスカとの共闘が必須とも言えた。
        locator: {}
        spoiler_after: ch0056
    action:
      observations:
      - event_ref: E_ch0056_ハルベルト_uses_禁呪_p2144
        quote: その身体の内側を流れる黒い血が、膨大な呪力を内包しながら解き放たれようとしている。　禁呪――それを使用することで、致命的な事態を回避しようとしているのだ。
        locator: {}
        spoiler_after: ch0056
      - event_ref: E_ch0056_ハルベルト_breaks_禁戒_p2158
        quote: ハルベルトは、心の中だけでごめんなさいと呟いた。　言葉にすれば、決意が揺らぐような気がしたから。　ハルベルトは、静かに禁戒を破る。『創造の光よ』
        locator: {}
        spoiler_after: ch0056
      - event_ref: E_ch0056_ハルベルト_other_運命と事実_p2159
        quote: 運命を――そして事実を。　過去に遡り歴史を塗り替えて事象を語り直す。
        locator: {}
        spoiler_after: ch0056
      - event_ref: E_ch0056_ハルベルト_other_言理の妖精_p2160
        quote: 「言理の妖精――語りて、曰くっ」　瞬間、ハルベルトの左右非対称の耳に宿っていたフィリスが無彩色の光を放ち、なによりも速く、音や光すら置き去りにして意味だけを世界に届けていく。
        locator: {}
        spoiler_after: ch0056
    speech:
      observations:
      - event_ref: E_ch0056_ハルベルト_confesses_アズーリアへの愛_p2156
        quote: 「私はアズーリア様と一緒に普通に歳をとって、一緒に生きて一緒に死ぬと決めました。運命というのならこの人が私の運命だと思った。生まれて初めて、抗いたくないと思える運命に出会えたんです」
        locator: {}
        spoiler_after: ch0056
      - event_ref: E_ch0056_ハルベルト_remembers_取引の記憶_p2161
        quote: 『これは取引です』　目の前に三角の耳をした猫の取り替え子が立っている。
        locator: {}
        spoiler_after: ch0056
      - event_ref: E_ch0056_ハルベルト_other_アズーリア_p2169
        quote: ごめんなさい、と掠れた声が響いた。　ごめんなさい、ごめんなさい、ごめんなさい――許される事など無いと知っていても、口に出さずにはいられないというように。
        locator: {}
        spoiler_after: ch0056
  first_appearance_candidate: true
- canonical_target: '[[E_char_マロゾロンド]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0056_マロゾロンド_defines_古き神の目的_p2150
        quote: 「今の僕たちは天使にまでその存在を零落させてしまっている。実世界への干渉も端末を介して限定的に神託を下すのがせいぜいだ。
        locator: {}
        spoiler_after: ch0056
      - event_ref: E_ch0056_マロゾロンド_other_アズーリアの最適化_p2152
        quote: 「アズーリアはこのために用意した特別な端末のひとつ。同じく僕の端末であるエスフェイルを打ち破ったことでその存在の格は飛躍的に向上した。そして今までの繰り返しの中で何度も僕から力を引き出したアズーリアの身体は、僕を降ろす為に最適化されている」
        locator: {}
        spoiler_after: ch0056
  first_appearance_candidate: true
- canonical_target: '[[E_char_ミルーニャ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0056_ミルーニャ_activates_自殺の黒槍_p2154
        quote: 左手の中指、生爪を一気に引き剥がす。　常人よりも高い治癒力を持つ彼女であっても、その痛みは耐え難かった。
        locator: {}
        spoiler_after: ch0056
      - event_ref: E_ch0056_ミルーニャ_arrives_現場_p2154
        quote: ミルーニャ・アルタネイフはその場所に辿り着くと、最悪の事態が起きてしまったことを完璧に理解した。
        locator: {}
        spoiler_after: ch0056
    speech:
      observations:
      - event_ref: E_ch0056_ミルーニャ_promises_アズーリアへの忠誠_p2155
        quote: 「ええ。構いませんよ。アズーリア様のいない世界で生きていたいとは思いませんからね。ですからやりなさいハルベルト。貴方にしかできないことです」
        locator: {}
        spoiler_after: ch0056
      - event_ref: E_ch0056_ミルーニャ_threatens_ハルベルト_p2155
        quote: 「禁戒を破って下さい。さもなくば貴方を殺します、ヴァージリア」
        locator: {}
        spoiler_after: ch0056
      - event_ref: E_ch0056_ミルーニャ_other_ハルベルト_p2169
        quote: 「貴方に責任はありません。咎があるとすれば、それを無理強いした方」
        locator: {}
        spoiler_after: ch0056
  first_appearance_candidate: true
