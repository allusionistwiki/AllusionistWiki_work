    speech:
      observations:
      - event_ref: E_ch0126_アキラ_asks_ルウテトの前世_p4380
        quote: 本当に、ルウテトはコルセスカの前世なのだろうか。そして、「本当に、ルウテトの前世がコルセスカなのか？」根本的な疑問を投げかける。
        locator: {}
        spoiler_after: ch0126
      - event_ref: E_ch0126_アキラ_asks_アキラ様という呼称_p4381
        quote: 「それだ。まずその名前がわからない」
        locator: {}
        spoiler_after: ch0126
      - event_ref: E_ch0126_アキラ_asks_過去_p4381
        quote: 「何があった？」単刀直入に訊ねる。
        locator: {}
        spoiler_after: ch0126
      - event_ref: E_ch0126_アキラ_suspects_ルウテトの正体_p4383
        quote: 「いや、おま――死人の森の女王ルウテトさんですよね？失礼ですが貴方はコルセスカさん本人なのでは？」
        locator: {}
        spoiler_after: ch0126
      - event_ref: E_ch0126_アキラ_asks_トリシューラとの関係_p4384
        quote: 「質問を変える。ルウテト。トリシューラとの間に何があった？」
        locator: {}
        spoiler_after: ch0126
      - event_ref: E_ch0126_アキラ_asks_ソルダ・アーニスタ_p4385
        quote: 「その、ソルダ・アーニスタとはどうなった」
        locator: {}
        spoiler_after: ch0126
    visual:
      observations:
      - event_ref: E_ch0126_アキラ_observes_ルウテト_p4380
        quote: 豊かな胸元、細身ながら女性的な魅力に満ちた体型、スカートから伸びる美しい脚、どことなく無防備に見えてしまう表情。あらためて一つ一つの要素を取り上げると、まるで重なる部分が無い。
        locator: {}
        spoiler_after: ch0126
    action:
      observations:
      - event_ref: E_ch0126_アキラ_other_ルウテト_p4391
        quote: トリシューラは俺にルウテトを探してくるように言いつけて、そのまま六王の相手を続けた。先ほどの失態を取り返す為にも、ルウテトの姿を求めて歩く。
        locator: {}
        spoiler_after: ch0126
