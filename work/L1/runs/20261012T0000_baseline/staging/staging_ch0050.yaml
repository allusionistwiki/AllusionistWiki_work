- canonical_target: '[[E_char_サリア]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0050_サリア_appears_先導者_p1982
        quote: 軽装で、腰の革袋と二振りの短剣以外にはさしたる装備も身につけていない。探索者用の頑丈で汚れてもいい茶色の服は実用一点張り。栗色の髪が一房だけ編み込まれているのが唯一のお洒落だったが、その美貌は全く色褪せることはない。
        locator: {}
        spoiler_after: ch0050
    speech:
      observations:
      - event_ref: E_ch0050_サリア_says_コルセスカとの戦い_p1986
        quote: 「負けた。それはもう命からがら逃げてきた。三人で全力の凍結食らわせて時間稼ぎしてる間に空間に裂け目作って追放するので精一杯だった」
        locator: {}
        spoiler_after: ch0050
      - event_ref: E_ch0050_サリア_other_陽動_p1989
        quote: 「【死の囀り】の動きは不規則で、万が一ということもある。基本的に地上で歌ってるだけだとは思うけど、もし聞こえてきたら消音結界をお願い。私が陽動して遠ざけるから」
        locator: {}
        spoiler_after: ch0050
      - event_ref: E_ch0050_サリア_has_property_超人的聴力_p1997
        quote: 恐るべきはその索敵範囲である。どうやら彼女は目ではなく耳で遠くの微かな音を拾っているらしい。
        locator: {}
        spoiler_after: ch0050
    action:
      observations:
      - event_ref: E_ch0050_サリア_fights_守護機械_p1995
        quote: 言うが早いか、風のように前へと駆けて行ってしまう。
        locator: {}
        spoiler_after: ch0050
