        spoiler_after: ch0138
      - event_ref: E_ch0138_マラード_threatens_宣戦布告_p4706
        quote: 「そう――国の威信を懸けたこの伝統の一戦で、雌雄を決するのだ」
        locator: {}
        spoiler_after: ch0138
      - event_ref: E_ch0138_マラード_asks_国歌斉唱_p4708
