entities:
- canonical_target: '[[E_char_アキラ]]'
  entity_type: character
  aspects:
    visual:
      observations:
      - event_ref: E_ch0084_アキラ_observes_トリシューラ_p3076
        quote: 朝起きたら、目の前にトリシューラの寝顔があった。 艶のない黒を基調とした金属製の肌。 所々に走る銀のラインは、彼女が機械の身体であるということを強調している。
        locator: {}
        spoiler_after: ch0084
    action:
      observations:
      - event_ref: E_ch0084_アキラ_other_トリシューラの髪_p3077
        quote: 思考より先に、左手が動いた。 細やかな赤い髪。寝ている際に乱れないようにまとめられている一房にそっと触れて、撫でていく。
        locator: {}
        spoiler_after: ch0084
      - event_ref: E_ch0084_アキラ_travels_花街_p3090
        quote: 俺が今いるのは、ガロアンディアンに新たに作り出された歓楽街――通称『花街』の中央通りである。 目的地はとある公営娼館。そこである人物と待ち合わせをしているのだ。
        locator: {}
        spoiler_after: ch0084
      - event_ref: E_ch0084_アキラ_other_人工乳房_p3092
        quote: 先日、多腕系の格闘動作制御プログラムを構築しているインドアユーザーの一人が『人工乳房を拡張することによる戦術について』というトピックを立ち上げた時は正気かと思ったが、割と真面目な内容だったので今では俺も暗器としては意外と有りかもしれない、と思い始めている。
          つまり思わず購入してしまったのは、サイバーカラテの研鑚のためであって変な事に使うつもりではない。
        locator: {}
        spoiler_after: ch0084
    speech:
      observations:
      - event_ref: E_ch0084_アキラ_thinks_トリシューラの侵入_p3077
        quote: 「――つまり、トリシューラが自分の意思で入ってきたってことだよな」 混乱するな。大丈夫だ、俺は正常に思考できている。
        locator: {}
        spoiler_after: ch0084
  first_appearance_candidate: true
- canonical_target: '[[E_char_トリシューラ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0084_トリシューラ_has_property_自動的な振る舞い_p3076
        quote: 寝ている間は質感を再現するテクスチャの呪術が働かないらしい。 安らかな寝息を立てる――という自動的な振る舞いを適度な乱数を加えてそれらしく実行するトリシューラは、寝ている間であっても人らしくあろうとしているようだった。
        locator: {}
        spoiler_after: ch0084
      - event_ref: E_ch0084_トリシューラ_other_取り消し_p3079
        quote: 「うー、こうなったら【取り消し】の呪文で直前の操作を無かった アンドゥ ことに――ああもう一回寝ちゃったから無理ー！」
        locator: {}
        spoiler_after: ch0084
      - event_ref: E_ch0084_トリシューラ_other_アキラの左腕_p3084
        quote: がぶり、と左腕に齧り付かれた。 義肢との接合部に歯を当てて、（いってきますのちゅー） などと言っているが、どこまで本気なのやら。
        locator: {}
        spoiler_after: ch0084
    speech:
      observations:
      - event_ref: E_ch0084_トリシューラ_other_アキラ_p3078
        quote: 「は？ ペットの分際で何勘違いしてるの？ 駄犬のくせに機械に欲情するとかもう最低最悪の変態だね！ このお猿さん！」
        locator: {}
        spoiler_after: ch0084
      - event_ref: E_ch0084_トリシューラ_says_すっぴん_p3078
        quote: 「いやあああああすっぴん見られたあああああ」「それすっぴんなのか」
        locator: {}
        spoiler_after: ch0084
      - event_ref: E_ch0084_トリシューラ_other_精神安定_p3079
        quote: トリシューラは振る舞いによって俺の精神を安定させようとする。それが演技だと理解できてはいても、そう意図して行動をしてくれたという事実は単純な人間の脳に安らぎを与えるからだ。
        locator: {}
        spoiler_after: ch0084
      - event_ref: E_ch0084_トリシューラ_other_マーキング_p3080
        quote: 「んー、マーキングみたいな？ 私のものだーっていう匂い付け。ほら、襲撃来るとしたら今日かなーって思ったから」
        locator: {}
        spoiler_after: ch0084
      - event_ref: E_ch0084_トリシューラ_other_戦力_p3080
        quote: 「強化外骨格と戦闘用ドローン、あと杖型オルガンローデも連れて行くから大丈夫だよ。地上までの転移は一瞬だし、その後はリールエルバとメートリアンに合流するから戦力も十分。
        locator: {}
        spoiler_after: ch0084
      - event_ref: E_ch0084_トリシューラ_names_グレンデルヒ_p3081
        quote: 「気をつけてね。【変異の三手】の最後の副長、そしてリーダーのグレンデルヒは、多分これまで以上の強敵だから」
        locator: {}
        spoiler_after: ch0084
      - event_ref: E_ch0084_トリシューラ_other_アキラ_p3081
        quote: 「そうだね。多分あの説明は嘘じゃない――けど、それだけだと断定するのは危ないと思うよ。もしかしたら、暗殺を恐れた私がドラトリアに亡命、ガロアンディアンが無防備になった隙を突いて乗っ取る、という作戦かも」
        locator: {}
        spoiler_after: ch0084
      - event_ref: E_ch0084_トリシューラ_other_アキラ_p3083
        quote: 「行政局と環境整備局のメンテは済ませたから大丈夫だし、入管ゲートも異常無しで正常運転中。マグドール商会への対応はレオに任せていいから。夜警団の応援要請あったらマレブランケの人員適当に回しといて。
        locator: {}
        spoiler_after: ch0084
    visual:
      observations:
      - event_ref: E_ch0084_トリシューラ_wears_魔女の衣装_p3082
        quote: 色彩はいつも通りの黒だが、鍔の広い三角帽子に金の縁取りがされたローブ。 魔女らしいな、となんとなく思ったが、どうも前世の常識っぽい――のだが、この世界でもこれは典型的な魔女のイメージらしい。
        locator: {}
        spoiler_after: ch0084
  first_appearance_candidate: true
- canonical_target: '[[E_char_リールエルバ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0084_リールエルバ_other_メール_p3084
        quote: 『出稼ぎに行った主人がトントロポロロンズに挑んで壮絶に討ち死にしてから一年が経ち、私もようやく立ち直りつつあります。ですが、毎日独りきりで寝台に横たわると、不意に身体の火照りを覚える瞬間があります。
        locator: {}
        spoiler_after: ch0084
    visual:
      observations:
      - event_ref: E_ch0084_リールエルバ_appears_ホログラム_p3085
        quote: （はーい、アキラ。お元気？） 視界に出現する小さなリールエルバを半眼で見ながら、呆れて思考の中だけで言葉を紡ぐ。
        locator: {}
        spoiler_after: ch0084
    speech:
      observations:
      - event_ref: E_ch0084_リールエルバ_other_言震_p3086
        quote: （今のガロアンディアンはかなり危うい。言震――ワードクェイクのリスクが世界トップだって事はご存じかしら）
        locator: {}
        spoiler_after: ch0084
      - event_ref: E_ch0084_リールエルバ_other_アキラの役割_p3087
        quote: （そうね。だからこそ、発生源である貴方を経由すればガロアンディアン語にクラッキングを仕掛けることもできる。あるいは、言震を人為的に発生させることすら可能かもしれない。そうなればガロアンディアンは崩壊する）
        locator: {}
        spoiler_after: ch0084
      - event_ref: E_ch0084_リールエルバ_other_ラクルラール派_p3088
        quote: （第六位全権代理、人形師ラクルラールの弟子にして被造物――紅ンタ マゼ 紫のアレッテ・イヴニルと砂茶のミヒトネッセが星見の塔を出てア
          オーカー ルセミットに入国したわ。
        locator: {}
        spoiler_after: ch0084
      - event_ref: E_ch0084_リールエルバ_asks_アキラ_p3089
        quote: （ふうん。そう。それもそうね――ねえアキラ、やっぱり私の下僕にならない？） （いえ。あくまで俺は、トリシューラとコルセスカの使い魔ですから）
        locator: {}
        spoiler_after: ch0084
  first_appearance_candidate: true
- canonical_target: '[[E_char_グレンデルヒ]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch0084_グレンデルヒ_other_日本語情報_p3087
        quote: （そのレベルの改竄ができる言語魔術師なんて、それこそ上級言語魔術師くらいだけど――英雄たるグレンデルヒは数少ないその一人。そしてついさっき、彼が太陰のデータベースにアクセスして日本語の言語情報を参照していた事が明らかになったの。気をつけて）
        locator: {}
        spoiler_after: ch0084
