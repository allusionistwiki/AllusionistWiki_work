- canonical_target: '[[E_item_花街]]'
  entity_type: item
  aspects:
    visual:
      observations:
      - event_ref: E_ch0084_花街_has_property_公営化_p3090
        quote: 公社の管理下におかれている事は変わらないが、トリシューラによって環境の改善がなされ、公営化された賭博場や娼館。 取り仕切っていた犯罪組織は一切の慈悲無く物理的に駆逐され、夥しい量の血が流れた結果として、そこには一定の平和が訪れていた。
        locator: {}
        spoiler_after: ch0084
      - event_ref: E_ch0084_花街_other_人工乳房_p3092
        quote: 多様な形態の人工交接器。簡易脱着可能な男性用乳房。感覚を任意の箇所に移動させるサービス。一時石化系の嗜好に対応した店。
        locator: {}
        spoiler_after: ch0084
  first_appearance_candidate: true
- canonical_target: '[[E_term_娼妓]]'
  entity_type: terminology
  aspects:
    symbolic:
      observations:
      - event_ref: E_ch0084_娼妓_functions_as_呪力発電機_p3091
        quote: あらゆる原始的な欲望が向かう先であるポルノスターは一種の偶像であり、呪力の発電機であるとも言えた。 この世界では性的な事柄からも呪力を引き出せるので、正しい呪術の知識を持って取り組めば公娼は極めて安定した主要な産業にもなり得るのだ。
        locator: {}
        spoiler_after: ch0084
  first_appearance_candidate: true
- canonical_target: '[[E_term_城]]'
  entity_type: terminology
  aspects:
    visual:
      observations:
      - event_ref: E_ch0084_城_is_located_花街_p3093
        quote: 公営娼館の中でもそこは少々他とは雰囲気が違う。 探索者――それもとある集団の拠点としてトリシューラが用意した、ガロアンディアンの内部に存在する『城』。
          事実上の治外法権であるそこは、『自由』を己の信条とする者たちが集う宿であり食堂であり、更には地上にある探索者協会の支部の一つでもある。
        locator: {}
        spoiler_after: ch0084
  first_appearance_candidate: true
- canonical_target: '[[E_char_ゼド]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch0084_ゼド_other_呪文記憶_p3094
        quote: 専門的な呪術師ではない彼でも、高度な呪術を一時的に記憶して、使い捨てのように使用することはできる。 高い記憶力と集中力、そして膨大な準備時間が必要な上に、寝れば全てが台無しになるという欠点があるにせよ、専門の呪術師がいない探索者集団にとっては有効な戦術である。
        locator: {}
        spoiler_after: ch0084
      - event_ref: E_ch0084_ゼド_other_自由_p3095
        quote: 「その時はその時さ。俺はお前みたいに何から何まで管理されんのは勘弁願いたいんでね。自由に気ままに束縛されずに――俺の王は俺だけだ。だからこそ、ガロアンディアンの中にあってさえ、『ここ』だけは俺の王国だ」
        locator: {}
        spoiler_after: ch0084
    action:
      observations:
      - event_ref: E_ch0084_ゼド_other_魔導書_p3094
        quote: 男は、卓上で静かに果実酒を飲んでいる。そして、深く椅子に背を預けて、大きな魔導書を片手で支えながら読み耽っていた。 集中した表情。 眉間に皺が寄っているのは、呪文を意識に焼き付けているからだろう。
        locator: {}
        spoiler_after: ch0084
    visual:
      observations:
      - event_ref: E_ch0084_ゼド_wears_テンガロンハット_p3095
        quote: 黒いテンガロンハットはトリシューラが面白がって贈った品だが、当人もいたく気に入ったらしく今も身につけている。空間拡張の呪術を用いることで実際に十ガロン――三十八リットルの水が収まるらしい。
        locator: {}
        spoiler_after: ch0084
    name:
      observations:
      - event_ref: E_ch0084_ゼド_names_盗賊王_p3096
        quote: 探索者にして銃士、更には四英雄きってのならず者と呼ばれた男。 無法者である彼は、自ら定めた法秩序に従って動く。
        locator: {}
        spoiler_after: ch0084
  first_appearance_candidate: true
