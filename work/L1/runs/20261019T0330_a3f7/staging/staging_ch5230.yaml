- canonical_target: '[[E_char_ヴァージリアジル]]'
  entity_type: character
  aspects:
    speech:
      observations:
      - event_ref: E_ch5230_ヴァージリアジル_other_使い魔の不要性_p260
        quote: '必須とされる使い魔なんて自分には不要だと信じた。

          幸い、自分には仮想使い魔を構築する優れた才能がある。

          使い魔なんてそれで十分だ。'
        locator: {}
        spoiler_after: ch5230
      - event_ref: E_ch5230_ヴァージリアジル_other_アクスとしての活動_p290
        quote: アクスとしての活動は、なんだか俗っぽいという以上に――『下品』な感じがして嫌だった。自分が消費されていく感覚。世に出た以上、あらゆる人がコンテンツ化することは避けられない。けどそれにしたって。
        locator: {}
        spoiler_after: ch5230
    action:
      observations:
      - event_ref: E_ch5230_ヴァージリアジル_other_ハルベルト襲名_p269
        quote: このまま順調に進めば、最終予選で『ハルベルト』を襲名して本選に出られるはずだ。何も問題は無い。
        locator: {}
        spoiler_after: ch5230
      - event_ref: E_ch5230_ヴァージリアジル_other_アクス活動_p296
        quote: '「水着も嫌！　ごめんなさい、でも今日限りで止めるから！」

          担当のマネージャーもプロデューサーも悪い人ではなかったし、とても良くしてくれたけれど、これはもう『合わなかった』としか言いようがない。

          迷惑をかけたのは申し訳無いけれど、それきり『アクス』は死んだ。'
        locator: {}
        spoiler_after: ch5230
      - event_ref: E_ch5230_ヴァージリアジル_other_歌うこと_p313
        quote: '歌うことしかできない。それしか知らない。愚直に積み重ねて、成果が、報酬が、賞賛が、自己の承認が得られなくても、続けることでしか生きられない。

          毎日、毎日、時間を無理矢理作ってやる。'
        locator: {}
        spoiler_after: ch5230
      - event_ref: E_ch5230_ヴァージリアジル_other_ファンレター_p329
        quote: 悪戯かどうかを考えるより先に、内容を見るより先に、家宝にしようとそう決めた。まず花を生けて、便箋を添えて念写して、それから違法な光学写真でも撮影して、拙いスケッチで保存し、すうっと息を大きく吸って、ペーパーナイフで丁寧に手紙を取り出した。
        locator: {}
        spoiler_after: ch5230
    visual:
      observations:
      - event_ref: E_ch5230_ヴァージリアジル_other_手紙への反応_p336
        quote: ヴァージリアは浮き立つ心で、手紙に記された綺麗な、それでいてどこか懐かしい筆致を受け止めて、普段は鋭く機嫌の悪そうな目を柔らかく緩ませて、そして小さな子供のように笑った。
