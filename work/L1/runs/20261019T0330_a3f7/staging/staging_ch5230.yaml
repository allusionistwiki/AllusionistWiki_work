- canonical_target: '[[E_char_アズーリア]]'
  entity_type: character
  aspects:
    action:
      observations:
      - event_ref: E_ch5230_アズーリア_other_無視_p100
        quote: 聞かなかったことにしよう。うん、そうしよう。
        locator: {}
        spoiler_after: ch5230
      - event_ref: E_ch5230_アズーリア_other_ハルベルト_p176
        quote: '沈みそうになっているハルを引き上げるのは私の役目だ。

          今まで沢山、その逆をしてもらった。

          だから私たちは、そうやってお互いを引っ張り合い続けるのだと思う。

          手を差し出して、最近浮かべるのに慣れてきた笑顔を作って見せる。'
        locator: {}
        spoiler_after: ch5230
      - event_ref: E_ch5230_アズーリア_observes_サリア_p4
        quote: 私は無事に正気を取り戻したサリアと買い物などをしているのだった。
        locator: {}
        spoiler_after: ch5230
      - event_ref: E_ch5230_アズーリア_other_メイファーラ_p75
        quote: メイファーラに愚痴ると、珍しく即座に反応が無い。忙しいのかな。休日とはいえ智神の盾は仕事があったりするのかもしれない。
        locator: {}
        spoiler_after: ch5230
    speech:
      observations:
      - event_ref: E_ch5230_アズーリア_other_マロゾロンドの力_p12
        quote: 「いい？　もう金輪際マロゾロンドの力を引き出さないこと。助言にも耳を貸しちゃ駄目。守護天使――古き神の力を直接参照する引喩（アリュージョン）は危険過ぎる。引喩っていうのは誰よりも先にそれを行った本人に意味が伝わってしまう。諸刃どころか柄まで刃の危険物。自分を純粋に道具だとか媒介物だと確信しきってるような狂人じゃないと自我が崩壊してしまう」
        locator: {}
        spoiler_after: ch5230
      - event_ref: E_ch5230_アズーリア_reveals_サリアの過去_p18
        quote: 「サリア、ズタークスタークと戦った時、狂戦士状態になりながら鎧にマロゾロンドの力を降ろしたらしいじゃない？」
        locator: {}
        spoiler_after: ch5230
      - event_ref: E_ch5230_アズーリア_promises_呪術儀式の成功_p185
        quote: 「もう、とっくに覚悟はできてるよ。残り二つの呪術儀式、必ず成功させようね。煉獄でも地獄でも、私は貴方をどこまでだって連れて行くから」
        locator: {}
        spoiler_after: ch5230
      - event_ref: E_ch5230_アズーリア_thinks_自己の性格_p26
        quote: 'うーん、どうだろう。

          色々混ざりすぎてみんなの影響をちょっとずつ受けているせいかもしれない。

          だとしても、これが今の私だ。'
        locator: {}
        spoiler_after: ch5230
      - event_ref: E_ch5230_アズーリア_fears_自己同一性の危機_p34
        quote: うーん、考えてもみればズタークスタークという先例がいたわけだし、私って思ったよりも特別な存在ではないのかもしれない。自己同一性の危機だ。
        locator: {}
        spoiler_after: ch5230
    name:
      observations:
      - event_ref: E_ch5230_アズーリア_defines_仮想使い魔_p30
        quote: 呪文（ことば）によって編まれた、仮想使い魔。
        locator: {}
        spoiler_after: ch5230
  first_appearance_candidate: true
