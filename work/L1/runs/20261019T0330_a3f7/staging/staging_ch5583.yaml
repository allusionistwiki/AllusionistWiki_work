      - event_ref: E_ch5583_ロードデンドロン_loses_雄々しく戦う力_p177
        quote: 多くのティリビナ人闘士のように、雄々しく戦うことは二度とできないだろう。
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5583_ロードデンドロン_other_過去への一歩_p232
        quote: 言いたかった本心をそっと綺麗な言葉で包み込んで、ロードデンドロンは過去を振り切って、未来へと一歩を踏み出した。
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5583_ロードデンドロン_learns_エクリエッテの指示に従う研鑽_p93
        quote: ティリビナ人の未来のために、ロードデンドロンはエクリエッテに言われるがまま研鑽を積み重ねた。
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5583_ロードデンドロン_learns_ティリビナ人の未来のため_p93
        quote: ティリビナ人の未来のために、ロードデンドロンはエクリエッテに言われるがまま研鑽を積み重ねた。これまでにやってきた全ては何の役にも立たず、異質な知識体系は混乱を招くばかりで全てが上手く行かない。
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5583_ロードデンドロン_fears_悪化するまじないの技術_p95
        quote: 自分の要領の悪さに苦しみ、上達どころか悪化していくまじないの技術に頭を抱える日々。
        locator: {}
        spoiler_after: ch0000
    speech:
      observations:
      - event_ref: E_ch5583_ロードデンドロン_asks_強く立つ必要性_p137
        quote: 「スーリウム様。我らはティリビナ人として強く立つ必要があると思います」
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5583_ロードデンドロン_says_歴史の曖昧さと外部依存_p151
        quote: 「私は外の世界を知るまで、自分たちの歴史さえ曖昧にしか理解できていなかった。失われた祭儀を継承していたのは『塔』だ。古き呪歌を記録していたのは『財団』だ。キュトスの姉妹やディスケイムに頼らなければ、我々はティリビナ文化を守ることさえできない」
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5583_ロードデンドロン_thinks_正しい道への自負と棘_p169
        quote: '現状に対する暗い怒りは、明らかな罪に対する罰だ。

          自分はようやく、正しい道を歩くことができている。

          そのはずなのに。

          ロードデンドロンの心には、深い棘が刺さったまま。'
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5583_ロードデンドロン_confesses_青い血の宿命への絶望_p173
        quote: 「私は生まれながらの裏切り者だ。仕方なく裏切った黒檀の民の血が流れてる姉さんよりもずっと罪深い。ティリビナ人全てに死と苦痛を味わわせた青い血の宿命に打ち勝つために、できることがあるはずなんだ。でも、どうしたらいいのかわからない」
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5583_ロードデンドロン_confesses_絶望_p179
        quote: 「理想ばかりが先走ってしまう。本当にティリビナ人の現状を変えられるのか、勉強をすればするほど、世界の大きさを知れば知るほどわからなくなる。本当は、絶望してるんだ。どうせ世界なんて変わらないんだって」
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5583_ロードデンドロン_remembers_姉の死と父の連行_p184
        quote: 「眠るたびに、悪夢を見るんだ。なぶりものにされて、火をつけて焼き殺された姉の最期を。父が裏切り者として連行されていく姿を。自分の血がどれほど罪深い意味を持つのか知ってしまった日のことを」
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5583_ロードデンドロン_fears_血の宿業_p187
        quote: '自分の血筋と呪縛のような歴史が茨のように彼を責め苛んだ。

          誰にも言えない血の宿業。

          父の失敗と、それを受け継いでいる苦しみ。

          ティリビナ人に対する拭い難い虐殺と迫害の罪があるのに、自分のルーツである世界にもっと近づきたいと思ってしまう矛盾した感情。'
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5583_ロードデンドロン_hopes_四十四士への未練_p191
        quote: 自己嫌悪に苛まれ、遠い日に夢見た四十四士への未練が胸を焦がす。
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5583_ロードデンドロン_asks_エリカへの甘えの理由_p196
        quote: '情けない感情を甘えるように吐露した先が、同性の親友でも死に別れたはずの姉でもなく、異性の親友だったのはどうしてだろうか。

          ロードデンドロンは、いくら考えてもその答えがわからなかった。'
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5583_ロードデンドロン_other_闘争開始と緑天主への道_p229
        quote: 「ああ。私はみんなのために、きっと緑天主になってみせる」
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5583_ロードデンドロン_confesses_復讐の決意_p29
        quote: 「許さない。必ず復讐してやる」
        locator: {}
        spoiler_after: ch0000
      - event_ref: E_ch5583_ロードデンドロン_hates_変わり果てた己_p95
        quote: 自らの選択を恨み、変わり果てた己を呪うことさえあった。
        locator: {}
        spoiler_after: ch0000
    relationship:
      observations:
      - event_ref: E_ch5583_ロードデンドロン_other_中心人物_p182
        quote: 誰よりも傑出したエリカやネペンテスと違い、ロードデンドロンは自分では何もできない。だからこそ積極的に仲間たちに『緑の手紙』を送り続けたし、その繋がりを絶やさぬように連絡をし続けた。彼が白百合の子供たちの中心になっていったのは、単に彼が誰よりも弱く孤独で、ひたすらに寂しがりやだったからだ。
        locator: {}
        spoiler_after: ch0000
    name:
