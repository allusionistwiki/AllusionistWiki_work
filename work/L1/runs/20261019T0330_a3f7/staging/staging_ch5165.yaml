      - event_ref: E_ch5165_アルスタ_says_転ばせる計画_p46
        quote: '「やるしかないっ。フー、アズーリア、援護を頼む！ 転ばせてみる！」

          少年は意を決したように宣言し、恐るべき巨大な機械に正面から立ち向かっていく。'
